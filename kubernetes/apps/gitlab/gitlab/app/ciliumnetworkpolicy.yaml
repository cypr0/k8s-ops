---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gitlab
  namespace: gitlab
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gitlab
  ingress:
    # Envoy proxy pods: the only HTTP entry from the LAN (envoy-internal).
    # Ingress is evaluated post-DNAT, so this is the container port, not the
    # Service port 80.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "8181"
              protocol: TCP
    # Runner manager (API polling) and job pods (git clone via the Service).
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": gitlab-runner
      toPorts:
        - ports:
            - port: "8181"
              protocol: TCP
    # ISMS collector: pushes the evidence snapshot as a commit. Git over
    # HTTP to the Service, because the collector image carries no ssh and the
    # public hostname would route through envoy-internal, which that
    # namespace cannot reach.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": security
            app.kubernetes.io/name: isms-collector
      toPorts:
        - ports:
            - port: "8181"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: gatus
      toPorts:
        - ports:
            - port: "8181"
              protocol: TCP
    # Prometheus: Rails/Puma (:8181 /-/metrics), Workhorse, Sidekiq, Gitaly.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8181"
              protocol: TCP
            - port: "9229"
              protocol: TCP
            - port: "8082"
              protocol: TCP
            - port: "9236"
              protocol: TCP
    # Git over SSH, from the LAN via service-ssh.yaml. Restricted to the client
    # CIDRs rather than `world` for the same reason as mailu's LAN rule: the
    # Service IP is routable from anywhere that can reach 192.168.10.0/24.
    - fromCIDR:
        - "192.168.10.0/24"
        - "192.168.40.0/24"
        - "10.10.0.2/32"
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # CNPG postgres-rw
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": database
            cnpg.io/cluster: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # OIDC discovery/token exchange with Authentik: id.${SECRET_DOMAIN}
    # resolves to envoy-internal.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    # Repository mirroring/imports and webhooks over HTTPS.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
