---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: gitlab-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Loaded by the container via GITLAB_OMNIBUS_CONFIG=from_file(...), see
        # helmrelease.yaml. Rendered here (not in the HelmRelease) because it
        # carries the DB password, the OIDC client secret and the initial root
        # password, which live in 1Password, and mounted as a file rather than
        # passed as env. Values are embedded in single-quoted Ruby strings, so
        # keep the 1Password fields free of quotes and backslashes.
        gitlab.rb: |
          external_url 'https://gitlab.${SECRET_DOMAIN}'
          gitlab_rails['time_zone'] = 'Europe/Berlin'

          # TLS ends at envoy-internal. Workhorse serves HTTP directly, the
          # bundled nginx and Let's Encrypt are not needed.
          nginx['enable'] = false
          letsencrypt['enable'] = false
          gitlab_workhorse['listen_network'] = 'tcp'
          gitlab_workhorse['listen_addr'] = '0.0.0.0:8181'
          # Pod CIDR: the only peer allowed to set X-Forwarded-* (Envoy).
          gitlab_rails['trusted_proxies'] = ['10.42.0.0/16']

          # Git over SSH is a separate LoadBalancer (service-ssh.yaml).
          gitlab_rails['gitlab_ssh_host'] = 'gitlab-ssh.${SECRET_DOMAIN}'
          gitlab_rails['gitlab_shell_ssh_port'] = 22

          # Unprivileged container: sysctl writes would fail the reconfigure.
          package['modify_kernel_parameters'] = false

          # External PostgreSQL: the cluster's CNPG instance, not the bundled one.
          postgresql['enable'] = false
          gitlab_rails['db_adapter'] = 'postgresql'
          gitlab_rails['db_encoding'] = 'unicode'
          gitlab_rails['db_host'] = 'postgres-rw.database.svc.cluster.local'
          gitlab_rails['db_port'] = 5432
          gitlab_rails['db_database'] = 'gitlabdb'
          gitlab_rails['db_username'] = 'gitlabusr'
          gitlab_rails['db_password'] = '{{ .GITLAB_DBPASS }}'

          # Only used while the database has no root user yet. Afterwards the
          # password lives in the database and this line is inert.
          gitlab_rails['initial_root_password'] = '{{ .GITLAB_ROOT_PASSWORD }}'

          gitlab_rails['omniauth_enabled'] = true
          gitlab_rails['omniauth_allow_single_sign_on'] = ['openid_connect']
          gitlab_rails['omniauth_block_auto_created_users'] = false
          # Links the Authentik login to the existing account with the same
          # e-mail, which is how the root account becomes reachable via SSO.
          gitlab_rails['omniauth_auto_link_user'] = ['openid_connect']
          gitlab_rails['omniauth_providers'] = [
            {
              name: 'openid_connect',
              label: 'Authentik',
              args: {
                name: 'openid_connect',
                scope: ['openid', 'profile', 'email'],
                response_type: 'code',
                issuer: 'https://id.${SECRET_DOMAIN}/application/o/gitlab/',
                discovery: true,
                client_auth_method: 'query',
                uid_field: 'sub',
                send_scope_to_token_endpoint: true,
                pkce: true,
                client_options: {
                  identifier: '{{ .GITLAB_OIDC_CLIENT_ID }}',
                  secret: '{{ .GITLAB_OIDC_CLIENT_SECRET }}',
                  redirect_uri: 'https://gitlab.${SECRET_DOMAIN}/users/auth/openid_connect/callback'
                }
              }
            }
          ]

          # Single-user sizing, after docs.gitlab.com/omnibus/settings/memory_constrained_envs
          puma['worker_processes'] = 0
          sidekiq['max_concurrency'] = 10
          # The bundled Prometheus and its exporters are off; the cluster's own
          # Prometheus scrapes the component endpoints via podmonitor.yaml. The
          # whitelist is matched against the client IP as Rails resolves it
          # (X-Forwarded-For through the trusted Envoy), so /-/metrics answers
          # in-cluster scrapers only, not LAN clients going through the route.
          prometheus_monitoring['enable'] = false
          gitlab_rails['monitoring_whitelist'] = ['127.0.0.0/8', '::1/128', '10.42.0.0/16']
          gitlab_workhorse['prometheus_listen_addr'] = '0.0.0.0:9229'
          sidekiq['listen_address'] = '0.0.0.0'
          gitaly['configuration'] = {
            prometheus_listen_addr: '0.0.0.0:9236'
          }
          gitlab_kas['enable'] = false
          gitlab_rails['usage_ping_enabled'] = false
          gitlab_rails['gravatar_enabled'] = false
          gitlab_rails['gitlab_email_enabled'] = false
          gitaly['env'] = {
            'LD_PRELOAD' => '/opt/gitlab/embedded/lib/libjemalloc.so',
            'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000',
            'GITALY_COMMAND_SPAWN_MAX_PARALLEL' => '2'
          }
          gitlab_rails['env'] = {
            'MALLOC_CONF' => 'dirty_decay_ms:1000,muzzy_decay_ms:1000'
          }
  dataFrom:
    - extract:
        key: gitlab
