---
# Allow dragonfly access from all cluster pods (port 6379)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dragonfly
  namespace: database
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: dragonfly
  ingress:
    # Allow redis/dragonfly access from any pod in the cluster
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # Admin port, scraped by Prometheus for the 238 dragonfly_* metrics. Kept
    # separate from the blanket 6379 rule above on purpose -- the admin port
    # also serves control commands and should not be reachable cluster-wide.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
  egress:
    - toEntities:
        - cluster
