---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dragonfly-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: dragonfly-operator
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Unter manager, nicht auf oberster values-Ebene: das Chart liest
    # .Values.manager.resources und .Values.rbacProxy.resources. Auf der
    # obersten Ebene landeten die Werte nirgends -- der manager-Container
    # lief mit resources: {} und damit ohne Limit, waehrend der
    # kube-rbac-proxy die Chart-Vorgaben bekam. Gefunden durch den
    # ISMS-Check container_memory_limits (KONF.9.1).
    manager:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          # Istverbrauch 43-98Mi.
          memory: 256Mi
