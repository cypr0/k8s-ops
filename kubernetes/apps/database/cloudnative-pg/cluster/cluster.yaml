---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4@sha256:2b124b4c9e9710a449b868fc72ae59bcb2907386d48ddb3e7a7f82491ac0d1e1

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg-superuser

  primaryUpdateStrategy: unsupervised

  storage:
    size: 20Gi
    storageClass: zfs-nfs

  walStorage:
    size: 5Gi
    storageClass: zfs-nfs

  postgresql:
    parameters:
      # Memory — tuned for 2Gi container limit
      shared_buffers: "512MB"
      effective_cache_size: "1536MB"
      work_mem: "32MB"
      maintenance_work_mem: "128MB"
      # WAL
      wal_level: "logical"
      max_wal_size: "2GB"
      min_wal_size: "512MB"
      checkpoint_completion_target: "0.9"
      # Connections
      max_connections: "200"
      max_replication_slots: "10"
      # Storage (ZFS via NFS behaves closer to SSD for sequential reads)
      random_page_cost: "1.1"

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          cnpg.io/cluster: postgres

  managed:
    roles:
      - name: authentikusr
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        passwordSecret:
          name: authentik-db-role
      - name: paperlessusr
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        passwordSecret:
          name: paperless-db-role
      - name: openwebuiusr
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        passwordSecret:
          name: open-webui-db-role
      - name: nextcloudusr
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        passwordSecret:
          name: nextcloud-db-role

  # tradingusr/tradingreadonly (Hermes trading bot, since deprovisioned -- see
  # kubernetes/apps/hermes-agent/hermes-agent/app/kustomization.yaml) were
  # removed from managed.roles above on 2026-08-12. Removing a role from that
  # list only makes CNPG stop MANAGING it -- it does NOT drop the role or its
  # data (that needs `ensure: absent`, not just deletion from the list) -- so
  # the "trading" database/roles/data are still live in Postgres, just
  # unmanaged by IaC now, in case they're still useful later.
  monitoring:
    enablePodMonitor: true

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backup
