---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 3
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6@sha256:6d207b34e2859e55ee7653d57321ef28c86d9c4b42e9e66609756565f0cc5542

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg-superuser

  primaryUpdateStrategy: unsupervised

  storage:
    size: 20Gi
    storageClass: zfs-nfs

  walStorage:
    size: 5Gi
    storageClass: zfs-nfs

  postgresql:
    parameters:
      # Memory — tuned for 2Gi container limit
      shared_buffers: "512MB"
      effective_cache_size: "1536MB"
      work_mem: "32MB"
      maintenance_work_mem: "128MB"
      # WAL
      wal_level: "logical"
      max_wal_size: "2GB"
      min_wal_size: "512MB"
      checkpoint_completion_target: "0.9"
      # Connections
      max_connections: "200"
      max_replication_slots: "10"
      # Storage (ZFS via NFS behaves closer to SSD for sequential reads)
      random_page_cost: "1.1"
      # VectorChord (vchord.so) extension-image REVERTED 2026-08-16: the
      # repackaged ghcr.io/cypr0/cnpg-vchord-extension:pg18-v1.1.1 binary
      # requires GLIBC_2.33+, but this cluster's postgresql:18.6 image is
      # Debian 11 Bullseye (glibc 2.31) - confirmed live via
      # "could not load library ... GLIBC_2.33' not found" crash-looping both
      # replicas before the rolling restart ever reached the primary. See
      # docs/incidents/ for the writeup and the actual fix path (either switch
      # this cluster to a newer Debian-based image tag, or fall back to a
      # dedicated cluster using tensorchord's all-in-one bundled image, which
      # has no cross-image glibc mismatch since postgres+vchord are compiled
      # together).

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          cnpg.io/cluster: postgres

  managed:
    roles:
      - name: authentikusr
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        passwordSecret:
          name: authentik-db-role
      - name: paperlessusr
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        passwordSecret:
          name: paperless-db-role
      - name: openwebuiusr
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        passwordSecret:
          name: open-webui-db-role
      - name: nextcloudusr
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        passwordSecret:
          name: nextcloud-db-role
      - name: firecrawlusr
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        passwordSecret:
          name: firecrawl-db-role
      - name: portfoliousr
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        passwordSecret:
          name: portfolio-db-role
      - name: immichusr
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        passwordSecret:
          name: immich-db-role

  # tradingusr/tradingreadonly (Hermes trading bot, since deprovisioned -- see
  # kubernetes/apps/hermes-agent/hermes-agent/app/kustomization.yaml) were
  # removed from managed.roles above on 2026-08-12, and the "trading"
  # database + both roles were fully DROPPED the same day (not just
  # unmanaged) -- nothing left to clean up if this ever comes up again.
  monitoring:
    enablePodMonitor: true

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres-backup
