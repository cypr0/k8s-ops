---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/database_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich
spec:
  name: immichdb
  owner: immichusr
  cluster:
    name: postgres
  # Immich supports two vector backends (DB_VECTOR_EXTENSION: "vectorchord" or
  # "pgvector" - docs.immich.app/install/environment-variables). Uses plain
  # pgvector deliberately: VectorChord needed a repackaged extension image
  # that turned out to be GLIBC-incompatible with this cluster's Postgres
  # image (see docs/incidents/2026-08-16-immich-vectorchord-glibc-mismatch.md)
  # - pgvector is already bundled directly in this cluster's own
  # postgresql:18.6 image, same as Open WebUI's RAG database, no extension
  # image or cross-image compatibility risk at all.
  extensions:
    - name: vector
    - name: cube
    - name: earthdistance
