---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-db-role
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gitlab-db-role
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: gitlabusr
        password: "{{ .GITLAB_DBPASS }}"
  dataFrom:
    - extract:
        key: gitlab
