---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-db-role
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: immich-db-role
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: immichusr
        password: "{{ .IMMICH_POSTGRESQL_PASSWORD }}"
  dataFrom:
    - extract:
        key: immich
