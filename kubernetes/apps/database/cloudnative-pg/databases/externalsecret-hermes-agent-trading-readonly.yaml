---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: trading-readonly-db-role
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: trading-readonly-db-role
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # CNPG managed roles require both username and password keys
        username: tradingreadonly
        password: "{{ .TRADING_READONLY_PASSWORD }}"
  dataFrom:
    - extract:
        key: hermes-agent-trading
