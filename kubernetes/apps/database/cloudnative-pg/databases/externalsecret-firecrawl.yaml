---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firecrawl-db-role
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: firecrawl-db-role
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # CNPG managed roles require both username and password keys
        username: firecrawlusr
        password: "{{ .FIRECRAWL_POSTGRESQL_PASSWORD }}"
  dataFrom:
    - extract:
        key: firecrawl
