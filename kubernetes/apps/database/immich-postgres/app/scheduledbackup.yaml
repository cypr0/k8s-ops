---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-postgres-daily
spec:
  # 02:45 nightly (cron-with-seconds: sec min hour day month weekday) - offset
  # from the shared cluster's 02:30 backup so they don't contend for the same
  # barman-cloud ObjectStore/S3 endpoint at the exact same moment.
  schedule: "0 45 2 * * *"
  cluster:
    name: immich-postgres
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
    parameters:
      barmanObjectName: postgres-backup
  backupOwnerReference: cluster
  immediate: true
