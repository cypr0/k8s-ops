---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plugin-barman-cloud
  namespace: &namespace database
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-stores
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/database/plugin-barman-cloud/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: true
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: plugin-barman-cloud-objectstore
  namespace: &namespace2 database
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: plugin-barman-cloud-objectstore
  dependsOn:
    # Needs the ExternalSecret from the "app" stage (intercolo-credentials) to
    # exist before postBuild variable substitution below can resolve.
    - name: plugin-barman-cloud
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/database/plugin-barman-cloud/objectstore
  postBuild:
    substituteFrom:
      - kind: Secret
        name: intercolo-credentials
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace2
  timeout: 5m
  wait: true
