---
# S3 credentials for CNPG Barman Cloud backups (Intercolo).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: intercolo-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: intercolo-credentials
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: intercolo
