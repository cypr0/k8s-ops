---
# S3 credentials for CNPG Barman Cloud backups (Intercolo).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: intercolo-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: intercolo-credentials
    creationPolicy: Owner
  # Explicit keys only — the "intercolo" 1Password item is a Login item with
  # extra fields (email, one-time_password, ...) whose names aren't valid
  # envsubst variable names and break postBuild.substituteFrom if extracted.
  data:
    - secretKey: S3_API_KEY
      remoteRef:
        key: intercolo
        property: S3_API_KEY
    - secretKey: S3_API_SECRET
      remoteRef:
        key: intercolo
        property: S3_API_SECRET
    - secretKey: S3_ENDPOINT
      remoteRef:
        key: intercolo
        property: S3_ENDPOINT
    - secretKey: S3_REGION
      remoteRef:
        key: intercolo
        property: S3_REGION
