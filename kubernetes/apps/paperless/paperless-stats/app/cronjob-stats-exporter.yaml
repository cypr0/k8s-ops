---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: paperless-stats-exporter
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: paperless-stats-exporter
        spec:
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          containers:
            - name: exporter
              image: python:3.14-alpine
              command:
                - "python3"
                - "/scripts/export_stats.py"
              env:
                - name: OPENSEARCH_HOST
                  value: "https://opensearch.logging.svc.cluster.local:9200"
                - name: OPENSEARCH_USER
                  value: "admin"
                - name: OPENSEARCH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: opensearch-write-credentials
                      key: OPENSEARCH_PASSWORD
                - name: PAPERLESS_HOST
                  value: "http://paperless.paperless.svc.cluster.local:80"
                - name: PAPERLESS_USER
                  valueFrom:
                    secretKeyRef:
                      name: paperless-secret
                      key: PAPERLESS_ADMIN_USER
                - name: PAPERLESS_PASS
                  valueFrom:
                    secretKeyRef:
                      name: paperless-secret
                      key: PAPERLESS_ADMIN_PASSWORD
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop:
                    - "ALL"
          volumes:
            - name: scripts
              configMap:
                name: paperless-stats-exporter-script
                defaultMode: 0755
