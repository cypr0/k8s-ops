---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paperless
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      main:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: "paperless-secret"
        containers:
          paperless-ngx:
            image:
              repository: ghcr.io/paperless-ngx/paperless-ngx
              # renovate: datasource=docker depName=ghcr.io/paperless-ngx/paperless-ngx
              tag: 3.0.5
            env:
              PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
              # Native AI (3.0+). Was trialled alongside paperless-ai for
              # comparison; paperless-ai has since been decommissioned in
              # favor of this. Suggestion-based (title/date/tags/
              # correspondent/type) -- does NOT cover custom fields and does
              # NOT auto-apply without review, unlike paperless-ai's old
              # unattended pipeline (accepted trade-off). Same OpenRouter
              # model/key paperless-ai used to use; PAPERLESS_AI_LLM_API_KEY
              # comes from externalsecret.yaml (envFrom: paperless-secret
              # below).
              # NOTE: the "KI-Einstellungen" admin GUI page will keep showing
              # this as disabled/blank regardless -- confirmed in paperless's
              # own source (src/paperless/config.py AIConfig): the GUI reads
              # the database-backed override column directly, e.g.
              # `self.ai_enabled = app_config.ai_enabled or settings.AI_ENABLED`,
              # and only ever DISPLAYS app_config.ai_enabled (always False
              # until someone flips the GUI toggle themselves), never the
              # resolved effective value. The env var is genuinely applied
              # (confirmed live: `settings.AI_ENABLED` reads this correctly)
              # -- this is a paperless-ngx GUI limitation, not a sign the
              # config isn't working.
              PAPERLESS_AI_ENABLED: "true"
              PAPERLESS_AI_LLM_BACKEND: openai-like
              PAPERLESS_AI_LLM_ENDPOINT: https://openrouter.ai/api/v1
              PAPERLESS_AI_LLM_MODEL: google/gemini-2.5-flash-lite
              PAPERLESS_AI_LLM_OUTPUT_LANGUAGE: de
              # Document chat (RAG) is a SEPARATE feature from suggestions
              # and needs its own embedding backend -- without this, chat
              # fails with a raw connection error (confirmed live: "upstream
              # connect error ... remote connection failure" in the chat UI)
              # since there's nowhere configured to generate embeddings at
              # all. OpenRouter's embeddings-endpoint support is undocumented
              # for paperless-ngx, so using the local "huggingface" backend
              # instead -- runs in-process (sentence-transformers), no
              # external API dependency or extra egress rule needed.
              PAPERLESS_AI_LLM_EMBEDDING_BACKEND: huggingface
              PAPERLESS_AI_LLM_EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
              PAPERLESS_CONSUMER_POLLING: 60
              PAPERLESS_CONSUMER_RECURSIVE: "true"
              PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
              PAPERLESS_CONSUMPTION_DIR: /consume
              PAPERLESS_DATA_DIR: /library/data
              PAPERLESS_DISABLE_REGULAR_LOGIN: "true"
              PAPERLESS_EXPORT_DIR: /library/export
              PAPERLESS_LOGOUT_REDIRECT_URL: https://id.${SECRET_DOMAIN}/application/o/paperless-ngx/end-session/
              PAPERLESS_MEDIA_ROOT: /library/media
              # Tuned for a Brother ADS-4700W (duplex ADF business document
              # scanner, not a photo/book scanner) -- source input is already
              # fairly clean and mostly pre-aligned by the ADF's own hardware,
              # but these are cheap safety nets, not aggressive corrections.
              # Values match paperless-ngx's own documented defaults
              # (docs/configuration.md) -- set explicitly here (rather than
              # left implicit) so the intended behaviour is version-controlled
              # and won't silently change if a future paperless-ngx release
              # changes its defaults. Same GUI caveat as PAPERLESS_AI_ENABLED
              # above applies here too (src/paperless/config.py OcrConfig) --
              # the "OCR-Einstellungen" admin page will keep showing blank
              # fields even though these are genuinely in effect.
              PAPERLESS_OCR_LANGUAGE: deu+eng+spa
              # auto: skip re-OCR only if the file already has a real text
              # layer (irrelevant for this scanner's plain image-PDF output,
              # but harmless and correct if that ever changes).
              PAPERLESS_OCR_MODE: auto
              PAPERLESS_OCR_OUTPUT_TYPE: pdfa
              # unpaper cleanup for OCR accuracy only -- "clean", not
              # "clean-final", so the archived visual copy stays an exact
              # match of the physical original (relevant for tax/legal docs).
              PAPERLESS_OCR_CLEAN: clean
              PAPERLESS_OCR_DESKEW: "true"
              PAPERLESS_OCR_ROTATE_PAGES: "true"
              PAPERLESS_OCR_ROTATE_PAGES_THRESHOLD: "12"
              # Fallback DPI only, used when a scan's own file metadata
              # doesn't specify one -- matches this scanner's typical
              # scan-to-folder text-document resolution.
              PAPERLESS_OCR_IMAGE_DPI: "300"
              # Lossless PDF size optimization (ocrmypdf/qpdf) -- meaningful
              # storage savings over years of accumulated scans, no quality
              # impact at level 1.
              PAPERLESS_OCR_USER_ARGS: '{"optimize": 1}'
              PAPERLESS_PORT: &port 80
              # PAPERLESS_SOCIALACCOUNT_PROVIDERS is built in externalsecret.yaml
              # (client_id/secret come from 1Password) and injected via
              # envFrom: secretRef: paperless-secret below.
              # false: locally-managed groups (e.g. "Standard User") aren't
              # in Authentik's OIDC groups claim, so syncing would wipe them
              # on every login - group membership is managed in Paperless.
              PAPERLESS_SOCIAL_ACCOUNT_SYNC_GROUPS: "false"
              PAPERLESS_TASK_WORKERS: 2
              PAPERLESS_TIKA_ENABLED: 1
              PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg-http.paperless.svc.cluster.local:3000
              PAPERLESS_TIKA_ENDPOINT: http://tika-http.paperless.svc.cluster.local:9998
              # No TIMEZONE key exists in cluster-secrets (checked: only
              # SECRET_ALLOWED_IP/SECRET_DOMAIN/SECRET_MAIL_SERVER/
              # SECRET_NFS_SERVER) -- ${TIMEZONE} here failed Flux's postBuild
              # substitution in strict mode, blocking this Kustomization
              # entirely. Every other app in this repo hardcodes TZ literally
              # (open-webui, open-terminal, gatus, openclaw all use
              # Europe/Berlin); match that instead of inventing a shared var.
              PAPERLESS_TIME_ZONE: Europe/Berlin
              PAPERLESS_TRUSTED_PROXIES: 10.96.0.0/16,10.69.0.0/16,192.168.0.0/16
              PAPERLESS_URL: https://paperless.${SECRET_DOMAIN}
              USERMAP_UID: 3000
              USERMAP_GID: 3000
            envFrom:
              - secretRef:
                  name: paperless-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 5

    service:
      paperless:
        controller: main
        ports:
          http:
            port: *port

    persistence:
      library:
        existingClaim: paperless-data-pvc
        advancedMounts:
          main:
            paperless-ngx:
              - path: /library
      consume:
        existingClaim: paperless-consume-pvc
        advancedMounts:
          main:
            paperless-ngx:
              - path: /consume
