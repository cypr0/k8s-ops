---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: zfs-nfs
  resources:
    requests:
      storage: 200Gi
---
# Static PV — fixed path so external devices (scanner, etc.) can write to a known NFS share
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-consume-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: paperless-consume-nfs
  mountOptions:
    - nfsvers=4.2
    - hard
  nfs:
    server: ${SECRET_NFS_SERVER}
    path: /rpool/k8s-rwx/paperless-consume
    readOnly: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-consume-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: paperless-consume-nfs
  volumeName: paperless-consume-pv
  resources:
    requests:
      storage: 50Gi
