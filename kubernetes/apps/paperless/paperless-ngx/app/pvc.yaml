---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-data-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: zfs-nfs
  resources:
    requests:
      storage: 200Gi
---
# Static PV — fixed path so external devices (scanner, etc.) can write to a known NFS share
apiVersion: v1
kind: PersistentVolume
metadata:
  name: paperless-consume-pv
spec:
  capacity:
    storage: 50Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: paperless-consume-nfs
  mountOptions:
    - nfsvers=4.2
    - hard
  nfs:
    server: ${SECRET_NFS_SERVER}
    path: /rpool/k8s-rwx/paperless-consume
    readOnly: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paperless-consume-pvc
  labels:
    # Statically bound to a fixed PV via claimRef — Velero can restore the
    # PVC object into a different namespace, but it can never bind there
    # (the PV's claimRef still points at the original namespace/name), so
    # any restore involving this PVC hangs forever waiting to bind. It's
    # also just a transient scan-inbox with no data worth backing up.
    velero.io/exclude-from-backup: "true"
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: paperless-consume-nfs
  volumeName: paperless-consume-pv
  resources:
    requests:
      storage: 50Gi
