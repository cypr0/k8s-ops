---
# paperless-ngx: document management system
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperless-ngx
  namespace: paperless
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: paperless
  ingress:
    # Envoy proxy pods (network namespace) - main traffic entry point
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Prometheus metrics scraping from monitoring namespace
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: prometheus
    # paperless-stats-exporter reads statistics/status/tasks (same namespace)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": paperless
            app.kubernetes.io/name: paperless-stats-exporter
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # openclaw's paperless-mcp sidecar reads the REST API
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": openclaw
            app.kubernetes.io/name: openclaw
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Open WebUI's paperless_full Tool (kubernetes/apps/open-webui/open-webui/
    # app/tools/paperless_full.py) reads/writes the REST API
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": open-webui
            app.kubernetes.io/name: open-webui
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Gatus health check
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: gatus
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # paperless-mcp: standalone MCP server exposing this API to hermes-agent
    # (kubernetes/apps/hermes-agent/paperless-mcp/)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": hermes-agent
            app.kubernetes.io/name: paperless-mcp
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
  egress:
    # DNS resolution (matchPattern required so Cilium learns resolved IPs
    # for the toFQDNs rule below - see velero/opensearch policies for same pattern)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Database access (PostgreSQL and Redis/Dragonfly in database namespace)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "6379"
              protocol: TCP
    # Tika service (same namespace)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": paperless
            app.kubernetes.io/name: tika
      toPorts:
        - ports:
            - port: "9998"
              protocol: TCP
    # Gotenberg service (same namespace)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": paperless
            app.kubernetes.io/name: gotenberg
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Authentik OIDC (security namespace)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": security
            app.kubernetes.io/name: authentik
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
            - port: "9443"
              protocol: TCP
    # Authentik via id.cisotop.de: CoreDNS resolves the hostname to the
    # envoy-internal ClusterIP, which is DNAT'd to the envoy container port
    # 10443. The OIDC discovery/token calls (server_url = https://id.cisotop.de)
    # take this path, NOT the direct authentik rule above. Policy is enforced
    # post-DNAT, so allow the container port 10443.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    # IMAP mail-fetch integration, now against the in-cluster Mailu instance
    # (kubernetes/apps/mail/mailu/) instead of the old external Netcup
    # mailbox this rule used to point at via toFQDNs. The mail account's
    # server field is mail.${SECRET_DOMAIN} -- CoreDNS's static hosts
    # override (kubernetes/apps/kube-system/coredns/app/helmrelease.yaml)
    # resolves that in-cluster straight to mailu-front's ClusterIP rather
    # than the public IP (avoids NAT-hairpinning back in through
    # Proxmox/OPNsense, confirmed live that path times out), so this is a
    # same-cluster call and a toEndpoints rule -- not toFQDNs -- is the
    # correct policy shape.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": mail
            app.kubernetes.io/name: mailu
            app.kubernetes.io/component: front
      toPorts:
        - ports:
            - port: "993"
              protocol: TCP
    # OpenRouter LLM API for native AI (PAPERLESS_AI_*, helmrelease.yaml)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # hermes-agent's webhook platform: the Workflow "Webhook" action
    # (Trigger: Document Added) notifies the agent about newly-consumed
    # documents so it can extract structured data -- see
    # kubernetes/apps/hermes-agent/hermes-agent/.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": hermes-agent
            app.kubernetes.io/name: hermes-agent
      toPorts:
        - ports:
            - port: "8644"
              protocol: TCP
---
# tika: document text extraction service
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tika
  namespace: paperless
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tika
  ingress:
    # paperless-ngx access
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": paperless
            app.kubernetes.io/name: paperless
      toPorts:
        - ports:
            - port: "9998"
              protocol: TCP
    # Gatus health check
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: gatus
      toPorts:
        - ports:
            - port: "9998"
              protocol: TCP
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# gotenberg: document conversion service
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gotenberg
  namespace: paperless
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gotenberg
  ingress:
    # paperless-ngx access
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": paperless
            app.kubernetes.io/name: paperless
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Gatus health check
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: gatus
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
