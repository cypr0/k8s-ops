---
# paperless-ngx: document management system
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperless-ngx
  namespace: paperless
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: paperless
  ingress:
    # Envoy proxy pods (network namespace) - main traffic entry point
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Prometheus metrics scraping from monitoring namespace
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: prometheus
    # paperless-stats-exporter reads statistics/status/tasks (same namespace)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": paperless
            app.kubernetes.io/name: paperless-stats-exporter
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # openclaw's paperless-mcp sidecar reads the REST API
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": openclaw
            app.kubernetes.io/name: openclaw
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Open WebUI's paperless_full Tool (kubernetes/apps/open-webui/open-webui/
    # app/tools/paperless_full.py) reads/writes the REST API
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": open-webui
            app.kubernetes.io/name: open-webui
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Gatus health check
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: gatus
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
  egress:
    # DNS resolution (matchPattern required so Cilium learns resolved IPs
    # for the toFQDNs rule below - see velero/opensearch policies for same pattern)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Database access (PostgreSQL and Redis/Dragonfly in database namespace)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "6379"
              protocol: TCP
    # Tika service (same namespace)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": paperless
            app.kubernetes.io/name: tika
      toPorts:
        - ports:
            - port: "9998"
              protocol: TCP
    # Gotenberg service (same namespace)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": paperless
            app.kubernetes.io/name: gotenberg
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Authentik OIDC (security namespace)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": security
            app.kubernetes.io/name: authentik
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
            - port: "9443"
              protocol: TCP
    # Authentik via id.cisotop.de: CoreDNS resolves the hostname to the
    # envoy-internal ClusterIP, which is DNAT'd to the envoy container port
    # 10443. The OIDC discovery/token calls (server_url = https://id.cisotop.de)
    # take this path, NOT the direct authentik rule above. Policy is enforced
    # post-DNAT, so allow the container port 10443.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    # External IMAP mail server for mail-fetch integration. ndots:5 in the
    # pod's resolv.conf makes the resolver try the namespace-suffixed search
    # domain before the absolute name, so Cilium learns the IP under that
    # suffixed FQDN - allowlist both forms.
    - toFQDNs:
        - matchName: "${SECRET_PAPERLESS_IMAP_SERVER}"
        - matchName: "${SECRET_PAPERLESS_IMAP_SERVER}.paperless.svc.cluster.local"
      toPorts:
        - ports:
            - port: "993"
              protocol: TCP
    # OpenRouter LLM API for native AI (PAPERLESS_AI_*, helmrelease.yaml)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# tika: document text extraction service
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tika
  namespace: paperless
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tika
  ingress:
    # paperless-ngx access
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": paperless
            app.kubernetes.io/name: paperless
      toPorts:
        - ports:
            - port: "9998"
              protocol: TCP
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# gotenberg: document conversion service
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gotenberg
  namespace: paperless
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gotenberg
  ingress:
    # paperless-ngx access
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": paperless
            app.kubernetes.io/name: paperless
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
