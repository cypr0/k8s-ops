---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: paperless-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PAPERLESS_DBENGINE: postgresql
        PAPERLESS_DBPORT: "5432"
        PAPERLESS_DBNAME: "{{ .PAPERLESS_DBNAME }}"
        PAPERLESS_DBHOST: postgres-rw.database.svc.cluster.local
        PAPERLESS_DBUSER: "{{ .PAPERLESS_DBUSER }}"
        PAPERLESS_DBPASS: "{{ .PAPERLESS_DBPASS }}"
        PAPERLESS_ADMIN_USER: "{{ .PAPERLESS_ADMIN_USER }}"
        PAPERLESS_ADMIN_PASSWORD: "{{ .PAPERLESS_ADMIN_PASSWORD }}"
        PAPERLESS_SECRET_KEY: "{{ .PAPERLESS_SECRET_KEY }}"
        PAPERLESS_API_TOKEN: "{{ .PAPERLESS_API_TOKEN }}"
        PAPERLESS_USERNAME: "{{ .PAPERLESS_API_USER }}"
        PAPERLESS_REDIS: "redis://:{{ .DRAGONFLY_PASSWORD }}@dragonfly.database.svc.cluster.local:6379"
        CUSTOM_API_KEY: "{{ .OPENROUTER_PAPERLESSAI_API_KEY }}"
        # Built here (not in the HelmRelease) because the OIDC client_id/secret
        # live in 1Password, not in the cluster-secrets Flux substitution source.
        # Injected via envFrom: secretRef: paperless-secret.
        PAPERLESS_SOCIALACCOUNT_PROVIDERS: |
          {
            "openid_connect": {
              "APPS": [
                {
                  "provider_id": "authentik",
                  "name": "Authentik",
                  "client_id": "{{ .PAPERLESS_OPENID_CLIENT_ID }}",
                  "secret": "{{ .PAPERLESS_OPENID_CLIENT_SECRET }}",
                  "settings": {
                    "server_url": "https://id.${SECRET_DOMAIN}/application/o/paperless-ngx/.well-known/openid-configuration"
                  }
                }
              ],
              "OAUTH_PKCE_ENABLED": "True",
              "SCOPE": ["openid", "profile", "email", "groups"]
            }
          }
  dataFrom:
    - extract:
        key: paperless
    - extract:
        key: openrouter
    - extract:
        key: dragonfly
