---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gotenberg
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      gotenberg:
        replicas: 1
        strategy: RollingUpdate
        containers:
          gotenberg:
            image:
              repository: docker.io/gotenberg/gotenberg
              # renovate: datasource=docker depName=docker.io/gotenberg/gotenberg
              tag: 8.34.0
            command:
              - gotenberg
              - "--chromium-disable-javascript=true"
              - "--chromium-allow-list=file:///tmp/.*"
              - "--api-port=3000"
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 1Gi
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
              runAsUser: 3000
              runAsGroup: 3000
              runAsNonRoot: true

    service:
      http:
        controller: gotenberg
        ports:
          http:
            port: 3000

    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          gotenberg:
            gotenberg:
              - path: /tmp
