---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tika
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  values:
    controllers:
      tika:
        replicas: 1
        strategy: RollingUpdate
        containers:
          tika:
            image:
              repository: apache/tika
              # renovate: datasource=docker depName=apache/tika
              tag: 3.2.3.0-full
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
              runAsUser: 3000
              runAsGroup: 3000
              runAsNonRoot: true

    service:
      http:
        controller: tika
        ports:
          http:
            port: 9998

    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          tika:
            tika:
              - path: /tmp
