---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-exporter
  labels:
    app.kubernetes.io/name: paperless-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # Plain alpine + its own python3, never a python:*-alpine image: those
          # ship a second CPython under /usr/local that collides with anything
          # installed via apk. That exact collision broke proxmox-ansible (see
          # kubernetes/apps/automation/proxmox-ansible/app/cronjob.yaml).
          image: alpine:3.24.2
          command:
            - "/bin/sh"
            - "-c"
          args:
            - apk add --no-cache python3 >/dev/null && exec python3 /scripts/exporter.py
          ports:
            - name: metrics
              containerPort: 9877
              protocol: TCP
          env:
            - name: PAPERLESS_HOST
              value: "http://paperless.paperless.svc.cluster.local:80"
            - name: PAPERLESS_USER
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: PAPERLESS_ADMIN_USER
            - name: PAPERLESS_PASS
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: PAPERLESS_ADMIN_PASSWORD
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            # apk needs to write into the image's own filesystem at startup.
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - "ALL"
      volumes:
        - name: scripts
          configMap:
            name: paperless-exporter
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-exporter
  labels:
    app.kubernetes.io/name: paperless-exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paperless-exporter
  ports:
    - name: metrics
      port: 9877
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: paperless-exporter
  labels:
    app.kubernetes.io/name: paperless-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-exporter
  endpoints:
    # Every scrape triggers two live API calls against Paperless, so this is
    # deliberately slow. None of these values move on a shorter timescale.
    - port: metrics
      interval: 5m
      scrapeTimeout: 30s
