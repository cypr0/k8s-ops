---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-exporter
  labels:
    app.kubernetes.io/name: paperless-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-exporter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # python:*-alpine is fine HERE because nothing is installed on top
          # of it. The rule it looks like it breaks -- never mix this image with
          # apk -- is about installing a SECOND CPython alongside the image's
          # own, which is what broke proxmox-ansible (see
          # kubernetes/apps/automation/proxmox-ansible/app/cronjob.yaml).
          # The script is stdlib-only, so there is nothing to install: the
          # container runs as nobody with a read-only root filesystem, which the
          # earlier "alpine + apk add" version could not do (apk needs root).
          # renovate: datasource=docker depName=python
          image: python:3.13-alpine
          command:
            - "python3"
            - "/scripts/exporter.py"
          ports:
            - name: metrics
              containerPort: 9877
              protocol: TCP
          env:
            - name: PAPERLESS_HOST
              value: "http://paperless.paperless.svc.cluster.local:80"
            - name: PAPERLESS_USER
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: PAPERLESS_ADMIN_USER
            - name: PAPERLESS_PASS
              valueFrom:
                secretKeyRef:
                  name: paperless-secret
                  key: PAPERLESS_ADMIN_PASSWORD
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
          # /healthz, never /metrics: a scrape makes two live API calls that
          # can take up to 20s, while the kubelet's default probe timeout is 1s.
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
      volumes:
        - name: scripts
          configMap:
            name: paperless-exporter
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: paperless-exporter
  labels:
    app.kubernetes.io/name: paperless-exporter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: paperless-exporter
  ports:
    - name: metrics
      port: 9877
      targetPort: metrics
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: paperless-exporter
  labels:
    app.kubernetes.io/name: paperless-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-exporter
  endpoints:
    # Every scrape triggers two live API calls against Paperless, so this is
    # deliberately slow. None of these values move on a shorter timescale.
    - port: metrics
      interval: 5m
      scrapeTimeout: 30s
