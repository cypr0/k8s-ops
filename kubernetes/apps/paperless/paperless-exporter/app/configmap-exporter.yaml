---
# Prometheus exporter for Paperless-ngx.
#
# Paperless serves no /metrics of its own -- GET /metrics returns a 302 to the
# login page -- but it does expose /api/statistics/ and /api/status/, which is
# what this reads. That is the same pair the OpenSearch stats CronJob used
# before it was removed on 2026-09-20; this replaces it with a pull-based
# endpoint so the data lands in Prometheus instead of a second datastore.
#
# Deliberately stdlib-only: no prometheus_client, no pip install at runtime, so
# the image is a stock python:*-alpine with nothing added and there is no
# dependency to keep current. The exposition format is simple enough to emit by
# hand. Because nothing is installed, the container runs as nobody with a
# read-only root filesystem.
apiVersion: v1
kind: ConfigMap
metadata:
  name: paperless-exporter
data:
  exporter.py: |-
    #!/usr/bin/env python3
    """Scrape-time proxy: Paperless REST API -> Prometheus text format."""
    import base64
    import json
    import os
    import urllib.error
    import urllib.request
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    HOST = os.environ["PAPERLESS_HOST"].rstrip("/")
    AUTH = base64.b64encode(
        f"{os.environ['PAPERLESS_USER']}:{os.environ['PAPERLESS_PASS']}".encode()
    ).decode()
    TIMEOUT = float(os.environ.get("TIMEOUT_SECONDS", "10"))
    # Two live API calls per scrape are slow and hit Paperless directly. Serving
    # a cached body for this long keeps a burst of scrapes -- or a second
    # Prometheus -- from turning into load on the app itself.
    CACHE_TTL = float(os.environ.get("CACHE_TTL_SECONDS", "60"))

    _cache = {"body": None, "at": 0.0}
    _cache_lock = threading.Lock()

    # Paperless reports these as free-text words, not numbers. Mapped to a
    # gauge so they can be alerted on; anything unrecognised becomes -1 rather
    # than silently reading as healthy.
    STATUS_VALUES = {"OK": 1, "HEALTHY": 1, "WARNING": 0, "ERROR": -1}

    def api(path):
        req = urllib.request.Request(HOST + path, headers={"Authorization": f"Basic {AUTH}"})
        with urllib.request.urlopen(req, timeout=TIMEOUT) as r:
            return json.loads(r.read())

    def collect():
        out = []

        def emit(name, value, help_text, kind="gauge", labels=""):
            # A None from the API means "not applicable" (e.g. documents_inbox
            # with no inbox tag configured). Skipping the sample entirely is
            # correct here -- emitting 0 would be indistinguishable from a real
            # empty inbox.
            if value is None:
                return
            out.append(f"# HELP {name} {help_text}")
            out.append(f"# TYPE {name} {kind}")
            out.append(f"{name}{labels} {value}")

        try:
            stats = api("/api/statistics/")
            status = api("/api/status/")
        except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, OSError) as e:
            # Report the failure as data rather than as an HTTP error, so a
            # broken API is visible in Prometheus as paperless_up == 0 instead
            # of the whole target flipping to "down" with no detail.
            emit("paperless_up", 0, "1 if the Paperless API answered this scrape")
            out.append(f"# ERROR {type(e).__name__}")
            return "\n".join(out) + "\n"

        emit("paperless_up", 1, "1 if the Paperless API answered this scrape")

        emit("paperless_documents_total", stats.get("documents_total"),
             "Documents stored")
        emit("paperless_documents_inbox", stats.get("documents_inbox"),
             "Documents still carrying the inbox tag (unfiled backlog)")
        emit("paperless_characters_total", stats.get("character_count"),
             "Characters across all documents")
        for key, metric in (("tag_count", "tags"),
                            ("correspondent_count", "correspondents"),
                            ("document_type_count", "document_types"),
                            ("storage_path_count", "storage_paths")):
            emit(f"paperless_{metric}_total", stats.get(key), f"Configured {metric}")

        storage = status.get("storage", {}) or {}
        emit("paperless_storage_total_bytes", storage.get("total"),
             "Total size of the documents volume")
        emit("paperless_storage_available_bytes", storage.get("available"),
             "Free space on the documents volume")

        tasks = status.get("tasks", {}) or {}
        db = status.get("database", {}) or {}
        for label, raw in (
            ("database", db.get("status")),
            ("redis", tasks.get("redis_status")),
            ("celery", tasks.get("celery_status")),
            ("index", tasks.get("index_status")),
            ("classifier", tasks.get("classifier_status")),
            ("sanity_check", tasks.get("sanity_check_status")),
        ):
            if raw is None:
                continue
            emit("paperless_component_status",
                 STATUS_VALUES.get(str(raw).upper(), -1),
                 "Component health: 1 OK, 0 warning, -1 error or unknown",
                 labels=f'{{component="{label}"}}')

        return "\n".join(out) + "\n"

    def cached_metrics():
        now = time.monotonic()
        with _cache_lock:
            if _cache["body"] is not None and now - _cache["at"] < CACHE_TTL:
                return _cache["body"]
        body = collect().encode()
        with _cache_lock:
            _cache["body"], _cache["at"] = body, now
        return body

    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def do_GET(self):
            path = self.path.split("?")[0]
            # The probe path must NOT touch the Paperless API. It used to share
            # /metrics, where two API calls can take up to 20s while the
            # kubelet's default probe timeout is 1s -- the probe hung up
            # mid-response and every single one logged a BrokenPipeError.
            if path == "/healthz":
                self._respond(b"ok\n", "text/plain")
                return
            if path != "/metrics":
                self.send_response(404)
                self.send_header("Content-Length", "0")
                self.end_headers()
                return
            self._respond(cached_metrics(), "text/plain; version=0.0.4")

        def _respond(self, body, content_type):
            try:
                self.send_response(200)
                self.send_header("Content-Type", content_type)
                self.send_header("Content-Length", str(len(body)))
                self.end_headers()
                self.wfile.write(body)
            except (BrokenPipeError, ConnectionResetError):
                # A client that gave up mid-response is its own problem, not an
                # error worth a traceback per occurrence.
                pass

        def log_message(self, *args):
            pass  # one line per scrape is noise, not information

    if __name__ == "__main__":
        # Threading so one slow API call cannot block an unrelated health check.
        ThreadingHTTPServer(("0.0.0.0", 9877), Handler).serve_forever()
