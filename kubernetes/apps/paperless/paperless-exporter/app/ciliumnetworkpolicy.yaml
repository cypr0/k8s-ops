---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: paperless-exporter
  namespace: paperless
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: paperless-exporter
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9877"
              protocol: TCP
    # Kubelet readiness probe
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9877"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # The Paperless API itself. The pod label is "paperless", NOT
    # "paperless-ngx" -- that is the Flux Kustomization's name, not the app
    # label the chart sets. Getting it wrong produces no error anywhere: Cilium
    # simply drops the packets and the exporter reports paperless_up 0 with a
    # urlopen timeout.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": paperless
            app.kubernetes.io/name: paperless
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
