---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: openclaw-secret
    creationPolicy: Owner
  # Plain passthrough of every field on the 1Password item (gateway token,
  # OPENAI_API_KEY, ...). A template.data block here would need
  # mergePolicy: Merge, otherwise it replaces the whole secret and silently
  # drops every field not explicitly listed in the template.
  dataFrom:
    - extract:
        key: openclaw
