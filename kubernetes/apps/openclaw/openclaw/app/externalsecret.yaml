---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: openclaw-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      # Merge (not Replace, the default): keep the wholesale passthrough of
      # every field on the `openclaw` item (gateway token, OPENAI_API_KEY,
      # TELEGRAM_BOT_TOKEN, OPENCLAW_HOOKS_TOKEN, ...) below, and additionally
      # rename OPENROUTER_OPENCLAW_API_KEY from the shared `openrouter` item
      # (same per-consumer-scoped-key convention as paperless-ai's
      # OPENROUTER_PAPERLESSAI_API_KEY) to the plain name OpenClaw expects.
      mergePolicy: Merge
      data:
        OPENROUTER_API_KEY: "{{ .OPENROUTER_OPENCLAW_API_KEY }}"
  dataFrom:
    - extract:
        key: openclaw
    - extract:
        key: openrouter
