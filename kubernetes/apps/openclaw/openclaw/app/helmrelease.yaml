---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openclaw
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      openclaw:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: openclaw-secret,openclaw-paperless-secret,openclaw-nextcloud-secret
        initContainers:
          setup:
            image:
              repository: ghcr.io/openclaw/openclaw
              # renovate: datasource=docker depName=ghcr.io/openclaw/openclaw
              tag: 2026.6.11
            env:
              # Running as uid 0 resolves $HOME to /root, not the image's
              # default /home/node, which is where the data PVC is mounted.
              HOME: &home /home/node
            command:
              - sh
              - -c
              - |
                set -eu
                if [ -f "$HOME/.openclaw/openclaw.json" ]; then
                  echo "Already configured, skipping setup."
                else
                  # Exits non-zero because it also probes for an already-running
                  # gateway (there isn't one yet, that's the main container's job).
                  # The config/workspace/session files it writes are what matters.
                  openclaw setup --non-interactive --accept-risk --mode local || true
                  test -f "$HOME/.openclaw/openclaw.json"
                fi
                # Default bind mode is loopback-only, unreachable from the
                # Service/probes over the pod IP. Force LAN bind, restrict
                # trusted forwarded-header proxies to the cluster pod CIDR
                # (Envoy forward-auth), lock the Control UI to our host, and
                # point gateway.auth.token at the real env var -- `setup`
                # bakes in its own randomly-generated literal token otherwise,
                # which never matches OPENCLAW_GATEWAY_TOKEN from the Secret.
                # (printf, not a heredoc: YAML's block-scalar indentation
                # would leave the closing delimiter indented and unmatched.)
                printf '%s' '{"gateway":{"bind":"lan","trustedProxies":["10.42.0.0/16"],"controlUi":{"allowedOrigins":["https://claw.${SECRET_DOMAIN}"]},"auth":{"token":{"source":"env","provider":"default","id":"OPENCLAW_GATEWAY_TOKEN"}}}}' \
                  | openclaw config patch --stdin
                # Alertmanager -> chat bridge: POST /hooks/alertmanager (see
                # ciliumnetworkpolicy.yaml for the monitoring-ns ingress rule).
                # Uses a *separate* token from gateway.auth.token above -- add
                # an OPENCLAW_HOOKS_TOKEN field to the `openclaw` 1Password
                # item (openclaw-secret already passes the whole item
                # through). Unlike gateway.auth.token, hooks.token rejects the
                # {source,provider,id} SecretRef object ("must stay a plain
                # string value" per the policy validator) -- it wants a plain
                # string, optionally with OpenClaw's own dollar-brace runtime
                # env templating. Doubled dollar sign below so Flux's
                # postBuild substitution (which scans this whole file's raw
                # text, comments included -- a bare dollar-brace sequence
                # anywhere is a variable reference attempt) leaves one
                # literal dollar sign for OpenClaw to resolve at gateway
                # startup, same trick as OPENAI_API_KEY below.
                printf '%s' '{"hooks":{"enabled":true,"token":"$${OPENCLAW_HOOKS_TOKEN}","path":"/hooks","defaultSessionKey":"hook:ingress","allowRequestSessionKey":false,"allowedSessionKeyPrefixes":["hook:"],"mappings":[{"name":"alertmanager","match":{"path":"alertmanager"},"action":"agent","agentId":"main","sessionKey":"hook:alerts","deliver":true,"messageTemplate":"Alertmanager [{{status}}] {{commonLabels.alertname}} (severity={{commonLabels.severity}}, namespace={{commonLabels.namespace}}): {{commonAnnotations.summary}}"}]}}' \
                  | openclaw config patch --stdin
                # Telegram channel (built-in, no plugin needed). dmPolicy
                # "pairing" means a NEW one-time step after each fresh deploy:
                #   kubectl exec -n openclaw deploy/openclaw -c app -- openclaw pairing list telegram
                #   kubectl exec -n openclaw deploy/openclaw -c app -- openclaw pairing approve telegram <CODE>
                # Bot token comes from @BotFather -> TELEGRAM_BOT_TOKEN field
                # on the `openclaw` 1Password item (already passed through
                # wholesale by externalsecret.yaml); OpenClaw reads it
                # directly from the env, no token value in this config patch.
                printf '%s' '{"channels":{"telegram":{"enabled":true,"dmPolicy":"pairing"}}}' \
                  | openclaw config patch --stdin
                # OpenRouter as a second/alternative provider alongside the
                # native OpenAI one below -- lets agents pick cheaper/other
                # models without dropping the OpenAI default.
                printf '%s' '{"models":{"providers":{"openrouter":{"baseUrl":"https://openrouter.ai/api/v1","apiKey":{"source":"env","provider":"default","id":"OPENROUTER_API_KEY"}}}}}' \
                  | openclaw config patch --stdin
                # Read-only MCP tools: Flux/Kubernetes state via the flux-operator-mcp
                # Service (cross-namespace, RBAC-gated by the `view` ClusterRole) and
                # plain Kubernetes objects/logs via the k8s-mcp sidecar in this same
                # pod (localhost, non-destructive-tools-only). `mcp set` upserts by
                # name, safe to (re-)run on every restart.
                openclaw mcp set flux '{"url":"http://flux-operator-mcp.flux-system.svc.cluster.local:9090/mcp","transport":"streamable-http"}'
                openclaw mcp set k8s '{"url":"http://localhost:3001/mcp","transport":"streamable-http"}'
                openclaw mcp set paperless '{"url":"http://localhost:5000/mcp","transport":"streamable-http"}'
                openclaw mcp set nextcloud '{"url":"http://localhost:8000/mcp","transport":"streamable-http"}'
                # Bundled Codex plugin (web-search/media-understanding
                # fallback) runs by default despite showing "disabled" in
                # `plugins list` -- it uses a shared/community-quota Codex
                # subscription we never configured, which hit its usage
                # limit in practice ("You've reached your Codex subscription
                # usage limit"). Disable explicitly; `plugins disable` is
                # idempotent, safe to rerun.
                openclaw plugins disable codex
                # One-time OpenAI provider auth + default model. (OPENAI_API_KEY
                # is a real OpenAI key -- sk-proj-... -- not an OpenRouter key,
                # so it's wired to the native openai provider, not OpenRouter.)
                if [ -n "$${OPENAI_API_KEY:-}" ] && ! openclaw models auth list 2>/dev/null | grep -q "openai:manual"; then
                  echo "$${OPENAI_API_KEY}" | openclaw models auth paste-api-key --provider openai
                fi
                # Default model: Claude via OpenRouter (no separate Anthropic
                # key needed). The "~...-latest" alias is OpenRouter's own
                # auto-resolving pointer -- always the newest Sonnet release
                # (currently Sonnet 5), no manual bump needed when Anthropic
                # ships a new one. `models set` is idempotent, safe to rerun.
                openclaw models set 'openrouter/~anthropic/claude-sonnet-latest' \
                  || echo "WARN: setting default model failed; set agents.defaults.model manually"
            envFrom:
              - secretRef:
                  name: openclaw-secret
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
        containers:
          app:
            image:
              repository: ghcr.io/openclaw/openclaw
              # renovate: datasource=docker depName=ghcr.io/openclaw/openclaw
              tag: 2026.6.11
            env:
              TZ: Europe/Berlin
              # Running as uid 0 resolves $HOME to /root, not the image's
              # default /home/node, which is where the data PVC is mounted.
              HOME: *home
              # Control UI / gateway API listen port (chart-default container port)
              PORT: &port 18789
            envFrom:
              - secretRef:
                  name: openclaw-secret
            probes:
              # Gateway does synchronous provider/model warmup after "ready"
              # that can briefly block the event loop (e.g. LLM provider auth
              # checks). Use the dedicated /health endpoint with a generous
              # timeout/threshold so that warmup isn't mistaken for a hang.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 6
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            # Runs as root so the NFS-backed data dirs are writable
            # (mirrors open-webui; csi-driver-nfs does not enforce fsGroup).
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0

          # Read-only Kubernetes object/log inspection MCP tool, scoped by the
          # `view` ClusterRoleBinding on this pod's ServiceAccount (rbac.yaml).
          # Bound to loopback only -- reached by the "app" container via
          # localhost, never exposed on the pod IP/Service.
          k8s-mcp:
            image:
              repository: flux159/mcp-server-kubernetes
              # renovate: datasource=docker depName=flux159/mcp-server-kubernetes
              tag: v4.0.1
            env:
              HOST: 127.0.0.1
              PORT: "3001"
              ENABLE_UNSAFE_STREAMABLE_HTTP_TRANSPORT: "1"
              ALLOW_ONLY_NON_DESTRUCTIVE_TOOLS: "true"
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"
              runAsNonRoot: true
              # Image's default user is a non-numeric "appuser" -- kubelet
              # can't verify non-root without an explicit numeric UID.
              # Confirmed working (in-cluster debug pod) as UID 1000.
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault

          # Paperless-ngx document search/read MCP tool. Reuses the same API
          # token as paperless-ai (openclaw-paperless-secret); read-oriented
          # tool set only -- no document deletion is wired up.
          paperless-mcp:
            image:
              repository: ghcr.io/barryw/paperlessmcp
              # renovate: datasource=docker depName=ghcr.io/barryw/paperlessmcp
              tag: v0.2.0
            env:
              PAPERLESS_BASE_URL: http://paperless.paperless.svc.cluster.local
              MCP_PORT: "5000"
            envFrom:
              - secretRef:
                  name: openclaw-paperless-secret
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"
              runAsNonRoot: true
              # Image defaults to root (uid 0) -- confirmed working (in-cluster
              # debug pod) as an explicit non-root UID instead.
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault

          # Nextcloud file read/analysis MCP tool, scoped to the dedicated
          # openclaw-reader account (post-install-job.yaml) -- whatever that
          # account can see (nothing, until granted a Group folder), never
          # the admin account.
          nextcloud-mcp:
            image:
              repository: ghcr.io/cbcoutinho/nextcloud-mcp-server
              # renovate: datasource=docker depName=ghcr.io/cbcoutinho/nextcloud-mcp-server
              tag: "0.136.0"
            env:
              NEXTCLOUD_HOST: http://nextcloud.nextcloud.svc.cluster.local:8080
              NEXTCLOUD_USERNAME: openclaw-reader
            envFrom:
              - secretRef:
                  name: openclaw-nextcloud-secret
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              # OOMKilled at 256Mi in practice -- this image's baseline
              # footprint runs higher than the other two sidecars.
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - "ALL"
              runAsNonRoot: true
              # Image defaults to root (uid 0) -- confirmed working (in-cluster
              # debug pod) as an explicit non-root UID instead.
              runAsUser: 1000
              seccompProfile:
                type: RuntimeDefault

    service:
      app:
        controller: openclaw
        ports:
          http:
            port: *port
      k8s-mcp:
        controller: openclaw
        ports:
          http:
            port: 3001
      paperless-mcp:
        controller: openclaw
        ports:
          http:
            port: 5000
      nextcloud-mcp:
        controller: openclaw
        ports:
          http:
            port: 8000

    persistence:
      data:
        existingClaim: openclaw-data-pvc
        advancedMounts:
          openclaw:
            app:
              - path: /home/node/.openclaw
                subPath: openclaw
              - path: /home/node/.config/openclaw
                subPath: config
            setup:
              - path: /home/node/.openclaw
                subPath: openclaw
              - path: /home/node/.config/openclaw
                subPath: config
