---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openclaw
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      openclaw:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: openclaw-secret
        initContainers:
          setup:
            image:
              repository: ghcr.io/openclaw/openclaw
              # renovate: datasource=docker depName=ghcr.io/openclaw/openclaw
              tag: 2026.6.11
            env:
              # Running as uid 0 resolves $HOME to /root, not the image's
              # default /home/node, which is where the data PVC is mounted.
              HOME: &home /home/node
            command:
              - sh
              - -c
              - |
                set -eu
                if [ -f "$HOME/.openclaw/openclaw.json" ]; then
                  echo "Already configured, skipping setup."
                  exit 0
                fi
                # Exits non-zero because it also probes for an already-running
                # gateway (there isn't one yet, that's the main container's job).
                # The config/workspace/session files it writes are what matters.
                openclaw setup --non-interactive --accept-risk --mode local || true
                test -f "$HOME/.openclaw/openclaw.json"
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0
        containers:
          app:
            image:
              repository: ghcr.io/openclaw/openclaw
              # renovate: datasource=docker depName=ghcr.io/openclaw/openclaw
              tag: 2026.6.11
            env:
              TZ: Europe/Berlin
              # Running as uid 0 resolves $HOME to /root, not the image's
              # default /home/node, which is where the data PVC is mounted.
              HOME: *home
              # Control UI / gateway API listen port (chart-default container port)
              PORT: &port 18789
            envFrom:
              - secretRef:
                  name: openclaw-secret
            probes:
              # Gateway does synchronous provider/model warmup after "ready"
              # that can briefly block the event loop (e.g. LLM provider auth
              # checks). Use the dedicated /health endpoint with a generous
              # timeout/threshold so that warmup isn't mistaken for a hang.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 6
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
            # Runs as root so the NFS-backed data dirs are writable
            # (mirrors open-webui; csi-driver-nfs does not enforce fsGroup).
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0

    service:
      app:
        controller: openclaw
        ports:
          http:
            port: *port

    persistence:
      data:
        existingClaim: openclaw-data-pvc
        advancedMounts:
          openclaw:
            app:
              - path: /home/node/.openclaw
                subPath: openclaw
              - path: /home/node/.config/openclaw
                subPath: config
            setup:
              - path: /home/node/.openclaw
                subPath: openclaw
              - path: /home/node/.config/openclaw
                subPath: config
