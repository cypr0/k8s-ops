---
# Binds the app-template chart's auto-created ServiceAccount "openclaw" to the
# built-in read-only `view` ClusterRole, so the k8s-mcp sidecar (and anything
# else running in this pod) can only ever get/list/watch cluster state -- no
# writes, no Secret data.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw-view
subjects:
  - kind: ServiceAccount
    name: openclaw
    namespace: openclaw
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
# `view` only covers namespaced resources -- Nodes are cluster-scoped and
# absent from it entirely (its "nodes" grant under metrics.k8s.io is for
# node *metrics*, not the core Node object). Grant read-only access to the
# core Node object separately so cluster-health questions ("any node
# NotReady?") don't need cluster-admin.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openclaw-nodes-view
rules:
  - apiGroups:
      - ""
    resources:
      - "nodes"
    verbs:
      - "get"
      - "list"
      - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw-nodes-view
subjects:
  - kind: ServiceAccount
    name: openclaw
    namespace: openclaw
roleRef:
  kind: ClusterRole
  name: openclaw-nodes-view
  apiGroup: rbac.authorization.k8s.io
---
# `view` predates Cilium's CRDs and doesn't aggregate them -- the
# ServiceAccount gets a flat "Forbidden" on ciliumnetworkpolicies in every
# namespace, cluster-scoped ciliumclusterwidenetworkpolicies included.
# Read-only: policy *definitions* are configuration, not secrets, and this
# is exactly what a network-policy audit ("is X exposed more than it
# should be?") needs to read.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openclaw-cilium-policy-view
rules:
  - apiGroups:
      - "cilium.io"
    resources:
      - "ciliumnetworkpolicies"
      - "ciliumclusterwidenetworkpolicies"
    verbs:
      - "get"
      - "list"
      - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw-cilium-policy-view
subjects:
  - kind: ServiceAccount
    name: openclaw
    namespace: openclaw
roleRef:
  kind: ClusterRole
  name: openclaw-cilium-policy-view
  apiGroup: rbac.authorization.k8s.io
---
# `view` deliberately excludes rbac.authorization.k8s.io entirely (upstream
# default -- a read-only role that could still enumerate every binding is
# a privilege-topology leak in its own right). Grant *bindings* only, not
# Roles/ClusterRoles themselves: "which ServiceAccount is bound to what"
# answers the cluster-admin-audit question this was asked for, without
# also handing over the full Rule-level permission catalog.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openclaw-rbac-bindings-view
rules:
  - apiGroups:
      - "rbac.authorization.k8s.io"
    resources:
      - "rolebindings"
      - "clusterrolebindings"
    verbs:
      - "get"
      - "list"
      - "watch"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openclaw-rbac-bindings-view
subjects:
  - kind: ServiceAccount
    name: openclaw
    namespace: openclaw
roleRef:
  kind: ClusterRole
  name: openclaw-rbac-bindings-view
  apiGroup: rbac.authorization.k8s.io
