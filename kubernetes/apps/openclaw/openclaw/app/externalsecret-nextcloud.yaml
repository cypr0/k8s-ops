---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-nextcloud
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: openclaw-nextcloud-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Password for the dedicated openclaw-reader Nextcloud account
        # (kubernetes/apps/nextcloud/nextcloud/app/post-install-job.yaml),
        # same 1Password item as nextcloud-credentials so both sides match.
        NEXTCLOUD_PASSWORD: "{{ .NEXTCLOUD_OPENCLAW_READER_PASSWORD }}"
  dataFrom:
    - extract:
        key: nextcloud
