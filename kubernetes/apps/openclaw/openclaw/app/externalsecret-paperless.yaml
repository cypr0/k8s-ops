---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openclaw-paperless
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: openclaw-paperless-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Reuses the existing Paperless API token (same 1Password item
        # paperless-ai already reuses) -- no new Paperless-side credential.
        PAPERLESS_API_TOKEN: "{{ .PAPERLESS_API_TOKEN }}"
  dataFrom:
    - extract:
        key: paperless
