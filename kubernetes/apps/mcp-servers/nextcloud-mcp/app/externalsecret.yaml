---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# Reuses the SAME 1Password "nextcloud" item and real admin credentials
# kubernetes/apps/nextcloud/nextcloud/app/externalsecret.yaml and
# kubernetes/apps/open-webui/open-webui/app/externalsecret-nextcloud-token.yaml
# already read -- same deliberate choice (real admin account, no separate
# revoke path) as nextcloud_full.py's module docstring explains.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-mcp-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: nextcloud-mcp-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NEXTCLOUD_USERNAME: "{{ .NEXTCLOUD_ADMIN_USERNAME }}"
        NEXTCLOUD_PASSWORD: "{{ .NEXTCLOUD_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: nextcloud
