---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# Reuses the SAME 1Password "paperless" item and dedicated API token
# kubernetes/apps/paperless/paperless-ngx/app/externalsecret.yaml and
# kubernetes/apps/open-webui/open-webui/app/externalsecret-paperless-token.yaml
# already read -- no new Paperless credential is provisioned for this MCP
# server either.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: paperless-mcp-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: paperless-mcp-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PAPERLESS_API_TOKEN: "{{ .PAPERLESS_API_TOKEN }}"
  dataFrom:
    - extract:
        key: paperless
