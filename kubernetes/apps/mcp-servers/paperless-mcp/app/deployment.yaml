---
# Standalone MCP (Model Context Protocol) server exposing the exact same
# Paperless-ngx REST API surface as the paperless_full Open WebUI Tool
# (kubernetes/apps/open-webui/open-webui/app/tools/paperless_full.py) --
# see owui_tool_mcp_bridge.py's module docstring for how the SAME Tools
# class doubles as both. Built for hermes-agent's remote HTTP MCP client
# support (kubernetes/apps/hermes-agent/hermes-agent/app/configmap.yaml's
# mcp_servers section).
#
# No prebuilt image exists for this (greenfield app, no CI/registry set up
# for it) -- runs on a stock python:3.13-slim image instead, with an init
# container that pip-installs the small MCP SDK + httpx dependency set to
# a shared emptyDir. Mirrors the same "generic base image + ConfigMap
# script + init-container pip install" pattern hermes-agent's own
# tools-install/bootstrap-trading init containers and the Open WebUI
# tool-sync Job already use elsewhere in this repo.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paperless-mcp
  labels:
    app.kubernetes.io/name: paperless-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: paperless-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: paperless-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-deps
          image: python:3.13-slim
          command:
            - "sh"
            - "-c"
          args:
            - |
              set -eu
              # Pinned <2: the official "mcp" SDK's 2.0.0 release (2026-08)
              # restructured its module layout and dropped
              # mcp.server.fastmcp.FastMCP from where owui_tool_mcp_bridge.py
              # imports it (confirmed live: ModuleNotFoundError on 2.0.0,
              # works fine on 1.9.4) -- pin until the bridge script is
              # updated for whatever 2.x's replacement API looks like.
              pip install --no-cache-dir --target=/pylibs "mcp>=1.6,<2" httpx pydantic
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: pylibs
              mountPath: /pylibs
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
      containers:
        - name: mcp-server
          image: python:3.13-slim
          command:
            - "python3"
            - "/app/owui_tool_mcp_bridge.py"
          env:
            - name: TOOL_MODULE_PATH
              value: /app/paperless_full.py
            - name: MCP_SERVER_NAME
              value: paperless
            - name: MCP_PORT
              value: "8000"
            - name: PYTHONPATH
              value: /pylibs
            - name: HOME
              value: /tmp
            - name: PYTHONUNBUFFERED
              value: "1"
          envFrom:
            - secretRef:
                name: paperless-mcp-secret
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: pylibs
              mountPath: /pylibs
            - name: app-src
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pylibs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: app-src
          configMap:
            name: paperless-mcp-src
