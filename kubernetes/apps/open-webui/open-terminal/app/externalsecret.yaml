---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-terminal
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: open-terminal-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Shared bearer token between Open Terminal and the Open WebUI backend.
        # The SAME value must be entered once in Open WebUI's Admin Settings →
        # Integrations → Open Terminal (see the config note in helmrelease.yaml).
        OPEN_TERMINAL_API_KEY: "{{ .API_KEY }}"
  dataFrom:
    # Requires a 1Password item named "open-terminal" with an "API_KEY" field.
    - extract:
        key: open-terminal
