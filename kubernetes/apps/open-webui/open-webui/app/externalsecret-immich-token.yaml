---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# Feeds the immich_photos Open WebUI Tool's Immich API key (see
# ./tools/immich_photos.py's Valves), so users never have to enter or even
# see the credential -- it's auto-filled from an env var on the Open WebUI
# pod (envFrom on the "app" container in helmrelease.yaml).
#
# UNLIKE the paperless/nextcloud tool secrets, this one does NOT reuse an
# existing cluster credential, because Immich has none to reuse: it has no
# provisionable service account, API keys can only be minted by a
# signed-in user under Account Settings > API Keys, and this instance is
# OIDC-only with passwordLogin disabled (kubernetes/apps/immich/immich/app/
# externalsecret.yaml's immich.json). IMMICH_API_KEY therefore has to be
# created by hand ONCE and added as a new field on the EXISTING 1Password
# "immich" item that kubernetes/apps/immich/immich/app/externalsecret.yaml
# already reads. Until that field exists this ExternalSecret stays
# SecretSyncedError and the open-webui pod will not start with it in
# envFrom -- that is deliberate and visible rather than a tool that
# silently 401s.
#
# Scope the key narrowly when creating it: asset.read, asset.view,
# asset.update, album.read, album.create, album.update, person.read,
# server.about. It inherits its owning user's library scope (Immich has no
# instance-wide key), so create it as the user whose photos the tool
# should see. The same key is read independently by
# kubernetes/apps/hermes-agent/immich-mcp/app/externalsecret.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-immich-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: open-webui-immich-secret
    creationPolicy: Owner
  data:
    - secretKey: IMMICH_API_KEY
      remoteRef:
        key: immich
        property: IMMICH_API_KEY
