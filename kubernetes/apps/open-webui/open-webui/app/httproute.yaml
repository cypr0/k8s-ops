---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: open-webui
  namespace: open-webui
  labels:
    app.kubernetes.io/name: open-webui
    app.kubernetes.io/instance: open-webui
spec:
  hostnames:
    - ai.${SECRET_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Long timeouts: streaming LLM responses can run for minutes
      timeouts:
        request: "15m"
        backendRequest: "15m"
      backendRefs:
        - group: ""
          kind: Service
          name: open-webui-app
          namespace: open-webui
          port: 8090
          weight: 1
