---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# Feeds the mailu_full Open WebUI Tool's per-mailbox credentials (see
# ./tools/mailu_full.py's Valves).
#
# Two separate 1Password items, one per mailbox -- "mailu-philipp" and
# "mailu-anna", each a Login item with a "username" field (the FULL mail
# address) and a "password" field (that mailbox's real Mailu account
# password, the same one used for IMAP/webmail login). Deliberately kept
# out of this public repo entirely: unlike ${SECRET_DOMAIN}-style
# substitution vars, these are real personal addresses with no
# narrower-scope alternative, so they only ever exist in 1Password and the
# resulting runtime Secret, never as a literal string anywhere in git.
#
# This is the SAME pair of items kubernetes/apps/hermes-agent/mailu-mcp/
# app/externalsecret.yaml reads, because both consumers run the same
# mailu_full.py against the same accounts -- Mailu (like most mail
# servers) has no separate read-only or calendar-only credential
# mechanism, only per-mailbox master passwords, so there is no
# narrower-scoped credential to hand a chat tool instead.
#
# NOTE this is a genuinely wider exposure than the hermes-agent copy: there
# the credential only ever backed the owner's own agent, here it backs a
# Tool that any Open WebUI user granted it can invoke. Keep this tool's
# entry in tools/sync_tools.py's TOOL_ACCESS_GRANTS narrow.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-mailu-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: open-webui-mailu-secret
    creationPolicy: Owner
  data:
    - secretKey: PHILIPP_USERNAME
      remoteRef:
        key: mailu-philipp
        property: username
    - secretKey: PHILIPP_PASSWORD
      remoteRef:
        key: mailu-philipp
        property: password
    - secretKey: ANN_USERNAME
      remoteRef:
        key: mailu-anna
        property: username
    - secretKey: ANN_PASSWORD
      remoteRef:
        key: mailu-anna
        property: password
