---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# Feeds the hermes_agent Open WebUI Tool's webhook shared secret (see
# ./tools/hermes_agent.py's Valves), so users never have to enter or even
# see the credential -- it's auto-filled from an env var on the Open WebUI
# pod (envFrom on the "app" container in helmrelease.yaml).
#
# Deliberately reuses the SAME 1Password "hermes-agent" item field
# (HERMES_WEBHOOK_SHARED_SECRET) that kubernetes/apps/hermes-agent/
# hermes-agent/app/externalsecret.yaml already reads as
# WEBHOOK_SHARED_SECRET -- hermes-agent's webhook platform has ONE secret
# for all callers (gateway/config.py merges the global WEBHOOK_SECRET into
# any route without its own `secret:`), so there is no per-caller
# credential to provision. Anything holding this value can trigger any
# configured route, which today means the owui-task route this tool uses
# and the paperless-document-added route Paperless-ngx uses.
#
# Renamed to HERMES_WEBHOOK_SECRET here rather than reusing
# WEBHOOK_SHARED_SECRET: that name is generic enough to collide with some
# future app's own env var on this same pod, and everything on the Open
# WebUI container comes in through a flat envFrom.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-hermes-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: open-webui-hermes-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        HERMES_WEBHOOK_SECRET: "{{ .HERMES_WEBHOOK_SHARED_SECRET }}"
  dataFrom:
    - extract:
        key: hermes-agent
