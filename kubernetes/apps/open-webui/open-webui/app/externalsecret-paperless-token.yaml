---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# Feeds the paperless_full Open WebUI Tool's Paperless API token (see
# ./tools/paperless_full.py's Valves), so users never have to enter or even
# see the credential -- it's auto-filled from an env var on the Open WebUI
# pod (envFrom on the "app" container in helmrelease.yaml).
#
# Deliberately reuses the SAME 1Password "paperless" item
# kubernetes/apps/paperless/paperless-ngx/app/externalsecret.yaml already
# reads (PAPERLESS_API_TOKEN) -- the same token
# paperless-cronjob-fix-ownership (kubernetes/apps/paperless/paperless-ngx/
# app/jobs.yaml) already uses. No new Paperless credential is provisioned
# for this tool. Because the tool can create/update/DELETE Paperless
# resources, make sure that token's underlying Paperless user account's
# permissions are ones you're comfortable exposing to every Open WebUI user
# with access to this tool (currently gated via TOOL_ACCESS_GRANTS in
# ./tools/sync_tools.py).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-paperless-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: open-webui-paperless-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PAPERLESS_API_TOKEN: "{{ .PAPERLESS_API_TOKEN }}"
  dataFrom:
    - extract:
        key: paperless
