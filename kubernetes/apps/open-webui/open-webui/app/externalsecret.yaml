---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: open-webui-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # App database + RAG vector database (shared postgres cluster, pgvector).
        # User "openwebuiusr" is a managed role on the shared cluster.
        DATABASE_URL: "postgresql://openwebuiusr:{{ .OPENWEBUI_DB_PASS | urlquery }}@postgres-rw.database.svc.cluster.local:5432/openwebuidbapp?sslmode=disable"
        PGVECTOR_DB_URL: "postgresql://openwebuiusr:{{ .OPENWEBUI_DB_PASS | urlquery }}@postgres-rw.database.svc.cluster.local:5432/openwebuidbrag?sslmode=disable"
        # Redis/Dragonfly for websocket session manager
        REDIS_URL: "redis://:{{ .DRAGONFLY_PASSWORD | urlquery }}@dragonfly.database.svc.cluster.local:6379/0"
        WEBSOCKET_REDIS_URL: "redis://:{{ .DRAGONFLY_PASSWORD | urlquery }}@dragonfly.database.svc.cluster.local:6379/0"
        # LLM backend (OpenRouter)
        OPENAI_API_KEY: "{{ .OPENROUTER_OPENWEBUI_API_KEY }}"
        # OIDC (Authentik) — same source the Authentik blueprint reads
        OAUTH_CLIENT_ID: "{{ .OPENWEBUI_OIDC_CLIENT_ID }}"
        OAUTH_CLIENT_SECRET: "{{ .OPENWEBUI_OIDC_CLIENT_SECRET }}"
        WEBUI_SECRET_KEY: "{{ .OPENWEBUI_SECRET_KEY }}"
        SEARXNG_SECRET: "{{ .OPENWEBUI_SEARXNG_SECRET }}"
  dataFrom:
    - extract:
        key: openwebui
    - extract:
        key: openrouter
    - extract:
        key: dragonfly
