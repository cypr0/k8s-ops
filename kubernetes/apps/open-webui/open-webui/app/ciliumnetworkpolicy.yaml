---
# open-webui: AI chat UI (also hosts the SearXNG sidecar in the same pod,
# so this policy covers SearXNG's egress too).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: open-webui
  namespace: open-webui
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  ingress:
    # Envoy proxy pods (network namespace) - web UI entry point on :8090
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "8090"
              protocol: TCP
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # PostgreSQL (app db + pgvector RAG db) and Redis/Dragonfly in database ns
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "6379"
              protocol: TCP
    # Dedicated Tika instance (same namespace)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": open-webui
            app.kubernetes.io/name: tika
      toPorts:
        - ports:
            - port: "9998"
              protocol: TCP
    # Authentik OIDC via id.${SECRET_DOMAIN}: CoreDNS resolves to the
    # envoy-internal ClusterIP, DNAT'd to the envoy container port 10443.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    # OpenRouter LLM API + SearXNG web search to arbitrary engines (world)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
---
# tika: dedicated document text-extraction service for open-webui
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tika
  namespace: open-webui
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: tika
  ingress:
    # open-webui document extraction
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": open-webui
            app.kubernetes.io/name: open-webui
      toPorts:
        - ports:
            - port: "9998"
              protocol: TCP
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
