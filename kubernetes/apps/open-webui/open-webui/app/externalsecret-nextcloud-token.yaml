---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# Feeds the nextcloud_full Open WebUI Tool's Nextcloud credentials (see
# ./tools/nextcloud_full.py's Valves), so users never have to enter or even
# see the credential -- it's auto-filled from env vars on the Open WebUI
# pod (envFrom on the "app" container in helmrelease.yaml).
#
# Deliberately reuses the SAME 1Password "nextcloud" item and admin
# credentials kubernetes/apps/nextcloud/nextcloud/app/externalsecret.yaml
# already reads (NEXTCLOUD_ADMIN_USERNAME/NEXTCLOUD_ADMIN_PASSWORD) --
# a deliberate choice over provisioning a separate dedicated account (see
# nextcloud_full.py's module docstring): this tool wields the real
# Nextcloud super-admin credential, with no separate revoke path just for
# it. Reconsider this if this tool's blast radius ever needs to shrink.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui-nextcloud-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: open-webui-nextcloud-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NEXTCLOUD_USERNAME: "{{ .NEXTCLOUD_ADMIN_USERNAME }}"
        NEXTCLOUD_PASSWORD: "{{ .NEXTCLOUD_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: nextcloud
