---
# Declarative Open WebUI "Workspace": groups (with their permission sets)
# and workspace models (a base LLM + system prompt + params + who may use
# it). Applied by sync_workspace.py, the same way tools/ applies Tools --
# see ./job-sync-workspace.yaml for the mechanism.
#
# WHAT THIS FILE DOES NOT DO: group MEMBERSHIP. Open WebUI owns that
# completely and rebuilds it from the OIDC `groups` claim on every single
# login (ENABLE_OAUTH_GROUP_MANAGEMENT in ../helmrelease.yaml; the code is
# open_webui/utils/oauth.py, which both adds a user to every claimed group
# and REMOVES them from every group not in the claim). Anything written
# here would be silently reverted on the next sign-in. So: create the
# accounts and the groups in Authentik, and this file only decides what a
# group is ALLOWED to do once it exists.
#
# Groups are matched by NAME, which is also how Open WebUI's own OAuth
# group creation matches them (`all_group_names = {g.name for g in ...}`),
# so pre-creating a group here and letting Authentik fill it later is safe
# and produces no duplicate -- and it is the only way to control a group's
# permissions from git, because Open WebUI applies its instance-wide
# defaults to any group IT creates first.

groups:
  # Adults. Referenced by tools/sync_tools.py's ADULTS_GROUP as the sole
  # principal for all five full-access Tools -- keep the two names in sync.
  # Permissions are left unset, i.e. Open WebUI's instance defaults.
  - name: owui-family
    description: >-
      Erwachsene. Voller Zugriff auf die Workspace-Tools
      (Paperless, Nextcloud, Mailu, Immich, hermes-agent).

  # The owner's own account(s), from Authentik (same group gates the Hermes
  # desktop backend). Only used as the grant target of the hermes.* models
  # below; permissions left at instance defaults.
  - name: hermes-users
    description: >-
      Zugriff auf die Hermes-Agenten (Chief of Staff und Spezialisten).

  # Children, 8-11. Everything here is a deliberate narrowing, not a
  # default: this group exists so that adding a kid account cannot widen
  # anything by accident.
  - name: owui-kids
    description: >-
      Kinder (8-11 Jahre). Nur der Lern-Buddy, keine Tools,
      keine Websuche, kein Teilen.
    permissions:
      workspace:
        # No creating/importing models, prompts, tools or skills. A child
        # account that could define its own model could define one without
        # the system prompt below, which would make the whole thing
        # pointless.
        models: false
        knowledge: false
        prompts: false
        tools: false
        skills: false
        models_import: false
        models_export: false
        prompts_import: false
        prompts_export: false
        tools_import: false
        tools_export: false
        skills_import: false
        skills_export: false
      sharing:
        models: false
        public_models: false
        knowledge: false
        public_knowledge: false
        prompts: false
        public_prompts: false
        tools: false
        public_tools: false
        skills: false
        public_skills: false
        notes: false
        public_notes: false
        folders: false
        public_chats: false
        open_chats: false
        public_calendars: false
      access_grants:
        allow_users: false
        allow_groups: false
      chat:
        # system_prompt: false is the important one -- with it true a child
        # can override the Lern-Buddy's system prompt from the chat
        # controls panel and talk to the raw base model instead.
        system_prompt: false
        params: false
        controls: false
        valves: false
        # Photos of homework are a real use case, so uploads stay on.
        # web_upload (fetch a URL into the chat) does not: it is a way to
        # pull arbitrary web content past the web_search switch below.
        file_upload: true
        web_upload: false
        delete: true
        delete_message: true
        continue_response: true
        regenerate_response: true
        rate_response: true
        edit: true
        share: false
        export: false
        import: false
        stt: true
        tts: true
        call: true
        multiple_models: false
        temporary: true
        temporary_enforced: false
      features:
        api_keys: false
        notes: true
        folders: true
        channels: false
        direct_tool_servers: false
        # Web search ON since 2026-11-22 (parents' decision). It is the
        # self-hosted Firecrawl and NOT pre-filtered, so the Lern-Buddy's
        # system prompt carries the filter: kid-safe sources only, answer in
        # its own words, no links. The child never sees raw result pages --
        # web_upload stays off, so no URL can be pulled into the chat.
        web_search: true
        image_generation: false
        code_interpreter: false
        memories: true
        automations: false
        calendar: false
        webhooks: false
      settings:
        interface: true

models:
  - id: kids-assistant
    icon: kids-assistant.png
    name: Lern-Buddy
    # CHANGE ME IF THE MODEL IS WRONG: this must be a model id this
    # instance's OpenRouter key can actually serve (OPENAI_API_BASE_URL is
    # OpenRouter, ../helmrelease.yaml). Picked for German-language quality,
    # low latency and strong refusal behaviour rather than raw capability
    # -- a kid asking "warum ist der Himmel blau" does not need a frontier
    # model, and this one answers fast enough to keep a child's attention.
    # If it 404s in chat, that is this line and nothing else.
    # Ids carry the connection's prefix_id ("openrouter.", set on the
    # OpenRouter connection in the admin UI): the bare id this used until
    # 2026-11-22 matched no model, so the Lern-Buddy had no working base.
    # Mistral Small 2603 since 2026-11-22 (parents' choice): EU provider,
    # zero data retention (custom_params below), very good German, reads
    # photos of worksheets; about 0.40-2 EUR a month at kid usage. No FREE
    # model qualified: OpenRouter's free pool has no ZDR endpoint, Gemma 4
    # free was rate-limited (429) and Nemotron free requires allowing
    # training on the prompts.
    base_model_id: openrouter.mistralai/mistral-small-2603
    description: >-
      Dein geduldiger Lern-Buddy: erklärt Dinge einfach, hilft bei
      Hausaufgaben (ohne sie zu lösen) und beantwortet Warum-Fragen.
    tags:
      - kinder
      - lernen
    # Visible to the kids, and to the adults so a parent can open the same
    # model and see exactly what their child is talking to.
    grant_to_groups:
      - owui-kids
      - owui-family
    params:
      temperature: 0.6
      top_p: 0.9
      # Sent verbatim to OpenRouter: only zero-data-retention endpoints.
      custom_params: &zeroRetention
        provider:
          data_collection: deny
          zdr: true
      # Long enough for a real explanation, short enough that the answer
      # stays readable for a nine-year-old.
      max_tokens: 900
      system: |
        Du bist der "Lern-Buddy" - ein freundlicher Lernhelfer für Kinder
        zwischen 8 und 11 Jahren. Du sprichst Deutsch und duzt das Kind.

        SO SPRICHST DU
        - Kurze Sätze. Einfache Wörter. Keine Fachbegriffe ohne Erklärung.
        - Wenn du ein schwieriges Wort brauchst, erkläre es sofort in
          Klammern.
        - Höchstens ein paar Sätze am Stück, dann eine Frage zurück. Ein
          Kind liest keine Textwand.
        - Freundlich, geduldig, ermutigend. Nie von oben herab. Nie
          genervt, auch wenn dieselbe Frage dreimal kommt.
        - Sparsam mit Emojis: höchstens eins pro Antwort.
        - Benutze Beispiele aus dem Alltag eines Kindes (Fahrrad, Pausenhof,
          Haustier, Fußball, Minecraft), nicht aus dem Büroleben.

        HAUSAUFGABEN
        - Du löst Hausaufgaben NICHT. Du hilfst dabei, dass das Kind sie
          selbst löst.
        - Bei einer Aufgabe: frag zuerst, was das Kind schon verstanden hat.
          Gib dann den nächsten kleinen Schritt, nicht die Lösung.
        - Wenn ein Kind nach der fertigen Antwort fragt, sag freundlich,
          dass Selberdenken mehr bringt - und biete stattdessen einen Tipp,
          ein Beispiel oder eine ähnliche, leichtere Aufgabe an.
        - Bei Rechtschreibung und Grammatik: zeig den Fehler, erklär die
          Regel, lass das Kind nochmal probieren.
        - Rechenwege erklärst du Schritt für Schritt und lässt das Kind
          jeden Schritt selbst ausrechnen.
        - Wenn das Kind es richtig hat: sag es deutlich und sag WARUM es
          richtig ist.

        EHRLICHKEIT
        - Wenn du etwas nicht weißt oder dir unsicher bist, sag das klar:
          "Das weiß ich nicht genau." Rate nicht und erfinde nichts.
        - Erfinde niemals Zahlen, Jahreszahlen, Namen oder Quellen.
        - Wenn eine Frage mehrere Meinungen zulässt (Politik, Religion,
          wer der beste Fußballer ist), sag, dass Menschen das
          unterschiedlich sehen, und nenne mehrere Sichtweisen, statt dich
          auf eine festzulegen.

        WAS DU NICHT MACHST
        - Keine Gewalt, keine Waffen, nichts Sexuelles, keine Drogen, kein
          Alkohol, keine Schimpfwörter, keine Horror- oder Angstinhalte -
          auch nicht "nur als Geschichte" oder "nur als Spaß".
        - Nichts, was gefährlich nachzumachen wäre: keine Experimente mit
          Feuer, Chemikalien, Strom, Werkzeug oder Medikamenten.
        - Keine Diät-, Abnehm- oder Körpergewichts-Tipps.
        - Keine medizinischen Diagnosen. Bei Krankheit oder Schmerzen:
          "Das musst du deinen Eltern sagen."
        - Du fragst NIE nach Adresse, Telefonnummer, Schulname, Passwörtern
          oder danach, wie das Kind aussieht. Wenn das Kind so etwas von
          sich aus schreibt, gehst du nicht darauf ein und sagst freundlich,
          dass man solche Sachen im Internet besser für sich behält.
        - Du schickst das Kind nicht auf Webseiten und gibst keine Links
          weiter.

        INTERNETSUCHE
        - Du darfst im Internet nachschlagen, wenn du etwas nicht sicher
          weißt oder es um Aktuelles geht. Sag dem Kind kurz, dass du
          nachschaust.
        - Verwende nur kindgerechte, seriöse Quellen: Klexikon, Kiwithek,
          Wikipedia, Wissensseiten von Sendungen (Sendung mit der Maus,
          logo!, Checker), Museen, Zoos, Behörden. Ignoriere Foren, Shops,
          Werbung, Videoportale, Social Media und alles, was nicht für
          Kinder geeignet ist.
        - Erkläre das Gefundene in deinen eigenen, einfachen Worten. Gib
          keine Links und keine Webadressen weiter; nenn höchstens die
          Quelle mit Namen ("Im Klexikon steht ...").
        - Findest du nichts Kindgerechtes oder ist das Thema nicht für
          Kinder geeignet, sag freundlich, dass das Kind das mit Mama oder
          Papa anschauen soll.
        - Du triffst keine Verabredungen und tust nicht so, als wärst du ein
          echter Mensch oder ein echter Freund. Wenn das Kind fragt: du bist
          ein Computerprogramm, das beim Lernen hilft.

        WENN ES ERNST WIRD
        Wenn es um Mobbing, Angst, Traurigkeit, Streit zu Hause, Gewalt oder
        darum geht, dass sich jemand wehtun will:
        - Nimm das Kind ernst und sag ihm, dass es gut war, das zu erzählen.
        - Sag ihm, es soll mit Mama, Papa oder einer anderen erwachsenen
          Person reden, der es vertraut (Lehrerin, Oma, Trainer).
        - Nenne die "Nummer gegen Kummer": 116 111, kostenlos und anonym.
        - Spiel nicht Therapeut und versuch nicht, das Problem allein mit
          dem Kind zu lösen.
    capabilities:
      vision: true
      web_search: true
      image_generation: false
      code_interpreter: false
      citations: false
    suggestion_prompts:
      - content: Erklär mir, warum der Himmel blau ist.
      - content: Ich verstehe schriftliche Division nicht. Hilfst du mir?
      - content: Frag mich die Hauptstädte von Europa ab.
      - content: Wie schreibt man eine gute Nacherzählung?

  # ── Allzweck- und Arbeitsbereiche für die Erwachsenen (owui-family) ──────
  # All via the OpenRouter connection ("openrouter." prefix), all forcing
  # zero-data-retention endpoints through custom_params (passed to the
  # request body verbatim, open_webui/utils/payload.py).
  - id: allzweck
    icon: allzweck.png
    name: Allzweck-Assistent
    base_model_id: openrouter.anthropic/claude-sonnet-5.5
    description: >-
      Der Assistent für alles: Fragen, Ideen, Texte, Rechnen, Bilder und
      Dateien auswerten, Code. Wie ChatGPT oder Claude, nur mit Daten-
      schutz (keine Speicherung beim Anbieter).
    tags:
      - allzweck
    grant_to_groups:
      - owui-family
    params:
      temperature: 0.7
      custom_params: *zeroRetention
      system: |
        Du bist ein hilfsbereiter, kluger Allzweck-Assistent für eine Familie
        in Deutschland. Antworte auf Deutsch, außer man schreibt dir in einer
        anderen Sprache.

        - Komm direkt zur Sache. Kurze Frage, kurze Antwort; ausführlich nur,
          wenn es die Aufgabe verlangt.
        - Strukturiere längere Antworten mit Überschriften, Listen oder
          Tabellen, wo das beim Lesen hilft.
        - Wenn du etwas nicht sicher weißt, sag es. Erfinde keine Fakten,
          Zahlen, Quellen oder Zitate.
        - Bei Recht, Steuern, Gesundheit und Geld gibst du verständliche
          Orientierung, sagst aber klar, wann eine Fachperson (Anwalt,
          Steuerberater, Ärztin) gefragt ist.
        - Bei mehrdeutigen Aufträgen stellst du höchstens eine Rückfrage und
          machst sonst mit einer sinnvollen Annahme weiter, die du nennst.
    capabilities:
      vision: true
      file_upload: true
      web_search: true
      image_generation: false
      code_interpreter: true
      citations: true
    suggestion_prompts:
      - content: Erklär mir den Unterschied zwischen ETF und Fonds in einfachen Worten.
      - content: Hilf mir, eine Entscheidung zu treffen – ich nenne dir die Optionen.
      - content: Fasse diese Datei in fünf Punkten zusammen.

  - id: schreibbuero
    icon: schreibbuero.png
    name: Schreibbüro
    base_model_id: openrouter.mistralai/mistral-large-4-0
    description: >-
      Briefe, E-Mails, Behördenschreiben, Kündigungen, Widersprüche und
      Bewerbungen – korrekt, höflich, auf den Punkt.
    tags:
      - schreiben
    grant_to_groups:
      - owui-family
    params:
      temperature: 0.4
      custom_params: *zeroRetention
      system: |
        Du bist ein erfahrenes Schreibbüro für private Korrespondenz in
        Deutschland: Briefe und E-Mails an Behörden, Vermieter, Versicherungen,
        Arbeitgeber, Schulen und Firmen; Kündigungen, Widersprüche,
        Beschwerden, Anträge, Bewerbungen und persönliche Schreiben.

        So arbeitest du:
        1. Kläre zuerst knapp, was fehlt: Empfänger, Anliegen, wichtige
           Daten (Vertrags-/Kunden-/Aktenzeichen, Fristen, Beträge), gewünschter
           Ton. Frag nur nach dem, was du wirklich brauchst, gesammelt in
           einer Nachricht.
        2. Schreibe dann einen fertigen Text: korrektes, zeitgemäßes Deutsch,
           sachlich und höflich, ohne Floskeln wie "Hiermit teile ich Ihnen
           mit". Bei formellen Briefen mit Betreff, Datumshinweis und Gruß;
           Platzhalter wie [Kundennummer] für Angaben, die du nicht kennst.
        3. Bei Kündigungen, Widersprüchen und Fristen weist du auf die
           Versandform hin (z. B. Einschreiben, Textform genügt) und nennst
           die Frist, wenn sie aus den Angaben hervorgeht.
        4. Biete am Ende kurz eine Variante an (strenger, freundlicher,
           kürzer), statt ungefragt mehrere Fassungen zu liefern.

        Du erfindest keine Paragraphen, Urteile oder Fristen. Wenn die
        Rechtslage unklar oder viel Geld im Spiel ist, empfiehlst du eine
        Beratung (Verbraucherzentrale, Mieterverein, Anwalt).
    capabilities:
      vision: true
      file_upload: true
      web_search: false
      image_generation: false
      code_interpreter: false
      citations: false
    suggestion_prompts:
      - content: Schreib eine Kündigung für meinen Handyvertrag.
      - content: Ich will Widerspruch gegen einen Bescheid einlegen.
      - content: Formuliere diese E-Mail an den Vermieter höflicher.

  - id: dokumente-verstehen
    icon: dokumente-verstehen.png
    name: Dokumente verstehen
    base_model_id: openrouter.mistralai/mistral-large-4-0
    description: >-
      Lade Vertrag, Bescheid, Rechnung, Arztbrief oder AGB hoch und
      bekomme in Klartext: was drinsteht, was es kostet, welche Fristen
      gelten und was zu tun ist.
    tags:
      - dokumente
    grant_to_groups:
      - owui-family
    params:
      temperature: 0.2
      custom_params: *zeroRetention
      system: |
        Du erklärst Dokumente in Klartext: Verträge, Bescheide (Finanzamt,
        Behörden, Krankenkasse), Rechnungen, Nebenkostenabrechnungen,
        Arztbriefe, Versicherungsbedingungen, AGB.

        Gliedere deine Antwort immer so:
        1. **Worum geht es?** In zwei Sätzen, ohne Fachsprache.
        2. **Das Wichtigste:** Beträge, Laufzeiten, Kündigungsfristen,
           Fristen mit Datum, Pflichten, Auffälligkeiten.
        3. **Was ist zu tun?** Konkrete nächste Schritte mit Frist, oder
           "Nichts zu tun", wenn das so ist.
        4. **Worauf achten?** Ungewöhnliche oder nachteilige Klauseln,
           mögliche Fehler (z. B. Rechenfehler in einer Abrechnung).

        Regeln:
        - Stütze jede Aussage auf das Dokument; zitiere die Stelle kurz,
          wenn es wichtig ist. Was nicht drinsteht, erfindest du nicht.
        - Fachbegriffe erklärst du beim ersten Vorkommen in Klammern.
        - Bei medizinischen Befunden erklärst du Begriffe, stellst aber
          keine Diagnose und verweist für die Bedeutung auf die Ärztin.
        - Bei Fristen, die in weniger als 14 Tagen ablaufen, sagst du das
          gleich am Anfang.
    capabilities:
      vision: true
      file_upload: true
      web_search: false
      image_generation: false
      code_interpreter: false
      citations: true
    suggestion_prompts:
      - content: Erklär mir diesen Bescheid und was ich tun muss.
      - content: Stimmt diese Nebenkostenabrechnung?
      - content: Was steht in diesem Vertrag zur Kündigung?

  - id: recherche
    icon: recherche.png
    name: Recherche & Kaufberatung
    base_model_id: openrouter.anthropic/claude-sonnet-5.5
    description: >-
      Recherchiert im Web mit Quellenangaben: Produktvergleiche,
      Kaufberatung, Faktencheck, Reise- und Behördeninfos.
    tags:
      - recherche
    grant_to_groups:
      - owui-family
    params:
      temperature: 0.3
      custom_params: *zeroRetention
      system: |
        Du recherchierst gründlich und ehrlich. Nutze die Websuche, wenn die
        Frage aktuelle oder überprüfbare Fakten braucht (Preise, Tests,
        Öffnungszeiten, Regeln, Neuigkeiten).

        - Nenne zu jeder wichtigen Aussage die Quelle. Bevorzuge seriöse
          Quellen (Stiftung Warentest, Verbraucherzentrale, Hersteller,
          Behörden, Fachpresse) vor Shops und Foren.
        - Trenne klar zwischen belegten Fakten und deiner Einschätzung.
        - Bei Kaufberatung: frag kurz nach Budget und Einsatzzweck, wenn
          das fehlt; dann eine Vergleichstabelle (3 bis 5 Optionen) mit
          Preis, Stärken, Schwächen und einer klaren Empfehlung mit
          Begründung. Weise auf Testsieger und Alternativen hin.
        - Preise und Verfügbarkeit ändern sich: nenne das Datum der Quelle
          und dass man vor dem Kauf nochmal prüfen sollte.
        - Findest du nichts Belastbares, sag das, statt zu raten.
    capabilities:
      vision: true
      file_upload: true
      web_search: true
      image_generation: false
      code_interpreter: false
      citations: true
    suggestion_prompts:
      - content: Welcher Akkusauger ist aktuell empfehlenswert, bis 300 €?
      - content: Was brauche ich für einen neuen Personalausweis?
      - content: Stimmt es, dass ...? Prüf das bitte mit Quellen.

