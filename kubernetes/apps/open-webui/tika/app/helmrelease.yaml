---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tika
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      tika:
        replicas: 1
        strategy: RollingUpdate
        containers:
          app:
            image:
              repository: apache/tika
              # renovate: datasource=docker depName=apache/tika
              tag: 3.3.1.0-full
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: 1000m
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
              runAsUser: 35002
              runAsGroup: 35002
              runAsNonRoot: true

    service:
      app:
        controller: tika
        ports:
          http:
            port: 9998

    persistence:
      tmp:
        type: emptyDir
        advancedMounts:
          tika:
            app:
              - path: /tmp
