---
# App state — SQLite db, config.toml (incl. the auto-generated [server] secret),
# uploads, logs. MUST persist or the admin account + settings reset on restart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: computer-data-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: zfs-nfs
  resources:
    requests:
      storage: 10Gi
---
# Workspace — the actual project files Computer works on (add /workspace as a
# workspace in the UI). Kept separate from app state so it can be sized/backed
# up independently.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: computer-workspace-pvc
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: zfs-nfs
  resources:
    requests:
      storage: 20Gi
