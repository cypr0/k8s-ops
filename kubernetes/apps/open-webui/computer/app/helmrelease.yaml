---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: computer
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      computer:
        replicas: 1
        # Single writer to the shared /data + /workspace PVCs; Computer is a
        # single-owner workstation, never run two pods at once.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/computer
              # renovate: datasource=docker depName=ghcr.io/open-webui/computer
              tag: 0.8.8
            env:
              # Image already runs `cptr run --host 0.0.0.0 --headless` and
              # sets CPTR_DATA_DIR=/data; only overrides below.
              TZ: Europe/Berlin
              # Only this origin may call the API from a browser (default is *).
              CPTR_CORS_ALLOWED_ORIGINS: https://computer.${SECRET_DOMAIN}
              # Record mutations (who changed what) — cheap audit trail given
              # this is an SSH-equivalent surface.
              CPTR_AUDIT_LOG_LEVEL: METADATA
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
                  initialDelaySeconds: 20
                  periodSeconds: 20
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 3
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
              limits:
                cpu: "4"
                memory: 4Gi
            # Runs as root: Computer is a full workstation (shell, file ops,
            # git, package installs) and writes the NFS-backed /data + /workspace
            # PVCs. Not externally reachable un-authed — the HTTPRoute is gated
            # by Authentik forward-auth (securitypolicy.yaml) on top of
            # Computer's own password auth.
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
              runAsGroup: 0

    defaultPodOptions:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist

    service:
      app:
        controller: computer
        ports:
          http:
            port: 8000

    persistence:
      data:
        existingClaim: computer-data-pvc
        globalMounts:
          - path: /data
      workspace:
        existingClaim: computer-workspace-pvc
        globalMounts:
          - path: /workspace
