---
# computer: single-owner browser workstation (Open WebUI Computer / cptr).
# Reachable only via the Authentik-gated HTTPRoute (envoy in the network ns)
# on :8000. Full internet egress: it runs AI agents (OpenRouter/model APIs),
# git clone, and package installs on behalf of the signed-in owner.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: computer
  namespace: open-webui
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: computer
  ingress:
    # Envoy gateway pods proxy the UI/API on :8000
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Full internet egress (model APIs, git, package installs, web search)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
