---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      ollama:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/ollama/ollama
              # renovate: datasource=docker depName=ollama/ollama
              tag: 0.32.0
            env:
              OLLAMA_HOST: "0.0.0.0:11434"
              # Model is ~4.7Gi (Q4_K_M) and lives on NFS - keep it resident so
              # paperless-ai's hourly cron doesn't pay a reload cost each run.
              OLLAMA_KEEP_ALIVE: "-1"
              OLLAMA_NUM_PARALLEL: "1"
              OLLAMA_MAX_LOADED_MODELS: "1"
            probes:
              liveness:
                enabled: true
                spec:
                  initialDelaySeconds: 30
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 60
                  periodSeconds: 10
            resources:
              requests:
                cpu: "2"
                memory: 6Gi
              limits:
                # cpu=3 throttled ~96% of CPU periods (cgroup cpu.stat:
                # nr_throttled/nr_periods) with the 7B model, tanking
                # inference to ~2 tok/s eval. Raised to 5 - the pod
                # anti-affinity below is now "preferred" (not required),
                # so a saturated run is much less likely to land on the
                # same node as CNPG/OpenSearch, and this is still capped
                # below the 6-vCPU worker total to leave room for it.
                cpu: "5"
                memory: 12Gi

        pod:
          # 14B-Q4 CPU inference is throughput-bound - prefer the 6-vCPU
          # workers over k8s-wrk-3 (only 4 vCPU) without hard-pinning to a
          # single node.
          affinity:
            nodeAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          - k8s-wrk-0
                          - k8s-wrk-1
                          - k8s-wrk-2
                          - k8s-wrk-3
            # Prefer not to share a node with CNPG Postgres or OpenSearch - a
            # saturated inference run shouldn't starve a database/search pod.
            # Soft preference only: with 4 workers and OpenSearch (3 masters)
            # + CNPG (3 replicas) already spread across all of them, a hard
            # "required" rule leaves zero schedulable nodes.
            podAntiAffinity:
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        cnpg.io/cluster: postgres
                    namespaces:
                      - database
                - weight: 100
                  podAffinityTerm:
                    topologyKey: kubernetes.io/hostname
                    labelSelector:
                      matchLabels:
                        opensearch.org/opensearch-cluster: opensearch
                    namespaces:
                      - logging

    service:
      app:
        controller: ollama
        ports:
          http:
            port: 11434

    persistence:
      data:
        existingClaim: ollama-pvc
        advancedMounts:
          ollama:
            app:
              - path: /root/.ollama
