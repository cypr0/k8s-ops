---
# IMAP credentials for the dmarc@${SECRET_DOMAIN} mailbox that receives DMARC
# aggregate reports.
#
# Required key in the existing 1Password item "mailu":
#   DMARC_MAILBOX_PASSWORD – password of the dmarc@${SECRET_DOMAIN} mailbox,
#                            created in Mailu on 2026-09-20. The mailbox exists
#                            only to receive reports; nothing sends from it.
#
# The whole exporter config is templated here rather than in a ConfigMap,
# because the file the exporter reads contains the password inline -- it has no
# way to take it from an environment variable.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dmarc-exporter-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: 1h
  target:
    name: dmarc-exporter-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # The cleanup CronJob speaks IMAP itself and needs the password on its
        # own; the exporter can only take it inline in its config file.
        imap-password: "{{ .DMARC_MAILBOX_PASSWORD }}"
        dmarc-metrics-exporter.json: |
          {
            "listen_addr": "0.0.0.0",
            "port": 9797,
            "imap": {
              "host": "mail.${SECRET_DOMAIN}",
              "port": 993,
              "username": "dmarc@${SECRET_DOMAIN}",
              "password": "{{ .DMARC_MAILBOX_PASSWORD }}",
              "use_ssl": true,
              "verify_certificate": true
            },
            "folders": {
              "inbox": "INBOX",
              "done": "Archive",
              "error": "Invalid"
            },
            "storage_path": "/var/lib/dmarc-metrics-exporter",
            "poll_interval_seconds": 900,
            "deduplication_max_seconds": 604800
          }
  dataFrom:
    - extract:
        key: mailu
