---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dmarc-exporter
  namespace: mail
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-stores
      namespace: security
    - name: csi-driver-nfs
      namespace: kube-system
  # No dependsOn mailu: this only reads a mailbox. Coupling it would mean losing
  # DMARC visibility exactly when the mail stack is unhealthy.
  interval: 1h
  path: ./kubernetes/apps/mail/dmarc-exporter/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: mail
  timeout: 5m
  wait: true
