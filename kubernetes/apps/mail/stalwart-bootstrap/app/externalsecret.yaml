---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: stalwart-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Consumed by config.json's DataStore.authSecret (EnvironmentVariable
        # type) — the CNPG role name itself is hardcoded "stalwartusr" in
        # kubernetes/apps/database/cloudnative-pg/cluster/cluster.yaml, same
        # pattern as every other app's dedicated Postgres role.
        STALWART_POSTGRESQL_PASSWORD: "{{ .STALWART_POSTGRESQL_PASSWORD }}"
        # Raw recovery password — consumed directly by job-bootstrap.yaml's
        # stalwart-cli container as STALWART_PASSWORD (the CLI's basic-auth
        # flag) when it applies the declarative plan against its own
        # temporary recovery-mode Stalwart sidecar in the same pod.
        STALWART_RECOVERY_PASSWORD: "{{ .STALWART_RECOVERY_PASSWORD }}"
        # Same value pre-combined as user:pass — this is Stalwart's required
        # STALWART_RECOVERY_ADMIN env format, set on both the bootstrap Job's
        # temporary sidecar (job-bootstrap.yaml) and permanently on the main
        # server Deployment (kubernetes/apps/mail/stalwart/app/helmrelease.yaml).
        # Per https://stalw.art/docs/configuration/recovery-mode, this
        # variable is honoured even outside recovery mode, so a future
        # config change can be applied by re-running the bootstrap Job
        # against the normal running server without a restart. Left set
        # permanently (the docs suggest removing it once initial setup is
        # done) — an acceptable trade-off for a private homelab instance;
        # STALWART_ADMIN_PASSWORD/mailbox credentials are unaffected either way.
        STALWART_RECOVERY_ADMIN: "admin:{{ .STALWART_RECOVERY_PASSWORD }}"
        # Real mailbox admin account (admin@${SECRET_DOMAIN}) created by the
        # bootstrap plan — this is the account for day-to-day WebUI/webmail
        # sign-in, distinct from the recovery backdoor above.
        STALWART_ADMIN_PASSWORD: "{{ .STALWART_ADMIN_PASSWORD }}"
        # Cloudflare API token (Zone:DNS:Edit) used by Stalwart itself for
        # the DNS-01 ACME challenge and automatic MX/SPF/DKIM/DMARC record
        # publication (see configmap-bootstrap-plan.yaml's DnsServer entry)
        # — same permission shape as the token already used by cert-manager/
        # cloudflare-dns, but issued as its own token rather than
        # decrypting/reusing their SOPS-committed value.
        STALWART_CLOUDFLARE_API_TOKEN: "{{ .STALWART_CLOUDFLARE_API_TOKEN }}"
  dataFrom:
    - extract:
        key: stalwart
