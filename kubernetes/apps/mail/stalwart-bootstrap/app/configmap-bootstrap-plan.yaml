---
# Declarative bootstrap plan for `stalwart-cli apply`
# (https://stalw.art/docs/configuration/declarative-deployments), run by
# job-bootstrap.yaml against a temporary recovery-mode Stalwart sidecar in
# the same pod (localhost:8080).
#
# Why this Job exists at all: config.json is always present (configmap.yaml)
# so Stalwart never shows the interactive setup wizard (that only triggers
# when config.json is *absent* — https://stalw.art/docs/configuration/
# bootstrap-mode). On a brand-new Postgres-backed deployment there are zero
# NetworkListener/Domain/SystemSettings rows until this plan creates them —
# and critically, with zero NetworkListener rows the *normal* server exposes
# no HTTP endpoint at all to reach the JMAP management API through, which is
# exactly the scenario recovery mode exists for (it always serves the
# management API on port 8080 regardless of listener config — see
# https://stalw.art/docs/configuration/recovery-mode).
#
# All operations are `upsert` (match-or-create, never delete) so re-running
# this Job after a future change is safe and idempotent — see
# https://stalw.art/docs/management/cli/apply/#idempotent-re-runs.
#
# __STALWART_ADMIN_PASSWORD__ is a plain sed placeholder (see
# job-bootstrap.yaml): the JMAP `Account.credentials[].secret` field is a
# literal string, not a SecretKey/EnvironmentVariable-style indirection, so
# the real password value is substituted into this file at apply time by the
# Job's shell script (sourced from the stalwart-secret Secret), never
# committed here.
#
# NOTE: matchOn keys below are best-effort from the schema reference
# (https://stalw.art/docs/ref/object/) — Domain/Account key on their real
# `name`/`domainId` fields; DnsServer keys on `description` (required
# field on the Cloudflare variant); AcmeProvider has no description field,
# so it keys on `contact`; NetworkListener's `name` is server-set
# (read-only), so it keys on `bind` instead (each listener's bind address is
# unique). Verify against a live server (`stalwart-cli describe <Object>`)
# if a re-apply ever behaves unexpectedly.
apiVersion: v1
kind: ConfigMap
metadata:
  name: stalwart-bootstrap-plan
data:
  plan.ndjson: |-
    {"@type":"upsert","object":"DnsServer","matchOn":["description"],"value":{"dns-cloudflare":{"@type":"Cloudflare","description":"Cloudflare (${SECRET_DOMAIN})","secret":{"@type":"EnvironmentVariable","variableName":"STALWART_CLOUDFLARE_API_TOKEN"}}}}
    {"@type":"upsert","object":"AcmeProvider","matchOn":["contact"],"value":{"acme-le":{"challengeType":"Dns01","contact":{"postmaster@${SECRET_DOMAIN}":true}}}}
    {"@type":"upsert","object":"Domain","matchOn":["name"],"value":{"domain-main":{"name":"${SECRET_DOMAIN}","aliases":{},"certificateManagement":{"@type":"Automatic","acmeProviderId":"#acme-le","subjectAlternativeNames":{}},"dkimManagement":{"@type":"Automatic"},"dnsManagement":{"@type":"Automatic","dnsServerId":"#dns-cloudflare"},"subAddressing":{"@type":"Enabled"}}}}
    {"@type":"upsert","object":"NetworkListener","matchOn":["bind"],"value":{"nl-smtp":{"name":"smtp","protocol":"smtp","bind":{"0.0.0.0:25":true}},"nl-submission":{"name":"submission","protocol":"smtp","bind":{"0.0.0.0:587":true}},"nl-submissions":{"name":"submissions","protocol":"smtp","bind":{"0.0.0.0:465":true},"tlsImplicit":true},"nl-imap":{"name":"imap","protocol":"imap","bind":{"0.0.0.0:143":true}},"nl-imaps":{"name":"imaps","protocol":"imap","bind":{"0.0.0.0:993":true},"tlsImplicit":true},"nl-pop3":{"name":"pop3","protocol":"pop3","bind":{"0.0.0.0:110":true}},"nl-pop3s":{"name":"pop3s","protocol":"pop3","bind":{"0.0.0.0:995":true},"tlsImplicit":true},"nl-managesieve":{"name":"managesieve","protocol":"manageSieve","bind":{"0.0.0.0:4190":true},"tlsImplicit":true},"nl-https":{"name":"https","protocol":"http","bind":{"0.0.0.0:443":true},"tlsImplicit":true}}}
    {"@type":"update","object":"SystemSettings","value":{"defaultHostname":"mail.${SECRET_DOMAIN}","defaultDomainId":"#domain-main"}}
    {"@type":"upsert","object":"Account","matchOn":["name","domainId"],"value":{"acct-admin":{"@type":"User","name":"admin","domainId":"#domain-main","credentials":{"0":{"@type":"Password","secret":"__STALWART_ADMIN_PASSWORD__"}},"roles":{"@type":"Admin"},"permissions":{"@type":"Inherit"},"quotas":{},"aliases":{},"memberGroupIds":{},"encryptionAtRest":{"@type":"Disabled"}}}}
