---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stalwart-bootstrap
  namespace: mail
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: stalwart-bootstrap
  # No ingress rules: the "apply" container talks to the recovery-mode
  # sidecar over 127.0.0.1 (both containers share the pod's network
  # namespace), which never leaves the pod and so is never evaluated by
  # Cilium's network policy enforcement.
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # PostgreSQL (the recovery-mode sidecar's DataStore/BlobStore/SearchStore)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Cloudflare DNS API (DnsServer upsert + DNS-01 propagation checks) and
    # the Let's Encrypt ACME directory — both plain HTTPS.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
