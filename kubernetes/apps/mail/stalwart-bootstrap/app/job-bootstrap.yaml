---
# One-shot declarative provisioning for Stalwart (domains, DKIM/ACME/DNS
# wiring, network listeners, the admin mailbox) — see configmap-bootstrap-plan
# .yaml's header comment for the full rationale and
# https://stalw.art/docs/configuration/declarative-deployments.
#
# Runs its OWN throwaway Stalwart instance as a restartable init container
# (sidecar) in recovery mode (https://stalw.art/docs/configuration/
# recovery-mode) against the same Postgres database the real server uses —
# recovery mode always serves the JMAP management API on :8080 regardless of
# how many (if any) NetworkListener rows exist yet, which a normally-started
# server cannot do on a brand-new database. Once the "apply" container
# finishes, Kubernetes stops the sidecar automatically (native sidecar
# containers, GA since Kubernetes 1.29 — this cluster runs v1.36).
#
# kustomize.toolkit.fluxcd.io/force: "enabled" makes Flux delete-and-recreate
# the Job whenever its spec changes (e.g. a plan.ndjson edit via the
# configMap's content, since that's inlined as an env/volume hash — see
# kubernetes/apps/open-webui/open-webui/app/tools/job-sync-tools.yaml for the
# same pattern), so pushing a bootstrap-plan change re-runs it automatically.
#
# reloader.stakater.com/auto: "true" additionally makes Reloader (kube-system
# /reloader) delete+recreate this Job whenever any Secret/ConfigMap it
# actually references changes CONTENT without a spec change — e.g. a
# password rotation in the 1Password "stalwart" item flowing through
# ExternalSecret into stalwart-secret, or a config.json/plan edit. Reloader
# auto-discovers stalwart-secret (envFrom on stalwart-recovery),
# stalwart-config and stalwart-bootstrap-plan (mounted volumes) — no named
# secret.reloader.stakater.com/reload annotations needed. Unlike Deployments,
# Reloader recreates Jobs (ReCreateJobFromjob: delete then create with the
# same spec, stripping resourceVersion/uid/status/controller labels) rather
# than patching a pod template, since Jobs are immutable — this re-run is
# always safe because the bootstrap plan uses upsert/matchOn semantics.
apiVersion: batch/v1
kind: Job
metadata:
  name: stalwart-bootstrap
  annotations:
    kustomize.toolkit.fluxcd.io/force: "enabled"
    reloader.stakater.com/auto: "true"
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stalwart-bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: stalwart-recovery
          restartPolicy: Always
          image: ghcr.io/stalwartlabs/stalwart:v0.16.18
          args:
            - --config
            - /etc/stalwart/config.json
          env:
            - name: STALWART_RECOVERY_MODE
              value: "1"
          envFrom:
            - secretRef:
                name: stalwart-secret
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            runAsGroup: 2000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
              # The stalwart binary carries a cap_net_bind_service *file*
              # capability (setcap) to bind :443/etc. without root — see
              # https://stalw.art/docs/install/platform/docker/. Dropping
              # ALL removes it from the container's bounding set, which
              # makes the kernel refuse to honor the file capability at
              # exec time ("operation not permitted"), per that same page:
              # "Starting the container with --cap-drop NET_BIND_SERVICE
              # causes the binary to fail at exec time." Must be added back
              # explicitly even though this recovery sidecar itself never
              # binds a listener (recovery mode only serves :8080).
              add:
                - NET_BIND_SERVICE
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 3
            failureThreshold: 20
          volumeMounts:
            - name: config
              mountPath: /etc/stalwart/config.json
              subPath: config.json
              readOnly: true
            - name: data
              mountPath: /var/lib/stalwart
      containers:
        - name: apply
          # Official stalwart-cli image — speaks JMAP only, no separate
          # install step needed (see https://stalw.art/docs/management/cli/#installation).
          image: ghcr.io/stalwartlabs/cli:1.0.12
          env:
            - name: STALWART_URL
              value: "http://127.0.0.1:8080"
            - name: STALWART_USER
              value: "admin"
            - name: STALWART_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-secret
                  key: STALWART_RECOVERY_PASSWORD
            - name: STALWART_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stalwart-secret
                  key: STALWART_ADMIN_PASSWORD
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          command:
            - "sh"
            - "-c"
          args:
            - |
              set -eu
              echo "Waiting for recovery-mode Stalwart on :8080..."
              attempts=0
              until wget -q -O /dev/null http://127.0.0.1:8080/api/schema 2>/dev/null; do
                attempts=$((attempts + 1))
                if [ "$attempts" -ge 60 ]; then echo "ERROR: Stalwart recovery API never came up"; exit 1; fi
                sleep 2
              done
              echo "Stalwart recovery API is up. Rendering plan..."
              sed "s/__STALWART_ADMIN_PASSWORD__/$STALWART_ADMIN_PASSWORD/" /plan/plan.ndjson > /tmp/plan.ndjson
              echo "Applying declarative plan..."
              stalwart-cli apply --file /tmp/plan.ndjson --json
              echo "Bootstrap plan applied successfully."
          volumeMounts:
            - name: plan
              mountPath: /plan
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: stalwart-config
        - name: plan
          configMap:
            name: stalwart-bootstrap-plan
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
