---
# Secret-URL .ics feeds for two private Radicale calendars.
#
# Required 1Password item "calendar-public" (all fields in the repo-external
# item, nothing about the mailboxes lives in this public repo):
#   FEED_1_USERNAME   – full address of the mailbox that owns calendar 1
#   FEED_1_COLLECTION – Radicale collection id of calendar 1 (the UUID directory
#                       under that mailbox's home, see docs/apps/calendar-public.md)
#   FEED_2_USERNAME / FEED_2_COLLECTION – same for calendar 2
#
# The URL tokens are generated here, not stored in 1Password: `refreshPolicy:
# CreatedOnce` keeps them stable after the first sync (a re-sync would change
# every subscriber's URL). To rotate, delete the Secret; the ExternalSecret
# regenerates it. Reading the URLs is described in the app's docs.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: calendar-public-token
spec:
  length: 40
  digits: 10
  symbols: 0
  symbolCharacters: ""
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: calendar-public
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshPolicy: CreatedOnce
  target:
    name: calendar-public-nginx
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Only what carries a secret lives here (tokens, mailbox, collection
        # id). Everything else is in configmap.yaml, so changing it does not
        # regenerate the tokens (CreatedOnce).
        default.conf: |
          include /etc/nginx/feed/http.conf;

          server {
            listen 8080;
            server_name _;
            include /etc/nginx/feed/server.conf;

            location = /{{ .FEED_1_TOKEN }}.ics {
              include /etc/nginx/feed/location.conf;
              proxy_pass http://mailu-webdav.mail.svc.cluster.local:5232/{{ .FEED_1_USERNAME }}/{{ .FEED_1_COLLECTION }}/;
              proxy_set_header X-Remote-User "{{ .FEED_1_USERNAME }}";
            }

            location = /{{ .FEED_2_TOKEN }}.ics {
              include /etc/nginx/feed/location.conf;
              proxy_pass http://mailu-webdav.mail.svc.cluster.local:5232/{{ .FEED_2_USERNAME }}/{{ .FEED_2_COLLECTION }}/;
              proxy_set_header X-Remote-User "{{ .FEED_2_USERNAME }}";
            }

            location / {
              return 404;
            }
          }
  dataFrom:
    - extract:
        key: calendar-public
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: calendar-public-token
      rewrite:
        - regexp:
            source: "password"
            target: "FEED_1_TOKEN"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: calendar-public-token
      rewrite:
        - regexp:
            source: "password"
            target: "FEED_2_TOKEN"
