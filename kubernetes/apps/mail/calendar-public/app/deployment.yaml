---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: calendar-public
  labels:
    app.kubernetes.io/name: calendar-public
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: calendar-public
  template:
    metadata:
      labels:
        app.kubernetes.io/name: calendar-public
      annotations:
        secret.reloader.stakater.com/reload: "calendar-public-nginx"
        configmap.reloader.stakater.com/reload: "calendar-public-nginx-static"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          # renovate: datasource=docker depName=nginxinc/nginx-unprivileged
          image: nginxinc/nginx-unprivileged:1.31.7-alpine
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: static
              mountPath: /etc/nginx/feed
              readOnly: true
            - name: static
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
      volumes:
        - name: config
          secret:
            secretName: calendar-public-nginx
            defaultMode: 0440
        - name: static
          configMap:
            name: calendar-public-nginx-static
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: calendar-public
  labels:
    app.kubernetes.io/name: calendar-public
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: calendar-public
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
