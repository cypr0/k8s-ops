---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mailu
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: mailu-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Flask session-cookie signing key (helmrelease.yaml's top-level
        # `existingSecret`, consumed under the `secret-key` key per the
        # chart's values.yaml documentation).
        secret-key: "{{ .MAILU_SECRET_KEY }}"
        # Initial admin mailbox (admin@${SECRET_DOMAIN}) created declaratively
        # by helmrelease.yaml's `initialAccount` block.
        initial-admin-password: "{{ .MAILU_INITIAL_ADMIN_PASSWORD }}"
        # CNPG role for the `admin` component's own database — the role/DB
        # itself is provisioned in kubernetes/apps/database/cloudnative-pg/
        # (managed role "mailuusr" + Database "mailudb"); this is the same
        # password materialized into the mail namespace so helmrelease.yaml's
        # `externalDatabase.existingSecret` can reference it (Secret data
        # can't be read cross-namespace).
        mailu-db-database: "mailudb"
        mailu-db-username: "mailuusr"
        mailu-db-password: "{{ .MAILU_POSTGRESQL_PASSWORD }}"
        # Same pattern for Roundcube's own CNPG role ("roundcubeusr" /
        # "roundcubedb") — see helmrelease.yaml's `global.database.roundcube`.
        roundcube-db-password: "{{ .ROUNDCUBE_POSTGRESQL_PASSWORD }}"
  dataFrom:
    - extract:
        key: mailu
