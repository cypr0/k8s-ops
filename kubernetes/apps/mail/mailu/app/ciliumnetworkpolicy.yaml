---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mailu
  namespace: mail
spec:
  # Every Mailu-chart pod (front/admin/postfix/dovecot/rspamd/clamav/webmail)
  # carries this label regardless of its `app.kubernetes.io/component` value
  # (chart's templates/_labels.tpl: `app.kubernetes.io/name` is the chart
  # name, `app.kubernetes.io/instance` is the Helm release name — both fixed
  # as "mailu" here). All probes across every component are exec-based
  # (curl-to-127.0.0.1 from inside the container, see e.g.
  # templates/front/deployment.yaml), so unlike Stalwart's TCP probes this
  # needs no `fromEntities: host` allowance for kubelet.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mailu
  ingress:
    # Raw mail protocols only — front is this app's own public ingress
    # (dedicated LoadBalancer IP, see helmrelease.yaml's
    # front.externalService) since these aren't HTTP and can't go through
    # Envoy Gateway/Cloudflare Tunnel, so "world" ingress on these ports is
    # the point. Matches front.externalService.ports:
    # smtp/smtps/submission/imaps/manageSieve enabled, pop3/pop3s/imap
    # deliberately left off (see helmrelease.yaml's comment on that choice).
    # 443 (webmail/admin) is NOT here — see the cloudflare-tunnel rule below.
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
            - port: "587"
              protocol: TCP
            - port: "465"
              protocol: TCP
            - port: "993"
              protocol: TCP
            - port: "4190"
              protocol: TCP
    # webmail.${SECRET_DOMAIN} (443/HTTPS): two parallel paths, both terminate
    # at this same pod. From the public internet: the Cloudflare Tunnel
    # (gets Cloudflare's DDoS/WAF protection, keeps this cluster's public IP
    # out of DNS for that hostname) — see kubernetes/apps/network/
    # cloudflare-tunnel/app/helmrelease.yaml's config.yaml ingress list and
    # that app's ciliumnetworkpolicy.yaml. From the home/office LAN: directly
    # via service-front-webmail-lan.yaml's LoadBalancer Service (same IP as
    # mailu-front-ext), so LAN clients don't round-trip through Cloudflare —
    # restricted to the actual client CIDRs rather than `world`, since
    # nothing stops that Service's IP from being routable from anywhere that
    # can reach 192.168.10.0/24.
    #
    # 10.10.0.2/32 was the WireGuard tunnel interface's own address on the
    # OPNsense side — OPNsense used to masquerade office-LAN clients' traffic
    # to that address before it entered the site-to-site tunnel into the
    # Proxmox network, confirmed live via `cilium monitor --to <mailu-front
    # endpoint>` at the time. That masquerade no longer happens: re-confirmed
    # live via `hubble observe --ip 192.168.10.105` on 2026-09-01, office-LAN
    # connections now arrive with their real 192.168.40.x source and were
    # being dropped as `world` until this was widened. Kept 10.10.0.2/32
    # alongside the real CIDR in case OPNsense's NAT behavior reverts or
    # varies by path -- harmless to allow both. If OPNsense's WireGuard
    # config changes again, re-check with hubble before assuming either
    # form still applies.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: cloudflare-tunnel
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - fromCIDR:
        - "192.168.10.0/24"
        - "192.168.40.0/24"
        - "10.10.0.2/32"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Same namespace: front<->postfix/dovecot/admin proxying, rspamd<->clamav
    # milter/antivirus calls, admin/rspamd<->mailu-redis, dovecot<->rspamd
    # (Sieve), etc. — the chart wires these components together internally
    # and enumerating every internal port precisely isn't worth the
    # fragility; same pattern as nextcloud's own CiliumNetworkPolicy for its
    # multi-container release.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": mail
    # paperless-ngx's IMAP mail-fetch integration (kubernetes/apps/paperless/
    # paperless-ngx/), migrated off its old external Netcup mailbox onto this
    # in-cluster instance. CoreDNS resolves mail.${SECRET_DOMAIN} straight to
    # this Service's ClusterIP for in-cluster clients (see
    # kubernetes/apps/kube-system/coredns/app/helmrelease.yaml), which is a
    # real cluster-internal identity, not `world` — needs its own rule
    # despite the fromEntities:world rule above already covering 993.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": paperless
            app.kubernetes.io/name: paperless
      toPorts:
        - ports:
            - port: "993"
              protocol: TCP
    # Gatus health check (front's ClusterIP Service, mailu-front:443 --
    # verified live against the actual Service, distinct from the
    # mailu-front-ext/mailu-front-webmail-lan LoadBalancer Services above)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: gatus
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # mailu-mcp (kubernetes/apps/hermes-agent/mailu-mcp/), replacing the
    # former sogo-mcp: IMAP (read-only mailbox tools) + CalDAV (front's
    # /webdav/ path, proxying Radicale) for both the owner's and Ann's
    # mailboxes. Same in-cluster-via-public-hostname reasoning as the
    # paperless-ngx rule above.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": hermes-agent
            app.kubernetes.io/name: mailu-mcp
      toPorts:
        - ports:
            - port: "993"
              protocol: TCP
            - port: "443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # PostgreSQL (admin + roundcube databases, see
    # kubernetes/apps/database/cloudnative-pg/databases/database-mailu.yaml
    # and database-roundcube.yaml)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Same namespace (see ingress rule above for rationale)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": mail
    # External: outbound SMTP delivery to remote mail exchangers, and
    # ClamAV's freshclam virus-database updates (HTTP/HTTPS mirrors).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
