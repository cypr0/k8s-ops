---
# Direct-to-tunnel DNS record for webmail.${SECRET_DOMAIN} — same pattern as
# kubernetes/apps/network/cloudflare-tunnel/app/dnsendpoint.yaml (CNAME
# straight to the tunnel). Needed because this hostname doesn't go through
# envoy-external (see ciliumnetworkpolicy.yaml's cloudflare-tunnel ingress
# rule and cloudflare-tunnel's helmrelease.yaml routing it straight to
# mailu-front), so it never picks up a DNS record automatically the way an
# HTTPRoute-based hostname on envoy-external would (external-dns's
# "gateway-httproute" source) — the "crd" source (this DNSEndpoint) is the
# other half of that same external-dns instance, for exactly this case.
#
# mail.${SECRET_DOMAIN}'s own A record is declared here too, for the same
# reason: it doesn't go through Envoy/the Tunnel either (raw mail ports, see
# ciliumnetworkpolicy.yaml's world-facing rule), so nothing else creates it.
# Deliberately NOT proxied (cloudflare-proxied: "false" providerSpecific
# override) despite cloudflare-dns's chart-wide --cloudflare-proxied default
# — Cloudflare's proxy can't carry raw SMTP, and the MX record needs a real
# A record pointing at this cluster's actual public IP. Verified live:
# PTR for that IP already correctly resolves to mail.${SECRET_DOMAIN}; only
# the forward A record was missing. The IP itself lives in
# kubernetes/components/sops/cluster-secrets.sops.yaml
# (SECRET_MAIL_PUBLIC_IP) rather than as a plaintext literal here, same
# treatment as SECRET_SECOND_DOMAIN.
#
# providerSpecific key prefix is "external-dns.alpha.kubernetes.io/", NOT
# "external-dns.kubernetes.io/" (the latter is master/HEAD's renamed
# constant, introduced after v0.21.0 -- confirmed against the actual
# external-dns image tag this cluster runs, source/annotations/annotations.go
# at the v0.21.0 tag). Getting this wrong doesn't error, it's just silently
# ignored -- confirmed live: the record was created proxied despite the
# override, and external-dns then looped re-issuing an identical no-op
# UPDATE every reconcile forever, since its computed desired state and
# Cloudflare's actual state never converged.
#
# ${SECRET_SECOND_DOMAIN}'s mail records (DKIM/DMARC/autoconfig/
# autodiscover below) were generated from Mailu's own Admin UI DNS tab for
# that domain (Domain > Details). They replace the old Netcup/
# webhosting.systems MX+SPF+DKIM-CNAME records for that domain, which were
# deleted directly via the Cloudflare API (real conflicts: a second MX would
# split-brain inbound delivery, and a second SPF TXT is invalid per RFC 7208
# -- with adkim=s/aspf=s strict DMARC alignment already set, that could have
# caused ALL mail to be rejected).
#
# Two categories of that same record set are deliberately NOT declared here,
# both confirmed live against this exact external-dns v0.21.0 + Cloudflare
# + crd-source combination, both created directly via the Cloudflare API
# instead as one-off exceptions to GitOps:
#   - MX and the bare-apex SPF TXT (both at "${SECRET_SECOND_DOMAIN}"
#     itself, no subdomain): silently never applied, zero log output, no
#     error. Isolated via a standalone throwaway DNSEndpoint containing only
#     the MX entry -- still nothing. The reproducible pattern: every record
#     at a bare zone apex of a *secondary* filtered domain (this zone's
#     apex, not ${SECRET_DOMAIN}'s) failed silently, while every subdomain
#     record (DKIM, DMARC, both CNAMEs) succeeded normally. Consistent with
#     a known category of external-dns domain-filter bugs where suffix
#     matching requires a leading "." and so never matches the bare filtered
#     domain itself -- not confirmed against this version's exact source,
#     but the apex-vs-subdomain split is unambiguous from what was observed.
#   - The SRV records Mailu also recommends (_submission._tcp etc.):
#     external-dns v0.21.0's Cloudflare provider has no working SRV support
#     at all (confirmed live against Cloudflare's API directly -- it
#     requires structured priority/weight/port/target fields, but this
#     provider version only ever sends a flat content string, which
#     Cloudflare rejects).
# All of the above are static records that essentially never change, so
# living outside GitOps is an acceptable one-off trade-off rather than
# something to keep re-litigating.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: mailu
spec:
  endpoints:
    - dnsName: "webmail.${SECRET_DOMAIN}"
      recordType: CNAME
      targets:
        - "f768b542-3a28-4fa6-b132-daa8e38b2658.cfargotunnel.com"
    - dnsName: "mail.${SECRET_DOMAIN}"
      recordType: A
      targets:
        - "${SECRET_MAIL_PUBLIC_IP}"
      providerSpecific:
        - name: external-dns.alpha.kubernetes.io/cloudflare-proxied
          value: "false"
    # ${SECRET_DOMAIN}'s own DKIM, from Mailu's Admin UI DNS tab for this
    # (primary) domain -- was missing entirely, unlike MX/SPF/DMARC/PTR
    # which predate this Mailu deployment. A subdomain of the *primary*
    # filtered domain, so unaffected by the bare-apex bug described below.
    - dnsName: "dkim._domainkey.${SECRET_DOMAIN}"
      recordType: TXT
      targets:
        - "v=DKIM1; k=rsa; "
    - dnsName: "dkim._domainkey.${SECRET_SECOND_DOMAIN}"
      recordType: TXT
      targets:
        - "v=DKIM1; k=rsa; "
    - dnsName: "_dmarc.${SECRET_SECOND_DOMAIN}"
      recordType: TXT
      targets:
        - "v=DMARC1; p=reject; adkim=s; aspf=s"
    # Cross-domain DMARC reporting authorization -- lives under
    # ${SECRET_DOMAIN}'s own zone (it's *this* domain authorizing reports
    # for ${SECRET_SECOND_DOMAIN} to reference it), not the portfolio
    # domain's zone. Only meaningful once a rua= is actually set, but Mailu
    # generates it defensively regardless.
    - dnsName: "${SECRET_SECOND_DOMAIN}._report._dmarc.${SECRET_DOMAIN}"
      recordType: TXT
      targets:
        - "v=DMARC1;"
    - dnsName: "autoconfig.${SECRET_SECOND_DOMAIN}"
      recordType: CNAME
      targets:
        - "mail.${SECRET_DOMAIN}"
    - dnsName: "autodiscover.${SECRET_SECOND_DOMAIN}"
      recordType: CNAME
      targets:
        - "mail.${SECRET_DOMAIN}"
    # ${SECRET_THIRD_DOMAIN} -- second personal domain added to Mailu,
    # same treatment as ${SECRET_SECOND_DOMAIN} above: generated from
    # Mailu's own Admin UI DNS tab for this domain. Same two record
    # categories (MX + bare-apex SPF TXT, and the _submission/_submissions/
    # _imaps SRV records) are deliberately NOT declared here for the same
    # reasons documented in the header comment, and were created directly
    # via the Cloudflare API instead.
    - dnsName: "dkim._domainkey.${SECRET_THIRD_DOMAIN}"
      recordType: TXT
      targets:
        - "v=DKIM1; k=rsa; "
    - dnsName: "_dmarc.${SECRET_THIRD_DOMAIN}"
      recordType: TXT
      targets:
        - "v=DMARC1; p=reject; adkim=s; aspf=s"
    - dnsName: "${SECRET_THIRD_DOMAIN}._report._dmarc.${SECRET_DOMAIN}"
      recordType: TXT
      targets:
        - "v=DMARC1;"
    - dnsName: "autoconfig.${SECRET_THIRD_DOMAIN}"
      recordType: CNAME
      targets:
        - "mail.${SECRET_DOMAIN}"
    - dnsName: "autodiscover.${SECRET_THIRD_DOMAIN}"
      recordType: CNAME
      targets:
        - "mail.${SECRET_DOMAIN}"
    # ${SECRET_FOURTH_DOMAIN} -- third personal domain added to Mailu, same
    # treatment as ${SECRET_SECOND_DOMAIN}/${SECRET_THIRD_DOMAIN} above.
    - dnsName: "dkim._domainkey.${SECRET_FOURTH_DOMAIN}"
      recordType: TXT
      targets:
        - "v=DKIM1; k=rsa; "
    - dnsName: "_dmarc.${SECRET_FOURTH_DOMAIN}"
      recordType: TXT
      targets:
        - "v=DMARC1; p=reject; adkim=s; aspf=s"
    - dnsName: "${SECRET_FOURTH_DOMAIN}._report._dmarc.${SECRET_DOMAIN}"
      recordType: TXT
      targets:
        - "v=DMARC1;"
    - dnsName: "autoconfig.${SECRET_FOURTH_DOMAIN}"
      recordType: CNAME
      targets:
        - "mail.${SECRET_DOMAIN}"
    - dnsName: "autodiscover.${SECRET_FOURTH_DOMAIN}"
      recordType: CNAME
      targets:
        - "mail.${SECRET_DOMAIN}"
    # ${SECRET_FIFTH_DOMAIN} -- fourth personal domain added to Mailu, same
    # treatment as ${SECRET_SECOND_DOMAIN}/${SECRET_THIRD_DOMAIN}/
    # ${SECRET_FOURTH_DOMAIN} above.
    - dnsName: "dkim._domainkey.${SECRET_FIFTH_DOMAIN}"
      recordType: TXT
      targets:
        - "v=DKIM1; k=rsa; "
    - dnsName: "_dmarc.${SECRET_FIFTH_DOMAIN}"
      recordType: TXT
      targets:
        - "v=DMARC1; p=reject; adkim=s; aspf=s"
    - dnsName: "${SECRET_FIFTH_DOMAIN}._report._dmarc.${SECRET_DOMAIN}"
      recordType: TXT
      targets:
        - "v=DMARC1;"
    - dnsName: "autoconfig.${SECRET_FIFTH_DOMAIN}"
      recordType: CNAME
      targets:
        - "mail.${SECRET_DOMAIN}"
    - dnsName: "autodiscover.${SECRET_FIFTH_DOMAIN}"
      recordType: CNAME
      targets:
        - "mail.${SECRET_DOMAIN}"
