---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mail
resources:
  - ./helmrepository.yaml
  - ./ocirepository.yaml
  - ./externalsecret.yaml
  - ./certificate.yaml
  - ./dnsendpoint.yaml
  - ./helmrelease-redis.yaml
  - ./ciliumnetworkpolicy-redis.yaml
  - ./helmrelease.yaml
  - ./service-front-webmail-lan.yaml
  - ./ciliumnetworkpolicy.yaml
  - ./ciliumnetworkpolicy-rspamd.yaml

# Fixed name (no hash suffix): it's referenced from inside the HelmRelease's
# values, which kustomize can't rewrite. A change to the file therefore does
# NOT restart rspamd by itself -- bump rspamd.podAnnotations'
# config-revision in helmrelease.yaml alongside it.
configMapGenerator:
  - name: mailu-rspamd-unbound
    files:
      - unbound.conf=rspamd-unbound.conf
    options:
      disableNameSuffixHash: true
