# Recursive resolver for rspamd only -- runs as a native sidecar in the
# rspamd pod (see helmrelease.yaml's rspamd.initContainers for why rspamd
# must not use cluster DNS). Listens on loopback only, so nothing outside
# the pod can use it as a resolver.
server:
  verbosity: 1
  logfile: ""
  pidfile: ""
  chroot: ""
  do-daemonize: no
  # The container already runs as the image's unbound user (uid 101), so
  # there is nothing to drop privileges to.
  username: ""
  directory: "/etc/unbound"
  interface: 127.0.0.1
  access-control: 127.0.0.0/8 allow
  do-ip4: yes
  do-ip6: no
  do-udp: yes
  do-tcp: yes
  root-hints: "/etc/unbound/root.hints"
  # Static root trust anchors instead of the image's RFC 5011
  # auto-trust-anchor-file: the one baked into ghcr.io/mailu/unbound only
  # trusts KSK-2017 (KSK-2024 is still ADDPEND there), so it has failed
  # every DNSSEC validation since the 2026-10-11 root KSK rollover --
  # confirmed live 2026-10-17 ("failed to prime trust anchor"). Both DS
  # records copied from https://data.iana.org/root-anchors/root-anchors.xml.
  # Static anchors don't follow future rollovers on their own: the next one
  # is years out, and when IANA announces it, add its DS line here.
  trust-anchor: ". DS 20326 8 2 E06D44B80B8F1D39A95C0B0D7C65D08458E880409BBC683457104237C7F8EC8D"
  trust-anchor: ". DS 38696 8 2 683D2D0ACB8C9B712A1948B27F741219298D0A450D612C483AF444A4C0FB2B16"
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes
  prefetch: yes
  # Same floor Mailu's own resolver uses: keeps the query rate against the
  # free Spamhaus/URIBL/SURBL mirrors low.
  cache-min-ttl: 300
  domain-insecure: "cluster.local"

# rspamd's config addresses Redis, ClamAV, oletools and the admin API's
# local-domains map by Service name and resolves them through this
# resolver too. unbound opens a fresh socket per upstream query, so a
# CoreDNS rollout can't strand it the way it stranded rspamd.
forward-zone:
  name: "cluster.local."
  forward-addr: 10.43.0.10
