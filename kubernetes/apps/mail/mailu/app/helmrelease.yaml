---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mailu
spec:
  interval: 1h
  chart:
    spec:
      chart: mailu
      version: 2.8.0
      sourceRef:
        kind: HelmRepository
        name: mailu
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # NOT wiring up Reloader (kube-system/reloader) here: this chart's only
    # blanket annotation knob is `commonAnnotations`, which — unlike other
    # charts in this repo that expose a narrower `deploymentAnnotations`
    # (e.g. kubernetes/apps/security/authentik/app/helmrelease.yaml) —
    # applies to *every* templated resource, including the `clamav`
    # StatefulSet's `volumeClaimTemplates[].metadata`. Kubernetes forbids
    # changing volumeClaimTemplates after creation, so setting
    # commonAnnotations here permanently breaks every future `helm upgrade`
    # (confirmed live: "Forbidden: updates to statefulset spec for fields
    # other than 'replicas', ..."). A future 1Password password rotation in
    # mailu-secret needs a manual `kubectl rollout restart` for the affected
    # component(s) instead of an automatic one.
    hostnames:
      # First entry is the primary mail hostname (MX/SMTP/IMAP) — keep it
      # first. webmail.${SECRET_DOMAIN} is the Cloudflare-Tunnel-routed
      # hostname for webmail/admin (see cloudflare-tunnel's helmrelease.yaml
      # and this app's ciliumnetworkpolicy.yaml); front's nginx needs it
      # listed here to actually serve that Host header.
      - "mail.${SECRET_DOMAIN}"
      - "webmail.${SECRET_DOMAIN}"
    domain: "${SECRET_DOMAIN}"
    timezone: "Europe/Berlin"

    # Flask session-cookie signing key — see externalsecret.yaml.
    existingSecret: mailu-secret

    initialAccount:
      enabled: true
      username: admin
      domain: "${SECRET_DOMAIN}"
      existingSecret: mailu-secret
      existingSecretPasswordKey: initial-admin-password
      # "ifmissing" (not the chart's default "update"): only ever creates
      # this account once. "update" would reset admin@${SECRET_DOMAIN}'s
      # password back to this secret's value on every reconcile/upgrade,
      # clobbering a password changed later via the admin UI.
      mode: ifmissing

    limits:
      # Defaults (60/hour per IP, 100/day per user, 200/day per message
      # sender) are already a reasonable brute-force/compromised-account
      # baseline — left unchanged.
      messageSizeLimitInMegabytes: 50

    tls:
      # Defer instead of silently falling back to plaintext when an
      # opportunistic-TLS negotiation fails outbound — the message is
      # retried later rather than sent in the clear. outboundLevel/
      # inboundEnforce are deliberately left at chart defaults ("may"):
      # forcing strict inbound TLS would bounce mail from correspondents
      # whose servers don't speak TLS reliably, which is a deliverability
      # regression, not a security win, for a small self-hosted domain.
      deferOnError: true

    # Two CNPG-backed Postgres databases (mailuusr/mailudb, roundcubeusr/
    # roundcubedb — see kubernetes/apps/database/cloudnative-pg/databases/)
    # instead of the chart's optional bundled MariaDB/PostgreSQL, which pull
    # `bitnamilegacy/*` images (Bitnami's Aug-2025 registry restructuring) —
    # matches every other app in this repo.
    mariadb:
      enabled: false
    postgresql:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      host: postgres-rw.database.svc.cluster.local
      port: 5432
      database: mailudb
      username: mailuusr
      existingSecret: mailu-secret
      existingSecretDatabaseKey: mailu-db-database
      existingSecretUsernameKey: mailu-db-username
      existingSecretPasswordKey: mailu-db-password
    global:
      database:
        roundcube:
          database: roundcubedb
          username: roundcubeusr
          existingSecret: mailu-secret
          existingSecretPasswordKey: roundcube-db-password

    # Dedicated, unauthenticated Redis (helmrelease-redis.yaml) instead of
    # the chart's bundled Bitnami Redis subchart — same `bitnamilegacy`
    # image-provenance reasoning as the database above. Mailu's own
    # `externalRedis` has no password/auth field at all (confirmed against
    # the chart's values.yaml), so this Redis is only as safe as the
    # CiliumNetworkPolicy locking it to the mail namespace
    # (ciliumnetworkpolicy-redis.yaml) — same trust model the chart's own
    # bundled Redis would have had.
    redis:
      enabled: false
    externalRedis:
      enabled: true
      host: mailu-redis.mail.svc.cluster.local
      port: 6379

    persistence:
      # Chart default is a single RWO PVC, which node-locks every Mailu pod
      # to whichever node first claims it. zfs-nfs (NFS-backed) already
      # serves ReadWriteMany to several other apps in this cluster, so using
      # it here avoids that node-pinning entirely.
      single_pvc: true
      size: 20Gi
      accessModes:
        - ReadWriteMany
      storageClass: zfs-nfs

    # No chart-managed Ingress: mail protocols aren't HTTP, so this can't go
    # through Envoy Gateway/Cloudflare Tunnel like the rest of the cluster —
    # same reasoning Stalwart's own dedicated LoadBalancer had. cert-manager
    # (not Mailu) owns the ACME flow; front mounts that secret directly
    # regardless of `ingress.enabled` (chart's `certificatesSecretName`
    # helper resolves `ingress.existingSecret` unconditionally).
    ingress:
      enabled: false
      existingSecret: mailu-tls
      tlsFlavorOverride: mail

    front:
      # DaemonSet (one front pod per worker node), not the chart's default
      # single-replica Deployment. Required for externalTrafficPolicy: Local
      # (see below) to actually work: Cilium's L2-announcement leader
      # election for the LoadBalancer IPs picks a node independently of
      # where front's pod(s) run, and with only one replica, "Local" policy
      # correctly refuses to forward external traffic to whatever node gets
      # elected unless that happens to be the same node the single pod landed
      # on — confirmed live (front-ext/front-webmail-lan both got elected to
      # k8s-wrk-3 while the only pod ran on k8s-wrk-1: ClusterIP/NodePort
      # access worked, but the actual external LoadBalancer IPs didn't — no
      # firewall/ARP/routing issue anywhere in the path, just this). A
      # DaemonSet guarantees every schedulable node has a local pod, so
      # whichever node wins the election always has one. Safe here: `front`
      # is stateless nginx, and RWX storage (persistence.storageClass:
      # zfs-nfs, see below) already lets multiple pods mount the same volume.
      kind: DaemonSet
      hostPort:
        enabled: false
      externalService:
        enabled: true
        type: LoadBalancer
        # externalTrafficPolicy: Local (chart default) preserves real client
        # source IPs at front, which rspamd/postfix need for RBL lookups and
        # rate-limiting — Stalwart used `Cluster` and lost this.
        annotations:
          # Reuses the LB IP freed up by Stalwart's removal. NOT shared with
          # any other Service (service-front-webmail-lan.yaml has its own
          # dedicated IP instead) — see that file's comment for why: Cilium's
          # per-Service L2-announcement leader election can put two
          # IP-sharing Services on two different nodes at once, a genuine
          # Layer-2 ARP conflict, confirmed live.
          lbipam.cilium.io/ips: "192.168.10.104"
          # k8s-gateway (kubernetes/apps/network/k8s-gateway) auto-derives a
          # hostname from the Service name, but the hostname everything else
          # expects (DNS/TLS/MX) is "mail.${SECRET_DOMAIN}" — see
          # certificate.yaml. This is k8s_gateway's own convention for
          # pinning an explicit hostname onto a LoadBalancer Service.
          coredns.io/hostname: "mail.${SECRET_DOMAIN}"
        ports:
          # Deliberately narrower than Stalwart: plaintext-capable pop3/imap
          # (110/143) are left off entirely — only the implicit-TLS/STARTTLS
          # ports clients actually need are exposed.
          pop3: false
          pop3s: false
          imap: false
          imaps: true
          smtp: true
          smtps: true
          submission: true
          manageSieve: true

    admin:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi

    postfix:
      # MUST be Recreate, not the chart's default RollingUpdate. postfix is a
      # single-replica Deployment, but mailu-storage (its PVC) is
      # ReadWriteMany -- a RollingUpdate briefly runs old+new pods together,
      # and Postfix takes an exclusive lock on that shared queue directory:
      # the second process to start always fails outright with "the Postfix
      # mail system is already running" and crash-loops forever, permanently
      # blocking the rollout (and, just as badly, blocking Helm's own
      # automatic rollback if the upgrade fails for an unrelated reason --
      # the rollback hits the identical shared-lock race in the opposite
      # direction). Confirmed live 2026-09-27: a routine chart bump deadlocked
      # for ~3.5h with Flux endlessly retrying upgrade<->rollback, each
      # attempt spawning a second Postfix pod that immediately crash-looped
      # against the first. See
      # docs/incidents/2026-09-27-mailu-postfix-rollingupdate-rwx-pvc-deadlock.md.
      # Recreate kills the old pod before starting the new one -- brief mail
      # downtime during any Postfix image bump, but no deadlock risk.
      updateStrategy:
        type: Recreate
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi

    dovecot:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi

    rspamd:
      enabled: true
      # High-confidence virus hits are rejected at SMTP time (sender gets a
      # bounce) rather than silently discarded — avoids quietly losing a
      # legitimate-but-infected message without anyone noticing.
      antivirusAction: reject
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
      # Bump whenever `overrides` below or rspamd-unbound.conf change. The
      # chart doesn't checksum either into the pod template, and Mailu's
      # start.py only copies /overrides into rspamd's local.d at container
      # start, so a config-only change would otherwise never take effect.
      podAnnotations:
        k8s-ops/rspamd-config-revision: "1"
      # rspamd resolves through its own unbound sidecar (initContainers
      # below), not cluster DNS. Two independent reasons, both confirmed
      # live 2026-10-17:
      #  1. Every CoreDNS rollout blinded rspamd until its next restart.
      #     Cilium's socket-LB (bpf-lb-sock, not hostns-only) tears down
      #     connected UDP sockets whose Service backend goes away, and
      #     rspamd's DNS library never reconnects them: "cannot send DNS
      #     request: Destination address required" on every query from the
      #     2026-10-11 CoreDNS chart bump (#158) until a manual restart six
      #     days later, and the same after the 2026-09-12 bump. Meanwhile
      #     SPF/DKIM/DMARC and every RBL/URIBL silently scored zero (spam
      #     landed at ~0.25, PayPal receipts at 6.7). 127.0.0.1 is no Service
      #     VIP, so socket-LB never touches rspamd's socket any more.
      #  2. CoreDNS forwards to Cloudflare (cluster.toml dns_servers), and
      #     Spamhaus ZEN/DBL, URIBL and SURBL refuse queries relayed by big
      #     public resolvers -- those lists answered nothing even with DNS up.
      # searches/ndots mirror ClusterFirst so start.py's own lookups behave
      # as before; unbound forwards cluster.local to CoreDNS.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
        searches:
          - mail.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "5"
      initContainers:
        # Native sidecar (restartPolicy: Always): it has to be up and pass
        # its startupProbe before rspamd's start.py resolves anything.
        - name: unbound
          # Mailu's own resolver image (same release and supply chain as
          # every other Mailu component here), but with our own config: the
          # image's templated one has no cluster.local forward and a stale
          # DNSSEC trust anchor -- see rspamd-unbound.conf.
          image: ghcr.io/mailu/unbound:2024.06.58
          restartPolicy: Always
          command:
            - "/usr/sbin/unbound"
            - "-d"
            - "-c"
            - "/config/unbound.conf"
          startupProbe:
            exec:
              command: &unboundProbe
                - "sh"
                - "-c"
                - "dig @127.0.0.1 localhost A +short +time=2 +tries=1 | grep -qx 127.0.0.1"
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec:
              command: *unboundProbe
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Binds :53 unprivileged (containerd allows unprivileged ports in
          # the pod netns) -- verified live as uid 101 with every capability
          # dropped and a read-only root filesystem.
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: unbound-config
              mountPath: /config
              readOnly: true
      extraVolumes:
        - name: unbound-config
          configMap:
            name: mailu-rspamd-unbound
      # Rules for the "support@<spoofed domain>" diet/heater/joint-pain
      # campaign that dominated the inbox (Sept-Oct 2026), including all of
      # the fake "Die Höhle der Löwen" ads. Checked against the mailbox on
      # 2026-10-17: 206 of 206 messages delivered straight from a
      # *.bc.googleusercontent.com host were this campaign (none legitimate
      # -- GCP blocks outbound port 25, so real senders there relay through
      # an ESP), and every Löwen/DHDL subject or sender name was too. With
      # both rules, a re-scan put every campaign sample at >= 15 (reject)
      # and no legitimate inbox mail of the past week above 3.3.
      overrides:
        multimap.conf: |
          CLOUD_VM_DIRECT {
            type = "hostname";
            regexp = true;
            map = ["/etc/rspamd/local.d/cloud_vm_rdns.map"];
            score = 6.0;
            description = "Delivered straight from a public-cloud VM's default rDNS";
          }
        # Copied into local.d by start.py. `$$` is Flux postBuild escaping
        # for a literal `$` (end-of-hostname anchor).
        cloud_vm_rdns.map: |
          /\.bc\.googleusercontent\.com$$/i
        regexp.conf: |
          DHDL_DIET_CAMPAIGN {
            re = "Subject=/H(?:ö|oe)hle der L(?:ö|oe)wen|\\bDHDL\\b|\\bL(?:ö|oe)wen\\b|\\bWEGO ?6\\b/i{header} | From=/H(?:ö|oe)hle der L(?:ö|oe)wen|\\bDHDL\\b|\\bL(?:ö|oe)wen\\b|\\bWEGO ?6\\b/i{header}";
            score = 3.0;
            description = "Fake 'Die Hoehle der Loewen' diet-pill advertising";
          }

    clamav:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 1Gi
        limits:
          memory: 2Gi

    webmail:
      enabled: true
      type: roundcube
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi

    webdav:
      # Radicale (CalDAV/CardDAV) — no separate hostname/routing needed: it's
      # reached via fixed /.well-known/caldav and /.well-known/carddav paths
      # proxied by `front` on the existing mail/webmail hostnames, so it
      # rides on the cert, DaemonSet, and CiliumNetworkPolicy already in
      # place for those.
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi
    fetchmail:
      enabled: false
