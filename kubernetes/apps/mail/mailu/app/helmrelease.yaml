---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mailu
spec:
  interval: 1h
  chart:
    spec:
      chart: mailu
      version: 2.8.0
      sourceRef:
        kind: HelmRepository
        name: mailu
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # NOT wiring up Reloader (kube-system/reloader) here: this chart's only
    # blanket annotation knob is `commonAnnotations`, which — unlike other
    # charts in this repo that expose a narrower `deploymentAnnotations`
    # (e.g. kubernetes/apps/security/authentik/app/helmrelease.yaml) —
    # applies to *every* templated resource, including the `clamav`
    # StatefulSet's `volumeClaimTemplates[].metadata`. Kubernetes forbids
    # changing volumeClaimTemplates after creation, so setting
    # commonAnnotations here permanently breaks every future `helm upgrade`
    # (confirmed live: "Forbidden: updates to statefulset spec for fields
    # other than 'replicas', ..."). A future 1Password password rotation in
    # mailu-secret needs a manual `kubectl rollout restart` for the affected
    # component(s) instead of an automatic one.
    hostnames:
      # First entry is the primary mail hostname (MX/SMTP/IMAP) — keep it
      # first. webmail.${SECRET_DOMAIN} is the Cloudflare-Tunnel-routed
      # hostname for webmail/admin (see cloudflare-tunnel's helmrelease.yaml
      # and this app's ciliumnetworkpolicy.yaml); front's nginx needs it
      # listed here to actually serve that Host header.
      - "mail.${SECRET_DOMAIN}"
      - "webmail.${SECRET_DOMAIN}"
    domain: "${SECRET_DOMAIN}"
    timezone: "Europe/Berlin"

    # Flask session-cookie signing key — see externalsecret.yaml.
    existingSecret: mailu-secret

    initialAccount:
      enabled: true
      username: admin
      domain: "${SECRET_DOMAIN}"
      existingSecret: mailu-secret
      existingSecretPasswordKey: initial-admin-password
      # "ifmissing" (not the chart's default "update"): only ever creates
      # this account once. "update" would reset admin@${SECRET_DOMAIN}'s
      # password back to this secret's value on every reconcile/upgrade,
      # clobbering a password changed later via the admin UI.
      mode: ifmissing

    limits:
      # Defaults (60/hour per IP, 100/day per user, 200/day per message
      # sender) are already a reasonable brute-force/compromised-account
      # baseline — left unchanged.
      messageSizeLimitInMegabytes: 50

    tls:
      # Defer instead of silently falling back to plaintext when an
      # opportunistic-TLS negotiation fails outbound — the message is
      # retried later rather than sent in the clear. outboundLevel/
      # inboundEnforce are deliberately left at chart defaults ("may"):
      # forcing strict inbound TLS would bounce mail from correspondents
      # whose servers don't speak TLS reliably, which is a deliverability
      # regression, not a security win, for a small self-hosted domain.
      deferOnError: true

    # Two CNPG-backed Postgres databases (mailuusr/mailudb, roundcubeusr/
    # roundcubedb — see kubernetes/apps/database/cloudnative-pg/databases/)
    # instead of the chart's optional bundled MariaDB/PostgreSQL, which pull
    # `bitnamilegacy/*` images (Bitnami's Aug-2025 registry restructuring) —
    # matches every other app in this repo.
    mariadb:
      enabled: false
    postgresql:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      host: postgres-rw.database.svc.cluster.local
      port: 5432
      database: mailudb
      username: mailuusr
      existingSecret: mailu-secret
      existingSecretDatabaseKey: mailu-db-database
      existingSecretUsernameKey: mailu-db-username
      existingSecretPasswordKey: mailu-db-password
    global:
      database:
        roundcube:
          database: roundcubedb
          username: roundcubeusr
          existingSecret: mailu-secret
          existingSecretPasswordKey: roundcube-db-password

    # Dedicated, unauthenticated Redis (helmrelease-redis.yaml) instead of
    # the chart's bundled Bitnami Redis subchart — same `bitnamilegacy`
    # image-provenance reasoning as the database above. Mailu's own
    # `externalRedis` has no password/auth field at all (confirmed against
    # the chart's values.yaml), so this Redis is only as safe as the
    # CiliumNetworkPolicy locking it to the mail namespace
    # (ciliumnetworkpolicy-redis.yaml) — same trust model the chart's own
    # bundled Redis would have had.
    redis:
      enabled: false
    externalRedis:
      enabled: true
      host: mailu-redis.mail.svc.cluster.local
      port: 6379

    persistence:
      # Chart default is a single RWO PVC, which node-locks every Mailu pod
      # to whichever node first claims it. zfs-nfs (NFS-backed) already
      # serves ReadWriteMany to several other apps in this cluster, so using
      # it here avoids that node-pinning entirely.
      single_pvc: true
      size: 20Gi
      accessModes:
        - ReadWriteMany
      storageClass: zfs-nfs

    # No chart-managed Ingress: mail protocols aren't HTTP, so this can't go
    # through Envoy Gateway/Cloudflare Tunnel like the rest of the cluster —
    # same reasoning Stalwart's own dedicated LoadBalancer had. cert-manager
    # (not Mailu) owns the ACME flow; front mounts that secret directly
    # regardless of `ingress.enabled` (chart's `certificatesSecretName`
    # helper resolves `ingress.existingSecret` unconditionally).
    ingress:
      enabled: false
      existingSecret: mailu-tls
      tlsFlavorOverride: mail
      # Real client IP for front's HTTP side (webmail, admin, /sso/login,
      # /webdav). front hands admin $remote_addr as X-Real-IP, and admin
      # buckets AUTH_RATELIMIT_IP (60/hour per /24) on it. Internet requests
      # reach front from the cloudflared pod (webmail.${SECRET_DOMAIN} routes
      # straight to mailu-front, see cloudflare-tunnel's helmrelease.yaml).
      # With the chart defaults (header X-Forwarded-For, empty realIpFrom)
      # nginx's realip stayed inactive, so every Internet client shared
      # cloudflared's bucket, and 60 failed logins an hour from anyone
      # locked every Internet user out of SSO (confirmed live 2026-10-17).
      #
      # CF-Connecting-IP because Cloudflare sets it from the TCP peer and
      # answers 403 when a client sends its own. Never True-Client-IP:
      # Cloudflare forwards a client-sent one verbatim. Both verified live
      # 2026-10-17. 10.42.0.0/16 is the pod CIDR. LAN clients
      # (service-front-webmail-lan.yaml, externalTrafficPolicy Local) arrive
      # from 192.168.x / 10.10.0.2, outside it, and keep their own address.
      # The mail ports are untouched: front applies realIpFrom there only
      # together with PROXY protocol, which is off.
      #
      # Keep the two keys together. realIpFrom with an empty realIpHeader
      # makes nginx trust X-Real-IP, which any pod that can reach front:443
      # can set.
      realIpHeader: CF-Connecting-IP
      realIpFrom: "10.42.0.0/16"

    front:
      # Istverbrauch 104-128Mi je Replica. Die uebrigen sieben
      # Mailu-Komponenten tragen Limits, front war die Luecke -- gefunden
      # durch den ISMS-Check container_memory_limits (KONF.9.1).
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 384Mi
      # DaemonSet (one front pod per worker node), not the chart's default
      # single-replica Deployment. Required for externalTrafficPolicy: Local
      # (see below) to actually work: Cilium's L2-announcement leader
      # election for the LoadBalancer IPs picks a node independently of
      # where front's pod(s) run, and with only one replica, "Local" policy
      # correctly refuses to forward external traffic to whatever node gets
      # elected unless that happens to be the same node the single pod landed
      # on — confirmed live (front-ext/front-webmail-lan both got elected to
      # k8s-wrk-3 while the only pod ran on k8s-wrk-1: ClusterIP/NodePort
      # access worked, but the actual external LoadBalancer IPs didn't — no
      # firewall/ARP/routing issue anywhere in the path, just this). A
      # DaemonSet guarantees every schedulable node has a local pod, so
      # whichever node wins the election always has one. Safe here: `front`
      # is stateless nginx, and RWX storage (persistence.storageClass:
      # zfs-nfs, see below) already lets multiple pods mount the same volume.
      kind: DaemonSet
      # Bump whenever a value front reads from the mailu-envvars ConfigMap
      # changes (e.g. ingress.realIpHeader/realIpFrom above). The chart
      # doesn't checksum that ConfigMap into the pod template, and front
      # renders nginx.conf from its environment only at container start.
      podAnnotations:
        k8s-ops/front-config-revision: "1"
      hostPort:
        enabled: false
      externalService:
        enabled: true
        type: LoadBalancer
        # externalTrafficPolicy: Local (chart default) preserves real client
        # source IPs at front, which rspamd/postfix need for RBL lookups and
        # rate-limiting — Stalwart used `Cluster` and lost this.
        annotations:
          # Reuses the LB IP freed up by Stalwart's removal. NOT shared with
          # any other Service (service-front-webmail-lan.yaml has its own
          # dedicated IP instead) — see that file's comment for why: Cilium's
          # per-Service L2-announcement leader election can put two
          # IP-sharing Services on two different nodes at once, a genuine
          # Layer-2 ARP conflict, confirmed live.
          lbipam.cilium.io/ips: "192.168.10.104"
          # k8s-gateway (kubernetes/apps/network/k8s-gateway) auto-derives a
          # hostname from the Service name, but the hostname everything else
          # expects (DNS/TLS/MX) is "mail.${SECRET_DOMAIN}" — see
          # certificate.yaml. This is k8s_gateway's own convention for
          # pinning an explicit hostname onto a LoadBalancer Service.
          coredns.io/hostname: "mail.${SECRET_DOMAIN}"
        ports:
          # Deliberately narrower than Stalwart: plaintext-capable pop3/imap
          # (110/143) are left off entirely — only the implicit-TLS/STARTTLS
          # ports clients actually need are exposed.
          pop3: false
          pop3s: false
          imap: false
          imaps: true
          smtp: true
          smtps: true
          submission: true
          manageSieve: true

    admin:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi

    postfix:
      # MUST be Recreate, not the chart's default RollingUpdate. postfix is a
      # single-replica Deployment, but mailu-storage (its PVC) is
      # ReadWriteMany -- a RollingUpdate briefly runs old+new pods together,
      # and Postfix takes an exclusive lock on that shared queue directory:
      # the second process to start always fails outright with "the Postfix
      # mail system is already running" and crash-loops forever, permanently
      # blocking the rollout (and, just as badly, blocking Helm's own
      # automatic rollback if the upgrade fails for an unrelated reason --
      # the rollback hits the identical shared-lock race in the opposite
      # direction). Confirmed live 2026-09-27: a routine chart bump deadlocked
      # for ~3.5h with Flux endlessly retrying upgrade<->rollback, each
      # attempt spawning a second Postfix pod that immediately crash-looped
      # against the first. See
      # docs/incidents/2026-09-27-mailu-postfix-rollingupdate-rwx-pvc-deadlock.md.
      # Recreate kills the old pod before starting the new one -- brief mail
      # downtime during any Postfix image bump, but no deadlock risk.
      updateStrategy:
        type: Recreate
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi

    dovecot:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 512Mi

    rspamd:
      enabled: true
      # High-confidence virus hits are rejected at SMTP time (sender gets a
      # bounce) rather than silently discarded — avoids quietly losing a
      # legitimate-but-infected message without anyone noticing.
      antivirusAction: reject
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
      # Bump whenever `overrides` below or rspamd-unbound.conf change. The
      # chart doesn't checksum either into the pod template, and Mailu's
      # start.py only copies /overrides into rspamd's local.d at container
      # start, so a config-only change would otherwise never take effect.
      podAnnotations:
        k8s-ops/rspamd-config-revision: "2"
      # rspamd resolves through its own unbound sidecar (initContainers
      # below), not cluster DNS. Two independent reasons, both confirmed
      # live 2026-10-17:
      #  1. Every CoreDNS rollout blinded rspamd until its next restart.
      #     Cilium's socket-LB (bpf-lb-sock, not hostns-only) tears down
      #     connected UDP sockets whose Service backend goes away, and
      #     rspamd's DNS library never reconnects them: "cannot send DNS
      #     request: Destination address required" on every query from the
      #     2026-10-11 CoreDNS chart bump (#158) until a manual restart six
      #     days later, and the same after the 2026-09-12 bump. Meanwhile
      #     SPF/DKIM/DMARC and every RBL/URIBL silently scored zero (spam
      #     landed at ~0.25, PayPal receipts at 6.7). 127.0.0.1 is no Service
      #     VIP, so socket-LB never touches rspamd's socket any more.
      #  2. CoreDNS forwards to Cloudflare (cluster.toml dns_servers), and
      #     Spamhaus ZEN/DBL, URIBL and SURBL refuse queries relayed by big
      #     public resolvers -- those lists answered nothing even with DNS up.
      # searches/ndots mirror ClusterFirst so start.py's own lookups behave
      # as before; unbound forwards cluster.local to CoreDNS.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
        searches:
          - mail.svc.cluster.local
          - svc.cluster.local
          - cluster.local
        options:
          - name: ndots
            value: "5"
      initContainers:
        # Native sidecar (restartPolicy: Always): it has to be up and pass
        # its startupProbe before rspamd's start.py resolves anything.
        - name: unbound
          # Mailu's own resolver image (same release and supply chain as
          # every other Mailu component here), but with our own config: the
          # image's templated one has no cluster.local forward and a stale
          # DNSSEC trust anchor -- see rspamd-unbound.conf.
          image: ghcr.io/mailu/unbound:2024.06.67
          restartPolicy: Always
          command:
            - "/usr/sbin/unbound"
            - "-d"
            - "-c"
            - "/config/unbound.conf"
          startupProbe:
            exec:
              command: &unboundProbe
                - "sh"
                - "-c"
                - "dig @127.0.0.1 localhost A +short +time=2 +tries=1 | grep -qx 127.0.0.1"
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            exec:
              command: *unboundProbe
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # Binds :53 unprivileged (containerd allows unprivileged ports in
          # the pod netns) -- verified live as uid 101 with every capability
          # dropped and a read-only root filesystem.
          securityContext:
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: unbound-config
              mountPath: /config
              readOnly: true
      extraVolumes:
        - name: unbound-config
          configMap:
            name: mailu-rspamd-unbound
      # Rules for the "support@<spoofed domain>" diet/heater/joint-pain
      # campaign that dominated the inbox (Sept-Oct 2026), including all of
      # the fake "Die Höhle der Löwen" ads. Checked against the mailbox on
      # 2026-10-17: 206 of 206 messages delivered straight from a
      # *.bc.googleusercontent.com host were this campaign (none legitimate
      # -- GCP blocks outbound port 25, so real senders there relay through
      # an ESP), and every Löwen/DHDL subject or sender name was too. With
      # both rules, a re-scan put every campaign sample at >= 15 (reject)
      # and no legitimate inbox mail of the past week above 3.3.
      overrides:
        multimap.conf: |
          CLOUD_VM_DIRECT {
            type = "hostname";
            regexp = true;
            map = ["/etc/rspamd/local.d/cloud_vm_rdns.map"];
            score = 6.0;
            description = "Delivered straight from a public-cloud VM's default rDNS";
          }
        # Copied into local.d by start.py. `$$` is Flux postBuild escaping
        # for a literal `$` (end-of-hostname anchor).
        cloud_vm_rdns.map: |
          /\.bc\.googleusercontent\.com$$/i
        # The DHDL rule is the campaign above. The next four target the
        # predatory-publishing ("call for papers") spam: Scopus/UGC-CARE
        # paper mills from throwaway Gmail accounts, fake IEEE conferences
        # via Amazon SES (ICECER/ICECET/ICECCME/ACDSA), and "Dear <Last>,
        # <First> <Middle>:" invitations via Alibaba DirectMail with
        # Cyrillic/Greek look-alike letters. All pass SPF/DKIM/DMARC from
        # clean IPs and Bayes rated them ham, so they arrived at ~0.
        # Checked on 2026-10-24 against both mailboxes (24,605
        # messages): every atom below fired on spam only, mostly the 43
        # campaign messages. Legit mail had at most 2 mixed-script spots
        # (the spam has 100-240), and "scopus" appeared nowhere else.
        regexp.conf: |
          DHDL_DIET_CAMPAIGN {
            re = "Subject=/H(?:ö|oe)hle der L(?:ö|oe)wen|\\bDHDL\\b|\\bL(?:ö|oe)wen\\b|\\bWEGO ?6\\b/i{header} | From=/H(?:ö|oe)hle der L(?:ö|oe)wen|\\bDHDL\\b|\\bL(?:ö|oe)wen\\b|\\bWEGO ?6\\b/i{header}";
            score = 3.0;
            description = "Fake 'Die Hoehle der Loewen' diet-pill advertising";
          }
          PREDATORY_PUBLISHING {
            re = "(Subject=/\\bscopus\\b|\\bugc[- ]?care\\b|\\bpublication chance\\b|\\bback[- ]?dated\\s+(?:papers?|articles?|issues?)\\b/i{header} | /\\bscopus\\b|\\bugc[- ]?care\\b|\\bpublication chance\\b|\\bback[- ]?dated\\s+(?:papers?|articles?|issues?)\\b/i{mime}) & (Subject=/\\b(?:journals?|manuscripts?|call for papers?|peer[- ]reviewed?|indexed|conferences?|editorial board)\\b/i{header} | /\\b(?:journals?|manuscripts?|call for papers?|peer[- ]reviewed?|indexed|conferences?|editorial board)\\b/i{mime})";
            score = 7.0;
            description = "Predatory journal/conference solicitation (Scopus, UGC-CARE, backdated papers)";
          }
          # Score 0: only the composites in composites.conf give it weight,
          # so a legitimate call for papers from a real conference or
          # university stays untouched.
          JOURNAL_SOLICITATION {
            re = "Subject=/\\b(?:manuscripts?|call for papers?|scopus|submit(?:ting)? (?:your |an? )?(?:manuscripts?|papers?|articles?|research))\\b/i{header} | From=/\\bjournal\\b/i{header} | /\\b(?:submit(?:ting)? (?:your |an? )?(?:manuscripts?|papers?|articles?|research)|accepting manuscripts|call for papers?)\\b|\\bISSN(?: NO)?\\s*:?\\s*\\d{4}-\\d{3}[\\dX]\\b/i{mime}";
            score = 0.0;
            description = "Solicits journal or conference submissions";
          }
          # "Dear <Last>, <First> <Middle>:" -- the name as scraped from a
          # publication database, used as the subject line.
          ACADEMIC_NAME_SALUTATION {
            re = "Subject=/^Dear [A-Z][^\\s,:]*, [A-Z][^\\s,:]*(?: [A-Z][^\\s,:]*)?:/{header}";
            score = 4.0;
            description = "Subject addresses the recipient as 'Dear Last, First Middle:'";
          }
          # Latin letters glued to Cyrillic/Greek/Armenian look-alikes
          # ("Cοn fеrе nсе", "unsuЬscrіЬe"): 3+ spots in the subject or 5+
          # in the body.
          HOMOGLYPH_OBFUSCATION {
            re = "Subject=/(?:[A-Za-z][\\p{Cyrillic}\\p{Greek}\\p{Armenian}]|[\\p{Cyrillic}\\p{Greek}\\p{Armenian}][A-Za-z])(?:.*(?:[A-Za-z][\\p{Cyrillic}\\p{Greek}\\p{Armenian}]|[\\p{Cyrillic}\\p{Greek}\\p{Armenian}][A-Za-z])){2}/u{header} | /(?:[A-Za-z][\\p{Cyrillic}\\p{Greek}\\p{Armenian}]|[\\p{Cyrillic}\\p{Greek}\\p{Armenian}][A-Za-z])(?:.*(?:[A-Za-z][\\p{Cyrillic}\\p{Greek}\\p{Armenian}]|[\\p{Cyrillic}\\p{Greek}\\p{Armenian}][A-Za-z])){4}/us{mime}";
            score = 4.0;
            description = "Words mixing Latin with Cyrillic/Greek look-alike letters";
          }
          # Phishing: a bank, tax-office or payment brand in the From
          # display name, sent from a domain that isn't the brand's
          # ("Elster Anwender <calma1@galenpharm.com>"). 24 hits in all
          # 35,580 stored messages of both mailboxes (ELSTER, Volksbank,
          # Postbank, N26, Santander, Deutsche Bank, Consorsbank, Telekom,
          # Netflix), all phishing or spam. f-i.de (the Sparkassen's IT
          # provider), ipsos-cx.com (a Commerzbank survey) and xoom.com
          # (PayPal) are legitimate senders found in the mailboxes. Amazon
          # and Apple are left out: their real mail also comes from
          # primevideo.com/medallia.com.
          BRAND_NAME_SPOOF {
            re = "From=/^[^<@]*\\b(?:elster|finanzamt|bundeszentralamt|postbank|sparkasse|volksbank(?:en)?|raiffeisenbank|commerzbank|deutsche bank|dkb|n26|comdirect|consorsbank|santander|targobank|hypovereinsbank|ing-diba|paypal|klarna|telekom|netflix)\\b[^<]*</i{header} & !From=/@(?:[\\w-]+\\.)*(?:elster|finanzamt|bzst|postbank|sparkasse|volksbank|vrbank|voba|raiffeisen|atruvia|commerzbank|deutsche-bank|db|dkb|n26|comdirect|consorsbank|santander|targobank|hypovereinsbank|hvb|ing|paypal|xoom|klarna|telekom|t-online|netflix|f-i|ipsos-cx)[\\w-]*\\.[a-z.]+>?\\s*$$/i{header}";
            score = 8.0;
            description = "Bank/authority/payment brand in the From name, foreign sender domain";
          }
          # Throwaway product-spam domains, mostly arriving through the UniBw
          # forward (coust-wels.baby, beauty-room.bond, doitnow.lat). None
          # of these TLDs sent anything legitimate to either mailbox; .shop
          # and .pro did, so they're not listed. 5 points because these
          # forwards otherwise score only ~1-2 without Bayes.
          SPAMMY_TLD_FROM {
            re = "From=/@[^>\\s]+\\.(?:baby|bond|lat|cfd|sbs|icu|buzz|cyou|rest|click|top|xyz|quest|monster|beauty|hair|skin|makeup|boats|yachts|autos|lol|mom)>?\\s*$$/i{header}";
            score = 5.0;
            description = "From domain under a TLD used only by spam here";
          }
          # An upstream filter (UniBw's Proxmox gateway, formerly netcup)
          # already tagged the subject. All 21 such messages were spam.
          UPSTREAM_SPAM_TAG {
            re = "Subject=/^\\s*(?:\\[SPAM\\]|\\*{3}\\s*SPAM\\s*\\*{3})/i{header}";
            score = 6.0;
            description = "Subject tagged as spam by an upstream filter";
          }
        # Mail forwarded from the owner's UniBw address arrives from UniBw's
        # MXes (mx1-3.mail.rz.unibw-muenchen.de). Their gateway prepends
        # "[EXTERNAL]" to the subject, which breaks every DKIM signature,
        # and the hop breaks SPF, so legitimate senders with a strict DMARC
        # policy scored like spam (a Dropbox terms-of-service mail: 7).
        # Copied into local.d by start.py (Mailu has no settings.conf).
        settings.conf: |
          unibw_forward {
            priority = high;
            ip = ["137.193.2.51", "137.193.2.52", "137.193.2.53"];
            apply {
              groups_disabled = ["policies"];
            }
          }
        # Merged into Mailu's composites.conf (included, not copied).
        composites.conf: |
          FREEMAIL_JOURNAL_SOLICITATION {
            expression = "(PREDATORY_PUBLISHING | JOURNAL_SOLICITATION) & (FREEMAIL_FROM | FREEMAIL_ENVFROM | FREEMAIL_REPLYTO)";
            policy = "leave";
            score = 4.0;
            description = "Journal/conference solicitation from a freemail account";
          }
          ACADEMIC_SALUTATION_SOLICITATION {
            expression = "ACADEMIC_NAME_SALUTATION & JOURNAL_SOLICITATION";
            policy = "leave";
            score = 3.0;
            description = "'Dear Last, First:' subject on a journal/conference solicitation";
          }
        # Mailu's own metrics.conf redefines the "fuzzy" group with only its
        # LOCAL_FUZZY_* symbols, which drops the stock weights of the
        # rspamd.com feed's symbols. FUZZY_DENIED fired on 6 of the 43
        # paper-mill mails and on nothing but spam in the 2026-10-21..24
        # history, yet scored 0.00 and was missing from the controller's
        # /symbols list. These are rspamd's defaults
        # (scores.d/fuzzy_group.conf); the group's max_score stays at 12.
        metrics.conf: |
          group "fuzzy" {
            symbol "FUZZY_DENIED" {
              weight = 12.0;
              description = "Denied fuzzy hash, bl.rspamd.com";
            }
            symbol "FUZZY_PROB" {
              weight = 5.0;
              description = "Probable fuzzy hash, bl.rspamd.com";
            }
            symbol "FUZZY_WHITE" {
              weight = -2.1;
              description = "Whitelisted fuzzy hash, bl.rspamd.com";
            }
            symbol "FUZZY_UNKNOWN" {
              weight = 5.0;
              description = "Generic fuzzy hash match, bl.rspamd.com";
            }
          }

    clamav:
      enabled: true
      resources:
        requests:
          cpu: 50m
          memory: 1Gi
        limits:
          memory: 2Gi

    webmail:
      enabled: true
      type: roundcube
      # 2024.06.67+ installs php83 >= 8.3.36 from Alpine 3.21 (PHP2Shell,
      # CVE-2026-109618/-109619, Mailu/Mailu#4152); the chart's default
      # 2024.06.58 ships PHP 8.3.15.
      image:
        tag: 2024.06.67@sha256:0920316a2dd40558d215c1d5a3aa5550c026a7182bd44b0844cd185e6c18fbd5
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi

    # oletools und tika sind im Chart aktiviert, hier aber bisher nicht
    # konfiguriert -- deshalb liefen sie ohne Limit. tika verarbeitet
    # Anhaenge und ist mit 600Mi Istverbrauch der hungrigste Dienst im
    # Namespace; oletools bleibt bei 12Mi. Gefunden durch den ISMS-Check
    # container_memory_limits (KONF.9.1).
    oletools:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi

    tika:
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          # Deutlich ueber dem Istwert: eine JVM, die Dokumente parst,
          # braucht Spitzen. Zu knapp bedeutet hier OOM beim Anhang, nicht
          # beim Leerlauf.
          memory: 1Gi

    webdav:
      # Radicale (CalDAV/CardDAV) — no separate hostname/routing needed: it's
      # reached via fixed /.well-known/caldav and /.well-known/carddav paths
      # proxied by `front` on the existing mail/webmail hostnames, so it
      # rides on the cert, DaemonSet, and CiliumNetworkPolicy already in
      # place for those.
      enabled: true
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          memory: 256Mi
    fetchmail:
      enabled: false
