---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app isms-collector
  namespace: &namespace isms
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  decryption:
    provider: sops
  interval: 1h
  path: ./kubernetes/apps/isms/collector/app
  # Kein postBuild: nichts hier braucht eine ${SECRET_*}-Substitution, und
  # Flux' envsubst laeuft im Strict-Modus ueber die gesamten Manifeste. Es
  # hat deshalb das ${GIT_TOKEN} im Shell-Skript des CronJobs fuer eine
  # Flux-Variable gehalten und die Reconciliation abgebrochen. Wird hier
  # spaeter eine Substitution gebraucht, muessen Shell-Variablen als
  # $${VAR} geschrieben werden -- so wie in proxmox-ansible und gatus.
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: true
