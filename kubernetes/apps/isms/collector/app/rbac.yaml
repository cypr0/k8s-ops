---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: isms-collector
automountServiceAccountToken: true
---
# Read-only, and deliberately enumerated rather than wildcarded: the
# `restrict-rbac-least-privilege` ClusterPolicy rejects `*` in resources or
# verbs, and a compliance collector that needs an exemption from the cluster's
# own RBAC policy would be a poor start.
#
# `secrets` is absent on purpose. Nothing here needs them, and reading them
# would trip the policy's `no-sensitive-resource-access` rule. ConfigMaps are
# restricted by name to the two the harvester actually parses.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: isms-collector
rules:
  # Node inventory: Falco coverage is measured against the node list and the
  # taints, not against the DaemonSet's own ready count.
  - apiGroups:
      - ""
    resources:
      - "nodes"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "apps"
    resources:
      - "daemonsets"
      - "deployments"
      - "statefulsets"
    verbs:
      - "get"
      - "list"
  # Kyverno verdicts. There are no ClusterPolicyReports in this cluster --
  # every policy matches namespaced resources -- but both are listed so a
  # future cluster-scoped policy is picked up without an RBAC change.
  - apiGroups:
      - "wgpolicyk8s.io"
    resources:
      - "policyreports"
      - "clusterpolicyreports"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "aquasecurity.github.io"
    resources:
      - vulnerabilityreports
      - configauditreports
      - clustercompliancereports
      - rbacassessmentreports
      - exposedsecretreports
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "velero.io"
    resources:
      - "schedules"
      - "backups"
      - "backupstoragelocations"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "postgresql.cnpg.io"
    resources:
      - "clusters"
      - "databases"
      - "scheduledbackups"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "kustomize.toolkit.fluxcd.io"
    resources:
      - "kustomizations"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "helm.toolkit.fluxcd.io"
    resources:
      - "helmreleases"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "cilium.io"
    resources:
      - "ciliumnetworkpolicies"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "cert-manager.io"
    resources:
      - "certificates"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "gateway.networking.k8s.io"
    resources:
      - "httproutes"
      - "gateways"
    verbs:
      - "get"
      - "list"
  # Only the two ConfigMaps the harvester parses: Loki's retention and the
  # Authentik blueprints that declare the MFA stage. `list` cannot be scoped
  # by name, so the harvester fetches them individually by name.
  - apiGroups:
      - ""
    resources:
      - "configmaps"
    resourceNames:
      - "loki"
      - "authentik-blueprints"
    verbs:
      - "get"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: isms-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: isms-collector
subjects:
  - kind: ServiceAccount
    name: isms-collector
    namespace: isms
