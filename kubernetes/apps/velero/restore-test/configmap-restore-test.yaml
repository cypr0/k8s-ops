---
apiVersion: v1
kind: ConfigMap
metadata:
  name: velero-restore-test-script
data:
  restore_test.py: |-
    #!/usr/bin/env python3
    """
    Automated Velero restore test.

    Picks ONE namespace from NAMESPACES per run (not all of them — restoring
    several large volumes at once made them contend for the same node-agent's
    single-restore-per-node slot and stall). Selection is a shuffled
    without-replacement rotation persisted in the velero-restore-test-state
    ConfigMap: every namespace gets tested once before any repeats (so a full
    year of daily runs guarantees full coverage instead of leaving it to
    chance), while the order within each cycle is still randomized.

    Takes the most recent Completed backup from a given Schedule, restores
    the chosen namespace into a scratch "<namespace>-restore-test" namespace,
    checks basic pod health, alerts via Pushover on any failure, and always
    cleans up afterwards regardless of outcome. There is no self-imposed
    timeout on waiting for the restore — some volumes genuinely take hours —
    the CronJob's activeDeadlineSeconds is the only backstop, and it exists
    purely to keep a truly wedged restore from blocking every future daily
    run (concurrencyPolicy: Forbid), not to mark slow-but-healthy restores
    as failed.
    """
    import json
    import os
    import random
    import socket
    import ssl
    import sys
    import time
    import urllib.error
    import urllib.parse
    import urllib.request

    # This cluster has no IPv6 routing, but some external hosts (e.g.
    # api.pushover.net) publish AAAA records — glibc/musl getaddrinfo() often
    # returns those first, which fails with "Network unreachable" instead of
    # falling back to IPv4. Force IPv4-only resolution everywhere.
    _orig_getaddrinfo = socket.getaddrinfo
    def _ipv4_only_getaddrinfo(*args, **kwargs):
        return [ai for ai in _orig_getaddrinfo(*args, **kwargs) if ai[0] == socket.AF_INET]
    socket.getaddrinfo = _ipv4_only_getaddrinfo

    # Cluster-config CRDs are git-defined (Flux redeploys them) and some are
    # actively dangerous to restore into a scratch namespace: a restored
    # HelmRelease/Kustomization is picked up cluster-wide by helm-/
    # kustomize-controller regardless of which namespace it lands in, and
    # restoring ~30 cluster-wide CRD types at once is also what OOM-killed
    # the Velero server during testing. Matches the exclusion list on the
    # Schedules — kept here too as defense-in-depth for older backups.
    EXCLUDED_RESOURCES = [
        "jobs.batch", "cronjobs.batch",
        "helmcharts.source.toolkit.fluxcd.io",
        "helmreleases.helm.toolkit.fluxcd.io",
        "helmrepositories.source.toolkit.fluxcd.io",
        "ocirepositories.source.toolkit.fluxcd.io",
        "gitrepositories.source.toolkit.fluxcd.io",
        "kustomizations.kustomize.toolkit.fluxcd.io",
        "externalsecrets.external-secrets.io",
        "servicemonitors.monitoring.coreos.com",
        "podmonitors.monitoring.coreos.com",
        "prometheusrules.monitoring.coreos.com",
        "vulnerabilityreports.aquasecurity.github.io",
        "configauditreports.aquasecurity.github.io",
        "exposedsecretreports.aquasecurity.github.io",
        "sbomreports.aquasecurity.github.io",
        "containerprofiles.spdx.softwarecomposition.kubescape.io",
        "networkneighborhoods.spdx.softwarecomposition.kubescape.io",
        "generatednetworkpolicies.spdx.softwarecomposition.kubescape.io",
        "workloadconfigurationscans.spdx.softwarecomposition.kubescape.io",
        "workloadconfigurationscansummaries.spdx.softwarecomposition.kubescape.io",
        "configurationscansummaries.spdx.softwarecomposition.kubescape.io",
        "policyreports.wgpolicyk8s.io",
        "clusterpolicyreports.wgpolicyk8s.io",
        "httproutes.gateway.networking.k8s.io",
        "ciliumnetworkpolicies.cilium.io",
    ]

    SCHEDULE_NAME     = os.environ.get("SCHEDULE_NAME", "daily")
    NAMESPACES        = [n.strip() for n in os.environ.get("NAMESPACES", "").split(",") if n.strip()]
    PUSHOVER_TOKEN    = os.environ.get("PUSHOVER_TOKEN", "")
    PUSHOVER_USER     = os.environ.get("PUSHOVER_USER", "")
    OPENSEARCH_HOST   = os.environ.get("OPENSEARCH_HOST", "https://opensearch.logging.svc.cluster.local:9200")
    OPENSEARCH_USER   = os.environ.get("OPENSEARCH_USER", "admin")
    OPENSEARCH_PASS   = os.environ.get("OPENSEARCH_PASSWORD", "")
    POLL_INTERVAL  = 15
    STATE_CONFIGMAP = "velero-restore-test-state"
    # This cluster has a known intermittent apiserver-reachability issue
    # (Cilium/KubePrism only ever resolves ONE of the three control-plane
    # backends for the kubernetes.default ClusterIP -- if that one node
    # blips, every apiserver call cluster-wide hangs simultaneously). None
    # of this script's urlopen() calls used to set a timeout, so a single
    # blip during this hit live: a poll call blocked forever, past the
    # 600s pods_healthy() deadline this script itself defines, past
    # cleanup()'s own "always run" guarantee -- the only thing that ever
    # stopped it was the CronJob's activeDeadlineSeconds SIGKILL-ing the
    # whole container hours later, which bypasses every try/finally in
    # this script, leaving a wedged scratch namespace with no Pushover
    # alert ever sent. A bounded per-call timeout turns that hang into a
    # normal, catchable exception instead.
    HTTP_TIMEOUT = 15

    import base64
    _OS_AUTH = base64.b64encode(f"{OPENSEARCH_USER}:{OPENSEARCH_PASS}".encode()).decode()
    _OS_CTX  = ssl.create_default_context()
    _OS_CTX.check_hostname = False
    _OS_CTX.verify_mode    = ssl.CERT_NONE

    def report_result(doc):
        """Index this run's result so Dashboards can chart pass/fail over time."""
        if not OPENSEARCH_PASS:
            print("  (no OpenSearch creds — skipping result export)", file=sys.stderr)
            return
        body = json.dumps({"index": {"_index": "velero-restore-tests"}}) + "\n" + json.dumps(doc) + "\n"
        req = urllib.request.Request(
            f"{OPENSEARCH_HOST}/_bulk",
            data=body.encode(),
            headers={"Content-Type": "application/x-ndjson", "Authorization": f"Basic {_OS_AUTH}"},
            method="POST",
        )
        try:
            with urllib.request.urlopen(req, context=_OS_CTX, timeout=HTTP_TIMEOUT) as r:
                r.read()
        except Exception as e:
            print(f"  ERROR indexing restore-test result: {e}", file=sys.stderr)

    TOKEN = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read()
    CA    = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    CTX   = ssl.create_default_context(cafile=CA)
    API   = "https://kubernetes.default.svc"

    def k8s(method, path, body=None):
        data = json.dumps(body).encode() if body is not None else None
        headers = {"Authorization": f"Bearer {TOKEN}"}
        if data is not None:
            headers["Content-Type"] = "application/json"
        req = urllib.request.Request(f"{API}{path}", data=data, headers=headers, method=method)
        try:
            with urllib.request.urlopen(req, context=CTX, timeout=HTTP_TIMEOUT) as r:
                return json.loads(r.read() or b"{}")
        except urllib.error.HTTPError as e:
            if e.code == 404:
                return None
            raise

    def notify(title, message, priority=0):
        if not PUSHOVER_TOKEN or not PUSHOVER_USER:
            print(f"  (no Pushover creds — skipping alert: {title}: {message})", file=sys.stderr)
            return
        body = urllib.parse.urlencode({
            "token": PUSHOVER_TOKEN,
            "user": PUSHOVER_USER,
            "title": title,
            "message": message,
            "priority": priority,
        }).encode()
        req = urllib.request.Request(
            "https://api.pushover.net/1/messages.json",
            data=body,
            headers={"Content-Type": "application/x-www-form-urlencoded"},
            method="POST",
        )
        try:
            with urllib.request.urlopen(req, timeout=HTTP_TIMEOUT) as r:
                r.read()
        except Exception as e:
            print(f"  ERROR sending Pushover alert: {e}", file=sys.stderr)

    def latest_completed_backup(schedule_name):
        resp = k8s("GET", "/apis/velero.io/v1/namespaces/velero/backups") or {}
        candidates = [
            b for b in resp.get("items", [])
            if b.get("metadata", {}).get("labels", {}).get("velero.io/schedule-name") == schedule_name
            and b.get("status", {}).get("phase") == "Completed"
        ]
        if not candidates:
            return None
        candidates.sort(key=lambda b: b["status"].get("startTimestamp", ""), reverse=True)
        return candidates[0]

    def pick_namespace():
        """Shuffled without-replacement rotation: every namespace in NAMESPACES
        gets tested before any repeats, order randomized per cycle. State
        persists in a ConfigMap so it survives across CronJob runs."""
        cm = k8s("GET", f"/api/v1/namespaces/velero/configmaps/{STATE_CONFIGMAP}")
        remaining = []
        if cm:
            remaining = [n for n in cm.get("data", {}).get("remaining", "").split(",") if n.strip()]
        remaining = [n for n in remaining if n in NAMESPACES]  # drop stale entries
        if not remaining:
            remaining = NAMESPACES[:]
            random.shuffle(remaining)
            print(f"=== Starting new rotation cycle: {remaining} ===")
        target = remaining.pop(0)
        body = {
            "apiVersion": "v1", "kind": "ConfigMap",
            "metadata": {"name": STATE_CONFIGMAP, "namespace": "velero"},
            "data": {"remaining": ",".join(remaining)},
        }
        if cm is None:
            k8s("POST", "/api/v1/namespaces/velero/configmaps", body)
        else:
            k8s("PUT", f"/api/v1/namespaces/velero/configmaps/{STATE_CONFIGMAP}", body)
        return target

    def pods_healthy(namespace, timeout_seconds=600, poll=10):
        """Poll until every pod in the namespace is Running with all
        containers Ready, or the timeout elapses. Restored pods need a beat
        to actually start after the Restore reports Completed — a single
        immediate 'does at least one pod exist' check can't tell a genuinely
        broken restore from one that just hasn't scheduled yet."""
        deadline = time.time() + timeout_seconds
        last_detail = "no pods found"
        while time.time() < deadline:
            try:
                resp = k8s("GET", f"/api/v1/namespaces/{namespace}/pods") or {}
            except Exception as e:
                # Transient apiserver blip -- HTTP_TIMEOUT bounds how long a
                # single call can hang, but a hung call still shouldn't burn
                # this function's own timeout budget on one bad poll. Retry
                # within the same deadline instead of treating it as
                # "unhealthy".
                last_detail = f"transient error polling pods: {e}"
                time.sleep(poll)
                continue
            items = resp.get("items", [])
            if not items:
                last_detail = "no restored pods"
            else:
                not_ready = []
                for pod in items:
                    name = pod.get("metadata", {}).get("name", "?")
                    phase = pod.get("status", {}).get("phase", "Unknown")
                    conds = {c["type"]: c["status"] for c in pod.get("status", {}).get("conditions", [])}
                    if phase != "Running" or conds.get("Ready") != "True":
                        not_ready.append(f"{name}({phase})")
                if not not_ready:
                    return True, f"{len(items)} pod(s) Running and Ready"
                last_detail = f"{len(not_ready)}/{len(items)} pod(s) not ready: {', '.join(not_ready)}"
            time.sleep(poll)
        return False, last_detail

    def cleanup(restore_name, scratch_namespaces):
        print(f"=== Cleanup: restore={restore_name}, namespaces={scratch_namespaces} ===")
        # Each delete is its own try/except: an unhandled exception here
        # (e.g. a transient apiserver blip on the restore-object delete)
        # must never skip the namespace deletes below it -- that's exactly
        # how a previous run left a scratch namespace with a crash-looping
        # restored pod running for hours with nothing ever cleaning it up.
        if restore_name:
            try:
                k8s("DELETE", f"/apis/velero.io/v1/namespaces/velero/restores/{restore_name}")
            except Exception as e:
                print(f"  WARN: failed to delete restore {restore_name}: {e}", file=sys.stderr)
        for ns in scratch_namespaces:
            try:
                k8s("DELETE", f"/api/v1/namespaces/{ns}")
            except Exception as e:
                print(f"  WARN: failed to delete namespace {ns}: {e}", file=sys.stderr)

    def main():
        if not NAMESPACES:
            print("NAMESPACES is empty — nothing to test", file=sys.stderr)
            sys.exit(1)

        run_start = time.time()
        run_ts = time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(run_start))

        target_ns = pick_namespace()
        scratch_ns = f"{target_ns}-restore-test"
        print(f"=== Selected '{target_ns}' for this run (pool: {NAMESPACES}) ===")

        # Defensive: remove a leftover from a previous run that didn't clean up.
        print("=== Pre-cleanup of any leftover scratch namespace ===")
        if k8s("GET", f"/api/v1/namespaces/{scratch_ns}") is not None:
            print(f"  Deleting leftover namespace {scratch_ns}")
            k8s("DELETE", f"/api/v1/namespaces/{scratch_ns}")

        backup = latest_completed_backup(SCHEDULE_NAME)
        if backup is None:
            msg = f"No Completed backup found for schedule '{SCHEDULE_NAME}' — restore test skipped."
            print(msg, file=sys.stderr)
            notify("Velero restore test FAILED", msg, priority=1)
            report_result({
                "@timestamp": run_ts, "schedule": SCHEDULE_NAME, "namespace": target_ns,
                "backup": "", "phase": "Skipped", "success": False, "errors": 0, "warnings": 0,
                "durationSeconds": round(time.time() - run_start, 1), "detail": msg,
                "failureReason": "no completed backup", "failureClass": "no_backup",
                "source": "velero-restore-test",
            })
            sys.exit(1)

        backup_name = backup["metadata"]["name"]
        print(f"=== Testing restore of '{target_ns}' from backup '{backup_name}' (schedule={SCHEDULE_NAME}) ===")

        restore_name = f"restore-test-{target_ns}-{backup_name}"[:253]
        restore_body = {
            "apiVersion": "velero.io/v1",
            "kind": "Restore",
            "metadata": {"name": restore_name, "namespace": "velero"},
            "spec": {
                "backupName": backup_name,
                "includedNamespaces": [target_ns],
                "excludedResources": EXCLUDED_RESOURCES,
                "namespaceMapping": {target_ns: scratch_ns},
                "restorePVs": True,
                # Velero's 4h default was found to be exactly why paperless's
                # PVC restore (many small files via kopia) always came back
                # PartiallyFailed — it was hitting this ceiling every single
                # run, not failing on its own. Give it real headroom; the
                # CronJob's activeDeadlineSeconds was raised to match.
                "itemOperationTimeout": "8h0m0s",
            },
        }

        success = False
        detail = ""
        phase = "New"
        errors = 0
        warnings = 0
        failure_reason = ""
        failure_class = "ok"
        try:
            k8s("POST", "/apis/velero.io/v1/namespaces/velero/restores", restore_body)

            print("=== Waiting for restore to finish (no self-imposed timeout) ===")
            phase = "New"
            restore = None
            while True:
                try:
                    restore = k8s("GET", f"/apis/velero.io/v1/namespaces/velero/restores/{restore_name}")
                except Exception as e:
                    # Same reasoning as pods_healthy(): a bounded per-call
                    # timeout (HTTP_TIMEOUT) means this raises instead of
                    # hanging forever, but a single transient apiserver blip
                    # still shouldn't fail an otherwise-healthy multi-hour
                    # restore -- retry the poll instead.
                    print(f"  transient error polling restore status: {e} -- retrying", file=sys.stderr)
                    time.sleep(POLL_INTERVAL)
                    continue
                phase = (restore or {}).get("status", {}).get("phase", "New")
                print(f"  phase={phase}")
                if phase in ("Completed", "PartiallyFailed", "Failed"):
                    break
                time.sleep(POLL_INTERVAL)

            status = (restore or {}).get("status", {})
            errors = status.get("errors", 0)
            warnings = status.get("warnings", 0)
            failure_reason = status.get("failureReason", "")
            detail = f"namespace={target_ns} backup={backup_name} phase={phase} errors={errors} warnings={warnings}"
            if failure_reason:
                detail += f" failureReason={failure_reason!r}"
                print(f"  failureReason: {failure_reason}", file=sys.stderr)

            if phase != "Completed" or errors:
                success = False
                failure_class = "restore_timed_out" if "timeout" in failure_reason.lower() else "restore_failed"
            else:
                healthy, pod_detail = pods_healthy(scratch_ns)
                print(f"  {scratch_ns}: {pod_detail}")
                success = healthy
                detail += f", {pod_detail}"
                if not success:
                    failure_class = "unhealthy_pods"

        except Exception as e:
            import traceback
            traceback.print_exc()
            detail = f"exception: {e}"
            success = False
            failure_class = "script_error"
        finally:
            cleanup(restore_name, [scratch_ns])

        report_result({
            "@timestamp": run_ts, "schedule": SCHEDULE_NAME, "namespace": target_ns,
            "backup": backup_name, "phase": phase, "success": success,
            "errors": errors, "warnings": warnings,
            "durationSeconds": round(time.time() - run_start, 1), "detail": detail,
            "failureReason": failure_reason,
            "failureClass": "ok" if success else failure_class,
            "source": "velero-restore-test",
        })

        if success:
            print(f"=== Restore test PASSED ({detail}) ===")
        else:
            print(f"=== Restore test FAILED ({detail}) ===", file=sys.stderr)
            notify("Velero restore test FAILED", detail, priority=1)
            sys.exit(1)

    if __name__ == "__main__":
        main()
