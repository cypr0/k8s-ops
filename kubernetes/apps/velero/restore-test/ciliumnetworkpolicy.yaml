---
# velero-restore-test CronJob pods only — NOT a generic
# batch.kubernetes.io/job-name selector, since Velero itself spawns many
# other Job pods in this namespace (repo maintenance, etc.) that must keep
# their own (unrestricted) egress to reach S3.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: velero-restore-test-jobs
  namespace: velero
spec:
  endpointSelector:
    matchLabels:
      app: velero-restore-test
  ingress: []
  egress:
    # DNS — L7 dns rule required so Cilium learns the IPs behind the toFQDNs
    # entry below (api.pushover.net); otherwise toFQDNs resolves to nothing.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Kubernetes API (backups/restores CRUD, namespace/pod/pvc reads)
    - toEntities:
        - kube-apiserver
    # OpenSearch REST API (report restore-test results for the dashboard)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": logging
            opensearch.org/opensearch-cluster: opensearch
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
    # Pushover alerting
    - toFQDNs:
        - matchName: "api.pushover.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
