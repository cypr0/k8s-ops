---
# Pushover alerting for failed restore tests (reuses the same "pushover" item
# already used by opensearch-sa/alertmanager).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-restore-test-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: velero-restore-test-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PUSHOVER_TOKEN: "{{ .ALERTMANAGER_PUSHOVER_API_TOKEN }}"
        PUSHOVER_USER: "{{ .PUSHOVER_USER_KEY }}"
        OPENSEARCH_PASSWORD: "{{ .OPENSEARCH_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: pushover
    - extract:
        key: opensearch
