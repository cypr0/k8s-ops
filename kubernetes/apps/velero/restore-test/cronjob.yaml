---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: velero-restore-test
spec:
  # Run after the 02:00 daily backup has had time to complete.
  schedule: "0 5 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      # Must exceed the script's own POLL_TIMEOUT (60 min) plus headroom for
      # setup/cleanup, or Kubernetes kills the pod before the script's own
      # timeout logic can mark the run as failed and report why.
      activeDeadlineSeconds: 4200
      template:
        metadata:
          # Distinct from Velero's own internally-spawned Jobs (repo
          # maintenance, etc.) — batch.kubernetes.io/job-name alone isn't
          # unique enough to scope a CiliumNetworkPolicy to just this CronJob.
          labels:
            app: velero-restore-test
        spec:
          serviceAccountName: velero-restore-test
          restartPolicy: Never
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          containers:
            - name: restore-test
              image: python:3.14-alpine
              command:
                - "python3"
                - "-u"
                - "/scripts/restore_test.py"
              env:
                - name: SCHEDULE_NAME
                  value: "daily"
                - name: NAMESPACES
                  value: "nextcloud,paperless,open-webui,openclaw"
                - name: PUSHOVER_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: velero-restore-test-credentials
                      key: PUSHOVER_TOKEN
                - name: PUSHOVER_USER
                  valueFrom:
                    secretKeyRef:
                      name: velero-restore-test-credentials
                      key: PUSHOVER_USER
                - name: OPENSEARCH_HOST
                  value: "https://opensearch.logging.svc.cluster.local:9200"
                - name: OPENSEARCH_USER
                  value: "admin"
                - name: OPENSEARCH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: velero-restore-test-credentials
                      key: OPENSEARCH_PASSWORD
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop:
                    - "ALL"
          volumes:
            - name: scripts
              configMap:
                name: velero-restore-test-script
                defaultMode: 0755
