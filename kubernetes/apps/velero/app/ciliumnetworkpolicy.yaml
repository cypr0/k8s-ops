---
# Velero server + node-agent daemonset: both carry app.kubernetes.io/name=velero.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: velero
  namespace: velero
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: velero
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # S3-compatible backup storage (Intercolo)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
