---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
spec:
  interval: 1h
  chart:
    spec:
      # renovate: datasource=helm depName=velero registryUrl=https://vmware-tanzu.github.io/helm-charts
      chart: velero
      version: "12.1.0"
      sourceRef:
        kind: HelmRepository
        name: vmware-tanzu
        namespace: velero
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  # Injects the S3 endpoint/region from the velero-credentials Secret at
  # helm-controller reconcile time — avoids needing Flux postBuild
  # substitution (and a separate bootstrap stage) for these two values.
  valuesFrom:
    - kind: Secret
      name: velero-credentials
      valuesKey: S3_ENDPOINT
      targetPath: configuration.backupStorageLocation[0].config.s3Url
    - kind: Secret
      name: velero-credentials
      valuesKey: S3_REGION
      targetPath: configuration.backupStorageLocation[0].config.region
  values:
    # Pinned to v1.8.2 (last release on AWS SDK v1) — v1.9+ moved to SDK v2,
    # which sends chunked/trailer-signed PutObject requests
    # ("x-amz-trailer-signature" BadHeader). Per Intercolo's own compat docs
    # (docs.intercolo.de/en/docs/object_storage/compatibility/): "Chunked
    # uploads ... and trailing checksums are supported, but SigV4 Chunk
    # signatures are not [supported]" — confirmed live on 2026-08-09 that
    # AWS_REQUEST_CHECKSUM_CALCULATION=when_required /
    # AWS_RESPONSE_CHECKSUM_VALIDATION=when_required do NOT avoid the signed
    # trailer for this plugin's upload path, so SDK v1 is the only working
    # option against this endpoint. DO NOT bump past v1.8.2 without testing
    # a real backup against Intercolo first — see .renovaterc.json5, this
    # image is excluded from Renovate for that reason (regressed silently
    # once already, commit ca97746).
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.8.2
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - mountPath: /target
            name: plugins

    credentials:
      useSecret: true
      existingSecret: velero-credentials

    # Only a real S3 destination — snapshots need CSI snapshot support, which
    # the NFS-backed storage class here doesn't have. All volume data goes
    # through the node-agent's kopia-based filesystem backup instead.
    backupsEnabled: true
    snapshotsEnabled: false
    deployNodeAgent: true

    configuration:
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: k8s-volume-backup
          default: true
          credential:
            name: velero-credentials
            key: cloud
          # region/s3Url injected via valuesFrom above.
          config:
            s3ForcePathStyle: true
      volumeSnapshotLocation: []
      # Back up every pod volume by default — no per-pod annotation needed —
      # since our target namespaces are plain NFS-backed user data.
      defaultVolumesToFsBackup: true

    nodeAgent:
      podSecurityContext:
        runAsUser: 0
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 1Gi

    # 512Mi OOM-killed the server mid-restore when a namespace-scoped restore
    # pulled in every cluster-wide CRD (Flux, Trivy, Kubescape, ...) — fixed
    # properly via excludedResources on the Schedules, but keep headroom.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 1Gi
