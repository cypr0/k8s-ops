---
# S3 credentials + endpoint config for Velero (Intercolo), reusing the same
# "intercolo" 1Password item as plugin-barman-cloud. One Secret serves two
# purposes: the "cloud" key is the AWS-INI file mounted into the Velero
# server/node-agent, and S3_ENDPOINT/S3_REGION are picked up by the
# HelmRelease below via spec.valuesFrom — so no Flux postBuild substitution
# (and no separate bootstrap stage) is needed here.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: velero-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        S3_ENDPOINT: "{{ .S3_ENDPOINT }}"
        S3_REGION: "{{ .S3_REGION }}"
        cloud: |
          [default]
          aws_access_key_id={{ .S3_API_KEY }}
          aws_secret_access_key={{ .S3_API_SECRET }}
  dataFrom:
    - extract:
        key: intercolo
