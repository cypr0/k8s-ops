---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-retry
  namespace: velero
automountServiceAccountToken: true
---
# Read the schedules and their backups, and create one Backup. Deliberately
# enumerated rather than wildcarded: the restrict-rbac-least-privilege
# ClusterPolicy rejects `*` in resources or verbs.
#
# No delete anywhere. A retry only ever adds a Backup; removing one is left to
# Velero's own expiry, which also has to delete the data from the object
# store. A CronJob with delete on backups could quietly destroy the only copy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backup-retry
rules:
  - apiGroups:
      - "velero.io"
    resources:
      - "schedules"
      - "backups"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "velero.io"
    resources:
      - "backups"
    verbs:
      - "create"
  - apiGroups:
      - "postgresql.cnpg.io"
    resources:
      - "scheduledbackups"
      - "backups"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "postgresql.cnpg.io"
    resources:
      - "backups"
    verbs:
      - "create"
---
# Two RoleBindings rather than one ClusterRoleBinding: the job needs the rights
# in exactly two namespaces, and a cluster-wide binding would hand it create
# on backups everywhere.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-retry
  namespace: velero
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-retry
subjects:
  - kind: ServiceAccount
    name: backup-retry
    namespace: velero
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backup-retry
  namespace: database
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: backup-retry
subjects:
  - kind: ServiceAccount
    name: backup-retry
    namespace: velero
