---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app velero-backup-retry
  namespace: velero
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: velero
      namespace: velero
  interval: 1h
  path: ./kubernetes/apps/velero/retry/app
  # No targetNamespace on purpose. The job needs create on CloudNativePG
  # Backups in `database` as well as on Velero Backups in `velero`, so the
  # RoleBindings live in two namespaces and each manifest names its own.
  # targetNamespace would rewrite both to a single one and the database
  # binding would silently land in `velero`, where it grants nothing.
  #
  # Also no postBuild: nothing here needs ${SECRET_*} substitution, and
  # Flux' envsubst runs in strict mode across the whole manifest. The shell
  # variables in the CronJob script are therefore written as plain ${VAR} --
  # correct precisely because no substitution runs over this path. Adding a
  # postBuild later means escaping every one of them as $${VAR}.
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  timeout: 5m
  wait: true
