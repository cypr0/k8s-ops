---
# Provides GRAFANA_CLIENT_ID + GRAFANA_CLIENT_SECRET as env vars
# to Authentik pods so blueprints can read them via !Env
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-grafana-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-grafana-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GRAFANA_CLIENT_ID: "{{ .GRAFANA_OPENID_CLIENT_ID }}"
        GRAFANA_CLIENT_SECRET: "{{ .GRAFANA_OPENID_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: grafana
