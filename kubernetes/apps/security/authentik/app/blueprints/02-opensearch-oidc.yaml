version: 1
metadata:
  name: OpenSearch Dashboards OIDC
  labels:
    app: opensearch-dashboards

entries:
  # ── Custom scope mapping: groups claim for role mapping ───────────────
  - model: authentik_providers_oauth2.scopemapping
    id: opensearch-scope-mapping
    identifiers:
      name: opensearch-scope
    attrs:
      scope_name: opensearch
      description: OpenSearch Dashboards roles and group membership
      expression: |
        groups = [group.name for group in request.user.ak_groups.all()]
        return {
            "groups": groups,
        }

  # ── OAuth2 / OIDC Provider ────────────────────────────────────────────
  - model: authentik_providers_oauth2.oauth2provider
    id: opensearch-oidc-provider
    identifiers:
      name: opensearch-oidc
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env OPENSEARCH_CLIENT_ID
      client_secret: !Env OPENSEARCH_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://logs.${SECRET_DOMAIN}/auth/openid/login
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, opensearch]]

  # ── Application ───────────────────────────────────────────────────────
  - model: authentik_core.application
    id: opensearch-app
    identifiers:
      slug: opensearch
    attrs:
      name: OpenSearch Dashboards
      group: Monitoring
      provider: !KeyOf opensearch-oidc-provider
      meta_launch_url: https://logs.${SECRET_DOMAIN}
      meta_icon: https://opensearch.org/wp-content/uploads/2025/01/opensearch_mark_default.svg
      policy_engine_mode: all
