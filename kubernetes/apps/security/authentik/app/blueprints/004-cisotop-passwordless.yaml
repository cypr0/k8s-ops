---
version: 1
metadata:
  name: cisotop Passwordless Login
  labels:
    app: authentik

entries:
  - model: authentik_flows.flow
    id: cisotop-passwordless
    identifiers:
      slug: cisotop-passwordless
    attrs:
      name: Passwordless Login
      title: Ohne Passwort anmelden
      designation: authentication
      authentication: none

  # Requires a WebAuthn authenticator already registered (via
  # cisotop-authenticator-webauthn-setup, offered during normal MFA
  # enrollment) -- if none is registered there is nothing to fall back to,
  # so not_configured_action=deny.
  - model: authentik_stages_authenticator_validate.authenticatorvalidatestage
    id: cisotop-passwordless-webauthn
    identifiers:
      name: cisotop-passwordless-webauthn
    attrs:
      not_configured_action: deny
      device_classes:
        - webauthn
      webauthn_user_verification: required

  - model: authentik_stages_user_login.userloginstage
    id: cisotop-passwordless-login
    identifiers:
      name: cisotop-passwordless-login
    attrs: {}

  - model: authentik_flows.flowstagebinding
    id: cisotop-passwordless-binding-webauthn
    identifiers:
      target: !KeyOf cisotop-passwordless
      stage: !KeyOf cisotop-passwordless-webauthn
      order: 10
    attrs: {}

  - model: authentik_flows.flowstagebinding
    id: cisotop-passwordless-binding-login
    identifiers:
      target: !KeyOf cisotop-passwordless
      stage: !KeyOf cisotop-passwordless-login
      order: 20
    attrs: {}
