---
version: 1
metadata:
  name: GitLab OIDC
  labels:
    app: gitlab

entries:
  # ── OAuth2 / OIDC Provider ────────────────────────────────────────────
  - model: authentik_providers_oauth2.oauth2provider
    id: gitlab-oidc-provider
    identifiers:
      name: gitlab-oidc
    attrs:
      authentication_flow: !Find
        - authentik_flows.flow
        - - slug
          - cisotop-authentication
      authorization_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-provider-authorization-implicit-consent
      invalidation_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-provider-invalidation-flow
      client_type: confidential
      client_id: !Env GITLAB_CLIENT_ID
      client_secret: !Env GITLAB_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://gitlab.${SECRET_DOMAIN}/users/auth/openid_connect/callback
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - - name
          - "authentik Self-signed Certificate"
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - openid
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - email
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - profile

  # ── Application ───────────────────────────────────────────────────────
  - model: authentik_core.application
    id: gitlab-app
    identifiers:
      slug: gitlab
    attrs:
      name: GitLab
      group: Productivity
      provider: !KeyOf gitlab-oidc-provider
      meta_launch_url: https://gitlab.${SECRET_DOMAIN}
      meta_icon: https://cdn.simpleicons.org/gitlab
      policy_engine_mode: all

  # ── Access: gitlab-users only ─────────────────────────────────────────
  # GitLab auto-creates and auto-links accounts on first OIDC login, so
  # "any Authentik account" would be enough to get one. Membership isn't set
  # here -- add accounts via the Authentik UI (Directory > Groups >
  # gitlab-users > Users) after this reconciles.
  - model: authentik_core.group
    id: gitlab-users-group
    identifiers:
      name: gitlab-users

  - model: authentik_policies.policybinding
    id: gitlab-app-group-binding
    identifiers:
      target: !KeyOf gitlab-app
      order: 0
    attrs:
      group: !KeyOf gitlab-users-group
      enabled: true
      negate: false
      timeout: 30
