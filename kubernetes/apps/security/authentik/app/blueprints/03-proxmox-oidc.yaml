---
version: 1
metadata:
  name: Proxmox VE OIDC
  labels:
    app: proxmox

entries:
  # ── Custom scope: username claim (Proxmox requires "username", not "preferred_username") ──
  - model: authentik_providers_oauth2.scopemapping
    id: proxmox-scope-mapping
    identifiers:
      name: proxmox-scope
    attrs:
      scope_name: proxmox
      description: Proxmox VE username and groups claim
      expression: |
        return {
            "username": request.user.username,
        }

  # ── Groups scope mapping (Proxmox expects "groups" claim as array of group names) ──
  - model: authentik_providers_oauth2.scopemapping
    id: proxmox-groups-mapping
    identifiers:
      name: proxmox-groups
    attrs:
      scope_name: groups
      description: Groups claim for Proxmox VE
      expression: |
        return {
            "groups": [group.name for group in request.user.ak_groups.all()],
        }

  # ── OAuth2 / OIDC Provider ────────────────────────────────────────────
  - model: authentik_providers_oauth2.oauth2provider
    id: proxmox-oidc-provider
    identifiers:
      name: proxmox-oidc
    attrs:
      authentication_flow: !Find
        - authentik_flows.flow
        - - slug
          - cisotop-authentication
      authorization_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-provider-authorization-implicit-consent
      invalidation_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-provider-invalidation-flow
      client_type: confidential
      client_id: !Env PROXMOX_CLIENT_ID
      client_secret: !Env PROXMOX_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://proxmox.${SECRET_DOMAIN}:8006
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - - name
          - "authentik Self-signed Certificate"
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - openid
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - email
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - profile
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - proxmox
        - !Find
          # NOT [scope_name, groups]: every app blueprint declares its own custom
          # groups mapping with the SAME scope_name "groups" (that's just the
          # OAuth2 scope string, not a unique key), so a scope_name lookup is
          # ambiguous across all of them and can silently resolve to a DIFFERENT
          # app's mapping. Look it up by its own unique `name` instead.
          - authentik_providers_oauth2.scopemapping
          - - name
            - proxmox-groups
  # ── Application ───────────────────────────────────────────────────────
  - #magic___^_^___line
    model: authentik_core.application
    id: proxmox-app
    identifiers:
      slug: proxmox
    attrs:
      name: Proxmox VE
      group: Infrastructure
      provider: !KeyOf proxmox-oidc-provider
      meta_launch_url: https://proxmox.${SECRET_DOMAIN}:8006
      meta_icon: https://cdn.simpleicons.org/proxmox
      policy_engine_mode: all
