---
version: 1
metadata:
  name: OpenClaw Forward Auth
  labels:
    app: openclaw

entries:
  # ── Proxy Provider (forward-auth for a single application) ────────────
  - model: authentik_providers_proxy.proxyprovider
    id: openclaw-proxy-provider
    identifiers:
      name: openclaw-proxy
    attrs:
      authentication_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-authentication-flow
      authorization_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-provider-authorization-implicit-consent
      invalidation_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-provider-invalidation-flow
      mode: forward_single
      external_host: https://claw.${SECRET_DOMAIN}
      access_token_validity: hours=24
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - openid
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - email
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - profile
  # ── Application ───────────────────────────────────────────────────────
  - #magic___^_^___line
    model: authentik_core.application
    id: openclaw-app
    identifiers:
      slug: openclaw
    attrs:
      name: OpenClaw
      group: Productivity
      provider: !KeyOf openclaw-proxy-provider
      meta_launch_url: https://claw.${SECRET_DOMAIN}
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/openclaw.png
      policy_engine_mode: all

  # ── Assign the proxy provider to the built-in embedded outpost ────────
  # The embedded outpost is what Envoy's ext_authz talks to. It must be
  # given this provider or the /outpost.goauthentik.io/auth/envoy endpoint
  # returns 404 for claw.${SECRET_DOMAIN}.
  - model: authentik_outposts.outpost
    id: embedded-outpost
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      providers:
        - !KeyOf openclaw-proxy-provider
