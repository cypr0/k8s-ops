version: 1
metadata:
  name: Nextcloud OIDC
  labels:
    app: nextcloud

entries:
  # ── Groups scope mapping (returns groups claim when "groups" scope is requested) ──
  - model: authentik_providers_oauth2.scopemapping
    id: nextcloud-groups-mapping
    identifiers:
      name: nextcloud-groups
    attrs:
      scope_name: groups
      description: Groups claim for Nextcloud
      expression: |
        return {
            "groups": [group.name for group in request.user.ak_groups.all()],
        }

  # ── OAuth2 / OIDC Provider ────────────────────────────────────────────
  - model: authentik_providers_oauth2.oauth2provider
    id: nextcloud-oidc-provider
    identifiers:
      name: nextcloud-oidc
    attrs:
      authentication_flow: !Find [authentik_flows.flow, [slug, default-authentication-flow]]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      client_id: !Env NEXTCLOUD_CLIENT_ID
      client_secret: !Env NEXTCLOUD_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://cloud.${SECRET_DOMAIN}/apps/user_oidc/code
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, groups]]

  # ── Application ───────────────────────────────────────────────────────
  - model: authentik_core.application
    id: nextcloud-app
    identifiers:
      slug: nextcloud
    attrs:
      name: Nextcloud
      group: Productivity
      provider: !KeyOf nextcloud-oidc-provider
      meta_launch_url: https://cloud.${SECRET_DOMAIN}
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/nextcloud.png
      policy_engine_mode: all
