---
version: 1
metadata:
  name: Nextcloud OIDC
  labels:
    app: nextcloud

entries:
  # ── Groups scope mapping (returns groups claim when "groups" scope is requested) ──
  # Authentik superusers are also mapped into Nextcloud's built-in "admin"
  # group (group-provisioning=1 syncs this on every login), since Nextcloud
  # has no separate concept of "superuser" -- membership in the literal
  # group named "admin" IS what grants instance-admin rights there.
  - model: authentik_providers_oauth2.scopemapping
    id: nextcloud-groups-mapping
    identifiers:
      name: nextcloud-groups
    attrs:
      scope_name: groups
      description: Groups claim for Nextcloud
      expression: |
        groups = [group.name for group in request.user.ak_groups.all()]
        if request.user.is_superuser:
            groups.append("admin")
        return {
            "groups": groups,
        }

  # ── OAuth2 / OIDC Provider ────────────────────────────────────────────
  - model: authentik_providers_oauth2.oauth2provider
    id: nextcloud-oidc-provider
    identifiers:
      name: nextcloud-oidc
    attrs:
      authentication_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-authentication-flow
      authorization_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-provider-authorization-implicit-consent
      invalidation_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-provider-invalidation-flow
      client_type: confidential
      client_id: !Env NEXTCLOUD_CLIENT_ID
      client_secret: !Env NEXTCLOUD_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://cloud.${SECRET_DOMAIN}/apps/user_oidc/code
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      # user_username (not the hashed_user_id default): Nextcloud's user_oidc
      # app maps this straight to the local user_id (mapping-uid=sub,
      # unique-uid=0 in the post-install job) and allow_multiple_user_backends=0
      # means it'll adopt an existing same-named Database-backend account
      # instead of creating a duplicate. That's what lets OIDC login for the
      # "phiros-cmd" Authentik user land on the pre-existing local Nextcloud
      # admin account of the same name, rather than a fresh hashed-uid account
      # with no group membership. NOTE: this is provider-wide -- any other
      # existing OIDC-provisioned Nextcloud user (previously keyed by their old
      # hashed uid) will also get a fresh, differently-named account on their
      # next login and will need `occ user:merge` to fold old data back in.
      sub_mode: user_username
      include_claims_in_id_token: true
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - - name
          - "authentik Self-signed Certificate"
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - openid
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - email
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - profile
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - groups
  # ── Application ───────────────────────────────────────────────────────
  -

    model: authentik_core.application
    id: nextcloud-app
    identifiers:
      slug: nextcloud
    attrs:
      name: Nextcloud
      group: Productivity
      provider: !KeyOf nextcloud-oidc-provider
      meta_launch_url: https://cloud.${SECRET_DOMAIN}
      meta_icon: https://cdn.simpleicons.org/nextcloud
      policy_engine_mode: all
