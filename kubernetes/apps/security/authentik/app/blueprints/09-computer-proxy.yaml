---
version: 1
metadata:
  name: Computer Forward Auth
  labels:
    app: computer

entries:
  # ── Proxy Provider (forward-auth for a single application) ────────────
  - model: authentik_providers_proxy.proxyprovider
    id: computer-proxy-provider
    identifiers:
      name: computer-proxy
    attrs:
      authentication_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-authentication-flow
      authorization_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-provider-authorization-implicit-consent
      invalidation_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-provider-invalidation-flow
      mode: forward_single
      external_host: https://computer.${SECRET_DOMAIN}
      access_token_validity: hours=24
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - openid
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - email
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - profile
  # ── Application ───────────────────────────────────────────────────────
  -

    model: authentik_core.application
    id: computer-app
    identifiers:
      slug: computer
    attrs:
      name: Computer
      group: Productivity
      provider: !KeyOf computer-proxy-provider
      meta_launch_url: https://computer.${SECRET_DOMAIN}
      policy_engine_mode: all

  # ── Embedded outpost: owns the FULL forward-auth provider list ────────
  # The embedded outpost's `providers` is a full-replace field, so exactly one
  # blueprint may set it — otherwise two blueprints would fight and each
  # reconcile would drop the other app's provider. This blueprint is that
  # single owner and lists every forward-auth app: openclaw (defined in
  # 07-openclaw-proxy.yaml, referenced via !Find) + computer (this file).
  # When adding another forward-auth app, add its provider to THIS list.
  - model: authentik_outposts.outpost
    id: embedded-outpost
    identifiers:
      name: authentik Embedded Outpost
    attrs:
      providers:
        - !Find
          - authentik_providers_proxy.proxyprovider
          - - name
            - openclaw-proxy
        - !KeyOf computer-proxy-provider
