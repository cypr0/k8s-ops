---
version: 1
metadata:
  name: Wazuh Dashboard OIDC
  labels:
    app: wazuh-dashboard

entries:
  # ── Custom scope mapping: groups claim for role mapping ───────────────
  # The Wazuh indexer's security plugin reads backend roles from this claim
  # (roles_key: groups) and maps them via roles_mapping.yml -- see
  # kubernetes/apps/security/wazuh/app/externalsecret-securityconfig.yaml.
  - model: authentik_providers_oauth2.scopemapping
    id: wazuh-scope-mapping
    identifiers:
      name: wazuh-scope
    attrs:
      scope_name: wazuh
      description: Wazuh Dashboard roles and group membership
      expression: |
        groups = [group.name for group in request.user.ak_groups.all()]
        return {
            "groups": groups,
        }

  # ── OAuth2 / OIDC Provider ────────────────────────────────────────────
  - model: authentik_providers_oauth2.oauth2provider
    id: wazuh-oidc-provider
    identifiers:
      name: wazuh-oidc
    attrs:
      authentication_flow: !Find
        - authentik_flows.flow
        - - slug
          - cisotop-authentication
      authorization_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-provider-authorization-implicit-consent
      invalidation_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-provider-invalidation-flow
      client_type: confidential
      client_id: !Env WAZUH_CLIENT_ID
      client_secret: !Env WAZUH_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://wazuh.${SECRET_DOMAIN}/auth/openid/login
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - - name
          - "authentik Self-signed Certificate"
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - openid
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - email
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - profile
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - offline_access
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - wazuh

  # ── Application ───────────────────────────────────────────────────────
  - model: authentik_core.application
    id: wazuh-app
    identifiers:
      slug: wazuh
    attrs:
      name: Wazuh
      group: Security
      provider: !KeyOf wazuh-oidc-provider
      meta_launch_url: https://wazuh.${SECRET_DOMAIN}
      meta_icon: https://wazuh.com/uploads/2022/05/wazuh-logo.png
      policy_engine_mode: all

  # ── Groups referenced by roles_mapping.yml on the indexer ─────────────
  # "Wazuh Admins" maps to all_access, "Wazuh Users" to read-only. Membership
  # isn't set here — add your account via the Authentik UI
  # (Directory > Groups > Wazuh Admins > Users) after this reconciles.
  - model: authentik_core.group
    id: wazuh-admins-group
    identifiers:
      name: "Wazuh Admins"

  - model: authentik_core.group
    id: wazuh-users-group
    identifiers:
      name: "Wazuh Users"
