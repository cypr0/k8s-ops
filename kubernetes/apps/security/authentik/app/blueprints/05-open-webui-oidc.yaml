---
version: 1
metadata:
  name: Open WebUI OIDC
  labels:
    app: open-webui

entries:
  # ── Groups scope mapping (returns groups claim when "groups" scope is requested) ──
  - model: authentik_providers_oauth2.scopemapping
    id: open-webui-groups-mapping
    identifiers:
      name: open-webui-groups
    attrs:
      scope_name: groups
      description: Groups claim for Open WebUI
      expression: |
        return {
            "groups": [group.name for group in request.user.ak_groups.all()],
        }

  # ── OAuth2 / OIDC Provider ────────────────────────────────────────────
  - model: authentik_providers_oauth2.oauth2provider
    id: open-webui-oidc-provider
    identifiers:
      name: open-webui-oidc
    attrs:
      authentication_flow: !Find
        - authentik_flows.flow
        - - slug
          - cisotop-authentication
      authorization_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-provider-authorization-implicit-consent
      invalidation_flow: !Find
        - authentik_flows.flow
        - - slug
          - default-provider-invalidation-flow
      client_type: confidential
      client_id: !Env OPENWEBUI_CLIENT_ID
      client_secret: !Env OPENWEBUI_CLIENT_SECRET
      redirect_uris:
        - matching_mode: strict
          url: https://ai.${SECRET_DOMAIN}/oauth/oidc/callback
      access_code_validity: minutes=1
      access_token_validity: minutes=5
      refresh_token_validity: days=30
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      signing_key: !Find
        - authentik_crypto.certificatekeypair
        - - name
          - "authentik Self-signed Certificate"
      property_mappings:
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - openid
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - email
        - !Find
          - authentik_providers_oauth2.scopemapping
          - - scope_name
            - profile
        - !Find
          # NOT [scope_name, groups]: every app blueprint declares its own custom
          # groups mapping with the SAME scope_name "groups" (that's just the
          # OAuth2 scope string, not a unique key), so a scope_name lookup is
          # ambiguous across all of them and can silently resolve to a DIFFERENT
          # app's mapping. Look it up by its own unique `name` instead.
          - authentik_providers_oauth2.scopemapping
          - - name
            - open-webui-groups
  # ── Application ───────────────────────────────────────────────────────
  - #magic___^_^___line
    model: authentik_core.application
    id: open-webui-app
    identifiers:
      slug: open-webui
    attrs:
      name: Open WebUI
      group: Productivity
      provider: !KeyOf open-webui-oidc-provider
      meta_launch_url: https://ai.${SECRET_DOMAIN}
      meta_icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/open-webui-light.png
      policy_engine_mode: all
