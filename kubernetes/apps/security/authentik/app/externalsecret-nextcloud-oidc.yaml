---
# Provides NEXTCLOUD_CLIENT_ID + NEXTCLOUD_CLIENT_SECRET as env vars
# to Authentik pods so blueprints can read them via !Env
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-nextcloud-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-nextcloud-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NEXTCLOUD_CLIENT_ID: "{{ .NEXTCLOUD_OIDC_CLIENT_ID }}"
        NEXTCLOUD_CLIENT_SECRET: "{{ .NEXTCLOUD_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: nextcloud
