---
# Provides OPENWEBUI_CLIENT_ID + OPENWEBUI_CLIENT_SECRET as env vars
# to Authentik pods so blueprints can read them via !Env
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-open-webui-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-open-webui-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENWEBUI_CLIENT_ID: "{{ .OPENWEBUI_OIDC_CLIENT_ID }}"
        OPENWEBUI_CLIENT_SECRET: "{{ .OPENWEBUI_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: openwebui
