---
# Provides PAPERLESS_CLIENT_ID + PAPERLESS_CLIENT_SECRET as env vars
# to Authentik pods so blueprints can read them via !Env
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-paperless-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-paperless-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PAPERLESS_CLIENT_ID: "{{ .PAPERLESS_OPENID_CLIENT_ID }}"
        PAPERLESS_CLIENT_SECRET: "{{ .PAPERLESS_OPENID_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: paperless
