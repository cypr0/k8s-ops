---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 1h
  chart:
    spec:
      chart: authentik
      # Intermediate stop on the way to 2026.8.1: authentik refuses to
      # migrate directly from 2026.2.3 to 2026.8.1 ("Major version skips
      # are not allowed") -- Renovate jumped straight there once the
      # sourceRef.namespace fix (see git log) let it see authentik updates
      # for the first time. 2026.5.x is the required intermediate release
      # line; bump straight to 2026.8.1 again once this is healthy.
      version: 2026.8.4
      sourceRef:
        kind: HelmRepository
        name: authentik
  maxHistory: 2
  # Helm's default is 5m. The worker Deployment rolls its two replicas one
  # after the other, and on 2026-10-17 a 2026.8.4 worker container took up
  # to 3 min to turn Ready on a node that still had to pull the image, so
  # two such pods would not fit and Helm would roll back a healthy release.
  timeout: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  uninstall:
    keepHistory: false
  # Keep the geoip sidecar from ever failing the pod. The image's entrypoint
  # (/usr/bin/entry.sh) runs under `set -e`, so a single failed download --
  # MaxMind's "Daily GeoIP database download limit reached" 429, a 401, a
  # network blip -- exits the container. It then crash-loops, and since a Pod
  # is only Ready when every container is, the server/worker pod never turns
  # Ready even though authentik itself is fine: Helm's upgrade AND its
  # rollback time out, and each retry starts new pods whose sidecars burn
  # more of the quota (2026-08-16, 2026-10-11, 2026-10-17). The chart has no
  # command or probe override for this container, hence the patch: the stock
  # entrypoint still does the work, but when it exits the failure is logged
  # and retried an hour later while the container keeps running.
  # Trade-off: authentik only opens the database if it exists when the
  # process starts (GeoIPContextProcessor.city() returns early while no
  # reader is open), so a pod that starts while MaxMind refuses runs without
  # geo data until its next restart. Acceptable here -- GeoIP only enriches
  # events, no GeoIP policy exists (checked 2026-10-17).
  # A JSON patch by index rather than a strategic merge by name: kustomize's
  # strategic merge moves the patched container to the front of the list,
  # which would make geoip the default for `kubectl logs/exec`. The `test`
  # op fails the render (and so the upgrade) if the chart ever reorders the
  # containers, instead of patching the wrong one.
  # $$ escapes keep these as shell variables (Flux must not substitute them).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: authentik-(server|worker)
            patch: |
              - op: test
                path: /spec/template/spec/containers/1/name
                value: geoip
              - op: add
                path: /spec/template/spec/containers/1/command
                value:
                  - /bin/sh
                  - -c
                  - |
                    trap 'kill "$$pid" 2>/dev/null; wait "$$pid"; exit 0' TERM
                    while true; do
                      /usr/bin/entry.sh &
                      pid=$$!
                      wait "$$pid"
                      echo "# STATE: geoipupdate exited ($$?), retrying in 1 hour"
                      sleep 3600 &
                      pid=$$!
                      wait "$$pid"
                    done
  values:
    global:
      deploymentAnnotations:
        secret.reloader.stakater.com/reload: "authentik-secret,authentik-grafana-oidc,authentik-paperless-oidc,authentik-open-webui-oidc,authentik-nextcloud-oidc,authentik-immich-oidc,authentik-pushover"
      deploymentStrategy:
        type: RollingUpdate
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - "ALL"
      envFrom:
        - secretRef:
            name: authentik-secret
        - secretRef:
            name: authentik-grafana-oidc
        - secretRef:
            name: authentik-proxmox-oidc
        - secretRef:
            name: authentik-paperless-oidc
        - secretRef:
            name: authentik-open-webui-oidc
        - secretRef:
            name: authentik-nextcloud-oidc
        - secretRef:
            name: authentik-immich-oidc
        - secretRef:
            name: authentik-wazuh-oidc
        - secretRef:
            name: authentik-pushover
            optional: true
      volumes:
        - name: authentik-templates
          configMap:
            name: authentik-templates
        - name: authentik-blueprints
          configMap:
            name: authentik-blueprints
      volumeMounts:
        - name: authentik-templates
          mountPath: /templates
        - name: authentik-blueprints
          mountPath: /blueprints/custom
          readOnly: true
    authentik:
      log_level: info
      avatars: "gravatar,initials"
      email:
        # Migrated off the old external mail server onto the in-cluster
        # Mailu instance (kubernetes/apps/mail/mailu/), shared "noreply"
        # mailbox with Immich/Nextcloud. CoreDNS resolves this hostname
        # in-cluster straight to mailu-front's ClusterIP (see
        # kubernetes/apps/kube-system/coredns/app/helmrelease.yaml), so
        # this is a same-cluster call, not a real external hop -- see the
        # egress rule in ciliumnetworkpolicy.yaml. Submission port with
        # STARTTLS + auth, since Mailu (unlike the old server) doesn't
        # allow-list this cluster for unauthenticated relay. Credentials
        # (AUTHENTIK_EMAIL__USERNAME / AUTHENTIK_EMAIL__PASSWORD) come via
        # envFrom (authentik-secret, see externalsecret.yaml) rather than
        # here, since authentik.email.password would otherwise land in
        # plaintext in the HelmRelease's rendered values.
        host: mail.${SECRET_DOMAIN}
        port: 587
        from: "Authentik <noreply@${SECRET_DOMAIN}>"
        timeout: 30
        use_tls: true
        use_ssl: false
      error_reporting:
        enable: false
        send_pii: false
      redis:
        host: dragonfly.database.svc.cluster.local
    server:
      autoscaling:
        enabled: true
        minReplicas: 1
        # 2, not 3: this is SSO for a household, and each replica sits at
        # ~450MiB. Two still survive a node going away and still allow a
        # rolling update without a gap, which is what the replicas are
        # actually for here.
        maxReplicas: 2
        targetCPUUtilizationPercentage: 70
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
      # No ".prometheus" level exists in this chart, and metrics.enabled was
      # missing entirely -- which is why authentik-server's Service never even
      # carried a metrics port despite the pod listening on 9300. Same class of
      # silently-ignored value as falco's serviceMonitor.enabled.
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
    worker:
      autoscaling:
        enabled: true
        minReplicas: 1
        # Same reasoning as the server above. Worker CPU spikes during
        # blueprint imports, which is exactly when the HPA scales -- it just
        # tops out one replica lower now.
        maxReplicas: 2
        targetCPUUtilizationPercentage: 70
      resources:
        requests:
          # Deliberately still 50m. Measured over 14 days (Prometheus, summed
          # over replicas) the worker needs p50 100m, p99 133m, max 243m, so at
          # 50m (+10m geoip) the HPA's 70% target sits far below baseline and
          # it holds 2 of 2 replicas: KubeHpaMaxedOut keeps firing (a warning,
          # repeated every 3d). 200m would fix that (one replica at ~48%, p99
          # ~63%; 100m would not, 91-121%).
          # 200m was tried on 2026-10-11 and reverted: ANY change to this pod
          # template restarts the pods, each new pod's geoip sidecar downloads
          # from MaxMind, and that day's quota was already used up (429), so
          # the new pods never became Ready and Helm's upgrade AND its rollback
          # both timed out. See
          # docs/incidents/2026-10-11-wazuh-pushover-quota-exhaustion.md.
          # Since the geoip wrapper (postRenderers above, 2026-10-17) a 429
          # no longer keeps a pod NotReady, so 200m can be re-applied.
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 1Gi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
    geoip:
      # Was temporarily disabled 2026-08-16 after the sidecar's geoipupdate
      # container crash-looped on "429 LIMIT_EXCEEDED: Daily GeoIP database
      # download limit reached" -- almost certainly triggered by that
      # session's own repeated authentik-server/worker restarts (each
      # restart = a fresh download attempt against MaxMind's account-wide
      # daily quota). Because the chart runs geoip as a regular sidecar (no
      # readinessProbe override -- confirmed still true as of chart
      # 2026.8.3, templates/server & worker deployment.yaml), a crash-
      # looping geoip container blocks the WHOLE pod's Ready condition,
      # which took authentik-server's Service to 0 endpoints -- a full
      # cluster-wide SSO outage, not just missing geo-enrichment. See
      # docs/incidents/2026-08-16-authentik-geoip-sidecar-sso-outage.md.
      # Re-enabled 2026-09-27. Since 2026-10-17 the container can no longer
      # crash-loop (see postRenderers at the top), so a 429 now only means
      # missing geo data, and disabling geoip is no longer the fix. The quota
      # does NOT reset at UTC midnight as earlier notes said: on 2026-10-17 it
      # answered 429 at 14:55:58Z and served a download at 15:01:03Z, which
      # looks like a rolling 24h window. Every new pod downloads both
      # editions (the database sits in a per-pod emptyDir), so restarts and
      # HPA scale-ups are what use it up.
      enabled: true
      editionIds: "GeoLite2-City GeoLite2-ASN"
      updateInterval: 48
      existingSecret:
        secretName: authentik-secret
        accountId: MAXMIND_ACCOUNT_ID
        licenseKey: MAXMIND_LICENSE_KEY
      # The chart supports geoip.resources (templates/server & worker
      # deployment.yaml) but ships no default -- confirmed live: without
      # it, this sidecar has no CPU request at all, and the server/worker
      # HPAs (targetCPUUtilizationPercentage above) fail outright with
      # "missing request for cpu in container geoip", unable to compute
      # utilization for either Deployment. geoipupdate only runs a
      # periodic DB download (updateInterval: 48h), so a small request is
      # plenty -- this isn't meant to size the container, just give the
      # HPA a denominator to divide by.
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
