---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 1h
  chart:
    spec:
      chart: authentik
      # Intermediate stop on the way to 2026.8.1: authentik refuses to
      # migrate directly from 2026.2.3 to 2026.8.1 ("Major version skips
      # are not allowed") -- Renovate jumped straight there once the
      # sourceRef.namespace fix (see git log) let it see authentik updates
      # for the first time. 2026.5.x is the required intermediate release
      # line; bump straight to 2026.8.1 again once this is healthy.
      version: 2026.8.3
      sourceRef:
        kind: HelmRepository
        name: authentik
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  uninstall:
    keepHistory: false
  values:
    global:
      deploymentAnnotations:
        secret.reloader.stakater.com/reload: "authentik-secret,authentik-grafana-oidc,authentik-paperless-oidc,authentik-open-webui-oidc,authentik-nextcloud-oidc,authentik-immich-oidc,authentik-pushover"
      deploymentStrategy:
        type: RollingUpdate
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - "ALL"
      envFrom:
        - secretRef:
            name: authentik-secret
        - secretRef:
            name: authentik-grafana-oidc
        - secretRef:
            name: authentik-proxmox-oidc
        - secretRef:
            name: authentik-paperless-oidc
        - secretRef:
            name: authentik-open-webui-oidc
        - secretRef:
            name: authentik-nextcloud-oidc
        - secretRef:
            name: authentik-immich-oidc
        - secretRef:
            name: authentik-wazuh-oidc
        - secretRef:
            name: authentik-pushover
            optional: true
      volumes:
        - name: authentik-templates
          configMap:
            name: authentik-templates
        - name: authentik-blueprints
          configMap:
            name: authentik-blueprints
      volumeMounts:
        - name: authentik-templates
          mountPath: /templates
        - name: authentik-blueprints
          mountPath: /blueprints/custom
          readOnly: true
    authentik:
      log_level: info
      avatars: "gravatar,initials"
      email:
        # Migrated off the old external mail server onto the in-cluster
        # Mailu instance (kubernetes/apps/mail/mailu/), shared "noreply"
        # mailbox with Immich/Nextcloud. CoreDNS resolves this hostname
        # in-cluster straight to mailu-front's ClusterIP (see
        # kubernetes/apps/kube-system/coredns/app/helmrelease.yaml), so
        # this is a same-cluster call, not a real external hop -- see the
        # egress rule in ciliumnetworkpolicy.yaml. Submission port with
        # STARTTLS + auth, since Mailu (unlike the old server) doesn't
        # allow-list this cluster for unauthenticated relay. Credentials
        # (AUTHENTIK_EMAIL__USERNAME / AUTHENTIK_EMAIL__PASSWORD) come via
        # envFrom (authentik-secret, see externalsecret.yaml) rather than
        # here, since authentik.email.password would otherwise land in
        # plaintext in the HelmRelease's rendered values.
        host: mail.${SECRET_DOMAIN}
        port: 587
        from: "Authentik <noreply@${SECRET_DOMAIN}>"
        timeout: 30
        use_tls: true
        use_ssl: false
      error_reporting:
        enable: false
        send_pii: false
      redis:
        host: dragonfly.database.svc.cluster.local
    server:
      autoscaling:
        enabled: true
        minReplicas: 1
        # 2, not 3: this is SSO for a household, and each replica sits at
        # ~450MiB. Two still survive a node going away and still allow a
        # rolling update without a gap, which is what the replicas are
        # actually for here.
        maxReplicas: 2
        targetCPUUtilizationPercentage: 70
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 1Gi
      # No ".prometheus" level exists in this chart, and metrics.enabled was
      # missing entirely -- which is why authentik-server's Service never even
      # carried a metrics port despite the pod listening on 9300. Same class of
      # silently-ignored value as falco's serviceMonitor.enabled.
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
    worker:
      autoscaling:
        enabled: true
        minReplicas: 1
        # Same reasoning as the server above. Worker CPU spikes during
        # blueprint imports, which is exactly when the HPA scales -- it just
        # tops out one replica lower now.
        maxReplicas: 2
        targetCPUUtilizationPercentage: 70
      resources:
        requests:
          cpu: 50m
          memory: 512Mi
        limits:
          memory: 1Gi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
    geoip:
      # Temporarily disabled 2026-08-16: the sidecar's geoipupdate container
      # crash-loops on "429 LIMIT_EXCEEDED: Daily GeoIP database download
      # limit reached" -- almost certainly triggered by this session's own
      # repeated authentik-server/worker restarts (each restart = a fresh
      # download attempt against MaxMind's account-wide daily quota). Because
      # the chart runs geoip as a regular sidecar (no readinessProbe override),
      # a crash-looping geoip container blocks the WHOLE pod's Ready
      # condition, which took authentik-server's Service to 0 endpoints --
      # a full cluster-wide SSO outage, not just missing geo-enrichment.
      # Re-enable once MaxMind's daily quota resets (resets at UTC midnight
      # for the free tier) and confirm no crash-loop before trusting it again.
      enabled: false
      editionIds: "GeoLite2-City GeoLite2-ASN"
      updateInterval: 48
      existingSecret:
        secretName: authentik-secret
        accountId: MAXMIND_ACCOUNT_ID
        licenseKey: MAXMIND_LICENSE_KEY
      # The chart supports geoip.resources (templates/server & worker
      # deployment.yaml) but ships no default -- confirmed live: without
      # it, this sidecar has no CPU request at all, and the server/worker
      # HPAs (targetCPUUtilizationPercentage above) fail outright with
      # "missing request for cpu in container geoip", unable to compute
      # utilization for either Deployment. geoipupdate only runs a
      # periodic DB download (updateInterval: 48h), so a small request is
      # plenty -- this isn't meant to size the container, just give the
      # HPA a denominator to divide by.
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
