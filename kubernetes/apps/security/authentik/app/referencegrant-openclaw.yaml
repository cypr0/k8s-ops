---
# Allows the OpenClaw HTTPRoute and forward-auth SecurityPolicy (both in the
# openclaw namespace) to reference the authentik-server Service here in the
# security namespace for Authentik embedded-outpost forward-auth.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: openclaw-to-authentik-server
  namespace: security
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: openclaw
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: openclaw
  to:
    - group: ""
      kind: Service
      name: authentik-server
