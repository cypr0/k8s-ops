---
# Provides GITLAB_CLIENT_ID + GITLAB_CLIENT_SECRET as env vars
# to Authentik pods so blueprints can read them via !Env
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-gitlab-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-gitlab-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GITLAB_CLIENT_ID: "{{ .GITLAB_OIDC_CLIENT_ID }}"
        GITLAB_CLIENT_SECRET: "{{ .GITLAB_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: gitlab
