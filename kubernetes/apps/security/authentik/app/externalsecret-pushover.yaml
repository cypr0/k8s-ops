---
# Provides AUTHENTIK_PUSHOVER_API_TOKEN + PUSHOVER_USER_KEY as env vars
# to Authentik pods so blueprints can read them via !Env
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-pushover
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-pushover
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        AUTHENTIK_PUSHOVER_API_TOKEN: "{{ .AUTHENTIK_PUSHOVER_API_TOKEN }}"
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
  dataFrom:
    - extract:
        key: pushover
