---
# Provides WAZUH_CLIENT_ID + WAZUH_CLIENT_SECRET as env vars
# to Authentik pods so blueprints can read them via !Env
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-wazuh-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-wazuh-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        WAZUH_CLIENT_ID: "{{ .WAZUH_OIDC_CLIENT_ID }}"
        WAZUH_CLIENT_SECRET: "{{ .WAZUH_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: wazuh
