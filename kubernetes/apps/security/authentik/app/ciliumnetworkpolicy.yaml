---
# authentik-server: reachable from network namespace (envoy proxies) + security
# authentik-worker: only internal communication
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik
  namespace: security
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authentik
  ingress:
    # Envoy proxy pods (in network namespace)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: network
    # Internal security namespace (worker ↔ server)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: security
  egress:
    # postgres + dragonfly
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: database
    # External: GeoIP updates, OIDC federation
    - toEntities:
        - world
    # Outbound notification mail via the in-cluster Mailu instance
    # (kubernetes/apps/mail/mailu/, submission port). CoreDNS resolves
    # mail.${SECRET_DOMAIN} to mailu-front's ClusterIP for in-cluster
    # clients, which is a real cluster-internal identity, not `world` --
    # needs its own rule despite the toEntities:world rule above.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": mail
            app.kubernetes.io/name: mailu
            app.kubernetes.io/component: front
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
    # Kubernetes API: authentik-worker uses k8s service account APIs
    - toEntities:
        - kube-apiserver
    # DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
