---
# Provides IMMICH_CLIENT_ID + IMMICH_CLIENT_SECRET as env vars
# to Authentik pods so blueprints can read them via !Env
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-immich-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-immich-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        IMMICH_CLIENT_ID: "{{ .IMMICH_OPENID_CLIENT_ID }}"
        IMMICH_CLIENT_SECRET: "{{ .IMMICH_OPENID_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: immich
