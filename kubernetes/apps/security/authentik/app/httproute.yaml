---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-ui
spec:
  hostnames: ["id.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
    # Also expose via the internal gateway so in-cluster OIDC clients
    # (opensearch dashboards + data nodes) can reach Authentik internally
    # (id.${SECRET_DOMAIN} is resolved to the envoy-internal ClusterIP by
    # CoreDNS) instead of taking the public Cloudflare hairpin, which Cloudflare
    # drops as a cdn-loop and which broke OIDC token/JWKS validation.
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: authentik-server
          namespace: security
          port: 80
