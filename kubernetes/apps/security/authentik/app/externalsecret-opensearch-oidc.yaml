---
# Provides OPENSEARCH_CLIENT_ID + OPENSEARCH_CLIENT_SECRET as env vars
# to Authentik pods so blueprints can read them via !Env
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-opensearch-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: authentik-opensearch-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENSEARCH_CLIENT_ID: "{{ .OPENSEARCH_OIDC_CLIENT_ID }}"
        OPENSEARCH_CLIENT_SECRET: "{{ .OPENSEARCH_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: opensearch
