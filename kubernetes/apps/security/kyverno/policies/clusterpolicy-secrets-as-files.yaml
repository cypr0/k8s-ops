---
# CIS 5.4.1 — Prefer using secrets as files over secrets as environment
# variables. Env vars are more likely to leak via process listings, crash
# dumps, or logging of the environment. Audit-only.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: prefer-secrets-as-files
spec:
  background: true
  validationFailureAction: Audit
  rules:
    - name: no-secret-env-vars
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "CIS 5.4.1: prefer mounting Secrets as files (volumes) over env.valueFrom.secretKeyRef / envFrom.secretRef."
        deny:
          conditions:
            any:
              - key: "{{ length(request.object.spec.containers[].env[?valueFrom.secretKeyRef][] || `[]`) }}"
                operator: GreaterThan
                value: 0
              - key: "{{ length(request.object.spec.containers[].envFrom[?secretRef][] || `[]`) }}"
                operator: GreaterThan
                value: 0
