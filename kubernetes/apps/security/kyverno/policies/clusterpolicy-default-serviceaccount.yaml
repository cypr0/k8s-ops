---
# CIS 5.1.5 (default ServiceAccount should not be actively used) and 5.1.6
# (SA tokens only mounted where necessary), collapsed into one heuristic
# check: flag any Pod that relies on the "default" ServiceAccount without
# explicitly disabling token automount. Exemptions mirror the Pod Security
# policies (clusterpolicy-pod-security.yaml) — the same infra namespaces
# legitimately run pods without a dedicated ServiceAccount.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: restrict-default-serviceaccount
  annotations:
    # Evaluate real Pods only. Without this, Kyverno autogen rewrites the rule
    # for Deployments/Jobs/CronJobs too, and the deny-condition JMESPath then
    # errors on the absent nested automountServiceAccountToken field.
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  background: true
  validationFailureAction: Audit
  rules:
    - name: default-sa-automount
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - falco
                - monitoring
                - logging
      validate:
        message: >-
          CIS 5.1.5/5.1.6: Pod uses the default ServiceAccount without
          explicitly setting automountServiceAccountToken: false. Give it a
          dedicated ServiceAccount, or disable token automount if it doesn't
          need API access.
        deny:
          conditions:
            all:
              - key: "{{ request.object.spec.serviceAccountName || 'default' }}"
                operator: Equals
                value: default
              # `|| ``true``` (JSON literal) defaults the absent field to true,
              # so a missing automount setting counts as "not disabled".
              - key: "{{ request.object.spec.automountServiceAccountToken || `true` }}"
                operator: NotEquals
                value: false
