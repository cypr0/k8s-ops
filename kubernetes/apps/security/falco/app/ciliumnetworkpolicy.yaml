---
# Falco DaemonSet: reads kernel syscalls via eBPF, emits security events to falcosidekick
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: falco
  namespace: falco
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: falco
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": falco
            app.kubernetes.io/name: falcosidekick
      toPorts:
        - ports:
            - port: "2801"
              protocol: TCP
    # falcoctl-artifact-install init container: fetches rules from falcosecurity.github.io
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# Falcosidekick: routes Falco alerts to Loki and external webhooks
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: falcosidekick
  namespace: falco
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: falcosidekick
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": falco
            app.kubernetes.io/name: falco
      toPorts:
        - ports:
            - port: "2801"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            # 2801, not 2802. Falcosidekick serves both its event intake and its
            # /metrics on 2801; 2802 is the separate falcosidekick-ui. The typo
            # meant this scrape job had never once succeeded.
            - port: "2801"
              protocol: TCP
    # Kubelet readiness/liveness probes (host network → host entity)
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "2801"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Loki (alert log push)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    # External webhooks: Pushover, Slack, etc.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
