---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falcosidekick
spec:
  interval: 1h
  chart:
    spec:
      chart: falcosidekick
      version: "0.14.0"
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    replicaCount: 2

    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    config:
      # Minimum priority to forward: warning and above
      minimumpriority: warning

      loki:
        hostport: "http://loki.monitoring.svc.cluster.local:3100"
        minimumpriority: warning
        tenant: ""
        extralabels: "source=falco"

      # Everything warning+ goes to Wazuh, which is the single place that
      # pages (Pushover at Wazuh level 12+ = Falco Critical and above) and
      # can correlate with host events and the IOC lists. A `pushover:` block
      # with PUSHOVER_* env vars sat here until 2026-09-27 but never did
      # anything: Falcosidekick has no Pushover output at all (not in the
      # chart, not in its output list), so the pod logged "Enabled Outputs:
      # [Loki]" the whole time and Falco never paged anyone.
      # If Wazuh is down, Gatus pages about that instead.
      syslog:
        host: "wazuh-syslog.wazuh.svc.cluster.local"
        port: "514"
        protocol: "udp"
        format: "json"
        minimumpriority: warning

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1234
      runAsGroup: 1234
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - "ALL"

    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70

    serviceMonitor:
      enabled: true

    grafanaDashboard:
      enabled: true
