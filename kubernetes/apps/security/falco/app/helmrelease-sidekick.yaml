---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falcosidekick
spec:
  interval: 1h
  chart:
    spec:
      chart: falcosidekick
      version: "0.13.1"
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
        namespace: falco
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    replicaCount: 2

    podDisruptionBudget:
      enabled: true
      minAvailable: 1

    config:
      # Minimum priority to forward: warning and above
      minimumpriority: warning

      loki:
        hostport: "http://loki.monitoring.svc.cluster.local:3100"
        minimumpriority: warning
        tenant: ""
        extralabels: "source=falco"

      # OpenSearch for SIEM / Security Analytics
      elasticsearch:
        hostport: "https://opensearch.logging.svc.cluster.local:9200"
        index: "falco"
        type: "falco"
        username: "admin"
        minimumpriority: warning
        mutualtls: false
        checkcert: false
        extralabels: "source=falco"

      pushover:
        minimumpriority: critical

      extraEnv:
      - name: PUSHOVER_APITOKEN
        valueFrom:
          secretKeyRef:
            name: falcosidekick-pushover
            key: PUSHOVER_APITOKEN
      - name: PUSHOVER_USERKEY
        valueFrom:
          secretKeyRef:
            name: falcosidekick-pushover
            key: PUSHOVER_USERKEY
      - name: ELASTICSEARCH_PASSWORD
        valueFrom:
          secretKeyRef:
            name: falcosidekick-opensearch
            key: ELASTICSEARCH_PASSWORD

    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1234
      runAsGroup: 1234
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]

    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 70

    serviceMonitor:
      enabled: true

    grafanaDashboard:
      enabled: true
