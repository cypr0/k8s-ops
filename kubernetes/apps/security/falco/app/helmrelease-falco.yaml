---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
spec:
  interval: 1h
  chart:
    spec:
      chart: falco
      version: "9.0.0"
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
        namespace: falco
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    # Talos OS: use modern eBPF driver (no kernel module, no legacy eBPF)
    driver:
      kind: modern_ebpf

    # Run on all nodes including control-planes
    tolerations:
      - operator: Exists

    collectors:
      enabled: true
      docker:
        enabled: false
      containerd:
        enabled: true
        socket: /run/containerd/containerd.sock
      crio:
        enabled: false

    # Send events to Falcosidekick
    falcosidekick:
      enabled: false  # deployed as separate HelmRelease

    falco:
      json_output: true
      json_include_output_property: true
      log_stderr: true
      log_syslog: false
      priority: warning
      buffered_outputs: false
      outputs:
        rate: 1
        max_burst: 1000
      grpc:
        enabled: true
        bind_address: "unix:///run/falco/falco.sock"
        threadiness: 8
      grpc_output:
        enabled: true

    # Forward to Falcosidekick via HTTP
    falcoctl:
      artifact:
        install:
          enabled: true
        follow:
          enabled: true

    metrics:
      enabled: true
      interval: 15s

    serviceMonitor:
      enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

    podSecurityContext:
      runAsNonRoot: false  # Falco needs root for eBPF
    containerSecurityContext:
      privileged: false
      capabilities:
        add:
          - BPF
          - SYS_PTRACE
          - NET_RAW
          - PERFMON
