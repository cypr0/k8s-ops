---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: falco
spec:
  interval: 1h
  chart:
    spec:
      chart: falco
      version: "9.1.0"
      sourceRef:
        kind: HelmRepository
        name: falcosecurity
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    # Talos OS: use modern eBPF driver (no kernel module, no legacy eBPF)
    driver:
      kind: modern_ebpf

    # Workers only — CPs need RAM for kube-apiserver + etcd
    tolerations: []
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist

    collectors:
      enabled: true
      docker:
        enabled: false
      containerd:
        enabled: true
        socket: /run/containerd/containerd.sock
      crio:
        enabled: false

    # Send events to Falcosidekick
    falcosidekick:
      enabled: false # deployed as separate HelmRelease

    falco:
      json_output: true
      json_include_output_property: true
      log_stderr: true
      log_syslog: false
      priority: warning
      buffered_outputs: false
      outputs:
        rate: 1
        max_burst: 1000

    # Forward to Falcosidekick via HTTP
    falcoctl:
      artifact:
        install:
          enabled: true
        follow:
          enabled: true

    metrics:
      enabled: true
      interval: 15s

    serviceMonitor:
      enabled: true

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi

    customRules:
      homelab-rules.yaml: |-
        # ── Suppress known infrastructure noise ──────────────────────────────

        # Cilium CNI installs its binary to /opt/cni/bin at startup — this
        # triggers "Drop and execute new binary" because the file is writable.
        # It runs at host level (container.id = runtime), not inside a container.
        - rule: Drop and execute new binary in container
          exceptions:
            - name: cilium_cni_install
              fields: [proc.name, container.id]
              comps: [in, =]
              values:
                - [[cilium-cni], runtime]
            # CNPG's barman-cloud WAL-archive process (python3, invoked once
            # per WAL segment) — a routine backup mechanism, not a dropped
            # binary. Was firing CRITICAL ~1300x/week on falco-qhtfl alone.
            - name: cnpg_wal_archive
              fields: [proc.name, proc.cmdline]
              comps: [=, contains]
              values:
                - [python3, "wal-archive"]
          override:
            exceptions: append

        # ── Custom detection rules ────────────────────────────────────────────

        # Alert: shell spawned inside a database container
        # CNPG's own operator invokes `sh -c /controller/manager wal-archive
        # ...` on postgres-1 roughly every 5 minutes as part of routine WAL
        # archiving to barman-cloud -- not an intrusion. Confirmed live
        # (2026-08-16): 30 CRITICAL hits in 6h, all this exact command. Same
        # false-positive shape as the cnpg_wal_archive exception above, just
        # against a different rule -- excluded in the condition itself
        # below (this rule has no `exceptions:` block to extend).
        - rule: Shell in Database Container
          desc: A shell was spawned inside a database pod — potential intrusion
          condition: >
            spawned_process
            and container
            and k8s.ns.name in (database)
            and proc.name in (bash, sh, zsh, dash, ash)
            and not proc.cmdline contains "healthcheck.sh"
            and not proc.cmdline contains "wal-archive"
          output: >
            Shell spawned in database container
            (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name
            cmd=%proc.cmdline image=%container.image.repository)
          priority: CRITICAL
          tags: [database, intrusion, shell]

        # Alert: shell spawned in security-critical namespaces
        - rule: Shell in Security Namespace
          desc: A shell was spawned in security or authentik pod — potential intrusion
          condition: >
            spawned_process
            and container
            and k8s.ns.name in (security)
            and proc.name in (bash, sh, zsh, dash, ash)
            and not k8s.pod.name startswith "authentik-worker"
          output: >
            Shell spawned in security namespace
            (user=%user.name pod=%k8s.pod.name ns=%k8s.ns.name
            cmd=%proc.cmdline image=%container.image.repository)
          priority: CRITICAL
          tags: [security, intrusion, shell]

        # Alert: unexpected write to /etc in any container
        - rule: Write to /etc in Container
          desc: Unexpected write to /etc inside a container
          condition: >
            open_write
            and container
            and fd.name startswith /etc
            and not k8s.ns.name in (kube-system, falco, trivy-system)
          output: >
            Write to /etc in container
            (user=%user.name file=%fd.name pod=%k8s.pod.name
            ns=%k8s.ns.name image=%container.image.repository)
          priority: WARNING
          tags: [filesystem, container]

        # Alert: crypto mining indicators
        - rule: Possible Crypto Mining
          desc: Detects processes commonly used for crypto mining
          condition: >
            spawned_process
            and container
            and proc.name in (xmrig, xmr-stak, minerd, cpuminer, cgminer)
          output: >
            Possible crypto mining process detected
            (proc=%proc.name pod=%k8s.pod.name ns=%k8s.ns.name)
          priority: CRITICAL
          tags: [cryptomining, malware]

    podSecurityContext:
      runAsNonRoot: false # Falco needs root for eBPF
    containerSecurityContext:
      privileged: false
      capabilities:
        add:
          - BPF
          - SYS_PTRACE
          - NET_RAW
          - PERFMON
          - SYS_RESOURCE # needed to bump RLIMIT_MEMLOCK for modern eBPF on Talos
