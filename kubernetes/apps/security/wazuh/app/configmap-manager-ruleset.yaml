---
# Git-managed parts of the manager's ruleset and the centralised agent config.
#
# Each key is mounted into /wazuh-config-mount/etc/..., which the image's
# /etc/cont-init.d/0-wazuh-init copies over /var/ossec on every start. That
# makes Git authoritative: edits to these files through the dashboard's rule
# editor are overwritten on the next restart. Reloader restarts the manager
# when this ConfigMap changes.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-manager-ruleset
data:
  # ---------------------------------------------------------------------------
  # Pushed to every agent in the "default" group (all of them). The <agent_config>
  # blocks are filtered by OS on the agent side and ADD to each host's local
  # ossec.conf -- they do not replace it.
  #
  # Important when reading configmap-manager.yaml: the syscheck/rootcheck blocks
  # in the manager's ossec.conf only apply to the manager container itself.
  # Everything the agents do beyond their packaged defaults comes from here.
  # ---------------------------------------------------------------------------
  agent.conf: |
    <agent_config os="Darwin">
      <syscheck>
        <!-- 4h instead of the packaged 12h: this adds user-writable paths,
             which is where anything malicious on a Mac actually lands. -->
        <frequency>14400</frequency>

        <!-- /etc is a symlink to /private/etc and FIM does not follow
             symlinks, so the packaged /etc entry has been scanning nothing
             (0 files in the FIM database as of 2026-09-27). No report_changes:
             that would ship the contents of /private/etc/ssh host keys. -->
        <directories check_all="yes">/private/etc</directories>

        <!-- Persistence locations. Plists carry no secrets, so diffs are on. -->
        <directories check_all="yes" report_changes="yes">/Library/LaunchAgents,/Library/LaunchDaemons,/Users/*/Library/LaunchAgents</directories>

        <!-- Arrival paths. New files here are hashed and checked against
             etc/lists/ioc-sha256 by rule 100100. recursion_level 3 on
             /Applications reaches Foo.app/Contents/MacOS/<binary> without
             walking every framework inside each bundle. -->
        <directories check_all="yes">/Users/*/Downloads</directories>
        <directories check_all="yes" recursion_level="3">/Applications</directories>

        <ignore type="sregex">\.DS_Store$|\.crdownload$|\.part$|\.download$|\.download/</ignore>
      </syscheck>

      <!-- The hidden-port check compares netstat against bind() probes, which
           disagree constantly on macOS: ~300 false "Port ... hidden" alerts a
           week, no true positives. -->
      <rootcheck>
        <check_ports>no</check_ports>
      </rootcheck>

      <!-- Outcome of the quarantine active response (rules 100170-100172).
           Not collected by the macOS agent by default. -->
      <localfile>
        <log_format>syslog</log_format>
        <location>/Library/Ossec/logs/active-responses.log</location>
      </localfile>
    </agent_config>

    <agent_config os="Linux">
      <syscheck>
        <!-- Real time for the places an intruder edits to keep access. These
             paths are also under the packaged 12-hourly /etc scan; the more
             specific entry wins. No report_changes: /etc/ssh and ~/.ssh hold
             private keys, whose contents would end up in the indexer. -->
        <directories check_all="yes" realtime="yes">/etc/ssh,/etc/sudoers.d,/etc/cron.d,/etc/systemd/system,/etc/pam.d</directories>
        <directories check_all="yes" realtime="yes">/root/.ssh,/var/spool/cron/crontabs</directories>
        <directories check_all="yes">/usr/local/bin,/usr/local/sbin</directories>
      </syscheck>

      <!-- Written by auditd, installed on Proxmox by proxmox-ansible with
           login-session execve and credential-file watch rules. A host
           without auditd only gets a "file not found" warning. -->
      <localfile>
        <log_format>audit</log_format>
        <location>/var/log/audit/audit.log</location>
      </localfile>
    </agent_config>

    <agent_config os="FreeBSD">
      <!-- The EFI system partition is FAT, whose files rootcheck reports as
           "hidden" on every scan. -->
      <rootcheck>
        <ignore>/boot/efi</ignore>
      </rootcheck>
    </agent_config>

  # ---------------------------------------------------------------------------
  # Local decoders. Children of image decoders, so they only run where the
  # parent matched and none of the image's own children did.
  # ---------------------------------------------------------------------------
  local_decoder.xml: |-
    <!-- Unbound query log, every record type:
           info: 10.10.0.2 example.com. HTTPS IN
         The image's unbound-a decoder only extracts srcip/url for A and AAAA,
         and because it has no prematch it is always the child chosen, so a
         differently-named sibling here would never run. Reusing the name
         makes analysisd evaluate this regex as part of the same decoder.
         Separate field names so nothing collides with srcip/url on A/AAAA
         lines; the literal "." strips the trailing dot, matching the list. -->
    <decoder name="unbound-a">
      <parent>unbound</parent>
      <regex> info: (\S+) (\S+). (\S+) IN$</regex>
      <order>dns_client,dns_query,dns_type</order>
    </decoder>

    <!-- Falco alerts from Falcosidekick's syslog output: a syslog header,
         then the Falco JSON. The image's json decoder only fires when the
         line itself starts with "{", so JSON behind a header needs its own
         decoder. Two, because Go's log/syslog stamps RFC3339 with a "Z" for
         UTC, which Wazuh's pre-decoder does not recognise as a header:
           - header recognised (program_name "Falco"): decode the message
           - header not recognised: skip "<ts> <host> Falco[pid]: " by hand
         Tested with both timestamp forms and BSD syslog (2026-09-27). -->
    <decoder name="falcosidekick">
      <program_name>^Falco$</program_name>
      <plugin_decoder>JSON_Decoder</plugin_decoder>
    </decoder>

    <decoder name="falcosidekick-raw">
      <prematch>^\S+ \S+ Falco[\d+]: </prematch>
      <plugin_decoder offset="after_prematch">JSON_Decoder</plugin_decoder>
    </decoder>

    <!-- Quarantine active response on macOS (../agents/macos/quarantine):
           2026/09/27 19:44:02 wazuh-quarantine: quarantined '<file>' '<dest>' rule 100165
         The third field is the destination on success, the reason otherwise. -->
    <decoder name="wazuh-quarantine">
      <prematch>wazuh-quarantine: </prematch>
      <regex>wazuh-quarantine: (\w+) '(\.*)' '(\.*)' rule (\S+)$</regex>
      <order>quarantine.action,quarantine.file,quarantine.detail,quarantine.rule</order>
    </decoder>

    <!-- OPNsense logs authentication as program "audit", which the image
         claims for Solaris BSM (0290-solaris_decoders.xml). Hence a child of
         that decoder rather than a parent of our own:
           user root authenticated successfully for sshd [using ...]
           user root could not authenticate for sshd. [using ...] -->
    <decoder name="opnsense-audit">
      <parent>solaris_bsm</parent>
      <prematch>^user \S+ authenticated successfully for |^user \S+ could not authenticate for </prematch>
      <regex>^user (\S+) \.+ for (\w+)</regex>
      <order>dstuser,service</order>
    </decoder>

  # ---------------------------------------------------------------------------
  # Local rules, range 100000-100999. List files are filled by the
  # wazuh-ioc-feeds CronJob (cronjob-ioc-feeds.yaml); until its first run they
  # do not exist, which analysisd reports as a warning and otherwise ignores.
  # ---------------------------------------------------------------------------
  local_rules.xml: |-
    <group name="local,threat_intel,">

      <!-- FIM: a file whose SHA256 is on a malware feed. Same parents as the
           image's sample rule 99901 (554 = added, 550 = modified), plus
           100160. Only macOS Downloads/Applications binaries/LaunchAgents
           reach VirusTotal (100160); everything else stays local. -->
      <!-- Parent of 100100 below as well: a feed hit inside one of these
           paths must still end up as 100100, not stop at this level-5 rule. -->
      <rule id="100160" level="5">
        <if_sid>554, 550</if_sid>
        <field name="file" type="pcre2">^/Users/[^/]+/Downloads/|^/Applications/[^/]+\.app/Contents/MacOS/|/Library/Launch(Agents|Daemons)/</field>
        <description>FIM: new or changed file in a macOS download, app or persistence path: $(file)</description>
        <group>virustotal_candidate,</group>
      </rule>

      <rule id="100100" level="14">
        <if_sid>554, 550, 100160</if_sid>
        <list field="sha256" lookup="match_key">etc/lists/ioc-sha256</list>
        <description>FIM: file matches a known malware hash (abuse.ch): $(file)</description>
        <mitre>
          <id>T1204.002</id>
        </mitre>
        <group>malware,</group>
      </rule>

      <!-- Active response triggers (quarantine on the MacBook). Separate
           children so the response is scoped to macOS paths, whatever the
           parent matched. Same path set as 100160 and as the script's own
           allow-list. -->
      <rule id="100101" level="14">
        <if_sid>100100</if_sid>
        <field name="file" type="pcre2">^/Users/[^/]+/Downloads/|^/Applications/|/Library/Launch(Agents|Daemons)/</field>
        <description>FIM: known malware hash in $(file) -- quarantining</description>
        <mitre>
          <id>T1204.002</id>
        </mitre>
        <group>malware,active_response,</group>
      </rule>

      <!-- 87105 fires from a single engine; that is too trigger-happy for an
           automatic move (adware/PUA flags on legitimate tools). 5+ engines
           is a clear verdict. -->
      <rule id="100165" level="12">
        <if_sid>87105</if_sid>
        <field name="virustotal.positives" type="pcre2">^([5-9]|[1-9][0-9]+)$</field>
        <description>VirusTotal: $(virustotal.positives)/$(virustotal.total) engines flag $(virustotal.source.file) -- quarantining</description>
        <mitre>
          <id>T1204.002</id>
        </mitre>
        <group>malware,virustotal,active_response,</group>
      </rule>

      <rule id="100170" level="12">
        <decoded_as>wazuh-quarantine</decoded_as>
        <field name="quarantine.action">^quarantined$</field>
        <description>Active response: moved $(quarantine.file) into quarantine ($(quarantine.detail))</description>
        <group>active_response,malware,</group>
      </rule>
      <rule id="100171" level="12">
        <decoded_as>wazuh-quarantine</decoded_as>
        <field name="quarantine.action">^failed$</field>
        <description>Active response: quarantine of $(quarantine.file) FAILED: $(quarantine.detail)</description>
        <group>active_response,malware,</group>
      </rule>
      <rule id="100172" level="5">
        <decoded_as>wazuh-quarantine</decoded_as>
        <field name="quarantine.action">^skipped$</field>
        <description>Active response: quarantine skipped for $(quarantine.file): $(quarantine.detail)</description>
        <group>active_response,</group>
      </rule>

      <!-- OPNsense filterlog (decoder "pf", parent rule 87700). Level above
           87701's 5 so this is evaluated before the generic drop rule. -->
      <rule id="100110" level="12">
        <if_sid>87700</if_sid>
        <action>pass</action>
        <list field="dstip" lookup="address_match_key">etc/lists/ioc-c2-ip</list>
        <description>OPNsense: connection from $(srcip) to known C2 server $(dstip) was ALLOWED</description>
        <mitre>
          <id>T1071</id>
        </mitre>
        <group>malware,c2,</group>
      </rule>
      <rule id="100111" level="7">
        <if_sid>87700</if_sid>
        <action>block</action>
        <list field="dstip" lookup="address_match_key">etc/lists/ioc-c2-ip</list>
        <description>OPNsense: connection from $(srcip) to known C2 server $(dstip) was blocked</description>
        <group>malware,c2,</group>
      </rule>

      <!-- Suricata alert that involves a C2 address, in either direction. -->
      <rule id="100112" level="12">
        <if_sid>86601</if_sid>
        <list field="dest_ip" lookup="address_match_key">etc/lists/ioc-c2-ip</list>
        <description>Suricata: $(alert.signature) -- destination $(dest_ip) is a known C2 server</description>
        <group>malware,c2,</group>
      </rule>
      <rule id="100113" level="12">
        <if_sid>86601</if_sid>
        <list field="src_ip" lookup="address_match_key">etc/lists/ioc-c2-ip</list>
        <description>Suricata: $(alert.signature) -- source $(src_ip) is a known C2 server</description>
        <group>malware,c2,</group>
      </rule>

      <!-- Unbound query log. 500101/500102 are the image's A/AAAA rules; the
           list stores each domain with and without the trailing dot because
           the decoder is inconsistent between the two. -->
      <rule id="100120" level="12">
        <if_sid>500101, 500102</if_sid>
        <list field="url" lookup="match_key">etc/lists/ioc-domains</list>
        <description>DNS: $(srcip) resolved known malicious domain $(url) (abuse.ch)</description>
        <mitre>
          <id>T1071.004</id>
        </mitre>
        <group>malware,c2,</group>
      </rule>

      <!-- Successful SSH login from an address on a public attacker or C2
           list. Failed logins from the same lists are deliberately NOT raised:
           that is most of the ~5000 brute-force attempts Proxmox sees a week. -->
      <rule id="100130" level="12">
        <if_sid>5715</if_sid>
        <list field="srcip" lookup="address_match_key">etc/lists/ioc-scanner-ip</list>
        <description>sshd: successful login from $(srcip), listed as an active attacker</description>
        <mitre>
          <id>T1078</id>
        </mitre>
        <group>authentication_success,</group>
      </rule>
      <rule id="100131" level="14">
        <if_sid>5715</if_sid>
        <list field="srcip" lookup="address_match_key">etc/lists/ioc-c2-ip</list>
        <description>sshd: successful login from $(srcip), listed as a C2 server</description>
        <mitre>
          <id>T1078</id>
        </mitre>
        <group>authentication_success,</group>
      </rule>
    </group>

    <group name="local,opnsense,">
      <!-- Any record type (HTTPS/type 65 above all, which Apple clients send
           alongside every lookup), via the dns_* fields from the local
           unbound-a decoder. The image leaves these at the bare 500002
           grouping rule. Overlaps 100120 for A/AAAA, which is harmless. -->
      <rule id="100121" level="12">
        <if_sid>500002</if_sid>
        <list field="dns_query" lookup="match_key">etc/lists/ioc-domains</list>
        <description>DNS: $(dns_client) resolved known malicious domain $(dns_query) ($(dns_type), abuse.ch)</description>
        <mitre>
          <id>T1071.004</id>
        </mitre>
        <group>malware,c2,</group>
      </rule>

      <!-- OPNsense's own authentication log (SSH, web GUI, VPN). Decoded by
           opnsense-audit in local_decoder.xml; without it these lines fall
           into the Solaris BSM decoder and are dropped at level 0. -->
      <rule id="100150" level="3">
        <if_sid>6100</if_sid>
        <match>authenticated successfully for</match>
        <description>OPNsense: user $(dstuser) authenticated for $(service)</description>
        <group>authentication_success,</group>
      </rule>
      <rule id="100151" level="5">
        <if_sid>6100</if_sid>
        <match>could not authenticate for</match>
        <description>OPNsense: authentication failed for user $(dstuser) on $(service)</description>
        <group>authentication_failed,</group>
      </rule>
      <rule id="100152" level="10" frequency="6" timeframe="120">
        <if_matched_sid>100151</if_matched_sid>
        <description>OPNsense: repeated authentication failures (possible brute force)</description>
        <mitre>
          <id>T1110</id>
        </mitre>
        <group>authentication_failures,</group>
      </rule>
    </group>

    <!-- Falco runtime alerts, sent by Falcosidekick as JSON over remote
         syslog (wazuh-syslog Service). Falco priority maps onto Wazuh level;
         Critical+ reaches Pushover (custom-pushover, level 10+). Falco's own
         noise tuning lives in kubernetes/apps/security/falco/app/
         helmrelease-falco.yaml; suppress there, not here, so Loki and
         Wazuh stay consistent. Alerts show agent wazuh-manager-master-0;
         the node is in data.hostname, the pod in output_fields. -->
    <group name="local,falco,">
      <!-- No decoded_as: the event may come through either Falcosidekick
           decoder above, or plain json. The three fields pin it to Falco. -->
      <rule id="100300" level="0">
        <field name="source">^syscall$|^k8saudit$|^k8s_audit$</field>
        <field name="rule">\.+</field>
        <field name="priority">\.+</field>
        <description>Falco events grouped.</description>
      </rule>

      <rule id="100301" level="12">
        <if_sid>100300</if_sid>
        <field name="priority">^Critical$|^Alert$|^Emergency$</field>
        <description>Falco $(priority): $(rule) in $(output_fields.k8s.ns.name)/$(output_fields.k8s.pod.name)</description>
        <group>falco_critical,</group>
      </rule>
      <rule id="100302" level="10">
        <if_sid>100300</if_sid>
        <field name="priority">^Error$</field>
        <description>Falco $(priority): $(rule) in $(output_fields.k8s.ns.name)/$(output_fields.k8s.pod.name)</description>
      </rule>
      <rule id="100303" level="6">
        <if_sid>100300</if_sid>
        <field name="priority">^Warning$</field>
        <description>Falco $(priority): $(rule) in $(output_fields.k8s.ns.name)/$(output_fields.k8s.pod.name)</description>
      </rule>
      <rule id="100304" level="3">
        <if_sid>100300</if_sid>
        <field name="priority">^Notice$|^Informational$|^Debug$</field>
        <description>Falco $(priority): $(rule) in $(output_fields.k8s.ns.name)/$(output_fields.k8s.pod.name)</description>
      </rule>

      <!-- Correlation with the IOC lists: a Falco event whose remote or
           server address is a known C2. Only network rules carry these
           fields, so this is quiet until one of those fires. -->
      <rule id="100310" level="13">
        <if_sid>100301, 100302, 100303, 100304</if_sid>
        <list field="output_fields.fd.sip" lookup="address_match_key">etc/lists/ioc-c2-ip</list>
        <description>Falco + threat intel: $(output_fields.k8s.ns.name)/$(output_fields.k8s.pod.name) talked to known C2 $(output_fields.fd.sip) ($(rule))</description>
        <group>malware,c2,</group>
      </rule>
      <rule id="100311" level="13">
        <if_sid>100301, 100302, 100303, 100304</if_sid>
        <list field="output_fields.fd.rip" lookup="address_match_key">etc/lists/ioc-c2-ip</list>
        <description>Falco + threat intel: $(output_fields.k8s.ns.name)/$(output_fields.k8s.pod.name) talked to known C2 $(output_fields.fd.rip) ($(rule))</description>
        <group>malware,c2,</group>
      </rule>
    </group>

    <group name="local,noise,">
      <!-- OPNsense app-detection signatures (Suricata "OPN_*" rulesets). They
           block by policy rather than detect a threat; ~520 alerts a week.
           The block itself still happens in OPNsense; this only keeps them
           out of the alert index. -->
      <rule id="100900" level="0">
        <if_sid>86601</if_sid>
        <field name="alert.signature">^OPN_</field>
        <description>Suricata: OPNsense app-detection match (suppressed)</description>
      </rule>
    </group>
