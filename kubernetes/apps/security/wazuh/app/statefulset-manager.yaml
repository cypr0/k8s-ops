---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: wazuh-manager-master
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # Gives the pod the stable DNS name wazuh-manager-master-0.wazuh-cluster,
  # which the dashboard uses as WAZUH_API_URL.
  serviceName: wazuh-cluster
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: wazuh-manager
      node-type: master
  template:
    metadata:
      labels:
        app: wazuh-manager
        node-type: master
    spec:
      securityContext:
        fsGroup: 101
        # Without this, every restart chowns the whole /var/ossec tree.
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # ossec.conf's <integration><api_key> takes a literal value only, so
        # the VirusTotal and Pushover credentials are substituted into a copy of the ConfigMap here
        # and the manager reads that copy from an emptyDir. Keeps the key out
        # of Git and out of the ConfigMap. Same image as the manager purely to
        # avoid another pull; it only needs sh and sed.
        - name: render-config
          image: wazuh/wazuh-manager:4.14.8
          command:
            - "/bin/sh"
            - "-c"
          args:
            - |
              set -eu
              # Fail loudly rather than start with a broken integration: a
              # wrong key only shows up later as rule 87102 "Check credentials".
              printf '%s' "$$VIRUSTOTAL_API_KEY" | grep -Eqx '[0-9a-f]{64}' \
                || { echo "VIRUSTOTAL_API_KEY is not a 64-char hex key" >&2; exit 1; }
              printf '%s' "$$PUSHOVER_TOKEN" | grep -Eqx '[A-Za-z0-9]{30}' \
                || { echo "PUSHOVER_TOKEN is not a 30-char Pushover token" >&2; exit 1; }
              printf '%s' "$$PUSHOVER_USER" | grep -Eqx '[A-Za-z0-9]{30}' \
                || { echo "PUSHOVER_USER is not a 30-char Pushover user key" >&2; exit 1; }
              sed -e "s/__VIRUSTOTAL_API_KEY__/$$VIRUSTOTAL_API_KEY/" \
                  -e "s/__PUSHOVER_TOKEN__/$$PUSHOVER_TOKEN/" \
                  -e "s/__PUSHOVER_USER__/$$PUSHOVER_USER/" \
                /template/ossec.conf > /rendered/ossec.conf
              # Not `! grep`: set -e ignores negated commands, so that would
              # never abort.
              if grep -q "__[A-Z_]*__" /rendered/ossec.conf; then
                echo "unrendered placeholder left in ossec.conf" >&2; exit 1
              fi
              echo "ossec.conf rendered"
          env:
            - name: VIRUSTOTAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wazuh-virustotal
                  key: api-key
            - name: PUSHOVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: wazuh-pushover
                  key: token
            - name: PUSHOVER_USER
              valueFrom:
                secretKeyRef:
                  name: wazuh-pushover
                  key: user
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /template
              readOnly: true
            - name: rendered-config
              mountPath: /rendered
      containers:
        - name: wazuh-manager
          image: wazuh/wazuh-manager:4.14.8
          securityContext:
            # Capabilities are not dropped wholesale here, unlike the indexer.
            # The manager's entrypoint runs as root and fixes ownership across
            # /var/ossec before each daemon chroots and drops to the `wazuh`
            # user, so it genuinely needs CHOWN/DAC_OVERRIDE/SETUID on top of
            # SYS_CHROOT. Upstream takes the same approach.
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - "SYS_CHROOT"
          ports:
            - name: events
              containerPort: 1514
            - name: registration
              containerPort: 1515
            - name: syslog
              containerPort: 514
              protocol: UDP
            - name: cluster
              containerPort: 1516
            - name: api
              containerPort: 55000
          env:
            - name: INDEXER_URL
              value: "https://indexer:9200"
            - name: INDEXER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: indexer-cred
                  key: username
            - name: INDEXER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: indexer-cred
                  key: password
            - name: FILEBEAT_SSL_VERIFICATION_MODE
              value: "full"
            - name: SSL_CERTIFICATE_AUTHORITIES
              value: /etc/ssl/filebeat/ca.crt
            - name: SSL_CERTIFICATE
              value: /etc/ssl/filebeat/tls.crt
            - name: SSL_KEY
              value: /etc/ssl/filebeat/tls.key
            - name: API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wazuh-api-cred
                  key: username
            - name: API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-api-cred
                  key: password
            - name: WAZUH_CLUSTER_KEY
              valueFrom:
                secretKeyRef:
                  name: wazuh-cluster-key
                  key: key
          startupProbe:
            tcpSocket:
              port: 1514
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 1514
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 768Mi
            limits:
              memory: 1536Mi
          volumeMounts:
            # Rendered by the render-config init container (integration keys).
            - name: rendered-config
              mountPath: /wazuh-config-mount/etc/ossec.conf
              subPath: ossec.conf
              readOnly: true
            - name: authd-pass
              mountPath: /wazuh-config-mount/etc/authd.pass
              subPath: authd.pass
              readOnly: true
            # subPath (a real file) rather than a directory mount: the
            # entrypoint copies with plain `cp -r`, which would carry over a
            # ConfigMap directory's ..data symlinks instead of the files.
            - name: ruleset
              mountPath: /wazuh-config-mount/etc/rules/local_rules.xml
              subPath: local_rules.xml
              readOnly: true
            - name: ruleset
              mountPath: /wazuh-config-mount/etc/decoders/local_decoder.xml
              subPath: local_decoder.xml
              readOnly: true
            - name: integrations
              mountPath: /wazuh-config-mount/integrations/custom-pushover
              subPath: custom-pushover
              readOnly: true
            - name: integrations
              mountPath: /wazuh-config-mount/integrations/custom-pushover.py
              subPath: custom-pushover.py
              readOnly: true
            - name: ruleset
              mountPath: /wazuh-config-mount/etc/shared/default/agent.conf
              subPath: agent.conf
              readOnly: true
            - name: filebeat-certs
              mountPath: /etc/ssl/filebeat
              readOnly: true
            - name: wazuh-manager-master
              mountPath: /var/ossec/api/configuration
              subPath: wazuh/var/ossec/api/configuration
            - name: wazuh-manager-master
              mountPath: /var/ossec/etc
              subPath: wazuh/var/ossec/etc
            - name: wazuh-manager-master
              mountPath: /var/ossec/logs
              subPath: wazuh/var/ossec/logs
            - name: wazuh-manager-master
              mountPath: /var/ossec/queue
              subPath: wazuh/var/ossec/queue
            - name: wazuh-manager-master
              mountPath: /var/ossec/var/multigroups
              subPath: wazuh/var/ossec/var/multigroups
            - name: wazuh-manager-master
              mountPath: /var/ossec/integrations
              subPath: wazuh/var/ossec/integrations
            - name: wazuh-manager-master
              mountPath: /var/ossec/active-response/bin
              subPath: wazuh/var/ossec/active-response/bin
            - name: wazuh-manager-master
              mountPath: /var/ossec/agentless
              subPath: wazuh/var/ossec/agentless
            - name: wazuh-manager-master
              mountPath: /var/ossec/wodles
              subPath: wazuh/var/ossec/wodles
            - name: wazuh-manager-master
              mountPath: /etc/filebeat
              subPath: filebeat/etc/filebeat
            - name: wazuh-manager-master
              mountPath: /var/lib/filebeat
              subPath: filebeat/var/lib/filebeat
      volumes:
        - name: config
          configMap:
            name: wazuh-manager-conf
        - name: integrations
          configMap:
            name: wazuh-manager-integrations
            defaultMode: 0755
        - name: rendered-config
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: ruleset
          configMap:
            name: wazuh-manager-ruleset
        - name: authd-pass
          secret:
            secretName: wazuh-authd-pass
        - name: filebeat-certs
          secret:
            secretName: wazuh-filebeat
            defaultMode: 0440
  volumeClaimTemplates:
    - metadata:
        name: wazuh-manager-master
      spec:
        accessModes:
          - "ReadWriteOnce"
        storageClassName: zfs-nfs
        resources:
          requests:
            storage: 10Gi
