---
# Wazuh API credentials. Consumed by the manager (which creates the user on
# first boot from these env vars) and by the dashboard's Wazuh app, which uses
# them for every call to the Wazuh API on :55000.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh-api-cred
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: wazuh-api-cred
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "wazuh-wui"
        password: "{{ .WAZUH_API_PASSWORD }}"
  dataFrom:
    - extract:
        key: wazuh
---
# Enrollment password for wazuh-authd (:1515). Every agent must present this
# when registering -- `agent-auth -m <ip> -P <this>`. Mounted as a file at
# /wazuh-config-mount/etc/authd.pass, hence the "authd.pass" key name.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh-authd-pass
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: wazuh-authd-pass
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        authd.pass: "{{ .WAZUH_AUTHD_PASS }}"
  dataFrom:
    - extract:
        key: wazuh
---
# Manager cluster key. Unused while the cluster is disabled (see
# configmap-manager.yaml) but the image's entrypoint still requires the env
# var, and keeping it means enabling a worker node later is a one-line change.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh-cluster-key
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: wazuh-cluster-key
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        key: "{{ .WAZUH_CLUSTER_KEY }}"
  dataFrom:
    - extract:
        key: wazuh
---
# Indexer superuser. Plaintext here; the matching bcrypt hash lives in
# externalsecret-securityconfig.yaml -- the bare wazuh-indexer does not hash
# passwords itself (unlike the OpenSearch operator in the logging namespace).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: indexer-cred
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: indexer-cred
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "admin"
        password: "{{ .WAZUH_INDEXER_PASSWORD }}"
  dataFrom:
    - extract:
        key: wazuh
---
# Dashboard service account against the indexer (the OpenSearch Dashboards
# "kibanaserver" user). Not a login account for humans -- those come in via
# Authentik OIDC.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dashboard-cred
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: dashboard-cred
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "kibanaserver"
        password: "{{ .WAZUH_DASHBOARD_PASSWORD }}"
  dataFrom:
    - extract:
        key: wazuh
