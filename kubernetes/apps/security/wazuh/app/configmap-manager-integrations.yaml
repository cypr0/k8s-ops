---
# Custom integrations for wazuh-integratord. NOT mounted directly: the
# render-config init container copies them into an emptyDir with mode 0755
# and the manager mounts those copies onto /var/ossec/integrations/.
# integratord refuses group-writable scripts, and fsGroup makes projected
# ConfigMap files group-writable regardless of defaultMode -- the first
# deploy failed exactly like that (2026-09-27).
#
# integratord executes integrations/<name> directly; the image's own ones are a
# shell wrapper plus <name>.py, and this follows the same shape.
# No secrets in here: token and user key arrive as the api_key argument.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-manager-integrations
data:
  custom-pushover: |
    #!/bin/sh
    exec /var/ossec/framework/python/bin/python3 /var/ossec/integrations/custom-pushover.py "$@"
  custom-pushover.py: |-
    #!/var/ossec/framework/python/bin/python3
    """Send a Wazuh alert to Pushover, throttled.

    Called by wazuh-integratord as: custom-pushover <alert_file> <api_key> <hook_url>
    api_key is "<app token>:<user key>", rendered from 1Password.

    The Pushover app token is shared with Alertmanager, Gatus and Falco, and the
    plan allows 10,000 messages a month. So the notifier protects that budget even
    when a rule misbehaves (one did, 9,000 messages in 11 days; see
    docs/incidents/2026-10-11-wazuh-pushover-quota-exhaustion.md):

      * the same message goes out at most once per COOLDOWN, and the next one that
        does says how many identical ones were swallowed in between;
      * at most DAILY_CAP messages per UTC day and tier; the first alert over the
        cap sends a single notice instead, the rest are dropped until midnight.

    Suppressed alerts are still in alerts.json and the dashboard. If the state
    file cannot be opened the alert is sent unthrottled: losing the throttle is
    better than losing the alert.
    """
    import fcntl
    import hashlib
    import json
    import os
    import sys
    import time

    # The embedded Python has no system CA bundle; requests brings certifi.
    import requests

    DASHBOARD = "https://wazuh.${SECRET_DOMAIN}"
    FIELDS = ("srcip", "dstip", "dns_client", "dns_query", "url", "dstuser", "service")

    # On the PVC, so a pod restart does not hand every alert a fresh cooldown.
    STATE = "/var/ossec/logs/pushover-throttle.json"
    LOG = "/var/ossec/logs/integrations.log"
    # Tier "hi" is level 12+ (priority 1, bypasses quiet hours), "lo" is 10-11.
    COOLDOWN = {"lo": 6 * 3600, "hi": 3600}
    DAILY_CAP = {"lo": 40, "hi": 100}
    KEEP = 24 * 3600

    class Throttle:
        """Cooldown and daily cap, in a small JSON file under an exclusive lock."""

        def __init__(self, path):
            self.path = path
            self.fh = None
            self.st = {}
            self.now = time.time()

        def __enter__(self):
            try:
                self.fh = os.fdopen(os.open(self.path, os.O_RDWR | os.O_CREAT, 0o660), "r+")
                fcntl.flock(self.fh, fcntl.LOCK_EX)
                self.st = json.load(self.fh)
            except ValueError:
                self.st = {}  # new or corrupt file: start over
            except OSError as exc:
                self.fh = None  # fail open
                print("custom-pushover: throttle disabled: %s" % exc, file=sys.stderr)
            day = time.strftime("%Y-%m-%d", time.gmtime(self.now))
            if self.st.get("day") != day:
                self.st["day"] = day
                self.st["sent"] = {"lo": 0, "hi": 0}
                self.st["capped"] = {"lo": False, "hi": False}
            self.st["seen"] = {k: v for k, v in self.st.get("seen", {}).items() if self.now - v["ts"] < KEEP}
            return self

        def __exit__(self, *exc):
            if self.fh is not None:
                try:
                    self.fh.seek(0)
                    self.fh.truncate()
                    json.dump(self.st, self.fh)
                    self.fh.flush()
                finally:
                    self.fh.close()  # releases the lock
            return False

        def verdict(self, key, tier):
            """Return send, drop, or cap (send the one-off cap notice instead)."""
            if self.fh is None:
                return "send"
            entry = self.st["seen"].get(key)
            if entry and self.now - entry["ts"] < COOLDOWN[tier]:
                entry["n"] += 1
                return "drop"
            if self.st["sent"][tier] >= DAILY_CAP[tier]:
                if entry:
                    entry["n"] += 1
                return "drop" if self.st["capped"][tier] else "cap"
            return "send"

        def swallowed(self, key):
            if self.fh is None:
                return 0
            return self.st["seen"].get(key, {}).get("n", 0)

        def sent(self, key, tier):
            if self.fh is not None:
                self.st["seen"][key] = {"ts": self.now, "n": 0}
                self.st["sent"][tier] += 1

        def capped(self, tier):
            if self.fh is not None:
                self.st["capped"][tier] = True

    def log(text):
        try:
            with open(LOG, "a") as fh:
                fh.write("%s custom-pushover: %s\n" % (time.strftime("%Y-%m-%d %H:%M:%S"), text))
        except OSError:
            pass

    def push(hook_url, token, user, title, message, priority):
        resp = requests.post(hook_url, timeout=10, data={
            "token": token,
            "user": user,
            "title": title,
            "message": message[:1000],
            # 1 = high: bypasses quiet hours. Reserved for 12+ (C2 contact,
            # malware hashes, VirusTotal detections, logins from attacker IPs).
            "priority": priority,
            "url": DASHBOARD,
            "url_title": "Wazuh dashboard",
        })
        resp.raise_for_status()

    def main():
        alert_file, api_key, hook_url = sys.argv[1:4]
        token, _, user = api_key.partition(":")
        with open(alert_file) as fh:
            alert = json.load(fh)

        rule = alert.get("rule", {})
        level = int(rule.get("level", 0))
        agent = alert.get("agent", {}).get("name", "?")
        data = alert.get("data", {})

        lines = [rule.get("description", "(no description)")]
        for key in FIELDS:
            if data.get(key):
                lines.append(f"{key}: {data[key]}")
        path = alert.get("syscheck", {}).get("path")
        if path:
            lines.append(f"file: {path}")
        # Falco (via Falcosidekick syslog): the "agent" is the manager, so
        # name the node instead and show where in the cluster it happened.
        falco = data.get("output_fields")
        if falco:
            agent = f"falco@{data.get('hostname', '?')}"
            lines.append(f"pod: {falco.get('k8s.ns.name', '?')}/{falco.get('k8s.pod.name', '?')}")
            for key in ("container.image.repository", "proc.cmdline", "fd.name"):
                if falco.get(key):
                    lines.append(f"{key.split('.')[-1]}: {falco[key]}")
        # Kubernetes API audit (via Fluent Bit syslog): name the control-plane
        # node that logged it and who did what from where.
        if data.get("kind") == "Event" and str(data.get("apiVersion", "")).startswith("audit.k8s.io"):
            agent = f"k8s@{alert.get('predecoder', {}).get('hostname', '?')}"
            ref = data.get("objectRef", {})
            lines.append(f"user: {data.get('user', {}).get('username', '?')}")
            lines.append(f"{data.get('verb', '?')} {ref.get('resource', '?')} {ref.get('namespace', '')}/{ref.get('name', '')}")
            lines.append(f"from: {', '.join(data.get('sourceIPs', []))} ({str(data.get('userAgent', ''))[:60]})")
        vt = data.get("virustotal", {})
        if vt.get("positives"):
            lines.append(f"VirusTotal: {vt['positives']}/{vt.get('total')} engines")

        title = f"Wazuh L{level} | {agent}"
        high = level >= 12
        tier = "hi" if high else "lo"
        # Same text means same alert; the rule/timestamp line below is the one
        # part that always differs, so it is not part of the key.
        fingerprint = hashlib.sha1("\n".join([title] + lines).encode()).hexdigest()
        lines.append(f"rule {rule.get('id')} | {alert.get('timestamp', '')}")

        with Throttle(STATE) as throttle:
            verdict = throttle.verdict(fingerprint, tier)
            if verdict == "drop":
                return
            if verdict == "cap":
                what = "high-priority (L12+)" if high else "L10-11"
                log(f"daily cap of {DAILY_CAP[tier]} {what} messages reached, dropping the rest until 00:00 UTC")
                push(hook_url, token, user, "Wazuh: daily Pushover cap reached",
                     f"{DAILY_CAP[tier]} {what} alerts already sent today (UTC). Further ones are"
                     " suppressed until midnight UTC; they are all still in the Wazuh dashboard."
                     f"\nlast: {lines[0]}", 0)
                throttle.capped(tier)
                return
            swallowed = throttle.swallowed(fingerprint)
            if swallowed:
                lines.insert(-1, f"(+{swallowed} identical alerts suppressed since the last one)")
            push(hook_url, token, user, title, "\n".join(lines), 1 if high else 0)
            throttle.sent(fingerprint, tier)

    if __name__ == "__main__":
        main()
