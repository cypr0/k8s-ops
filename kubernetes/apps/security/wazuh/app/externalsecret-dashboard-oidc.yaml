---
# OIDC client credentials + session cookie secret for the Wazuh dashboard.
# Referenced from opensearch_dashboards.yml as ${VAR} placeholders that the
# dashboard resolves from its own environment -- which is why those entries are
# written as $${VAR} in configmap-dashboard.yaml (one $ is eaten by Flux's
# postBuild substitution).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh-dashboard-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: wazuh-dashboard-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENSEARCH_SECURITY_OPENID_CLIENT_ID: "{{ .WAZUH_OIDC_CLIENT_ID }}"
        OPENSEARCH_SECURITY_OPENID_CLIENT_SECRET: "{{ .WAZUH_OIDC_CLIENT_SECRET }}"
        OPENSEARCH_SECURITY_COOKIE_PASSWORD: "{{ .WAZUH_COOKIE_SECRET }}"
  dataFrom:
    - extract:
        key: wazuh
