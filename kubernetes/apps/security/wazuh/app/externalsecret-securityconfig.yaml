---
# OpenSearch security plugin configuration for the Wazuh indexer.
#
# Three files, all rendered from the 1Password item "wazuh":
#   internal_users.yml - local accounts; needs BCRYPT HASHES, not plaintext.
#                        The bare wazuh-indexer has no operator to hash for it
#                        (contrast kubernetes/apps/logging/opensearch-cluster/
#                        app/externalsecrets.yaml, where the OpenSearch operator
#                        does). Generate once with:
#                          htpasswd -bnBC 12 "" '<password>' | tr -d ':\n'
#                        and store alongside the plaintext in 1Password.
#   config.yml         - which authentication backends exist (local + Authentik).
#   roles_mapping.yml  - which backend role maps to which indexer role.
#
# These are read on FIRST indexer boot via plugins.security.
# allow_default_init_securityindex. Later edits need securityadmin.sh, which is
# what ../config/job-securityconfig.yaml exists for.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh-securityconfig
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: wazuh-securityconfig
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        internal_users.yml: |
          ---
          _meta:
            type: "internalusers"
            config_version: 2

          admin:
            hash: "{{ .WAZUH_INDEXER_HASH }}"
            reserved: true
            backend_roles:
              - "admin"
            description: "Wazuh indexer superuser"

          kibanaserver:
            hash: "{{ .WAZUH_DASHBOARD_HASH }}"
            reserved: true
            description: "Wazuh dashboard service account"

        config.yml: |
          ---
          _meta:
            type: "config"
            config_version: 2
          config:
            dynamic:
              authc:
                # Local accounts (admin, kibanaserver). challenge:false so the
                # browser is never shown a basic-auth popup -- humans go
                # through the OIDC domain below; this domain exists for the
                # dashboard service account and for securityadmin/API access.
                basic_internal_auth_domain:
                  description: "Internal users"
                  http_enabled: true
                  transport_enabled: true
                  order: 0
                  http_authenticator:
                    type: basic
                    challenge: false
                  authentication_backend:
                    type: intern

                # Authentik OIDC, mirroring the working setup of the logging
                # cluster (kubernetes/apps/logging/opensearch-cluster/app/
                # externalsecret-securityconfig.yaml).
                openid_auth_domain:
                  description: "Authentik OIDC"
                  http_enabled: true
                  transport_enabled: false
                  order: 1
                  http_authenticator:
                    type: openid
                    challenge: false
                    config:
                      subject_key: preferred_username
                      roles_key: groups
                      openid_connect_url: "https://id.${SECRET_DOMAIN}/application/o/wazuh/.well-known/openid-configuration"
                  authentication_backend:
                    type: noop

        roles_mapping.yml: |
          ---
          _meta:
            type: "rolesmapping"
            config_version: 2

          # "admin" MUST stay in this list. It is the backend_role of the
          # internal admin user; dropping it in favour of only OIDC groups
          # locks that account out of the REST API entirely -- exactly what
          # happened on the logging cluster once before.
          all_access:
            reserved: false
            backend_roles:
              - "admin"
              - "Wazuh Admins"
              - "authentik Admins"

          readall_and_monitor:
            reserved: false
            backend_roles:
              - "Wazuh Users"

          kibana_user:
            reserved: false
            backend_roles:
              - "Wazuh Admins"
              - "Wazuh Users"
              - "authentik Admins"

          kibana_server:
            reserved: true
            users:
              - "kibanaserver"

          # The Wazuh app creates and rotates wazuh-monitoring-* and
          # wazuh-statistics-* itself, using the dashboard's own OpenSearch
          # credentials rather than the logged-in user's. Without this the
          # dashboard still starts, but logs "no permissions for create, delete
          # or check" and those indices are never created.
          # manage_wazuh_index is a reserved role that ships with the
          # wazuh-indexer image (read/index/manage/delete on wazuh-*).
          manage_wazuh_index:
            reserved: false
            users:
              - "kibanaserver"
  dataFrom:
    - extract:
        key: wazuh
