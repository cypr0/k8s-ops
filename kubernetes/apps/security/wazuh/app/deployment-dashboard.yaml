---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-dashboard
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wazuh-dashboard
  template:
    metadata:
      labels:
        app: wazuh-dashboard
    spec:
      # Required, not decorative: the cert volume below is mounted 0440 and
      # lands owned by root, so without fsGroup the uid-1000 dashboard process
      # cannot read ca.crt and exits with EACCES before it ever starts.
      securityContext:
        fsGroup: 1000
      containers:
        - name: wazuh-dashboard
          image: wazuh/wazuh-dashboard:4.14.7
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - "ALL"
          ports:
            - name: http
              containerPort: 5601
          env:
            - name: INDEXER_URL
              value: "https://indexer:9200"
            - name: INDEXER_USERNAME
              valueFrom:
                secretKeyRef:
                  name: indexer-cred
                  key: username
            - name: INDEXER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: indexer-cred
                  key: password
            - name: DASHBOARD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dashboard-cred
                  key: username
            - name: DASHBOARD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dashboard-cred
                  key: password
            # TLS is terminated by Envoy; see configmap-dashboard.yaml.
            - name: SERVER_SSL_ENABLED
              value: "false"
            # The image defaults this to true, which makes the Wazuh app call
            # the API *as the logged-in dashboard user* and map them onto a
            # Wazuh RBAC role through an authorization-context rule. With no
            # such rule the user ends up with no Wazuh permissions at all —
            # they can log in and see the UI, but nothing is administrable,
            # even holding all_access on the indexer.
            #
            # false makes every logged-in user act as wazuh-wui, which holds
            # the built-in `administrator` role. Acceptable here because
            # OpenSearch-side OIDC already decides who may log in at all and
            # this cluster has a single admin. If Wazuh ever needs per-user
            # roles, set this back to true and add authorization-context rules
            # under Security > Roles mapping instead.
            - name: RUN_AS
              value: "false"
            - name: WAZUH_API_URL
              value: "https://wazuh-manager-master-0.wazuh-cluster"
            - name: API_USERNAME
              valueFrom:
                secretKeyRef:
                  name: wazuh-api-cred
                  key: username
            - name: API_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: wazuh-api-cred
                  key: password
          # Resolves the $${...} placeholders in opensearch_dashboards.yml.
          envFrom:
            - secretRef:
                name: wazuh-dashboard-oidc
          startupProbe:
            tcpSocket:
              port: 5601
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: 5601
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
              subPath: opensearch_dashboards.yml
              readOnly: true
            - name: certs
              mountPath: /usr/share/wazuh-dashboard/certs
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: wazuh-dashboard-conf
        # Only ca.crt out of this secret is read (see
        # opensearch.ssl.certificateAuthorities in configmap-dashboard.yaml).
        - name: certs
          secret:
            secretName: wazuh-dashboard
            defaultMode: 0440
