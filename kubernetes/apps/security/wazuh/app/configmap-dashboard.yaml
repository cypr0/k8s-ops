---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wazuh-dashboard-conf
data:
  opensearch_dashboards.yml: |-
    server.host: 0.0.0.0
    server.port: 5601

    # No TLS on the pod: Envoy terminates with the Let's Encrypt wildcard and
    # expects a plain-HTTP backend (same reasoning as the comment in
    # kubernetes/apps/mail/mailu/app/service-front-webmail-lan.yaml). Clients
    # therefore never see a self-signed certificate.
    server.ssl.enabled: false

    opensearch.hosts: https://indexer:9200
    # "full", not upstream's "none": the indexer certificate comes from a real
    # CA we control and carries `indexer` as a SAN, so there is no reason to
    # skip verification.
    opensearch.ssl.verificationMode: full
    opensearch.ssl.certificateAuthorities: ["/usr/share/wazuh-dashboard/certs/ca.crt"]
    opensearch.requestHeadersWhitelist: ["authorization", "securitytenant"]

    opensearch_security.multitenancy.enabled: false
    opensearch_security.readonly_mode.roles: ["kibana_read_only"]

    # Authentik OIDC. Doubled $ so Flux's postBuild leaves the placeholders for
    # the dashboard process to resolve from its environment -- the same
    # escaping the logging cluster needs
    # (kubernetes/apps/logging/opensearch-cluster/app/cluster.yaml).
    opensearch_security.auth.type: "openid"
    opensearch_security.openid.connect_url: "https://id.${SECRET_DOMAIN}/application/o/wazuh/.well-known/openid-configuration"
    opensearch_security.openid.base_redirect_url: "https://wazuh.${SECRET_DOMAIN}"
    opensearch_security.openid.logout_url: "https://id.${SECRET_DOMAIN}/application/o/wazuh/end-session/"
    opensearch_security.openid.scope: "openid profile email"
    opensearch_security.openid.client_id: "$${OPENSEARCH_SECURITY_OPENID_CLIENT_ID}"
    opensearch_security.openid.client_secret: "$${OPENSEARCH_SECURITY_OPENID_CLIENT_SECRET}"
    opensearch_security.cookie.password: "$${OPENSEARCH_SECURITY_COOKIE_PASSWORD}"
    opensearch_security.cookie.secure: true
    opensearch_security.cookie.ttl: 900000
    opensearch_security.session.ttl: 900000
    opensearch_security.session.keepalive: true

    uiSettings.overrides.defaultRoute: /app/wz-home
