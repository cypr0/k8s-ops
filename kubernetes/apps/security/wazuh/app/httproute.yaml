---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wazuh-dashboard
spec:
  hostnames:
    - "wazuh.${SECRET_DOMAIN}"
  parentRefs:
    # Internal only, reached over Split-DNS on the LAN or over the VPN. A SIEM
    # console has no business on the public gateway.
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: dashboard
          namespace: wazuh
          port: 5601
