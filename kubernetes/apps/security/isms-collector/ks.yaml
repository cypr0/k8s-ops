---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app isms-collector
  namespace: &namespace security
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  decryption:
    provider: sops
  interval: 1h
  path: ./kubernetes/apps/security/isms-collector/app
  # No postBuild on purpose: nothing here needs ${SECRET_*} substitution, and
  # Flux runs envsubst in strict mode across the whole manifest set. It
  # therefore mistook the ${GIT_TOKEN} in the CronJob's shell script for a
  # Flux variable and aborted the reconciliation. If substitution is ever
  # needed here, shell variables must be written as $${VAR} -- the same way
  # proxmox-ansible and gatus do it.
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: true
