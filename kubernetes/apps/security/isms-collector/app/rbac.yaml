---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: isms-collector
automountServiceAccountToken: true
---
# Read-only, and deliberately enumerated rather than wildcarded: the
# `restrict-rbac-least-privilege` ClusterPolicy rejects `*` in resources or
# verbs, and a compliance collector that needs an exemption from the cluster's
# own RBAC policy would be a poor start.
#
# `secrets` is absent on purpose. Nothing here needs them, and reading them
# would trip the policy's `no-sensitive-resource-access` rule. ConfigMaps are
# restricted by name to the two the harvester actually parses.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: isms-collector
rules:
  # Node inventory: Falco coverage is measured against the node list and the
  # taints, not against the DaemonSet's own ready count.
  - apiGroups:
      - ""
    resources:
      - "nodes"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "apps"
    resources:
      - "daemonsets"
      - "deployments"
      - "statefulsets"
    verbs:
      - "get"
      - "list"
  # Pod specs, not pod contents: the evidence for KONF.9.1 and KONF.15.1/15.2
  # (limiting memory and compute) needs the resources.limits actually set per
  # container. Deployments alone are not enough, because CronJobs, Jobs and
  # operator-created pods do not appear in them. Only get and list -- `create`
  # on pods would violate the cluster's own ClusterPolicy
  # restrict-rbac-least-privilege.
  - apiGroups:
      - ""
    resources:
      - "pods"
      - "resourcequotas"
      - "limitranges"
    verbs:
      - "get"
      - "list"
  # Service types, for KONF.2.4 (disable unneeded system functions). A
  # NodePort opens a port on every node and bypasses the gateway, so the
  # check asserts that none exists. Only the spec is read; Services carry no
  # payload data.
  - apiGroups:
      - ""
    resources:
      - "services"
    verbs:
      - "get"
      - "list"
  # Kyverno verdicts. There are no ClusterPolicyReports in this cluster --
  # every policy matches namespaced resources -- but both are listed so a
  # future cluster-scoped policy is picked up without an RBAC change.
  - apiGroups:
      - "wgpolicyk8s.io"
    resources:
      - "policyreports"
      - "clusterpolicyreports"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "aquasecurity.github.io"
    resources:
      - vulnerabilityreports
      - configauditreports
      - clustercompliancereports
      - rbacassessmentreports
      - exposedsecretreports
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "velero.io"
    resources:
      - "schedules"
      - "backups"
      - "backupstoragelocations"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "postgresql.cnpg.io"
    resources:
      - "clusters"
      - "databases"
      - "scheduledbackups"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "kustomize.toolkit.fluxcd.io"
    resources:
      - "kustomizations"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "helm.toolkit.fluxcd.io"
    resources:
      - "helmreleases"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "cilium.io"
    resources:
      - "ciliumnetworkpolicies"
      # Cluster-scoped counterpart. There is none in this cluster today, but
      # KONF.7.15 asks how much of the workload is covered by policy, and a
      # cluster-wide policy covering everything would otherwise be invisible
      # and the answer would read worse than reality.
      - "ciliumclusterwidenetworkpolicies"
    verbs:
      - "get"
      - "list"
  # Envoy Gateway traffic policies. These back KONF.15.3 (denial of service),
  # KONF.2.2 (TLS floor) and KONF.12.1.10 (response headers).
  #
  # Added 2026-10-27 after the fact: the gateway-dos source was written and
  # tested with an admin kubeconfig, so the missing permission did not show
  # up until `kubectl auth can-i --as=` was run against the collector's own
  # ServiceAccount. Without this the source fails and the dependent check
  # reports error -- which the staleness logic would have surfaced, but only
  # after the next collector run.
  - apiGroups:
      - "gateway.envoyproxy.io"
    resources:
      - "clienttrafficpolicies"
      - "backendtrafficpolicies"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "cert-manager.io"
    resources:
      - "certificates"
    verbs:
      - "get"
      - "list"
  - apiGroups:
      - "gateway.networking.k8s.io"
    resources:
      - "httproutes"
      - "gateways"
    verbs:
      - "get"
      - "list"
  # Only the two ConfigMaps the harvester parses: Loki's retention and the
  # Authentik blueprints that declare the MFA stage. `list` cannot be scoped
  # by name, so the harvester fetches them individually by name.
  - apiGroups:
      - ""
    resources:
      - "configmaps"
    resourceNames:
      - "loki"
      - "authentik-blueprints"
    verbs:
      - "get"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: isms-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: isms-collector
subjects:
  - kind: ServiceAccount
    name: isms-collector
    namespace: security
