---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: trivy-operator
      version: "0.32.1"
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: trivy-system
  maxHistory: 2
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
      strategy: rollback
  values:
    operator:
      scanJobTimeout: 5m
      concurrentScanJobsLimit: 3
      builtInTrivyServer: true
      # Scan all namespaces except the system ones. The former
      # "*-restore-test" glob guarded against Velero's ephemeral restore
      # namespaces, which once OOM-killed trivy-operator by spawning a scan job
      # per pod at once; that CronJob has been removed, so the glob has nothing
      # left to match.
      excludeNamespaces: "kube-system,flux-system"
      metricsFindingsEnabled: true
      metricsVulnIdEnabled: true
      # Talos: immutable filesystem — node-collector can't access /etc/systemd.
      # (Kubescape used to cover CIS node benchmarks; it has since been removed
      # from the cluster, so this remains disabled with no replacement.)
      infraAssessmentScannerEnabled: false

    trivy:
      ignoreUnfixed: true
      severity: "MEDIUM,HIGH,CRITICAL"
      slow: true
      server:
        podSecurityContext:
          # Merges with the chart defaults (runAsUser/fsGroup 65534). Without
          # this, every restart chowns the whole vulnerability DB cache.
          fsGroupChangePolicy: OnRootMismatch

    # Node collector needs to run on all nodes
    nodeCollector:
      tolerations:
        - operator: Exists
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - "ALL"
        readOnlyRootFilesystem: true

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
      readOnlyRootFilesystem: true

    # 512Mi OOM-killed the operator when ~15 pods appeared at once (Velero
    # restore-test namespaces) and it queued a scan job per pod. Now excluded
    # above too, but keep headroom for any other legitimate burst.
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 1Gi

    serviceMonitor:
      enabled: true
