---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trivy-operator
spec:
  interval: 1h
  chart:
    spec:
      chart: trivy-operator
      version: "0.32.1"
      sourceRef:
        kind: HelmRepository
        name: aqua
        namespace: trivy-system
  maxHistory: 2
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
      strategy: rollback
  values:
    operator:
      scanJobTimeout: 5m
      concurrentScanJobsLimit: 3
      builtInTrivyServer: true
      # Scan all namespaces except system ones and Velero's ephemeral
      # restore-test namespaces — those appear/disappear within minutes and
      # once OOM-killed trivy-operator by spawning a scan job per pod all at
      # once (glob pattern, not exact names, so it matches regardless of
      # which app namespaces the restore-test targets).
      excludeNamespaces: "kube-system,flux-system,*-restore-test"
      metricsFindingsEnabled: true
      metricsVulnIdEnabled: true
      # Talos: immutable filesystem — node-collector can't access /etc/systemd
      # CIS node benchmarks are handled by Kubescape instead
      infraAssessmentScannerEnabled: false

    trivy:
      ignoreUnfixed: true
      severity: "MEDIUM,HIGH,CRITICAL"
      slow: true

    # Node collector needs to run on all nodes
    nodeCollector:
      tolerations:
        - operator: Exists
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - "ALL"
        readOnlyRootFilesystem: true

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
      readOnlyRootFilesystem: true

    # 512Mi OOM-killed the operator when ~15 pods appeared at once (Velero
    # restore-test namespaces) and it queued a scan job per pod. Now excluded
    # above too, but keep headroom for any other legitimate burst.
    resources:
      requests:
        cpu: 20m
        memory: 128Mi
      limits:
        memory: 1Gi

    serviceMonitor:
      enabled: true
