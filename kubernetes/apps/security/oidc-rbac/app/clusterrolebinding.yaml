---
# Binds the Authentik "k8s-admins" group (via OIDC) to cluster-admin.
# Group name has the "oidc:" prefix configured on the apiserver's
# --oidc-groups-prefix to avoid collisions with any built-in group names.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-k8s-admins
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: "oidc:k8s-admins"
