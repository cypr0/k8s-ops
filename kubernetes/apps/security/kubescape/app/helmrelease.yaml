---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubescape
spec:
  interval: 1h
  chart:
    spec:
      chart: kubescape-operator
      version: "1.40.2"
      sourceRef:
        kind: HelmRepository
        name: kubescape
        namespace: kubescape
  maxHistory: 2
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
      strategy: rollback
  values:
    # Run in offline mode — no Kubescape cloud account needed
    capabilities:
      configurationScan: enable
      continuousScan: enable
      vulnerabilityScan: disable # handled by Trivy Operator
      nodeScan: enable
      networkPolicyService: disable
      runtimeObservability: disable
      secureApplicationProfile: disable

    # Scan frameworks
    configuration:
      frameworks:
        - cis-v1.23-t1.0

    clusterName: k8s-ops

    # Scan schedule: daily at 2am
    triggerNewImageScan: false
    scanSchedule: "0 2 * * *"

    # Node scanning tolerations
    nodeAgent:
      tolerations: []
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      # Confirmed live (2026-08-16): node-agent on k8s-wrk-0 was
      # CrashLoopBackOff for 12+ hours (119 restarts), /readyz and /livez
      # timing out ("context deadline exceeded") under CPU throttling --
      # Alertmanager actively firing KubePodCrashLooping + CPUThrottlingHigh
      # for this namespace. 10m was far too low a request for a process
      # that does continuous eBPF-based node scanning; raised well above
      # what a single node's worth of scanning needs, with a real CPU
      # limit added so it can't starve other workloads on the same node
      # either.
      resources:
        requests:
          cpu: 150m
          memory: 128Mi
        limits:
          cpu: 750m
          memory: 512Mi

    operator:
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 256Mi
      podSecurityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - "ALL"

    kubescape:
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi

    # Prometheus metrics
    prometheusAnnotations: true

    serviceMonitor:
      enabled: true
