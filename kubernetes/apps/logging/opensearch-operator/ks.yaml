---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: opensearch-operator
  namespace: logging
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: opensearch-operator
  interval: 1h
  path: ./kubernetes/apps/logging/opensearch-operator/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: logging
  timeout: 10m
  wait: true
