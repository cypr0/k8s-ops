---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fluent-bit
  namespace: logging
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: fluent-bit
  # No dependsOn: the only sink is Loki in `monitoring`, and Fluent Bit buffers
  # and retries if Loki is not up yet. Waiting on it here would only couple two
  # namespaces for no gain. The former dependency on opensearch-cluster is gone
  # with the OpenSearch outputs, and the ExternalSecret that once needed
  # external-secrets-stores no longer exists either.
  interval: 1h
  path: ./kubernetes/apps/logging/fluent-bit/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: logging
  timeout: 10m
  wait: true
