---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
spec:
  interval: 1h
  chart:
    spec:
      chart: fluent-bit
      version: "0.57.6"
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: logging
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    # Workers only
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    tolerations: []

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 128Mi

    podSecurityContext:
      runAsNonRoot: false  # needs root for syslog socket

    # Inject OpenSearch password
    envFrom:
      - secretRef:
          name: fluent-bit-opensearch

    serviceMonitor:
      enabled: true

    config:
      service: |
        [SERVICE]
            Flush         5
            Daemon        Off
            Log_Level     info
            Parsers_File  parsers.conf
            Parsers_File  custom_parsers.conf
            HTTP_Server   On
            HTTP_Listen   0.0.0.0
            HTTP_Port     2020

      customParsers: |
        # RFC5424 with optional fractional seconds (Proxmox rsyslog, OPNsense)
        # Matches: <PRI>1 TIMESTAMP HOST APP PID MSGID SD MSG
        # rsyslog sends: <38>1 2026-06-21T16:06:29.738928+02:00 proxmox sshd 12345 - - message
        [PARSER]
            Name        syslog-rfc5424-nofrac
            Format      regex
            Regex       ^\<(?<pri>[0-9]{1,5})\>1 (?<time>[^ ]+) (?<host>[^ ]+) (?<ident>[^ ]+) (?<pid>[-0-9]+) (?<msgid>[^ ]+) (?<extradata>(\[(.*?)\]|-)) (?<message>.+)$
            Time_Key    time
            Time_Format %Y-%m-%dT%H:%M:%S.%L%z
            Time_Keep   Off
        
        # Fallback parser without fractional seconds
        [PARSER]
            Name        syslog-rfc5424-simple
            Format      regex
            Regex       ^\<(?<pri>[0-9]{1,5})\>1 (?<time>[^ ]+) (?<host>[^ ]+) (?<ident>[^ ]+) (?<pid>[-0-9]+) (?<msgid>[^ ]+) (?<extradata>(\[(.*?)\]|-)) (?<message>.+)$
            Time_Key    time
            Time_Format %Y-%m-%dT%H:%M:%S%z
            Time_Keep   Off

      inputs: |
        # ── Syslog from Proxmox + OPNsense ──────────────────────────────
        [INPUT]
            Name          syslog
            Listen        0.0.0.0
            Port          5514
            Mode          udp
            Tag           syslog.udp
            Parser        syslog-rfc5424-nofrac

        [INPUT]
            Name          syslog
            Listen        0.0.0.0
            Port          5514
            Mode          tcp
            Tag           syslog.tcp
            Parser        syslog-rfc5424-nofrac

      filters: |
        # Retag Suricata Eve-JSON records before any other processing
        [FILTER]
            Name              rewrite_tag
            Match             syslog.*
            Rule              $ident ^suricata$ suricata.$TAG false

        # Parse Eve-JSON message field into structured fields
        [FILTER]
            Name              parser
            Match             suricata.*
            Key_Name          message
            Parser            json
            Reserve_Data      On
            Preserve_Key      Off

        # Default source fallback (overwritten by specific rules below)
        [FILTER]
            Name          modify
            Match         syslog.*
            Add           source syslog

        # Label Proxmox by hostname
        [FILTER]
            Name          modify
            Match         syslog.*
            Condition     Key_value_matches host ^pve|^proxmox
            Set           source proxmox

        # Label OPNsense by hostname (secsrv = security server = OPNsense)
        [FILTER]
            Name          modify
            Match         syslog.*
            Condition     Key_value_matches host ^OPNsense|^opnsense|^fw|^secsrv
            Set           source opnsense

        # Add job label for Loki
        [FILTER]
            Name          modify
            Match         syslog.*
            Add           job syslog

        # Add job label for Loki (Suricata)
        [FILTER]
            Name          modify
            Match         suricata.*
            Add           job suricata

      outputs: |
        # ── OpenSearch (SIEM) ────────────────────────────────────────────
        [OUTPUT]
            Name             opensearch
            Match            syslog.*
            Host             opensearch.logging.svc.cluster.local
            Port             9200
            HTTP_User        admin
            HTTP_Passwd      ${OPENSEARCH_PASSWORD}
            Type             _doc
            Logstash_Format  On
            Logstash_Prefix  syslog
            Logstash_Prefix_Key  $source
            Time_Key         @timestamp
            tls              On
            tls.verify       Off
            net.keepalive    off
            Retry_Limit      5
            Suppress_Type_Name On

        # ── OpenSearch (Suricata Eve-JSON) ──────────────────────────────
        [OUTPUT]
            Name             opensearch
            Match            suricata.*
            Host             opensearch.logging.svc.cluster.local
            Port             9200
            HTTP_User        admin
            HTTP_Passwd      ${OPENSEARCH_PASSWORD}
            Type             _doc
            Logstash_Format  On
            Logstash_Prefix  suricata
            Time_Key         @timestamp
            tls              On
            tls.verify       Off
            net.keepalive    off
            Retry_Limit      5
            Suppress_Type_Name On

        # ── Loki (Grafana dashboards) ────────────────────────────────────
        [OUTPUT]
            Name             loki
            Match            syslog.*
            Host             loki.monitoring.svc.cluster.local
            Port             3100
            Labels           job=syslog
            Label_Keys       $source,$host
            Line_Format      json
            Retry_Limit      5

        # ── Loki (Suricata) ──────────────────────────────────────────────
        [OUTPUT]
            Name             loki
            Match            suricata.*
            Host             loki.monitoring.svc.cluster.local
            Port             3100
            Labels           job=suricata
            Label_Keys       $event_type,$host
            Line_Format      json
            Retry_Limit      5

    # Expose syslog port on pods. The chart also adds these entries to the
    # Service, which requires a valid `port` (1-65535); without it the Service
    # port defaults to 0 and the Helm upgrade fails ("port: Invalid value: 0").
    extraPorts:
      - name: syslog-udp
        port: 5514
        containerPort: 5514
        protocol: UDP
        targetPort: 5514
      - name: syslog-tcp
        port: 5514
        containerPort: 5514
        protocol: TCP
        targetPort: 5514
