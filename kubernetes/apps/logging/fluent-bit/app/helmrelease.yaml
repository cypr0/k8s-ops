---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
spec:
  interval: 1h
  chart:
    spec:
      chart: fluent-bit
      version: "0.57.6"
      sourceRef:
        kind: HelmRepository
        name: fluent
        namespace: logging
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    # Run on ALL nodes (incl. control-plane): app pods like Nextcloud are
    # scheduled on CP nodes too (allowSchedulingOnControlPlanes), so the
    # container-log tail must cover them. Toleration lets it schedule on any
    # CP taint if present.
    affinity: {}
    tolerations:
      - operator: Exists

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi

    podSecurityContext:
      runAsNonRoot: false # needs root for syslog socket

    # Inject OpenSearch password
    envFrom:
      - secretRef:
          name: fluent-bit-opensearch

    serviceMonitor:
      enabled: true

    config:
      service: |
        [SERVICE]
            Flush         5
            Daemon        Off
            Log_Level     info
            Parsers_File  parsers.conf
            Parsers_File  custom_parsers.conf
            HTTP_Server   On
            HTTP_Listen   0.0.0.0
            HTTP_Port     2020

      customParsers: |
        # RFC5424 with optional fractional seconds (Proxmox rsyslog, OPNsense)
        # Matches: <PRI>1 TIMESTAMP HOST APP PID MSGID SD MSG
        # rsyslog sends: <38>1 2026-06-21T16:06:29.738928+02:00 proxmox sshd 12345 - - message
        [PARSER]
            Name        syslog-rfc5424-nofrac
            Format      regex
            Regex       ^\<(?<pri>[0-9]{1,5})\>1 (?<time>[^ ]+) (?<host>[^ ]+) (?<ident>[^ ]+) (?<pid>[-0-9]+) (?<msgid>[^ ]+) (?<extradata>(\[(.*?)\]|-)) (?<message>.+)$
            Time_Key    time
            Time_Format %Y-%m-%dT%H:%M:%S.%L%z
            Time_Keep   Off

        # Fallback parser without fractional seconds
        [PARSER]
            Name        syslog-rfc5424-simple
            Format      regex
            Regex       ^\<(?<pri>[0-9]{1,5})\>1 (?<time>[^ ]+) (?<host>[^ ]+) (?<ident>[^ ]+) (?<pid>[-0-9]+) (?<msgid>[^ ]+) (?<extradata>(\[(.*?)\]|-)) (?<message>.+)$
            Time_Key    time
            Time_Format %Y-%m-%dT%H:%M:%S%z
            Time_Keep   Off

        # NOTE: the CRI (containerd) parser is BUILT IN to fluent-bit
        # (parsers.conf) — defining our own "cri" here collides with it and
        # makes fluent-bit skip the rest of this file (so later parsers like
        # talos_audit_type never register → crash). We reference the built-in
        # "cri" parser in the tail input instead.

        # Extract pod/namespace/container from the container log FILENAME
        # (/var/log/containers/<pod>_<ns>_<container>-<id>.log) so we get
        # per-app metadata WITHOUT needing the Kubernetes API filter (no RBAC).
        [PARSER]
            Name        k8s_file_meta
            Format      regex
            Regex       ^/var/log/containers/(?<pod>[^_]+)_(?<namespace>[^_]+)_(?<container>.+)-(?<containerid>[a-f0-9]{64})\.log$

        # Talos auditd: extract the Linux audit record type from msg, e.g.
        # "type=NETFILTER_CFG msg=audit(...)..." -> audit_type=NETFILTER_CFG.
        # Only auditd lines start with "type="; every other Talos log line
        # fails this regex and (with Reserve_Data+Preserve_Key) passes through
        # completely unchanged, so nothing is dropped or rewritten.
        [PARSER]
            Name        talos_audit_type
            Format      regex
            Regex       ^type=(?<audit_type>[A-Z0-9_]+)

      inputs: |
        # ── Syslog from Proxmox + OPNsense ──────────────────────────────
        # Fluent-Bit syslog plugin uses built-in decoder, not external parser
        [INPUT]
            Name          syslog
            Listen        0.0.0.0
            Port          5514
            Mode          udp
            Tag           syslog.udp

        [INPUT]
            Name          syslog
            Listen        0.0.0.0
            Port          5514
            Mode          tcp
            Tag           syslog.tcp

        # ── Talos kernel + service logs (CIS Talos 6.1.1/6.2.1) ─────────
        # Talos ships these as raw JSON-lines over plain TCP, not syslog framing
        [INPUT]
            Name          tcp
            Listen        0.0.0.0
            Port          5170
            Format        json
            Tag           talos.log

        # ── App container logs -> OpenSearch (per-app dashboards) ────────
        # Scoped by filename glob to the monitored app namespaces only, so we
        # don't ingest every container in the cluster. CRI format (containerd).
        [INPUT]
            Name              tail
            Tag               kube.app
            Path              /var/log/containers/*_nextcloud_*.log,/var/log/containers/*_paperless_*.log,/var/log/containers/*_open-webui_*.log,/var/log/containers/*_openclaw_*.log
            Parser            cri
            Path_Key          filename
            DB                /var/log/flb_kube_apps.db
            Mem_Buf_Limit     20MB
            Skip_Long_Lines   On
            Refresh_Interval  10
            Read_from_Head    On

      filters: |
        # Retag Suricata Eve-JSON records before any other processing
        [FILTER]
            Name              rewrite_tag
            Match             syslog.*
            Rule              $ident ^suricata$ suricata.$TAG false

        # Parse Eve-JSON message field into structured fields
        [FILTER]
            Name              parser
            Match             suricata.*
            Key_Name          message
            Parser            json
            Reserve_Data      On
            Preserve_Key      Off

        # Default source fallback (overwritten by specific rules below)
        [FILTER]
            Name          modify
            Match         syslog.*
            Add           source syslog

        # Label Proxmox by hostname
        [FILTER]
            Name          modify
            Match         syslog.*
            Condition     Key_value_matches host ^pve|^proxmox
            Set           source proxmox

        # Label OPNsense by hostname (secsrv = security server = OPNsense)
        [FILTER]
            Name          modify
            Match         syslog.*
            Condition     Key_value_matches host ^OPNsense|^opnsense|^fw|^secsrv
            Set           source opnsense

        # Add job label for Loki
        [FILTER]
            Name          modify
            Match         syslog.*
            Add           job syslog

        # Add job label for Loki (Suricata)
        [FILTER]
            Name          modify
            Match         suricata.*
            Add           job suricata

        # Add job label for Loki (Talos kernel/service logs)
        [FILTER]
            Name          modify
            Match         talos.log
            Add           job talos

        # Extract audit_type from Talos auditd records (see talos_audit_type
        # parser). Reserve_Data+Preserve_Key = non-matching records pass through
        # untouched, so only auditd lines gain an audit_type field.
        [FILTER]
            Name          parser
            Match         talos.log
            Key_Name      msg
            Parser        talos_audit_type
            Reserve_Data  On
            Preserve_Key  On

        # App container logs: derive pod/namespace/container from the filename
        [FILTER]
            Name          parser
            Match         kube.app
            Key_Name      filename
            Parser        k8s_file_meta
            Reserve_Data  On
            Preserve_Key  Off

        [FILTER]
            Name          modify
            Match         kube.app
            Add           job k8s-apps

      outputs: |
        # ── OpenSearch (SIEM) ────────────────────────────────────────────
        [OUTPUT]
            Name             opensearch
            Match            syslog.*
            Host             opensearch.logging.svc.cluster.local
            Port             9200
            HTTP_User        admin
            HTTP_Passwd      ${OPENSEARCH_PASSWORD}
            Type             _doc
            Logstash_Format  On
            Logstash_Prefix  syslog
            Logstash_Prefix_Key  $source
            Time_Key         @timestamp
            tls              On
            tls.verify       Off
            net.keepalive    off
            Retry_Limit      5
            Suppress_Type_Name On

        # ── OpenSearch (Suricata Eve-JSON) ──────────────────────────────
        [OUTPUT]
            Name             opensearch
            Match            suricata.*
            Host             opensearch.logging.svc.cluster.local
            Port             9200
            HTTP_User        admin
            HTTP_Passwd      ${OPENSEARCH_PASSWORD}
            Type             _doc
            Logstash_Format  On
            Logstash_Prefix  suricata
            Time_Key         @timestamp
            tls              On
            tls.verify       Off
            net.keepalive    off
            Retry_Limit      5
            Suppress_Type_Name On

        # ── Loki (Grafana dashboards) ────────────────────────────────────
        [OUTPUT]
            Name             loki
            Match            syslog.*
            Host             loki.monitoring.svc.cluster.local
            Port             3100
            Labels           job=syslog
            Label_Keys       $source,$host
            Line_Format      json
            Retry_Limit      5

        # ── Loki (Suricata) ──────────────────────────────────────────────
        [OUTPUT]
            Name             loki
            Match            suricata.*
            Host             loki.monitoring.svc.cluster.local
            Port             3100
            Labels           job=suricata
            Label_Keys       $event_type,$host
            Line_Format      json
            Retry_Limit      5

        # ── OpenSearch (Talos kernel/service logs) ───────────────────────
        [OUTPUT]
            Name             opensearch
            Match            talos.log
            Host             opensearch.logging.svc.cluster.local
            Port             9200
            HTTP_User        admin
            HTTP_Passwd      ${OPENSEARCH_PASSWORD}
            Type             _doc
            Logstash_Format  On
            Logstash_Prefix  talos
            Time_Key         @timestamp
            tls              On
            tls.verify       Off
            net.keepalive    off
            Retry_Limit      5
            Suppress_Type_Name On

        # ── Loki (Talos kernel/service logs) ─────────────────────────────
        [OUTPUT]
            Name             loki
            Match            talos.log
            Host             loki.monitoring.svc.cluster.local
            Port             3100
            Labels           job=talos
            Label_Keys       $hostname
            Line_Format      json
            Retry_Limit      5

        # ── OpenSearch (app container logs -> apps-<date> index) ─────────
        # App logs already go to Loki via Alloy; this adds them to OpenSearch
        # for the per-app OpenSearch dashboards. namespace/pod/container fields
        # come from the filename parser above.
        [OUTPUT]
            Name             opensearch
            Match            kube.app
            Host             opensearch.logging.svc.cluster.local
            Port             9200
            HTTP_User        admin
            HTTP_Passwd      ${OPENSEARCH_PASSWORD}
            Type             _doc
            Logstash_Format  On
            Logstash_Prefix  apps
            Time_Key         @timestamp
            tls              On
            tls.verify       Off
            net.keepalive    off
            Retry_Limit      5
            Suppress_Type_Name On

    # Expose syslog port on pods. The chart also adds these entries to the
    # Service, which requires a valid `port` (1-65535); without it the Service
    # port defaults to 0 and the Helm upgrade fails ("port: Invalid value: 0").
    extraPorts:
      - name: syslog-udp
        port: 5514
        containerPort: 5514
        protocol: UDP
        targetPort: 5514
      - name: syslog-tcp
        port: 5514
        containerPort: 5514
        protocol: TCP
        targetPort: 5514
      - name: talos-log-tcp
        port: 5170
        containerPort: 5170
        protocol: TCP
        targetPort: 5170
