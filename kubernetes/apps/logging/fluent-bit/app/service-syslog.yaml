---
# LoadBalancer for external log collection
# Proxmox:  System > Syslog → UDP/TCP 514 → 192.168.10.110
# OPNsense: System > Log Files > Settings → Remote Logging → 192.168.10.110:514
# Talos:    machine.logging.destinations / install.extraKernelArgs → 192.168.10.110:5170
# Selector now points to Fluent Bit in logging namespace
apiVersion: v1
kind: Service
metadata:
  name: syslog-ingress
  namespace: logging
  annotations:
    lbipam.cilium.io/ips: "192.168.10.110"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: fluent-bit
  ports:
    - name: syslog-udp
      port: 514
      protocol: UDP
      targetPort: 5514
    - name: syslog-tcp
      port: 514
      protocol: TCP
      targetPort: 5514
    - name: talos-log-tcp
      port: 5170
      protocol: TCP
      targetPort: 5170
