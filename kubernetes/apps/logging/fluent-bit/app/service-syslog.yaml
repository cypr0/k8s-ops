---
# LoadBalancer for Talos node logs.
#   Talos: machine.logging.destinations / install.extraKernelArgs
#          -> 192.168.10.110:5170
#
# The VIP and the name stay as they are even though only one port is left:
# every node's machine config points at this address, and changing it means a
# config patch plus a rolling reboot of the whole cluster.
#
# Syslog on 514 is gone. Proxmox and OPNsense (incl. its Suricata IDS) now
# report to the Wazuh manager on 192.168.10.111 instead, where the events are
# decoded into alerts rather than stored as raw lines.
apiVersion: v1
kind: Service
metadata:
  name: syslog-ingress
  namespace: logging
  annotations:
    lbipam.cilium.io/ips: "192.168.10.110"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: fluent-bit
  ports:
    - name: talos-log-tcp
      port: 5170
      protocol: TCP
      targetPort: 5170
