---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: opensearch-cluster
  namespace: logging
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: opensearch-cluster
  dependsOn:
    - name: opensearch-operator
      namespace: logging
    - name: external-secrets-stores
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/logging/opensearch-cluster/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: logging
  timeout: 15m
  wait: false
