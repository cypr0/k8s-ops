---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apps-dashboard-script
data:
  create_apps_dashboard.py: |-
    import json, os, time, base64, urllib.request, urllib.error

    OSD      = os.environ.get("OSD_HOST", "http://opensearch-dashboards.logging.svc.cluster.local:5601")
    OSD_USER = os.environ.get("OSD_USER", "admin")
    OSD_PASS = os.environ.get("OSD_PASS", "")
    _b64     = base64.b64encode((OSD_USER + ":" + OSD_PASS).encode()).decode()
    HEADERS  = {"Content-Type": "application/json", "osd-xsrf": "true", "Authorization": "Basic " + _b64}

    def osd(method, path, body=None):
        data = json.dumps(body).encode() if body else None
        req  = urllib.request.Request(OSD + path, data=data, headers=HEADERS, method=method)
        try:
            with urllib.request.urlopen(req, timeout=30) as r:
                return json.loads(r.read()), r.status
        except urllib.error.HTTPError as e:
            try:    return json.loads(e.read()), e.code
            except: return {}, e.code

    def populate_fields(idx_id, title, ts="@timestamp"):
        import urllib.parse as _up
        q = ("/api/index_patterns/_fields_for_wildcard?pattern=" + _up.quote(title) +
             "&meta_fields=_source&meta_fields=_id&meta_fields=_index&meta_fields=_score")
        fr, fs = osd("GET", q)
        fields = fr.get("fields", []) if fs == 200 else []
        if not fields:
            print("  " + title + ": fields not available yet, hourly refresh job will pick it up")
            return
        attrs = {"title": title, "fields": json.dumps(fields)}
        if ts:
            attrs["timeFieldName"] = ts
        ur, us = osd("POST", "/api/saved_objects/index-pattern/" + idx_id + "?overwrite=true",
                     {"attributes": attrs})
        print("  " + title + ": " + str(len(fields)) + " fields populated (" + str(us) + ")")

    print("Waiting for Dashboards...")
    for _ in range(30):
        r, s = osd("GET", "/api/status")
        if s == 200 and r.get("status", {}).get("overall", {}).get("state") == "green":
            print("Ready."); break
        time.sleep(10)

    METRIC_P = {
        "addTooltip": True, "addLegend": False, "type": "gauge",
        "gauge": {"verticalSplit": False, "extendRange": True, "percentageMode": False,
            "gaugeType": "Metric", "gaugeColorMode": "None",
            "colorsRange": [{"from": 0, "to": 10000000}], "invertColors": False,
            "labels": {"show": True, "color": "black"},
            "scale": {"show": False, "labels": False, "color": "#333"},
            "type": "simple",
            "style": {"bgFill": "#000", "bgColor": False, "labelColor": False, "subText": "", "fontSize": 60}}
    }
    def pie_p(): return {"type":"pie","addTooltip":True,"addLegend":True,"legendPosition":"right","isDonut":True,"labels":{"show":True,"values":True,"last_level":True,"truncate":100}}
    def hbar_p(): return {"type":"histogram","grid":{"categoryLines":False},"categoryAxes":[{"id":"CategoryAxis-1","type":"category","position":"left","show":True,"style":{},"scale":{"type":"linear"},"labels":{"show":True,"rotate":0,"filter":True,"truncate":200},"title":{}}],"valueAxes":[{"id":"ValueAxis-1","name":"LeftAxis-1","type":"value","position":"bottom","show":True,"style":{},"scale":{"type":"linear","mode":"normal"},"labels":{"show":True,"rotate":0,"filter":False,"truncate":100},"title":{"text":"Count"}}],"seriesParams":[{"show":True,"type":"histogram","mode":"stacked","data":{"label":"Count","id":"1"},"valueAxis":"ValueAxis-1","drawLinesBetweenPoints":True,"lineWidth":2,"showCircles":True}],"addTooltip":True,"addLegend":True,"legendPosition":"right","times":[],"addTimeMarker":False,"truncateLegend":True,"maxLegendLines":1}
    def line_p(): return {"type":"line","grid":{"categoryLines":False},"categoryAxes":[{"id":"CategoryAxis-1","type":"category","position":"bottom","show":True,"style":{},"scale":{"type":"linear"},"labels":{"show":True,"filter":True,"truncate":100},"title":{}}],"valueAxes":[{"id":"ValueAxis-1","name":"LeftAxis-1","type":"value","position":"left","show":True,"style":{},"scale":{"type":"linear","mode":"normal"},"labels":{"show":True,"rotate":0,"filter":False,"truncate":100},"title":{"text":"Count"}}],"seriesParams":[{"show":True,"type":"line","mode":"normal","data":{"label":"Events","id":"1"},"drawLinesBetweenPoints":True,"lineWidth":2,"showCircles":True,"interpolate":"linear","valueAxis":"ValueAxis-1"}],"addTooltip":True,"addLegend":True,"legendPosition":"right","times":[],"addTimeMarker":False}
    def c(): return [{"id":"1","enabled":True,"type":"count","schema":"metric","params":{}}]
    def card(f): return [{"id":"1","enabled":True,"type":"cardinality","schema":"metric","params":{"field":f}}]
    def t(f, sz=15): return {"id":"2","enabled":True,"type":"terms","schema":"segment","params":{"field":f,"size":sz,"order":"desc","orderBy":"1","otherBucket":False,"missingBucket":False}}
    def g(f, sz=6): return {"id":"3","enabled":True,"type":"terms","schema":"group","params":{"field":f,"size":sz,"order":"desc","orderBy":"1"}}
    def dh(): return {"id":"2","enabled":True,"type":"date_histogram","schema":"segment","params":{"field":"@timestamp","useNormalizedEsInterval":True,"interval":"auto","drop_partials":False,"min_doc_count":1,"extended_bounds":{}}}

    def mkv(vid, title, vis_type, params, aggs, idx, flt=None):
        return {"type": "visualization", "id": vid, "attributes": {
            "title": title,
            "visState": json.dumps({"title": title, "type": vis_type, "params": params, "aggs": aggs}),
            "uiStateJSON": "{}", "description": "",
            "kibanaSavedObjectMeta": {"searchSourceJSON": json.dumps({
                "index": idx,
                "query": {"bool": {"filter": flt or [], "must": [], "must_not": [], "should": []}},
                "filter": []})}},
            "references": [{"id": idx, "name": "indexPatternId", "type": "index-pattern"}]}

    def mkdash(did, title, desc, panels, refs):
        p_json = []
        for i, p in enumerate(panels):
            p_json.append({"version":"3.6.0","gridData":{"x":p["x"],"y":p["y"],"w":p["w"],"h":p["h"],"i":str(i+1)},"panelIndex":str(i+1),"embeddableConfig":{},"panelRefName":"panel_"+str(i+1)})
        return osd("POST", "/api/saved_objects/dashboard/" + did + "?overwrite=true", {
            "attributes": {"title": title, "description": desc,
                "panelsJSON": json.dumps(p_json),
                "optionsJSON": json.dumps({"useMargins":True,"syncColors":False,"hidePanelTitles":False}),
                "version": 1, "timeRestore": False,
                "kibanaSavedObjectMeta": {"searchSourceJSON": json.dumps({"query":{"match_all":{}},"filter":[]})}},
            "references": refs})

    # INDEX PATTERN (fields populated by the refresh-index-pattern-fields cronjob)
    r, s = osd("POST", "/api/saved_objects/index-pattern/apps-idx?overwrite=true",
               {"attributes": {"title": "apps-*", "timeFieldName": "@timestamp", "fields": "[]"}})
    print("Index pattern apps-*: " + str(s))
    populate_fields("apps-idx", "apps-*")

    # DASHBOARD — Apps: Logs & Errors (Nextcloud, Paperless, Open WebUI, OpenClaw)
    AI = "apps-idx"
    err_flt = [{"query_string": {"query": "message:(error OR Error OR ERROR OR fail OR failed OR exception OR fatal OR panic OR critical)"}}]

    vizs = [
        mkv("a-v1-total",   "\U0001F4CB Total Log Events", "metric", METRIC_P, c(), AI),
        mkv("a-v2-errors",  "\U0001F534 Error Lines",      "metric", METRIC_P, c(), AI, err_flt),
        mkv("a-v3-apps",    "\U0001F4E6 Apps Logging",     "metric", METRIC_P, card("namespace.keyword"), AI),
        mkv("a-v4-cont",    "\U0001F5C3 Containers",       "metric", METRIC_P, card("container.keyword"), AI),

        mkv("a-v5-timeline", "Log Volume Over Time by App", "line", line_p(),
            c() + [dh(), g("namespace.keyword", 6)], AI),

        mkv("a-v6-ns",   "Events by App", "horizontal_bar", hbar_p(), c() + [t("namespace.keyword", 10)], AI),
        mkv("a-v7-cont", "Events by Container", "horizontal_bar", hbar_p(), c() + [t("container.keyword", 15)], AI),

        mkv("a-v8-errtime", "Errors Over Time by App", "line", line_p(),
            c() + [dh(), g("namespace.keyword", 6)], AI, err_flt),

        mkv("a-v9-errcont", "Errors by Container", "horizontal_bar", hbar_p(),
            c() + [t("container.keyword", 15)], AI, err_flt),
        mkv("a-v10-stream", "stdout vs stderr", "pie", pie_p(), c() + [t("stream.keyword", 3)], AI),
    ]

    print("Creating Apps visualizations...")
    for viz in vizs:
        r, s = osd("POST", "/api/saved_objects/visualization/" + viz["id"] + "?overwrite=true",
                   {"attributes": viz["attributes"], "references": viz["references"]})
        print("  " + viz["attributes"]["title"] + ": " + ("OK" if s < 300 else "ERR " + str(s)))

    panels = [
        {"id":"a-v1-total",   "x":0,  "y":0,  "w":12, "h":9},
        {"id":"a-v2-errors",  "x":12, "y":0,  "w":12, "h":9},
        {"id":"a-v3-apps",    "x":24, "y":0,  "w":12, "h":9},
        {"id":"a-v4-cont",    "x":36, "y":0,  "w":12, "h":9},
        {"id":"a-v5-timeline","x":0,  "y":9,  "w":48, "h":12},
        {"id":"a-v6-ns",      "x":0,  "y":21, "w":24, "h":14},
        {"id":"a-v7-cont",    "x":24, "y":21, "w":24, "h":14},
        {"id":"a-v8-errtime", "x":0,  "y":35, "w":48, "h":12},
        {"id":"a-v9-errcont", "x":0,  "y":47, "w":24, "h":14},
        {"id":"a-v10-stream", "x":24, "y":47, "w":24, "h":14},
    ]
    refs = [{"name":"panel_"+str(i+1),"type":"visualization","id":p["id"]} for i,p in enumerate(panels)]
    r, s = mkdash("apps-logs", "Apps — Logs & Errors",
                  "Container logs for Nextcloud, Paperless-ngx, Open WebUI and OpenClaw: volume and errors by app and container, over time.",
                  panels, refs)
    print("Dashboard Apps: " + str(s))
    print("  <OSD>/app/dashboards#/view/apps-logs")
