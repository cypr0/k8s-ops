---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trading-to-opensearch
spec:
  # Every 15 minutes -- frequent enough for a useful trend without
  # hammering Postgres; check_positions.py itself only snapshots every 5m.
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          containers:
            - name: exporter
              image: python:3.14-alpine
              # psycopg2-binary has no musl (Alpine) wheel, only manylinux
              # (glibc) -- would fail to install without headers. Alpine's
              # own `apk add py3-psycopg2` binary package is built against
              # Alpine's *system* python3, not this image's bundled
              # interpreter -- ABI/version mismatch risk. Compiling from
              # source against the actual running interpreter's headers is
              # the correct fix; ~20-30s one-time cost per run is fine at
              # a 15-minute cadence.
              command:
                - "/bin/sh"
                - "-c"
                - |
                  set -e
                  # This cluster has no IPv6 egress route, but every external
                  # host this container talks to (Alpine's package mirror,
                  # PyPI) resolves to both A and AAAA records -- musl/pip/apk
                  # sometimes pick the AAAA record and then fail outright
                  # instead of falling back to IPv4 (verified live: `curl -6`
                  # to pypi.org fails instantly with "Network unreachable";
                  # `apk add` separately failed with a generic "TLS:
                  # unspecified error" against dl-cdn.alpinelinux.org, same
                  # underlying cause). Pinning all three hostnames to their
                  # IPv4 address in /etc/hosts via socket.gethostbyname
                  # (IPv4-only by definition) removes the IPv6 option before
                  # anything else resolves them.
                  python3 -c "
                  import socket
                  for host in ('dl-cdn.alpinelinux.org', 'pypi.org', 'files.pythonhosted.org'):
                      ip = socket.gethostbyname(host)
                      with open('/etc/hosts', 'a') as f:
                          f.write(f'{ip} {host}\n')
                  "
                  # Even with IPv4 pinned, a brand-new pod's first connections
                  # to a not-yet-contacted FQDN occasionally get dropped --
                  # Cilium's DNS-proxy egress allow-list for that IP can lag
                  # a moment behind the DNS answer. Retry the whole install
                  # rather than let one bad attempt fail the Job.
                  n=0
                  until apk add --no-cache gcc musl-dev postgresql-dev >/dev/null 2>&1 \
                        && pip install --quiet --no-cache-dir psycopg2; do
                    n=$((n + 1))
                    if [ "$n" -ge 5 ]; then
                      echo "apk/pip install failed after $n attempts" >&2
                      exit 1
                    fi
                    echo "apk/pip install attempt $n failed, retrying in 10s..." >&2
                    sleep 10
                  done
                  python3 /scripts/export_trading.py
              env:
                - name: OPENSEARCH_HOST
                  value: "https://opensearch.logging.svc.cluster.local:9200"
                - name: OPENSEARCH_USER
                  value: "admin"
                - name: OPENSEARCH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: opensearch-config-credentials
                      key: OPENSEARCH_PASSWORD
                - name: TRADING_DB_HOST
                  value: "postgres-rw.database.svc.cluster.local"
                - name: TRADING_DB_NAME
                  value: "trading"
                - name: TRADING_DB_USER
                  value: "tradingreadonly"
                - name: TRADING_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: opensearch-config-credentials
                      key: TRADING_DB_PASSWORD
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 20m
                  memory: 96Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                # Root is required here (unlike the other job containers in
                # this directory, which run as 65534): `apk add` installs
                # system packages into /usr/lib etc., which a non-root user
                # cannot write to. Short-lived batch container only.
                runAsNonRoot: false
                runAsUser: 0
                capabilities:
                  drop:
                    - "ALL"
          volumes:
            - name: scripts
              configMap:
                name: trading-exporter-script
                defaultMode: 0755
