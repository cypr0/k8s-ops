---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trading-to-opensearch
spec:
  # Every 15 minutes -- frequent enough for a useful trend without
  # hammering Postgres; check_positions.py itself only snapshots every 5m.
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          containers:
            - name: exporter
              image: python:3.14-alpine
              # psycopg2-binary has no musl (Alpine) wheel, only manylinux
              # (glibc) -- would fail to install without headers. Alpine's
              # own `apk add py3-psycopg2` binary package is built against
              # Alpine's *system* python3, not this image's bundled
              # interpreter -- ABI/version mismatch risk. Compiling from
              # source against the actual running interpreter's headers is
              # the correct fix; ~20-30s one-time cost per run is fine at
              # a 15-minute cadence.
              command:
                - "/bin/sh"
                - "-c"
                - |
                  set -e
                  apk add --no-cache gcc musl-dev postgresql-dev >/dev/null
                  # This cluster has no IPv6 egress route, but pypi.org /
                  # files.pythonhosted.org resolve to both A and AAAA records
                  # -- pip's resolver picks the AAAA record and hangs
                  # retrying instead of falling back to IPv4 (verified live:
                  # `curl -6` to pypi.org fails instantly with "Network
                  # unreachable", `curl -4` succeeds immediately). Pinning
                  # both hostnames to their IPv4 address in /etc/hosts via
                  # socket.gethostbyname (IPv4-only by definition) removes
                  # the IPv6 option before pip ever resolves them.
                  python3 -c "
                  import socket
                  for host in ('pypi.org', 'files.pythonhosted.org'):
                      ip = socket.gethostbyname(host)
                      with open('/etc/hosts', 'a') as f:
                          f.write(f'{ip} {host}\n')
                  "
                  pip install --quiet --no-cache-dir psycopg2
                  python3 /scripts/export_trading.py
              env:
                - name: OPENSEARCH_HOST
                  value: "https://opensearch.logging.svc.cluster.local:9200"
                - name: OPENSEARCH_USER
                  value: "admin"
                - name: OPENSEARCH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: opensearch-config-credentials
                      key: OPENSEARCH_PASSWORD
                - name: TRADING_DB_HOST
                  value: "postgres-rw.database.svc.cluster.local"
                - name: TRADING_DB_NAME
                  value: "trading"
                - name: TRADING_DB_USER
                  value: "tradingreadonly"
                - name: TRADING_DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: opensearch-config-credentials
                      key: TRADING_DB_PASSWORD
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 20m
                  memory: 96Mi
                limits:
                  memory: 256Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                # Root is required here (unlike the other job containers in
                # this directory, which run as 65534): `apk add` installs
                # system packages into /usr/lib etc., which a non-root user
                # cannot write to. Short-lived batch container only.
                runAsNonRoot: false
                runAsUser: 0
                capabilities:
                  drop:
                    - "ALL"
          volumes:
            - name: scripts
              configMap:
                name: trading-exporter-script
                defaultMode: 0755
