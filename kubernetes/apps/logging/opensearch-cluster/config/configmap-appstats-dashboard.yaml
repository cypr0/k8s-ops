---
apiVersion: v1
kind: ConfigMap
metadata:
  name: appstats-dashboard-script
data:
  create_appstats_dashboard.py: |-
    import json, os, time, base64, urllib.request, urllib.error

    OSD      = os.environ.get("OSD_HOST", "http://opensearch-dashboards.logging.svc.cluster.local:5601")
    OSD_USER = os.environ.get("OSD_USER", "admin")
    OSD_PASS = os.environ.get("OSD_PASS", "")
    _b64     = base64.b64encode((OSD_USER + ":" + OSD_PASS).encode()).decode()
    HEADERS  = {"Content-Type": "application/json", "osd-xsrf": "true", "Authorization": "Basic " + _b64}

    def osd(method, path, body=None):
        data = json.dumps(body).encode() if body else None
        req  = urllib.request.Request(OSD + path, data=data, headers=HEADERS, method=method)
        try:
            with urllib.request.urlopen(req, timeout=30) as r:
                return json.loads(r.read()), r.status
        except urllib.error.HTTPError as e:
            try:    return json.loads(e.read()), e.code
            except: return {}, e.code

    def populate_fields(idx_id, title, ts="@timestamp"):
        import urllib.parse as _up
        q = ("/api/index_patterns/_fields_for_wildcard?pattern=" + _up.quote(title) +
             "&meta_fields=_source&meta_fields=_id&meta_fields=_index&meta_fields=_score")
        fr, fs = osd("GET", q)
        fields = fr.get("fields", []) if fs == 200 else []
        if not fields:
            print("  " + title + ": fields not available yet, hourly refresh job will pick it up")
            return
        attrs = {"title": title, "fields": json.dumps(fields)}
        if ts:
            attrs["timeFieldName"] = ts
        ur, us = osd("POST", "/api/saved_objects/index-pattern/" + idx_id + "?overwrite=true",
                     {"attributes": attrs})
        print("  " + title + ": " + str(len(fields)) + " fields populated (" + str(us) + ")")

    print("Waiting for Dashboards...")
    for _ in range(30):
        r, s = osd("GET", "/api/status")
        if s == 200 and r.get("status", {}).get("overall", {}).get("state") == "green":
            print("Ready."); break
        time.sleep(10)

    METRIC_P = {
        "addTooltip": True, "addLegend": False, "type": "gauge",
        "gauge": {"verticalSplit": False, "extendRange": True, "percentageMode": False,
            "gaugeType": "Metric", "gaugeColorMode": "None",
            "colorsRange": [{"from": 0, "to": 10000000}], "invertColors": False,
            "labels": {"show": True, "color": "black"},
            "scale": {"show": False, "labels": False, "color": "#333"},
            "type": "simple",
            "style": {"bgFill": "#000", "bgColor": False, "labelColor": False, "subText": "", "fontSize": 60}}
    }
    def pie_p(): return {"type":"pie","addTooltip":True,"addLegend":True,"legendPosition":"right","isDonut":True,"labels":{"show":True,"values":True,"last_level":True,"truncate":100}}
    def line_p(): return {"type":"line","grid":{"categoryLines":False},"categoryAxes":[{"id":"CategoryAxis-1","type":"category","position":"bottom","show":True,"style":{},"scale":{"type":"linear"},"labels":{"show":True,"filter":True,"truncate":100},"title":{}}],"valueAxes":[{"id":"ValueAxis-1","name":"LeftAxis-1","type":"value","position":"left","show":True,"style":{},"scale":{"type":"linear","mode":"normal"},"labels":{"show":True,"rotate":0,"filter":False,"truncate":100},"title":{"text":"Value"}}],"seriesParams":[{"show":True,"type":"line","mode":"normal","data":{"label":"Value","id":"1"},"drawLinesBetweenPoints":True,"lineWidth":2,"showCircles":True,"interpolate":"linear","valueAxis":"ValueAxis-1"}],"addTooltip":True,"addLegend":True,"legendPosition":"right","times":[],"addTimeMarker":False}
    def hbar_p(): return {"type":"histogram","grid":{"categoryLines":False},"categoryAxes":[{"id":"CategoryAxis-1","type":"category","position":"left","show":True,"style":{},"scale":{"type":"linear"},"labels":{"show":True,"rotate":0,"filter":True,"truncate":200},"title":{}}],"valueAxes":[{"id":"ValueAxis-1","name":"LeftAxis-1","type":"value","position":"bottom","show":True,"style":{},"scale":{"type":"linear","mode":"normal"},"labels":{"show":True,"rotate":0,"filter":False,"truncate":100},"title":{"text":"Count"}}],"seriesParams":[{"show":True,"type":"histogram","mode":"stacked","data":{"label":"Count","id":"1"},"valueAxis":"ValueAxis-1","drawLinesBetweenPoints":True,"lineWidth":2,"showCircles":True}],"addTooltip":True,"addLegend":True,"legendPosition":"right","times":[],"addTimeMarker":False,"truncateLegend":True,"maxLegendLines":1}
    def c(): return [{"id":"1","enabled":True,"type":"count","schema":"metric","params":{}}]
    def t(f, sz=15): return {"id":"2","enabled":True,"type":"terms","schema":"segment","params":{"field":f,"size":sz,"order":"desc","orderBy":"1","otherBucket":False,"missingBucket":False}}
    def dh(): return {"id":"1","enabled":True,"type":"date_histogram","schema":"segment","params":{"field":"@timestamp","useNormalizedEsInterval":True,"interval":"auto","drop_partials":False,"min_doc_count":1,"extended_bounds":{}}}
    def avg_metric(f, mid="1"): return {"id":mid,"enabled":True,"type":"avg","schema":"metric","params":{"field":f}}
    def max_metric(f, mid="1"): return {"id":mid,"enabled":True,"type":"max","schema":"metric","params":{"field":f}}

    def mkv(vid, title, vis_type, params, aggs, idx, flt=None):
        return {"type": "visualization", "id": vid, "attributes": {
            "title": title,
            "visState": json.dumps({"title": title, "type": vis_type, "params": params, "aggs": aggs}),
            "uiStateJSON": "{}", "description": "",
            "kibanaSavedObjectMeta": {"searchSourceJSON": json.dumps({
                "index": idx,
                "query": {"bool": {"filter": flt or [], "must": [], "must_not": [], "should": []}},
                "filter": []})}},
            "references": [{"id": idx, "name": "indexPatternId", "type": "index-pattern"}]}

    def mkdash(did, title, desc, panels, refs):
        p_json = []
        for i, p in enumerate(panels):
            p_json.append({"version":"3.6.0","gridData":{"x":p["x"],"y":p["y"],"w":p["w"],"h":p["h"],"i":str(i+1)},"panelIndex":str(i+1),"embeddableConfig":{},"panelRefName":"panel_"+str(i+1)})
        return osd("POST", "/api/saved_objects/dashboard/" + did + "?overwrite=true", {
            "attributes": {"title": title, "description": desc,
                "panelsJSON": json.dumps(p_json),
                "optionsJSON": json.dumps({"useMargins":True,"syncColors":False,"hidePanelTitles":False}),
                "version": 1, "timeRestore": False,
                "kibanaSavedObjectMeta": {"searchSourceJSON": json.dumps({"query":{"match_all":{}},"filter":[]})}},
            "references": refs})

    # ════════════════════════════════════════════════════════════════════════
    # INDEX PATTERNS (fields populated by the refresh-index-pattern-fields cronjob)
    # ════════════════════════════════════════════════════════════════════════
    for idx_id, pattern in [
        ("nextcloud-stats-idx", "nextcloud-stats-*"),
        ("paperless-stats-idx", "paperless-stats-*"),
        ("paperless-tasks-idx", "paperless-tasks-*"),
        ("hermes-trading-stats-idx", "hermes-agent-stats-*"),
        ("hermes-trading-portfolio-idx", "hermes-agent-portfolio"),
        ("hermes-trading-trades-idx", "hermes-agent-trades"),
    ]:
        r, s = osd("POST", "/api/saved_objects/index-pattern/" + idx_id + "?overwrite=true",
                   {"attributes": {"title": pattern, "timeFieldName": "@timestamp", "fields": "[]"}})
        print("Index pattern " + pattern + ": " + str(s))
        populate_fields(idx_id, pattern)

    # ════════════════════════════════════════════════════════════════════════
    # DASHBOARD 1 — Nextcloud: Stats
    # ════════════════════════════════════════════════════════════════════════
    NI = "nextcloud-stats-idx"
    nc_vizs = [
        mkv("nc-s1-users",  "\U0001F465 Users",       "metric", METRIC_P, [max_metric("users_total")], NI),
        mkv("nc-s2-files",  "\U0001F4C4 Files",        "metric", METRIC_P, [max_metric("files_total")], NI),
        mkv("nc-s3-shares", "\U0001F517 Shares",       "metric", METRIC_P, [max_metric("shares_total")], NI),
        mkv("nc-s4-free",   "\U0001F4BE Free Space (bytes)", "metric", METRIC_P, [max_metric("freespace_bytes")], NI),

        mkv("nc-s5-active", "Active Users Over Time", "line", line_p(),
            [avg_metric("active_users_1hour","1"), dh()], NI),

        mkv("nc-s6-free-trend", "Free Space Over Time", "line", line_p(),
            [max_metric("freespace_bytes","1"), dh()], NI),

        mkv("nc-s7-mem", "Memory Free Over Time", "line", line_p(),
            [avg_metric("mem_free_kb","1"), dh()], NI),

        mkv("nc-s8-cpu", "CPU Load (1min) Over Time", "line", line_p(),
            [avg_metric("cpuload_1min","1"), dh()], NI),
    ]
    print("\nCreating Nextcloud stats visualizations...")
    for viz in nc_vizs:
        r, s = osd("POST", "/api/saved_objects/visualization/" + viz["id"] + "?overwrite=true",
                   {"attributes": viz["attributes"], "references": viz["references"]})
        print("  " + viz["attributes"]["title"] + ": " + ("OK" if s < 300 else "ERR " + str(s)))

    ncp = [
        {"id":"nc-s1-users",     "x":0,  "y":0,  "w":12, "h":9},
        {"id":"nc-s2-files",     "x":12, "y":0,  "w":12, "h":9},
        {"id":"nc-s3-shares",    "x":24, "y":0,  "w":12, "h":9},
        {"id":"nc-s4-free",      "x":36, "y":0,  "w":12, "h":9},
        {"id":"nc-s5-active",    "x":0,  "y":9,  "w":48, "h":12},
        {"id":"nc-s6-free-trend","x":0,  "y":21, "w":24, "h":12},
        {"id":"nc-s7-mem",       "x":24, "y":21, "w":24, "h":12},
        {"id":"nc-s8-cpu",       "x":0,  "y":33, "w":48, "h":12},
    ]
    refs_nc = [{"name":"panel_"+str(i+1),"type":"visualization","id":p["id"]} for i,p in enumerate(ncp)]
    r, s = mkdash("nextcloud-stats", "Nextcloud — Stats",
                  "Nextcloud serverinfo trends: users, files, shares, free space, memory, CPU load.",
                  ncp, refs_nc)
    print("Dashboard Nextcloud Stats: " + str(s))

    # ════════════════════════════════════════════════════════════════════════
    # DASHBOARD 2 — Paperless: Availability & Tasks
    # ════════════════════════════════════════════════════════════════════════
    PI = "paperless-stats-idx"
    TI = "paperless-tasks-idx"
    fail_flt = [{"terms": {"status.keyword": ["FAILURE", "REVOKED"]}}]

    pl_vizs = [
        mkv("pl-s1-docs",   "\U0001F4C4 Documents",     "metric", METRIC_P, [max_metric("documents_total")], PI),
        mkv("pl-s2_inbox",  "\U0001F4E5 Inbox",          "metric", METRIC_P, [max_metric("documents_inbox")], PI),
        mkv("pl-s3-status", "\U0001F7E2 All Systems OK", "metric", METRIC_P,
            [{"id":"1","enabled":True,"type":"count","schema":"metric","params":{}}], PI,
            [{"term": {"all_ok": True}}]),
        mkv("pl-s4-free",   "\U0001F4BE Storage Available (bytes)", "metric", METRIC_P, [max_metric("storage_available_bytes")], PI),

        mkv("pl-s5-docs-trend", "Documents Over Time", "line", line_p(),
            [max_metric("documents_total","1"), dh()], PI),

        mkv("pl-s6-tasks-status", "Tasks by Status", "pie", pie_p(),
            c() + [t("status.keyword", 8)], TI),

        mkv("pl-s7-tasks-time", "Tasks Over Time by Status", "line", line_p(),
            [{"id":"1","enabled":True,"type":"count","schema":"metric","params":{}},
             {"id":"2","enabled":True,"type":"date_histogram","schema":"segment","params":{"field":"date_created","useNormalizedEsInterval":True,"interval":"auto","drop_partials":False,"min_doc_count":1,"extended_bounds":{}}},
             {"id":"3","enabled":True,"type":"terms","schema":"group","params":{"field":"status.keyword","size":8,"order":"desc","orderBy":"1"}}], TI),

        mkv("pl-s8-tasks-name", "Tasks by Name", "horizontal_bar", hbar_p(),
            c() + [t("task_name.keyword", 15)], TI),

        mkv("pl-s9-failed", "\U0001F534 Failed/Revoked Tasks", "metric", METRIC_P, c(), TI, fail_flt),
    ]
    print("\nCreating Paperless stats/tasks visualizations...")
    for viz in pl_vizs:
        r, s = osd("POST", "/api/saved_objects/visualization/" + viz["id"] + "?overwrite=true",
                   {"attributes": viz["attributes"], "references": viz["references"]})
        print("  " + viz["attributes"]["title"] + ": " + ("OK" if s < 300 else "ERR " + str(s)))

    plp = [
        {"id":"pl-s1-docs",        "x":0,  "y":0,  "w":12, "h":9},
        {"id":"pl-s2_inbox",       "x":12, "y":0,  "w":12, "h":9},
        {"id":"pl-s3-status",      "x":24, "y":0,  "w":12, "h":9},
        {"id":"pl-s4-free",        "x":36, "y":0,  "w":12, "h":9},
        {"id":"pl-s5-docs-trend",  "x":0,  "y":9,  "w":48, "h":12},
        {"id":"pl-s9-failed",      "x":0,  "y":21, "w":12, "h":9},
        {"id":"pl-s6-tasks-status","x":12, "y":21, "w":18, "h":14},
        {"id":"pl-s8-tasks-name",  "x":30, "y":21, "w":18, "h":14},
        {"id":"pl-s7-tasks-time",  "x":0,  "y":35, "w":48, "h":12},
    ]
    refs_pl = [{"name":"panel_"+str(i+1),"type":"visualization","id":p["id"]} for i,p in enumerate(plp)]
    r, s = mkdash("paperless-stats", "Paperless — Availability & Tasks",
                  "Paperless-ngx availability (subsystem health, storage, documents) and the OCR/consume task queue (status breakdown, failures).",
                  plp, refs_pl)
    print("Dashboard Paperless Stats: " + str(s))

    # ════════════════════════════════════════════════════════════════════════
    # DASHBOARD 3 — Hermes Trading Bot: BTC/ETH paper-trading simulation
    # ════════════════════════════════════════════════════════════════════════
    HSI = "hermes-trading-stats-idx"
    HPI = "hermes-trading-portfolio-idx"
    HTI = "hermes-trading-trades-idx"

    ht_vizs = [
        mkv("ht-s1-value",     "\U0001F4B0 Current Total Value (EUR)", "metric", METRIC_P, [max_metric("total_value_eur")], HSI),
        mkv("ht-s2-cash",      "\U0001F4B5 Cash (EUR)",                "metric", METRIC_P, [max_metric("cash_eur")], HSI),
        mkv("ht-s3-positions", "\U0001F4CA Open Positions",            "metric", METRIC_P, [max_metric("num_open_positions")], HSI),
        mkv("ht-s4-wins",      "\U0001F7E2 Wins",                      "metric", METRIC_P, [max_metric("wins")], HSI),
        mkv("ht-s5-losses",    "\U0001F534 Losses",                    "metric", METRIC_P, [max_metric("losses")], HSI),

        mkv("ht-s6-value-trend", "Portfolio Value Over Time", "line", line_p(),
            [avg_metric("total_value_eur","1"), dh()], HPI),

        mkv("ht-s7-cash-trend", "Cash Over Time", "line", line_p(),
            [avg_metric("cash_eur","1"), dh()], HPI),

        mkv("ht-s8-trades-symbol", "Trades by Symbol", "pie", pie_p(),
            c() + [t("symbol.keyword", 5)], HTI),

        mkv("ht-s9-trades-type", "Trades by Type", "horizontal_bar", hbar_p(),
            c() + [t("trade_type.keyword", 10)], HTI),
    ]
    print("\nCreating Hermes trading bot visualizations...")
    for viz in ht_vizs:
        r, s = osd("POST", "/api/saved_objects/visualization/" + viz["id"] + "?overwrite=true",
                   {"attributes": viz["attributes"], "references": viz["references"]})
        print("  " + viz["attributes"]["title"] + ": " + ("OK" if s < 300 else "ERR " + str(s)))

    htp = [
        {"id":"ht-s1-value",        "x":0,  "y":0,  "w":9,  "h":9},
        {"id":"ht-s2-cash",         "x":9,  "y":0,  "w":9,  "h":9},
        {"id":"ht-s3-positions",    "x":18, "y":0,  "w":9,  "h":9},
        {"id":"ht-s4-wins",         "x":27, "y":0,  "w":9,  "h":9},
        {"id":"ht-s5-losses",       "x":36, "y":0,  "w":9,  "h":9},
        {"id":"ht-s6-value-trend",  "x":0,  "y":9,  "w":48, "h":12},
        {"id":"ht-s7-cash-trend",   "x":0,  "y":21, "w":48, "h":12},
        {"id":"ht-s8-trades-symbol","x":0,  "y":33, "w":18, "h":14},
        {"id":"ht-s9-trades-type",  "x":18, "y":33, "w":30, "h":14},
    ]
    refs_ht = [{"name":"panel_"+str(i+1),"type":"visualization","id":p["id"]} for i,p in enumerate(htp)]
    r, s = mkdash("hermes-trading", "Hermes — Trading Bot",
                  "BTC/ETH paper-trading simulation: portfolio value and cash over time, open positions, win/loss record, trade breakdown. Individual trades/snapshots are browsable via Discover on the hermes-agent-trades / hermes-agent-portfolio index patterns.",
                  htp, refs_ht)
    print("Dashboard Hermes Trading Bot: " + str(s))

    print("\n  <OSD>/app/dashboards#/view/nextcloud-stats")
    print("  <OSD>/app/dashboards#/view/paperless-stats")
    print("  <OSD>/app/dashboards#/view/hermes-trading")
