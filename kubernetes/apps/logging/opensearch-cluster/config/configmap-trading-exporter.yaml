---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trading-exporter-script
data:
  export_trading.py: |-
    #!/usr/bin/env python3
    """
    Export the Hermes trading bot's Postgres data to OpenSearch.
    Runs as a CronJob (every 15m) -- indexes a rolled-up "current stats" doc
    to hermes-agent-stats-YYYY.MM.DD, and upserts recent portfolio_snapshots
    and all trades rows into two rolling (non-date-suffixed) indices,
    id-keyed so re-runs update in place instead of piling up duplicates.
    """
    import json
    import os
    import sys
    import ssl
    import base64
    import urllib.request
    import urllib.error
    from datetime import datetime, timezone
    from decimal import Decimal

    import psycopg2
    import psycopg2.extras

    OS_HOST  = os.environ.get("OPENSEARCH_HOST",     "https://opensearch.logging.svc.cluster.local:9200")
    OS_USER  = os.environ.get("OPENSEARCH_USER",     "admin")
    OS_PASS  = os.environ.get("OPENSEARCH_PASSWORD", "")
    TODAY    = datetime.now(timezone.utc).strftime("%Y.%m.%d")
    AUTH     = base64.b64encode(f"{OS_USER}:{OS_PASS}".encode()).decode()

    # Skip TLS verification (operator self-signed cert) -- same as the
    # existing crd-to-opensearch exporter.
    CTX = ssl.create_default_context()
    CTX.check_hostname = False
    CTX.verify_mode    = ssl.CERT_NONE

    def os_bulk(index, docs, id_field=None):
        """Bulk-index documents to OpenSearch. If id_field is set, use that
        doc field as the document _id so re-runs update in place instead of
        accumulating duplicates."""
        if not docs:
            return 0
        body = ""
        for doc in docs:
            action = {"_index": index}
            if id_field:
                action["_id"] = doc[id_field]
            body += json.dumps({"index": action}) + "\n"
            body += json.dumps(doc, default=str) + "\n"
        req = urllib.request.Request(
            f"{OS_HOST}/_bulk",
            data=body.encode(),
            headers={"Content-Type": "application/x-ndjson", "Authorization": f"Basic {AUTH}"},
            method="POST",
        )
        try:
            with urllib.request.urlopen(req, context=CTX) as r:
                resp = json.loads(r.read())
                errors = [i for i in resp.get("items", []) if "error" in i.get("index", {})]
                if errors:
                    print(f"  bulk error (first of {len(errors)}): {errors[0]}", file=sys.stderr)
                return len(docs) - len(errors)
        except Exception as e:
            print(f"  ERROR bulk indexing to {index}: {e}", file=sys.stderr)
            return 0

    def row_to_doc(row, ts_field=None):
        doc = dict(row)
        for k, v in doc.items():
            if isinstance(v, Decimal):
                doc[k] = float(v)
            elif hasattr(v, "isoformat"):
                doc[k] = v.isoformat()
        if ts_field and ts_field in doc:
            doc["@timestamp"] = doc[ts_field]
        return doc

    def main():
        conn = psycopg2.connect(
            host=os.environ["TRADING_DB_HOST"],
            dbname=os.environ["TRADING_DB_NAME"],
            user=os.environ["TRADING_DB_USER"],
            password=os.environ["TRADING_DB_PASSWORD"],
            cursor_factory=psycopg2.extras.RealDictCursor,
            connect_timeout=10,
        )
        try:
            with conn, conn.cursor() as cur:
                # === Current stats doc (one per run, date-suffixed index) ===
                cur.execute("""
                    SELECT cash_eur, total_value_eur, num_open_positions, snapshot_time
                    FROM portfolio_snapshots ORDER BY snapshot_time DESC LIMIT 1
                """)
                latest = cur.fetchone()
                cur.execute("""
                    SELECT
                        count(*) FILTER (WHERE close_reason = 'PROFIT_TARGET') AS wins,
                        count(*) FILTER (WHERE close_reason = 'STOP_LOSS') AS losses
                    FROM positions WHERE status = 'CLOSED'
                """)
                wl = cur.fetchone()

                if latest:
                    stats_doc = row_to_doc(latest, ts_field="snapshot_time")
                    stats_doc["wins"] = wl["wins"]
                    stats_doc["losses"] = wl["losses"]
                    indexed = os_bulk(f"hermes-agent-stats-{TODAY}", [stats_doc])
                    print(f"Indexed {indexed} current-stats doc to hermes-agent-stats-{TODAY}")
                else:
                    print("No portfolio_snapshots rows yet -- skipping current-stats doc")

                # === Rolling portfolio value history (bounded to 30 days --
                # unbounded re-indexing of the full 5-minute-tick history on
                # every 15-minute run would grow without limit) ===
                cur.execute("""
                    SELECT id, snapshot_time, cash_eur, total_value_eur, num_open_positions
                    FROM portfolio_snapshots
                    WHERE snapshot_time > now() - interval '30 days'
                    ORDER BY snapshot_time
                """)
                snapshots = [row_to_doc(r, ts_field="snapshot_time") for r in cur.fetchall()]
                indexed = os_bulk("hermes-agent-portfolio", snapshots, id_field="id")
                print(f"Indexed {indexed}/{len(snapshots)} rows to hermes-agent-portfolio")

                # === Rolling trade ledger (low volume, no bound needed) ===
                cur.execute("""
                    SELECT id, position_id, symbol, side, quantity, price_eur,
                           value_eur, trade_type, executed_at
                    FROM trades ORDER BY executed_at
                """)
                trades = [row_to_doc(r, ts_field="executed_at") for r in cur.fetchall()]
                indexed = os_bulk("hermes-agent-trades", trades, id_field="id")
                print(f"Indexed {indexed}/{len(trades)} rows to hermes-agent-trades")
        finally:
            conn.close()

    if __name__ == "__main__":
        main()
