---
# opensearch-config jobs and CronJobs: setup, export, dashboard, pipeline jobs
# Job pods are identified by the batch.kubernetes.io/job-name label being present.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: opensearch-config-jobs
  namespace: logging
spec:
  endpointSelector:
    matchExpressions:
      - key: batch.kubernetes.io/job-name
        operator: Exists
  ingress: []
  egress:
    # DNS — L7 dns rule required so Cilium learns the IPs behind the toFQDNs
    # entries below (api.pushover.net); otherwise toFQDNs resolves to nothing.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Kubernetes API (crd-to-opensearch reads Trivy/Kubescape CRDs)
    - toEntities:
        - kube-apiserver
    # Trading bot Postgres (trading-to-opensearch, read-only role)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # OpenSearch REST API
    - toEndpoints:
        - matchLabels:
            opensearch.org/opensearch-cluster: opensearch
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
    # OpenSearch Dashboards (dashboard setup jobs)
    - toEndpoints:
        - matchLabels:
            opensearch.cluster.dashboards: opensearch
      toPorts:
        - ports:
            - port: "5601"
              protocol: TCP
    # External alerts (Pushover API)
    - toFQDNs:
        - matchName: "api.pushover.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Alpine package mirror (job.yaml's setup container runs `apk add curl`
    # before the actual setup.sh script) — latent gap, only surfaced once
    # this Job needed to actually rerun.
    - toFQDNs:
        - matchName: "dl-cdn.alpinelinux.org"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
