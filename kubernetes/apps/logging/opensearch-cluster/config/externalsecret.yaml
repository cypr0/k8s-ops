---
# Credentials for Security Analytics setup job
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-config-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: opensearch-config-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENSEARCH_PASSWORD: "{{ .OPENSEARCH_ADMIN_PASSWORD }}"
        PUSHOVER_TOKEN: "{{ .ALERTMANAGER_PUSHOVER_API_TOKEN }}"
        PUSHOVER_USER: "{{ .PUSHOVER_USER_KEY }}"
        # Hermes trading bot stats exporter (read-only role)
        TRADING_DB_PASSWORD: "{{ .TRADING_READONLY_PASSWORD }}"
  dataFrom:
    - extract:
        key: opensearch
    - extract:
        key: pushover
    - extract:
        key: hermes-agent-trading
