---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crd-exporter-script
data:
  export.py: |-
    #!/usr/bin/env python3
    """
    Export Trivy VulnerabilityReports to OpenSearch.
    Runs as a CronJob — indexes to trivy-YYYY.MM.DD.
    """
    import json
    import os
    import sys
    import urllib.request
    import urllib.error
    import ssl
    from datetime import datetime, timezone

    # ── Config ────────────────────────────────────────────────────────────
    OS_HOST  = os.environ.get("OPENSEARCH_HOST",     "https://opensearch.logging.svc.cluster.local:9200")
    OS_USER  = os.environ.get("OPENSEARCH_USER",     "admin")
    OS_PASS  = os.environ.get("OPENSEARCH_PASSWORD", "")
    TODAY    = datetime.now(timezone.utc).strftime("%Y.%m.%d")

    import base64
    AUTH = base64.b64encode(f"{OS_USER}:{OS_PASS}".encode()).decode()

    # Skip TLS verification (operator self-signed cert)
    CTX = ssl.create_default_context()
    CTX.check_hostname = False
    CTX.verify_mode    = ssl.CERT_NONE

    def k8s_get_all(path):
        """Paginate through Kubernetes API results to avoid rate limiting."""
        import time
        token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read()
        ca    = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        ctx   = ssl.create_default_context(cafile=ca)
        all_items = []
        cont = None
        while True:
            sep = "&" if "?" in path else "?"
            url = f"https://kubernetes.default.svc{path}{sep}limit=30"
            if cont:
                url += f"&continue={cont}"
            req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
            try:
                with urllib.request.urlopen(req, context=ctx) as r:
                    data = json.loads(r.read())
            except urllib.error.HTTPError as e:
                if e.code == 404:
                    return []
                if e.code == 429:
                    time.sleep(2)
                    continue
                raise
            all_items.extend(data.get("items", []))
            cont = data.get("metadata", {}).get("continue")
            if not cont:
                break
            time.sleep(0.3)  # Gentle rate limiting
        return all_items

    def os_bulk(index, docs, id_field=None):
        """Bulk-index documents to OpenSearch. If id_field is set, use that
        doc field as the document _id so re-runs update in place instead of
        accumulating duplicates."""
        if not docs:
            return 0
        body = ""
        for doc in docs:
            action = {"_index": index}
            if id_field:
                action["_id"] = doc[id_field]
            body += json.dumps({"index": action}) + "\n"
            body += json.dumps(doc) + "\n"
        req = urllib.request.Request(
            f"{OS_HOST}/_bulk",
            data=body.encode(),
            headers={"Content-Type": "application/x-ndjson", "Authorization": f"Basic {AUTH}"},
            method="POST"
        )
        try:
            with urllib.request.urlopen(req, context=CTX) as r:
                resp = json.loads(r.read())
                errors = [i["index"] for i in resp.get("items", []) if "error" in i.get("index", {})]
                if errors:
                    print(f"  ERROR bulk indexing {len(errors)}/{len(docs)} docs to {index}: "
                          f"{errors[0].get('_id')}: {errors[0].get('error')}", file=sys.stderr)
                return len(docs) - len(errors)
        except Exception as e:
            print(f"  ERROR bulk indexing: {e}", file=sys.stderr)
            return 0

    # ── Trivy VulnerabilityReports ────────────────────────────────────────
    print("=== Trivy VulnerabilityReports ===")
    index  = f"trivy-{TODAY}"
    docs   = []
    ts     = datetime.now(timezone.utc).isoformat()

    try:
        for item in k8s_get_all("/apis/aquasecurity.github.io/v1alpha1/vulnerabilityreports"):
            meta    = item.get("metadata", {})
            report  = item.get("report", {})
            ns      = meta.get("namespace", "")
            image   = report.get("artifact", {}).get("tag", "")
            repo    = report.get("artifact", {}).get("repository", "")
            for vuln in report.get("vulnerabilities", []):
                sev = vuln.get("severity", "UNKNOWN")
                if sev not in ("CRITICAL", "HIGH"):
                    continue
                docs.append({
                    "@timestamp":       ts,
                    "namespace":        ns,
                    "resource":         meta.get("name", ""),
                    "image":            f"{repo}:{image}",
                    "vulnerabilityID":  vuln.get("vulnerabilityID", ""),
                    "severity":         sev,
                    "title":            vuln.get("title", ""),
                    "fixedVersion":     vuln.get("fixedVersion", ""),
                    "installedVersion": vuln.get("installedVersion", ""),
                    "source":           "trivy"
                })
        indexed = os_bulk(index, docs)
        print(f"  Indexed {indexed}/{len(docs)} CRITICAL+HIGH CVEs to {index}")
    except Exception as e:
        print(f"  Trivy export error: {e}", file=sys.stderr)

    # ── Trivy ConfigAuditReports ──────────────────────────────────────────
    print("=== Trivy ConfigAuditReports ===")
    audit_docs = []
    try:
        for item in k8s_get_all("/apis/aquasecurity.github.io/v1alpha1/configauditreports"):
            meta   = item.get("metadata", {})
            report = item.get("report", {})
            ns     = meta.get("namespace", "")
            for check in report.get("checks", []):
                if check.get("success", True):
                    continue
                sev = check.get("severity", "LOW")
                if sev not in ("CRITICAL", "HIGH", "MEDIUM"):
                    continue
                audit_docs.append({
                    "@timestamp": ts,
                    "namespace":  ns,
                    "resource":   meta.get("name", ""),
                    "checkID":    check.get("checkID", ""),
                    "severity":   sev,
                    "title":      check.get("title", ""),
                    "category":   check.get("category", ""),
                    "source":     "trivy-config"
                })
        indexed = os_bulk(f"trivy-{TODAY}", audit_docs)
        print(f"  Indexed {indexed}/{len(audit_docs)} config audit findings")
    except Exception as e:
        print(f"  Trivy config audit error: {e}", file=sys.stderr)

    # ── Velero Backups ───────────────────────────────────────────────────
    # Single rolling index (not date-suffixed): each backup is indexed under
    # its own name as _id, so re-runs update phase/errors in place instead
    # of piling up duplicates across daily indices. History comes for free
    # from Velero's own GFS retention (14d/90d/365d).
    print("=== Velero Backups ===")
    vb_docs = []
    try:
        for item in k8s_get_all("/apis/velero.io/v1/namespaces/velero/backups"):
            meta   = item.get("metadata", {})
            status = item.get("status", {})
            labels = meta.get("labels", {})
            progress = status.get("progress", {}) or {}
            vb_docs.append({
                "@timestamp":         status.get("startTimestamp", ts),
                "name":               meta.get("name", ""),
                "schedule":           labels.get("velero.io/schedule-name", "manual"),
                "phase":              status.get("phase", "Unknown"),
                "startTimestamp":     status.get("startTimestamp") or None,
                # OpenSearch dynamically maps this field as strict `date`;
                # backups that never finished (Failed/InProgress) have this
                # as "" in the CR, which OpenSearch's bulk API rejects
                # silently (only the item's error count changes, no log) —
                # must be null, not an empty string, for unfinished backups.
                "completionTimestamp": status.get("completionTimestamp") or None,
                "expiration":         status.get("expiration") or None,
                "errors":             status.get("errors", 0),
                "warnings":           status.get("warnings", 0),
                "itemsBackedUp":      progress.get("itemsBackedUp", 0),
                "totalItems":         progress.get("totalItems", 0),
                "failureReason":      status.get("failureReason", ""),
                "source":             "velero-backup",
            })
        indexed = os_bulk("velero-backups", vb_docs, id_field="name")
        print(f"  Indexed {indexed}/{len(vb_docs)} Velero backups")
    except Exception as e:
        print(f"  Velero backup export error: {e}", file=sys.stderr)

    print("=== CRD export complete ===")
    print(f"  Trivy CVEs: {len(docs) + len(audit_docs)}, Velero backups: {len(vb_docs)}")
