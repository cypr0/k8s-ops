---
apiVersion: batch/v1
kind: Job
metadata:
  name: proxmox-dashboard-setup
  annotations:
    dashboard-version: "3"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: dashboard
          image: python:3.14-alpine
          command:
            - "python3"
            - "/scripts/create_proxmox_dashboard.py"
          env:
            - name: OSD_HOST
              value: "http://opensearch-dashboards.logging.svc.cluster.local:5601"
            - name: OSD_USER
              value: "admin"
            - name: OSD_PASS
              valueFrom:
                secretKeyRef:
                  name: opensearch-config-credentials
                  key: OPENSEARCH_PASSWORD
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 65534
            capabilities:
              drop:
                - "ALL"
      volumes:
        - name: scripts
          configMap:
            name: proxmox-dashboard-script
            defaultMode: 0755
