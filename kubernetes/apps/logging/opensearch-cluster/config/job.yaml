---
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-config-setup
  annotations:
    # Re-run by changing this value
    setup-version: "1"
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      containers:
        - name: setup
          image: python:3.14-alpine
          command:
            - "/bin/sh"
            - "-c"
            - "apk add -q curl && /bin/sh /scripts/setup.sh"
          env:
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opensearch-config-credentials
                  key: OPENSEARCH_PASSWORD
            - name: PUSHOVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: opensearch-config-credentials
                  key: PUSHOVER_TOKEN
            - name: PUSHOVER_USER
              valueFrom:
                secretKeyRef:
                  name: opensearch-config-credentials
                  key: PUSHOVER_USER
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - "ALL"
      volumes:
        - name: scripts
          configMap:
            name: opensearch-config-setup
            defaultMode: 0755
