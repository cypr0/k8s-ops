---
apiVersion: opensearch.org/v1
kind: OpenSearchCluster
metadata:
  name: opensearch
spec:
  general:
    # renovate: datasource=docker depName=opensearchproject/opensearch
    version: "3.7.0"
    serviceName: opensearch
    httpPort: 9200
    setVMMaxMapCount: true
    drainDataNodes: true

  # ── Security & TLS ──────────────────────────────────────────────────
  security:
    tls:
      transport:
        generate: true
        perNode: false
      http:
        generate: true
    config:
      adminCredentialsSecret:
        name: opensearch-admin-credentials
      securityConfigSecret:
        name: opensearch-security-config

  # ── 3-node cluster: proper quorum, Bootstrap → Masters transition works ──
  nodePools:
    - component: masters
      replicas: 3
      diskSize: "20Gi"
      roles:
        - cluster_manager
        - data
        - ingest
      resources:
        requests:
          cpu: 200m
          memory: 8Gi
        limits:
          memory: 8Gi
      jvm: "-Xmx4g -Xms4g"
      persistence:
        pvc:
          storageClass: zfs-nfs
          accessModes:
            - ReadWriteOnce
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    opensearch.cluster.masters: opensearch
                topologyKey: kubernetes.io/hostname

  # ── Dashboards ──────────────────────────────────────────────────────
  dashboards:
    enable: true
    # renovate: datasource=docker depName=opensearchproject/opensearch-dashboards
    version: "3.6.0"
    replicas: 1
    opensearchCredentialsSecret:
      name: opensearch-dashboards-credentials
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    additionalConfig:
      opensearch_security.auth.type: "openid"
      opensearch_security.openid.connect_url: "https://id.${SECRET_DOMAIN}/application/o/opensearch/.well-known/openid-configuration"
      opensearch_security.openid.scope: "openid profile email"
      opensearch_security.openid.base_redirect_url: "https://logs.${SECRET_DOMAIN}"
      opensearch_security.openid.logout_url: "https://id.${SECRET_DOMAIN}/application/o/opensearch/end-session/"
      opensearch_security.cookie.secure: "true"
      opensearch_security.multitenancy.enabled: "false"
      opensearch_security.openid.client_id: "$${OPENSEARCH_SECURITY_OPENID_CLIENT_ID}"
      opensearch_security.openid.client_secret: "$${OPENSEARCH_SECURITY_OPENID_CLIENT_SECRET}"
      opensearch_security.cookie.password: "$${OPENSEARCH_SECURITY_COOKIE_PASSWORD}"
    env:
      - name: OPENSEARCH_SECURITY_COOKIE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: opensearch-dashboards-oidc
            key: OPENSEARCH_SECURITY_COOKIE_PASSWORD
      - name: OPENSEARCH_SECURITY_OPENID_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: opensearch-dashboards-oidc
            key: OPENSEARCH_SECURITY_OPENID_CLIENT_ID
      - name: OPENSEARCH_SECURITY_OPENID_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: opensearch-dashboards-oidc
            key: OPENSEARCH_SECURITY_OPENID_CLIENT_SECRET
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
