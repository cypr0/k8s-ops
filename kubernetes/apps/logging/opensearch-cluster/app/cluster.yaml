---
# yaml-language-server: $schema=https://raw.githubusercontent.com/opensearch-project/opensearch-k8s-operator/main/opensearch-operator/config/crd/bases/opensearch.org_opensearchclusters.yaml
apiVersion: opensearch.org/v1
kind: OpenSearchCluster
metadata:
  name: opensearch
spec:
  general:
    # renovate: datasource=docker depName=opensearchproject/opensearch
    version: "2.19.2"
    serviceName: opensearch
    httpPort: 9200
    # Single-node homelab
    setVMMaxMapCount: true
    additionalConfig:
      discovery.type: single-node

  # ── Security & TLS ──────────────────────────────────────────────────
  security:
    ssl:
      transport:
        generate: true
        perNode: false
        duration: "8760h"
      http:
        generate: true
        duration: "8760h"
    adminCredentialsSecret:
      name: opensearch-admin-credentials
    config:
      securityConfigSecret:
        name: opensearch-security-config
      adminSecret:
        name: opensearch-admin-credentials

  # ── Node pool: single data+manager node ────────────────────────────
  nodePools:
    - component: masters
      replicas: 1
      diskSize: "50Gi"
      roles:
        - cluster_manager
        - data
        - ingest
      resources:
        requests:
          cpu: 500m
          memory: 4Gi
        limits:
          memory: 4Gi
      jvm: "-Xmx2g -Xms2g"
      persistence:
        pvc:
          storageClass: zfs-nfs
          accessModes:
            - ReadWriteOnce
      podSecurityContext:
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist

  # ── Dashboards ──────────────────────────────────────────────────────
  dashboards:
    enable: true
    # renovate: datasource=docker depName=opensearchproject/opensearch-dashboards
    version: "2.19.2"
    replicas: 1
    opensearchCredentialsSecret:
      name: opensearch-dashboards-credentials
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    additionalConfig:
      # Authentik OIDC — non-secret values only
      opensearch_security.auth.type: "openid"
      opensearch_security.openid.connect_url: "https://id.${SECRET_DOMAIN}/application/o/opensearch/.well-known/openid-configuration"
      opensearch_security.openid.scope: "openid profile email"
      opensearch_security.openid.base_redirect_url: "https://logs.${SECRET_DOMAIN}"
      opensearch_security.openid.logout_url: "https://id.${SECRET_DOMAIN}/application/o/opensearch/end-session/"
      opensearch_security.cookie.secure: "true"
      opensearch_security.multitenancy.enabled: "false"
    env:
      - name: OPENSEARCH_SECURITY_COOKIE_PASSWORD
        valueFrom:
          secretKeyRef:
            name: opensearch-dashboards-oidc
            key: OPENSEARCH_SECURITY_COOKIE_PASSWORD
      - name: OPENSEARCH_SECURITY_OPENID_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: opensearch-dashboards-oidc
            key: OPENSEARCH_SECURITY_OPENID_CLIENT_ID
      - name: OPENSEARCH_SECURITY_OPENID_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: opensearch-dashboards-oidc
            key: OPENSEARCH_SECURITY_OPENID_CLIENT_SECRET
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
