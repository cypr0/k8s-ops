---
# Admin credentials — operator hashes the password automatically
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-admin-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: opensearch-admin-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "admin"
        password: "{{ .OPENSEARCH_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: opensearch
---
# Dashboards service account — operator hashes automatically
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-dashboards-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: opensearch-dashboards-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "kibanaserver"
        password: "{{ .OPENSEARCH_DASHBOARDS_PASSWORD }}"
  dataFrom:
    - extract:
        key: opensearch
---
# OIDC + cookie secrets for Dashboards
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-dashboards-oidc
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: opensearch-dashboards-oidc
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENSEARCH_SECURITY_COOKIE_PASSWORD: "{{ .OPENSEARCH_COOKIE_SECRET }}"
        OPENSEARCH_SECURITY_OPENID_CLIENT_ID: "{{ .OPENSEARCH_OIDC_CLIENT_ID }}"
        OPENSEARCH_SECURITY_OPENID_CLIENT_SECRET: "{{ .OPENSEARCH_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: opensearch
