---
# OpenSearch Security Plugin config — OIDC auth backend
# This configures HOW OpenSearch validates OIDC tokens from Dashboards
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-security-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: opensearch-security-config
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        config.yml: |
          _meta:
            type: "config"
            config_version: 2
          config:
            dynamic:
              authc:
                # Internal users (kibanaserver, admin)
                basic_internal_auth_domain:
                  description: "Internal users"
                  http_enabled: true
                  transport_enabled: true
                  order: 0
                  http_authenticator:
                    type: basic
                    challenge: false
                  authentication_backend:
                    type: intern

                # Authentik OIDC
                openid_auth_domain:
                  description: "Authentik OIDC"
                  http_enabled: true
                  transport_enabled: false
                  order: 1
                  http_authenticator:
                    type: openid
                    challenge: false
                    config:
                      subject_key: preferred_username
                      roles_key: groups
                      openid_connect_url: "https://id.${SECRET_DOMAIN}/application/o/opensearch/.well-known/openid-configuration"
                  authentication_backend:
                    type: noop
  dataFrom:
    - extract:
        key: opensearch
