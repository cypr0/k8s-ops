---
# OpenSearch masters: REST API + inter-node transport
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: opensearch-masters
  namespace: logging
spec:
  endpointSelector:
    matchLabels:
      opensearch.org/opensearch-cluster: opensearch
  ingress:
    # Inter-node transport (9300) — only between OpenSearch peers
    - fromEndpoints:
        - matchLabels:
            opensearch.org/opensearch-cluster: opensearch
      toPorts:
        - ports:
            - port: "9300"
              protocol: TCP
    # REST API from logging namespace (fluent-bit, operator, jobs)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": logging
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
    # REST API from monitoring (alloy, gatus)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
    # REST API from security (falcosidekick, trivy, kubescape)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": security
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Kubernetes API (operator lifecycle management)
    - toEntities:
        - kube-apiserver
    # Inter-node transport
    - toEndpoints:
        - matchLabels:
            opensearch.org/opensearch-cluster: opensearch
      toPorts:
        - ports:
            - port: "9300"
              protocol: TCP
---
# OpenSearch Dashboards: ingress from Envoy + egress to OpenSearch + OIDC
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: opensearch-dashboards
  namespace: logging
spec:
  endpointSelector:
    matchLabels:
      opensearch.cluster.dashboards: opensearch
  ingress:
    # External access via Envoy Gateway (logs.cisotop.de)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "5601"
              protocol: TCP
    # Health checks from gatus
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: gatus
      toPorts:
        - ports:
            - port: "5601"
              protocol: TCP
    # Dashboard setup jobs (logging namespace)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": logging
      toPorts:
        - ports:
            - port: "5601"
              protocol: TCP
  egress:
    # DNS — MUST include the L7 dns rule so Cilium's DNS proxy can observe the
    # answers for *.cisotop.de and populate the toFQDNs IP set below. Without
    # this matchPattern, toFQDNs never resolves any IP and the OIDC egress to
    # Authentik (id.cisotop.de) is dropped, crash-looping the dashboards pod.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # OpenSearch REST API
    - toEndpoints:
        - matchLabels:
            opensearch.org/opensearch-cluster: opensearch
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
    # Authentik OIDC (discovery / token / JWKS) for id.cisotop.de. A hostAlias
    # on the dashboards pod points id.cisotop.de at the envoy-external ClusterIP,
    # so these server-side calls go in-cluster to the Envoy proxy (which routes
    # to authentik) instead of the public Cloudflare hairpin. Enforced post-DNAT
    # -> the Envoy data-plane container port is 10443 (service 443 -> 10443).
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
