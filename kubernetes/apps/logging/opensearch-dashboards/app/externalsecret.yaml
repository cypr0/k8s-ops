---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-dashboards-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: opensearch-dashboards-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Required by opensearchAccount.secret in the chart
        username: "kibanaserver"
        password: "{{ .OPENSEARCH_DASHBOARDS_PASSWORD }}"
        # Used by extraEnvs for Dashboards config
        OPENSEARCH_DASHBOARDS_PASSWORD: "{{ .OPENSEARCH_DASHBOARDS_PASSWORD }}"
        OPENSEARCH_OIDC_CLIENT_ID: "{{ .OPENSEARCH_OIDC_CLIENT_ID }}"
        OPENSEARCH_OIDC_CLIENT_SECRET: "{{ .OPENSEARCH_OIDC_CLIENT_SECRET }}"
        OPENSEARCH_COOKIE_SECRET: "{{ .OPENSEARCH_COOKIE_SECRET }}"
  dataFrom:
    - extract:
        key: opensearch
