---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: opensearch-dashboards
spec:
  interval: 1h
  chart:
    spec:
      chart: opensearch-dashboards
      version: "3.6.0"
      sourceRef:
        kind: HelmRepository
        name: opensearch
        namespace: logging
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    replicaCount: 1

    # OpenSearch runs HTTP (no TLS on internal API)
    opensearchHosts: "http://opensearch-cluster-master:9200"

    image:
      tag: "3.6.0"

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]

    # Workers only
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist

    opensearchAccount:
      secret: opensearch-dashboards-secret
      keyPassphrase:
        enabled: false

    extraEnvs:
      - name: OPENSEARCH_DASHBOARDS_PASSWORD
        valueFrom:
          secretKeyRef:
            name: opensearch-dashboards-secret
            key: OPENSEARCH_DASHBOARDS_PASSWORD
      - name: OPENSEARCH_OIDC_CLIENT_ID
        valueFrom:
          secretKeyRef:
            name: opensearch-dashboards-secret
            key: OPENSEARCH_OIDC_CLIENT_ID
      - name: OPENSEARCH_OIDC_CLIENT_SECRET
        valueFrom:
          secretKeyRef:
            name: opensearch-dashboards-secret
            key: OPENSEARCH_OIDC_CLIENT_SECRET
      - name: OPENSEARCH_COOKIE_SECRET
        valueFrom:
          secretKeyRef:
            name: opensearch-dashboards-secret
            key: OPENSEARCH_COOKIE_SECRET

    config:
      opensearch_dashboards.yml: |
        server.name: opensearch-dashboards
        server.host: "0.0.0.0"
        opensearch.hosts: ["http://opensearch-cluster-master:9200"]
        opensearch.username: "kibanaserver"
        opensearch.password: "$${OPENSEARCH_DASHBOARDS_PASSWORD}"
        opensearch.ssl.verificationMode: none

        # Authentik OIDC
        # ${SECRET_DOMAIN} → substituted by Flux
        # $${...} → escaped so Flux passes them through as ${...} for Dashboards runtime
        opensearch_security.auth.type: "openid"
        opensearch_security.openid.connect_url: "https://id.${SECRET_DOMAIN}/application/o/opensearch/.well-known/openid-configuration"
        opensearch_security.openid.client_id: "$${OPENSEARCH_OIDC_CLIENT_ID}"
        opensearch_security.openid.client_secret: "$${OPENSEARCH_OIDC_CLIENT_SECRET}"
        opensearch_security.openid.scope: "openid profile email"
        opensearch_security.openid.base_redirect_url: "https://logs.${SECRET_DOMAIN}"
        opensearch_security.openid.logout_url: "https://id.${SECRET_DOMAIN}/application/o/opensearch/end-session/"
        opensearch_security.cookie.secure: "true"
        opensearch_security.cookie.password: "$${OPENSEARCH_COOKIE_SECRET}"

        opensearch_security.multitenancy.enabled: false
        opensearch_security.readonly_mode.roles: ["kibana_read_only"]

        # Telemetry off
        telemetry.enabled: false
        telemetry.optIn: false

    annotations:
      secret.reloader.stakater.com/reload: opensearch-dashboards-secret
