---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opnsense-dashboards-script
data:
  create_opnsense_dashboards.py: |
    import json, os, time, base64, urllib.request, urllib.error

    OSD      = os.environ.get("OSD_HOST", "http://opensearch-dashboards.logging.svc.cluster.local:5601")
    OSD_USER = os.environ.get("OSD_USER", "admin")
    OSD_PASS = os.environ.get("OSD_PASS", "")
    _b64     = base64.b64encode((OSD_USER + ":" + OSD_PASS).encode()).decode()
    HEADERS  = {"Content-Type": "application/json", "osd-xsrf": "true", "Authorization": "Basic " + _b64}

    def osd(method, path, body=None):
        data = json.dumps(body).encode() if body else None
        req  = urllib.request.Request(OSD + path, data=data, headers=HEADERS, method=method)
        try:
            with urllib.request.urlopen(req, timeout=30) as r:
                return json.loads(r.read()), r.status
        except urllib.error.HTTPError as e:
            try:    return json.loads(e.read()), e.code
            except: return {}, e.code

    print("Waiting for Dashboards...")
    for _ in range(30):
        try:
            r, s = osd("GET", "/api/status")
            if s == 200 and r.get("status", {}).get("overall", {}).get("state") == "green":
                print("Ready."); break
        except: pass
        time.sleep(10)

    IDX = "opnsense-idx"

    print("Creating index pattern for opnsense-*...")
    r, s = osd("POST", "/api/saved_objects/index-pattern/" + IDX + "?overwrite=true", {
        "attributes": {"title": "opnsense-*", "timeFieldName": "@timestamp", "fields": "[]"}
    })
    print("  " + str(s))

    METRIC_P = {
        "addTooltip": True, "addLegend": False, "type": "gauge",
        "gauge": {
            "verticalSplit": False, "extendRange": True, "percentageMode": False,
            "gaugeType": "Metric", "gaugeColorMode": "None",
            "colorsRange": [{"from": 0, "to": 10000000}], "invertColors": False,
            "labels": {"show": True, "color": "black"},
            "scale": {"show": False, "labels": False, "color": "#333"},
            "type": "simple",
            "style": {"bgFill": "#000", "bgColor": False, "labelColor": False, "subText": "", "fontSize": 60}
        }
    }

    def v(vid, title, vis_type, params, aggs, src_filter=None):
        flt = []
        if src_filter:
            flt.extend(src_filter)
        return {
            "type": "visualization", "id": vid,
            "attributes": {
                "title": title,
                "visState": json.dumps({"title": title, "type": vis_type, "params": params, "aggs": aggs}),
                "uiStateJSON": "{}",
                "description": "",
                "kibanaSavedObjectMeta": {"searchSourceJSON": json.dumps({
                    "index": IDX,
                    "query": {"bool": {"filter": flt, "must": [], "must_not": [], "should": []}},
                    "filter": []
                })}
            },
            "references": [{"id": IDX, "name": "indexPatternId", "type": "index-pattern"}]
        }

    def pie_p(): return {"type":"pie","addTooltip":True,"addLegend":True,"legendPosition":"right","isDonut":True,"labels":{"show":True,"values":True,"last_level":True,"truncate":100}}
    def hbar_p(): return {"type":"histogram","grid":{"categoryLines":False},"categoryAxes":[{"id":"CategoryAxis-1","type":"category","position":"left","show":True,"style":{},"scale":{"type":"linear"},"labels":{"show":True,"rotate":0,"filter":True,"truncate":200},"title":{}}],"valueAxes":[{"id":"ValueAxis-1","name":"LeftAxis-1","type":"value","position":"bottom","show":True,"style":{},"scale":{"type":"linear","mode":"normal"},"labels":{"show":True,"rotate":0,"filter":False,"truncate":100},"title":{"text":"Count"}}],"seriesParams":[{"show":True,"type":"histogram","mode":"stacked","data":{"label":"Count","id":"1"},"valueAxis":"ValueAxis-1","drawLinesBetweenPoints":True,"lineWidth":2,"showCircles":True}],"addTooltip":True,"addLegend":True,"legendPosition":"right","times":[],"addTimeMarker":False,"truncateLegend":True,"maxLegendLines":1,"distinctColors":False}
    def line_p(): return {"type":"line","grid":{"categoryLines":False},"categoryAxes":[{"id":"CategoryAxis-1","type":"category","position":"bottom","show":True,"style":{},"scale":{"type":"linear"},"labels":{"show":True,"filter":True,"truncate":100},"title":{}}],"valueAxes":[{"id":"ValueAxis-1","name":"LeftAxis-1","type":"value","position":"left","show":True,"style":{},"scale":{"type":"linear","mode":"normal"},"labels":{"show":True,"rotate":0,"filter":False,"truncate":100},"title":{"text":"Count"}}],"seriesParams":[{"show":True,"type":"line","mode":"normal","data":{"label":"Events","id":"1"},"drawLinesBetweenPoints":True,"lineWidth":2,"showCircles":True,"interpolate":"linear","valueAxis":"ValueAxis-1"}],"addTooltip":True,"addLegend":True,"legendPosition":"right","times":[],"addTimeMarker":False}
    def count_agg(): return [{"id":"1","enabled":True,"type":"count","schema":"metric","params":{}}]
    def terms_agg(field, size=15): return {"id":"2","enabled":True,"type":"terms","schema":"segment","params":{"field":field,"size":size,"order":"desc","orderBy":"1","otherBucket":False,"missingBucket":False}}
    def date_agg(): return {"id":"2","enabled":True,"type":"date_histogram","schema":"segment","params":{"field":"@timestamp","useNormalizedEsInterval":True,"interval":"auto","drop_partials":False,"min_doc_count":1,"extended_bounds":{}}}

    # ════════════════════════════════════════════════════════════════════════
    # DASHBOARD A — OPNsense Firewall Traffic
    # ════════════════════════════════════════════════════════════════════════
    fw_filter = [{"term": {"ident": "filterlog"}}]

    fw_vizs = [
        v("fw-v1-total",    "🔥 Total FW Events",     "metric", METRIC_P, count_agg(), fw_filter),
        v("fw-v2-blocked",  "🚫 Blocked",              "metric", METRIC_P, count_agg(), fw_filter + [{"term":{"fw_action":"block"}}]),
        v("fw-v3-passed",   "✅ Passed",               "metric", METRIC_P, count_agg(), fw_filter + [{"term":{"fw_action":"pass"}}]),
        v("fw-v4-inbound",  "⬇️ Inbound",              "metric", METRIC_P, count_agg(), fw_filter + [{"term":{"fw_direction":"in"}}]),

        v("fw-v5-timeline", "Traffic Timeline", "line", line_p(),
          count_agg() + [date_agg(), {"id":"3","enabled":True,"type":"terms","schema":"group","params":{"field":"fw_action_category.keyword","size":3,"order":"desc","orderBy":"1"}}],
          fw_filter),

        v("fw-v6-action",   "Action Distribution",   "pie", pie_p(),
          count_agg() + [terms_agg("fw_action_category.keyword")], fw_filter),

        v("fw-v7-proto",    "Protocol Distribution", "pie", pie_p(),
          count_agg() + [terms_agg("fw_protocol.keyword", 10)], fw_filter),

        v("fw-v8-top-src",  "Top 15 Source IPs (Blocked)", "horizontal_bar", hbar_p(),
          count_agg() + [terms_agg("src_ip.keyword", 15)],
          fw_filter + [{"term":{"fw_action":"block"}}]),

        v("fw-v9-top-dport","Top 15 Destination Ports (Blocked)", "horizontal_bar", hbar_p(),
          count_agg() + [terms_agg("dst_port", 15)],
          fw_filter + [{"term":{"fw_action":"block"}}]),

        v("fw-v10-iface",   "Traffic by Interface", "horizontal_bar", hbar_p(),
          count_agg() + [terms_agg("fw_interface_name.keyword", 10)], fw_filter),
    ]

    print("\nCreating Firewall Traffic visualizations...")
    for viz in fw_vizs:
        r, s = osd("POST", "/api/saved_objects/" + viz["type"] + "/" + viz["id"] + "?overwrite=true",
                   {"attributes": viz["attributes"], "references": viz.get("references", [])})
        ok = "OK" if s < 300 else ("ERR " + str(s) + ": " + str(r.get("message","?"))[:60])
        print("  " + viz["attributes"]["title"] + ": " + ok)

    fw_panels = [
        {"id":"fw-v1-total",    "x":0,  "y":0,  "w":12, "h":9},
        {"id":"fw-v2-blocked",  "x":12, "y":0,  "w":12, "h":9},
        {"id":"fw-v3-passed",   "x":24, "y":0,  "w":12, "h":9},
        {"id":"fw-v4-inbound",  "x":36, "y":0,  "w":12, "h":9},
        {"id":"fw-v5-timeline", "x":0,  "y":9,  "w":48, "h":12},
        {"id":"fw-v6-action",   "x":0,  "y":21, "w":16, "h":12},
        {"id":"fw-v7-proto",    "x":16, "y":21, "w":16, "h":12},
        {"id":"fw-v10-iface",   "x":32, "y":21, "w":16, "h":12},
        {"id":"fw-v8-top-src",  "x":0,  "y":33, "w":24, "h":14},
        {"id":"fw-v9-top-dport","x":24, "y":33, "w":24, "h":14},
    ]

    p_json, refs = [], []
    for i, p in enumerate(fw_panels):
        pid = "panel_" + str(i+1)
        p_json.append({"version":"3.6.0","gridData":{"x":p["x"],"y":p["y"],"w":p["w"],"h":p["h"],"i":str(i+1)},"panelIndex":str(i+1),"embeddableConfig":{},"panelRefName":pid})
        refs.append({"name":pid,"type":"visualization","id":p["id"]})

    r, s = osd("POST", "/api/saved_objects/dashboard/opnsense-firewall?overwrite=true", {
        "attributes": {
            "title": "OPNsense — Firewall Traffic",
            "description": "Firewall rule hits: blocked vs allowed, top sources, protocols and ports.",
            "panelsJSON": json.dumps(p_json),
            "optionsJSON": json.dumps({"useMargins":True,"syncColors":False,"hidePanelTitles":False}),
            "version": 1, "timeRestore": False,
            "kibanaSavedObjectMeta": {"searchSourceJSON": json.dumps({"query":{"match_all":{}},"filter":[]})}
        },
        "references": refs
    })
    print("  Dashboard Firewall: " + str(s))

    # ════════════════════════════════════════════════════════════════════════
    # DASHBOARD B — Suricata IDS Alerts (uses suricata-* index)
    # ════════════════════════════════════════════════════════════════════════
    SURICATA_IDX = "suricata-idx"
    print("\nCreating index pattern for suricata-*...")
    r, s = osd("POST", "/api/saved_objects/index-pattern/" + SURICATA_IDX + "?overwrite=true", {
        "attributes": {"title": "suricata-*", "timeFieldName": "@timestamp", "fields": "[]"}
    })
    print("  Index pattern: " + str(s))

    # Suricata Eve-JSON uses nested alert.* fields
    ids_filter = [{"term": {"event_type": "alert"}}]

    def sv(vid, title, vis_type, params, aggs, flt=None):
        """Create visualization for suricata-* index"""
        return {
            "type": "visualization", "id": vid,
            "attributes": {
                "title": title,
                "visState": json.dumps({"title": title, "type": vis_type, "params": params, "aggs": aggs}),
                "uiStateJSON": "{}",
                "description": "",
                "kibanaSavedObjectMeta": {"searchSourceJSON": json.dumps({
                    "index": SURICATA_IDX,
                    "query": {"bool": {"filter": flt or [], "must": [], "must_not": [], "should": []}},
                    "filter": []
                })}
            },
            "references": [{"id": SURICATA_IDX, "name": "indexPatternId", "type": "index-pattern"}]
        }

    ids_vizs = [
        sv("ids-v1-total",    "🚨 Total Alerts",          "metric", METRIC_P, count_agg(), ids_filter),
        sv("ids-v2-sev1",     "🔴 Severity 1 (Critical)", "metric", METRIC_P, count_agg(), ids_filter + [{"term":{"alert.severity":1}}]),
        sv("ids-v3-sev2",     "🟠 Severity 2 (High)",     "metric", METRIC_P, count_agg(), ids_filter + [{"term":{"alert.severity":2}}]),
        sv("ids-v4-blocked",  "🛡️ Blocked by IDS",        "metric", METRIC_P, count_agg(), ids_filter + [{"term":{"alert.action.keyword":"blocked"}}]),

        sv("ids-v5-timeline", "Alert Timeline by Severity", "line", line_p(),
          count_agg() + [date_agg(), {"id":"3","enabled":True,"type":"terms","schema":"group","params":{"field":"alert.severity","size":4,"order":"desc","orderBy":"1"}}],
          ids_filter),

        sv("ids-v6-category", "Top Alert Categories", "horizontal_bar", hbar_p(),
          count_agg() + [terms_agg("alert.category.keyword", 15)], ids_filter),

        sv("ids-v7-sigs",     "Top Signatures", "horizontal_bar", hbar_p(),
          count_agg() + [terms_agg("alert.signature.keyword", 15)], ids_filter),

        sv("ids-v8-src-ips",  "Top Source IPs", "horizontal_bar", hbar_p(),
          count_agg() + [terms_agg("src_ip.keyword", 15)], ids_filter),

        sv("ids-v9-sev-dist", "Severity Distribution", "pie", pie_p(),
          count_agg() + [terms_agg("alert.severity", 5)], ids_filter),
    ]

    print("\nCreating Suricata IDS visualizations...")
    for viz in ids_vizs:
        r, s = osd("POST", "/api/saved_objects/" + viz["type"] + "/" + viz["id"] + "?overwrite=true",
                   {"attributes": viz["attributes"], "references": viz.get("references", [])})
        ok = "OK" if s < 300 else ("ERR " + str(s) + ": " + str(r.get("message","?"))[:60])
        print("  " + viz["attributes"]["title"] + ": " + ok)

    ids_panels = [
        {"id":"ids-v1-total",    "x":0,  "y":0,  "w":12, "h":9},
        {"id":"ids-v2-sev1",     "x":12, "y":0,  "w":12, "h":9},
        {"id":"ids-v3-sev2",     "x":24, "y":0,  "w":12, "h":9},
        {"id":"ids-v4-blocked",  "x":36, "y":0,  "w":12, "h":9},
        {"id":"ids-v5-timeline", "x":0,  "y":9,  "w":48, "h":12},
        {"id":"ids-v6-category", "x":0,  "y":21, "w":32, "h":14},
        {"id":"ids-v9-sev-dist", "x":32, "y":21, "w":16, "h":14},
        {"id":"ids-v7-sigs",     "x":0,  "y":35, "w":24, "h":14},
        {"id":"ids-v8-src-ips",  "x":24, "y":35, "w":24, "h":14},
    ]

    p_json2, refs2 = [], []
    for i, p in enumerate(ids_panels):
        pid = "panel_" + str(i+1)
        p_json2.append({"version":"3.6.0","gridData":{"x":p["x"],"y":p["y"],"w":p["w"],"h":p["h"],"i":str(i+1)},"panelIndex":str(i+1),"embeddableConfig":{},"panelRefName":pid})
        refs2.append({"name":pid,"type":"visualization","id":p["id"]})

    r, s = osd("POST", "/api/saved_objects/dashboard/opnsense-suricata?overwrite=true", {
        "attributes": {
            "title": "OPNsense — Suricata IDS Alerts",
            "description": "Intrusion Detection alerts from Suricata: signatures, categories, severity and source IPs.",
            "panelsJSON": json.dumps(p_json2),
            "optionsJSON": json.dumps({"useMargins":True,"syncColors":False,"hidePanelTitles":False}),
            "version": 1, "timeRestore": False,
            "kibanaSavedObjectMeta": {"searchSourceJSON": json.dumps({"query":{"match_all":{}},"filter":[]})}
        },
        "references": refs2
    })
    print("  Dashboard Suricata: " + str(s))
    print("\n=== OPNsense Dashboards ready ===")
    print("  Firewall: <OSD>/app/dashboards#/view/opnsense-firewall")
    print("  Suricata: <OSD>/app/dashboards#/view/opnsense-suricata")
