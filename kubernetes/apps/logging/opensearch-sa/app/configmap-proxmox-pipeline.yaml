---
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxmox-pipeline-script
data:
  setup_pipeline.py: |
    import json, os, time, base64, ssl, urllib.request, urllib.error

    OS   = "https://opensearch.logging.svc.cluster.local:9200"
    PASS = os.environ.get("OPENSEARCH_PASSWORD", "")
    AUTH = base64.b64encode(("admin:" + PASS).encode()).decode()
    CTX  = ssl.create_default_context()
    CTX.check_hostname = False
    CTX.verify_mode = ssl.CERT_NONE

    def req(method, path, body=None):
        data = json.dumps(body).encode() if body else None
        r = urllib.request.Request(OS + path, data=data, method=method,
            headers={"Content-Type": "application/json", "Authorization": "Basic " + AUTH})
        try:
            with urllib.request.urlopen(r, context=CTX, timeout=60) as resp:
                return json.loads(resp.read()), resp.status
        except urllib.error.HTTPError as e:
            try:    return json.loads(e.read()), e.code
            except: return {}, e.code

    print("Waiting for OpenSearch...")
    for _ in range(30):
        try:
            r, s = req("GET", "/_cluster/health")
            if s == 200: print("Ready."); break
        except: pass
        time.sleep(10)

    # Painless script as single-line string to avoid YAML issues
    painless = (
        'String msg = ctx.containsKey("message") ? ctx.message : ""; '
        'if (msg.contains("Failed password")) { ctx.action = "ssh_failed_password"; ctx.action_category = "auth_failure"; } '
        'else if (msg.contains("Invalid user")) { ctx.action = "ssh_invalid_user"; ctx.action_category = "auth_failure"; } '
        'else if (msg.contains("Accepted")) { ctx.action = "ssh_accepted"; ctx.action_category = "auth_success"; } '
        'else if (msg.contains("authentication failure")) { ctx.action = "api_auth_failure"; ctx.action_category = "auth_failure"; } '
        'else if (msg.contains("Disconnected from invalid")) { ctx.action = "ssh_disconnected_invalid"; ctx.action_category = "connection"; } '
        'else if (msg.contains("Disconnected")) { ctx.action = "ssh_disconnected"; ctx.action_category = "connection"; } '
        'else if (msg.contains("Connection closed by invalid")) { ctx.action = "ssh_closed_invalid"; ctx.action_category = "connection"; } '
        'else if (msg.contains("Connection closed")) { ctx.action = "ssh_closed"; ctx.action_category = "connection"; } '
        'else if (msg.contains("check pass")) { ctx.action = "pam_check"; ctx.action_category = "auth_check"; }'
    )

    print("Creating ingest pipeline...")
    r, s = req("PUT", "/_ingest/pipeline/proxmox-syslog-enrich", {
        "description": "Enrich Proxmox syslog: src_ip, username, action",
        "processors": [
            {"grok": {"field": "message", "ignore_failure": True, "patterns": [
                "Failed password for invalid user %{WORD:username} from %{IP:src_ip} port %{NUMBER:src_port:int} %{GREEDYDATA}",
                "Failed password for %{WORD:username} from %{IP:src_ip} port %{NUMBER:src_port:int} %{GREEDYDATA}",
                "Invalid user %{WORD:username} from %{IP:src_ip} port %{NUMBER:src_port:int}",
                "Accepted %{WORD:auth_method} for %{WORD:username} from %{IP:src_ip} port %{NUMBER:src_port:int} %{GREEDYDATA}",
                "Disconnected from invalid user %{WORD:username} %{IP:src_ip} port %{NUMBER:src_port:int} %{GREEDYDATA}",
                "Disconnected from %{IP:src_ip} port %{NUMBER:src_port:int} %{GREEDYDATA}",
                "Connection closed by invalid user %{WORD:username} %{IP:src_ip} port %{NUMBER:src_port:int} %{GREEDYDATA}",
                "Connection closed by %{IP:src_ip} port %{NUMBER:src_port:int} %{GREEDYDATA}",
                "authentication failure; rhost=::ffff:%{IP:src_ip} user=%{DATA:username} %{GREEDYDATA}",
                "authentication failure; rhost=%{IP:src_ip} user=%{DATA:username} %{GREEDYDATA}"
            ]}},
            {"script": {"lang": "painless", "source": painless}}
        ]
    })
    print("  Pipeline:", "OK" if r.get("acknowledged") else ("ERROR " + str(s) + ": " + str(r)[:150]))

    # Router pipeline: routes to opnsense or proxmox sub-pipeline based on ident.
    # This is the single pipeline set on the index template, avoiding conflicts
    # when both setup scripts write syslog-template independently.
    print("Creating syslog router pipeline...")
    r, s = req("PUT", "/_ingest/pipeline/syslog-enrich", {
        "description": "Route syslog documents to the correct enrichment pipeline",
        "processors": [
            {
                "pipeline": {
                    "name": "opnsense-syslog-enrich",
                    "if": "ctx.containsKey('ident') && (ctx.ident == 'filterlog' || ctx.ident == 'suricata')",
                    "ignore_failure": True
                }
            },
            {
                "pipeline": {
                    "name": "proxmox-syslog-enrich",
                    "if": "!ctx.containsKey('ident') || (ctx.ident != 'filterlog' && ctx.ident != 'suricata')",
                    "ignore_failure": True
                }
            }
        ]
    })
    print("  Router pipeline:", "OK" if r.get("acknowledged") else ("ERROR " + str(s)))

    print("=== Pipeline setup complete ===")
    print("Fields: src_ip, src_port, username, auth_method, action, action_category")
