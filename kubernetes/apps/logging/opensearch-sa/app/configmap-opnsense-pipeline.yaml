---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opnsense-pipeline-script
data:
  setup_opnsense_pipeline.py: |
    import json, os, time, base64, ssl, urllib.request, urllib.error

    OS   = "https://opensearch.logging.svc.cluster.local:9200"
    PASS = os.environ.get("OPENSEARCH_PASSWORD", "")
    AUTH = base64.b64encode(("admin:" + PASS).encode()).decode()
    CTX  = ssl.create_default_context()
    CTX.check_hostname = False
    CTX.verify_mode = ssl.CERT_NONE

    def req(method, path, body=None):
        data = json.dumps(body).encode() if body else None
        r = urllib.request.Request(OS + path, data=data, method=method,
            headers={"Content-Type": "application/json", "Authorization": "Basic " + AUTH})
        try:
            with urllib.request.urlopen(r, context=CTX, timeout=60) as resp:
                return json.loads(resp.read()), resp.status
        except urllib.error.HTTPError as e:
            try:    return json.loads(e.read()), e.code
            except: return {}, e.code

    print("Waiting for OpenSearch...")
    for _ in range(30):
        try:
            r, s = req("GET", "/_cluster/health")
            if s == 200: print("Ready."); break
        except: pass
        time.sleep(10)

    # ── Ingest Pipeline: OPNsense syslog enrichment ───────────────────────
    # filterlog: CSV -> structured fields
    # suricata:  JSON message -> structured fields
    print("Creating OPNsense ingest pipeline...")

    # Painless: set fw_action_category based on action
    fw_action_script = (
        'if (ctx.containsKey("fw_action")) {'
        '  if (ctx.fw_action == "block") { ctx.fw_action_category = "blocked"; }'
        '  else if (ctx.fw_action == "pass") { ctx.fw_action_category = "allowed"; }'
        '  else { ctx.fw_action_category = "other"; }'
        '}'
    )

    # Painless: parse Suricata JSON from message field
    suricata_script = (
        'if (ctx.containsKey("ident") && ctx.ident == "suricata" && ctx.containsKey("message")) {'
        '  try {'
        '    Map s = new JsonSlurper().parseText(ctx.message);'
        '    if (s.containsKey("src_ip"))  ctx.src_ip   = s.src_ip;'
        '    if (s.containsKey("dest_ip")) ctx.dst_ip   = s.dest_ip;'
        '    if (s.containsKey("src_port")) ctx.src_port = s.src_port;'
        '    if (s.containsKey("dest_port")) ctx.dst_port = s.dest_port;'
        '    if (s.containsKey("proto"))   ctx.fw_protocol = s.proto;'
        '    if (s.containsKey("in_iface")) ctx.fw_interface = s.in_iface;'
        '    if (s.containsKey("event_type")) ctx.suricata_event_type = s.event_type;'
        '    if (s.containsKey("alert")) {'
        '      Map a = (Map)s.alert;'
        '      if (a.containsKey("signature"))  ctx.suricata_signature  = a.signature;'
        '      if (a.containsKey("category"))   ctx.suricata_category   = a.category;'
        '      if (a.containsKey("severity"))   ctx.suricata_severity   = a.severity;'
        '      if (a.containsKey("action"))     ctx.fw_action           = a.action;'
        '    }'
        '  } catch (Exception e) {}'
        '}'
    )

    pipeline = {
        "description": "Enrich OPNsense syslog: parse filterlog CSV and Suricata JSON alerts",
        "processors": [
            # filterlog: parse CSV into structured fields
            {
                "grok": {
                    "field": "message",
                    "patterns": [
                        # IPv4 TCP/UDP with ports
                        "%{INT:fw_rule_num},%{DATA},%{DATA},%{DATA:fw_rule_uuid},%{WORD:fw_interface},%{WORD:fw_reason},%{WORD:fw_action},%{WORD:fw_direction},%{INT:fw_ip_version},%{DATA},%{DATA},%{INT:fw_ttl},%{DATA},%{DATA},%{DATA},%{INT},%{WORD:fw_protocol},%{INT},%{IP:src_ip},%{IP:dst_ip},%{INT:src_port},%{INT:dst_port},%{GREEDYDATA}",
                        # IPv4 ICMP/other (no ports)
                        "%{INT:fw_rule_num},%{DATA},%{DATA},%{DATA:fw_rule_uuid},%{WORD:fw_interface},%{WORD:fw_reason},%{WORD:fw_action},%{WORD:fw_direction},%{INT:fw_ip_version},%{DATA},%{DATA},%{INT:fw_ttl},%{DATA},%{DATA},%{DATA},%{INT},%{WORD:fw_protocol},%{INT},%{IP:src_ip},%{IP:dst_ip},%{GREEDYDATA}"
                    ],
                    "if": "ctx.containsKey('ident') && ctx.ident == 'filterlog'",
                    "ignore_failure": True
                }
            },
            # Set action category for filterlog
            {
                "script": {
                    "lang": "painless",
                    "source": fw_action_script,
                    "if": "ctx.containsKey('ident') && ctx.ident == 'filterlog'"
                }
            },
            # Map interface names to human-readable labels
            {"set": {"field": "fw_interface_name", "value": "WAN",  "if": "ctx.containsKey('fw_interface') && ctx.fw_interface == 'vtnet0'", "ignore_failure": True}},
            {"set": {"field": "fw_interface_name", "value": "LAN",  "if": "ctx.containsKey('fw_interface') && ctx.fw_interface == 'vtnet1'", "ignore_failure": True}},
            {"set": {"field": "fw_interface_name", "value": "VPN",  "if": "ctx.containsKey('fw_interface') && ctx.fw_interface == 'wg0'",    "ignore_failure": True}},
            {"set": {"field": "fw_interface_name", "value": "{{fw_interface}}", "if": "ctx.containsKey('fw_interface') && !ctx.containsKey('fw_interface_name')", "ignore_failure": True}},
            # Suricata: parse JSON from message field into _suricata_raw
            {
                "json": {
                    "field": "message",
                    "target_field": "_suricata",
                    "if": "ctx.containsKey('ident') && ctx.ident == 'suricata'",
                    "ignore_failure": True
                }
            },
            # Copy relevant Suricata fields to top-level
            {"set": {"field": "src_ip",               "value": "{{_suricata.src_ip}}",             "if": "ctx.containsKey('_suricata') && ctx._suricata?.src_ip != null",               "ignore_failure": True}},
            {"set": {"field": "dst_ip",               "value": "{{_suricata.dest_ip}}",            "if": "ctx.containsKey('_suricata') && ctx._suricata?.dest_ip != null",              "ignore_failure": True}},
            {"set": {"field": "src_port",             "value": "{{_suricata.src_port}}",           "if": "ctx.containsKey('_suricata') && ctx._suricata?.src_port != null",             "ignore_failure": True}},
            {"set": {"field": "dst_port",             "value": "{{_suricata.dest_port}}",          "if": "ctx.containsKey('_suricata') && ctx._suricata?.dest_port != null",            "ignore_failure": True}},
            {"set": {"field": "fw_protocol",          "value": "{{_suricata.proto}}",              "if": "ctx.containsKey('_suricata') && ctx._suricata?.proto != null",                "ignore_failure": True}},
            {"set": {"field": "fw_interface",         "value": "{{_suricata.in_iface}}",           "if": "ctx.containsKey('_suricata') && ctx._suricata?.in_iface != null",             "ignore_failure": True}},
            {"set": {"field": "suricata_event_type",  "value": "{{_suricata.event_type}}",         "if": "ctx.containsKey('_suricata') && ctx._suricata?.event_type != null",           "ignore_failure": True}},
            {"set": {"field": "suricata_signature",   "value": "{{_suricata.alert.signature}}",    "if": "ctx.containsKey('_suricata') && ctx._suricata?.alert?.signature != null",     "ignore_failure": True}},
            {"set": {"field": "suricata_category",    "value": "{{_suricata.alert.category}}",     "if": "ctx.containsKey('_suricata') && ctx._suricata?.alert?.category != null",      "ignore_failure": True}},
            {"set": {"field": "suricata_severity",    "value": "{{_suricata.alert.severity}}",     "if": "ctx.containsKey('_suricata') && ctx._suricata?.alert?.severity != null",      "ignore_failure": True}},
            {"set": {"field": "fw_action",            "value": "{{_suricata.alert.action}}",       "if": "ctx.containsKey('_suricata') && ctx._suricata?.alert?.action != null",        "ignore_failure": True}},
            # Remove temp field
            {"remove": {"field": "_suricata", "ignore_missing": True, "ignore_failure": True}},
            # Convert numeric fields
            {"convert": {"field": "src_port",          "type": "integer", "ignore_missing": True, "ignore_failure": True}},
            {"convert": {"field": "dst_port",          "type": "integer", "ignore_missing": True, "ignore_failure": True}},
            {"convert": {"field": "suricata_severity", "type": "integer", "ignore_missing": True, "ignore_failure": True}}
        ]
    }

    r, s = req("PUT", "/_ingest/pipeline/opnsense-syslog-enrich", pipeline)
    print("  Pipeline:", "OK" if r.get("acknowledged") else ("ERROR " + str(s) + ": " + str(r)[:200]))

    # ── Update syslog index template ──────────────────────────────────────
    # Note: syslog-* template already has proxmox pipeline as default.
    # We need a SEPARATE template for opnsense OR update existing to use
    # a combined pipeline. We'll use a separate higher-priority template.
    print("Updating index template for OPNsense...")
    r, s = req("PUT", "/_index_template/syslog-template", {
        "index_patterns": ["syslog-[0-9]*"],
        "priority": 200,
        "template": {
            "settings": {"index.default_pipeline": "syslog-enrich"},
            "mappings": {"properties": {
                "@timestamp":           {"type": "date"},
                "host":                 {"type": "keyword"},
                "source":               {"type": "keyword"},
                "ident":                {"type": "keyword"},
                "severity":             {"type": "keyword"},
                "message":              {"type": "text"},
                "src_ip":               {"type": "ip",      "ignore_malformed": True},
                "dst_ip":               {"type": "ip",      "ignore_malformed": True},
                "src_port":             {"type": "integer", "ignore_malformed": True},
                "dst_port":             {"type": "integer", "ignore_malformed": True},
                "fw_action":            {"type": "keyword"},
                "fw_action_category":   {"type": "keyword"},
                "fw_direction":         {"type": "keyword"},
                "fw_protocol":          {"type": "keyword"},
                "fw_interface":         {"type": "keyword"},
                "fw_rule_num":          {"type": "keyword"},
                "fw_ip_version":        {"type": "keyword"},
                "fw_rule_uuid":         {"type": "keyword"},
                "fw_interface_name":    {"type": "keyword"},
                "suricata_event_type":  {"type": "keyword"},
                "suricata_signature":   {"type": "keyword"},
                "suricata_category":    {"type": "keyword"},
                "suricata_severity":    {"type": "integer"},
                "username":             {"type": "keyword"},
                "auth_method":          {"type": "keyword"},
                "action":               {"type": "keyword"},
                "action_category":      {"type": "keyword"}
            }}
        }
    })
    print("  Template:", "OK" if r.get("acknowledged") else ("ERROR " + str(s)))

    print("=== OPNsense pipeline setup complete ===")
    print("Fields: src_ip, dst_ip, src_port, dst_port, fw_action, fw_direction,")
    print("        fw_protocol, fw_interface, suricata_signature, suricata_category")
