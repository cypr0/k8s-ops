---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crd-exporter-script
data:
  export.py: |
    #!/usr/bin/env python3
    """
    Export Trivy VulnerabilityReports and Kubescape findings to OpenSearch.
    Runs as a CronJob — indexes to trivy-YYYY.MM.DD and kubescape-YYYY.MM.DD.
    """
    import json
    import os
    import sys
    import urllib.request
    import urllib.error
    import ssl
    from datetime import datetime, timezone

    # ── Config ────────────────────────────────────────────────────────────
    OS_HOST  = os.environ.get("OPENSEARCH_HOST",     "https://opensearch.logging.svc.cluster.local:9200")
    OS_USER  = os.environ.get("OPENSEARCH_USER",     "admin")
    OS_PASS  = os.environ.get("OPENSEARCH_PASSWORD", "")
    TODAY    = datetime.now(timezone.utc).strftime("%Y.%m.%d")

    import base64
    AUTH = base64.b64encode(f"{OS_USER}:{OS_PASS}".encode()).decode()

    # Skip TLS verification (operator self-signed cert)
    CTX = ssl.create_default_context()
    CTX.check_hostname = False
    CTX.verify_mode    = ssl.CERT_NONE

    def k8s_get_all(path):
        """Paginate through Kubernetes API results to avoid rate limiting."""
        import time
        token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read()
        ca    = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        ctx   = ssl.create_default_context(cafile=ca)
        all_items = []
        cont = None
        while True:
            sep = "&" if "?" in path else "?"
            url = f"https://kubernetes.default.svc{path}{sep}limit=30"
            if cont:
                url += f"&continue={cont}"
            req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
            try:
                with urllib.request.urlopen(req, context=ctx) as r:
                    data = json.loads(r.read())
            except urllib.error.HTTPError as e:
                if e.code == 404:
                    return []
                if e.code == 429:
                    time.sleep(2)
                    continue
                raise
            all_items.extend(data.get("items", []))
            cont = data.get("metadata", {}).get("continue")
            if not cont:
                break
            time.sleep(0.3)  # Gentle rate limiting
        return all_items

    def os_bulk(index, docs):
        """Bulk-index documents to OpenSearch."""
        if not docs:
            return 0
        body = ""
        for doc in docs:
            body += json.dumps({"index": {"_index": index}}) + "\n"
            body += json.dumps(doc) + "\n"
        req = urllib.request.Request(
            f"{OS_HOST}/_bulk",
            data=body.encode(),
            headers={"Content-Type": "application/x-ndjson", "Authorization": f"Basic {AUTH}"},
            method="POST"
        )
        try:
            with urllib.request.urlopen(req, context=CTX) as r:
                resp = json.loads(r.read())
                errors = [i for i in resp.get("items", []) if "error" in i.get("index", {})]
                return len(docs) - len(errors)
        except Exception as e:
            print(f"  ERROR bulk indexing: {e}", file=sys.stderr)
            return 0

    # ── Trivy VulnerabilityReports ────────────────────────────────────────
    print("=== Trivy VulnerabilityReports ===")
    index  = f"trivy-{TODAY}"
    docs   = []
    ts     = datetime.now(timezone.utc).isoformat()

    try:
        for item in k8s_get_all("/apis/aquasecurity.github.io/v1alpha1/vulnerabilityreports"):
            meta    = item.get("metadata", {})
            report  = item.get("report", {})
            ns      = meta.get("namespace", "")
            image   = report.get("artifact", {}).get("tag", "")
            repo    = report.get("artifact", {}).get("repository", "")
            for vuln in report.get("vulnerabilities", []):
                sev = vuln.get("severity", "UNKNOWN")
                if sev not in ("CRITICAL", "HIGH"):
                    continue
                docs.append({
                    "@timestamp":       ts,
                    "namespace":        ns,
                    "resource":         meta.get("name", ""),
                    "image":            f"{repo}:{image}",
                    "vulnerabilityID":  vuln.get("vulnerabilityID", ""),
                    "severity":         sev,
                    "title":            vuln.get("title", ""),
                    "fixedVersion":     vuln.get("fixedVersion", ""),
                    "installedVersion": vuln.get("installedVersion", ""),
                    "source":           "trivy"
                })
        indexed = os_bulk(index, docs)
        print(f"  Indexed {indexed}/{len(docs)} CRITICAL+HIGH CVEs to {index}")
    except Exception as e:
        print(f"  Trivy export error: {e}", file=sys.stderr)

    # ── Trivy ConfigAuditReports ──────────────────────────────────────────
    print("=== Trivy ConfigAuditReports ===")
    audit_docs = []
    try:
        for item in k8s_get_all("/apis/aquasecurity.github.io/v1alpha1/configauditreports"):
            meta   = item.get("metadata", {})
            report = item.get("report", {})
            ns     = meta.get("namespace", "")
            for check in report.get("checks", []):
                if check.get("success", True):
                    continue
                sev = check.get("severity", "LOW")
                if sev not in ("CRITICAL", "HIGH", "MEDIUM"):
                    continue
                audit_docs.append({
                    "@timestamp": ts,
                    "namespace":  ns,
                    "resource":   meta.get("name", ""),
                    "checkID":    check.get("checkID", ""),
                    "severity":   sev,
                    "title":      check.get("title", ""),
                    "category":   check.get("category", ""),
                    "source":     "trivy-config"
                })
        indexed = os_bulk(f"trivy-{TODAY}", audit_docs)
        print(f"  Indexed {indexed}/{len(audit_docs)} config audit findings")
    except Exception as e:
        print(f"  Trivy config audit error: {e}", file=sys.stderr)

    # ── Kubescape WorkloadConfigurationScans ─────────────────────────────
    # NOTE: The list API omits spec.controls — must GET each item individually.
    # Individual GETs include full controls with status, severity, ruleName.
    print("=== Kubescape WorkloadConfigurationScans ===")
    ks_index = f"kubescape-{TODAY}"
    ks_docs  = []
    try:
        import time as _time
        token = open("/var/run/secrets/kubernetes.io/serviceaccount/token").read()
        ca    = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
        k8s_ctx = ssl.create_default_context(cafile=ca)

        def k8s_get_one(path):
            req = urllib.request.Request(
                f"https://kubernetes.default.svc{path}",
                headers={"Authorization": f"Bearer {token}"}
            )
            with urllib.request.urlopen(req, context=k8s_ctx) as r:
                return json.loads(r.read())

        # Step 1: list all scans (metadata only — controls absent from list response)
        base = "/apis/spdx.softwarecomposition.kubescape.io/v1beta1/workloadconfigurationscans"
        stubs = k8s_get_all(base)
        print(f"  Found {len(stubs)} workload scans — fetching individually...")
        seen_controls = set()  # deduplicate same control across namespaces
        for i, stub in enumerate(stubs):
            meta = stub.get("metadata", {})
            ns   = meta.get("namespace", "")
            name = meta.get("name", "")
            kind = meta.get("labels", {}).get("kubescape.io/workload-kind", "Unknown")
            wl   = meta.get("labels", {}).get("kubescape.io/workload-name", name)
            try:
                ns_path = f"/namespaces/{ns}" if ns else ""
                item = k8s_get_one(f"/apis/spdx.softwarecomposition.kubescape.io/v1beta1{ns_path}/workloadconfigurationscans/{name}")
            except Exception:
                item = stub  # fall back to stub (no controls)
            controls = item.get("spec", {}).get("controls", {}) or {}
            for cid, ctrl in controls.items():
                st = ctrl.get("status", {})
                if not isinstance(st, dict) or st.get("status") != "failed":
                    continue
                sev_info = ctrl.get("severity", {})
                sev_label = sev_info.get("severity", "Unknown")
                sev_score = sev_info.get("scoreFactor", 0)
                if sev_label not in ("Critical", "High", "Medium"):
                    continue
                # One doc per (namespace, workload, control) — deduplicate same ctrl id
                dedup_key = f"{ns}/{wl}/{cid}"
                if dedup_key in seen_controls:
                    continue
                seen_controls.add(dedup_key)
                # Extract remediation from first rule's paths
                remediation = ""
                for rule in ctrl.get("rules", []) or []:
                    for path in rule.get("paths", []) or []:
                        if path and path.get("fixPath"):
                            remediation = f"Set {path['fixPath']}={path.get('fixPathValue','<value>')}"
                            break
                    if remediation:
                        break
                ks_docs.append({
                    "@timestamp":  ts,
                    "namespace":   ns,
                    "kind":        kind,
                    "resource":    wl,
                    "ruleID":      cid,
                    "ruleName":    ctrl.get("name", cid),
                    "severity":    sev_label,
                    "scoreFactor": sev_score,
                    "remediation": remediation,
                    "source":      "kubescape"
                })
            if (i + 1) % 50 == 0:
                print(f"  Processed {i+1}/{len(stubs)}, findings so far: {len(ks_docs)}")
                _time.sleep(0.5)
        indexed = os_bulk(ks_index, ks_docs)
        print(f"  Indexed {indexed}/{len(ks_docs)} Kubescape findings to {ks_index}")
    except Exception as e:
        import traceback
        print(f"  Kubescape export error: {e}", file=sys.stderr)
        traceback.print_exc(file=sys.stderr)

    print("=== CRD export complete ===")
    print(f"  Trivy CVEs: {len(docs) + len(audit_docs)}, Kubescape: {len(ks_docs)}")
