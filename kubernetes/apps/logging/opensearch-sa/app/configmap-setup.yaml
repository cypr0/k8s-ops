---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-sa-setup
data:
  setup.sh: |
    #!/bin/bash
    set -euo pipefail

    OS="https://opensearch.logging.svc.cluster.local:9200"
    AUTH="admin:${OPENSEARCH_PASSWORD}"
    CURL="curl -sk -u ${AUTH}"

    echo "=== Waiting for OpenSearch ==="
    until ${CURL} "${OS}/_cluster/health" | grep -q '"status"'; do
      echo "Waiting..."; sleep 10
    done
    echo "OpenSearch ready."

    # ── 1. Pushover notification channel ──────────────────────────────────
    echo "=== Pushover notification channel ==="
    ${CURL} -X DELETE "${OS}/_plugins/_notifications/configs/pushover-siem" >/dev/null 2>&1 || true
    ${CURL} -X POST "${OS}/_plugins/_notifications/configs" \
      -H "Content-Type: application/json" -d "{
        \"config_id\": \"pushover-siem\",
        \"name\": \"Pushover SIEM\",
        \"config\": {
          \"name\": \"Pushover SIEM\",
          \"config_type\": \"webhook\",
          \"is_enabled\": true,
          \"webhook\": {
            \"url\": \"https://api.pushover.net/1/messages.json\",
            \"method\": \"POST\",
            \"query_params\": {
              \"token\": \"${PUSHOVER_TOKEN}\",
              \"user\": \"${PUSHOVER_USER}\",
              \"priority\": \"0\"
            },
            \"header_params\": {\"Content-Type\": \"application/x-www-form-urlencoded\"}
          }
        }
      }" | python3 -c "import json,sys; r=json.load(sys.stdin); print('Channel:', r.get('config_id','ERROR: '+str(r)))" 2>/dev/null

    # ── 2. Index templates ─────────────────────────────────────────────────
    echo "=== Index templates ==="
    for tpl in 'syslog:syslog-*' 'falco:falco-*' 'trivy:trivy-*' 'kubescape:kubescape-*'; do
      NAME="${tpl%%:*}"; PATTERN="${tpl##*:}"
      ${CURL} -X PUT "${OS}/_index_template/${NAME}-template" \
        -H "Content-Type: application/json" \
        -d "{\"index_patterns\":[\"${PATTERN}\"],\"priority\":100,\"template\":{\"mappings\":{\"properties\":{\"@timestamp\":{\"type\":\"date\"},\"source\":{\"type\":\"keyword\"},\"severity\":{\"type\":\"keyword\"},\"message\":{\"type\":\"text\"},\"host\":{\"type\":\"keyword\"}}}}}" \
        | python3 -c "import json,sys; r=json.load(sys.stdin); print(f'  ${NAME}: OK' if r.get('acknowledged') else f'  ${NAME}: '+str(r))" 2>/dev/null
    done

    # ── Helper: create or update a monitor ────────────────────────────────
    create_monitor() {
      local NAME="$1"; local JSON="$2"
      # Delete existing
      EXISTING=$(${CURL} "${OS}/_plugins/_alerting/monitors/_search" \
        -H "Content-Type: application/json" \
        -d "{\"query\":{\"term\":{\"monitor.name.keyword\":\"${NAME}\"}}}" 2>/dev/null \
        | python3 -c "import json,sys; r=json.load(sys.stdin); ids=r.get('hits',{}).get('hits',[]); print(ids[0]['_id'] if ids else '')" 2>/dev/null)
      [ -n "${EXISTING}" ] && ${CURL} -X DELETE "${OS}/_plugins/_alerting/monitors/${EXISTING}" >/dev/null 2>&1 || true
      ${CURL} -X POST "${OS}/_plugins/_alerting/monitors" \
        -H "Content-Type: application/json" -d "${JSON}" \
        | python3 -c "import json,sys; r=json.load(sys.stdin); print(f'  ${NAME}: '+r.get('_id','ERROR: '+str(r)))" 2>/dev/null
    }

    # ── 3. OPNsense: Firewall block spike (>100 blocks in 5min) ───────────
    echo "=== OPNsense firewall monitors ==="
    create_monitor "Firewall Block Spike" "{
      \"type\": \"monitor\",
      \"name\": \"Firewall Block Spike\",
      \"monitor_type\": \"query_level_monitor\",
      \"enabled\": true,
      \"schedule\": {\"period\": {\"interval\": 5, \"unit\": \"MINUTES\"}},
      \"inputs\": [{\"search\": {
        \"indices\": [\"syslog-*\"],
        \"query\": {
          \"size\": 0,
          \"query\": {\"bool\": {\"filter\": [
            {\"term\": {\"source\": \"opnsense\"}},
            {\"wildcard\": {\"message\": \"*block*\"}},
            {\"range\": {\"@timestamp\": {\"gte\": \"now-5m\"}}}
          ]}},
          \"aggs\": {\"count\": {\"value_count\": {\"field\": \"@timestamp\"}}}
        }
      }}],
      \"triggers\": [{\"query_level_trigger\": {
        \"id\": \"firewall-block-trigger\",
        \"name\": \"Too many firewall blocks\",
        \"severity\": \"2\",
        \"condition\": {\"script\": {\"source\": \"ctx.results[0].aggregations.count.value > 100\", \"lang\": \"painless\"}},
        \"actions\": [{\"name\": \"Pushover\", \"destination_id\": \"pushover-siem\",
          \"message_template\": {\"source\": \"title=Firewall+Block+Spike&message=More+than+100+firewall+blocks+in+5+min.+Possible+port+scan.&priority=0\"},
          \"throttle_enabled\": true, \"throttle\": {\"value\": 15, \"unit\": \"MINUTES\"}}]
      }}]
    }"

    # ── 4. OPNsense: SSH brute-force (>10 auth failures in 5min) ──────────
    create_monitor "SSH Brute Force Detection" "{
      \"type\": \"monitor\",
      \"name\": \"SSH Brute Force Detection\",
      \"monitor_type\": \"query_level_monitor\",
      \"enabled\": true,
      \"schedule\": {\"period\": {\"interval\": 5, \"unit\": \"MINUTES\"}},
      \"inputs\": [{\"search\": {
        \"indices\": [\"syslog-*\"],
        \"query\": {
          \"size\": 0,
          \"query\": {\"bool\": {\"filter\": [
            {\"wildcard\": {\"message\": \"*authentication failure*\"}},
            {\"range\": {\"@timestamp\": {\"gte\": \"now-5m\"}}}
          ]}},
          \"aggs\": {\"count\": {\"value_count\": {\"field\": \"@timestamp\"}}}
        }
      }}],
      \"triggers\": [{\"query_level_trigger\": {
        \"id\": \"ssh-brute-trigger\",
        \"name\": \"SSH brute force\",
        \"severity\": \"1\",
        \"condition\": {\"script\": {\"source\": \"ctx.results[0].aggregations.count.value > 10\", \"lang\": \"painless\"}},
        \"actions\": [{\"name\": \"Pushover\", \"destination_id\": \"pushover-siem\",
          \"message_template\": {\"source\": \"title=SSH+Brute+Force&message=More+than+10+authentication+failures+in+5+min.+Check+logs!&priority=1\"},
          \"throttle_enabled\": true, \"throttle\": {\"value\": 15, \"unit\": \"MINUTES\"}}]
      }}]
    }"

    # ── 5. Falco: Critical runtime events ─────────────────────────────────
    echo "=== Falco monitors ==="
    create_monitor "Falco Critical Event" "{
      \"type\": \"monitor\",
      \"name\": \"Falco Critical Event\",
      \"monitor_type\": \"query_level_monitor\",
      \"enabled\": true,
      \"schedule\": {\"period\": {\"interval\": 1, \"unit\": \"MINUTES\"}},
      \"inputs\": [{\"search\": {
        \"indices\": [\"falco-*\"],
        \"query\": {
          \"size\": 0,
          \"query\": {\"bool\": {\"filter\": [
            {\"term\": {\"priority\": \"Critical\"}},
            {\"range\": {\"time\": {\"gte\": \"now-2m\"}}}
          ]}},
          \"aggs\": {\"count\": {\"value_count\": {\"field\": \"rule\"}}}
        }
      }}],
      \"triggers\": [{\"query_level_trigger\": {
        \"id\": \"falco-critical-trigger\",
        \"name\": \"Falco Critical\",
        \"severity\": \"1\",
        \"condition\": {\"script\": {\"source\": \"ctx.results[0].aggregations.count.value > 0\", \"lang\": \"painless\"}},
        \"actions\": [{\"name\": \"Pushover\", \"destination_id\": \"pushover-siem\",
          \"message_template\": {\"source\": \"title=Falco+Critical+Event&message=Critical+runtime+security+event+detected.+Check+OpenSearch+Dashboards.&priority=1\"},
          \"throttle_enabled\": true, \"throttle\": {\"value\": 10, \"unit\": \"MINUTES\"}}]
      }}]
    }"

    # ── 6. Trivy: CRITICAL CVEs (hourly) ───────────────────────────────────
    echo "=== Trivy + Kubescape monitors ==="
    create_monitor "Trivy CRITICAL CVEs" "{
      \"type\": \"monitor\",
      \"name\": \"Trivy CRITICAL CVEs\",
      \"monitor_type\": \"query_level_monitor\",
      \"enabled\": true,
      \"schedule\": {\"period\": {\"interval\": 60, \"unit\": \"MINUTES\"}},
      \"inputs\": [{\"search\": {
        \"indices\": [\"trivy-*\"],
        \"query\": {
          \"size\": 0,
          \"query\": {\"bool\": {\"filter\": [
            {\"term\": {\"severity\": \"CRITICAL\"}},
            {\"range\": {\"@timestamp\": {\"gte\": \"now-1h\"}}}
          ]}},
          \"aggs\": {\"count\": {\"value_count\": {\"field\": \"vulnerabilityID\"}}}
        }
      }}],
      \"triggers\": [{\"query_level_trigger\": {
        \"id\": \"trivy-trigger\",
        \"name\": \"New CRITICAL CVE\",
        \"severity\": \"1\",
        \"condition\": {\"script\": {\"source\": \"ctx.results[0].aggregations.count.value > 0\", \"lang\": \"painless\"}},
        \"actions\": [{\"name\": \"Pushover\", \"destination_id\": \"pushover-siem\",
          \"message_template\": {\"source\": \"title=Trivy+CRITICAL+CVE&message=New+critical+vulnerability+detected.+Check+OpenSearch+Dashboards.&priority=1\"},
          \"throttle_enabled\": true, \"throttle\": {\"value\": 60, \"unit\": \"MINUTES\"}}]
      }}]
    }"

    # ── 7. Kubescape: CIS violations (hourly) ─────────────────────────────
    create_monitor "Kubescape Critical CIS" "{
      \"type\": \"monitor\",
      \"name\": \"Kubescape Critical CIS\",
      \"monitor_type\": \"query_level_monitor\",
      \"enabled\": true,
      \"schedule\": {\"period\": {\"interval\": 60, \"unit\": \"MINUTES\"}},
      \"inputs\": [{\"search\": {
        \"indices\": [\"kubescape-*\"],
        \"query\": {
          \"size\": 0,
          \"query\": {\"bool\": {\"filter\": [
            {\"term\": {\"severity\": \"Critical\"}},
            {\"range\": {\"@timestamp\": {\"gte\": \"now-1h\"}}}
          ]}},
          \"aggs\": {\"count\": {\"value_count\": {\"field\": \"ruleName\"}}}
        }
      }}],
      \"triggers\": [{\"query_level_trigger\": {
        \"id\": \"ks-trigger\",
        \"name\": \"Critical CIS Violation\",
        \"severity\": \"2\",
        \"condition\": {\"script\": {\"source\": \"ctx.results[0].aggregations.count.value > 0\", \"lang\": \"painless\"}},
        \"actions\": [{\"name\": \"Pushover\", \"destination_id\": \"pushover-siem\",
          \"message_template\": {\"source\": \"title=Kubescape+CIS+Violation&message=Critical+CIS+benchmark+violation+detected.&priority=0\"},
          \"throttle_enabled\": true, \"throttle\": {\"value\": 60, \"unit\": \"MINUTES\"}}]
      }}]
    }"

    echo "=== SIEM setup complete ==="
    echo "Monitors: Firewall Block Spike, SSH Brute Force, Falco Critical, Trivy CVE, Kubescape CIS"
