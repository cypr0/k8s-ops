---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# Immich API key for immich_photos.py's Valves.
#
# Unlike paperless-mcp/nextcloud-mcp, this credential is NOT reused from an
# existing cluster secret, because Immich has nothing to reuse: it has no
# provisionable service credential, API keys can only be minted by a
# signed-in user under Account Settings > API Keys, and this instance is
# OIDC-only with passwordLogin disabled (kubernetes/apps/immich/immich/app/
# externalsecret.yaml's immich.json). So IMMICH_API_KEY is a field that has
# to be filled in by hand ONCE on the existing 1Password "immich" item that
# kubernetes/apps/immich/immich/app/externalsecret.yaml already reads --
# this ExternalSecret stays Pending until it exists.
#
# Scope that key narrowly when creating it: asset.read, asset.view,
# asset.update, album.read, album.create, album.update, person.read,
# server.about. It inherits its owning user's library scope, so it sees
# that user's photos plus what is shared with them -- Immich has no
# instance-wide key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: immich-mcp-secret
    creationPolicy: Owner
  data:
    - secretKey: IMMICH_API_KEY
      remoteRef:
        key: immich
        property: IMMICH_API_KEY
