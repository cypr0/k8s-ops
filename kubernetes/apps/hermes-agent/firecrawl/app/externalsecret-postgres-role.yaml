---
# CNPG managed role password for the dedicated firecrawl-postgres cluster
# (see cluster.yaml). Needs a NEW 1Password item -- add:
#   item "firecrawl", field FIRECRAWL_POSTGRESQL_PASSWORD (any strong
#   random password; nothing else reads this item yet)
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firecrawl-db-role
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: firecrawl-db-role
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # CNPG managed roles require both username and password keys
        username: firecrawlusr
        password: "{{ .FIRECRAWL_POSTGRESQL_PASSWORD }}"
  dataFrom:
    - extract:
        key: firecrawl
