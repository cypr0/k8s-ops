---
# Firecrawl is fully internal: no HTTPRoute, USE_DB_AUTHENTICATION=false on
# the API itself, so network isolation via CNP is the actual access control
# here -- only hermes-agent and open-webui (kubernetes/apps/open-webui/
# open-webui/, its web search backend) may reach the api service on :3002.
#
# One combined policy for all four app-template controllers (api/worker/
# nuq-worker/playwright-service), matched by the shared
# app.kubernetes.io/instance: firecrawl label bjw-s's chart puts on every
# pod it creates -- simpler than reasoning about per-controller label
# differences, and there's no cross-tenant risk in letting firecrawl's own
# components talk to each other freely (verified against the live pods'
# actual labels after first deploy; adjust here if that ever changes).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: firecrawl
  namespace: hermes-agent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: firecrawl
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": hermes-agent
            app.kubernetes.io/name: hermes-agent
      toPorts:
        - ports:
            - port: "3002"
              protocol: TCP
    # open-webui's web search backend (kubernetes/apps/open-webui/open-webui/) --
    # same target label set hermes-agent's own CNP already relies on.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": open-webui
            app.kubernetes.io/name: open-webui
      toPorts:
        - ports:
            - port: "3002"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": hermes-agent
            app.kubernetes.io/instance: firecrawl
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": hermes-agent
            app.kubernetes.io/instance: firecrawl
    # Dragonfly (Redis-compatible) and the shared CNPG Postgres cluster,
    # both in the "database" namespace, shared with every other app on this
    # cluster. Their own CNPs already allow ingress from any cluster pod
    # (kubernetes/apps/database/{dragonfly,cloudnative-pg}/cluster/
    # ciliumnetworkpolicy.yaml), so this egress rule is what actually gates it.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": database
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
            - port: "5432"
              protocol: TCP
    # Fetching the actual pages being scraped/searched is inherently
    # open-ended (any URL the agent asks it to fetch).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
---
# The schema-init Job and the two maintenance CronJobs aren't part of the
# firecrawl HelmRelease release/instance, so they need their own egress rule
# to reach the shared Postgres cluster.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: firecrawl-nuq-maintenance
  namespace: hermes-agent
spec:
  endpointSelector:
    matchExpressions:
      - key: batch.kubernetes.io/job-name
        operator: Exists
  ingress: []
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
