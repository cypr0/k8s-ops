---
# Non-secret Firecrawl config. REDIS_URL/REDIS_RATE_LIMIT_URL/NUQ_DATABASE_URL
# live in externalsecret.yaml's Secret instead (they embed the Postgres/
# Redis passwords).
#
# Concurrency (CRAWL_CONCURRENT_REQUESTS/MAX_CONCURRENT_JOBS/BROWSER_POOL_SIZE)
# is deliberately much lower than upstream's docker-compose defaults (10/5/5) --
# this is a personal homelab cluster, not a scraping SaaS; sized to what
# playwright-service's resource budget below can actually support.
apiVersion: v1
kind: ConfigMap
metadata:
  name: firecrawl-config
data:
  HOST: "0.0.0.0"
  PLAYWRIGHT_MICROSERVICE_URL: "http://playwright-service:3000"
  USE_DB_AUTHENTICATION: "false"
  ENV: "production"
  LOGGING_LEVEL: "INFO"
  IS_KUBERNETES: "true"
  NUM_WORKERS_PER_QUEUE: "2"
  CRAWL_CONCURRENT_REQUESTS: "3"
  MAX_CONCURRENT_JOBS: "2"
  BROWSER_POOL_SIZE: "2"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: playwright-service-config
data:
  PORT: "3000"
  ALLOW_LOCAL_WEBHOOKS: "false"
  MAX_CONCURRENT_PAGES: "3"
