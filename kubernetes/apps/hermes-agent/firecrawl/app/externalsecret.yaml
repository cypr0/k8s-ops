---
# Main Firecrawl app secret: Redis (Dragonfly, reusing the same shared
# instance every other app already uses -- key db index /4 is currently
# unused, see whiteboard's /3 for the established "give it its own index"
# pattern) and the Postgres connection string for the dedicated
# firecrawl-postgres cluster (cluster.yaml), both built from existing/
# adjacent 1Password fields -- no new items needed for THIS file (the
# Postgres password field is declared in externalsecret-postgres-role.yaml
# instead, since CNPG managed roles need their own dedicated secret shape).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firecrawl-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: firecrawl-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        REDIS_URL: "redis://:{{ .DRAGONFLY_PASSWORD }}@dragonfly.database.svc.cluster.local:6379/4"
        REDIS_RATE_LIMIT_URL: "redis://:{{ .DRAGONFLY_PASSWORD }}@dragonfly.database.svc.cluster.local:6379/4"
        NUQ_DATABASE_URL: "postgresql://firecrawlusr:{{ .FIRECRAWL_POSTGRESQL_PASSWORD | urlquery }}@firecrawl-postgres-rw.hermes-agent.svc.cluster.local:5432/firecrawl"
  dataFrom:
    - extract:
        key: dragonfly
    - extract:
        key: firecrawl
