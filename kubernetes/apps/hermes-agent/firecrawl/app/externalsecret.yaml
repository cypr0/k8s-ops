---
# Main Firecrawl app secret: Redis (Dragonfly, reusing the same shared
# instance every other app already uses -- key db index /4 is currently
# unused, see whiteboard's /3 for the established "give it its own index"
# pattern) and the Postgres connection string for the "firecrawl" database
# on the SHARED CNPG cluster (kubernetes/apps/database/cloudnative-pg/ --
# see database-firecrawl.yaml/externalsecret-firecrawl.yaml there for the
# managed role). PGPASSWORD is a bare copy of the same password, for the
# schema-init Job and maintenance CronJobs, which use psql env vars
# directly rather than a single DSN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: firecrawl-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: firecrawl-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        REDIS_URL: "redis://:{{ .DRAGONFLY_PASSWORD }}@dragonfly.database.svc.cluster.local:6379/4"
        REDIS_RATE_LIMIT_URL: "redis://:{{ .DRAGONFLY_PASSWORD }}@dragonfly.database.svc.cluster.local:6379/4"
        NUQ_DATABASE_URL: "postgresql://firecrawlusr:{{ .FIRECRAWL_POSTGRESQL_PASSWORD | urlquery }}@postgres-rw.database.svc.cluster.local:5432/firecrawl"
        PGPASSWORD: "{{ .FIRECRAWL_POSTGRESQL_PASSWORD }}"
  dataFrom:
    - extract:
        key: dragonfly
    - extract:
        key: firecrawl
