---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
#
# Dedicated CNPG cluster for Firecrawl's "nuq" job queue -- deliberately NOT
# a database on the shared kubernetes/apps/database/cloudnative-pg cluster:
# nuq needs pg_cron preloaded at the Postgres-server level
# (shared_preload_libraries), which the shared cluster's stock
# ghcr.io/cloudnative-pg/postgresql image doesn't ship, and there's no image-
# build/push pipeline in this repo to produce a custom one. Rather than
# touching shared_preload_libraries (and restarting) on the cluster every
# other app depends on just for Firecrawl, this is its own small, isolated
# CNPG cluster on the SAME image as the shared one (so no custom image
# needed here either) -- and pg_cron's own scheduled maintenance queries are
# replaced with plain k8s CronJobs instead (see cronjob-nuq-maintenance.yaml).
#
# Single instance, no backup plugin: this only holds in-flight/queued crawl
# jobs, not durable data -- losing it just means in-flight scrapes need to be
# re-submitted, not a real data-loss event worth 3x-ing the resource cost or
# wiring up barman-cloud for.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: firecrawl-postgres
spec:
  instances: 1
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4@sha256:2b124b4c9e9710a449b868fc72ae59bcb2907386d48ddb3e7a7f82491ac0d1e1

  enableSuperuserAccess: true

  storage:
    size: 5Gi
    storageClass: zfs-nfs

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

  managed:
    roles:
      - name: firecrawlusr
        ensure: present
        login: true
        superuser: false
        createdb: false
        createrole: false
        inherit: true
        passwordSecret:
          name: firecrawl-db-role

  monitoring:
    enablePodMonitor: true
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: firecrawl
spec:
  name: firecrawl
  owner: firecrawlusr
  encoding: UTF8
  cluster:
    name: firecrawl-postgres
