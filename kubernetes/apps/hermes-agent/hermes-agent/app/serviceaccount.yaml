---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-agent
  labels:
    app.kubernetes.io/name: hermes-agent
# Needed so `kubectl` (installed by the tools-install init container, see
# deployment.yaml) can authenticate to the API server in-cluster -- bound
# read-only to the built-in `view` ClusterRole, see rbac.yaml.
automountServiceAccountToken: true
