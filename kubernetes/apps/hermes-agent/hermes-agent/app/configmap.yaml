---
# Bootstrap config.yaml, copied into HERMES_HOME by the bootstrap-config
# init container (deployment.yaml) on every pod start. This is the full set
# of values -- the upstream chart's own defaults (agent/terminal/display/
# browser/compression) merged with our two overrides (model.default,
# security.tirith_fail_open) that Helm's values-merge used to do implicitly.
# Made explicit here on purpose: no hidden chart defaults left to track down.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-config
  labels:
    app.kubernetes.io/name: hermes-agent
data:
  config.yaml: |-
    model:
      # Was mistralai/mistral-small-3.2-24b-instruct on OpenRouter's shared
      # free-tier pool -- found (2026-08-09) to repeatedly hit 429 rate
      # limits and return garbled/truncated tool-call names under load,
      # which burned the full agent.max_turns budget on a stuck retry loop
      # (15-40 min) before falling back to a forced summary -- the LLM then
      # filled that forced summary with invented excuses ("market closed",
      # "no API access") instead of reporting the real tool failure. Moved
      # to the paid mistral-medium-3.1 tier to fix the reliability problem
      # at the source rather than paper over the symptom.
      default: mistralai/mistral-medium-3.1
      provider: auto
      base_url: https://openrouter.ai/api/v1
    agent:
      # Lowered from 90: bounds worst-case stuck-loop time if a bad
      # tool-call round still happens, without cutting off legitimate
      # multi-step research (get_news/get_fundamentals across a few
      # candidates rarely needs more than ~20-30 turns in practice).
      max_turns: 45
      gateway_timeout: 1800
      restart_drain_timeout: 60
      tool_use_enforcement: auto
    terminal:
      backend: local
      cwd: .
      timeout: 180
    display:
      tool_progress: all
      interim_assistant_messages: true
    browser:
      inactivity_timeout: 120
      command_timeout: 30
      allow_private_urls: false
    compression:
      enabled: true
      threshold: 0.5
      target_ratio: 0.2
      protect_last_n: 20
    security:
      redact_secrets: true
      tirith_enabled: true
      # Upstream default is `true` (fail OPEN: an errored guardrail check
      # lets the action through). This agent has shell + WhatsApp + a
      # read-only k8s view, so flip to fail-closed instead.
      tirith_fail_open: false
    # Self-hosted Firecrawl (kubernetes/apps/hermes-agent/firecrawl/) as the
    # web-search/scrape/extract backend -- FIRECRAWL_API_URL (deployment.yaml)
    # points at it; no API key needed since USE_DB_AUTHENTICATION=false there
    # and it's only reachable from this namespace (see its CiliumNetworkPolicy).
    web:
      backend: firecrawl
    # Local, no-API-key voice loop: Edge TTS (Microsoft's free network TTS,
    # german voice since this agent's owner writes in German over WhatsApp)
    # for the "tts" toolset's replies, faster-whisper (CPU, no GPU in this
    # cluster) for transcribing incoming WhatsApp voice notes before the LLM
    # ever sees them. Both packages are installed onto the shared volume by
    # the tools-install init container (deployment.yaml) rather than baked
    # into the image. "base" model: reasonable speed/accuracy default for
    # CPU-only inference -- revisit if transcription proves too slow/coarse.
    tts:
      provider: "edge"
      speed: 1.0
      edge:
        voice: "de-DE-KatjaNeural"
        speed: 1.0
    stt:
      enabled: true
      provider: "local"
      language: "de"
      local:
        model: "base"
        language: ""
    # In-cluster-only webhook receiver (service.yaml exposes port 8644,
    # ciliumnetworkpolicy.yaml restricts ingress to paperless-ngx's pod).
    # `routes` has no env-var equivalent, so it's declared here -- but
    # `enabled`/`port`/`secret` DO have one (WEBHOOK_ENABLED/_PORT/_SECRET,
    # deployment.yaml) and MUST be set that way instead of inline here:
    # gateway/config.py only ever *merges* WEBHOOK_SECRET into this route's
    # secret as a fallback default (`route.get("secret", self._global_secret)`)
    # when the route itself has no `secret` key at all -- a templated
    # env-var placeholder inline here would NOT get expanded (confirmed
    # live: hermes-agent's generic `_expand_env_vars` helper
    # exists but the gateway's own config-loading path never calls it on
    # platforms.*.extra) and would be used byte-for-byte as the actual
    # HMAC secret, breaking auth silently rather than failing loudly.
    # Paperless's own Workflow "Webhook" action (kubernetes/apps/paperless/
    # paperless-ngx/) sends this same secret back as a plain `X-Gitlab-Token`
    # header -- that comparison mode (vs. a computed HMAC signature) is the
    # only one a static, non-computed header value can satisfy.
    #
    # GOTCHA (confirmed live 2026-08-15, not obvious from either side's
    # config): the Paperless Workflow action itself lives in Paperless's own
    # database, not in this repo (created via nested POST to /api/workflows/,
    # see project memory) -- but its `webhook.as_json` flag MUST be `false`.
    # Paperless's send_webhook() (documents/workflows/webhooks.py) does
    # `post_args["json"] = data` when as_json=true, and `data` here is
    # already the Jinja2-rendered body STRING (e.g. `{"document_id": 123}`
    # as text, not a dict) -- httpx then json.dumps()'s that string AGAIN,
    # double-encoding it into a quoted/escaped JSON string. This gateway's
    # own `json.loads(raw_body)` then returns a Python str, not a dict, and
    # `payload.get("event_type", ...)` blows up with
    # `AttributeError: 'str' object has no attribute 'get'` -- silently
    # swallowing every single webhook call (no Telegram message, no error
    # visible anywhere except this pod's own logs). With as_json=false,
    # Paperless sends the already-JSON body string verbatim as raw content,
    # which this gateway's json.loads() parses correctly.
    platforms:
      webhook:
        extra:
          routes:
            paperless-document-added:
              deliver: telegram
              deliver_only: false
              prompt: |
                Ein neues Dokument wurde in Paperless-ngx hinzugefügt (Dokument-ID {document_id}).

                Die paperless-mcp-Tools sind nicht direkt sichtbar -- erst per tool_search
                auffindbar (232 Tools insgesamt, viele mit überlappenden Namens-Präfixen,
                z.B. "get_document" vs. "get_document_type"/"_metadata"/"_notes"/"_version"
                -- bei mehrdeutigen Treffern IMMER den kürzesten, exakt passenden Namen ohne
                Suffix wählen, notfalls tool_search mit höherem limit erneut aufrufen).
                WICHTIG beim Aufruf von tool_call: das Argument-Objekt MUSS unter dem
                Schlüssel "arguments" übergeben werden, NICHT "parameters" -- sonst werden
                die Werte stillschweigend verworfen und Pflichtfelder (z.B. document_id)
                kommen leer an, ohne dass ein Fehler das sofort erkennen lässt.

                Nutze die paperless-mcp-Tools:
                1. get_document(document_id={document_id}) für Volltext + Metadaten
                   (NICHT get_document_type/_metadata/_notes/_version). Merke dir daraus
                   den aktuellen Stand von tags/correspondent/document_type -- Schritt 3
                   darf einen bereits gesetzten correspondent oder document_type NICHT
                   überschreiben, nur einen leeren (null) Wert setzen; Tags werden
                   ohnehin nur ergänzt, nie ersetzt oder entfernt.
                2. list_custom_fields(), um die aktuellen IDs der Felder
                   "Rechnungsbetrag" und "Steuerjahr" (beide existieren bereits,
                   NICHT neu anlegen), "faelligkeitsdatum", "vertragsende" und
                   "kuendigungsfrist_datum" nachzuschlagen -- IDs nicht raten,
                   immer frisch nachschlagen.
                3. Tags/Korrespondent/Dokumententyp zuweisen -- IMMER anhand des
                   VORHANDENEN Bestands, nie blind neu erfinden:
                   a. list_tags(page_size=200), list_correspondents(page_size=200) und
                      list_document_types(page_size=200) laden (bei mehr Treffern als
                      page_size weitere Seiten nachladen) -- das ist der vollständige
                      aktuelle Bestand, gegen den abgeglichen wird.
                   b. Passende Tags (mehrere möglich) aus diesem Bestand auswählen und
                      per modify_documents_tags(document_ids=[{document_id}],
                      add_tag_ids=[...]) ERGÄNZEND hinzufügen (add_tag_ids, nie
                      remove_tag_ids -- bestehende Tags, auch der automatische
                      Inbox-Tag aus dem "Neue Dokumente markieren"-Workflow, bleiben
                      unangetastet). Neuen Tag NUR per create_tag(...) anlegen, wenn
                      der Abgleich gegen den kompletten Bestand aus 3a zweifelsfrei
                      ergeben hat, dass weder ein gleichlautender noch ein ähnlicher
                      Tag existiert (Groß-/Kleinschreibung, Singular/Plural, Synonyme,
                      Abkürzungen wie "Rech." vs. "Rechnung" zählen als ähnlich -- im
                      Zweifel den vorhandenen Tag verwenden statt neu anzulegen).
                   c. Passenden Korrespondenten aus dem Bestand auswählen und NUR
                      falls in get_document (Schritt 1) noch keiner gesetzt ist per
                      set_documents_correspondent(document_ids=[{document_id}],
                      correspondent_id=...) setzen. Neuen Korrespondenten NUR per
                      create_correspondent(...) anlegen, wenn der Abgleich zweifelsfrei
                      ergeben hat, dass kein gleichlautender oder ähnlicher existiert
                      (Rechtsform-Zusätze wie GmbH/AG/e.V./Inc./Ltd., Groß-/
                      Kleinschreibung, Adress-/Filial-Zusätze zählen als ähnlich --
                      "Telekom Deutschland GmbH" und "Telekom" sind derselbe
                      Korrespondent, nicht zwei).
                   d. Passenden Dokumententyp aus dem Bestand auswählen und NUR falls
                      in get_document (Schritt 1) noch keiner gesetzt ist per
                      set_documents_document_type(document_ids=[{document_id}],
                      document_type_id=...) setzen. Dokumententypen werden NIEMALS neu
                      angelegt (create_document_type NIE aufrufen) -- es MUSS immer
                      einer der vorhandenen Typen aus 3a gewählt werden, auch wenn
                      keiner perfekt passt (dann den am ehesten passenden nehmen,
                      niemals null lassen oder einen neuen Typ erfinden).
                4. Titel vergeben, falls der aktuelle Titel (aus get_document, Schritt 1)
                   generisch/wenig aussagekräftig ist (z.B. ein reiner Zahlen-/
                   Dateiname-Rest wie "0000966", ein automatisch übernommener
                   Scanner-/Consumption-Dateiname o.ä. -- KEIN Titel, der bereits
                   inhaltlich sinnvoll ist, z.B. von Paperless selbst aus dem
                   Dateinamen oder einer OCR-Titelerkennung übernommen wurde -- den
                   NICHT überschreiben). Format: "<Dokumententyp> – <Korrespondent> –
                   <Datum>" (Dokumententyp/Korrespondent aus Schritt 3, Datum im
                   Format YYYY-MM-DD aus dem im Dokument erkannten Dokumentdatum --
                   jeden der drei Teile weglassen, der nicht sicher bekannt ist; bei
                   nur einem bekannten Teil reicht auch nur dieser als Titel). Der neue
                   Titel wird zusammen mit den custom_fields in Schritt 6 per
                   update_document(title=...) gesetzt, NICHT per einem eigenen Aufruf.
                5. Extrahiere, falls jeweils zutreffend (sonst weglassen, nicht raten):
                   - Rechnungsbetrag: Rechnungsbetrag als Zahl (nur bei Rechnungen)
                   - faelligkeitsdatum: Fälligkeitsdatum, Format YYYY-MM-DD (nur bei Rechnungen)
                   - vertragsende: Vertragsende, Format YYYY-MM-DD (nur bei Verträgen/Abos)
                   - kuendigungsfrist_datum: spätestes Datum für eine fristgerechte
                     Kündigung, berechnet aus der im Dokument genannten Kündigungsfrist
                     und vertragsende (nur bei Verträgen/Abos mit erkennbarer Frist)
                   - Steuerjahr: das Kalenderjahr, dem das Dokument steuerlich
                     zuzuordnen ist, als Zahl (z.B. 2026) -- bei praktisch jedem
                     Dokument mit erkennbarem Bezugsjahr sinnvoll (nicht nur
                     Rechnungen/Verträge), i.d.R. das Jahr des Dokumentendatums;
                     bei erkennbar rückwirkendem Bezug (z.B. Jahresabrechnung für
                     das VORJAHR) das tatsächlich betroffene Jahr nehmen, nicht
                     das Dokumentendatum
                6. Schreibe die zutreffenden Felder sowie ggf. den neuen Titel aus
                   Schritt 4 per update_document(document_id=..., title=...,
                   custom_fields=[...]) zurück (NICHT update_document_type/_version;
                   title weglassen, wenn Schritt 4 den Titel unverändert lässt).
                   WICHTIG: custom_fields bei update_document ist eine VOLLSTÄNDIGE
                   Ersetzung, keine additive Aktualisierung -- jedes existierende
                   custom_fields-Element aus der get_document-Antwort in Schritt 1
                   MUSS unverändert im custom_fields-Array dieses Aufrufs enthalten
                   sein, zusammen mit den neu erkannten Werten, sonst gehen bereits
                   gesetzte Werte anderer Felder verloren (bereits live passiert:
                   ein Dokument mit vorhandenem Rechnungsbetrag/Steuerjahr verlor
                   beide, weil nur die neu erkannten Felder übergeben wurden).
                7. UNABHÄNGIG davon, ob Schritt 6 tatsächlich etwas geschrieben hat
                   (auch wenn die Custom Fields bereits vorher korrekt gesetzt waren --
                   das entscheidet NICHT, ob schon ein Kalendertermin existiert):
                   falls faelligkeitsdatum oder kuendigungsfrist_datum erkannt wurden,
                   lege dafür je einen ganztägigen Termin im "personal"-Kalender an
                   (sogo-mcp create_event, all_day=true):
                   - faelligkeitsdatum: Titel "Fällig: <Dokumenttitel>"
                   - kuendigungsfrist_datum: Titel "Kündigungsfrist: <Dokumenttitel>"
                   Beschreibung jeweils: "Automatisch erstellt aus Paperless-Dokument
                   #{document_id}. Bei Fehlern: Termin einfach löschen, betrifft nicht
                   das Paperless-Dokument." -- das macht Fehlextraktionen leicht
                   erkennbar und risikolos rückgängig zu machen. Entscheidungsregel:
                   rufe list_events() für genau dieses eine Datum auf -- taucht darin
                   BEREITS ein Termin mit demselben Titel auf, nichts weiter tun;
                   TAUCHT KEINER AUF (Normalfall, auch wenn die Custom Fields schon
                   vorher gesetzt waren), dann create_event() jetzt aufrufen, nicht
                   überspringen.
                8. WICHTIG, live beobachteter Fehler: schreibe in der finalen Antwort
                   NIEMALS eine Zuweisung, einen neuen Titel, einen neu angelegten Tag/
                   Korrespondenten oder einen Custom-Field-Wert, den du nicht in DIESEM
                   Durchlauf tatsächlich per echtem tool_call (create_tag,
                   create_correspondent, set_documents_correspondent,
                   set_documents_document_type, modify_documents_tags, update_document)
                   ausgeführt hast -- eine Behauptung ohne vorherigen echten Tool-Aufruf
                   ist ein Fehler, kein gültiger Abschluss. Führe also ERST alle in den
                   Schritten 3-6 als nötig erkannten Tool-Aufrufe wirklich aus, bevor du
                   antwortest.
                9. Antworte am Ende NUR mit maximal 3 kurzen Sätzen, was du erkannt,
                   eingetragen, getaggt/zugeordnet, ggf. umbenannt und ggf. terminiert
                   hast (oder dass nichts Relevantes gefunden wurde).
    # Remote HTTP MCP servers giving this agent the SAME Paperless-ngx and
    # Nextcloud API coverage the paperless_full/nextcloud_full Open WebUI
    # Tools have -- see kubernetes/apps/hermes-agent/{paperless-mcp,
    # nextcloud-mcp}/. Both run as real
    # admin/full-access credentials on their own end (see each server's
    # nextcloud_full.py/paperless_full.py module docstring for the exact
    # scope/tradeoffs), so treat every tool call through them with the
    # same care as a direct API call would deserve. sogo (kubernetes/apps/
    # hermes-agent/sogo-mcp/) is the same story with the owner's real
    # Netcup-hosted SOGo calendar/mailbox account.
    mcp_servers:
      paperless:
        url: "http://paperless-mcp.hermes-agent.svc.cluster.local:8000/mcp"
      nextcloud:
        url: "http://nextcloud-mcp.hermes-agent.svc.cluster.local:8000/mcp"
      sogo:
        url: "http://sogo-mcp.hermes-agent.svc.cluster.local:8000/mcp"
