---
# Bootstrap config.yaml, copied into HERMES_HOME by the bootstrap-config
# init container (deployment.yaml) on every pod start. This is the full set
# of values -- the upstream chart's own defaults (agent/terminal/display/
# browser/compression) merged with our two overrides (model.default,
# security.tirith_fail_open) that Helm's values-merge used to do implicitly.
# Made explicit here on purpose: no hidden chart defaults left to track down.
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-agent-config
  labels:
    app.kubernetes.io/name: hermes-agent
data:
  config.yaml: |-
    model:
      # Was mistralai/mistral-small-3.2-24b-instruct on OpenRouter's shared
      # free-tier pool -- found (2026-08-09) to repeatedly hit 429 rate
      # limits and return garbled/truncated tool-call names under load,
      # which burned the full agent.max_turns budget on a stuck retry loop
      # (15-40 min) before falling back to a forced summary -- the LLM then
      # filled that forced summary with invented excuses ("market closed",
      # "no API access") instead of reporting the real tool failure. Moved
      # to the paid mistral-medium-3.1 tier to fix the reliability problem
      # at the source rather than paper over the symptom.
      default: mistralai/mistral-medium-3.1
      provider: auto
      base_url: https://openrouter.ai/api/v1
    agent:
      # Lowered from 90: bounds worst-case stuck-loop time if a bad
      # tool-call round still happens, without cutting off legitimate
      # multi-step research (get_news/get_fundamentals across a few
      # candidates rarely needs more than ~20-30 turns in practice).
      max_turns: 45
      gateway_timeout: 1800
      restart_drain_timeout: 60
      tool_use_enforcement: auto
    terminal:
      backend: local
      cwd: .
      timeout: 180
    display:
      tool_progress: all
      interim_assistant_messages: true
    browser:
      inactivity_timeout: 120
      command_timeout: 30
      allow_private_urls: false
    compression:
      enabled: true
      threshold: 0.5
      target_ratio: 0.2
      protect_last_n: 20
    security:
      redact_secrets: true
      tirith_enabled: true
      # Upstream default is `true` (fail OPEN: an errored guardrail check
      # lets the action through). This agent has shell + WhatsApp + a
      # read-only k8s view, so flip to fail-closed instead.
      tirith_fail_open: false
    # Self-hosted Firecrawl (kubernetes/apps/hermes-agent/firecrawl/) as the
    # web-search/scrape/extract backend -- FIRECRAWL_API_URL (deployment.yaml)
    # points at it; no API key needed since USE_DB_AUTHENTICATION=false there
    # and it's only reachable from this namespace (see its CiliumNetworkPolicy).
    web:
      backend: firecrawl
    # Local, no-API-key voice loop: Edge TTS (Microsoft's free network TTS,
    # german voice since this agent's owner writes in German over WhatsApp)
    # for the "tts" toolset's replies, faster-whisper (CPU, no GPU in this
    # cluster) for transcribing incoming WhatsApp voice notes before the LLM
    # ever sees them. Both packages are installed onto the shared volume by
    # the tools-install init container (deployment.yaml) rather than baked
    # into the image. "base" model: reasonable speed/accuracy default for
    # CPU-only inference -- revisit if transcription proves too slow/coarse.
    tts:
      provider: "edge"
      speed: 1.0
      edge:
        voice: "de-DE-KatjaNeural"
        speed: 1.0
    stt:
      enabled: true
      provider: "local"
      language: "de"
      local:
        model: "base"
        language: ""
    # In-cluster-only webhook receiver (service.yaml exposes port 8644,
    # ciliumnetworkpolicy.yaml restricts ingress to paperless-ngx's pod).
    # `routes` has no env-var equivalent (only enabled/host/port/secret do)
    # so the whole platforms.webhook block lives here rather than split
    # across config.yaml + deployment.yaml like WhatsApp/Telegram are.
    # secret uses ${VAR} substitution (confirmed supported by hermes-agent's
    # own config loader) so the actual value stays in the ExternalSecret,
    # not committed here. Paperless's own Workflow "Webhook" action (see
    # kubernetes/apps/paperless/paperless-ngx/) must send the SAME secret
    # value as a plain `X-Gitlab-Token` header -- that comparison mode
    # (vs. a computed HMAC signature) is the only one a static, non-
    # computed header value can satisfy.
    platforms:
      webhook:
        enabled: true
        extra:
          host: "0.0.0.0"
          port: 8644
          routes:
            paperless-document-added:
              secret: "${WEBHOOK_SHARED_SECRET}"
              deliver: telegram
              deliver_only: false
              prompt: |
                Ein neues Dokument wurde in Paperless-ngx hinzugefügt (Dokument-ID {document_id}).

                Nutze die paperless-mcp-Tools:
                1. get_document(document_id={document_id}) für Volltext + Metadaten.
                2. list_custom_fields(), um die aktuellen IDs der Felder
                   "Rechnungsbetrag" (existiert bereits, NICHT neu anlegen),
                   "faelligkeitsdatum", "vertragsende" und "kuendigungsfrist_datum"
                   nachzuschlagen -- IDs nicht raten, immer frisch nachschlagen.
                3. Extrahiere, falls jeweils zutreffend (sonst weglassen, nicht raten):
                   - Rechnungsbetrag: Rechnungsbetrag als Zahl (nur bei Rechnungen)
                   - faelligkeitsdatum: Fälligkeitsdatum, Format YYYY-MM-DD (nur bei Rechnungen)
                   - vertragsende: Vertragsende, Format YYYY-MM-DD (nur bei Verträgen/Abos)
                   - kuendigungsfrist_datum: spätestes Datum für eine fristgerechte
                     Kündigung, berechnet aus der im Dokument genannten Kündigungsfrist
                     und vertragsende (nur bei Verträgen/Abos mit erkennbarer Frist)
                4. Schreibe die zutreffenden Felder per update_document(document_id=...,
                   custom_fields=[...]) zurück -- nur die neu erkannten Werte, andere
                   bereits gesetzte Custom Fields nicht überschreiben.
                5. Antworte am Ende NUR mit maximal 2 kurzen Sätzen, was du erkannt und
                   eingetragen hast (oder dass nichts Relevantes gefunden wurde).
    # Remote HTTP MCP servers giving this agent the SAME Paperless-ngx and
    # Nextcloud API coverage the paperless_full/nextcloud_full Open WebUI
    # Tools have -- see kubernetes/apps/hermes-agent/{paperless-mcp,
    # nextcloud-mcp}/. Both run as real
    # admin/full-access credentials on their own end (see each server's
    # nextcloud_full.py/paperless_full.py module docstring for the exact
    # scope/tradeoffs), so treat every tool call through them with the
    # same care as a direct API call would deserve.
    mcp_servers:
      paperless:
        url: "http://paperless-mcp.hermes-agent.svc.cluster.local:8000/mcp"
      nextcloud:
        url: "http://nextcloud-mcp.hermes-agent.svc.cluster.local:8000/mcp"
