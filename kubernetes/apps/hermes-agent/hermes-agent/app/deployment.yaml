---
# Hand-rolled instead of using the ultraworkers/hermes-agent-helm-chart's
# own Deployment template: that chart is young (3.5 months old), unofficial,
# and both its default image tag and its ExternalSecret apiVersion turned
# out to be wrong on first real deploy. We already hand-roll RBAC/CNP/
# ExternalSecret around it anyway, and this app's actual container spec is
# simple enough that the chart wasn't buying us much abstraction -- this
# mirrors (the working parts of) upstream's templates/deployment.yaml.
#
# NOTE: this ConfigMap is a plain resource, not hash-suffixed -- editing
# config.yaml does NOT automatically roll the pod. Run
# `kubectl rollout restart deployment/hermes-agent -n hermes-agent` after
# changing configmap.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  labels:
    app.kubernetes.io/name: hermes-agent
spec:
  replicas: 1
  # HERMES_HOME holds mutable state (config, WhatsApp session, memory) on a
  # ReadWriteOnce PVC -- must stay single-replica, Recreate (not
  # RollingUpdate) so the old and new pod are never both attached at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
    spec:
      serviceAccountName: hermes-agent
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Seeds HERMES_HOME/config.yaml from the ConfigMap on every start
        # (always-overwrite -- matches the chart's bootstrap.overwrite=true
        # default, since we want the ConfigMap to stay the single source of
        # truth rather than drifting from whatever the running agent wrote
        # back to its own config at runtime).
        - name: bootstrap-config
          image: &image nousresearch/hermes-agent:v2026.7.7.2
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu
              mkdir -p /opt/data/home
              cp /bootstrap/config.yaml /opt/data/config.yaml
              # The `hermes whatsapp` pairing CLI writes its session to
              # /opt/data/whatsapp/session, but the gateway process checks
              # for creds at /opt/data/platforms/whatsapp/session/creds.json
              # -- a real path inconsistency in the app itself (confirmed:
              # gateway logged "not paired" even with a valid session
              # present at the CLI's path, until this symlink was added).
              # -sfn: safe to re-run every pod start.
              mkdir -p /opt/data/platforms
              ln -sfn /opt/data/whatsapp /opt/data/platforms/whatsapp
              # portfolio_price_check.py: `hermes cron create --script` only
              # accepts a path relative to ~/.hermes/scripts/ (confirmed
              # live: an absolute path, even one under HERMES_HOME, is
              # rejected with "Script path must be relative to
              # ~/.hermes/scripts/") -- and "~" here is $HOME
              # (/opt/data/home per the env var below), NOT $HERMES_HOME,
              # so this has to land under $HOME/.hermes/scripts, a
              # different subtree than config.yaml's own bootstrap target.
              mkdir -p /opt/data/home/.hermes/scripts
              cp /portfolio-script/portfolio_price_check.py /opt/data/home/.hermes/scripts/portfolio_price_check.py
              cp /cluster-health-script/cluster_health_check.py /opt/data/home/.hermes/scripts/cluster_health_check.py
              # cluster_health_check.py's cron job runs with --no-agent
              # (no LLM involved -- see the job's own creation command),
              # and --no-agent resolves its --script path from
              # $HERMES_HOME/scripts/ instead of $HOME/.hermes/scripts/ --
              # confirmed live: "hermes cron run" failed with "Script not
              # found: /opt/data/scripts/cluster_health_check.py" until a
              # copy existed at that exact path too. A DIFFERENT directory
              # convention than agent-mode scripts (comment above), not
              # documented in `hermes cron create --help`.
              mkdir -p /opt/data/scripts
              cp /cluster-health-script/cluster_health_check.py /opt/data/scripts/cluster_health_check.py
          env:
            - name: HERMES_HOME
              value: &home /opt/data
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: portfolio-script
              mountPath: /portfolio-script
              readOnly: true
            - name: cluster-health-script
              mountPath: /cluster-health-script
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext: &initSecurityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
            seccompProfile:
              type: RuntimeDefault
        # Curated, reviewable tool installation -- the safer alternative to
        # giving the running agent sudo/root. An init container's root
        # filesystem is NOT shared with the main container, only volume
        # mounts are -- so anything installed here must land on the shared
        # /opt/data volume (not /usr/*) to be visible to the main container.
        # kubectl is what gives the agent's "terminal" tool a way to
        # actually use the read-only RBAC granted in rbac.yaml (RBAC alone
        # is just permission, not an interface). Add further tools the same
        # way, one reviewable diff at a time.
        - name: tools-install
          image: *image
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu
              mkdir -p /opt/data/tools/bin
              # kubectl v1.36.2, linux/amd64 -- checksum from
              # https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl.sha256
              # Bump both the version and this checksum together on upgrade.
              curl -fsSL -o /tmp/kubectl \
                https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl
              echo "1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82  /tmp/kubectl" | sha256sum -c -
              install -m 0755 /tmp/kubectl /opt/data/tools/bin/kubectl
              # edge-tts (TTS) + faster-whisper (local STT): confirmed present
              # in hermes-agent's own pyproject.toml as the "edge-tts"/"voice"
              # extras, but not installed into the image's baked-in venv --
              # `uv pip install --target=` lands pure files on the shared
              # volume (confirmed working, unlike a venv/site-packages install
              # which lives on the main container's own, unshared rootfs and
              # would be wiped every pod restart); main container adds this
              # to PYTHONPATH. Versions pinned to match pyproject.toml's
              # extras exactly. sounddevice (mic capture for interactive CLI
              # push-to-talk) deliberately omitted -- this pod has no audio
              # device, voice messages arrive as files via the WhatsApp
              # bridge instead. --no-cache: uv's default cache dir isn't on
              # a writable path under this container's readOnlyRootFilesystem
              # (confirmed: "Failed to initialize cache at /.cache/uv ...
              # Read-only file system"); this container only ever runs this
              # install once per pod start anyway, so a warm cache buys
              # nothing.
              uv pip install --no-cache --target=/opt/data/tools/pip \
                edge-tts==7.2.7 \
                faster-whisper==1.2.1
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
          securityContext: *initSecurityContext
      containers:
        - name: hermes-agent
          image: *image
          args:
            - gateway
            - run
          workingDir: /opt/hermes
          env:
            - name: HERMES_HOME
              value: *home
            - name: HOME
              value: /opt/data/home
            # Base image has no /etc/localtime/TZ set (confirmed: `date`
            # showed UTC), so every "0 7 * * *"-style cron schedule was
            # firing 2h later than its wall-clock reading implied. TZ
            # fixes the OS-level clock, but hermes_time.py's own
            # documented resolution order for CRON scheduling specifically
            # is HERMES_TIMEZONE env var > config.yaml's `timezone` key >
            # server-local fallback -- setting BOTH is redundant-safe:
            # HERMES_TIMEZONE is the authoritative one hermes's own cron
            # engine reads, TZ covers everything else (log timestamps,
            # date-parsing in tool calls, etc). Handles CET/CEST DST
            # switching automatically going forward either way.
            - name: TZ
              value: "Europe/Berlin"
            - name: HERMES_TIMEZONE
              value: "Europe/Berlin"
            # Exposes whatever tools-install placed on the shared volume.
            # Must repeat the image's OWN bin dirs too -- setting PATH via
            # env replaces the image's built-in PATH, it doesn't extend it.
            # /opt/hermes/bin (and the venv) is where the `hermes` CLI
            # itself lives (confirmed via `find` in the running container:
            # /opt/hermes/bin/hermes) -- omitting it broke
            # `kubectl exec ... -- hermes whatsapp` with "executable file
            # not found in $PATH".
            - name: PATH
              value: "/opt/data/tools/bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            # edge-tts/faster-whisper, installed by tools-install onto the
            # shared volume (see that init container's comment) rather than
            # into the venv itself. python -- unlike a PATH-found executable
            # -- does NOT automatically extend its own search path from
            # sys.prefix, so this needs to be explicit.
            - name: PYTHONPATH
              value: "/opt/data/tools/pip"
            - name: WEB_TOOLS_DEBUG
              value: "false"
            - name: VISION_TOOLS_DEBUG
              value: "false"
            - name: MOA_TOOLS_DEBUG
              value: "false"
            - name: IMAGE_TOOLS_DEBUG
              value: "false"
            - name: HERMES_HUMAN_DELAY_MODE
              value: "off"
            - name: HERMES_HUMAN_DELAY_MIN_MS
              value: "800"
            - name: HERMES_HUMAN_DELAY_MAX_MS
              value: "2500"
            - name: GATEWAY_ALLOW_ALL_USERS
              value: "false"
            # Self-hosted Firecrawl web-search/scrape/extract backend --
            # see config.yaml's web.backend and kubernetes/apps/hermes-agent/
            # firecrawl/. No API key: USE_DB_AUTHENTICATION=false there,
            # gated by network policy instead (only this namespace can reach it).
            - name: FIRECRAWL_API_URL
              value: "http://firecrawl-api.hermes-agent.svc.cluster.local:3002"
            # Browser toolset (already enabled by default, see config.yaml's
            # browser: section) -- agent-browser and a matching Chrome for
            # Testing binary both already ship inside the image
            # (/opt/hermes/.playwright/chromium_headless_shell-*/), but
            # agent-browser's own auto-detection doesn't look there, so it
            # needs pointing at it explicitly. Confirmed working via
            # `agent-browser open`/`snapshot` in this exact container. The
            # "-1228" build number is this image's pinned Playwright
            # revision -- re-check the actual path (`find /opt/hermes/
            # .playwright`) after any *image* version bump, it can change
            # even though this file didn't.
            - name: AGENT_BROWSER_EXECUTABLE_PATH
              value: "/opt/hermes/.playwright/chromium_headless_shell-1228/chrome-headless-shell-linux64/chrome-headless-shell"
            - name: WHATSAPP_ENABLED
              value: "true"
            # self-chat: Hermes uses the owner's own linked WhatsApp session
            # (paired once via `kubectl exec ... -- hermes whatsapp`,
            # QR-code scan) rather than a separate bot number.
            - name: WHATSAPP_MODE
              value: "self-chat"
            # Phone number kept out of the public repo: read directly from
            # the cluster-secrets Secret (kubernetes/components/sops/
            # cluster-secrets.sops.yaml, key SECRET_HERMES_WHATSAPP_USER;
            # the sops Kustomize component copies it into this namespace).
            # Deliberately NOT using Flux's $${VAR} postBuild substitution
            # here -- when a field's entire value is a purely-numeric
            # substituted string, Flux/kustomize can render it as an
            # unquoted YAML number instead of a string, which the apiserver
            # then rejects for this string-typed field
            # ("expected string, got ...Value:4917662016474"). A real
            # secretKeyRef avoids that whole class of bug. Format per the
            # WhatsApp-specific setup docs is digits only, no leading "+".
            - name: WHATSAPP_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: cluster-secrets
                  key: SECRET_HERMES_WHATSAPP_USER
            # Telegram: activated for the document-pipeline/contract-
            # monitoring/finance-overview reminders (config.yaml's
            # platforms.webhook route + future crons deliver here). Same
            # self-chat pattern as WhatsApp -- one owner, own bot, no
            # separate allowed-user list needed. TELEGRAM_CHAT_ID is
            # purely-numeric like the WhatsApp phone number above, so it
            # gets the same secretKeyRef treatment (see that comment for
            # why: Flux $${VAR} substitution can turn an all-digit string
            # into an unquoted YAML number and fail apiserver validation).
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: TELEGRAM_CHAT_ID
            - name: TELEGRAM_HOME_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: TELEGRAM_CHAT_ID
            # In-cluster webhook platform (config.yaml's platforms.webhook) --
            # gateway/config.py reads WEBHOOK_ENABLED/_PORT/_SECRET directly
            # from the environment and merges them into the route config
            # config.yaml declares -- see that file's own comment for why
            # the secret specifically MUST come from here, not from a
            # $${VAR}-templated value inline in config.yaml.
            - name: WEBHOOK_ENABLED
              value: "true"
            - name: WEBHOOK_PORT
              value: "8644"
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: WEBHOOK_SHARED_SECRET
            # portfolio_price_check.py (cron script) connects via psycopg2.
            # connect() with no arguments, which reads these standard PG*
            # vars automatically -- no need to wire them through the
            # script's own argv/config.
            - name: PGHOST
              value: "postgres-rw.database.svc.cluster.local"
            - name: PGDATABASE
              value: "portfolio"
            - name: PGUSER
              value: "portfoliousr"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: PORTFOLIO_DB_PASSWORD
            - name: DISCORD_ALLOWED_USERS
              value: ""
            - name: DISCORD_HOME_CHANNEL
              value: ""
            - name: SLACK_ALLOWED_USERS
              value: ""
            - name: SIGNAL_ALLOWED_USERS
              value: ""
            - name: SIGNAL_GROUP_ALLOWED_USERS
              value: ""
          envFrom:
            - secretRef:
                name: hermes-agent-secrets
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          # Root, unrestricted: the image's entrypoint is s6-overlay, which
          # wants to own /run and write various runtime dirs at boot --
          # under non-root + readOnlyRootFilesystem it fails hard ("/run
          # belongs to uid 0 instead of 1000 ... lacking the privileges to
          # fix it"). Same tradeoff kubernetes/apps/openclaw and open-webui
          # already made for the same class of image; s6-overlay typically
          # drops privileges internally after its own bootstrap, so the
          # long-running hermes process itself may not stay root regardless.
          # The init containers above (which don't run s6-overlay) stay
          # fully hardened.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-data
        - name: bootstrap
          configMap:
            name: hermes-agent-config
        - name: portfolio-script
          configMap:
            name: hermes-agent-portfolio-script
        - name: cluster-health-script
          configMap:
            name: hermes-agent-cluster-health-script
        - name: tmp
          emptyDir: {}
        # Browser tool uses shared memory for headless rendering.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      terminationGracePeriodSeconds: 120
