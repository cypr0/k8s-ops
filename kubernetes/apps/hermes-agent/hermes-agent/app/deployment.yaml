---
# Hand-rolled instead of using the ultraworkers/hermes-agent-helm-chart's
# own Deployment template: that chart is young (3.5 months old), unofficial,
# and both its default image tag and its ExternalSecret apiVersion turned
# out to be wrong on first real deploy. We already hand-roll RBAC/CNP/
# ExternalSecret around it anyway, and this app's actual container spec is
# simple enough that the chart wasn't buying us much abstraction -- this
# mirrors (the working parts of) upstream's templates/deployment.yaml.
#
# NOTE: this ConfigMap is a plain resource, not hash-suffixed -- editing
# config.yaml does NOT automatically roll the pod. Run
# `kubectl rollout restart deployment/hermes-agent -n hermes-agent` after
# changing configmap.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  labels:
    app.kubernetes.io/name: hermes-agent
spec:
  replicas: 1
  # HERMES_HOME holds mutable state (config, WhatsApp session, memory) on a
  # ReadWriteOnce PVC -- must stay single-replica, Recreate (not
  # RollingUpdate) so the old and new pod are never both attached at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
    spec:
      serviceAccountName: hermes-agent
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Seeds HERMES_HOME/config.yaml from the ConfigMap on every start
        # (always-overwrite -- matches the chart's bootstrap.overwrite=true
        # default, since we want the ConfigMap to stay the single source of
        # truth rather than drifting from whatever the running agent wrote
        # back to its own config at runtime).
        - name: bootstrap-config
          image: &image nousresearch/hermes-agent:v2026.7.7.2
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu
              mkdir -p /opt/data/home
              cp /bootstrap/config.yaml /opt/data/config.yaml
              # The `hermes whatsapp` pairing CLI writes its session to
              # /opt/data/whatsapp/session, but the gateway process checks
              # for creds at /opt/data/platforms/whatsapp/session/creds.json
              # -- a real path inconsistency in the app itself (confirmed:
              # gateway logged "not paired" even with a valid session
              # present at the CLI's path, until this symlink was added).
              # -sfn: safe to re-run every pod start.
              mkdir -p /opt/data/platforms
              ln -sfn /opt/data/whatsapp /opt/data/platforms/whatsapp
          env:
            - name: HERMES_HOME
              value: &home /opt/data
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext: &initSecurityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
            seccompProfile:
              type: RuntimeDefault
        # Curated, reviewable tool installation -- the safer alternative to
        # giving the running agent sudo/root. An init container's root
        # filesystem is NOT shared with the main container, only volume
        # mounts are -- so anything installed here must land on the shared
        # /opt/data volume (not /usr/*) to be visible to the main container.
        # kubectl is what gives the agent's "terminal" tool a way to
        # actually use the read-only RBAC granted in rbac.yaml (RBAC alone
        # is just permission, not an interface). Add further tools the same
        # way, one reviewable diff at a time -- pip install --target=
        # /opt/data/tools/pip works too, if the image ships python3/pip
        # (unverified, the image is primarily Node-based).
        - name: tools-install
          image: *image
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu
              mkdir -p /opt/data/tools/bin /opt/data/tools/pip
              # kubectl v1.36.2, linux/amd64 -- checksum from
              # https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl.sha256
              # Bump both the version and this checksum together on upgrade.
              curl -fsSL -o /tmp/kubectl \
                https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl
              echo "1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82  /tmp/kubectl" | sha256sum -c -
              install -m 0755 /tmp/kubectl /opt/data/tools/bin/kubectl
              # Trading bot dependencies. `ensurepip` does NOT work here --
              # confirmed live: this image's ensurepip has no bundled wheel
              # file at all (no ensurepip/_bundled/), it builds one into a
              # tmpdir and then tries to install pip into the venv's own
              # site-packages, which fails under readOnlyRootFilesystem
              # ("Read-only file system: .../site-packages"). The official
              # PyPA get-pip.py bootstrapper avoids this entirely -- it
              # bundles pip internally and installs straight to --target
              # without touching the venv itself (confirmed live: installs
              # and imports cleanly). psycopg2-binary has a
              # cp313-manylinux2014_x86_64 wheel, no compiler needed -- the
              # image has no libpq/pg_config, so plain psycopg2 would fail.
              curl -fsSL -o /tmp/get-pip.py https://bootstrap.pypa.io/get-pip.py
              /opt/hermes/.venv/bin/python3 /tmp/get-pip.py --no-cache-dir \
                --target=/opt/data/tools/pip \
                psycopg2-binary==2.9.12 \
                requests==2.32.3
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
          securityContext: *initSecurityContext
        # Lays down the trading bot scripts (real .py files, see
        # trading-scripts/ + the configMapGenerator in kustomization.yaml),
        # runs the idempotent Postgres migration, registers the two cron
        # jobs exactly once each (state persists at /opt/data/cron/jobs.json
        # on the PVC), and idempotently appends the hard-rule briefing to
        # SOUL.md. Runs after tools-install (needs its pip packages) and
        # bootstrap-config (needs config.yaml/HERMES_HOME already seeded).
        - name: bootstrap-trading
          image: *image
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu
              mkdir -p /opt/data/scripts/trading/lib
              cp /trading-src/lib_init.py         /opt/data/scripts/trading/lib/__init__.py
              cp /trading-src/lib_constants.py    /opt/data/scripts/trading/lib/constants.py
              cp /trading-src/lib_db.py           /opt/data/scripts/trading/lib/db.py
              cp /trading-src/lib_kraken.py        /opt/data/scripts/trading/lib/kraken.py
              cp /trading-src/lib_alphavantage.py /opt/data/scripts/trading/lib/alphavantage.py
              cp /trading-src/check_positions.py     /opt/data/scripts/trading/check_positions.py
              cp /trading-src/check_data_quality.py  /opt/data/scripts/trading/check_data_quality.py
              cp /trading-src/cli.py                 /opt/data/scripts/trading/cli.py

              /opt/hermes/.venv/bin/python3 -c "
              import sys
              sys.path.insert(0, '/opt/data/scripts/trading')
              from lib import db
              db.migrate()
              print('trading DB migration OK')
              "

              if ! grep -q '"name": "trading-check-positions"' /opt/data/cron/jobs.json 2>/dev/null; then
                /opt/hermes/.venv/bin/hermes cron create "every 5m" \
                  --name trading-check-positions \
                  --script trading/check_positions.py \
                  --no-agent \
                  --deliver "whatsapp:$${TRADING_WHATSAPP_NUMBER}"
              fi
              if ! grep -q '"name": "trading-check-data-quality"' /opt/data/cron/jobs.json 2>/dev/null; then
                /opt/hermes/.venv/bin/hermes cron create "every 4h" \
                  --name trading-check-data-quality \
                  --script trading/check_data_quality.py \
                  --no-agent \
                  --deliver "whatsapp:$${TRADING_WHATSAPP_NUMBER}"
              fi

              if ! grep -q 'TRADING-BOT-BRIEFING v1' /opt/data/SOUL.md 2>/dev/null; then
                cat /trading-src/soul_briefing.md >> /opt/data/SOUL.md
              fi
          env:
            - name: HERMES_HOME
              value: *home
            - name: PYTHONPATH
              value: "/opt/data/tools/pip"
            # Same secret the main container's WHATSAPP_ALLOWED_USERS uses --
            # needed here to build the --deliver "whatsapp:<number>" string.
            - name: TRADING_WHATSAPP_NUMBER
              valueFrom:
                secretKeyRef:
                  name: cluster-secrets
                  key: SECRET_HERMES_WHATSAPP_USER
          envFrom:
            - secretRef:
                name: hermes-agent-postgres-credentials
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
            - name: trading-scripts
              mountPath: /trading-src
              readOnly: true
          securityContext: *initSecurityContext
      containers:
        - name: hermes-agent
          image: *image
          args:
            - gateway
            - run
          workingDir: /opt/hermes
          env:
            - name: HERMES_HOME
              value: *home
            - name: HOME
              value: /opt/data/home
            # Exposes whatever tools-install placed on the shared volume.
            # Must repeat the image's OWN bin dirs too -- setting PATH via
            # env replaces the image's built-in PATH, it doesn't extend it.
            # /opt/hermes/bin (and the venv) is where the `hermes` CLI
            # itself lives (confirmed via `find` in the running container:
            # /opt/hermes/bin/hermes) -- omitting it broke
            # `kubectl exec ... -- hermes whatsapp` with "executable file
            # not found in $PATH".
            - name: PATH
              value: "/opt/data/tools/bin:/opt/data/tools/pip/bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            # Deliberately NOT setting PYTHONPATH here (unlike PATH above):
            # it would apply to the long-running `hermes gateway run`
            # process itself, not just our own scripts -- risking our pinned
            # psycopg2-binary/requests shadowing Hermes' own internal
            # dependency versions (confirmed live: pip flagged a version
            # conflict between our requests==2.32.3 and Hermes' own pinned
            # requests==2.33.0). Each trading script instead does
            # `sys.path.insert(0, "/opt/data/tools/pip")` itself, scoped to
            # only that one-off subprocess.
            - name: WEB_TOOLS_DEBUG
              value: "false"
            - name: VISION_TOOLS_DEBUG
              value: "false"
            - name: MOA_TOOLS_DEBUG
              value: "false"
            - name: IMAGE_TOOLS_DEBUG
              value: "false"
            - name: HERMES_HUMAN_DELAY_MODE
              value: "off"
            - name: HERMES_HUMAN_DELAY_MIN_MS
              value: "800"
            - name: HERMES_HUMAN_DELAY_MAX_MS
              value: "2500"
            - name: GATEWAY_ALLOW_ALL_USERS
              value: "false"
            - name: WHATSAPP_ENABLED
              value: "true"
            # self-chat: Hermes uses the owner's own linked WhatsApp session
            # (paired once via `kubectl exec ... -- hermes whatsapp`,
            # QR-code scan) rather than a separate bot number.
            - name: WHATSAPP_MODE
              value: "self-chat"
            # Phone number kept out of the public repo: read directly from
            # the cluster-secrets Secret (kubernetes/components/sops/
            # cluster-secrets.sops.yaml, key SECRET_HERMES_WHATSAPP_USER;
            # the sops Kustomize component copies it into this namespace).
            # Deliberately NOT using Flux's ${VAR} postBuild substitution
            # here -- when a field's entire value is a purely-numeric
            # substituted string, Flux/kustomize can render it as an
            # unquoted YAML number instead of a string, which the apiserver
            # then rejects for this string-typed field
            # ("expected string, got ...Value:4917662016474"). A real
            # secretKeyRef avoids that whole class of bug. Format per the
            # WhatsApp-specific setup docs is digits only, no leading "+".
            - name: WHATSAPP_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: cluster-secrets
                  key: SECRET_HERMES_WHATSAPP_USER
            # Every other channel stays off in this first pass.
            - name: TELEGRAM_ALLOWED_USERS
              value: ""
            - name: TELEGRAM_HOME_CHANNEL
              value: ""
            - name: DISCORD_ALLOWED_USERS
              value: ""
            - name: DISCORD_HOME_CHANNEL
              value: ""
            - name: SLACK_ALLOWED_USERS
              value: ""
            - name: SIGNAL_ALLOWED_USERS
              value: ""
            - name: SIGNAL_GROUP_ALLOWED_USERS
              value: ""
          envFrom:
            - secretRef:
                name: hermes-agent-secrets
            - secretRef:
                name: hermes-agent-postgres-credentials
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          # Root, unrestricted: the image's entrypoint is s6-overlay, which
          # wants to own /run and write various runtime dirs at boot --
          # under non-root + readOnlyRootFilesystem it fails hard ("/run
          # belongs to uid 0 instead of 1000 ... lacking the privileges to
          # fix it"). Same tradeoff kubernetes/apps/openclaw and open-webui
          # already made for the same class of image; s6-overlay typically
          # drops privileges internally after its own bootstrap, so the
          # long-running hermes process itself may not stay root regardless.
          # The init containers above (which don't run s6-overlay) stay
          # fully hardened.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-data
        - name: bootstrap
          configMap:
            name: hermes-agent-config
        - name: trading-scripts
          configMap:
            name: hermes-agent-trading-scripts
        - name: tmp
          emptyDir: {}
        # Browser tool uses shared memory for headless rendering.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
      terminationGracePeriodSeconds: 120
