---
# Hand-rolled instead of using the ultraworkers/hermes-agent-helm-chart's
# own Deployment template: that chart is young (3.5 months old), unofficial,
# and both its default image tag and its ExternalSecret apiVersion turned
# out to be wrong on first real deploy. We already hand-roll RBAC/CNP/
# ExternalSecret around it anyway, and this app's actual container spec is
# simple enough that the chart wasn't buying us much abstraction -- this
# mirrors (the working parts of) upstream's templates/deployment.yaml.
#
# NOTE: this ConfigMap is a plain resource, not hash-suffixed -- editing
# config.yaml does NOT automatically roll the pod. Run
# `kubectl rollout restart deployment/hermes-agent -n hermes-agent` after
# changing configmap.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-agent
  labels:
    app.kubernetes.io/name: hermes-agent
spec:
  replicas: 1
  # HERMES_HOME holds mutable state (config, WhatsApp session, memory) on a
  # ReadWriteOnce PVC -- must stay single-replica, Recreate (not
  # RollingUpdate) so the old and new pod are never both attached at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hermes-agent
      annotations:
        # Opt-in list: only "data" (the real HERMES_HOME PVC) is worth
        # backing up. tmp/dshm/kubeconfig-dir are all plain emptyDirs with
        # nothing but per-pod scratch state -- backing them up via kopia
        # (default cluster-wide, --default-volumes-to-fs-backup) just adds
        # restore-test flakiness for zero DR value.
        backup.velero.io/backup-volumes: data
    spec:
      serviceAccountName: hermes-agent
      automountServiceAccountToken: true
      # No fsGroup (removed 2026-11-22). With fsGroup the kubelet re-applied
      # group-write + setgid to /opt/data on every pod start (OnRootMismatch
      # always "mismatched" because hermes keeps the dir private), which
      # (a) walked ~15k files on NFS for 5-10 min per start and (b) left
      # /opt/data at 2775 -- and hermes v0.23 refuses its own control socket
      # under a group-writable home ("unsafe_control_permissions"), so every
      # Kanban worker failed with "Gateway starting: deadline". Nothing needs
      # it: files below /opt/data are group 1000 already, the ServiceAccount
      # token is 0644 without fsGroup, and Secret files set their own mode.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Volume ownership model (rewritten 2026-11-22 after a 6-day outage):
        # the image's own boot hook (docker/stage2-hook.sh) chowns
        # /opt/data to the runtime user `hermes` (uid 10000) whenever it
        # isn't already, and hermes itself chmods /opt/data to 0700 every
        # time it writes a secret file there (.env, auth.json --
        # hermes_constants.py secure_parent_dir). So /opt/data is
        # ALWAYS 0700 owned by 10000 once the app has run once. The init
        # containers below used to run as uid 1000 and only worked while
        # /opt/data happened to be group-accessible; after the 2026-11-16
        # Talos node reboot, bootstrap-config failed with "mkdir: cannot
        # create directory '/opt/data': Permission denied" on every retry
        # and the agent stayed down until 2026-11-22.
        # Fix: every init container that writes to the volume runs as the
        # same uid 10000 the image itself uses (gid 1000 = this pod's
        # runAsGroup, which owns everything below /opt/data with
        # group-write). That is correct for every state of the volume --
        # steady state, after a Velero restore (Kopia keeps uid 10000), or
        # freshly provisioned -- with no CAP_CHOWN and no mode juggling.
        # The former fix-data-ownership init container (chown to 1000) is
        # gone: the image reverts that chown on its very next boot.
        # Seeds HERMES_HOME/config.yaml from the ConfigMap on every start
        # (always-overwrite -- matches the chart's bootstrap.overwrite=true
        # default, since we want the ConfigMap to stay the single source of
        # truth rather than drifting from whatever the running agent wrote
        # back to its own config at runtime).
        - name: bootstrap-config
          image: &image nousresearch/hermes-agent:v0.23.3
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu
              # hermes refuses its gateway control socket while HERMES_HOME is
              # writable by group/other (unsafe_control_permissions); a restore
              # or an older pod spec with fsGroup can leave it 2775.
              chmod go-w /opt/data
              mkdir -p /opt/data/home
              cp /bootstrap/config.yaml /opt/data/config.yaml
              # The `hermes whatsapp` pairing CLI writes its session to
              # /opt/data/whatsapp/session, but the gateway process checks
              # for creds at /opt/data/platforms/whatsapp/session/creds.json
              # -- a real path inconsistency in the app itself (confirmed:
              # gateway logged "not paired" even with a valid session
              # present at the CLI's path, until this symlink was added).
              # -sfn: safe to re-run every pod start.
              mkdir -p /opt/data/platforms
              ln -sfn /opt/data/whatsapp /opt/data/platforms/whatsapp
              # portfolio_price_check.py: `hermes cron create --script` only
              # accepts a path relative to ~/.hermes/scripts/ (confirmed
              # live: an absolute path, even one under HERMES_HOME, is
              # rejected with "Script path must be relative to
              # ~/.hermes/scripts/") -- and "~" here is $HOME
              # (/opt/data/home per the env var below), NOT $HERMES_HOME,
              # so this has to land under $HOME/.hermes/scripts, a
              # different subtree than config.yaml's own bootstrap target.
              mkdir -p /opt/data/home/.hermes/scripts
              cp /portfolio-script/portfolio_price_check.py /opt/data/home/.hermes/scripts/portfolio_price_check.py
              cp /cluster-health-script/cluster_health_check.py /opt/data/home/.hermes/scripts/cluster_health_check.py
              # cluster_health_check.py's cron job runs with --no-agent
              # (no LLM involved -- see the job's own creation command),
              # and --no-agent resolves its --script path from
              # $HERMES_HOME/scripts/ instead of $HOME/.hermes/scripts/ --
              # confirmed live: "hermes cron run" failed with "Script not
              # found: /opt/data/scripts/cluster_health_check.py" until a
              # copy existed at that exact path too. A DIFFERENT directory
              # convention than agent-mode scripts (comment above), not
              # documented in `hermes cron create --help`.
              mkdir -p /opt/data/scripts
              cp /cluster-health-script/cluster_health_check.py /opt/data/scripts/cluster_health_check.py
              # Specialist profiles (assistenz, finanzen, ...) next to the
              # default profile (= Chief of Staff). See the script's own
              # header and kustomization.yaml's hermes-agent-profiles.
              sh /profiles-bootstrap/bootstrap_profiles.sh
              # Cron scripts of the specialists live in each profile's own
              # scripts/ (a profile's --script must resolve inside its own
              # HERMES_HOME/scripts): the depot price check and the devops
              # Homelab-Waechter.
              cp /portfolio-script/portfolio_price_check.py /opt/data/profiles/depot/scripts/portfolio_price_check.py
              cp /cluster-health-script/cluster_health_check.py /opt/data/profiles/devops/scripts/cluster_health_check.py
          env:
            - name: HERMES_HOME
              value: &home /opt/data
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: portfolio-script
              mountPath: /portfolio-script
              readOnly: true
            - name: cluster-health-script
              mountPath: /cluster-health-script
              readOnly: true
            - name: profiles
              mountPath: /profiles
              readOnly: true
            - name: profiles-bootstrap
              mountPath: /profiles-bootstrap
              readOnly: true
            # Only the OpenRouter key, as a file: bootstrap_profiles.sh copies
            # it into each profile's own .env (served profiles don't see the
            # container env).
            - name: openrouter-key
              mountPath: /secrets/openrouter
              readOnly: true
            # <profile>__<VAR> files, see bootstrap_profiles.sh.
            - name: profile-env
              mountPath: /secrets/profile-env
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext: &initSecurityContext
            # uid 10000 = the image's `hermes` user, owner of /opt/data --
            # see the ownership comment at the top of initContainers.
            runAsUser: 10000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
            seccompProfile:
              type: RuntimeDefault
        # Curated, reviewable tool installation -- the safer alternative to
        # giving the running agent sudo/root. An init container's root
        # filesystem is NOT shared with the main container, only volume
        # mounts are -- so anything installed here must land on the shared
        # /opt/data volume (not /usr/*) to be visible to the main container.
        # kubectl is what gives the agent's "terminal" tool a way to
        # actually use the read-only RBAC granted in rbac.yaml (RBAC alone
        # is just permission, not an interface). Add further tools the same
        # way, one reviewable diff at a time.
        - name: tools-install
          image: *image
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu
              mkdir -p /opt/data/tools/bin
              # kubectl v1.36.2, linux/amd64 -- checksum from
              # https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl.sha256
              # Bump both the version and this checksum together on upgrade.
              curl -fsSL -o /tmp/kubectl \
                https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl
              echo "1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82  /tmp/kubectl" | sha256sum -c -
              install -m 0755 /tmp/kubectl /opt/data/tools/bin/kubectl
              # edge-tts / faster-whisper used to be `uv pip install
              # --target=/opt/data/tools/pip`'d here. Since hermes v0.23 the
              # image installs them itself on first use (its lazy-install
              # package manager, pinned to the versions that release was
              # tested with, under $HERMES_HOME), and the old target dir held
              # wheels built for the previous image's Python 3.13 -- the
              # v0.23.3 image runs 3.14 -- so it is removed (no-op once gone).
              rm -rf /opt/data/tools/pip
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
          securityContext: *initSecurityContext
      containers:
        - name: hermes-agent
          image: *image
          args:
            - gateway
            - run
          workingDir: /opt/hermes
          # Tirith (the agent's terminal-tool sandbox, see config.yaml's
          # security.tirith_enabled) runs LLM-issued shell commands as a
          # separate unprivileged user (confirmed live: uid=10000(hermes),
          # no supplementary groups) with its OWN fixed PATH that ignores
          # this container's PATH env var entirely (confirmed: sandboxed
          # `echo $PATH` prints "/usr/local/bin:/usr/bin:/bin:/usr/local/
          # games:/usr/games", never seeing /opt/data/tools/bin at all) --
          # so kubectl (installed onto the shared volume by tools-install,
          # only /opt/data/tools/bin) was invisible to any ad-hoc "check
          # the cluster" chat/agent-mode request, unlike the no-agent
          # cluster-health-check cron (runs as this main process itself,
          # not through Tirith's sandbox, so it was never affected).
          # postStart runs inside THIS container's own writable filesystem
          # (not shared with init containers, so they can't place it
          # directly) after tools-install has already populated the real
          # binary on the shared volume -- a symlink onto a directory
          # that IS on Tirith's fixed default PATH is the fix.
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - mkdir -p /usr/local/bin && ln -sf /opt/data/tools/bin/kubectl /usr/local/bin/kubectl
          env:
            - name: HERMES_HOME
              value: *home
            - name: HOME
              value: /opt/data/home
            # Base image has no /etc/localtime/TZ set (confirmed: `date`
            # showed UTC), so every "0 7 * * *"-style cron schedule was
            # firing 2h later than its wall-clock reading implied. TZ
            # fixes the OS-level clock, but hermes_time.py's own
            # documented resolution order for CRON scheduling specifically
            # is HERMES_TIMEZONE env var > config.yaml's `timezone` key >
            # server-local fallback -- setting BOTH is redundant-safe:
            # HERMES_TIMEZONE is the authoritative one hermes's own cron
            # engine reads, TZ covers everything else (log timestamps,
            # date-parsing in tool calls, etc). Handles CET/CEST DST
            # switching automatically going forward either way.
            - name: TZ
              value: "Europe/Berlin"
            - name: HERMES_TIMEZONE
              value: "Europe/Berlin"
            # Exposes whatever tools-install placed on the shared volume.
            # Must repeat the image's OWN bin dirs too -- setting PATH via
            # env replaces the image's built-in PATH, it doesn't extend it.
            # /opt/hermes/bin (and the venv) is where the `hermes` CLI
            # itself lives (confirmed via `find` in the running container:
            # /opt/hermes/bin/hermes) -- omitting it broke
            # `kubectl exec ... -- hermes whatsapp` with "executable file
            # not found in $PATH".
            - name: PATH
              value: "/opt/data/tools/bin:/opt/hermes/bin:/opt/hermes/.venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
            # Tirith's terminal-tool sandbox resets PATH for spawned
            # commands but does NOT scrub the rest of the environment
            # (confirmed live: a sandboxed `kubectl` picked up this
            # container's real $HOME correctly) -- so KUBECONFIG set here
            # propagates into the sandbox too, pointing kubectl at the
            # kubeconfig-refresher sidecar's output instead of the default
            # $HOME/.kube/config. That default path had to be abandoned:
            # it sits under /opt/data, whose root is 0700 owner-only AND
            # (confirmed live) un-chmod-able even by root -- "Operation
            # not permitted" on this CSI/NFS-backed volume's mount root
            # specifically, a hard platform restriction, not a bug to
            # route around. kubeconfig-dir (below) is a plain emptyDir
            # with no such restriction.
            - name: KUBECONFIG
              value: /etc/hermes-kubeconfig/config
            - name: WEB_TOOLS_DEBUG
              value: "false"
            - name: VISION_TOOLS_DEBUG
              value: "false"
            - name: MOA_TOOLS_DEBUG
              value: "false"
            - name: IMAGE_TOOLS_DEBUG
              value: "false"
            - name: HERMES_HUMAN_DELAY_MODE
              value: "off"
            - name: HERMES_HUMAN_DELAY_MIN_MS
              value: "800"
            - name: HERMES_HUMAN_DELAY_MAX_MS
              value: "2500"
            - name: GATEWAY_ALLOW_ALL_USERS
              value: "false"
            # Self-hosted Firecrawl web-search/scrape/extract backend --
            # see config.yaml's web.backend and kubernetes/apps/hermes-agent/
            # firecrawl/. No API key: USE_DB_AUTHENTICATION=false there,
            # gated by network policy instead (only this namespace can reach it).
            - name: FIRECRAWL_API_URL
              value: "http://firecrawl-api.hermes-agent.svc.cluster.local:3002"
            # No AGENT_BROWSER_EXECUTABLE_PATH any more: since hermes v0.23 the
            # image ships a full Chromium and bakes its path into
            # /etc/hermes/chromium-executable-path at build time (config
            # migration v52 also retired the AGENT_BROWSER_* env vars).
            - name: WHATSAPP_ENABLED
              value: "true"
            # self-chat: Hermes uses the owner's own linked WhatsApp session
            # (paired once via `kubectl exec ... -- hermes whatsapp`,
            # QR-code scan) rather than a separate bot number.
            - name: WHATSAPP_MODE
              value: "self-chat"
            # Phone number kept out of the public repo: read directly from
            # the cluster-secrets Secret (kubernetes/components/sops/
            # cluster-secrets.sops.yaml, key SECRET_HERMES_WHATSAPP_USER;
            # the sops Kustomize component copies it into this namespace).
            # Deliberately NOT using Flux's $${VAR} postBuild substitution
            # here -- when a field's entire value is a purely-numeric
            # substituted string, Flux/kustomize can render it as an
            # unquoted YAML number instead of a string, which the apiserver
            # then rejects for this string-typed field
            # ("expected string, got ...Value:4917662016474"). A real
            # secretKeyRef avoids that whole class of bug. Format per the
            # WhatsApp-specific setup docs is digits only, no leading "+".
            - name: WHATSAPP_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: cluster-secrets
                  key: SECRET_HERMES_WHATSAPP_USER
            # Telegram: activated for the document-pipeline/contract-
            # monitoring/finance-overview reminders (config.yaml's
            # platforms.webhook route + future crons deliver here). Same
            # self-chat pattern as WhatsApp -- one owner, own bot, no
            # separate allowed-user list needed. TELEGRAM_CHAT_ID is
            # purely-numeric like the WhatsApp phone number above, so it
            # gets the same secretKeyRef treatment (see that comment for
            # why: Flux $${VAR} substitution can turn an all-digit string
            # into an unquoted YAML number and fail apiserver validation).
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_ALLOWED_USERS
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: TELEGRAM_CHAT_ID
            # Home channel = the "Hermes" forum group, General topic (thread 1)
            # since 2026-11-22: cron results and webhook deliveries of the
            # default profile (Chief of Staff) land there instead of the DM.
            # The group id comes from the SOPS cluster-secrets (secretKeyRef,
            # not Flux substitution: an all-digit value would render as a
            # YAML number, see WHATSAPP_ALLOWED_USERS above).
            - name: TELEGRAM_HOME_CHANNEL
              valueFrom:
                secretKeyRef:
                  name: cluster-secrets
                  key: SECRET_HERMES_TELEGRAM_GROUP
            - name: TELEGRAM_HOME_CHANNEL_THREAD_ID
              value: "1"
            # In-cluster webhook platform (config.yaml's platforms.webhook) --
            # gateway/config.py reads WEBHOOK_ENABLED/_PORT/_SECRET directly
            # from the environment and merges them into the route config
            # config.yaml declares -- see that file's own comment for why
            # the secret specifically MUST come from here, not from a
            # $${VAR}-templated value inline in config.yaml.
            # OpenAI-compatible API server for Open WebUI: /v1 = Chief of Staff,
            # /p/<profile>/v1 = each specialist (multiplexed, one listener).
            # API_SERVER_KEY comes via envFrom hermes-agent-secrets; the
            # specialists need it in their own .env (bootstrap_profiles.sh).
            # Reachable only from the open-webui pod (ciliumnetworkpolicy.yaml).
            - name: API_SERVER_ENABLED
              value: "true"
            - name: API_SERVER_HOST
              value: "0.0.0.0"
            - name: API_SERVER_PORT
              value: "8642"
            - name: WEBHOOK_ENABLED
              value: "true"
            - name: WEBHOOK_PORT
              value: "8644"
            - name: WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: WEBHOOK_SHARED_SECRET
            # Backend for the Hermes Desktop app: the image's s6 "dashboard"
            # service only starts when this is truthy, then runs
            # `hermes dashboard --host 0.0.0.0 --port 9119` as the same
            # unprivileged hermes user the gateway drops to, sharing this
            # container's env and HERMES_HOME. Auth (Authentik OIDC) is in
            # config.yaml's dashboard: block -- without a registered provider
            # the server refuses to start on a non-loopback bind, so this
            # can't come up open by accident. Exposed via httproute.yaml.
            - name: HERMES_DASHBOARD
              value: "1"
            - name: HERMES_DASHBOARD_PORT
              value: "9119"
            # portfolio_price_check.py (cron script) connects via psycopg2.
            # connect() with no arguments, which reads these standard PG*
            # vars automatically -- no need to wire them through the
            # script's own argv/config.
            - name: PGHOST
              value: "postgres-rw.database.svc.cluster.local"
            - name: PGDATABASE
              value: "portfolio"
            - name: PGUSER
              value: "portfoliousr"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-agent-secrets
                  key: PORTFOLIO_DB_PASSWORD
            - name: DISCORD_ALLOWED_USERS
              value: ""
            - name: DISCORD_HOME_CHANNEL
              value: ""
            - name: SLACK_ALLOWED_USERS
              value: ""
            - name: SIGNAL_ALLOWED_USERS
              value: ""
            - name: SIGNAL_GROUP_ALLOWED_USERS
              value: ""
          envFrom:
            - secretRef:
                name: hermes-agent-secrets
          resources:
            requests:
              # The gateway idles around 250Mi; the desktop backend
              # (HERMES_DASHBOARD) is a second long-lived Python process in
              # this container, hence 768Mi rather than 512Mi. Still well short
              # of parking 1Gi that no scheduler can hand to anything else. The
              # 4Gi ceiling is unchanged, so headroom for a heavy run is
              # untouched.
              cpu: 500m
              memory: 768Mi
            limits:
              cpu: "2"
              memory: 4Gi
          # Root, unrestricted: the image's entrypoint is s6-overlay, which
          # wants to own /run and write various runtime dirs at boot --
          # under non-root + readOnlyRootFilesystem it fails hard ("/run
          # belongs to uid 0 instead of 1000 ... lacking the privileges to
          # fix it"). Same tradeoff kubernetes/apps/openclaw and open-webui
          # already made for the same class of image; s6-overlay typically
          # drops privileges internally after its own bootstrap, so the
          # long-running hermes process itself may not stay root regardless.
          # The init containers above (which don't run s6-overlay) stay
          # fully hardened.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
            - name: kubeconfig-dir
              mountPath: /etc/hermes-kubeconfig
        # Mirrors this pod's own ServiceAccount token into a world-readable
        # kubeconfig at /etc/hermes-kubeconfig/config, refreshed every 15
        # minutes. Why a separate container, not a hermes cron job:
        # confirmed live that s6-overlay drops the long-running hermes
        # process (gateway, cron scheduler, terminal tool -- ALL of it,
        # agent-mode AND --no-agent alike) to a fixed unprivileged user
        # (uid=10000, gid=10000, NO supplementary groups) immediately
        # after its own root bootstrap -- so no hermes-managed script,
        # cron job, or terminal command can ever read the real token
        # (root:<fsGroup> 0640, and Kubernetes' serviceAccountToken
        # projected-volume source hard-codes that mode regardless of
        # defaultMode -- also confirmed live). This sidecar runs as
        # uid/gid 1000 -- ordinary group-read access to the 0640 token is
        # enough, no root needed here either. (Since fsGroup was dropped on
        # 2026-11-22 the token is 0644 root:root, readable by every
        # container; the sidecar stays because the kubeconfig it writes is
        # what the agent's kubectl is pointed at.)
        # Writes to kubeconfig-dir (a plain emptyDir), NOT anywhere under
        # the `data` PVC: /opt/data itself is 0700 owned solely by uid
        # 10000, and -- confirmed live -- not even root can chmod it
        # ("Operation not permitted", a hard restriction on this
        # CSI/NFS-backed volume's mount root). See the main container's
        # KUBECONFIG env var comment for the full path history.
        - name: kubeconfig-refresher
          image: *image
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -eu
              while true; do
                python3 /refresh-kubeconfig-script/refresh_kubeconfig.py || true
                sleep 900
              done
          env:
            - name: KUBECONFIG_PATH_OVERRIDE
              value: /etc/hermes-kubeconfig/config
          volumeMounts:
            - name: kubeconfig-dir
              mountPath: /etc/hermes-kubeconfig
            - name: refresh-kubeconfig-script
              mountPath: /refresh-kubeconfig-script
              readOnly: true
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            capabilities:
              drop:
                - "ALL"
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: hermes-agent-data
        - name: bootstrap
          configMap:
            name: hermes-agent-config
        - name: portfolio-script
          configMap:
            name: hermes-agent-portfolio-script
        - name: cluster-health-script
          configMap:
            name: hermes-agent-cluster-health-script
        - name: refresh-kubeconfig-script
          configMap:
            name: hermes-agent-refresh-kubeconfig-script
        - name: profiles
          configMap:
            name: hermes-agent-profiles
        - name: profiles-bootstrap
          configMap:
            name: hermes-agent-profiles-bootstrap
        - name: profile-env
          secret:
            secretName: hermes-agent-profile-env
            defaultMode: 0444
            # A missing 1Password item must not keep the whole agent down;
            # the affected profile just starts without that secret.
            optional: true
        - name: openrouter-key
          secret:
            secretName: hermes-agent-secrets
            items:
              - key: OPENROUTER_API_KEY
                path: OPENROUTER_API_KEY
              - key: API_SERVER_KEY
                path: API_SERVER_KEY
            # optional: a missing key (e.g. a new field not yet in 1Password)
            # must not keep the pod from starting; bootstrap skips it.
            optional: true
            # Without fsGroup the file is root:root; bootstrap-config runs as
            # uid 10000. Readable in-pod only -- the main container already
            # carries the same key as an env var.
            defaultMode: 0444
        - name: tmp
          emptyDir: {}
        # Browser tool uses shared memory for headless rendering.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 1Gi
        # Deliberately NOT under /opt/data -- see the KUBECONFIG env var
        # comment on the main container for why.
        - name: kubeconfig-dir
          emptyDir:
            sizeLimit: 16Mi
      terminationGracePeriodSeconds: 120
