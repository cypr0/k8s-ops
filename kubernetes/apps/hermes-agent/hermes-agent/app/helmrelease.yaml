---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes-agent
spec:
  interval: 1h
  chart:
    spec:
      chart: "."
      sourceRef:
        kind: GitRepository
        name: hermes-agent-chart
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    image:
      repository: nousresearch/hermes-agent
      # renovate: datasource=docker depName=nousresearch/hermes-agent
      tag: "v2026.7.7.2"

    serviceAccount:
      create: true
      # The k8s-mcp sidecar below needs the pod's ServiceAccount token
      # mounted to authenticate to the API server as this SA (bound
      # read-only to the built-in `view` ClusterRole, see rbac.yaml).
      # Chart default is false (CIS 5.1.6 posture) -- same override
      # kubernetes/apps/openclaw needs, for the identical reason.
      automountServiceAccountToken: true

    rbac:
      # Hand-rolled in rbac.yaml instead (binds to the built-in `view`
      # ClusterRole rather than reinventing rules from scratch).
      create: false

    persistence:
      enabled: true
      storageClass: zfs-nfs
      accessMode: ReadWriteOnce
      size: 5Gi

    config:
      values:
        model:
          # Mistral: strong German/European-language fluency at a low price
          # ($0.10 / $0.30 per M tokens prompt/completion, verified live
          # against https://openrouter.ai/api/v1/models). Noticeably better
          # German than similarly-priced Qwen/DeepSeek models in practice.
          # Bump to mistralai/mistral-medium-3.1 if quality matters more
          # than rock-bottom cost.
          default: "mistralai/mistral-small-3.2-24b-instruct"
          provider: auto
          base_url: https://openrouter.ai/api/v1
        security:
          redact_secrets: true
          tirith_enabled: true
          # Chart default is `true` (fail OPEN: an errored guardrail check
          # lets the action through). This agent has shell + WhatsApp + a
          # read-only k8s view, so flip to fail-closed instead.
          tirith_fail_open: false

    env:
      WHATSAPP_ENABLED: "true"
      # self-chat: Hermes uses the owner's own linked WhatsApp session
      # (paired once via `kubectl exec ... -- hermes whatsapp`, QR-code
      # scan) rather than a separate bot number.
      WHATSAPP_MODE: "self-chat"
      # Single-user allow-list -- WhatsApp is the only enabled channel in
      # this first pass, everything else stays off. Phone number kept out
      # of the public repo: resolved via Flux postBuild substitution from
      # the cluster-secrets Secret (kubernetes/components/sops/cluster-secrets.sops.yaml,
      # key SECRET_HERMES_WHATSAPP_USER) rather than hardcoded here.
      # NOTE: format per the WhatsApp-specific setup docs is digits only,
      # no leading "+" (a separate, more generic doc page showed a "+"
      # example -- trusting the WhatsApp-specific page here; verify after
      # first pairing and adjust the stored secret if it's rejected).
      WHATSAPP_ALLOWED_USERS: "${SECRET_HERMES_WHATSAPP_USER}"
      GATEWAY_ALLOW_ALL_USERS: "false"

    # No web UI / API exposure in this first, minimal-safe pass -- WhatsApp
    # is the only interface. Revisit if a Control-UI/API is wanted later
    # (would mirror openclaw's HTTPRoute + Authentik forward-auth pattern).
    apiServer:
      enabled: false
    service:
      enabled: false
    ingress:
      enabled: false
    networkPolicy:
      # Hand-rolled instead, see ciliumnetworkpolicy.yaml.
      enabled: false

    # The chart's own externalSecret.enabled mechanism hardcodes apiVersion
    # external-secrets.io/v1beta1 in its template, which this cluster's ESO
    # doesn't serve (v1beta1 exists in the CRD schema but served=false --
    # only v1 is live). Hand-rolled in externalsecret.yaml instead (this
    # repo's normal convention anyway), consumed here via existingSecret.
    secrets:
      existingSecret: hermes-agent-secrets

    # Left empty on purpose: use the tools-install init container below
    # (pip --target / static-binary pattern) instead of npm for anything
    # beyond Node packages.
    npmPackages: []

    # No k8s-mcp sidecar: RBAC (rbac.yaml) only grants the ServiceAccount
    # permission to call the API, it doesn't give the agent a way to
    # actually place those calls. Hermes already has a local-shell
    # "terminal" tool though (config.values.terminal.backend: local,
    # chart default) -- so `kubectl`, installed by tools-install below,
    # IS that interface. `kubectl` auto-detects in-cluster auth purely
    # from the auto-mounted ServiceAccount token/CA (automountServiceAccountToken:
    # true above) + the KUBERNETES_SERVICE_HOST/PORT env vars kubelet
    # injects into every pod -- no separate MCP server, sidecar, or extra
    # config needed. Simpler than kubernetes/apps/openclaw's k8s-mcp
    # sidecar and avoids depending on Hermes's (unconfirmed) MCP config
    # schema entirely.

    extraInitContainers:
      # Curated, reviewable tool installation -- the safer alternative to
      # giving the running agent sudo/root (see PR discussion). Runs once at
      # pod start with its own hardened, non-root securityContext.
      #
      # IMPORTANT: an init container's root filesystem is NOT shared with
      # the main container -- only volume mounts are. `apt install` here
      # would install into /usr/*, which vanishes when this container exits;
      # it would NOT become available to the main container. Only things
      # written to the shared /opt/data volume are visible to both. Two
      # patterns that actually work, mirroring the chart's own
      # npmPackages init container (which uses `npm install --prefix
      # /opt/data/npm-global` for exactly this reason):
      #   1) pip install --target=/opt/data/tools/pip <pkg>==<pinned-version>
      #      (only if the hermes-agent image ships python3/pip -- unverified,
      #      the image is primarily Node-based; check before relying on this)
      #   2) A pinned, checksum-verified static binary download into
      #      /opt/data/tools/bin (works regardless of base image contents)
      # kubectl below uses pattern (2); add further packages the same way,
      # one reviewable git diff at a time.
      - name: tools-install
        image: nousresearch/hermes-agent:v2026.7.7.2
        command:
          - /bin/sh
          - -ec
        args:
          - |
            set -eu
            mkdir -p /opt/data/tools/bin /opt/data/tools/pip
            # kubectl v1.36.2, linux/amd64 -- checksum from
            # https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl.sha256
            # Bump both the version and this checksum together on upgrade.
            curl -fsSL -o /tmp/kubectl \
              https://dl.k8s.io/release/v1.36.2/bin/linux/amd64/kubectl
            echo "1e9045ec32bea85da43de85f0065358529ea7c7a152eca78154fba5b58c27d82  /tmp/kubectl" | sha256sum -c -
            install -m 0755 /tmp/kubectl /opt/data/tools/bin/kubectl
        volumeMounts:
          - name: data
            mountPath: /opt/data
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - "ALL"
          runAsNonRoot: true
          runAsUser: 1000
          seccompProfile:
            type: RuntimeDefault

    # Exposes whatever tools-install placed on the shared volume to the main
    # (still non-root, no-sudo) agent container. Must repeat the base
    # image's own system dirs -- setting PATH via env replaces the image's
    # built-in PATH rather than extending it.
    extraEnv:
      - name: PATH
        value: "/opt/data/tools/bin:/opt/data/tools/pip/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      - name: PYTHONPATH
        value: "/opt/data/tools/pip"
