---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: hermes-agent-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Key name is what Hermes Agent's own envFrom expects (fixed by the
        # app), unrelated to the 1Password field name being extracted.
        OPENROUTER_API_KEY: "{{ .OPENROUTER_HERMES_API_KEY }}"
        # Telegram (deployment.yaml): bot token from @BotFather, chat ID is
        # the owner's own numeric Telegram user ID -- same self-chat pattern
        # as WhatsApp, reused for both ALLOWED_USERS and HOME_CHANNEL.
        TELEGRAM_BOT_TOKEN: "{{ .TELEGRAM_BOT_TOKEN }}"
        TELEGRAM_CHAT_ID: "{{ .TELEGRAM_CHAT_ID }}"
        # Shared secret for the in-cluster webhook platform (configmap.yaml's
        # platforms.webhook route, paperless-ngx's Workflow Webhook action
        # sends it back as a plain X-Gitlab-Token header) -- purely internal,
        # no real external account behind it, so this field's value was
        # generated ad hoc rather than being a real credential to rotate
        # from an external account.
        WEBHOOK_SHARED_SECRET: "{{ .HERMES_WEBHOOK_SHARED_SECRET }}"
        # Same password as kubernetes/apps/database/cloudnative-pg/databases/
        # externalsecret-portfolio.yaml's portfolio-db-role Secret -- that one
        # lives in the database namespace (CNPG managed role), this local
        # copy is what the schema Job and cron script actually connect with
        # from inside hermes-agent's own namespace (K8s Secrets don't cross
        # namespaces).
        PORTFOLIO_DB_PASSWORD: "{{ .PORTFOLIO_POSTGRESQL_PASSWORD }}"
  dataFrom:
    - extract:
        key: openrouter
    - extract:
        key: telegram
    - extract:
        key: hermes-agent
    - extract:
        key: portfolio
