---
# Hermes Desktop -> this agent. envoy-internal only: the hostname resolves via
# k8s-gateway on the LAN (or VPN), there is no public DNS record and no
# Cloudflare Tunnel path. Authentication is the app's own OIDC gate against
# Authentik (configmap.yaml's dashboard: block), NOT an Envoy forward-auth
# SecurityPolicy: the desktop authenticates its API and WebSocket calls with
# an `Authorization: Bearer` token the app itself minted, which a
# cookie-based outpost in front would reject.
#
# No route timeout: the desktop keeps one WebSocket (/api/ws) open for the
# whole session, and the gateway-wide BackendTrafficPolicy already sets
# requestTimeout 0s (kubernetes/apps/network/envoy-gateway/app/envoy.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-agent
  labels:
    app.kubernetes.io/name: hermes-agent
spec:
  hostnames:
    - hermes.${SECRET_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: hermes-agent
          port: 9119
          weight: 1
