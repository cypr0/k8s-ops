---
# Hermes Desktop -> this agent. envoy-internal only: the hostname resolves via
# k8s-gateway on the LAN (or VPN), there is no public DNS record and no
# Cloudflare Tunnel path. Authentication is the app's own OIDC gate against
# Authentik (configmap.yaml's dashboard: block), NOT an Envoy forward-auth
# SecurityPolicy: the desktop authenticates its API and WebSocket calls with
# an `Authorization: Bearer` token the app itself minted, which a
# cookie-based outpost in front would reject.
#
# No route timeout: the desktop keeps one WebSocket (/api/ws) open for the
# whole session, and the gateway-wide BackendTrafficPolicy already sets
# requestTimeout 0s (kubernetes/apps/network/envoy-gateway/app/envoy.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hermes-agent
  labels:
    app.kubernetes.io/name: hermes-agent
spec:
  hostnames:
    - hermes.${SECRET_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      # Envoy, not the client, decides the client IP the dashboard sees. Its
      # auth code (dashboard_auth _client_ip) takes the raw LEFTMOST
      # X-Forwarded-For entry with no trust check, so any LAN client chose
      # the IP in auth audit logs and the per-IP limits on password login and
      # pending native sign-ins. Set to the address Envoy resolved via the
      # ClientTrafficPolicy (trustedCIDRs 10.42.0.0/16 in
      # network/envoy-gateway/app/envoy.yaml).
      # Docs: docs/apps/envoy-gateway.md (Client IP).
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-For
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
              - name: X-Real-IP
                value: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
      backendRefs:
        - group: ""
          kind: Service
          name: hermes-agent
          port: 9119
          weight: 1
