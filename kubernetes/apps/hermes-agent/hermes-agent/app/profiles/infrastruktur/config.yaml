---
# Profile "infrastruktur" -- Proxmox VE engineer for the host under this
# cluster: node and guest health, storage/ZFS, backups, updates, failed tasks.
# Changes are proposed against the proxmox-ansible playbook in Git.
#
# Seeded into HERMES_HOME/profiles/infrastruktur/config.yaml by
# bootstrap-config on every pod start. No inheritance from the default
# profile's config.yaml.
_config_version: 54
model:
  # Host metrics, guest lists and task logs: technical data. Haiku is
  # enough day to day; `/model analyse` for root causes. Verified to return a
  # tool call under provider.zdr=true (2026-11-22).
  default: anthropic/claude-haiku-5.5
  provider: auto
  base_url: https://openrouter.ai/api/v1
model_aliases:
  analyse:
    model: anthropic/claude-sonnet-5.5
    provider: openrouter
fallback_providers:
  - provider: openrouter
    model: mistralai/mistral-small-2603
provider_routing:
  data_collection: deny
auxiliary:
  openrouter_model: anthropic/claude-haiku-5.5
  compression:
    provider: openrouter
    model: anthropic/claude-haiku-5.5
    extra_body: &zeroRetention
      provider:
        data_collection: deny
        zdr: true
  title_generation:
    provider: openrouter
    model: anthropic/claude-haiku-5.5
    extra_body: *zeroRetention
agent:
  max_turns: 60
  # Host syslog/journal (reachable via raw_get) can carry attacker-chosen
  # text; same rule as "sicherheit": no shell, code, files, web, browser.
  disabled_toolsets:
    - terminal
    - code_execution
    - file
    - browser
    - web
    - search
    - x_search
    - computer_use
    - cronjob
    - delegation
    - image_gen
    - video_gen
    - connections
    - catalog
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
security:
  redact_secrets: true
mcp_servers:
  # kubernetes/apps/hermes-agent/proxmox-mcp/ -- PVEAuditor token, GET only.
  proxmox:
    url: "http://proxmox-mcp.hermes-agent.svc.cluster.local:8000/mcp"
