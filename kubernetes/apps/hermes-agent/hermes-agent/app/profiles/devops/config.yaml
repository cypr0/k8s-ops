---
# Profile "devops" -- Kubernetes/Flux engineer for this cluster. Read-only
# cluster access; changes are proposed, never applied.
#
# Seeded into HERMES_HOME/profiles/devops/config.yaml by bootstrap-config
# on every pod start. No inheritance from the default profile's config.yaml.
_config_version: 54
model:
  # Cluster state is technical data (names, events, metrics), no personal
  # documents -- the cheap, strong tool-user is the right default. Verified
  # to return a real tool call under provider.zdr=true (2026-11-22).
  default: anthropic/claude-haiku-5.5
  provider: auto
  base_url: https://openrouter.ai/api/v1
model_aliases:
  # Root-cause analysis over many logs / manifests: `/model analyse`.
  analyse:
    model: anthropic/claude-sonnet-5.5
    provider: openrouter
fallback_providers:
  - provider: openrouter
    model: mistralai/mistral-small-2603
provider_routing:
  data_collection: deny
auxiliary:
  openrouter_model: anthropic/claude-haiku-5.5
  compression:
    provider: openrouter
    model: anthropic/claude-haiku-5.5
    extra_body: &zeroRetention
      provider:
        data_collection: deny
        zdr: true
  title_generation:
    provider: openrouter
    model: anthropic/claude-haiku-5.5
    extra_body: *zeroRetention
  web_extract:
    provider: openrouter
    model: anthropic/claude-haiku-5.5
    extra_body: *zeroRetention
agent:
  max_turns: 60
  # The one profile with a shell: kubectl through the pod's read-only `view`
  # ClusterRole (rbac.yaml) needs `terminal`. Web search stays on for
  # upstream docs and changelogs. Same pod and uid as every other profile,
  # so `file`/`terminal` here could read their .env files -- that is the
  # known limit of one-pod multiplexing, accepted because this profile only
  # ever sees cluster data, not mail or documents.
  disabled_toolsets:
    - browser
    - computer_use
    - cronjob
    - delegation
    - image_gen
    - video_gen
    - connections
    - catalog
terminal:
  backend: local
  cwd: .
  timeout: 180
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
security:
  redact_secrets: true
web:
  backend: firecrawl
mcp_servers:
  # Read-only Flux/Kubernetes MCP server (kubernetes/apps/flux-system/
  # flux-operator-mcp/, readonly: true, `view` ClusterRole). Deployed since
  # July for the retired OpenClaw and unused until this profile.
  flux:
    url: "http://flux-operator-mcp.flux-system.svc.cluster.local:9090/mcp"
