---
# Secrets that belong to exactly ONE specialist profile. Key format
# <profile>__<VAR>: bootstrap_profiles.sh writes VAR only into that profile's
# .env (HERMES_HOME/profiles/<profile>/.env), so the other profiles -- which
# the multiplexed gateway keeps in separate secret scopes -- never see it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-profile-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: hermes-agent-profile-env
    creationPolicy: Owner
  data:
    # isms: project access token (Developer, api + read/write_repository) on
    # isms/compliance-as-code in the in-cluster GitLab; main stays protected.
    - secretKey: isms__GITLAB_TOKEN
      remoteRef:
        key: hermes-gitlab
        property: GITLAB_TOKEN
