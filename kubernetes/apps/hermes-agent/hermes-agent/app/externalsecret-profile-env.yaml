---
# Secrets that belong to exactly ONE specialist profile. Key format
# <profile>__<VAR>: bootstrap_profiles.sh writes VAR only into that profile's
# .env (HERMES_HOME/profiles/<profile>/.env), so the other profiles -- which
# the multiplexed gateway keeps in separate secret scopes -- never see it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-profile-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: hermes-agent-profile-env
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # isms: project access token (Developer, api + read/write_repository)
        # on isms/compliance-as-code in the in-cluster GitLab; main protected.
        isms__GITLAB_TOKEN: "{{ .gitlab_token }}"
        # depot: portfolio_price_check.py (its cron --script) reads the
        # standard PG* variables; passed through by terminal.env_passthrough.
        depot__PGHOST: postgres-rw.database.svc.cluster.local
        depot__PGDATABASE: portfolio
        depot__PGUSER: portfoliousr
        depot__PGPASSWORD: "{{ .portfolio_password }}"
  data:
    - secretKey: gitlab_token
      remoteRef:
        key: hermes-gitlab
        property: GITLAB_TOKEN
    - secretKey: portfolio_password
      remoteRef:
        key: portfolio
        property: PORTFOLIO_POSTGRESQL_PASSWORD
