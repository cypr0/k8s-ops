---
# Two ports, two audiences:
# - webhook (8644): IN-CLUSTER callers only (paperless-ngx's Workflow
#   "Webhook" action, Open WebUI's hermes_agent Tool). No HTTPRoute points
#   at it; ciliumnetworkpolicy.yaml limits who can connect.
# - dashboard (9119): the Hermes Desktop backend (config.yaml's dashboard:
#   block), published through httproute.yaml on envoy-internal only, behind
#   Authentik OIDC.
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  labels:
    app.kubernetes.io/name: hermes-agent
spec:
  selector:
    app.kubernetes.io/name: hermes-agent
  ports:
    - name: webhook
      port: 8644
      targetPort: 8644
      protocol: TCP
    - name: dashboard
      port: 9119
      targetPort: 9119
      protocol: TCP
