---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-agent-postgres
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: hermes-agent-postgres-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_DB: "trading"
        POSTGRES_HOST: "postgres-rw.database.svc.cluster.local"
        # Fixed role name (see cluster.yaml's managed.roles), not templated
        # from 1Password -- only the password is a secret here.
        POSTGRES_USER: "tradingusr"
        POSTGRES_PASSWORD: "{{ .TRADING_POSTGRESQL_PASSWORD }}"
        # Free-tier Finnhub key, dedicated to Hermes -- deliberately NOT
        # reusing an existing personal key the way the old Alpha Vantage
        # setup did (that key's daily quota was already being consumed by
        # the user's other, unrelated use of it, which silently broke the
        # crypto data-quality cross-check for days, see check_data_quality.py).
        FINNHUB_API_KEY: "{{ .FINNHUB_API_KEY }}"
        # Personal capital/risk figures -- kept out of the public repo (see
        # trading-scripts/lib/constants.py for why sourcing these from a
        # Secret doesn't weaken the "not agent-editable" guarantee). Add
        # these six fields to the hermes-agent-trading 1Password item.
        TRADING_STARTING_CAPITAL_EUR: "{{ .TRADING_STARTING_CAPITAL_EUR }}"
        TRADING_MAX_POSITION_PCT: "{{ .TRADING_MAX_POSITION_PCT }}"
        TRADING_STOP_LOSS_PCT: "{{ .TRADING_STOP_LOSS_PCT }}"
        TRADING_PROFIT_TARGET_PCT: "{{ .TRADING_PROFIT_TARGET_PCT }}"
        TRADING_DAILY_CIRCUIT_BREAKER_PCT: "{{ .TRADING_DAILY_CIRCUIT_BREAKER_PCT }}"
        TRADING_PROPOSAL_EXPIRY_MINUTES: "{{ .TRADING_PROPOSAL_EXPIRY_MINUTES }}"
        # Optional, defaults to "false" via sprig if not yet added to the
        # 1Password item -- see lib/constants.py for what this enables.
        TRADING_AUTOPILOT_ENABLED: "{{ .TRADING_AUTOPILOT_ENABLED | default \"false\" }}"
  dataFrom:
    - extract:
        key: hermes-agent-trading
    - extract:
        key: finnhub
