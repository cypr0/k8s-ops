---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes-agent
resources:
  - ./gitrepository.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./rbac.yaml
  - ./ciliumnetworkpolicy.yaml
# Hand-rolled externalsecret.yaml instead of the chart's own
# externalSecret.enabled mechanism: that template hardcodes apiVersion
# external-secrets.io/v1beta1, which this cluster's ESO doesn't serve.
