---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes-agent
resources:
  - ./externalsecret.yaml
  # - ./externalsecret-profile-env.yaml  # enable with the isms profile (needs 1Password item hermes-gitlab)
  - ./serviceaccount.yaml
  - ./pvc.yaml
  - ./configmap.yaml
  - ./job-portfolio-schema.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./httproute.yaml
  - ./rbac.yaml
  - ./ciliumnetworkpolicy.yaml

# Content-hash-suffixed, same rationale as firecrawl-mcp/mailu-mcp/
# nextcloud-mcp's script ConfigMaps: any change to the actual .py file
# changes the ConfigMap name, which changes the Deployment's volume
# reference, which triggers a real rollout automatically -- generating
# it straight from the file (instead of embedding its text inline in
# configmap.yaml, which was the first draft here) also means there's
# only ONE copy of the script to keep in sync, not two.
configMapGenerator:
  - name: hermes-agent-portfolio-script
    files:
      - scripts/portfolio_price_check.py
  - name: hermes-agent-cluster-health-script
    files:
      - scripts/cluster_health_check.py
  - name: hermes-agent-refresh-kubeconfig-script
    files:
      - scripts/refresh_kubeconfig.py
  # Specialist profiles (Chief of Staff = default profile in configmap.yaml).
  # bootstrap_profiles.sh seeds every <name>.config.yaml / <name>.SOUL.md pair
  # into HERMES_HOME/profiles/<name>/; adding a profile = adding its two
  # files below.
  # The script lives in its own ConfigMap with Flux substitution disabled, so
  # its shell variables reach the pod byte-for-byte. The profile files DO go
  # through substitution: personal names and mailbox ids are placeholders
  # (SECRET_HERMES_OWNER_NAME, ..._PARTNER_NAME, ..._OWNER_MAILBOX,
  # ..._PARTNER_MAILBOX) filled from the SOPS-encrypted cluster-secrets, so
  # they never appear in this public repo. Consequence: no other dollar sign
  # may appear in those files.
  - name: hermes-agent-profiles-bootstrap
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - bootstrap_profiles.sh=profiles/bootstrap_profiles.sh
  - name: hermes-agent-profiles
    files:
      - chief-of-staff.SOUL.md=profiles/chief-of-staff.SOUL.md
      - assistenz.config.yaml=profiles/assistenz/config.yaml
      - assistenz.SOUL.md=profiles/assistenz/SOUL.md
      - finanzen.config.yaml=profiles/finanzen/config.yaml
      - finanzen.SOUL.md=profiles/finanzen/SOUL.md
      - steuern.config.yaml=profiles/steuern/config.yaml
      - steuern.SOUL.md=profiles/steuern/SOUL.md
      - kurator.config.yaml=profiles/kurator/config.yaml
      - kurator.SOUL.md=profiles/kurator/SOUL.md
      - devops.config.yaml=profiles/devops/config.yaml
      - devops.SOUL.md=profiles/devops/SOUL.md
      - sicherheit.config.yaml=profiles/sicherheit/config.yaml
      - sicherheit.SOUL.md=profiles/sicherheit/SOUL.md
      - infrastruktur.config.yaml=profiles/infrastruktur/config.yaml
      - infrastruktur.SOUL.md=profiles/infrastruktur/SOUL.md
      # Prepared, enabled once their 1Password items exist (otherwise the
      # Chief of Staff could delegate to a profile whose MCP server or token
      # is missing): isms (hermes-gitlab), netzwerk (hermes-opnsense).
      # Files: profiles/{isms,netzwerk}/.

generatorOptions:
  disableNameSuffixHash: false
  # No chart, no GitRepository/HelmRelease: hand-rolled instead of depending
  # on ultraworkers/hermes-agent-helm-chart (young, unofficial, and both its
  # default image tag and its ExternalSecret apiVersion were wrong on first
  # real deploy). See deployment.yaml for details.
  #
  # The trading bot (BTC/ETH paper-trading simulation) that used to live here
  # -- scripts, cron jobs, its own Postgres DB, and the OpenSearch/Grafana
  # dashboards feeding off it -- was deprovisioned (2026-08-12): didn't work
  # well enough to be worth keeping running. Its Postgres database/roles
  # were fully dropped the same day, see kubernetes/apps/database/
  # cloudnative-pg/cluster/cluster.yaml's managed.roles comment. Revisited
  # (2026-08-13) as a real-portfolio price-tracking cron instead of paper-
  # trading -- see job-portfolio-schema.yaml and deployment.yaml's
  # tools-install init container (portfolio cron script).
