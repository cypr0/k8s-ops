---
# hermes-agent: WhatsApp-first AI agent, reachable in-cluster on the webhook
# platform's port (service.yaml), and from the LAN on the desktop backend's
# port 9119 -- only through envoy-internal (httproute.yaml), never directly.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  ingress:
    # paperless-ngx's Workflow "Webhook" action (Trigger: Document Added)
    # calls this agent's webhook platform (config.yaml's platforms.webhook)
    # to kick off document extraction -- see kubernetes/apps/paperless/
    # paperless-ngx/ for the Workflow itself. HMAC/shared-secret auth
    # happens at the application layer (route's `secret:`), this is
    # defense-in-depth network scoping on top, not the only gate.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": paperless
            app.kubernetes.io/name: paperless
            app.kubernetes.io/controller: main
      toPorts:
        - ports:
            - port: "8644"
              protocol: TCP
    # Open WebUI's hermes_agent Tool (kubernetes/apps/open-webui/open-webui/
    # app/tools/hermes_agent.py) posting to the owui-task webhook route, so
    # a chat user can hand a task to this agent. Same shared-secret auth as
    # the paperless caller above (X-Gitlab-Token); this rule is network
    # scoping on top, not the only gate.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": open-webui
            app.kubernetes.io/name: open-webui
      toPorts:
        - ports:
            - port: "8644"
              protocol: TCP
    # Hermes Desktop backend (config.yaml's dashboard: block), only via the
    # Envoy proxies -- the one path that terminates TLS for
    # hermes.${SECRET_DOMAIN}. The app's OIDC gate is the authentication;
    # this rule just keeps any other pod from talking to 9119 directly.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "9119"
              protocol: TCP
    # Gatus health check (webhook TCP connect, desktop backend /api/status)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: gatus
      toPorts:
        - ports:
            - port: "8644"
              protocol: TCP
            - port: "9119"
              protocol: TCP
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # OpenRouter (LLM API) + outbound WhatsApp connection over 443, plus the
    # browser toolset's headless Chrome navigating to arbitrary sites --
    # port 80 added for plain-HTTP pages and http->https redirect chains
    # (allow_private_urls: false in config.yaml already blocks SSRF into
    # cluster-internal services via this same rule).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
    # kubectl (installed by tools-install, invoked via the agent's terminal
    # tool): read-only Kubernetes API access (RBAC-gated, see rbac.yaml)
    - toEntities:
        - kube-apiserver
    # Desktop backend's OIDC calls to Authentik (discovery, token exchange,
    # JWKS). CoreDNS's hosts plugin resolves id.${SECRET_DOMAIN} to
    # envoy-internal's ClusterIP, so this lands on an Envoy pod, not on
    # `world` -- and post-DNAT, so it's the container port 10443, not 443.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    # paperless-mcp/nextcloud-mcp: standalone MCP servers this agent
    # connects to as a remote HTTP MCP client (see config.yaml's
    # mcp_servers section and kubernetes/apps/hermes-agent/{paperless-mcp,
    # nextcloud-mcp}/) -- same namespace as this agent, but Cilium policy
    # is still label-scoped per endpointSelector, not namespace-scoped, so
    # this needs an explicit rule same as any other peer.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": hermes-agent
            app.kubernetes.io/name: paperless-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": hermes-agent
            app.kubernetes.io/name: nextcloud-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": hermes-agent
            app.kubernetes.io/name: mailu-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": hermes-agent
            app.kubernetes.io/name: immich-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Firecrawl's api service (kubernetes/apps/hermes-agent/firecrawl/),
    # this agent's web.backend for search/scrape/extract. app-template
    # labels every controller's pods app.kubernetes.io/name: firecrawl
    # (verified live), distinguished by app.kubernetes.io/controller.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": hermes-agent
            app.kubernetes.io/name: firecrawl
            app.kubernetes.io/controller: api
      toPorts:
        - ports:
            - port: "3002"
              protocol: TCP
    # Shared Postgres cluster (kubernetes/apps/database/cloudnative-pg/) --
    # job-portfolio-schema.yaml's one-shot init Job and the
    # portfolio_price_check.py cron script (main container, psycopg2) both
    # connect directly, following the established "any pod can reach the
    # shared cluster" loose pattern already used elsewhere in this repo.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
