---
# hermes-agent: WhatsApp-only AI agent (no web UI/ingress in this minimal-safe
# first deployment -- see deployment.yaml). No Service is exposed, so this
# policy is egress-only in practice; Ingress is still declared with zero
# rules for explicit default-deny (defense in depth if a Service ever gets
# added later without someone remembering to revisit this file).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: hermes-agent
  ingress: []
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # OpenRouter (LLM API) + outbound WhatsApp connection, both over the
    # public internet on 443. Mirrors openclaw's identical world:443 rule.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # kubectl (installed by tools-install, invoked via the agent's terminal
    # tool): read-only Kubernetes API access (RBAC-gated, see rbac.yaml)
    - toEntities:
        - kube-apiserver
    # paperless-mcp/nextcloud-mcp: standalone MCP servers this agent
    # connects to as a remote HTTP MCP client (see config.yaml's
    # mcp_servers section and kubernetes/apps/hermes-agent/{paperless-mcp,
    # nextcloud-mcp}/) -- same namespace as this agent, but Cilium policy
    # is still label-scoped per endpointSelector, not namespace-scoped, so
    # this needs an explicit rule same as any other peer.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": hermes-agent
            app.kubernetes.io/name: paperless-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": hermes-agent
            app.kubernetes.io/name: nextcloud-mcp
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
