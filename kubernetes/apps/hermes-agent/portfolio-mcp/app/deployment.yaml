---
# portfolio-mcp: the depot's portfolio database (read holdings, add/retire WATCH candidates only) for the 'depot' profile.
# Same pattern as immich-mcp: generic python image, tool module from a
# ConfigMap, served over streamable HTTP by owui_tool_mcp_bridge.py.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio-mcp
  labels:
    app.kubernetes.io/name: portfolio-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: portfolio-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: portfolio-mcp
      annotations:
        backup.velero.io/backup-volumes-excludes: pylibs,tmp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-deps
          image: python:3.15-slim
          command:
            - "sh"
            - "-c"
          args:
            - |
              set -eu
              pip install --no-cache-dir --target=/pylibs "mcp>=1.6,<2" "psycopg[binary]>=3.2,<4" pydantic
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: pylibs
              mountPath: /pylibs
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
      containers:
        - name: mcp-server
          image: python:3.15-slim
          command:
            - "python3"
            - "/app/owui_tool_mcp_bridge.py"
          env:
            - name: TOOL_MODULE_PATH
              value: /app/portfolio_depot.py
            - name: MCP_SERVER_NAME
              value: portfolio
            - name: MCP_PORT
              value: "8000"
            - name: PYTHONPATH
              value: /pylibs
            - name: HOME
              value: /tmp
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PGHOST
              value: "postgres-rw.database.svc.cluster.local"
            - name: PGDATABASE
              value: "portfolio"
            - name: PGUSER
              value: "portfoliousr"
          envFrom:
            - secretRef:
                name: portfolio-mcp-secret
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: pylibs
              mountPath: /pylibs
            - name: app-src
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pylibs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: app-src
          configMap:
            name: portfolio-mcp-src
