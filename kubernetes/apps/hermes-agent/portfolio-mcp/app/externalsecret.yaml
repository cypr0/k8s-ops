---
# The portfolio role's password from the existing 1Password item `portfolio`
# (same value as hermes-agent-secrets' PORTFOLIO_DB_PASSWORD and the CNPG
# managed role portfoliousr).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: portfolio-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: portfolio-mcp-secret
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef:
        key: portfolio
        property: PORTFOLIO_POSTGRESQL_PASSWORD
