---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mailu-mcp
  namespace: hermes-agent
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: mailu-mcp
  ingress:
    # hermes-agent, as an MCP client (see hermes-agent's configmap.yaml
    # mcp_servers section)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": hermes-agent
            app.kubernetes.io/name: hermes-agent
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    # Gatus health check
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: gatus
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Mailu (mail.${SECRET_DOMAIN} resolves in-cluster to mailu-front's
    # ClusterIP, same trick paperless-ngx's own egress rule uses -- see
    # mailu's own ciliumnetworkpolicy.yaml comment): 993 for IMAP
    # (read-only mailbox tools), 443 for CalDAV (Radicale, proxied by
    # front at /webdav/ -- see mailu_full.py's module docstring).
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": mail
            app.kubernetes.io/name: mailu
      toPorts:
        - ports:
            - port: "993"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # pip install (init container) needs PyPI access.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
