---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# Two separate 1Password items, one per mailbox -- "mailu-philipp" and
# "mailu-ann", each a Login item with a "username" field (the FULL mail
# address, e.g. mail@<domain>) and a "password" field (that mailbox's
# real Mailu account password, same one used for IMAP/webmail login).
# Deliberately kept out of this public repo entirely: unlike
# ${SECRET_DOMAIN}-style substitution vars, these are real personal
# addresses with no narrower-scope alternative (same tradeoff the former
# sogo-mcp's "sogo" 1Password item made for the owner's Netcup account --
# see git history), so they only ever exist in 1Password and the
# resulting runtime Secret, never as a literal string anywhere in git.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mailu-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: mailu-mcp-secret
    creationPolicy: Owner
  data:
    - secretKey: PHILIPP_USERNAME
      remoteRef:
        key: mailu-philipp
        property: username
    - secretKey: PHILIPP_PASSWORD
      remoteRef:
        key: mailu-philipp
        property: password
    - secretKey: ANN_USERNAME
      remoteRef:
        key: mailu-ann
        property: username
    - secretKey: ANN_PASSWORD
      remoteRef:
        key: mailu-ann
        property: password
