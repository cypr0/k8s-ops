---
# Standalone MCP (Model Context Protocol) server giving hermes-agent
# CalDAV calendar + read-only IMAP access to the in-cluster Mailu
# instance (kubernetes/apps/mail/mailu/), for both the owner's and Ann's
# personal mailboxes. Replaces the former sogo-mcp (see git history),
# which pointed at the same kind of account on Netcup's now-retired SOGo
# hosting -- see mailu_full.py's module docstring for scope/auth
# decisions.
#
# Same "generic base image + ConfigMap script + init-container pip
# install" pattern as paperless-mcp/nextcloud-mcp/the former sogo-mcp --
# greenfield app, no CI/registry set up for it. `icalendar` is the one
# extra dependency those two don't need (for correctly generating/
# parsing VEVENT bodies rather than hand-rolling iCalendar's line-
# folding/escaping rules).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailu-mcp
  labels:
    app.kubernetes.io/name: mailu-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mailu-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mailu-mcp
      annotations:
        # No PVC here at all -- both volumes are plain emptyDirs (pip cache,
        # scratch /tmp). Exclude from Velero's kopia fs-backup (default
        # cluster-wide, --default-volumes-to-fs-backup): nothing worth
        # keeping, just restore-test flakiness for zero DR value.
        backup.velero.io/backup-volumes-excludes: pylibs,tmp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-deps
          image: python:3.14-slim
          command:
            - "sh"
            - "-c"
          args:
            - |
              set -eu
              # Pinned <2: see nextcloud-mcp/paperless-mcp's identical
              # comment -- the "mcp" SDK's 2.0.0 restructured its module
              # layout and dropped mcp.server.fastmcp.FastMCP from where
              # owui_tool_mcp_bridge.py imports it.
              pip install --no-cache-dir --target=/pylibs "mcp>=1.6,<2" httpx pydantic icalendar
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: pylibs
              mountPath: /pylibs
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
      containers:
        - name: mcp-server
          image: python:3.14-slim
          command:
            - "python3"
            - "/app/owui_tool_mcp_bridge.py"
          env:
            - name: TOOL_MODULE_PATH
              value: /app/mailu_full.py
            - name: MCP_SERVER_NAME
              value: mailu
            - name: MCP_PORT
              value: "8000"
            - name: PYTHONPATH
              value: /pylibs
            - name: HOME
              value: /tmp
            - name: PYTHONUNBUFFERED
              value: "1"
            # Not secret -- this is the same public hostname Mailu's own
            # TLS cert covers (certificate.yaml's dnsNames), which CoreDNS
            # resolves straight to mailu-front's ClusterIP for in-cluster
            # clients (see mailu's own ciliumnetworkpolicy.yaml comment on
            # the paperless-ngx rule for the same trick). Using the raw
            # *.svc.cluster.local name instead would fail TLS hostname
            # verification, since that name isn't in the cert's SANs.
            - name: MAILU_HOST
              value: "mail.${SECRET_DOMAIN}"
            - name: MAILU_IMAP_PORT
              value: "993"
          envFrom:
            - secretRef:
                name: mailu-mcp-secret
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: pylibs
              mountPath: /pylibs
            - name: app-src
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pylibs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: app-src
          configMap:
            name: mailu-mcp-src
