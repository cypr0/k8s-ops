---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
# 1Password item "sogo": SOGO_BASE_URL, SOGO_USERNAME, SOGO_PASSWORD,
# SOGO_IMAP_HOST, SOGO_IMAP_PORT. Real personal account credentials --
# see sogo_full.py's module docstring for why there's no narrower-scope
# alternative on Netcup's SOGo hosting.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sogo-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: sogo-mcp-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        SOGO_BASE_URL: "{{ .SOGO_BASE_URL }}"
        SOGO_USERNAME: "{{ .SOGO_USERNAME }}"
        SOGO_PASSWORD: "{{ .SOGO_PASSWORD }}"
        SOGO_IMAP_HOST: "{{ .SOGO_IMAP_HOST }}"
        SOGO_IMAP_PORT: "{{ .SOGO_IMAP_PORT }}"
  dataFrom:
    - extract:
        key: sogo
