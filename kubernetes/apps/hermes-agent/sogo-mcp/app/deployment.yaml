---
# Standalone MCP (Model Context Protocol) server for the Netcup-hosted
# SOGo groupware account (see sogo_full.py's module docstring for scope/
# auth decisions). Built for hermes-agent's remote HTTP MCP client
# support (kubernetes/apps/hermes-agent/hermes-agent/app/configmap.yaml's
# mcp_servers section).
#
# Same "generic base image + ConfigMap script + init-container pip
# install" pattern as paperless-mcp/nextcloud-mcp -- greenfield app, no
# CI/registry set up for it. `icalendar` is the one extra dependency
# those two don't need (for correctly generating/parsing VEVENT bodies
# rather than hand-rolling iCalendar's line-folding/escaping rules).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sogo-mcp
  labels:
    app.kubernetes.io/name: sogo-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sogo-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sogo-mcp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-deps
          image: python:3.14-slim
          command:
            - "sh"
            - "-c"
          args:
            - |
              set -eu
              # Pinned <2: see nextcloud-mcp/paperless-mcp's identical
              # comment -- the "mcp" SDK's 2.0.0 restructured its module
              # layout and dropped mcp.server.fastmcp.FastMCP from where
              # owui_tool_mcp_bridge.py imports it.
              pip install --no-cache-dir --target=/pylibs "mcp>=1.6,<2" httpx pydantic icalendar
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: pylibs
              mountPath: /pylibs
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
      containers:
        - name: mcp-server
          image: python:3.14-slim
          command:
            - "python3"
            - "/app/owui_tool_mcp_bridge.py"
          env:
            - name: TOOL_MODULE_PATH
              value: /app/sogo_full.py
            - name: MCP_SERVER_NAME
              value: sogo
            - name: MCP_PORT
              value: "8000"
            - name: PYTHONPATH
              value: /pylibs
            - name: HOME
              value: /tmp
            - name: PYTHONUNBUFFERED
              value: "1"
          envFrom:
            - secretRef:
                name: sogo-mcp-secret
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: pylibs
              mountPath: /pylibs
            - name: app-src
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pylibs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: app-src
          configMap:
            name: sogo-mcp-src
