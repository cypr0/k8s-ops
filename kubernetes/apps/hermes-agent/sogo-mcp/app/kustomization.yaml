---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hermes-agent
resources:
  - ./externalsecret.yaml
  - ./deployment.yaml
  - ./service.yaml
  - ./ciliumnetworkpolicy.yaml

# Content-hash-suffixed ConfigMap (same rationale as paperless-mcp/
# nextcloud-mcp): any change to either file changes the ConfigMap name,
# which changes the Deployment's volume reference, which triggers a real
# rollout automatically -- no force annotation or manual restart needed.
configMapGenerator:
  - name: sogo-mcp-src
    files:
      - sogo_full.py
      - owui_tool_mcp_bridge.py

generatorOptions:
  disableNameSuffixHash: false
