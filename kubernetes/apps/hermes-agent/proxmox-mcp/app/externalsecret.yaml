---
# 1Password item `hermes-proxmox`: an API token `hermes@pve!readonly` with Privilege Separation and the PVEAuditor role on `/`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: proxmox-mcp-secret
    creationPolicy: Owner
  data:
    - secretKey: PROXMOX_URL
      remoteRef:
        key: hermes-proxmox
        property: PROXMOX_URL
    - secretKey: PROXMOX_API_TOKEN_ID
      remoteRef:
        key: hermes-proxmox
        property: PROXMOX_API_TOKEN_ID
    - secretKey: PROXMOX_API_TOKEN_SECRET
      remoteRef:
        key: hermes-proxmox
        property: PROXMOX_API_TOKEN_SECRET
