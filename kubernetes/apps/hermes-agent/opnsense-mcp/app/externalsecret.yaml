---
# 1Password item `hermes-opnsense`: API key of a user `hermes` that only has the page privileges it should read. OPNsense has no read-only API role, so opnsense_net.py itself only sends GET and refuses action paths.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opnsense-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: opnsense-mcp-secret
    creationPolicy: Owner
  data:
    - secretKey: OPNSENSE_URL
      remoteRef:
        key: hermes-opnsense
        property: OPNSENSE_URL
    - secretKey: OPNSENSE_API_KEY
      remoteRef:
        key: hermes-opnsense
        property: OPNSENSE_API_KEY
    - secretKey: OPNSENSE_API_SECRET
      remoteRef:
        key: hermes-opnsense
        property: OPNSENSE_API_SECRET
