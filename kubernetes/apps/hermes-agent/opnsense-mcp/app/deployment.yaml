---
# opnsense-mcp: read-only OPNsense API access (GET only, action paths refused) for the 'netzwerk' profile.
# Same pattern as immich-mcp: generic python image, tool module from a
# ConfigMap, served over streamable HTTP by owui_tool_mcp_bridge.py.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opnsense-mcp
  labels:
    app.kubernetes.io/name: opnsense-mcp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: opnsense-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opnsense-mcp
      annotations:
        backup.velero.io/backup-volumes-excludes: pylibs,tmp
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: install-deps
          image: python:3.15-slim
          command:
            - "sh"
            - "-c"
          args:
            - |
              set -eu
              pip install --no-cache-dir --target=/pylibs "mcp>=1.6,<2" httpx pydantic
          env:
            - name: HOME
              value: /tmp
          volumeMounts:
            - name: pylibs
              mountPath: /pylibs
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
      containers:
        - name: mcp-server
          image: python:3.15-slim
          command:
            - "python3"
            - "/app/owui_tool_mcp_bridge.py"
          env:
            - name: TOOL_MODULE_PATH
              value: /app/opnsense_net.py
            - name: MCP_SERVER_NAME
              value: opnsense
            - name: MCP_PORT
              value: "8000"
            - name: PYTHONPATH
              value: /pylibs
            - name: HOME
              value: /tmp
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: OPNSENSE_VERIFY_TLS
              value: "true"
            # Pinned self-signed GUI certificate, base64 PEM (see the module
            # docstring); substituted by Flux from cluster-secrets.
            - name: OPNSENSE_CA_PEM_B64
              value: "${SECRET_OPNSENSE_CERT_B64}"
          envFrom:
            - secretRef:
                name: opnsense-mcp-secret
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - "ALL"
          volumeMounts:
            - name: pylibs
              mountPath: /pylibs
            - name: app-src
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: pylibs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: app-src
          configMap:
            name: opnsense-mcp-src
