---
# Only the two hermes-soc passwords are pulled from the shared `wazuh` item (explicit `data`, not `dataFrom: extract`), so the admin and dashboard credentials in that item never reach this namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wazuh-mcp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: wazuh-mcp-secret
    creationPolicy: Owner
  data:
    - secretKey: WAZUH_API_PASSWORD
      remoteRef:
        key: wazuh
        property: HERMES_WAZUH_API_PASSWORD
    - secretKey: WAZUH_INDEXER_PASSWORD
      remoteRef:
        key: wazuh
        property: HERMES_INDEXER_PASSWORD
