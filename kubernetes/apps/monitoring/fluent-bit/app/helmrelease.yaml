---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
spec:
  interval: 1h
  chart:
    spec:
      chart: fluent-bit
      version: "0.58.2"
      # No explicit namespace: it defaults to this HelmRelease's own, which is
      # where helmrepository.yaml puts the source anyway. Spelling it out here
      # silently stops Renovate from detecting the chart for updates -- the same
      # trap that hid version bumps for authentik, falco and kubescape.
      sourceRef:
        kind: HelmRepository
        name: fluent
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    # Run on ALL nodes (incl. control-plane): every node ships its own kernel
    # and service logs to the LoadBalancer, and the Service only routes to
    # ready endpoints. Toleration lets it schedule on any CP taint if present.
    affinity: {}
    tolerations:
      - operator: Exists

    # Used by the kube-audit Lua filter as the syslog hostname, so Wazuh can
    # tell which control-plane apiserver handled a request.
    env:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName

    # ── Kubernetes API audit → Wazuh ─────────────────────────────────────
    # Talos writes the apiserver audit log at Metadata level for EVERY request
    # (~100 MB per 15 min per control-plane node). This keeps only what is
    # security-relevant; measured on a 1h sample (2026-09-27): 1 event out of
    # ~11,300 -- human activity and incidents are what shows up.
    luaScripts:
      kube_audit.lua: |
        -- Kept (everything else is dropped):
        --   * pods/exec, pods/attach, pods/portforward, nodes/proxy
        --   * any write, and any secret access, by a non-"system:" user (humans)
        --   * writes to security-relevant resources by anyone (RBAC, secrets,
        --     webhooks, CRDs, policies, namespaces), minus status/token noise
        --   * 401/403 responses
        --   * anonymous requests other than the kubelet's own health probes
        local WATCH = {
          secrets = true, serviceaccounts = true, namespaces = true,
          clusterroles = true, clusterrolebindings = true, roles = true, rolebindings = true,
          mutatingwebhookconfigurations = true, validatingwebhookconfigurations = true,
          customresourcedefinitions = true, certificatesigningrequests = true,
          networkpolicies = true, ciliumnetworkpolicies = true,
          ciliumclusterwidenetworkpolicies = true, clusterpolicies = true, policies = true,
        }
        local WRITES = { create = true, update = true, patch = true, delete = true, deletecollection = true }
        local SESSION = { exec = true, attach = true, portforward = true }
        local QUIET_SUB = { status = true, token = true, approval = true }
        local PROBES = { ["/readyz"] = true, ["/livez"] = true, ["/healthz"] = true }
        local NODE = os.getenv("NODE_NAME") or "unknown"

        function keep_security_relevant(tag, ts, r)
          if r["stage"] ~= "ResponseComplete" or r["log"] == nil then
            return -1, 0, 0
          end
          local o = r["objectRef"] or {}
          local user = (r["user"] or {})["username"] or ""
          local code = (r["responseStatus"] or {})["code"] or 0
          local verb, res, sub = r["verb"] or "", o["resource"] or "", o["subresource"] or ""
          local human = user ~= "" and string.sub(user, 1, 7) ~= "system:"
          local path = string.match(r["requestURI"] or "", "^[^?]*") or ""

          local keep = (res == "pods" and SESSION[sub])
            or (res == "nodes" and sub == "proxy")
            or (human and (WRITES[verb] or res == "secrets"))
            or (WRITES[verb] and WATCH[res] and not QUIET_SUB[sub])
            or code == 401 or code == 403
            or (user == "system:anonymous" and not PROBES[path])
          if not keep then
            return -1, 0, 0
          end
          -- Only what the syslog output needs: the untouched JSON line, plus
          -- header fields. Keeps the record small and the JSON exactly as the
          -- apiserver wrote it.
          return 1, ts, { log = r["log"], appname = "kube-audit", node = NODE }
        end

    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi

    # Root is no longer strictly required (the syslog listeners and the
    # container-log tail are gone, and 5170 is unprivileged), but the chart's
    # DaemonSet still mounts /var/log. Left as-is deliberately; tightening it
    # is a separate change that needs its own verification.
    podSecurityContext:
      runAsNonRoot: false

    serviceMonitor:
      enabled: true

    config:
      service: |
        [SERVICE]
            Flush         5
            Daemon        Off
            Log_Level     info
            Parsers_File  parsers.conf
            Parsers_File  custom_parsers.conf
            HTTP_Server   On
            HTTP_Listen   0.0.0.0
            HTTP_Port     2020

      customParsers: |
        # Talos auditd: extract the Linux audit record type from msg, e.g.
        # "type=NETFILTER_CFG msg=audit(...)..." -> audit_type=NETFILTER_CFG.
        # Only auditd lines start with "type="; every other Talos log line
        # fails this regex and (with Reserve_Data+Preserve_Key) passes through
        # completely unchanged, so nothing is dropped or rewritten.
        [PARSER]
            Name        talos_audit_type
            Format      regex
            Regex       ^type=(?<audit_type>[A-Z0-9_]+)

      inputs: |
        # ── Talos kernel + service logs (CIS Talos 6.1.1/6.2.1) ─────────
        # The only remaining input. Talos ships these as raw JSON-lines over
        # plain TCP, not syslog framing, which is why Fluent Bit is still here
        # at all: Alloy's loki.source.syslog expects RFC5424 and Talos offers
        # no syslog format.
        #
        # Everything else that used to arrive here has moved to Wazuh, which
        # decodes it into alerts instead of storing raw text: OPNsense and its
        # Suricata IDS via the os-wazuh-agent plugin, Proxmox via a native
        # agent (see kubernetes/apps/automation/proxmox-ansible/). Container
        # logs are collected cluster-wide by Alloy, which needs no per-namespace
        # glob here.
        [INPUT]
            Name          tcp
            Listen        0.0.0.0
            Port          5170
            Format        json
            Tag           talos.log

        # ── Kubernetes API audit log (control-plane nodes only) ──────────
        # The file only exists on control-plane nodes; on workers this input
        # just finds nothing. Talos rotates by rename every ~100 MB, which
        # tail follows (Rotate_Wait). The DB keeps the offset across pod
        # restarts so nothing is re-sent or skipped.
        [INPUT]
            Name              tail
            Path              /var/log/audit/kube/kube-apiserver.log
            Tag               kube.audit
            DB                /var/log/flb-kube-audit.db
            Read_from_Head    false
            Refresh_Interval  5
            Rotate_Wait       30
            Buffer_Chunk_Size 128k
            Buffer_Max_Size   1M
            Skip_Long_Lines   On
            Mem_Buf_Limit     16MB

      filters: |
        # Add job label for Loki (Talos kernel/service logs)
        [FILTER]
            Name          modify
            Match         talos.log
            Add           job talos

        # Extract audit_type from Talos auditd records (see talos_audit_type
        # parser). Reserve_Data+Preserve_Key = non-matching records pass through
        # untouched, so only auditd lines gain an audit_type field.
        [FILTER]
            Name          parser
            Match         talos.log
            Key_Name      msg
            Parser        talos_audit_type
            Reserve_Data  On
            Preserve_Key  On

        # kube.audit: parse the JSON for the Lua filter, but keep the raw
        # line (Preserve_Key) -- that raw line is what goes to Wazuh.
        [FILTER]
            Name          parser
            Match         kube.audit
            Key_Name      log
            Parser        json
            Reserve_Data  On
            Preserve_Key  On

        [FILTER]
            Name          lua
            Match         kube.audit
            script        /fluent-bit/scripts/kube_audit.lua
            call          keep_security_relevant

      outputs: |
        # ── Loki (Talos kernel/service logs) ─────────────────────────────
        [OUTPUT]
            Name             loki
            Match            talos.log
            Host             loki.monitoring.svc.cluster.local
            Port             3100
            Labels           job=talos
            # Talos names the field `node` (machine.logging extraTags.node in
            # talconfig.yaml), not `hostname`. $hostname matched nothing, so
            # until 2026-09-27 every Talos stream had no per-node label.
            # Kernel (kmsg) lines carry no node tag at all and stay unlabelled.
            Label_Keys       $node
            Line_Format      json
            Retry_Limit      5

        # ── Wazuh (Kubernetes API audit, security-relevant events only) ──
        # BSD/RFC3164 framing on purpose: Wazuh's pre-decoder recognises that
        # header and sets program_name "kube-audit", which its local decoder
        # keys on. Syslog_MaxSize raised from the 1 KiB default, which would
        # cut audit events in half.
        [OUTPUT]
            Name                syslog
            Match               kube.audit
            Host                wazuh-syslog.wazuh.svc.cluster.local
            Port                514
            Mode                udp
            Syslog_Format       rfc3164
            Syslog_MaxSize      65000
            Syslog_Hostname_Key node
            Syslog_Appname_Key  appname
            Syslog_Message_Key  log

    # Expose the Talos log port on pods. The chart also adds this entry to the
    # Service, which requires a valid `port` (1-65535); without it the Service
    # port defaults to 0 and the Helm upgrade fails ("port: Invalid value: 0").
    extraPorts:
      - name: talos-log-tcp
        port: 5170
        containerPort: 5170
        protocol: TCP
        targetPort: 5170
