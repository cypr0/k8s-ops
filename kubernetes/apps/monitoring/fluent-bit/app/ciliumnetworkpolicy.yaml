---
# Fluent Bit: Talos node logs in, Loki out; filtered API audit log to Wazuh.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: fluent-bit
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  ingress:
    # Talos kernel/service logs via LoadBalancer. Traffic originates from the
    # node's own host network stack (kernel logging starts before CNI is up),
    # so it's classified as remote-node/host, not world.
    - fromEntities:
        - remote-node
        - host
      toPorts:
        - ports:
            - port: "5170"
              protocol: TCP
    # Prometheus metrics scraping (port 2020)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "2020"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Loki (Talos node logs).
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    # Wazuh manager remote syslog: filtered Kubernetes API audit events
    # (kube_audit.lua in helmrelease.yaml).
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": wazuh
            app: wazuh-manager
      toPorts:
        - ports:
            - port: "514"
              protocol: UDP
