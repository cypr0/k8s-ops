---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "86.1.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring
  maxHistory: 2
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
      strategy: rollback
  values:
    crds:
      enabled: true

    # Grafana deployed separately
    grafana:
      enabled: false
      forceDeployDashboards: true
      defaultDashboardsTimezone: Europe/Berlin

    # Alertmanager — config from ExternalSecret
    alertmanager:
      alertmanagerSpec:
        configSecret: alertmanager-pushover
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
        # "securityContext", NOT "podSecurityContext": the operator CRs carry a
        # PodSecurityContext under spec.securityContext, and the chart has no
        # podSecurityContext key at all. Helm drops unknown values without a
        # word, so the podSecurityContext block that used to stand here never
        # did anything -- the pods were running on operator defaults, which
        # happened to include runAsNonRoot and so hid the mistake.
        # Spelled out in full because this may replace rather than merge.
        securityContext:
          fsGroup: 2000
          fsGroupChangePolicy: OnRootMismatch
          runAsGroup: 2000
          runAsUser: 1000
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - "ALL"
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: zfs-nfs
              accessModes:
                - "ReadWriteOnce"
              resources:
                requests:
                  storage: 1Gi

    # Prometheus
    prometheus:
      prometheusSpec:
        retention: 30d
        retentionSize: 18GiB
        # Scrape all ServiceMonitors/PodMonitors/Rules regardless of labels
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        ruleSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 3Gi
        # "securityContext", NOT "podSecurityContext": the operator CRs carry a
        # PodSecurityContext under spec.securityContext, and the chart has no
        # podSecurityContext key at all. Helm drops unknown values without a
        # word, so the podSecurityContext block that used to stand here never
        # did anything -- the pods were running on operator defaults, which
        # happened to include runAsNonRoot and so hid the mistake.
        # Spelled out in full because this may replace rather than merge.
        securityContext:
          fsGroup: 2000
          fsGroupChangePolicy: OnRootMismatch
          runAsGroup: 2000
          runAsUser: 1000
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - "ALL"
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: zfs-nfs
              accessModes:
                - "ReadWriteOnce"
              resources:
                requests:
                  storage: 20Gi

    # node-exporter
    nodeExporter:
      enabled: true
    prometheus-node-exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - "ALL"

    # kube-state-metrics
    kubeStateMetrics:
      enabled: true
    kube-state-metrics:
      # Without an allowlist, kube-state-metrics emits no kube_*_labels series
      # at all, which leaves the "Kubernetes / Views" dashboards unable to group
      # workloads by app. Scoped deliberately to the two label keys those
      # dashboards actually join on, rather than "*" -- each additional label
      # multiplies series count, and this cluster runs on one host.
      metricLabelsAllowlist:
        - pods=[app.kubernetes.io/name,app.kubernetes.io/instance]
        - deployments=[app.kubernetes.io/name,app.kubernetes.io/instance]
        - statefulsets=[app.kubernetes.io/name,app.kubernetes.io/instance]
        - daemonsets=[app.kubernetes.io/name,app.kubernetes.io/instance]
        - namespaces=[kubernetes.io/metadata.name]
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 128Mi
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - "ALL"

    # Default alerting rules
    defaultRules:
      create: true
      rules:
        alertmanager: true
        etcd: false
        configReloaders: true
        general: true
        k8s: true
        kubeApiserverAvailability: true
        kubeApiserverBurnrate: true
        kubeApiserverHistogram: true
        kubeApiserverSlos: true
        kubeControllerManager: false
        kubelet: true
        kubeProxy: false
        kubeSchedulerAlerting: false
        kubeSchedulerRecording: false
        kubeStateMetrics: true
        network: true
        node: true
        nodeExporterAlerting: true
        nodeExporterRecording: true
        prometheus: true
        prometheusOperator: true

    # Disable components managed elsewhere
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
