---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-pushover
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-pushover
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          global:
            resolve_timeout: 5m
          inhibit_rules:
            - source_matchers:
                - severity = "critical"
              target_matchers:
                - severity = "warning"
              equal:
                - namespace
                - alertname
          receivers:
            - name: "null"
            - name: pushover
              pushover_configs:
                - user_key: "{{ .PUSHOVER_USER_KEY }}"
                  token: "{{ .ALERTMANAGER_PUSHOVER_API_TOKEN }}"
                  priority: 0
                  retry: 60s
                  expire: 3600s
                  send_resolved: true
            # Warnings: no "resolved" message (it doubled every flap) and a
            # slow reminder, see the route below.
            - name: pushover-warning
              pushover_configs:
                - user_key: "{{ .PUSHOVER_USER_KEY }}"
                  token: "{{ .ALERTMANAGER_PUSHOVER_API_TOKEN }}"
                  priority: 0
                  send_resolved: false
          route:
            group_by: ["namespace", "alertname"]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            # Whatever no route below claims is dropped, not pushed. The
            # default used to be pushover, so Watchdog/InfoInhibitor needed
            # explicit null routes and any alert without a severity label
            # (or with "info") would have paged. The Pushover plan is 10,000
            # messages a month shared with Wazuh, Gatus and Falco.
            receiver: "null"
            routes:
              - receiver: pushover
                matchers:
                  - severity = "critical"
              - receiver: pushover-warning
                matchers:
                  - severity = "warning"
                # A warning that is still firing three days later is a
                # reminder, not news. At 12h, three permanently firing
                # groups sent ~84 of the 140 messages in two weeks (3 groups
                # x 2 a day x 14 days; derived, not measured per alert).
                repeat_interval: 3d
  dataFrom:
    - extract:
        key: pushover
