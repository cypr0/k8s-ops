---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
# Custom alert, additional to the chart's own defaultRules (helmrelease.yaml).
#
# Context: docs/incidents/2026-09-20-cilium-cnp-scrape-target-drop.md. The
# chart's built-in `TargetDown` rule (group `general.rules`) already fires on
# >10% of a job's targets being down for 10m -- but that incident's targets
# were down 100% of the time, forever, since the job was first added. A target
# that has *never once* succeeded produces a `up` time series stuck at 0
# rather than "missing," so TargetDown *should* have caught it and did not
# fire historically (root cause of that gap not fully re-derived here -- this
# rule is deliberately independent and simpler, as a second line of defense,
# not a replacement).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scrape-target-sustained-down
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: scrape-target-sustained-down
      rules:
        - alert: ScrapeTargetSustainedDown
          annotations:
            description: '{{ $labels.job }}/{{ $labels.instance }} in namespace {{ $labels.namespace }} has reported up == 0 continuously for at least 24h. This catches targets that are down from the moment they''re first scraped (e.g. a missing CiliumNetworkPolicy port), which the percentage-based TargetDown alert can miss if the target never had a healthy baseline. See docs/incidents/2026-09-20-cilium-cnp-scrape-target-drop.md.'
            summary: A scrape target has been down for a sustained period (24h+).
          # `max_over_time(up[24h]) == 0` alone is also true for a pod that
          # is one scrape old and still starting up, so every rollout paged
          # for a minute (20 episodes in 14 days: grafana, authentik-server).
          # `up offset 23h == 0` requires the series to have existed -- and
          # been down -- a day ago, which is what "24h+" was meant to say.
          expr: max_over_time(up[24h]) == 0 and up offset 23h == 0
          for: 0m
          labels:
            severity: warning
    # 2026-10-11 12:15Z to 2026-10-17 18:06Z: fluent-bit's syslog output
    # (kube-audit -> Wazuh) delivered 0 records and dropped ~1.7k per 6h after
    # the wazuh-manager pod was replaced, and nothing alerted. Fluent Bit only
    # logs "[engine] failed to flush chunk", so this rule watches the counters.
    - name: fluent-bit-output-stalled
      rules:
        - alert: FluentBitOutputStalled
          annotations:
            description: 'Fluent Bit output {{ $labels.name }} has dropped records and delivered none for 30m. For a UDP output (syslog.*) this usually means its socket was disconnected or pinned to a dead backend when the destination pod was replaced; restart the fluent-bit DaemonSet.'
            summary: A Fluent Bit output is dropping everything.
          expr: |
            sum by (name) (increase(fluentbit_output_dropped_records_total[30m])) > 0
            and
            sum by (name) (increase(fluentbit_output_proc_records_total[30m])) == 0
          for: 30m
          labels:
            severity: warning
    # 2026-10-27 02:09Z: the daily Velero backup failed on an S3 500 from the
    # object store, the Kopia maintenance jobs failed for roughly six hours,
    # and the CNPG base backup failed in the same window. Nothing alerted.
    # The failure surfaced only because the ISMS assessment reads backup
    # phases once a day, and even that produces a report rather than a page.
    # See docs/incidents/2026-10-27-s3-write-outage-silent-backup-failure.md.
    - name: backup-velero
      rules:
        # Deliberately not velero_backup_last_status: it read 1 (success) for
        # schedule="daily" while that very backup sat in phase Failed --
        # measured 2026-10-27. The counter below and the timestamp further
        # down both reported the failure correctly, so those are what the
        # alerts use.
        - alert: VeleroBackupFailed
          annotations:
            description: 'Velero schedule {{ $labels.schedule }} recorded a failed backup. Check `kubectl -n velero get backups.velero.io` and the server log; a 500 from the object store means the provider, not the cluster. A failed run is not retried -- the next attempt is the next scheduled one.'
            summary: A Velero backup failed.
          expr: increase(velero_backup_failure_total[2h]) > 0
          for: 0m
          labels:
            severity: critical
        # One missed daily run plus margin. Normal operation keeps this at or
        # below 24h, because the schedule is 0 2 * * *.
        #
        # An on-demand catch-up backup does NOT clear this, because the metric
        # is keyed by the schedule label and a manual Backup carries a
        # different one. That is intentional: the question here is whether the
        # *schedule* is producing backups.
        - alert: VeleroBackupStaleDaily
          annotations:
            description: 'No successful backup from the daily Velero schedule for over 36h. Expected interval is 24h, so at least one run was lost. If a catch-up backup was taken by hand this still fires, because the alert tracks the schedule rather than the object store.'
            summary: Daily Velero backup is overdue.
          expr: time() - velero_backup_last_successful_timestamp{schedule="daily"} > 129600
          for: 15m
          labels:
            severity: critical
        - alert: VeleroBackupStaleWeekly
          annotations:
            description: 'No successful backup from the weekly Velero schedule for over 9d. Expected interval is 7d.'
            summary: Weekly Velero backup is overdue.
          expr: time() - velero_backup_last_successful_timestamp{schedule="weekly"} > 777600
          for: 15m
          labels:
            severity: warning
        - alert: VeleroBackupStaleMonthly
          annotations:
            description: 'No successful backup from the monthly Velero schedule for over 35d. Expected interval is one calendar month.'
            summary: Monthly Velero backup is overdue.
          expr: time() - velero_backup_last_successful_timestamp{schedule="monthly"} > 3024000
          for: 15m
          labels:
            severity: warning
    - name: backup-cnpg
      rules:
        # cnpg_collector_last_available_backup_timestamp cannot be used: with
        # the barman-cloud *plugin* (spec.plugins, isWALArchiver) it stays at
        # 0 even though base backups complete -- measured 2026-10-27, when 30
        # Backup objects were `completed` and the metric still read 0. The
        # cluster's status.lastSuccessfulBackup is empty for the same reason.
        #
        # So the failure side is watched instead, and via changes() rather
        # than an age comparison. An age test would stay lit for a day after
        # one failure and would not clear when the next backup succeeded,
        # which is how an alert teaches people to ignore it. changes() fires
        # on a *new* failure timestamp and clears an hour later.
        - alert: CNPGBaseBackupFailed
          annotations:
            description: 'A CloudNativePG base backup failed in namespace {{ $labels.namespace }}. WAL archiving can keep working while this fails, and WAL without a base backup cannot be restored. Check `kubectl -n database get backups.postgresql.cnpg.io` and the barman-cloud plugin sidecar log.'
            summary: CloudNativePG base backup failed.
          expr: changes(cnpg_collector_last_failed_backup_timestamp[1h]) > 0
          for: 5m
          labels:
            severity: critical
        # The archiver hands WAL segments to the object store continuously.
        # A stall means the write path is broken even if the last base backup
        # looked fine, and it is the earlier signal of the two.
        - alert: CNPGWALArchiveStalled
          annotations:
            description: 'No WAL segment archived for 30m in namespace {{ $labels.namespace }}. Point-in-time recovery loses everything after the last archived segment. Normal value is a few minutes.'
            summary: CloudNativePG WAL archiving has stalled.
          expr: cnpg_pg_stat_archiver_seconds_since_last_archival > 1800
          for: 15m
          labels:
            severity: critical
        - alert: CNPGWALArchiveFailing
          annotations:
            description: 'WAL archive attempts are failing in namespace {{ $labels.namespace }}. Postgres retries, so archiving may still be keeping up -- but the failures are a leading indicator of the object store rejecting writes.'
            summary: CloudNativePG WAL archive attempts are failing.
          expr: increase(cnpg_pg_stat_archiver_failed_count[1h]) > 0
          for: 10m
          labels:
            severity: warning
