---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
# Custom alert, additional to the chart's own defaultRules (helmrelease.yaml).
#
# Context: docs/incidents/2026-09-20-cilium-cnp-scrape-target-drop.md. The
# chart's built-in `TargetDown` rule (group `general.rules`) already fires on
# >10% of a job's targets being down for 10m -- but that incident's targets
# were down 100% of the time, forever, since the job was first added. A target
# that has *never once* succeeded produces a `up` time series stuck at 0
# rather than "missing," so TargetDown *should* have caught it and did not
# fire historically (root cause of that gap not fully re-derived here -- this
# rule is deliberately independent and simpler, as a second line of defense,
# not a replacement).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scrape-target-sustained-down
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: scrape-target-sustained-down
      rules:
        - alert: ScrapeTargetSustainedDown
          annotations:
            description: '{{ $labels.job }}/{{ $labels.instance }} in namespace {{ $labels.namespace }} has reported up == 0 continuously for at least 24h. This catches targets that are down from the moment they''re first scraped (e.g. a missing CiliumNetworkPolicy port), which the percentage-based TargetDown alert can miss if the target never had a healthy baseline. See docs/incidents/2026-09-20-cilium-cnp-scrape-target-drop.md.'
            summary: A scrape target has been down for a sustained period (24h+).
          # `max_over_time(up[24h]) == 0` alone is also true for a pod that
          # is one scrape old and still starting up, so every rollout paged
          # for a minute (20 episodes in 14 days: grafana, authentik-server).
          # `up offset 23h == 0` requires the series to have existed -- and
          # been down -- a day ago, which is what "24h+" was meant to say.
          expr: max_over_time(up[24h]) == 0 and up offset 23h == 0
          for: 0m
          labels:
            severity: warning
    # 2026-10-11 12:15Z to 2026-10-17 18:06Z: fluent-bit's syslog output
    # (kube-audit -> Wazuh) delivered 0 records and dropped ~1.7k per 6h after
    # the wazuh-manager pod was replaced, and nothing alerted. Fluent Bit only
    # logs "[engine] failed to flush chunk", so this rule watches the counters.
    - name: fluent-bit-output-stalled
      rules:
        - alert: FluentBitOutputStalled
          annotations:
            description: 'Fluent Bit output {{ $labels.name }} has dropped records and delivered none for 30m. For a UDP output (syslog.*) this usually means its socket was disconnected or pinned to a dead backend when the destination pod was replaced; restart the fluent-bit DaemonSet.'
            summary: A Fluent Bit output is dropping everything.
          expr: |
            sum by (name) (increase(fluentbit_output_dropped_records_total[30m])) > 0
            and
            sum by (name) (increase(fluentbit_output_proc_records_total[30m])) == 0
          for: 30m
          labels:
            severity: warning
