---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
# Custom alert, additional to the chart's own defaultRules (helmrelease.yaml).
#
# Context: docs/incidents/2026-09-20-cilium-cnp-scrape-target-drop.md. The
# chart's built-in `TargetDown` rule (group `general.rules`) already fires on
# >10% of a job's targets being down for 10m -- but that incident's targets
# were down 100% of the time, forever, since the job was first added. A target
# that has *never once* succeeded produces a `up` time series stuck at 0
# rather than "missing," so TargetDown *should* have caught it and did not
# fire historically (root cause of that gap not fully re-derived here -- this
# rule is deliberately independent and simpler, as a second line of defense,
# not a replacement).
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: scrape-target-sustained-down
  namespace: monitoring
  labels:
    app.kubernetes.io/name: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: scrape-target-sustained-down
      rules:
        - alert: ScrapeTargetSustainedDown
          annotations:
            description: '{{ $labels.job }}/{{ $labels.instance }} in namespace {{ $labels.namespace }} has reported up == 0 continuously for at least 24h. This catches targets that are down from the moment they''re first scraped (e.g. a missing CiliumNetworkPolicy port), which the percentage-based TargetDown alert can miss if the target never had a healthy baseline. See docs/incidents/2026-09-20-cilium-cnp-scrape-target-drop.md.'
            summary: A scrape target has been down for a sustained period (24h+).
          # `max_over_time(up[24h]) == 0` alone is also true for a pod that
          # is one scrape old and still starting up, so every rollout paged
          # for a minute (20 episodes in 14 days: grafana, authentik-server).
          # `up offset 23h == 0` requires the series to have existed -- and
          # been down -- a day ago, which is what "24h+" was meant to say.
          expr: max_over_time(up[24h]) == 0 and up offset 23h == 0
          for: 0m
          labels:
            severity: warning
    # 2026-10-11 12:15Z to 2026-10-17 18:06Z: fluent-bit's syslog output
    # (kube-audit -> Wazuh) delivered 0 records and dropped ~1.7k per 6h after
    # the wazuh-manager pod was replaced, and nothing alerted. Fluent Bit only
    # logs "[engine] failed to flush chunk", so this rule watches the counters.
    - name: fluent-bit-output-stalled
      rules:
        - alert: FluentBitOutputStalled
          annotations:
            description: 'Fluent Bit output {{ $labels.name }} has dropped records and delivered none for 30m. For a UDP output (syslog.*) this usually means its socket was disconnected or pinned to a dead backend when the destination pod was replaced; restart the fluent-bit DaemonSet.'
            summary: A Fluent Bit output is dropping everything.
          expr: |
            sum by (name) (increase(fluentbit_output_dropped_records_total[30m])) > 0
            and
            sum by (name) (increase(fluentbit_output_proc_records_total[30m])) == 0
          for: 30m
          labels:
            severity: warning
    # 2026-10-27 02:09Z: the daily Velero backup failed on an S3 500 from the
    # object store, the Kopia maintenance jobs failed for roughly six hours,
    # and the CNPG base backup failed in the same window. Nothing alerted.
    # The failure surfaced only because the ISMS assessment reads backup
    # phases once a day, and even that produces a report rather than a page.
    # See docs/incidents/2026-10-27-s3-write-outage-silent-backup-failure.md.
    - name: backup-velero
      rules:
        # Deliberately not velero_backup_last_status: it read 1 (success) for
        # schedule="daily" while that very backup sat in phase Failed --
        # measured 2026-10-27. The counter below and the timestamp further
        # down both reported the failure correctly, so those are what the
        # alerts use.
        - alert: VeleroBackupFailed
          annotations:
            description: 'Velero schedule {{ $labels.schedule }} recorded a failed backup. Check `kubectl -n velero get backups.velero.io` and the server log; a 500 from the object store means the provider, not the cluster. A failed run is not retried -- the next attempt is the next scheduled one.'
            summary: A Velero backup failed.
          expr: increase(velero_backup_failure_total[2h]) > 0
          for: 0m
          labels:
            severity: critical
        # One missed daily run plus margin. Normal operation keeps this at or
        # below 24h, because the schedule is 0 2 * * *.
        #
        # An on-demand catch-up backup does NOT clear this, because the metric
        # is keyed by the schedule label and a manual Backup carries a
        # different one. That is intentional: the question here is whether the
        # *schedule* is producing backups.
        - alert: VeleroBackupStaleDaily
          annotations:
            description: 'No successful backup from the daily Velero schedule for over 36h. Expected interval is 24h, so at least one run was lost. If a catch-up backup was taken by hand this still fires, because the alert tracks the schedule rather than the object store.'
            summary: Daily Velero backup is overdue.
          expr: time() - velero_backup_last_successful_timestamp{schedule="daily"} > 129600
          for: 15m
          labels:
            severity: critical
        - alert: VeleroBackupStaleWeekly
          annotations:
            description: 'No successful backup from the weekly Velero schedule for over 9d. Expected interval is 7d.'
            summary: Weekly Velero backup is overdue.
          expr: time() - velero_backup_last_successful_timestamp{schedule="weekly"} > 777600
          for: 15m
          labels:
            severity: warning
        - alert: VeleroBackupStaleMonthly
          annotations:
            description: 'No successful backup from the monthly Velero schedule for over 35d. Expected interval is one calendar month.'
            summary: Monthly Velero backup is overdue.
          expr: time() - velero_backup_last_successful_timestamp{schedule="monthly"} > 3024000
          for: 15m
          labels:
            severity: warning
    - name: backup-cnpg
      rules:
        # cnpg_collector_last_available_backup_timestamp cannot be used: with
        # the barman-cloud *plugin* (spec.plugins, isWALArchiver) it stays at
        # 0 even though base backups complete -- measured 2026-10-27, when 30
        # Backup objects were `completed` and the metric still read 0. The
        # cluster's status.lastSuccessfulBackup is empty for the same reason.
        #
        # So the failure side is watched instead, and via changes() rather
        # than an age comparison. An age test would stay lit for a day after
        # one failure and would not clear when the next backup succeeded,
        # which is how an alert teaches people to ignore it. changes() fires
        # on a *new* failure timestamp and clears an hour later.
        - alert: CNPGBaseBackupFailed
          annotations:
            description: 'A CloudNativePG base backup failed in namespace {{ $labels.namespace }}. WAL archiving can keep working while this fails, and WAL without a base backup cannot be restored. Check `kubectl -n database get backups.postgresql.cnpg.io` and the barman-cloud plugin sidecar log.'
            summary: CloudNativePG base backup failed.
          expr: changes(cnpg_collector_last_failed_backup_timestamp[1h]) > 0
          for: 5m
          labels:
            severity: critical
        # The archiver hands WAL segments to the object store continuously.
        # A stall means the write path is broken even if the last base backup
        # looked fine, and it is the earlier signal of the two.
        - alert: CNPGWALArchiveStalled
          annotations:
            description: 'No WAL segment archived for 30m in namespace {{ $labels.namespace }}. Point-in-time recovery loses everything after the last archived segment. Normal value is a few minutes.'
            summary: CloudNativePG WAL archiving has stalled.
          expr: cnpg_pg_stat_archiver_seconds_since_last_archival > 1800
          for: 15m
          labels:
            severity: critical
        - alert: CNPGWALArchiveFailing
          annotations:
            description: 'WAL archive attempts are failing in namespace {{ $labels.namespace }}. Postgres retries, so archiving may still be keeping up -- but the failures are a leading indicator of the object store rejecting writes.'
            summary: CloudNativePG WAL archive attempts are failing.
          expr: increase(cnpg_pg_stat_archiver_failed_count[1h]) > 0
          for: 10m
          labels:
            severity: warning
    # ISMS. The dashboard shows the posture; these catch the states where the
    # dashboard would look fine while the machinery behind it has stopped.
    #
    # Deliberately NOT alerted on: a deviating control. There are 14 and they
    # are tracked in the treatment plan with owners and deadlines; paging on a
    # known, owned finding trains the operator to ignore the channel. What is
    # alerted on is the ISMS losing the ability to tell the truth -- stale
    # evidence, a stale assessment, a rising ratchet, an expired attestation,
    # a deadline passing.
    - name: isms-machinery
      rules:
        # The collector harvests at 04:00 daily. Past 36h a run was missed;
        # past 7d assess.py turns every machine verdict into an error, so the
        # assessment stops making claims rather than making stale ones.
        - alert: ISMSEvidenceStale
          annotations:
            description: 'The committed ISMS evidence snapshot is over 36h old, so the collector missed at least one run. Check `kubectl -n security get cronjob isms-collector` and the last job log. Every control verdict on the ISMS dashboard describes the cluster as it was at that snapshot.'
            summary: ISMS evidence snapshot is overdue.
          expr: time() - isms_evidence_timestamp_seconds > 129600
          for: 30m
          labels:
            severity: warning
        - alert: ISMSEvidenceAncient
          annotations:
            description: 'The committed ISMS evidence snapshot is over 7d old. scripts/assess.py refuses to treat machine checks as passing beyond this age, so the assessment is now reporting errors rather than verdicts. The compliance figure on the dashboard is meaningless until the collector runs again.'
            summary: ISMS evidence is older than the assessment will accept.
          expr: time() - isms_evidence_timestamp_seconds > 604800
          for: 30m
          labels:
            severity: critical
        # Evidence newer than the assessment computed from it. Normal for a
        # few minutes between the collector's commit and the pipeline run;
        # sustained means the pipeline is broken and the dashboard is showing
        # verdicts about an older cluster.
        - alert: ISMSAssessmentBehindEvidence
          annotations:
            description: 'The committed ISMS assessment was computed from evidence {{ $value | humanizeDuration }} older than the newest committed snapshot. The pipeline in isms/compliance-as-code has not run, or failed. Until it does, every verdict on the dashboard describes an older cluster.'
            summary: ISMS assessment is behind the available evidence.
          expr: isms_evidence_timestamp_seconds - isms_assessment_timestamp_seconds > 7200
          for: 1h
          labels:
            severity: warning
        # The exporter serves its last good body during an outage, by design:
        # taking the target down would turn "the assessment is getting old"
        # into "no data", which reads as nothing being wrong. The consequence
        # is that only this alert reveals a broken fetch.
        - alert: ISMSExporterFetchFailing
          annotations:
            description: 'The isms-exporter has not read assessment/metrics.prom from GitLab for over 1h (last HTTP status {{ with query "isms_exporter_last_http_status" }}{{ . | first | value }}{{ end }}). It keeps serving the last fetched body, so the dashboard still shows numbers -- they are simply ageing. Check the exporter log and the GitLab ingress policy.'
            summary: ISMS exporter cannot read the metrics file.
          expr: time() - isms_exporter_last_fetch_success_timestamp_seconds > 3600
          for: 15m
          labels:
            severity: warning
        - alert: ISMSExporterNoMetrics
          annotations:
            description: 'The isms-exporter has never successfully read the metrics file, so every ISMS panel is empty. Most likely the project access token is missing, expired or lacks read_api, or the CiliumNetworkPolicy on either side does not permit the call. It deliberately does not emit zeroed ISMS metrics in this state.'
            summary: ISMS exporter has no metrics at all.
          expr: isms_exporter_has_metrics == 0
          for: 30m
          labels:
            severity: warning
    - name: isms-posture
      rules:
        # The one invariant the whole tailoring rests on: the untriaged
        # remainder may fall and never rise. isms_improvement_ratchet also
        # fails the pipeline on a rise, so this is the second line -- it
        # catches the case where nobody looks at a failed pipeline.
        - alert: ISMSRatchetRose
          annotations:
            description: 'The ISMS ratchet rose by {{ $value }} over the last day: controls that were triaged are now counted as untriaged again. This is the one thing the ratchet exists to forbid. The pipeline check isms_improvement_ratchet should have refused the commit, so a firing alert here means that check was bypassed or is broken.'
            summary: ISMS ratchet increased.
          expr: increase(isms_untriaged_controls[1d]) > 0
          for: 0m
          labels:
            severity: critical
        # A control that could not be assessed at all. Distinct from a
        # deviation on purpose: a deviation is a known, treated gap, while an
        # error means the assessment has no opinion and the dashboard's
        # compliance percentage is computed over fewer controls than it
        # claims.
        #
        # This alert was missing until 2026-11-06 and the gap cost three days.
        # Two kubectl calls were added to the harvester on 2026-11-03 without
        # extending the collector's RBAC, so one evidence source failed with
        # Forbidden every night. harvest.py recorded the failure in meta.json
        # and left the previous file in place, the assessment read it as
        # current, and three controls reported a backup 72.9 hours overdue
        # while every nightly backup had in fact completed. Nothing alerted,
        # because the snapshot as a whole was fresh -- only one file inside it
        # was not.
        - alert: ISMSAssessmentError
          annotations:
            description: '{{ $value }} control(s) could not be assessed. The usual cause is an evidence source that failed to harvest -- check sources[].status in evidence/latest/meta.json, the isms-collector CronJob logs, and whether a recently added source needs RBAC the collector does not have. The compliance percentage on this dashboard excludes these controls, so it reads better than the evidence supports.'
            summary: ISMS control could not be assessed.
          expr: isms_controls_by_verdict{verdict="error"} > 0
          for: 30m
          labels:
            severity: warning
        # A deviation with no treatment measure. poam.py fails the pipeline on
        # this, so like the ratchet it should be unreachable -- which is
        # exactly why it is worth an alert.
        - alert: ISMSDeviationUntreated
          annotations:
            description: '{{ $value }} deviating control(s) have no entry in tailoring/treatment.yaml. scripts/poam.py refuses to derive a plan of action in this state and fails the pipeline, so this should not be reachable through the normal path.'
            summary: ISMS deviation without a treatment measure.
          expr: isms_deviations_untreated > 0
          for: 15m
          labels:
            severity: critical
        # An attestation past its review date still reports pass, because the
        # verdict *is* the human statement. Nothing in the assessment catches
        # it, which is why it needs an alert rather than a check.
        - alert: ISMSAttestationOverdue
          annotations:
            description: 'Attestation {{ $labels.rule }} is past its review date. It still counts as satisfied in the assessment, because the verdict is the attestation itself -- so an expired one is an assurance nobody has reaffirmed. 48 of 134 profile controls rest on an attestation alone. Re-attest it in checks/registry.yaml or convert it into a machine check.'
            summary: ISMS attestation is overdue for review.
          expr: isms_attestation_review_due_timestamp_seconds - time() < 0
          for: 1h
          labels:
            severity: warning
        - alert: ISMSMeasureDeadlinePassed
          annotations:
            description: 'Treatment measure {{ $labels.measure }} is past its deadline. scripts/poam.py fails the pipeline on a deadline in the past, so either the pipeline has not run since it lapsed or the date needs moving with a reason.'
            summary: ISMS treatment measure is overdue.
          expr: isms_measure_deadline_timestamp_seconds - time() < 0
          for: 1h
          labels:
            severity: warning
        - alert: ISMSAcceptedRiskReviewOverdue
          annotations:
            description: 'Accepted risk {{ $labels.measure }} is past its review date. Acceptance of a risk above the threshold is permitted only as a temporary state -- an unreviewed acceptance is a permanent one nobody decided on.'
            summary: ISMS accepted risk is overdue for review.
          expr: isms_measure_review_due_timestamp_seconds - time() < 0
          for: 1h
          labels:
            severity: warning
        # A standing objective that is currently missed. The two with
        # deadlines in the future are plans and must not page; only the ones
        # that are supposed to hold continuously appear here.
        - alert: ISMSStandingObjectiveMissed
          annotations:
            description: 'Security objective {{ $labels.objective }} ({{ $labels.title }}) is a standing requirement and is currently not met. Unlike the objectives with future deadlines, this one is supposed to hold at all times.'
            summary: ISMS standing objective is not met.
          expr: isms_objective_met{direction=~"halten|hoechstens"} == 0
          for: 1h
          labels:
            severity: warning
