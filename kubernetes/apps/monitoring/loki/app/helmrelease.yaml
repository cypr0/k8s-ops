---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "7.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  maxHistory: 2
  # Das NFS-Volume enthaelt >185.000 Dateien. Die StorageClass zfs-nfs setzt
  # mountPermissions 0755, womit der fsGroup-Abgleich des Kubelets an der
  # Volume-Wurzel nie erfuellt ist (verlangt GID=fsGroup und mindestens 0770).
  # Folge: bei jedem Pod-Start ein vollstaendiger rekursiver chown. Gemessen am
  # 2026-10-27: rund 7.300 Dateien pro Minute, also ~26-28 Minuten pro Start.
  # Ohne erhoehtes Timeout laeuft jeder Upgrade in Timeout -> Rollback ->
  # Pod-Ersatz -> Endlosschleife.
  #
  # 60m ist bewusst grosszuegig: die Dauer waechst mit dem Datenbestand mit.
  # Der Ursachenfix verlangt Gruppenschreibrecht auf der Volume-Wurzel und
  # damit ein neues PV, weil volumeAttributes unveraenderlich sind.
  install:
    timeout: 60m
    remediation:
      retries: 3
  upgrade:
    timeout: 60m
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      limits_config:
        retention_period: 30d
        ingestion_rate_mb: 8
        ingestion_burst_size_mb: 16
      compactor:
        retention_enabled: true
        delete_request_store: filesystem

    singleBinary:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      persistence:
        enabled: true
        storageClass: zfs-nfs
        size: 20Gi
      extraContainers: []

    # Disable microservice components
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0

    # Disable memcached caches — not needed for SingleBinary homelab
    # Default requests are 8Gi which no homelab node can satisfy
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    gateway:
      enabled: false

    monitoring:
      serviceMonitor:
        enabled: true
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
      # ACHTUNG: monitoring.lokiCanary gibt es in Chart 7.0.0 nicht mehr --
      # der Schalter heisst jetzt lokiCanary.enabled auf oberster
      # values-Ebene und steht per Vorgabe auf true. Diese Zeile ist seit
      # dem Chart-Upgrade wirkungslos, das Canary laeuft als DaemonSet auf
      # allen Knoten. Bewusst hier belassen, bis entschieden ist, ob das
      # Canary bleiben soll: dann wird sie entfernt, sonst durch
      # lokiCanary.enabled: false ersetzt.
      lokiCanary:
        enabled: false

    # Oberste Ebene, wie das Chart es ab 7.0.0 erwartet. Solange das Canary
    # laeuft, braucht es ein Limit -- Istverbrauch 23-31Mi je Knoten.
    # Gefunden durch den ISMS-Check container_memory_limits (KONF.9.1).
    lokiCanary:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

    # loki-sc-rules: der Sidecar, der Regel-ConfigMaps in den Pod spiegelt.
    # Istverbrauch 71Mi.
    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 192Mi

    test:
      enabled: false
