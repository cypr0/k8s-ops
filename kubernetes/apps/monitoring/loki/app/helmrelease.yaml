---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 1h
  chart:
    spec:
      chart: loki
      version: "7.0.0"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  maxHistory: 2
  # Rueckfallschutz, kein Dauerzustand. Mit dem statischen PV aus pv.yaml
  # (mountPermissions 2775) gelingt der fsGroup-Abgleich des Kubelets sofort
  # und ein Pod-Start dauert Sekunden.
  #
  # Faellt das Volume je auf mountPermissions 0755 zurueck -- etwa durch eine
  # dynamisch bereitgestellte Ersatzbeanspruchung -- laeuft der Kubelet wieder
  # alle rund 190.000 Dateien ab. Gemessen am 2026-10-27: 37 Minuten pro
  # Start. Mit dem Helm-Standardtimeout von 5m endet das in Timeout ->
  # Rollback -> Pod-Ersatz -> Endlosschleife; am 2026-10-27 entstanden so neun
  # Helm-Revisionen in Folge, und der Rollback entfernte dabei die in #233
  # gesetzten Speicherlimits wieder. Das Timeout bricht diese Schleife.
  install:
    timeout: 60m
    remediation:
      retries: 3
  upgrade:
    timeout: 60m
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    deploymentMode: SingleBinary

    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-01-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      limits_config:
        retention_period: 30d
        ingestion_rate_mb: 8
        ingestion_burst_size_mb: 16
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      # KONF.7.13 -- the only hardening property the three Loki containers
      # lacked. The chart already drops all capabilities and mounts the root
      # filesystem read-only, but sets no seccomp profile anywhere.
      #
      # One place covers all three: the helper loki.podSecurityContext is
      # included by both the single-binary StatefulSet (loki and the
      # loki-sc-rules sidecar) and the loki-canary DaemonSet.
      #
      # Merges with the chart defaults, so fsGroup 10001 and
      # fsGroupChangePolicy: OnRootMismatch survive -- and those must survive.
      # They are what keeps the NFS volume from being walked on every start;
      # the full fsGroup story is in the static PV under
      # kubernetes/apps/monitoring/loki/app/pv.yaml.
      podSecurityContext:
        seccompProfile:
          type: RuntimeDefault

    singleBinary:
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1Gi
      persistence:
        enabled: true
        storageClass: zfs-nfs
        size: 20Gi
        # Das Chart gibt whenDeleted und whenScaled beide auf Delete vor. Damit
        # loescht jedes Herunterskalieren der StatefulSet den Anspruch
        # storage-loki-0 -- und zusammen mit einem PV auf reclaimPolicy Delete
        # waeren die Logdaten weg. Beobachtet am 2026-10-27: ein
        # "scale --replicas=0" entfernte den Anspruch sofort mit.
        #
        # Der Anspruch kommt aus pvc.yaml und soll die StatefulSet ueberleben.
        # false laesst persistentVolumeClaimRetentionPolicy ganz weg, womit die
        # Kubernetes-Vorgabe Retain/Retain gilt.
        enableStatefulSetAutoDeletePVC: false
      extraContainers: []

    # Disable microservice components
    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
    ingester:
      replicas: 0
    querier:
      replicas: 0
    queryFrontend:
      replicas: 0
    queryScheduler:
      replicas: 0
    distributor:
      replicas: 0
    compactor:
      replicas: 0
    indexGateway:
      replicas: 0
    bloomCompactor:
      replicas: 0
    bloomGateway:
      replicas: 0

    # Disable memcached caches — not needed for SingleBinary homelab
    # Default requests are 8Gi which no homelab node can satisfy
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false

    gateway:
      enabled: false

    monitoring:
      serviceMonitor:
        enabled: true
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
      # ACHTUNG: monitoring.lokiCanary gibt es in Chart 7.0.0 nicht mehr --
      # der Schalter heisst jetzt lokiCanary.enabled auf oberster
      # values-Ebene und steht per Vorgabe auf true. Diese Zeile ist seit
      # dem Chart-Upgrade wirkungslos, das Canary laeuft als DaemonSet auf
      # allen Knoten. Bewusst hier belassen, bis entschieden ist, ob das
      # Canary bleiben soll: dann wird sie entfernt, sonst durch
      # lokiCanary.enabled: false ersetzt.
      lokiCanary:
        enabled: false

    # Oberste Ebene, wie das Chart es ab 7.0.0 erwartet. Solange das Canary
    # laeuft, braucht es ein Limit -- Istverbrauch 23-31Mi je Knoten.
    # Gefunden durch den ISMS-Check container_memory_limits (KONF.9.1).
    lokiCanary:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

    # loki-sc-rules: der Sidecar, der Regel-ConfigMaps in den Pod spiegelt.
    # Istverbrauch 71Mi.
    sidecar:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 192Mi

    test:
      enabled: false
