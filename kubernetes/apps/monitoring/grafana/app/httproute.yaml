---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  hostnames: ["grafana.${SECRET_DOMAIN}"]
  parentRefs:
    # Public access via Cloudflare Tunnel
    - name: envoy-external
      namespace: network
      sectionName: https
    # Internal access for OIDC callbacks (grafana reaches id.cisotop.de via envoy-internal)
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: grafana
          namespace: monitoring
          port: 80
