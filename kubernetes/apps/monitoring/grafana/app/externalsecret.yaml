---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: grafana-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GF_SECURITY_ADMIN_USER: "{{ .GRAFANA_ADMIN_USER }}"
        GF_SECURITY_ADMIN_PASSWORD: "{{ .GRAFANA_ADMIN_PASSWORD }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "{{ .GRAFANA_OPENID_CLIENT_ID }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .GRAFANA_OPENID_CLIENT_SECRET }}"
        # Trading bot Postgres datasource (read-only role)
        TRADING_READONLY_PASSWORD: "{{ .TRADING_READONLY_PASSWORD }}"
  dataFrom:
    - extract:
        key: grafana
    - extract:
        key: hermes-agent-trading
