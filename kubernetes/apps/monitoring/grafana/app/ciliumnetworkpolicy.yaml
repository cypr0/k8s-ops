---
# Grafana: visualization — queries Prometheus, Loki, Alertmanager; OIDC via Authentik
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    # External access via Envoy Gateway (grafana.cisotop.de)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Kubelet readiness/liveness probes (host network → host entity)
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    # DNS — L7 dns rule required so Cilium learns the IPs behind the toFQDNs
    # entries below (*.cisotop.de OIDC, grafana.com/.net); otherwise Authentik
    # OIDC login and dashboard downloads are dropped.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Prometheus datasource
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Loki datasource
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: loki
      toPorts:
        - ports:
            - port: "3100"
              protocol: TCP
    # Alertmanager datasource
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: alertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
    # TradingDB datasource (Hermes trading bot Postgres, read-only role)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Authentik OIDC: id.cisotop.de is resolved in-cluster to the envoy-internal
    # ClusterIP by CoreDNS hosts plugin. Grafana connects to ClusterIP:443, which
    # is then DNAT'd to container port 10443. Cilium evaluates egress policy
    # BEFORE DNAT for service traffic, so we need the service port (443) not
    # the container port. Include both for safety.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "10443"
              protocol: TCP
    # Dashboard JSON from grafana.com/.net and any other external HTTPS.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
