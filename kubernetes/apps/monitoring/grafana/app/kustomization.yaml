---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrepository.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml
  - ./ciliumnetworkpolicy.yaml

# One ConfigMap per dashboard folder, referenced by name from the HelmRelease's
# dashboardsConfigMaps. The name must stay stable, hence disableNameSuffixHash:
# with a content hash in the name, every dashboard edit would rename the
# ConfigMap and the HelmRelease's reference would dangle.
#
# The trade-off that comes with it: Grafana does not restart when a dashboard
# changes. Its provisioning sidecar re-reads the directory every 60s
# (updateIntervalSeconds), so edits still land -- just not instantly.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: grafana-dashboards-cluster
    files:
      - dashboards/cluster/k8s-global.json
      - dashboards/cluster/k8s-namespaces.json
      - dashboards/cluster/k8s-pods.json
      - dashboards/cluster/talos.json
  - name: grafana-dashboards-network
    files:
      - dashboards/network/coredns.json
  - name: grafana-dashboards-platform
    files:
      - dashboards/platform/flux.json
  - name: grafana-dashboards-security
    files:
      - dashboards/security/falco.json
  - name: grafana-dashboards-observability
    files:
      - dashboards/observability/alertmanager.json
      - dashboards/observability/gatus.json
  - name: grafana-dashboards-apps
    files:
      - dashboards/apps/open-webui.json
      - dashboards/apps/paperless.json
