---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "10.5.15"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    image:
      repository: grafana/grafana
      tag: 13.2.2
      sha: 2175aaa91c96733d86d31cf270d5310b278654b03f5718c59de12a865380a31f

    replicas: 1

    # ── Autoscaling ────────────────────────────────────────────────────────
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: "70"

    # ── Availability ───────────────────────────────────────────────────────
    podDisruptionBudget:
      minAvailable: 1

    # ── Security ──────────────────────────────────────────────────────────
    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
          # readOnlyRootFilesystem omitted: Grafana writes plugins/temp to disk

    # ── Resources ─────────────────────────────────────────────────────────
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

    # ── Credentials from ExternalSecret ───────────────────────────────────
    admin:
      existingSecret: grafana-secret
      userKey: GF_SECURITY_ADMIN_USER
      passwordKey: GF_SECURITY_ADMIN_PASSWORD

    envFromSecret: grafana-secret

    deploymentStrategy:
      type: RollingUpdate

    annotations:
      secret.reloader.stakater.com/reload: grafana-secret

    # ── Persistence ───────────────────────────────────────────────────────
    persistence:
      enabled: true
      storageClassName: zfs-nfs
      size: 5Gi

    # ── Grafana config ────────────────────────────────────────────────────
    grafana.ini:
      server:
        root_url: "https://grafana.${SECRET_DOMAIN}"
      analytics:
        reporting_enabled: "false"
        check_for_updates: "false"
        check_for_plugin_updates: "false"
      security:
        disable_gravatar: "false"
        cookie_secure: "true"
        cookie_samesite: lax
      users:
        auto_assign_org: "true"
        auto_assign_org_id: "1"
        auto_assign_org_role: Viewer
        default_theme: dark
      # Authentik OIDC SSO
      auth:
        signout_redirect_url: "https://id.${SECRET_DOMAIN}/application/o/grafana/end-session/"
        oauth_auto_login: "false"
        oauth_allow_insecure_email_lookup: "true"
      auth.generic_oauth:
        enabled: "true"
        name: Authentik
        icon: signin
        # client_id + client_secret injected via GF_AUTH_GENERIC_OAUTH_CLIENT_ID/SECRET env vars
        # URLs without application slug per Authentik docs
        scopes: "openid profile email grafana"
        empty_scopes: "false"
        auth_url: "https://id.${SECRET_DOMAIN}/application/o/authorize/"
        token_url: "https://id.${SECRET_DOMAIN}/application/o/token/"
        api_url: "https://id.${SECRET_DOMAIN}/application/o/userinfo/"
        login_attribute_path: preferred_username
        email_attribute_path: email
        groups_attribute_path: groups
        name_attribute_path: name
        use_pkce: "true"
        allow_sign_up: "true"
        role_attribute_path: "contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'"

    # ── Datasources ───────────────────────────────────────────────────────
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
            isDefault: true
            jsonData:
              timeInterval: 30s
              exemplarTraceIdDestinations: []
          - name: Loki
            type: loki
            uid: loki
            url: http://loki.monitoring.svc.cluster.local:3100
            jsonData:
              maxLines: 1000
          - name: Alertmanager
            type: alertmanager
            uid: alertmanager
            url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
            jsonData:
              implementation: prometheus
              handleGrafanaManagedAlerts: false

    # ── Dashboard folders ─────────────────────────────────────────────────
    # Two providers per folder, pointing at the same Grafana folder from two
    # different paths. The chart cannot mix its own gnetId downloads and a
    # user-supplied ConfigMap in one directory -- they would collide -- so
    # community imports and the dashboards kept in this repo each get their own
    # provider. Both land in the same folder in the UI.
    #
    # foldersFromFilesStructure is deliberately off: the folder name is set
    # explicitly here so renaming a directory cannot silently move dashboards.
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: cluster
            orgId: 1
            folder: "Cluster"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/cluster
          - name: cluster-repo
            orgId: 1
            folder: "Cluster"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/cluster-repo
          - name: network
            orgId: 1
            folder: "Netzwerk"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/network
          - name: network-repo
            orgId: 1
            folder: "Netzwerk"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/network-repo
          - name: storage
            orgId: 1
            folder: "Storage & Datenbanken"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/storage
          - name: platform
            orgId: 1
            folder: "Plattform"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/platform
          - name: platform-repo
            orgId: 1
            folder: "Plattform"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/platform-repo
          - name: security
            orgId: 1
            folder: "Sicherheit"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/security
          - name: security-repo
            orgId: 1
            folder: "Sicherheit"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/security-repo
          - name: observability
            orgId: 1
            folder: "Observability"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/observability
          - name: observability-repo
            orgId: 1
            folder: "Observability"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/observability-repo
          - name: apps
            orgId: 1
            folder: "Anwendungen"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/apps
          - name: apps-repo
            orgId: 1
            folder: "Anwendungen"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/apps-repo

    # ── Dashboards kept in this repo ──────────────────────────────────────
    # See kubernetes/apps/monitoring/grafana/app/dashboards/. Four are upstream
    # dashboards adapted to the metrics this cluster actually has (each carries
    # a __patched block recording what was renamed, rewritten or removed); the
    # rest exist because no community dashboard does.
    #
    # The names must NOT follow the chart's own grafana-dashboards-<provider>
    # convention: the chart creates a ConfigMap under exactly that name for
    # every entry in `dashboards:` below. Colliding would leave one object
    # carrying both Helm and Flux ownership labels, with the two controllers
    # overwriting each other's contents on every reconcile.
    dashboardsConfigMaps:
      cluster-repo: grafana-repo-dashboards-cluster
      network-repo: grafana-repo-dashboards-network
      platform-repo: grafana-repo-dashboards-platform
      security-repo: grafana-repo-dashboards-security
      observability-repo: grafana-repo-dashboards-observability
      apps-repo: grafana-repo-dashboards-apps

    # ── Community dashboards (downloaded at pod start by gnetId) ──────────
    # Every revision is pinned. Coverage figures below were measured against
    # this cluster's live metric names, not assumed -- the tooling is described
    # in docs/apps/grafana.md. Anything that scored poorly was either adapted
    # into dashboards/ above or replaced by one built here.
    dashboards:
      cluster:
        k8s-nodes: {gnetId: 15759, revision: 40, datasource: Prometheus} # 98%
        node-exporter: {gnetId: 1860, revision: 45, datasource: Prometheus} # 88%, gaps are hwmon/systemd collectors Talos does not ship
      network:
        cilium: {gnetId: 21431, revision: 6, datasource: Prometheus} # 84%, gaps are kvstore metrics (CRD mode, no etcd)
        cilium-policy: {gnetId: 18015, revision: 4, datasource: Prometheus} # 100% once hubble policy metrics were enabled
        envoy-overview: {gnetId: 24459, revision: 3, datasource: Prometheus} # 100%
        envoy-global: {gnetId: 11022, revision: 1, datasource: Prometheus} # 100%
        cloudflare-tunnel: {gnetId: 17457, revision: 6, datasource: Prometheus} # 100%
      storage:
        cloudnative-pg: {gnetId: 20417, revision: 4, datasource: Prometheus} # 91%
        dragonfly: {gnetId: 21444, revision: 1, datasource: Prometheus} # 87%
        velero: {gnetId: 11055, revision: 2, datasource: Prometheus} # 82%
      platform:
        cert-manager: {gnetId: 20340, revision: 1, datasource: Prometheus} # 100%
        external-secrets: {gnetId: 21640, revision: 4, datasource: Prometheus} # 100%
        spegel: {gnetId: 18089, revision: 1, datasource: Prometheus} # 75%
      security:
        kyverno: {gnetId: 15987, revision: 2, datasource: Prometheus} # 100%
        trivy-operator: {gnetId: 16337, revision: 16, datasource: Prometheus} # 100%
      observability:
        prometheus: {gnetId: 3662, revision: 2, datasource: Prometheus} # 79%, gaps are cloud service-discovery that cannot apply here
        grafana: {gnetId: 3590, revision: 3, datasource: Prometheus} # 96%
      apps:
        nextcloud: {gnetId: 9632, revision: 1, datasource: Prometheus} # 88%

    # ── Monitoring ────────────────────────────────────────────────────────
    serviceMonitor:
      enabled: true
      interval: 1m

    # ── Init container: correct PVC ownership ─────────────────────────────
    initChownData:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
