---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "10.5.15"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    image:
      repository: grafana/grafana
      tag: 13.1.0
      sha: 2175aaa91c96733d86d31cf270d5310b278654b03f5718c59de12a865380a31f

    replicas: 1

    # ── Autoscaling ────────────────────────────────────────────────────────
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: "70"

    # ── Availability ───────────────────────────────────────────────────────
    podDisruptionBudget:
      minAvailable: 1

    # ── Security ──────────────────────────────────────────────────────────
    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
          # readOnlyRootFilesystem omitted: Grafana writes plugins/temp to disk

    # ── Resources ─────────────────────────────────────────────────────────
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

    # ── Credentials from ExternalSecret ───────────────────────────────────
    admin:
      existingSecret: grafana-secret
      userKey: GF_SECURITY_ADMIN_USER
      passwordKey: GF_SECURITY_ADMIN_PASSWORD

    envFromSecret: grafana-secret

    deploymentStrategy:
      type: RollingUpdate

    annotations:
      secret.reloader.stakater.com/reload: grafana-secret

    # ── Persistence ───────────────────────────────────────────────────────
    persistence:
      enabled: true
      storageClassName: zfs-nfs
      size: 5Gi

    # ── Grafana config ────────────────────────────────────────────────────
    grafana.ini:
      server:
        root_url: "https://grafana.${SECRET_DOMAIN}"
      analytics:
        reporting_enabled: "false"
        check_for_updates: "false"
        check_for_plugin_updates: "false"
      security:
        disable_gravatar: "false"
        cookie_secure: "true"
        cookie_samesite: lax
      users:
        auto_assign_org: "true"
        auto_assign_org_id: "1"
        auto_assign_org_role: Viewer
        default_theme: dark
      # Authentik OIDC SSO
      auth:
        signout_redirect_url: "https://id.${SECRET_DOMAIN}/application/o/grafana/end-session/"
        oauth_auto_login: "false"
        oauth_allow_insecure_email_lookup: "true"
      auth.generic_oauth:
        enabled: "true"
        name: Authentik
        icon: signin
        # client_id + client_secret injected via GF_AUTH_GENERIC_OAUTH_CLIENT_ID/SECRET env vars
        # URLs without application slug per Authentik docs
        scopes: "openid profile email grafana"
        empty_scopes: "false"
        auth_url: "https://id.${SECRET_DOMAIN}/application/o/authorize/"
        token_url: "https://id.${SECRET_DOMAIN}/application/o/token/"
        api_url: "https://id.${SECRET_DOMAIN}/application/o/userinfo/"
        login_attribute_path: preferred_username
        email_attribute_path: email
        groups_attribute_path: groups
        name_attribute_path: name
        use_pkce: "true"
        allow_sign_up: "true"
        role_attribute_path: "contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'"

    # ── Datasources ───────────────────────────────────────────────────────
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
            isDefault: true
            jsonData:
              timeInterval: 30s
              exemplarTraceIdDestinations: []
          - name: Loki
            type: loki
            uid: loki
            url: http://loki.monitoring.svc.cluster.local:3100
            jsonData:
              maxLines: 1000
          - name: Alertmanager
            type: alertmanager
            uid: alertmanager
            url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
            jsonData:
              implementation: prometheus
              handleGrafanaManagedAlerts: false
          # Hermes trading bot (paper-trading simulation) -- read-only role,
          # see kubernetes/apps/database/cloudnative-pg/cluster/cluster.yaml
          # for the tradingreadonly role and lib/db.py for the GRANT that
          # makes it possible (CNPG's managed roles can't declare grants).
          - name: TradingDB
            type: postgres
            uid: trading-postgres
            url: postgres-rw.database.svc.cluster.local:5432
            user: tradingreadonly
            # The newer grafana-postgresql-datasource plugin reads the
            # database name from jsonData.database, not the legacy
            # top-level `database:` field -- that field is silently
            # ignored, which surfaced as "You do not currently have a
            # default database configured for this data source" on every
            # panel despite the datasource's own health check passing.
            jsonData:
              database: trading
              sslmode: require
              postgresVersion: 1700
            secureJsonData:
              password: "$TRADING_READONLY_PASSWORD"

    # ── Dashboard providers ───────────────────────────────────────────────
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            orgId: 1
            folder: ""
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/default

    # ── Pre-loaded dashboards (Grafana.com IDs) ───────────────────────────
    dashboards:
      default:
        kubernetes-cluster:
          gnetId: 7249
          revision: 1
          datasource: Prometheus
        kubernetes-nodes:
          gnetId: 1860
          revision: 37
          datasource: Prometheus
        kubernetes-pods:
          gnetId: 6336
          revision: 1
          datasource: Prometheus
        loki-logs:
          gnetId: 13639
          revision: 2
          datasource: Loki
        cnpg:
          gnetId: 20417
          revision: 2
          datasource: Prometheus
        cilium-agent:
          gnetId: 16611
          revision: 1
          datasource: Prometheus
        cilium-hubble:
          gnetId: 16613
          revision: 1
          datasource: Prometheus

        # Custom: Talos OS logs (availability + security) from Loki (job=talos)
        talos-logs:
          datasource: Loki
          json: |
            {
              "annotations": {"list": []},
              "editable": true,
              "graphTooltip": 1,
              "time": {"from": "now-6h", "to": "now"},
              "timezone": "",
              "title": "Talos — Availability & Security",
              "uid": "talos-logs",
              "tags": ["talos", "logs", "security"],
              "schemaVersion": 39,
              "version": 1,
              "refresh": "1m",
              "templating": {"list": []},
              "panels": [
                {
                  "id": 1, "type": "stat", "title": "Errors (5m)",
                  "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
                  "datasource": {"type": "loki", "uid": "loki"},
                  "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "sum(count_over_time({job=\"talos\"} | json | talos_level=\"error\" [5m]))", "queryType": "instant"}],
                  "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "area", "textMode": "auto"}
                },
                {
                  "id": 2, "type": "stat", "title": "Warnings+ (5m)",
                  "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
                  "datasource": {"type": "loki", "uid": "loki"},
                  "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "sum(count_over_time({job=\"talos\"} | json | talos_level=~\"warn|error\" [5m]))", "queryType": "instant"}],
                  "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]}}, "overrides": []},
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "area", "textMode": "auto"}
                },
                {
                  "id": 3, "type": "stat", "title": "Audit Events (5m)",
                  "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
                  "datasource": {"type": "loki", "uid": "loki"},
                  "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "sum(count_over_time({job=\"talos\"} | json | talos_service=\"auditd\" [5m]))", "queryType": "instant"}],
                  "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "blue"}}, "overrides": []},
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "area", "textMode": "auto"}
                },
                {
                  "id": 4, "type": "stat", "title": "SELinux Denials AVC (5m)",
                  "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
                  "datasource": {"type": "loki", "uid": "loki"},
                  "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "sum(count_over_time({job=\"talos\"} | json | audit_type=\"AVC\" [5m]))", "queryType": "instant"}],
                  "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "area", "textMode": "auto"}
                },
                {
                  "id": 5, "type": "timeseries", "title": "Log Volume by Level",
                  "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
                  "datasource": {"type": "loki", "uid": "loki"},
                  "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "sum by (talos_level) (rate({job=\"talos\"} | json [$__interval]))", "queryType": "range", "legendFormat": "{{talos_level}}"}],
                  "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 20, "stacking": {"mode": "normal"}}, "unit": "logs/s"}, "overrides": []},
                  "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
                },
                {
                  "id": 6, "type": "timeseries", "title": "Errors & Warnings by Service",
                  "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
                  "datasource": {"type": "loki", "uid": "loki"},
                  "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "sum by (talos_service) (rate({job=\"talos\"} | json | talos_level=~\"warn|error\" [$__interval]))", "queryType": "range", "legendFormat": "{{talos_service}}"}],
                  "fieldConfig": {"defaults": {"custom": {"drawStyle": "bars", "fillOpacity": 60, "stacking": {"mode": "normal"}}, "unit": "logs/s"}, "overrides": []},
                  "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
                },
                {
                  "id": 7, "type": "timeseries", "title": "Audit Events by Type",
                  "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
                  "datasource": {"type": "loki", "uid": "loki"},
                  "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "sum by (audit_type) (rate({job=\"talos\"} | json | talos_service=\"auditd\" [$__interval]))", "queryType": "range", "legendFormat": "{{audit_type}}"}],
                  "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 20, "stacking": {"mode": "normal"}}, "unit": "logs/s"}, "overrides": []},
                  "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
                },
                {
                  "id": 8, "type": "timeseries", "title": "Events by Node",
                  "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
                  "datasource": {"type": "loki", "uid": "loki"},
                  "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "sum by (node) (rate({job=\"talos\"} | json [$__interval]))", "queryType": "range", "legendFormat": "{{node}}"}],
                  "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 10}, "unit": "logs/s"}, "overrides": []},
                  "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
                },
                {
                  "id": 9, "type": "logs", "title": "Recent Errors & Warnings",
                  "gridPos": {"h": 10, "w": 24, "x": 0, "y": 20},
                  "datasource": {"type": "loki", "uid": "loki"},
                  "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "{job=\"talos\"} | json | talos_level=~\"warn|error\"", "queryType": "range"}],
                  "options": {"showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true}
                }
              ]
            }
        # Custom: cross-app overview (health, restarts, cpu/mem, logs) from kube-state + Loki
        apps-overview:
          datasource: Prometheus
          json: |
            {
              "annotations": {"list": []},
              "editable": true,
              "graphTooltip": 1,
              "time": {"from": "now-6h", "to": "now"},
              "title": "Apps — Overview",
              "uid": "apps-overview",
              "tags": ["apps"],
              "schemaVersion": 39,
              "version": 1,
              "refresh": "1m",
              "templating": {"list": [
                {"name": "namespace", "label": "App", "type": "custom", "query": "nextcloud,paperless,open-webui,openclaw", "multi": true, "includeAll": true, "allValue": "nextcloud|paperless|open-webui|openclaw", "current": {"text": "All", "value": "$__all"}, "options": []}
              ]},
              "panels": [
                {
                  "id": 1, "type": "stat", "title": "Pods Running",
                  "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(kube_pod_status_phase{namespace=~\"$namespace\", phase=\"Running\"})"}],
                  "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "green"}}, "overrides": []},
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "none"}
                },
                {
                  "id": 2, "type": "stat", "title": "Pods Not Running",
                  "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(kube_pod_status_phase{namespace=~\"$namespace\", phase!=\"Running\"}) or vector(0)"}],
                  "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "red", "value": 1}]}}, "overrides": []},
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"}
                },
                {
                  "id": 3, "type": "stat", "title": "Container Restarts (1h)",
                  "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[1h])) or vector(0)"}],
                  "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}, {"color": "red", "value": 5}]}, "decimals": 0}, "overrides": []},
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "area"}
                },
                {
                  "id": 4, "type": "stat", "title": "Error Logs (5m)",
                  "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
                  "datasource": {"type": "loki", "uid": "loki"},
                  "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "sum(count_over_time({namespace=~\"$namespace\"} |~ \"(?i)error\" [5m]))", "queryType": "instant"}],
                  "fieldConfig": {"defaults": {"color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "orange", "value": 1}]}}, "overrides": []},
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "area"}
                },
                {
                  "id": 5, "type": "timeseries", "title": "CPU Usage by App",
                  "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (namespace) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\", container!=\"\"}[$__rate_interval]))", "legendFormat": "{{namespace}}"}],
                  "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 15}, "unit": "short"}, "overrides": []},
                  "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
                },
                {
                  "id": 6, "type": "timeseries", "title": "Memory (working set) by App",
                  "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (namespace) (container_memory_working_set_bytes{namespace=~\"$namespace\", container!=\"\"})", "legendFormat": "{{namespace}}"}],
                  "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 15}, "unit": "bytes"}, "overrides": []},
                  "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
                },
                {
                  "id": 7, "type": "timeseries", "title": "Container Restarts by Pod",
                  "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total{namespace=~\"$namespace\"}[$__rate_interval]))", "legendFormat": "{{namespace}}/{{pod}}"}],
                  "fieldConfig": {"defaults": {"custom": {"drawStyle": "bars", "fillOpacity": 70}, "unit": "short", "decimals": 0}, "overrides": []},
                  "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
                },
                {
                  "id": 8, "type": "timeseries", "title": "Log Rate by App",
                  "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
                  "datasource": {"type": "loki", "uid": "loki"},
                  "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "sum by (namespace) (count_over_time({namespace=~\"$namespace\"} [$__interval]))", "queryType": "range", "legendFormat": "{{namespace}}"}],
                  "fieldConfig": {"defaults": {"custom": {"drawStyle": "line", "fillOpacity": 15}, "unit": "logs"}, "overrides": []},
                  "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
                },
                {
                  "id": 9, "type": "logs", "title": "Recent Errors & Warnings (all apps)",
                  "gridPos": {"h": 10, "w": 24, "x": 0, "y": 20},
                  "datasource": {"type": "loki", "uid": "loki"},
                  "targets": [{"refId": "A", "datasource": {"type": "loki", "uid": "loki"}, "expr": "{namespace=~\"$namespace\"} |~ \"(?i)(error|warn|fail|exception)\"", "queryType": "range"}],
                  "options": {"showTime": true, "wrapLogMessage": true, "sortOrder": "Descending", "enableLogDetails": true, "dedupStrategy": "none"}
                }
              ]
            }
        # Custom: Nextcloud (nextcloud-exporter metrics)
        nextcloud:
          datasource: Prometheus
          json: |
            {
              "annotations": {"list": []},
              "editable": true,
              "graphTooltip": 1,
              "time": {"from": "now-24h", "to": "now"},
              "title": "Nextcloud",
              "uid": "nextcloud",
              "tags": ["apps", "nextcloud"],
              "schemaVersion": 39,
              "version": 1,
              "refresh": "5m",
              "templating": {"list": []},
              "panels": [
                {
                  "id": 1, "type": "stat", "title": "Status",
                  "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "nextcloud_up"}],
                  "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"0": {"text": "DOWN", "color": "red"}, "1": {"text": "UP", "color": "green"}}}], "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "green", "value": 1}]}}, "overrides": []},
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"}
                },
                {
                  "id": 2, "type": "stat", "title": "Users",
                  "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "nextcloud_users_total"}],
                  "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "blue"}, "decimals": 0}, "overrides": []},
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area"}
                },
                {
                  "id": 3, "type": "stat", "title": "Files",
                  "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "nextcloud_files_total"}],
                  "fieldConfig": {"defaults": {"color": {"mode": "fixed", "fixedColor": "purple"}, "decimals": 0}, "overrides": []},
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area"}
                },
                {
                  "id": 4, "type": "stat", "title": "Free Space",
                  "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "targets": [{"refId": "A", "datasource": {"type": "prometheus", "uid": "prometheus"}, "expr": "nextcloud_free_space_bytes"}],
                  "fieldConfig": {"defaults": {"unit": "bytes", "color": {"mode": "thresholds"}, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 10000000000}, {"color": "green", "value": 50000000000}]}}, "overrides": []},
                  "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "area"}
                },
                {
                  "id": 5, "type": "timeseries", "title": "Active Users",
                  "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
                  "datasource": {"type": "prometheus", "uid": "prometheus"},
                  "targets": [
