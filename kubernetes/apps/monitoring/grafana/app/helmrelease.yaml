---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  interval: 1h
  chart:
    spec:
      chart: grafana
      version: "10.5.15"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    image:
      repository: grafana/grafana
      tag: 13.2.2
      sha: 2175aaa91c96733d86d31cf270d5310b278654b03f5718c59de12a865380a31f

    replicas: 1

    # ── Autoscaling ────────────────────────────────────────────────────────
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
      targetCPU: "70"

    # ── Availability ───────────────────────────────────────────────────────
    podDisruptionBudget:
      minAvailable: 1

    # ── Security ──────────────────────────────────────────────────────────
    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault

    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
          # readOnlyRootFilesystem omitted: Grafana writes plugins/temp to disk

    # ── Resources ─────────────────────────────────────────────────────────
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi

    # ── Credentials from ExternalSecret ───────────────────────────────────
    admin:
      existingSecret: grafana-secret
      userKey: GF_SECURITY_ADMIN_USER
      passwordKey: GF_SECURITY_ADMIN_PASSWORD

    envFromSecret: grafana-secret

    deploymentStrategy:
      type: RollingUpdate

    annotations:
      secret.reloader.stakater.com/reload: grafana-secret

    # ── Persistence ───────────────────────────────────────────────────────
    persistence:
      enabled: true
      storageClassName: zfs-nfs
      size: 5Gi

    # ── Grafana config ────────────────────────────────────────────────────
    grafana.ini:
      server:
        root_url: "https://grafana.${SECRET_DOMAIN}"
      analytics:
        reporting_enabled: "false"
        check_for_updates: "false"
        check_for_plugin_updates: "false"
      security:
        disable_gravatar: "false"
        cookie_secure: "true"
        cookie_samesite: lax
      users:
        auto_assign_org: "true"
        auto_assign_org_id: "1"
        auto_assign_org_role: Viewer
        default_theme: dark
      # Authentik OIDC SSO
      auth:
        signout_redirect_url: "https://id.${SECRET_DOMAIN}/application/o/grafana/end-session/"
        oauth_auto_login: "false"
        oauth_allow_insecure_email_lookup: "true"
      auth.generic_oauth:
        enabled: "true"
        name: Authentik
        icon: signin
        # client_id + client_secret injected via GF_AUTH_GENERIC_OAUTH_CLIENT_ID/SECRET env vars
        # URLs without application slug per Authentik docs
        scopes: "openid profile email grafana"
        empty_scopes: "false"
        auth_url: "https://id.${SECRET_DOMAIN}/application/o/authorize/"
        token_url: "https://id.${SECRET_DOMAIN}/application/o/token/"
        api_url: "https://id.${SECRET_DOMAIN}/application/o/userinfo/"
        login_attribute_path: preferred_username
        email_attribute_path: email
        groups_attribute_path: groups
        name_attribute_path: name
        use_pkce: "true"
        allow_sign_up: "true"
        role_attribute_path: "contains(groups[*], 'Grafana Admins') && 'Admin' || contains(groups[*], 'Grafana Editors') && 'Editor' || 'Viewer'"

    # ── Datasources ───────────────────────────────────────────────────────
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
            isDefault: true
            jsonData:
              timeInterval: 30s
              exemplarTraceIdDestinations: []
          - name: Loki
            type: loki
            uid: loki
            url: http://loki.monitoring.svc.cluster.local:3100
            jsonData:
              maxLines: 1000
          - name: Alertmanager
            type: alertmanager
            uid: alertmanager
            url: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
            jsonData:
              implementation: prometheus
              handleGrafanaManagedAlerts: false

    # ── Dashboard folders ─────────────────────────────────────────────────
    # One provider per folder, every dashboard supplied as a file from this
    # repo (kubernetes/apps/monitoring/grafana/dashboards/).
    #
    # The chart's own `dashboards:` gnetId mechanism is deliberately NOT used.
    # It substitutes the datasource with a sed that only matches the legacy
    # string form ("datasource": "Prometheus"); modern exports carry an object
    # ({"type":"prometheus","uid":"${DS_PROMETHEUS}"}) and pass through
    # untouched. Nine of eighteen imported dashboards arrived that way, with up
    # to 226 unresolved placeholders each -- and the failure is invisible, since
    # a panel pointing at a non-existent datasource renders as an empty graph.
    #
    # Vendoring the JSON instead means the datasource is resolved once, at
    # commit time, and verified there. It also removes the runtime dependency
    # on grafana.com at pod start.
    #
    # foldersFromFilesStructure stays off: folder names are set explicitly so
    # renaming a directory cannot silently move dashboards.
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: cluster
            orgId: 1
            folder: "Cluster"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/cluster
          - name: network
            orgId: 1
            folder: "Netzwerk"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/network
          - name: storage
            orgId: 1
            folder: "Storage & Datenbanken"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/storage
          - name: platform
            orgId: 1
            folder: "Plattform"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/platform
          - name: security
            orgId: 1
            folder: "Sicherheit"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/security
          - name: observability
            orgId: 1
            folder: "Observability"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/observability
          - name: apps
            orgId: 1
            folder: "Anwendungen"
            type: file
            disableDeletion: false
            allowUiUpdates: true
            updateIntervalSeconds: 60
            options:
              path: /var/lib/grafana/dashboards/apps

    # Names must not collide with the chart's own grafana-dashboards-<provider>
    # convention -- an object carrying both Helm and Flux ownership ends up
    # being rewritten by each controller in turn. Generated by
    # kubernetes/apps/monitoring/grafana/dashboards/kustomization.yaml.
    dashboardsConfigMaps:
      cluster: grafana-repo-dashboards-cluster
      network: grafana-repo-dashboards-network
      storage: grafana-repo-dashboards-storage
      platform: grafana-repo-dashboards-platform
      security: grafana-repo-dashboards-security
      observability: grafana-repo-dashboards-observability
      apps: grafana-repo-dashboards-apps

    # ── Monitoring ────────────────────────────────────────────────────────
    serviceMonitor:
      enabled: true
      interval: 1m

    # ── Init container: correct PVC ownership ─────────────────────────────
    initChownData:
      enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
