---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus-pushover
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gatus-pushover
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GATUS_PUSHOVER_API_TOKEN: "{{ .GATUS_PUSHOVER_API_TOKEN }}"
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
  dataFrom:
    - extract:
        key: pushover
