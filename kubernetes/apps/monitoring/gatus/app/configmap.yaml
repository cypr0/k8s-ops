---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
data:
  config.yaml: |-
    web:
      port: 8080

    storage:
      type: sqlite
      path: /data/data.db

    metrics: true

    alerting:
      pushover:
        application-token: "$${GATUS_PUSHOVER_API_TOKEN}"
        user-key: "$${PUSHOVER_USER_KEY}"
        title: "Gatus — ${SECRET_DOMAIN}"
        default-alert:
          failure-threshold: 3
          success-threshold: 2
          send-on-resolved: true

    # ── External endpoints (user-facing) ──────────────────────────────────
    endpoints:
      - name: Authentik SSO
        group: Security
        url: "https://id.${SECRET_DOMAIN}"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 3000"
          # The cisotop-de-production Certificate (network ns) is deliberately
          # short-lived (spec.duration: 160h ~= 6.7 days, cert-manager renews
          # ~53h before expiry) -- a >336h (14d) threshold can never pass
          # against a cert that's never valid for more than 160h in the first
          # place. 24h still catches a genuinely stuck renewal with a full
          # day to react, comfortably inside the ~53h renewal buffer.
          - "[CERTIFICATE_EXPIRATION] > 24h"
        alerts:
          - type: pushover

      - name: Echo (Connectivity Test)
        group: Infrastructure
        url: "https://echo.${SECRET_DOMAIN}"
        interval: 5m
        # echo.${SECRET_DOMAIN} publishes AAAA records and this cluster has
        # no IPv6 routing -- fixed at the DNS layer (CoreDNS suppresses the
        # AAAA answer for this one hostname), not here: gatus's
        # client.network setting is ICMP-only and has no effect on HTTP(S)
        # checks, confirmed by testing it live before reverting it.
        conditions:
          - "[STATUS] == 200"
          - "[RESPONSE_TIME] < 2000"
        alerts:
          - type: pushover

      # ── Internal cluster services ──────────────────────────────────────
      - name: Prometheus
        group: Monitoring
        url: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/-/healthy"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover

      - name: Alertmanager
        group: Monitoring
        url: "http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093/-/healthy"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover

      - name: Loki
        group: Monitoring
        url: "http://loki.monitoring.svc.cluster.local:3100/ready"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover

      - name: PostgreSQL (CNPG Primary)
        group: Database
        url: "tcp://postgres-rw.database.svc.cluster.local:5432"
        interval: 30s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: pushover

      - name: DragonflyDB
        group: Database
        url: "tcp://dragonfly.database.svc.cluster.local:6379"
        interval: 30s
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: pushover

      - name: 1Password Connect
        group: Security
        url: "http://onepassword-connect.security.svc.cluster.local/health"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover

      - name: OpenSearch
        group: Logging
        url: "tcp://opensearch.logging.svc.cluster.local:9200"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: pushover

      - name: OpenSearch Dashboards
        group: Logging
        url: "http://opensearch-dashboards.logging.svc.cluster.local:5601/api/status"
        interval: 1m
        conditions:
          - "[STATUS] < 500"
        alerts:
          - type: pushover

      # ── Apps ─────────────────────────────────────────────────────────────
      - name: Grafana
        group: Apps
        url: "http://grafana.monitoring.svc.cluster.local/api/health"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover

      - name: Nextcloud
        group: Apps
        url: "http://nextcloud.nextcloud.svc.cluster.local:8080/status.php"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover

      - name: Collabora
        group: Apps
        url: "http://collabora-app.nextcloud.svc.cluster.local:9980/hosting/discovery"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover

      - name: Open WebUI
        group: Apps
        url: "http://open-webui-app.open-webui.svc.cluster.local:8090/health"
        interval: 1m
        # Endpoint path/behavior not independently confirmed (couldn't reach
        # it directly to verify during setup) -- permissive status range so
        # an auth-required response doesn't false-alarm the way the
        # certificate threshold above once did; tighten once observed live.
        conditions:
          - "[STATUS] == any(200, 302, 401, 403)"
        alerts:
          - type: pushover

      - name: Paperless-ngx
        group: Apps
        url: "http://paperless.paperless.svc.cluster.local/"
        interval: 1m
        conditions:
          - "[STATUS] == any(200, 302, 401, 403)"
        alerts:
          - type: pushover

      # ── Apps (continued) ─────────────────────────────────────────────────
      - name: Immich
        group: Apps
        url: "http://immich-immich-server.immich.svc.cluster.local:2283/api/server/ping"
        interval: 1m
        # Path is Immich's documented ping endpoint but not curl-verified live
        # from inside this session -- same caveat as the existing Open WebUI
        # entry below. Tighten/correct once observed live.
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover

      - name: Mailu (Front)
        group: Apps
        url: "tcp://mailu-front.mail.svc.cluster.local:443"
        interval: 1m
        # Coarse check only: confirms front's nginx accepts TLS connections,
        # not that webmail (webmail.${SECRET_DOMAIN}) or admin
        # (mail.${SECRET_DOMAIN}/admin) actually respond correctly -- both
        # are Host-header/vhost-routed through this same pod, and a plain
        # HTTP GET without the matching Host header wouldn't reliably
        # reflect real app health.
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: pushover

      - name: Elasticsearch (Nextcloud Search)
        group: Apps
        url: "http://elasticsearch.nextcloud.svc.cluster.local:9200/_cluster/health?local=true"
        interval: 1m
        # Same path/port as this app's own liveness/readiness probe
        # (kubernetes/apps/nextcloud/elasticsearch/app/helmrelease.yaml).
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover

      - name: ClamAV (Nextcloud)
        group: Apps
        url: "tcp://clamav.nextcloud.svc.cluster.local:3310"
        interval: 1m
        # No HTTP surface at all -- this app's own probes shell out to
        # `clamdscan --ping 3` rather than a native TCP/HTTP check
        # (docs/apps/clamav.md). A plain TCP connect only proves the port
        # accepts connections, not that clamd is actually scanning
        # correctly.
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: pushover

      - name: Whiteboard (Nextcloud)
        group: Apps
        url: "http://whiteboard.nextcloud.svc.cluster.local:3002/"
        interval: 1m
        # UNCONFIRMED health path -- this app's helmrelease defines no probe
        # block at all, and docs/apps/whiteboard.md explicitly notes it has
        # no existing monitoring to reference. Guessed root path with
        # permissive status; verify against a real response before trusting.
        conditions:
          - "[STATUS] == any(200, 404)"
        alerts:
          - type: pushover

      - name: Tika (Open WebUI)
        group: Apps
        url: "http://tika.open-webui.svc.cluster.local:9998/tika"
        interval: 1m
        # Apache Tika Server's documented GET /tika version endpoint
        # (not independently curl-verified live in this session).
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover

      - name: Tika (Paperless)
        group: Apps
        url: "http://tika.paperless.svc.cluster.local:9998/tika"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover

      - name: Gotenberg (Paperless)
        group: Apps
        url: "http://gotenberg.paperless.svc.cluster.local:3000/health"
        interval: 1m
        # docs/apps/gotenberg.md documents a working
        # `curl -sf http://gotenberg.paperless.svc.cluster.local:3000/health`
        # check already run against this exact endpoint.
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover

      - name: Open Terminal (Open WebUI)
        group: Apps
        url: "tcp://open-terminal.open-webui.svc.cluster.local:8000"
        interval: 1m
        # Matches this app's own liveness/readiness probes, which are
        # tcpSocket-only on this port (no HTTP surface by design).
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: pushover

      # ── Hermes Agent ─────────────────────────────────────────────────────
      - name: Hermes Agent (Webhook)
        group: Hermes Agent
        url: "tcp://hermes-agent.hermes-agent.svc.cluster.local:8644"
        interval: 1m
        # No general-purpose HTTP health path -- the Service only exposes a
        # specific webhook route (paperless-ngx's "document added" callback),
        # not a plain health endpoint. TCP connect is the safest check here.
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: pushover

      - name: Firecrawl (Scrape API)
        group: Hermes Agent
        url: "http://firecrawl-api.hermes-agent.svc.cluster.local:3002/v0/health/readiness"
        interval: 1m
        # Same path this app's own readiness probe uses.
        conditions:
          - "[STATUS] == 200"
        alerts:
          - type: pushover

      - name: Nextcloud MCP
        group: Hermes Agent
        url: "tcp://nextcloud-mcp.hermes-agent.svc.cluster.local:8000"
        interval: 1m
        # Streamable-HTTP MCP server at /mcp only, not a plain-GET-able
        # health route. Matches this app's own tcpSocket probes.
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: pushover

      - name: Paperless MCP
        group: Hermes Agent
        url: "tcp://paperless-mcp.hermes-agent.svc.cluster.local:8000"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: pushover

      - name: Mailu MCP
        group: Hermes Agent
        url: "tcp://mailu-mcp.hermes-agent.svc.cluster.local:8000"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
        alerts:
          - type: pushover
