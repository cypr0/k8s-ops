---
# Gatus: health checker — reaches internal services across namespaces + external endpoints
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gatus
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gatus
  ingress:
    # External access via Envoy Gateway (status.cisotop.de)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Prometheus metrics scraping
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # DNS — L7 dns rule required so Cilium learns the IPs behind the toFQDNs
    # entries below (*.cisotop.de, api.pushover.net); otherwise external health
    # checks via toFQDNs are dropped.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Monitoring namespace health checks (prometheus, alertmanager, loki)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "9093"
              protocol: TCP
            - port: "3100"
              protocol: TCP
    # Logging namespace health checks (opensearch, dashboards)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": logging
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
            - port: "5601"
              protocol: TCP
    # Database health checks (postgres, dragonfly)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "6379"
              protocol: TCP
    # Security namespace health checks (onepassword-connect)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": security
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # External endpoints (HTTPS: id.cisotop.de, echo.cisotop.de, Pushover).
    # The "*.cisotop.de.*" pattern also covers names resolved with the appended
    # search domain (default ndots:5 + Cloudflare wildcard DNS).
    - toFQDNs:
        - matchPattern: "*.cisotop.de"
        - matchPattern: "*.cisotop.de.*"
        - matchName: "api.pushover.net"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
