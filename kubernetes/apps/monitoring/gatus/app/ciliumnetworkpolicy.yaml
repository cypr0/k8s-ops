---
# Gatus: health checker — reaches internal services across namespaces + external endpoints
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gatus
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gatus
  ingress:
    # External access via Envoy Gateway (status.cisotop.de)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Prometheus metrics scraping
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Kubelet readiness/liveness probes (host network → host entity)
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # DNS — L7 dns rule required so Cilium learns the IPs behind the toFQDNs
    # entries below (*.cisotop.de, api.pushover.net); otherwise external health
    # checks via toFQDNs are dropped.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Monitoring namespace health checks (prometheus, alertmanager, loki, grafana)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
            - port: "9093"
              protocol: TCP
            - port: "3100"
              protocol: TCP
            - port: "3000"
              protocol: TCP
    # Logging namespace health checks (opensearch, dashboards)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": logging
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
            - port: "5601"
              protocol: TCP
    # Database health checks (postgres, dragonfly)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "6379"
              protocol: TCP
    # Nextcloud namespace health checks (nextcloud, collabora)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": nextcloud
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "9980"
              protocol: TCP
    # Open WebUI namespace health check
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": open-webui
      toPorts:
        - ports:
            - port: "8090"
              protocol: TCP
    # Paperless namespace health check (paperless-ngx)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": paperless
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Security namespace health checks (onepassword-connect)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": security
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # id.cisotop.de is resolved in-cluster to the envoy-internal gateway by the
    # CoreDNS rewrite, so Gatus health checks against it go to the Envoy proxy
    # (post-DNAT container port 10443) rather than out to the internet.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    # Other external HTTPS endpoints (echo.cisotop.de, Pushover, etc.).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
