---
# OpenSearch credentials for Alloy log shipping
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alloy-opensearch-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alloy-opensearch-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENSEARCH_USER: "admin"
        OPENSEARCH_PASSWORD: "{{ .OPENSEARCH_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: opensearch
