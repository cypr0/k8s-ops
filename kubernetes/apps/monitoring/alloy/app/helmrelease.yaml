---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
spec:
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: "1.8.2"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    alloy:
      # Needed for the OTLP receiver below; the chart only opens its own
      # listenPort (12345) otherwise.
      extraPorts:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
      configMap:
        create: true
        content: |
          // ── OUTPUTS ──────────────────────────────────────────────────────

          loki.write "loki" {
            endpoint {
              url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
            }
          }

          prometheus.remote_write "default" {
            endpoint {
              url = "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090/api/v1/write"
            }
          }

          // ── OTLP INTAKE (Open WebUI) ─────────────────────────────────────
          // Open WebUI cannot be scraped: it only PUSHES via OTLP and exposes no
          // /metrics endpoint of its own. This receiver is the bridge.
          //
          // Scope is deliberately narrow. Open WebUI emits exactly two metrics --
          // http.server.requests and http.server.duration, both plain FastAPI
          // instrumentation -- so this adds request rate and latency broken down
          // by internal route. Everything at the HTTP edge is already covered by
          // envoy_cluster_* for httproute/open-webui/open-webui, which needs no
          // agent at all; the gain here is seeing /api/chat/completions apart
          // from the rest rather than one number for the whole app.
          //
          // Traces and logs are NOT enabled on the sender: there is no Tempo in
          // this cluster, and pod logs already reach Loki through the pipeline
          // below.
          otelcol.receiver.otlp "default" {
            grpc {
              endpoint = "0.0.0.0:4317"
            }
            output {
              metrics = [otelcol.exporter.prometheus.default.input]
            }
          }

          otelcol.exporter.prometheus "default" {
            forward_to = [prometheus.remote_write.default.receiver]
          }

          // ── KUBERNETES POD LOGS ──────────────────────────────────────────

          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
              separator     = "/"
              target_label  = "job"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_annotation_log_io_skip"]
              regex         = "true"
              action        = "drop"
            }
          }

          loki.source.kubernetes "pod_logs" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.process.pod_logs.receiver]
          }

          loki.process "pod_logs" {
            stage.json {
              expressions = { level = "level", msg = "msg" }
            }
            stage.labels {
              values = { level = "" }
            }
            forward_to = [loki.write.loki.receiver]
          }

          // ── KUBERNETES EVENTS ────────────────────────────────────────────

          loki.source.kubernetes_events "cluster_events" {
            job_name   = "integrations/kubernetes/eventhandler"
            forward_to = [loki.write.loki.receiver]
          }

    controller:
      type: daemonset
      tolerations: []
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist

    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 384Mi

    serviceMonitor:
      enabled: true
