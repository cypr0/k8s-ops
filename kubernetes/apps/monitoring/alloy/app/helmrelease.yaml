---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
spec:
  interval: 1h
  chart:
    spec:
      chart: alloy
      version: "1.8.2"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: monitoring
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    alloy:
      configMap:
        create: true
        content: |
          // ── OUTPUTS ──────────────────────────────────────────────────────

          loki.write "loki" {
            endpoint {
              url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
            }
          }

          otelcol.auth.basic "opensearch" {
            username = sys.env("OPENSEARCH_USER")
            password = sys.env("OPENSEARCH_PASSWORD")
          }

          otelcol.processor.batch "opensearch" {
            send_batch_size     = 1000
            send_batch_max_size = 2000
            timeout             = "5s"
            output {
              logs = [otelcol.exporter.otlphttp.opensearch.input]
            }
          }

          // otelcol.exporter.elasticsearch does not exist in Alloy 1.8.x
          // Using otlphttp — OpenSearch 2.x accepts OTLP at /_plugins/observability
          otelcol.exporter.otlphttp "opensearch" {
            client {
              endpoint = "https://opensearch.logging.svc.cluster.local:9200"
              auth     = otelcol.auth.basic.opensearch.handler
              tls {
                insecure_skip_verify = true
              }
            }
            retry_on_failure {
              enabled          = true
              initial_interval = "1s"
              max_interval     = "30s"
              max_elapsed_time = "300s"
            }
            sending_queue {
              enabled       = true
              num_consumers = 4
              queue_size    = 2000
            }
          }

          otelcol.receiver.loki "to_opensearch" {
            output {
              logs = [otelcol.processor.batch.opensearch.input]
            }
          }

          // ── KUBERNETES POD LOGS ──────────────────────────────────────────

          discovery.kubernetes "pods" {
            role = "pod"
          }

          discovery.relabel "pod_logs" {
            targets = discovery.kubernetes.pods.targets
            rule {
              source_labels = ["__meta_kubernetes_namespace"]
              target_label  = "namespace"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_name"]
              target_label  = "pod"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_container_name"]
              target_label  = "container"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "app"
            }
            rule {
              source_labels = ["__meta_kubernetes_namespace", "__meta_kubernetes_pod_name"]
              separator     = "/"
              target_label  = "job"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_annotation_log_io_skip"]
              regex         = "true"
              action        = "drop"
            }
          }

          loki.source.kubernetes "pod_logs" {
            targets    = discovery.relabel.pod_logs.output
            forward_to = [loki.process.pod_logs.receiver]
          }

          loki.process "pod_logs" {
            stage.json {
              expressions = { level = "level", msg = "msg" }
            }
            stage.labels {
              values = { level = "" }
            }
            forward_to = [loki.write.loki.receiver, otelcol.receiver.loki.to_opensearch.receiver]
          }

          // ── KUBERNETES EVENTS ────────────────────────────────────────────

          loki.source.kubernetes_events "cluster_events" {
            job_name   = "integrations/kubernetes/eventhandler"
            forward_to = [loki.write.loki.receiver, otelcol.receiver.loki.to_opensearch.receiver]
          }

          // ── EXTERNAL SYSLOG: Proxmox + OPNsense ─────────────────────────

          loki.source.syslog "external" {
            listener {
              address                = "0.0.0.0:5514"
              protocol               = "udp"
              labels                 = { job = "syslog" }
              use_incoming_timestamp = true
            }
            listener {
              address                = "0.0.0.0:5514"
              protocol               = "tcp"
              labels                 = { job = "syslog" }
              use_incoming_timestamp = true
            }
            forward_to = [loki.process.external_syslog.receiver]
          }

          loki.process "external_syslog" {
            stage.match {
              selector = `{job="syslog", hostname=~"pve.*|proxmox.*"}`
              stage.static_labels {
                values = { source = "proxmox" }
              }
            }
            stage.match {
              selector = `{job="syslog", hostname=~"(?i)opnsense.*|fw.*"}`
              stage.static_labels {
                values = { source = "opnsense" }
              }
            }
            forward_to = [loki.write.loki.receiver, otelcol.receiver.loki.to_opensearch.receiver]
          }

    envFrom:
      - secretRef:
          name: alloy-opensearch-credentials

    controller:
      type: daemonset
      tolerations: []
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist

    extraPorts:
      - name: syslog-udp
        port: 5514
        targetPort: 5514
        protocol: UDP
      - name: syslog-tcp
        port: 5514
        targetPort: 5514
        protocol: TCP

    resources:
      requests:
        cpu: 50m
        memory: 192Mi
      limits:
        memory: 384Mi

    serviceMonitor:
      enabled: true
