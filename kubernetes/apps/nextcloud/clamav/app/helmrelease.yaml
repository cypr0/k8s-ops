---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clamav
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      clamav:
        replicas: 1
        strategy: Recreate
        containers:
          app:
            image:
              repository: clamav/clamav
              tag: 1.5.2-35
            env:
              - name: CLAMD_CONF_MaxFileSize
                value: "104857600"
              - name: CLAMD_CONF_MaxScanSize
                value: "104857600"
            resources:
              requests:
                cpu: 100m
                memory: 1Gi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/usr/bin/clamdscan", "--ping", "3"]
                  initialDelaySeconds: 120
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/usr/bin/clamdscan", "--ping", "3"]
                  initialDelaySeconds: 120
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/usr/bin/clamdscan", "--ping", "3"]
                  initialDelaySeconds: 60
                  periodSeconds: 15
                  timeoutSeconds: 10
                  failureThreshold: 30
    service:
      app:
        controller: clamav
        ports:
          clamd:
            port: 3310
    persistence:
      data:
        enabled: true
        storageClass: zfs-nfs
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /var/lib/clamav
