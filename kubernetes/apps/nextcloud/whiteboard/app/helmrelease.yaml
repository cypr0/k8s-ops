---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: whiteboard
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      whiteboard:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/nextcloud-releases/whiteboard
              tag: v1.5.9
            env:
              - name: NEXTCLOUD_URL
                value: "https://cloud.${SECRET_DOMAIN}"
              - name: JWT_SECRET_KEY
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-whiteboard-credentials
                    key: WHITEBOARD_JWT_SECRET_KEY
              - name: STORAGE_STRATEGY
                value: "redis"
              - name: REDIS_URL
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-whiteboard-credentials
                    key: REDIS_URL
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              runAsUser: 65534
              runAsGroup: 65534
    service:
      app:
        controller: whiteboard
        ports:
          http:
            port: 3002
