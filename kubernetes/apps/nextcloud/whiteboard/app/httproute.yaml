---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: whiteboard
  namespace: nextcloud
  labels:
    app.kubernetes.io/name: whiteboard
spec:
  hostnames:
    - cloud.${SECRET_DOMAIN}
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    # Redirect the bare /whiteboard to /whiteboard/
    - matches:
        - path:
            type: Exact
            value: /whiteboard
      filters:
        - type: RequestRedirect
          requestRedirect:
            statusCode: 301
            path:
              type: ReplaceFullPath
              replaceFullPath: /whiteboard/
    # Strip the /whiteboard prefix before proxying to the whiteboard backend
    - matches:
        - path:
            type: PathPrefix
            value: /whiteboard
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - group: ""
          kind: Service
          name: whiteboard
          namespace: nextcloud
          port: 3002
          weight: 1
