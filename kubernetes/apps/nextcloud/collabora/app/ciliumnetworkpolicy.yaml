---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: collabora
  namespace: nextcloud
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: collabora
  ingress:
    # Envoy proxy (network ns): collabora :9980 (collabora.${SECRET_DOMAIN})
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "9980"
              protocol: TCP
    # Same namespace (nextcloud WOPI requests, languagetool sidecar hairpin)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": nextcloud
    # Gatus health check (GET /hosting/discovery)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: gatus
      toPorts:
        - ports:
            - port: "9980"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Same namespace (languagetool sidecar via ClusterIP)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": nextcloud
    # WOPI CheckFileInfo callbacks to Nextcloud now stay in-cluster: coredns
    # resolves cloud.${SECRET_DOMAIN} to the envoy-internal Gateway ClusterIP
    # (same split-horizon setup as Authentik), landing on the envoy pods'
    # DNAT'd HTTPS port -- see the nextcloud CiliumNetworkPolicy's identical
    # id.${SECRET_DOMAIN} egress rule.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    # Legacy fallback path (unused while the split-horizon DNS override above
    # is in place, kept in case that ever needs to be rolled back).
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
