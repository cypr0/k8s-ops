---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: collabora
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      collabora:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: collabora/code
              tag: 26.04.2.1.1
            env:
              - name: username
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-collabora-credentials
                    key: COLLABORA_USERNAME
              - name: password
                valueFrom:
                  secretKeyRef:
                    name: nextcloud-collabora-credentials
                    key: COLLABORA_PASSWORD
              - name: extra_params
                value: "--o:ssl.termination=true --o:ssl.enable=false --o:welcome.enable=false --o:languagetool.enabled=true --o:languagetool.base_url=http://collabora-languagetool.nextcloud.svc.cluster.local:8010/v2 --o:net.proxy_allowed_hosts=192.168.0.0/16,10.0.0.0/8,cloud.${SECRET_DOMAIN} --o:admin_console.enable=false"
              - name: dictionaries
                value: "de_DE en_GB en_US es_ES fr_FR"
              - name: server_name
                value: "collabora.${SECRET_DOMAIN}"
              - name: domain
                value: "cloud.${SECRET_DOMAIN}"
              - name: DONT_GEN_SSL_CERT
                value: "true"
            resources:
              requests:
                cpu: 500m
                memory: 512Mi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9980
                  initialDelaySeconds: 60
                  periodSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 9980
                  initialDelaySeconds: 30
                  periodSeconds: 5
                  failureThreshold: 3
            securityContext:
              runAsUser: 1001
              runAsGroup: 1001
          languagetool:
            image:
              repository: collabora/languagetool
              tag: "6.6"
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 1Gi
    service:
      app:
        controller: collabora
        sessionAffinity: ClientIP
        sessionAffinityConfig:
          clientIP:
            timeoutSeconds: 7200
        ports:
          http:
            port: 9980
      languagetool:
        controller: collabora
        ports:
          http:
            port: 8010
