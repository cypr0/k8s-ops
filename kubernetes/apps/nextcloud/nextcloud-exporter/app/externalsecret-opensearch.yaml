---
# OpenSearch write credentials for the nextcloud-stats-exporter CronJob.
# Secrets are namespace-scoped, so this pulls the SAME 1Password item as
# logging/opensearch-sa-credentials rather than referencing it cross-namespace.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opensearch-write-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: opensearch-write-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPENSEARCH_PASSWORD: "{{ .OPENSEARCH_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: opensearch
