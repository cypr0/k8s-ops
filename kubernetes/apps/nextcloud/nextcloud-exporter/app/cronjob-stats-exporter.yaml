---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nextcloud-stats-exporter
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: nextcloud-stats-exporter
        spec:
          restartPolicy: OnFailure
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
          containers:
            - name: exporter
              image: python:3.14-alpine
              command:
                - "python3"
                - "/scripts/export_stats.py"
              env:
                - name: OPENSEARCH_HOST
                  value: "https://opensearch.logging.svc.cluster.local:9200"
                - name: OPENSEARCH_USER
                  value: "admin"
                - name: OPENSEARCH_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: opensearch-write-credentials
                      key: OPENSEARCH_PASSWORD
                - name: NEXTCLOUD_HOST
                  value: "http://nextcloud.nextcloud.svc.cluster.local:8080"
                - name: NEXTCLOUD_USER
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-credentials
                      key: ADMIN_USER
                - name: NEXTCLOUD_PASS
                  valueFrom:
                    secretKeyRef:
                      name: nextcloud-credentials
                      key: ADMIN_PASS
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 65534
                capabilities:
                  drop:
                    - "ALL"
          volumes:
            - name: scripts
              configMap:
                name: nextcloud-stats-exporter-script
                defaultMode: 0755
