---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: elasticsearch
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      elasticsearch:
        replicas: 1
        strategy: Recreate
        initContainers:
          fix-perms:
            image:
              repository: busybox
              tag: "1.38.0"
            command:
              - sh
              - -c
              - "chown -R 1000:1000 /usr/share/elasticsearch/data && echo perms-fixed"
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
        containers:
          app:
            image:
              repository: docker.elastic.co/elasticsearch/elasticsearch
              tag: 9.5.0
            env:
              discovery.type: single-node
              xpack.security.enabled: "false"
              xpack.security.http.ssl.enabled: "false"
              # mmap disabled so no vm.max_map_count sysctl is required (Talos)
              node.store.allow_mmap: "false"
              bootstrap.memory_lock: "false"
              ES_JAVA_OPTS: "-Xms1g -Xmx1g"
              ingest.geoip.downloader.enabled: "false"
            resources:
              requests:
                cpu: 200m
                memory: 2Gi
              limits:
                memory: 2Gi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /_cluster/health?local=true
                    port: 9200
                  initialDelaySeconds: 60
                  periodSeconds: 15
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /_cluster/health?local=true
                    port: 9200
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 6
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
    service:
      app:
        controller: elasticsearch
        ports:
          http:
            port: 9200
    persistence:
      data:
        enabled: true
        storageClass: zfs-nfs
        accessMode: ReadWriteOnce
        size: 30Gi
        globalMounts:
          - path: /usr/share/elasticsearch/data
