---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: nextcloud-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        NEXTCLOUD_ADMIN_USER: "{{ .NEXTCLOUD_ADMIN_USERNAME }}"
        NEXTCLOUD_ADMIN_PASSWORD: "{{ .NEXTCLOUD_ADMIN_PASSWORD }}"
        SMTP_NAME: "{{ .NEXTCLOUD_SMTP_USERNAME }}"
        SMTP_PASSWORD: "{{ .NEXTCLOUD_SMTP_PASSWORD }}"
        SMTP_HOST: "{{ .NEXTCLOUD_SMTP_HOST }}"
        # Shared postgres cluster (k8s-ops convention) instead of a dedicated cluster
        POSTGRES_HOST: "postgres-rw.database.svc.cluster.local"
        POSTGRES_DB: "{{ .NEXTCLOUD_POSTGRESQL_DB_NAME }}"
        POSTGRES_USER: "{{ .NEXTCLOUD_POSTGRESQL_USERNAME }}"
        POSTGRES_PASSWORD: "{{ .NEXTCLOUD_POSTGRESQL_PASSWORD }}"
        COLLABORA_USERNAME: "{{ .COLLABORA_USERNAME }}"
        COLLABORA_PASSWORD: "{{ .COLLABORA_PASSWORD }}"
        WHITEBOARD_JWT_SECRET_KEY: "{{ .WHITEBOARD_JWT_SECRET_KEY }}"
        WHITEBOARD_REDIS_URL: "redis://:{{ .DRAGONFLY_PASSWORD }}@dragonfly.database.svc.cluster.local:6379/9"
        REDIS_PASSWORD: "{{ .DRAGONFLY_PASSWORD }}"
        # OIDC (Authentik) — consumed by the post-install user_oidc job
        NEXTCLOUD_OPENID_CLIENT_ID: "{{ .NEXTCLOUD_OPENID_CLIENT_ID }}"
        NEXTCLOUD_OPENID_CLIENT_SECRET: "{{ .NEXTCLOUD_OPENID_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: nextcloud
    - extract:
        key: collabora
    - extract:
        key: dragonfly
