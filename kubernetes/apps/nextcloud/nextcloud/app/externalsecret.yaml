---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-env
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: nextcloud-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        ADMIN_USER: "{{ .NEXTCLOUD_ADMIN_USERNAME }}"
        ADMIN_PASS: "{{ .NEXTCLOUD_ADMIN_PASSWORD }}"
        # Migrated off the old external mail server's SMTP_* fields (on this
        # same "nextcloud" 1Password item) onto the in-cluster Mailu
        # instance's shared "noreply" mailbox -- also used by Authentik and
        # Immich. Host is not secret, so it's a literal here rather than a
        # 1Password field.
        SMTP_HOST: "mail.${SECRET_DOMAIN}"
        SMTP_USERNAME: "{{ .MAILU_NOREPLY_USERNAME }}"
        SMTP_PASSWORD: "{{ .MAILU_NOREPLY_PASSWORD }}"
        DRAGONFLY_PASSWORD: "{{ .DRAGONFLY_PASSWORD }}"
        OIDC_CLIENT_ID: "{{ .NEXTCLOUD_OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .NEXTCLOUD_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: nextcloud
    - extract:
        key: dragonfly
    - extract:
        key: mailu
---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud-postgres
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: nextcloud-postgres-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        POSTGRES_DB: "{{ .NEXTCLOUD_POSTGRESQL_DB_NAME }}"
        POSTGRES_HOST: "postgres-rw.database.svc.cluster.local"
        POSTGRES_USER: "{{ .NEXTCLOUD_POSTGRESQL_USERNAME }}"
        POSTGRES_PASSWORD: "{{ .NEXTCLOUD_POSTGRESQL_PASSWORD }}"
  dataFrom:
    - extract:
        key: nextcloud
