---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  interval: 1h
  chart:
    spec:
      chart: nextcloud
      version: "9.2.5"
      sourceRef:
        kind: HelmRepository
        name: nextcloud
  install:
    timeout: 30m
    remediation:
      retries: 3
  upgrade:
    timeout: 30m
    cleanupOnFail: true
    remediation:
      retries: 3
      remediateLastFailure: true
  values:
    replicaCount: 1
    image:
      registry: docker.io
      repository: library/nextcloud
      flavor: fpm-alpine
      tag: 34.0.3-fpm-alpine
    phpClientHttpsFix:
      enabled: true
    nextcloud:
      host: cloud.${SECRET_DOMAIN}
      securityContext:
        runAsUser: 82
        runAsGroup: 82
        runAsNonRoot: true
        readOnlyRootFilesystem: false
      extraInitContainers:
        - name: validate-subpaths
          image: busybox:1.38.0
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          command:
            - sh
            - -c
            - |
              set -eu
              for dir in /var/www /var/www/html /var/www/html/config /var/www/html/custom_apps /var/www/html/data; do
                [ -d "$dir" ] || { echo "ERROR: SubPath mount missing: $dir"; exit 1; }
                chown 82:82 "$dir" 2>/dev/null || echo "WARN chown $dir"
                chmod 755 "$dir" 2>/dev/null || echo "WARN chmod $dir"
              done
              echo "SubPath mounts validated"
          volumeMounts:
            - name: nextcloud-main
              mountPath: /var/www
              subPath: root
            - name: nextcloud-main
              mountPath: /var/www/html
              subPath: html
            - name: nextcloud-main
              mountPath: /var/www/html/config
              subPath: config
            - name: nextcloud-main
              mountPath: /var/www/html/custom_apps
              subPath: custom_apps
            - name: nextcloud-data
              mountPath: /var/www/html/data
              subPath: data
        - name: fix-data-permissions
          image: busybox:1.38.0
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          command:
            - sh
            - -c
            - |
              chown 82:82 /var/www/html/data
              chmod 750 /var/www/html/data
              echo "data dir permissions fixed"
          volumeMounts:
            - name: nextcloud-data
              mountPath: /var/www/html/data
              subPath: data
      extraEnv:
        - name: NEXTCLOUD_REDIS_HOST
          value: dragonfly.database.svc.cluster.local
        - name: NEXTCLOUD_REDIS_DATABASE
          value: "1"
        - name: NEXTCLOUD_REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: &secret nextcloud-credentials
              key: DRAGONFLY_PASSWORD
        - name: OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: *secret
              key: OIDC_CLIENT_ID
        - name: OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: *secret
              key: OIDC_CLIENT_SECRET
        - name: WHITEBOARD_JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: nextcloud-whiteboard-credentials
              key: WHITEBOARD_JWT_SECRET_KEY
        - name: PHP_INI_SCAN_DIR
          value: "/usr/local/etc/php/conf.d:/var/www/html/config/php-extra"
      existingSecret:
        enabled: true
        secretName: *secret
        usernameKey: ADMIN_USER
        passwordKey: ADMIN_PASS
        smtpHostKey: SMTP_HOST
        smtpUsernameKey: SMTP_USERNAME
        smtpPasswordKey: SMTP_PASSWORD
      mail:
        enabled: true
        fromAddress: "noreply"
        domain: "${SECRET_DOMAIN}"
        smtp:
          port: 25
          secure: ''
      defaultConfigs:
        apache-pretty-urls.config.php: false
        apcu.config.php: false
        apps.config.php: false
        redis.config.php: false
        reverse-proxy.config.php: false
        s3.config.php: false
        smtp.config.php: false
        swift.config.php: false
        upgrade-disable-web.config.php: false
      hooks:
        before-starting: |-
          #!/bin/sh
          set -eu
          # Shared PHP session storage via Redis (survives across replicas / OIDC state).
          # $$ escapes keep these as runtime env refs (Flux must not substitute them).
          mkdir -p /var/www/html/config/php-extra
          cat > /var/www/html/config/php-extra/z-session-redis.ini << EOF
          session.save_handler = redis
          session.save_path = "tcp://$${NEXTCLOUD_REDIS_HOST}:6379?auth=$${NEXTCLOUD_REDIS_PASSWORD}&database=3"
          EOF
          for f in apache-pretty-urls.config.php apcu.config.php apps.config.php \
                   redis.config.php reverse-proxy.config.php s3.config.php \
                   smtp.config.php swift.config.php upgrade-disable-web.config.php; do
            rm -f "/var/www/html/config/$$f"
          done
          echo "before-starting: redis sessions configured, default configs cleaned"
        after-upgrade: |-
          #!/bin/sh
          set -eu
          php /var/www/html/occ upgrade --no-interaction
          php /var/www/html/occ db:add-missing-indices --no-interaction
          php /var/www/html/occ db:add-missing-columns --no-interaction
          php /var/www/html/occ db:add-missing-primary-keys --no-interaction
          php /var/www/html/occ db:convert-filecache-bigint --no-interaction
          php /var/www/html/occ maintenance:repair --include-expensive --no-interaction
      configs:
        local.config.php: |-
          <?php
          $$CONFIG = array(
                'backgroundjobs_mode' => 'cron',
                'activity_expire_days' => 14,
                'allow_local_remote_servers' => true,
                'auth.bruteforce.protection.enabled' => true,
                'overwriteprotocol' => 'https',
                'overwritehost' => 'cloud.${SECRET_DOMAIN}',
                'overwrite.cli.url' => 'https://cloud.${SECRET_DOMAIN}',
                'trusted_domains' => array(
                    0 => 'localhost',
                    1 => 'cloud.${SECRET_DOMAIN}',
                    2 => 'id.${SECRET_DOMAIN}'
                ),
                'trusted_proxies' => array(
                    0 => '127.0.0.1',
                    1 => '10.0.0.0/8'
                ),
                'forwarded_for_headers' => array(
                  0 => 'HTTP_X_FORWARDED_FOR',
                ),
                'forbidden_filenames' =>
                  array (
                    0 => '.htaccess',
                    1 => 'Thumbs.db',
                    2 => 'thumbs.db',
                    ),
                'appstoreenabled' => true,
                'knowledgebaseenabled' => false,
                'quota_include_external_storage' => false,
                'share_folder' => '/Freigaben',
                'skeletondirectory' => '',
                'trashbin_retention_obligation' => 'auto, 7',
                'memcache.local' => '\OC\Memcache\APCu',
                'memcache.distributed' => '\OC\Memcache\Redis',
                'memcache.locking' => '\OC\Memcache\Redis',
                'redis' => array(
                  'host' => getenv('NEXTCLOUD_REDIS_HOST'),
                  'port' => getenv('NEXTCLOUD_REDIS_PORT') ?: 6379,
                  'password' => getenv('NEXTCLOUD_REDIS_PASSWORD'),
                  'dbindex'       => 1,
                  'timeout'       => 1.5,
                  'read_timeout'  => 1.5,
                ),
                'apps_paths' => array(
                    0 => array (
                            'path'     => OC::$$SERVERROOT.'/apps',
                            'url'      => '/apps',
                            'writable' => false,
                    ),
                    1 => array (
                            'path'     => OC::$$SERVERROOT.'/custom_apps',
                            'url'      => '/custom_apps',
                            'writable' => true,
                    ),
                ),
                'htaccess.RewriteBase' => '/',
                'mail_smtpmode' => 'smtp',
                'mail_smtptimeout' => 30,
                'mail_sendmailmode' => 'smtp',
                'mail_smtphost' => getenv('SMTP_HOST'),
                'mail_smtpport' => 25,
                'mail_smtpsecure' => '',
                'mail_smtpauth' => false,
                'mail_smtpauthtype' => '',
                'mail_smtppassword' => getenv('SMTP_PASSWORD'),
                'mail_smtpname' => '',
                'mail_from_address' => 'noreply',
                'mail_domain' => '${SECRET_DOMAIN}',
                'mail_smtpstreamoptions' => array (
                  'ssl' => array (
                    'allow_self_signed' => true,
                    'verify_peer' => false,
                    'verify_peer_name' => false
                    ),
                  ),
                'enable_previews' => true,
                'enabledPreviewProviders' =>
                    array (
                  0 => 'OC\\Preview\\PNG',
                  1 => 'OC\\Preview\\JPEG',
                  2 => 'OC\\Preview\\GIF',
                  3 => 'OC\\Preview\\BMP',
                  4 => 'OC\\Preview\\XBitmap',
                  5 => 'OC\\Preview\\Movie',
                  6 => 'OC\\Preview\\PDF',
                  7 => 'OC\\Preview\\MP3',
                  8 => 'OC\\Preview\\TXT',
                  9 => 'OC\\Preview\\MarkDown',
                  10 => 'OC\\Preview\\HEIC',
                  11 => 'OC\\Preview\\MKV',
                  12 => 'OC\\Preview\\MP4',
                  13 => 'OC\\Preview\\AVI',
                  ),
                'preview_max_x' => 1024,
                'preview_max_y' => 768,
                'preview_max_scale_factor' => 1,
                'bulkupload.enabled' => false,
                'default_language' => 'de',
                'default_locale' => 'de_DE',
                'default_phone_region' => 'DE',
                'default_timezone' => 'Europe/Berlin',
                'maintenance_window_start' => 1,
              );
      phpConfigs:
        uploadLimit.ini: |
          upload_max_filesize = 16G
          post_max_size = 16G
          max_input_time = 3600
          max_execution_time = 3600
    deploymentStrategy:
      type: Recreate
    podSecurityContext:
      fsGroup: 82
      fsGroupChangePolicy: OnRootMismatch
    persistence:
      enabled: true
      existingClaim: nextcloud-pvc
      nextcloudData:
        enabled: true
        existingClaim: nextcloud-data-pvc
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi
    startupProbe:
      enabled: true
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 360
    livenessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readinessProbe:
      enabled: true
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 5
    nginx:
      enabled: true
      image:
        repository: nginxinc/nginx-unprivileged
      config:
        default: true
      securityContext:
        runAsUser: 82
        runAsGroup: 82
        runAsNonRoot: true
        readOnlyRootFilesystem: false
      resources:
        requests:
          cpu: 50m
          memory: 20Mi
        limits:
          memory: 128Mi
    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud-postgres-credentials
        databaseKey: POSTGRES_DB
        hostKey: POSTGRES_HOST
        passwordKey: POSTGRES_PASSWORD
        usernameKey: POSTGRES_USER
    redis:
      enabled: false
    metrics:
      enabled: false
    cronjob:
      enabled: true
