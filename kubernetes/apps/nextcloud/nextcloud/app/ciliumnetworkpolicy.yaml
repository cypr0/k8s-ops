---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nextcloud
  namespace: nextcloud
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
  ingress:
    # Envoy proxy (network ns): the nginx container listens on :80 (the
    # Service maps 8080->80, and Cilium enforces policy POST-DNAT on the
    # container port).
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Same namespace (collabora/whiteboard internal callbacks, exporters)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": nextcloud
    # Gatus health check (GET /status.php)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: gatus
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # openclaw's nextcloud-mcp sidecar: WebDAV/OCS API, restricted to the
    # dedicated openclaw-reader account (see post-install-job.yaml)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": openclaw
            app.kubernetes.io/name: openclaw
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Open WebUI's nextcloud_full Tool (kubernetes/apps/open-webui/open-webui/
    # app/tools/nextcloud_full.py) reads/writes WebDAV/OCS as the real admin account
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": open-webui
            app.kubernetes.io/name: open-webui
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # PostgreSQL + Redis/Dragonfly
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "6379"
              protocol: TCP
    # Authentik OIDC via id.${SECRET_DOMAIN} (envoy-internal, DNAT :10443)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    # Same namespace (clamav :3310, elasticsearch :9200, collabora :9980, whiteboard :3002)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": nextcloud
    # External: app store, SMTP, federation, WOPI hairpin via public domain
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
            - port: "25"
              protocol: TCP
