---
# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gitlab-runner
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  refreshInterval: "1h"
  target:
    name: gitlab-runner-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Runner authentication token (glrt-...), created in GitLab under
        # Admin > CI/CD > Runners > New instance runner. The registration-token
        # key must exist but stays empty: the chart's entrypoint only skips
        # registration when runner-token is set.
        runner-token: "{{ .GITLAB_RUNNER_TOKEN }}"
        runner-registration-token: ""
  dataFrom:
    - extract:
        key: gitlab
