---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    # No resources block existed anywhere for the main agent DaemonSet
    # before this -- confirmed live (2026-08-16): cilium-agent runs
    # completely unaccounted for in the scheduler's own bookkeeping
    # (0 memory/cpu requested), while actually using ~90m CPU / ~215Mi
    # memory per node. This is a real contributor to the already-known
    # control-plane memory overcommit (cp-0/cp-2 running at 67-78% actual
    # RAM while only 16-20% of that is ever reserved via requests).
    # Deliberately NOT setting a memory/cpu LIMIT here: this is the
    # cluster's own CNI, already suspected of separate stability issues
    # (single-apiserver-backend fragility, see project memory) --
    # throttling or OOM-killing it under an aggressive limit would risk
    # causing the exact kind of cluster-wide networking instability this
    # is meant to help diagnose, not fix it. A request-only entry still
    # gives the scheduler an accurate accounting without that risk.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        # Istverbrauch 190-341Mi je Knoten. 768Mi laesst Luft fuer
        # BPF-Map-Wachstum bei mehr Endpunkten, begrenzt aber den Schaden,
        # wenn der Agent entgleist. Ohne Limit war er auf jedem der sieben
        # Knoten unbegrenzt -- auf einem einzelnen physischen Host die
        # kritischste Stelle, siehe Architekturbefund AB.1 im ISMS.
        memory: 768Mi
    autoDirectNodeRoutes: true
    bpf:
      masquerade: true
      # Ref: https://github.com/siderolabs/talos/issues/10002
      hostLegacyRouting: true
    cni:
      # Required for pairing with Multus CNI
      exclusive: false
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    # NOTE: devices might need to be set if you have more than one active NIC on your hosts
    # devices: eno+ eth+
    dashboards:
      enabled: true
    endpointRoutes:
      enabled: true
    envoy:
      enabled: false
    gatewayAPI:
      enabled: false
    hubble:
      enabled: true
      relay:
        enabled: true
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 128Mi
      ui:
        enabled: false
      metrics:
        enabled:
          - dns:query;ignoreAAAA
          - drop
          # Policy verdicts. Added 2026-09-20 after a CiliumNetworkPolicy gap
          # silently dropped 28% of all Prometheus scrape targets for an unknown
          # period -- a dropped packet shows up as a scrape timeout, not as a
          # policy error, and nothing in the cluster surfaced it. This metric is
          # what makes that class of failure visible.
          - policy
          - tcp
          - flow
          - port-distribution
          - icmp
          - "httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction"
        serviceMonitor:
          enabled: true
        dashboards:
          enabled: true
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: "10.42.0.0/16"
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    l2announcements:
      enabled: true
    loadBalancer:
      algorithm: maglev
      mode: "snat"
    localRedirectPolicies:
      enabled: true
    operator:
      resources:
        requests:
          cpu: 25m
          memory: 128Mi
        limits:
          # Istverbrauch 90Mi, eine Replica.
          memory: 256Mi
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      replicas: 1
      rollOutPods: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    socketLB:
      enabled: true
      # hostNamespaceOnly=true bypasses socket-LB inside pod namespaces and
      # falls back to the per-packet tc LB at the veth.
      #
      # Why true: in-pod socket-LB pins a connected UDP socket to the backend
      # picked at connect(). When that backend goes away Cilium either aborts
      # the socket (clients that never reconnect -- rspamd's DNS, fluent-bit's
      # syslog output -- then fail with "Destination address required" until
      # restarted) or, once cilium_lb4_reverse_sk is full, skips it and the
      # socket keeps sending to the dead pod IP (k8s-wrk-3 2026-10-17: 68561 of
      # 68834 entries, nearly all per-query DNS; fluent-bit was still sending
      # to an IP that had been reassigned to authentik-worker). Per-packet LB
      # keeps the ClusterIP as the peer and picks a live backend per flow, so
      # CoreDNS/Wazuh rollouts are invisible to these clients. This is the
      # mitigation Cilium's kube-proxy-free docs give for reverse-SK exhaustion.
      #
      # History: set to false on 2026-06-20 (63be357) because pod ->
      # envoy-internal -> authentik ("hairpin") stopped answering. Envoy-proxy
      # CNP fixes for that same path landed the same day (ca2cfce, 554bab3).
      # Re-tested 2026-10-17 with a CiliumNodeConfig canary on k8s-wrk-1:
      # wazuh-dashboard -> id.${SECRET_DOMAIN} (envoy-internal ClusterIP) 40/40
      # OK, 17 of them to the envoy-internal replica on the same node, no
      # drops; connected sockets kept the ClusterIP as their peer.
      hostNamespaceOnly: true
