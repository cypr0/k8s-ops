---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reloader
spec:
  chartRef:
    kind: OCIRepository
    name: reloader
  interval: 1h
  values:
    fullnameOverride: reloader
    reloader:
      readOnlyRootFileSystem: true
      podMonitor:
        enabled: true
        namespace: "{{ .Release.Namespace }}"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containerSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - "ALL"
      deployment:
        # Unter reloader.deployment, nicht unter reloader: das Chart liest
        # .Values.reloader.deployment.resources (templates/deployment.yaml).
        # Eine Ebene hoeher landeten die Werte nirgends -- das laufende
        # Deployment hatte resources: {} und damit kein Limit. Gefunden durch
        # den ISMS-Check container_memory_limits (KONF.9.1).
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            # Istverbrauch 79Mi, also lag das alte (unwirksame) Limit von
            # 64Mi ohnehin darunter.
            memory: 192Mi
