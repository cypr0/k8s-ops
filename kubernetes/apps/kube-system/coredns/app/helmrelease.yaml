---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  chartRef:
    kind: OCIRepository
    name: coredns
  interval: 1h
  values:
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    k8sAppLabelOverride: kube-dns
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: "10.43.0.10"
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 70
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          # Split-horizon DNS: resolve id.${SECRET_DOMAIN} (Authentik) in-cluster
          # to the envoy-INTERNAL gateway ClusterIP instead of the public Cloudflare
          # edge. The authentik-ui HTTPRoute is attached to envoy-internal too, so
          # in-cluster OIDC clients (opensearch dashboards + data nodes validating
          # tokens/JWKS) reach Authentik via the internal gateway rather than the
          # public Cloudflare hairpin (which Cloudflare drops as a cdn-loop and
          # which broke OIDC).
          # Using `hosts` plugin with static IP instead of `rewrite` because:
          # 1. `rewrite name` only affects A queries, AAAA queries still forward to upstream
          # 2. Node.js prefers AAAA (IPv6), which resolves to Cloudflare and times out
          # 3. `hosts` with fallthrough handles all query types and falls through for other names
          # Same split-horizon trick for cloud.${SECRET_DOMAIN} (Nextcloud):
          # Collabora calls back into Nextcloud server-to-server for WOPI
          # CheckFileInfo. Over the public Cloudflare hairpin, Nextcloud saw
          # the connection arrive from Cloudflare's edge IP, which richdocuments'
          # wopi_allowlist (10.0.0.0/8, 192.168.0.0/16) rejected with a 403,
          # surfacing to the user as "Unauthorised WOPI host". The nextcloud
          # HTTPRoute is attached to envoy-internal too, so in-cluster callers
          # land inside the pod CIDR the allowlist already permits.
          - name: hosts
            configBlock: |-
              10.43.38.197 id.${SECRET_DOMAIN}
              10.43.38.197 cloud.${SECRET_DOMAIN}
              fallthrough
          # Gatus's Echo (Connectivity Test) endpoint kept timing out: this
          # cluster has no IPv6 routing, but echo.${SECRET_DOMAIN} (proxied
          # through Cloudflare) publishes AAAA records, and the dialer hangs
          # on the unreachable IPv6 address rather than falling back
          # quickly. Unlike id.${SECRET_DOMAIN} above, this hostname needs
          # to keep resolving to the REAL public Cloudflare edge (that's the
          # whole point of a connectivity test) -- so instead of a static
          # `hosts` rewrite (which would need a hardcoded, rotation-prone
          # Cloudflare IP), suppress only the AAAA answer here and let the A
          # query keep forwarding upstream normally for a live, current IPv4
          # answer.
          - name: template
            parameters: ANY AAAA echo.${SECRET_DOMAIN}
            configBlock: |-
              rcode NXDOMAIN
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          - name: autopath
            parameters: "@kubernetes"
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - "ALL"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
