---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  chartRef:
    kind: OCIRepository
    name: coredns
  interval: 1h
  values:
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    k8sAppLabelOverride: kube-dns
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: "10.43.0.10"
    replicaCount: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      metrics:
        - type: Resource
          resource:
            name: cpu
            target:
              type: Utilization
              averageUtilization: 70
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          # Split-horizon DNS: resolve id.${SECRET_DOMAIN} (Authentik) in-cluster
          # to the envoy-INTERNAL gateway ClusterIP instead of the public Cloudflare
          # edge. The authentik-ui HTTPRoute is attached to envoy-internal too, so
          # in-cluster OIDC clients (opensearch dashboards + data nodes validating
          # tokens/JWKS) reach Authentik via the internal gateway rather than the
          # public Cloudflare hairpin (which Cloudflare drops as a cdn-loop and
          # which broke OIDC).
          # Using `hosts` plugin with static IP instead of `rewrite` because:
          # 1. `rewrite name` only affects A queries, AAAA queries still forward to upstream
          # 2. Node.js prefers AAAA (IPv6), which resolves to Cloudflare and times out
          # 3. `hosts` with fallthrough handles all query types and falls through for other names
          # Same split-horizon trick for cloud.${SECRET_DOMAIN} (Nextcloud):
          # Collabora calls back into Nextcloud server-to-server for WOPI
          # CheckFileInfo. Over the public Cloudflare hairpin, Nextcloud saw
          # the connection arrive from Cloudflare's edge IP, which richdocuments'
          # wopi_allowlist (10.0.0.0/8, 192.168.0.0/16) rejected with a 403,
          # surfacing to the user as "Unauthorised WOPI host". The nextcloud
          # HTTPRoute is attached to envoy-internal too, so in-cluster callers
          # land inside the pod CIDR the allowlist already permits.
          - name: hosts
            configBlock: |-
              10.43.38.197 id.${SECRET_DOMAIN}
              10.43.38.197 cloud.${SECRET_DOMAIN}
              fallthrough
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods verified
              fallthrough in-addr.arpa ip6.arpa
          - name: autopath
            parameters: "@kubernetes"
          # This cluster has NO working IPv6 egress anywhere -- confirmed
          # repeatedly across unrelated subsystems, not just the original
          # echo.${SECRET_DOMAIN} connectivity-test case this rule started
          # as: Velero's Kopia repo-maintenance jobs failing against
          # de-fra.i3storage.com ("dial tcp [2a00:ccc0::32]:443: network is
          # unreachable"), Flux failing to fetch HelmRepository/OCIRepository
          # artifacts from github.io/mirror.gcr.io mirrors, and even
          # Alertmanager's own Pushover delivery intermittently failing
          # against api.pushover.net's AAAA record. Every one of these hosts
          # happens to publish BOTH A and AAAA records, and whichever client
          # picks the AAAA address first hangs/fails instead of falling back
          # to IPv4 quickly.
          #
          # Rather than keep whack-a-moling this one hostname at a time
          # (the previous version of this rule only covered
          # echo.${SECRET_DOMAIN}), suppress the AAAA answer for EVERY
          # external name cluster-wide: placed after the `kubernetes` plugin
          # (which already fully answers cluster.local/in-addr.arpa/ip6.arpa
          # itself and never reaches this rule for those zones), a zone of
          # "." here only ever sees names the `kubernetes` plugin didn't
          # claim -- i.e. external names about to be forwarded upstream.
          # Internal cluster DNS is completely unaffected; nothing in this
          # cluster resolves or needs an internal AAAA record anyway.
          - name: template
            parameters: ANY AAAA .
            configBlock: |-
              rcode NXDOMAIN
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - "ALL"
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
