---
# Static site, fully self-contained in the served bundle: no runtime egress
# to anything besides DNS is needed.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: philipp-rosch-site
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: philipp-rosch-site
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Kubelet readiness/liveness probes (host network → host entity)
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
