---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
#
# philipp-rosch.de is a separate apex domain from ${SECRET_DOMAIN}, but public
# traffic never reaches Envoy Gateway directly here -- it's proxied through
# Cloudflare Tunnel (see kubernetes/apps/network/cloudflare-tunnel/app/
# helmrelease.yaml), which terminates client TLS at Cloudflare's edge and
# re-encrypts to the origin using a FIXED originServerName
# (external.${SECRET_DOMAIN}) regardless of the public hostname requested.
# That means the origin-side TLS handshake always hits the cluster-wide
# wildcard cert on the existing "https" listener -- no new listener or
# per-domain Certificate is needed. Envoy still routes to the right backend
# by the HTTP Host header, independent of which cert/SNI was used.
#
# Ingress rules (cloudflare-tunnel) and DNS records (dnsendpoint.yaml here +
# cloudflare-dns domainFilters) are already wired for both hostnames. The one
# remaining manual step: the Cloudflare API token behind CF_API_TOKEN
# (cloudflare-dns-secret / cert-manager-secret) must have Zone:DNS:Edit on
# the philipp-rosch.de zone too, not just ${SECRET_DOMAIN} -- widen its scope
# in the Cloudflare dashboard if needed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: philipp-rosch-site
spec:
  hostnames:
    - "philipp-rosch.de"
    - "www.philipp-rosch.de"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: philipp-rosch-site
          port: 80
