---
# K8s Gateway: CoreDNS plugin exposing K8s Services/Ingresses as DNS records.
# CoreDNS in kube-system forwards selected zones here; replies on port 1053.
#
# Cilium kube-proxy-replacement + bpf-lb-mode: snat policy enforcement:
# - North-South (LB, external via 192.168.10.102:53):
#   L2-owner node (k8s-cp-0) receives packet, SNATs client IP → node IP,
#   then DNATs to backend pod:1053. The backend pod sees src=node-IP (remote-node
#   entity) on port 1053. Policy must allow fromEntities: remote-node port 1053.
#   Also allow fromEntities: world port 53 for any pre-SNAT enforcement path.
# - East-West (ClusterIP, coredns→k8s-gateway): policy evaluated POST-DNAT
#   → container port 1053 must be allowed (coredns uses ClusterIP:53 → DNAT → 1053)
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: k8s-gateway
  namespace: network
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: k8s-gateway
  ingress:
    # Public DNS queries via LoadBalancer (OPNsense Split-DNS for cisotop.de)
    # Policy evaluated PRE-DNAT at L2-owner node → service port 53
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # CoreDNS upstream forwarding via ClusterIP → POST-DNAT → container port 1053
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "1053"
              protocol: UDP
            - port: "1053"
              protocol: TCP
    # SNAT mode: L2-owner node SNATs client IP to its own node IP before forwarding
    # to this backend pod. Node IPs are identified as remote-node (or kube-apiserver
    # for CP nodes). Must allow remote-node on 1053 so SNAT'd LB traffic is accepted.
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "1053"
              protocol: UDP
            - port: "1053"
              protocol: TCP
    # Prometheus metrics scraping (pod-direct, no service DNAT)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9153"
              protocol: TCP
  egress:
    # k8s-gateway queries CoreDNS for its own resolution (no DNAT port change)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
