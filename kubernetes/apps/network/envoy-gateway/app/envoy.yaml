---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy
spec:
  logging:
    level:
      default: info
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          imageRepository: mirror.gcr.io/envoyproxy/envoy
          resources:
            requests:
              cpu: 100m
              # Without this, Kubernetes defaults the memory request to the
              # limit -- 1Gi reserved per proxy pod for something that sits at
              # 40-100Mi. With two gateways at minReplicas 2 that was ~5Gi of
              # scheduling capacity blocked and unused, and up to 8Gi once the
              # HPA scales out. 256Mi is comfortably above the observed peak
              # while leaving the 1Gi ceiling for bursts.
              memory: 256Mi
            limits:
              memory: 1Gi
      envoyHpa:
        minReplicas: 2
        maxReplicas: 4
        metrics:
          - type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 70
      envoyService:
        # Local, so LAN/VPN clients reach Envoy with their own source IP. With
        # Cluster, the L2-lease node SNATs to its own node IP whenever Maglev
        # picks an Envoy pod on another node: measured 2026-10-17 from the VPN
        # (10.10.0.2), envoy-external saw the client 16/30 times and
        # 192.168.10.23 otherwise; envoy-internal, whose lease node had no
        # pod, saw 192.168.10.20 19/19 times.
        #
        # Requires Cilium >= 1.20.2. Only from that version on do nodes without
        # a live local Envoy pod stay out of the L2-announcement election for
        # a Local Service (upstream fix for cilium/cilium#27800). On older
        # Cilium, the lease node can answer ARP with no local backend and
        # blackhole the VIP: the Mailu incident on 1.20.1 (see
        # kubernetes/apps/mail/mailu/app/helmrelease.yaml) is that failure.
        #
        # In-cluster callers are unaffected: ClusterIP traffic (CoreDNS
        # split-horizon sends id./cloud. to the envoy-internal ClusterIP) and
        # pod/host connections to the LB IPs use Cilium's internal scope,
        # which keeps every backend. Cloudflare Tunnel traffic also arrives
        # via the ClusterIP.
        externalTrafficPolicy: Local
  shutdown:
    drainTimeout: 180s
  telemetry:
    metrics:
      prometheus:
        compression:
          type: Zstd
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy
    namespace: network
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-external
  annotations:
    # Both prefixes on purpose: external-dns renamed its default annotation
    # prefix from "external-dns.alpha.kubernetes.io/" (v0.21.0) to
    # "external-dns.kubernetes.io/" (v0.22.0). The wrong one is ignored
    # silently, and without this target external-dns falls back to the
    # Gateway's own address -- 192.168.10.103, a LAN IP that Cloudflare
    # refuses for a proxied record. The result is no public record at all.
    external-dns.kubernetes.io/target: external.${SECRET_DOMAIN}
    external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      external-dns.kubernetes.io/hostname: external.${SECRET_DOMAIN}
      external-dns.alpha.kubernetes.io/hostname: external.${SECRET_DOMAIN}
      lbipam.cilium.io/ips: "192.168.10.103"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: ${SECRET_DOMAIN/./-}-production-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-internal
  annotations:
    external-dns.kubernetes.io/target: internal.${SECRET_DOMAIN}
    external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      external-dns.kubernetes.io/hostname: internal.${SECRET_DOMAIN}
      external-dns.alpha.kubernetes.io/hostname: internal.${SECRET_DOMAIN}
      lbipam.cilium.io/ips: "192.168.10.101"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: ${SECRET_DOMAIN/./-}-production-tls
---
# Four policies rather than two, because Envoy Gateway attaches at most one
# policy of a given type to a given Gateway -- a second one targeting the same
# Gateway is rejected as Conflicted. A shared policy plus an "external only"
# overlay is therefore not expressible, so the settings common to both
# gateways are repeated below.
#
# The split exists because only envoy-external is publicly reachable:
# cloudflared forwards *.${SECRET_DOMAIN} to it, while envoy-internal answers
# only on the LAN and over the site-to-site VPN. Denial-of-service protection
# belongs on the exposed surface; on the internal one it would mostly be a
# way to rate-limit oneself during a bulk upload.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: envoy-external
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
  compressor:
    - type: Zstd
      zstd: {}
    - type: Brotli
      brotli: {}
    - type: Gzip
      gzip: {}
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - reset
  # Local rate limiting, i.e. enforced by each Envoy pod itself with no
  # external rate limit service and no Redis. Evidence for KONF.15.3
  # (protection against denial of service) in isms/compliance-as-code.
  #
  # The threshold is measured, not guessed. Peak downstream request rate per
  # Envoy pod over the seven days to 2026-10-27, taken from
  # envoy_http_downstream_rq_completed with burst-sensitive one-minute
  # windows: 6.90 req/s, i.e. about 415 per minute across all routes. 6000
  # per minute therefore leaves roughly a factor of 14 of headroom on the
  # aggregate, and more per route.
  #
  # Two properties worth knowing before tuning this:
  #
  # * Targeting a Gateway gives every Route its own counter. A busy
  #   application cannot consume another one's budget, which is why a single
  #   shared value is acceptable here.
  # * The counter is per Envoy pod. With envoyHpa at 2-4 replicas the
  #   effective ceiling is 12000-24000 per minute. That still bounds a flood
  #   by orders of magnitude while staying far above real usage.
  #
  # Token bucket semantics absorb bursts: the bucket holds 6000 tokens and
  # refills every minute, so a page load firing a few hundred parallel
  # requests is not rejected.
  rateLimit:
    type: Local
    local:
      rules:
        - limit:
            requests: 6000
            unit: Minute
  tcpKeepalive: {}
  timeout:
    http:
      # Deliberately disabled, and deliberately left that way. requestTimeout
      # bounds the entire request including the response body, so any finite
      # value would cut long-lived streams: Open-WebUI's server-sent events,
      # large Immich uploads, slow Grafana and Loki queries.
      #
      # The attack this would otherwise mitigate -- a client dribbling out a
      # request to hold a worker open, slowloris style -- is covered by
      # requestHeadersReceivedTimeout in the ClientTrafficPolicy instead.
      # That timer only bounds header reception and leaves bodies and
      # responses untouched, which makes it the surgical lever here.
      requestTimeout: 0s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: envoy-internal
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
  compressor:
    - type: Zstd
      zstd: {}
    - type: Brotli
      brotli: {}
    - type: Gzip
      gzip: {}
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - reset
  # No rateLimit here on purpose: this gateway is not publicly reachable, and
  # the only client able to exhaust it is the operator doing something bulky.
  tcpKeepalive: {}
  timeout:
    http:
      requestTimeout: 0s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-external
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
  # Needed on both gateways, for different reasons. Here it is Cloudflare's
  # X-Forwarded-For arriving from the cloudflared pod; on envoy-internal it
  # stops a LAN client from choosing the IP that lands in Grafana's session
  # tokens and request logs. See kubernetes/apps/monitoring/grafana/app/
  # httproute.yaml and docs/apps/envoy-gateway.md (Client IP).
  clientIPDetection:
    xForwardedFor:
      trustedCIDRs:
        - "10.42.0.0/16"
  # Concurrent connection ceiling per Envoy pod. Peak concurrent downstream
  # requests over the seven days to 2026-10-27 was 14 per pod
  # (envoy_http_downstream_rq_active); connections are fewer still, because
  # HTTP/2 multiplexes many requests onto one. 1024 is therefore far above
  # real usage and still caps connection hoarding.
  #
  # closeDelay holds a rejected connection briefly before closing it instead
  # of refusing instantly, which slows down a reconnect flood rather than
  # inviting it.
  connection:
    connectionLimit:
      value: 1024
      closeDelay: 1s
  http2:
    onInvalidMessage: TerminateStream
  http3: {}
  tcpKeepalive: {}
  timeout:
    http:
      # The slowloris defence. The timer starts with the first header byte and
      # is disarmed once the last one arrives, so it bounds a client that
      # dribbles out headers to pin a worker -- without touching request
      # bodies or long-lived responses. Disabled by default in Envoy.
      #
      # 10s is generous for header transmission over the Cloudflare Tunnel;
      # browsers send headers in a single segment.
      requestHeadersReceivedTimeout: 10s
  tls:
    minVersion: "1.2"
    alpnProtocols:
      - h2
      - http/1.1
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-internal
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
  # Not a denial-of-service measure, and therefore present here too: without
  # it a LAN client supplies its own X-Forwarded-For and X-Real-IP, and
  # Grafana trusts the leftmost entry with no proxy check. That let any LAN
  # client choose the IP recorded in user_auth_token.client_ip and in the
  # request log.
  clientIPDetection:
    xForwardedFor:
      trustedCIDRs:
        - "10.42.0.0/16"
  # No connectionLimit and no requestHeadersReceivedTimeout: both are
  # denial-of-service measures, and this gateway is reachable only from the
  # LAN and the site-to-site VPN. TLS floor and HTTP/2 framing stay, because
  # those are correctness rather than flood protection.
  http2:
    onInvalidMessage: TerminateStream
  http3: {}
  tcpKeepalive: {}
  tls:
    minVersion: "1.2"
    alpnProtocols:
      - h2
      - http/1.1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  annotations:
    external-dns.kubernetes.io/controller: none
    external-dns.alpha.kubernetes.io/controller: none
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: http
    - name: envoy-internal
      namespace: network
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
