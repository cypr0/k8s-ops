---
# Envoy Gateway controller: manages xDS config for envoy proxy deployments
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-gateway
  namespace: network
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gateway-helm
  ingress:
    # xDS: the envoy proxy data-plane pods INITIATE the gRPC stream to this
    # controller's xDS server on :18000 to receive their listener/cluster config.
    # Without this, every envoy pod fails to fetch config and crash-loops
    # (1/2 Ready), so both gateways have no healthy backends and are unreachable.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "18000"
              protocol: TCP
    # Prometheus metrics scraping
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "19001"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Watch/manage Gateway API + EnvoyProxy resources, create proxy deployments
    - toEntities:
        - kube-apiserver
---
# Envoy proxy pods: terminate TLS, route to backend services.
# Both envoy-external (public LB) and envoy-internal (private LB) share this label.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: envoy-proxy
  namespace: network
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: envoy
  ingress:
    # IMPORTANT: ingress is enforced POST-DNAT (kubeProxyReplacement). The Envoy
    # data-plane container listens on 10080 (HTTP) and 10443 (HTTPS); the
    # LoadBalancer/ClusterIP services map 80 -> 10080 and 443 -> 10443. All
    # ingress rules below therefore allow the CONTAINER ports 10080/10443, not
    # the service ports 80/443 (using 80/443 silently dropped everything).
    #
    # Cloudflare Tunnel forwards all *.cisotop.de traffic to
    # envoy-external.network.svc:443 -> container 10443 (primary public path).
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: cloudflare-tunnel
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP
            - port: "10443"
              protocol: TCP
    # Direct LoadBalancer access (fallback / health checks from world)
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP
            - port: "10443"
              protocol: TCP
            - port: "10443"
              protocol: UDP
    # SNAT mode (loadBalancer.mode: snat + kubeProxyReplacement): the L2-owner
    # node SNATs the client IP to its own node IP before forwarding to this
    # backend pod. Cilium then classifies the source as remote-node (or
    # kube-apiserver for CP nodes), NOT world. Without this rule, all north-south
    # LoadBalancer traffic to envoy-external (192.168.10.103) and envoy-internal
    # (192.168.10.101) is dropped. Mirrors the k8s-gateway policy.
    - fromEntities:
        - remote-node
      toPorts:
        - ports:
            - port: "10080"
              protocol: TCP
            - port: "10443"
              protocol: TCP
            - port: "10443"
              protocol: UDP
    # Prometheus stats scraping (port 19001)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "19001"
              protocol: TCP
    # OpenSearch Dashboards performs its server-side OIDC discovery/token/JWKS
    # calls to id.cisotop.de via a hostAlias pointing at the envoy-external
    # ClusterIP, so it reaches Authentik through this proxy internally instead
    # of the public Cloudflare hairpin. Post-DNAT container port is 10443.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": logging
            opensearch.cluster.dashboards: opensearch
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Envoy Gateway controller xDS (receive config)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: gateway-helm
      toPorts:
        - ports:
            - port: "18000"
              protocol: TCP
    # Backend: monitoring namespace (Grafana :3000, Gatus :8080)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    # Backend: logging namespace (OpenSearch Dashboards :5601)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": logging
      toPorts:
        - ports:
            - port: "5601"
              protocol: TCP
    # Backend: security namespace (Authentik :9000)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": security
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # Backend: default namespace (echo container listens on :80; service maps
    # 80 -> 80. Egress is enforced POST-DNAT against the container port.)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": default
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Backend: flux-system namespace (webhook-receiver :9292)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": flux-system
      toPorts:
        - ports:
            - port: "9292"
              protocol: TCP
