---
# Cloudflare Tunnel: establishes outbound tunnel to Cloudflare edge for zero-trust ingress.
# All traffic is initiated outbound — no inbound connections from world.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflare-tunnel
  namespace: network
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflare-tunnel
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Cloudflare tunnel endpoints (QUIC preferred, HTTPS fallback)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "7844"
              protocol: UDP
            - port: "7844"
              protocol: TCP
    # Forward all *.cisotop.de traffic to envoy-external (the actual ingress backend)
    # Note: envoy-external service maps 443->10443 and 80->10080, so we need the container ports
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
            - port: "10080"
              protocol: TCP
    # webmail.${SECRET_DOMAIN} -> Mailu's front Service directly (see
    # helmrelease.yaml's config.yaml ingress list) instead of via
    # envoy-external, since front does its own TLS termination.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": mail
            app.kubernetes.io/name: mailu
            app.kubernetes.io/component: front
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
