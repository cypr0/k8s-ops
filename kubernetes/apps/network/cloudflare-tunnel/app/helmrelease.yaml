---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-tunnel
spec:
  chartRef:
    kind: OCIRepository
    name: cloudflare-tunnel
  interval: 1h
  values:
    controllers:
      cloudflare-tunnel:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/cloudflare/cloudflared
              tag: 2026.8.3
            env:
              NO_AUTOUPDATE: true
              TUNNEL_METRICS: 0.0.0.0:8080
              TUNNEL_POST_QUANTUM: true # disable when using http2
              TUNNEL_TRANSPORT_PROTOCOL: quic # or http2
            envFrom:
              - secretRef:
                  name: cloudflare-tunnel-secret
            args:
              - "tunnel"
              - "run"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ready
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: http
    configMaps:
      config:
        data:
          config.yaml: |-
            ingress:
              # Mailu webmail/admin — must come before the "*.${SECRET_DOMAIN}"
              # catch-all below (cloudflared matches top-to-bottom, first
              # wins), otherwise this hostname would fall through to
              # envoy-external instead. Routes straight to Mailu's own
              # ClusterIP Service rather than through envoy-external, since
              # `front` (kubernetes/apps/mail/mailu/app/helmrelease.yaml)
              # terminates TLS itself with its own cert
              # (kubernetes/apps/mail/mailu/app/certificate.yaml) — same
              # "backend already does its own TLS" pattern as the
              # envoy-external routes below, just a different backend.
              # originServerName must match one of that cert's SANs, or
              # cloudflared's TLS validation of the origin fails.
              - hostname: "webmail.${SECRET_DOMAIN}"
                originRequest:
                  http2Origin: true
                  originServerName: webmail.${SECRET_DOMAIN}
                service: https://mailu-front.mail.svc.cluster.local:443
              - hostname: "*.${SECRET_DOMAIN}"
                originRequest:
                  http2Origin: true
                  originServerName: external.${SECRET_DOMAIN}
                service: https://envoy-external.{{ .Release.Namespace }}.svc.cluster.local:443
              # ${SECRET_SECOND_DOMAIN}: separate apex domain (portfolio
              # site), same tunnel/backend as above. The domain string itself
              # lives in kubernetes/components/sops/cluster-secrets.sops.yaml
              # (SECRET_SECOND_DOMAIN) rather than as a plaintext literal
              # here. originServerName stays pinned to external.${SECRET_DOMAIN}
              # -- that's just the origin-side TLS SNI cloudflared presents to
              # Envoy Gateway's existing wildcard cert; Envoy still routes by
              # the real HTTP Host header to the philipp-rosch-site HTTPRoute
              # regardless.
              - hostname: "${SECRET_SECOND_DOMAIN}"
                originRequest:
                  http2Origin: true
                  originServerName: external.${SECRET_DOMAIN}
                service: https://envoy-external.{{ .Release.Namespace }}.svc.cluster.local:443
              - hostname: "www.${SECRET_SECOND_DOMAIN}"
                originRequest:
                  http2Origin: true
                  originServerName: external.${SECRET_DOMAIN}
                service: https://envoy-external.{{ .Release.Namespace }}.svc.cluster.local:443
              - service: http_status:404
    persistence:
      config-file:
        type: configMap
        identifier: config
        globalMounts:
          - path: /etc/cloudflared/config.yaml
            subPath: config.yaml
