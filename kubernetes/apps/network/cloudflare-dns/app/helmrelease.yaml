---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cloudflare-dns
spec:
  chartRef:
    kind: OCIRepository
    name: cloudflare-dns
  interval: 1h
  values:
    fullnameOverride: *app
    provider: cloudflare
    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: &secret cloudflare-dns-secret
            key: api-token
    extraArgs:
      - --cloudflare-dns-records-per-page=1000
      - --cloudflare-proxied
      - --crd-source-apiversion=externaldns.k8s.io/v1alpha1
      - --crd-source-kind=DNSEndpoint
      - --gateway-name=envoy-external
      # Default managed types are only A/AAAA/CNAME (confirmed against
      # pkg/apis/externaldns/types.go at the v0.21.0 tag this cluster runs)
      # -- MX/TXT DNSEndpoint entries (mail/mailu's SPF/DKIM/DMARC/MX
      # records) were silently skipped with zero log output, no error,
      # until this was added. NS and SRV deliberately excluded: this
      # instance doesn't manage zone delegation, and this version's
      # Cloudflare provider has no working SRV support at all anyway (see
      # kubernetes/apps/mail/mailu/app/dnsendpoint.yaml's comment).
      - --managed-record-types=A
      - --managed-record-types=AAAA
      - --managed-record-types=CNAME
      - --managed-record-types=MX
      - --managed-record-types=TXT
    triggerLoopOnEvent: true
    policy: sync
    sources:
      - "crd"
      - "gateway-httproute"
    txtPrefix: k8s.
    txtOwnerId: default
    # ${SECRET_SECOND_DOMAIN} added for the portfolio site (separate apex
    # domain, same Cloudflare account) -- the domain string itself lives in
    # kubernetes/components/sops/cluster-secrets.sops.yaml
    # (SECRET_SECOND_DOMAIN) rather than as a plaintext literal here.
    # Requires the CF_API_TOKEN below to also have Zone:DNS:Edit on that
    # zone -- widen the token's zone scope in the Cloudflare dashboard if
    # it's currently restricted to ${SECRET_DOMAIN}.
    #
    # ${SECRET_THIRD_DOMAIN} / ${SECRET_FOURTH_DOMAIN} added for further
    # Mailu-hosted personal domains, same "Rosch Domains" Cloudflare account
    # -- confirmed live the existing CF_API_TOKEN already has
    # dns_records:edit on each of these zones too, no token-scope widening
    # needed.
    domainFilters:
      - "${SECRET_DOMAIN}"
      - "${SECRET_SECOND_DOMAIN}"
      - "${SECRET_THIRD_DOMAIN}"
      - "${SECRET_FOURTH_DOMAIN}"
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - "ALL"
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
