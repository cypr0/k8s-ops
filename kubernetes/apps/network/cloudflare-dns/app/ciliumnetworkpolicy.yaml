---
# External DNS (cloudflare-dns): syncs K8s Gateway/Ingress hostnames to Cloudflare DNS
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflare-dns
  namespace: network
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    - toEntities:
        - kube-apiserver
    # Cloudflare API v4 (create/update/delete DNS records)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
