---
# Credentials for Proxmox Ansible automation.
# Required keys in 1Password item "proxmox":
#   PROXMOX_SSH_HOST           – IP/hostname of the Proxmox node
#   PROXMOX_ROOT_SSH_KEY       – Root's SSH private key (PEM). Used only for
#                                the bootstrap play (create/repair the
#                                ansible user) - a dedicated keypair, not
#                                shared with the ansible account.
#   PROXMOX_ANSIBLE_SSH_KEY    – The ansible OS user's own SSH private key
#                                (PEM). A genuinely separate keypair from
#                                root's - confirmed live 2026-08-16 that
#                                /home/ansible/.ssh/authorized_keys holds a
#                                distinct "ansible@proxmox" key, not root's.
#                                Used for every task after the bootstrap play.
#   PROXMOX_ANSIBLE_SSH_PUBKEY – Public half of PROXMOX_ANSIBLE_SSH_KEY,
#                                installed as the ansible user's
#                                authorized_keys by the bootstrap play.
#   FTP_SCANNER_PASSWORD       – Password for the local "scanner" FTP account
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-ansible-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: proxmox-ansible-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PROXMOX_SSH_HOST: "{{ .PROXMOX_SSH_HOST }}"
        PROXMOX_ROOT_SSH_KEY: "{{ .PROXMOX_ROOT_SSH_KEY }}"
        PROXMOX_ANSIBLE_SSH_KEY: "{{ .PROXMOX_ANSIBLE_SSH_KEY }}"
        PROXMOX_ANSIBLE_SSH_PUBKEY: "{{ .PROXMOX_ANSIBLE_SSH_PUBKEY }}"
        FTP_SCANNER_PASSWORD: "{{ .FTP_SCANNER_PASSWORD }}"
  dataFrom:
    - extract:
        key: proxmox
