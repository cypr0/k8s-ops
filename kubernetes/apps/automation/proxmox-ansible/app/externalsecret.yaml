---
# Credentials for Proxmox Ansible automation.
# Required keys in 1Password item "proxmox":
#   PROXMOX_SSH_HOST        – IP/hostname of the Proxmox node
#   PROXMOX_ROOT_SSH_KEY    – Root's SSH private key (PEM, used by the CronJob)
#   PROXMOX_ANSIBLE_SSH_PUBKEY – Public half of PROXMOX_ROOT_SSH_KEY, installed
#                                as the ansible OS user's authorized_keys. Same
#                                keypair as root's, authorized for a second
#                                account - not an independent credential. If a
#                                dedicated ansible keypair is introduced later,
#                                this ExternalSecret and hardening.yml's
#                                proxmox_ansible inventory group both need a
#                                matching PROXMOX_ANSIBLE_SSH_PRIVATE_KEY.
#   FTP_SCANNER_PASSWORD    – Password for the local "scanner" FTP account
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: proxmox-ansible-credentials
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: proxmox-ansible-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PROXMOX_SSH_HOST: "{{ .PROXMOX_SSH_HOST }}"
        PROXMOX_ROOT_SSH_KEY: "{{ .PROXMOX_ROOT_SSH_KEY }}"
        PROXMOX_ANSIBLE_SSH_PUBKEY: "{{ .PROXMOX_ANSIBLE_SSH_PUBKEY }}"
        FTP_SCANNER_PASSWORD: "{{ .FTP_SCANNER_PASSWORD }}"
  dataFrom:
    - extract:
        key: proxmox
