---
apiVersion: v1
kind: ConfigMap
metadata:
  name: proxmox-ansible-playbook
data:
  run.sh: |
    #!/bin/sh
    set -e

    apk add --no-cache ansible openssh-client >/dev/null 2>&1
    echo "Ansible $(ansible --version | head -1)"

    # Fix SSH keys: 1Password collapses newlines to spaces in password fields.
    # fix_key.py is a proper Python file (no shell quoting issues). Applied to
    # both keys - root's and the ansible user's own, separate keypair.
    mkdir -p /tmp/ssh-rw
    python3 /scripts/fix_key.py /tmp/ssh/id_rsa /tmp/ssh-rw/id_rsa
    chmod 600 /tmp/ssh-rw/id_rsa
    echo "root SSH key lines: $(wc -l < /tmp/ssh-rw/id_rsa)"
    head -1 /tmp/ssh-rw/id_rsa

    python3 /scripts/fix_key.py /tmp/ssh/ansible_id_rsa /tmp/ssh-rw/ansible_id_rsa
    chmod 600 /tmp/ssh-rw/ansible_id_rsa
    echo "ansible SSH key lines: $(wc -l < /tmp/ssh-rw/ansible_id_rsa)"
    head -1 /tmp/ssh-rw/ansible_id_rsa

    # $$$${VAR} -> Flux ignores and passes through as $${VAR} to the shell at
    # runtime. Without doubling, Flux's postBuild.substituteFrom would replace
    # $${VAR} with empty because these env vars are not in cluster-secrets.
    # (Doubled again here vs. the actual usage below: this is a comment, and
    # Flux's substitution scans the whole rendered text, comments included --
    # a bare $${VAR} in prose is itself a live substitution attempt.)
    # Two inventory entries for the same physical host, each with its OWN
    # keypair: root (bootstrap only - creates/repairs the ansible user) and
    # ansible (everything else, via passwordless sudo). Confirmed live
    # 2026-08-16 these are genuinely separate keys, not one key shared
    # across two accounts - see PROXMOX_ANSIBLE_SSH_KEY in externalsecret.yaml.
    echo "[proxmox_root]" > /tmp/inventory.ini
    echo "proxmox-host-root ansible_host=$${PROXMOX_SSH_HOST} ansible_user=root ansible_ssh_private_key_file=/tmp/ssh-rw/id_rsa ansible_ssh_common_args=\"-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30\"" >> /tmp/inventory.ini
    echo "[proxmox_ansible]" >> /tmp/inventory.ini
    echo "proxmox-host-ansible ansible_host=$${PROXMOX_SSH_HOST} ansible_user=ansible ansible_ssh_private_key_file=/tmp/ssh-rw/ansible_id_rsa ansible_ssh_common_args=\"-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=30\"" >> /tmp/inventory.ini
    echo "Inventory written for host: $${PROXMOX_SSH_HOST}"

    export ANSIBLE_LOCAL_TMP=/tmp/ansible-local
    export ANSIBLE_HOST_KEY_CHECKING=False
    # No ANSIBLE_REMOTE_TMP override: left at Ansible's own per-user default
    # (~/.ansible/tmp). Confirmed live 2026-08-16 that forcing a shared
    # /tmp/.ansible/tmp path broke the ansible-user play - years of root-only
    # runs had left that directory 0700 root-owned, so the unprivileged
    # ansible user couldn't create its own scratch subdirectory inside it
    # ("Failed to create temporary directory"). Root uses /root/.ansible/tmp,
    # ansible uses /home/ansible/.ansible/tmp - separate homes, no collision.

    mkdir -p /tmp/ansible-local

    # Dry run: with ANSIBLE_CHECK=1 in the Job's environment Ansible only
    # reports what it would change (check mode plus diff) and touches nothing.
    # Meant for trying a new CIS wave before letting the nightly run apply it;
    # see docs/apps/proxmox-ansible.md for the one-liner that sets it.
    CHECK_FLAGS=""
    if [ "$${ANSIBLE_CHECK:-0}" = "1" ]; then
      CHECK_FLAGS="--check --diff"
      echo "DRY RUN: ansible-playbook --check --diff, nothing will be changed"
    fi

    # CHECK_FLAGS is deliberately unquoted: it must split into two arguments,
    # or vanish when empty.
    ansible-playbook \
      -i /tmp/inventory.ini \
      /scripts/hardening.yml \
      $${CHECK_FLAGS} \
      -e "allowed_ip=$${ALLOWED_IP}" \
      -e "proxmox_host=$${PROXMOX_SSH_HOST}" \
      -e "ansible_pubkey_env_name=PROXMOX_ANSIBLE_SSH_PUBKEY"

  fix_key.py: |
    import re, sys

    raw = open(sys.argv[1]).read().strip()
    print('raw len:', len(raw), 'newlines:', raw.count('\n'), 'spaces:', raw.count(' '))

    # Restore newlines that 1Password collapses to spaces.
    # Step 1: header + space → header + newline
    fixed = raw.replace('-----BEGIN OPENSSH PRIVATE KEY----- ', '-----BEGIN OPENSSH PRIVATE KEY-----\n')
    # Step 2: space + footer → newline + footer (strip any extra trailing dashes)
    fixed = re.sub(r' -----END OPENSSH PRIVATE KEY-----[-]*', '\n-----END OPENSSH PRIVATE KEY-----', fixed)
    # Step 3: replace spaces ONLY in the base64 middle section.
    # The header and footer themselves contain spaces (e.g. "BEGIN OPENSSH PRIVATE KEY")
    # so we must not run replace(' ','\n') on the whole string.
    parts = fixed.split('\n')
    header = parts[0]
    footer = parts[-1]
    b64    = '\n'.join(parts[1:-1]).replace(' ', '\n')
    fixed  = header + '\n' + b64 + '\n' + footer

    print('fixed lines:', len(fixed.splitlines()))
    print('first line:', fixed.splitlines()[0])
    open(sys.argv[2], 'w').write(fixed + '\n')

  hardening.yml: |-
    ---
    # Two plays, deliberately separate hosts/users:
    #
    #   1. "Ansible User Bootstrap" connects as root and does exactly one
    #      thing: ensure the `ansible` OS user exists, has the right pubkey,
    #      and has passwordless sudo. Nothing else runs as root.
    #   2. "Hardening and Maintenance" connects as `ansible` (via sudo) and
    #      does everything else. If the ansible account is broken or its key
    #      isn't trusted, this play fails loudly (SSH/auth error) instead of
    #      silently falling back to root - that failure IS the connection
    #      check the root play doesn't otherwise perform. Because this is a
    #      daily idempotent job with no persistent state between runs, this
    #      re-verifies the handoff on every single run rather than a one-time
    #      check - stronger than "verify once," since a later regression
    #      (e.g. a manually edited sudoers file) surfaces the next morning.
    - name: Proxmox Host — Ansible User Bootstrap
      hosts: proxmox_root
      become: no
      gather_facts: no

      vars:
        ansible_pubkey: "{{ lookup('env', 'PROXMOX_ANSIBLE_SSH_PUBKEY') }}"

      tasks:
        # ── Ansible OS User ──────────────────────────────────────────────────
        - name: Ensure ansible user exists
          ansible.builtin.user:
            name: ansible
            shell: /bin/bash
            create_home: yes
            state: present

        - name: Ensure .ssh directory for ansible user
          ansible.builtin.file:
            path: /home/ansible/.ssh
            state: directory
            owner: ansible
            group: ansible
            mode: "0700"

        - name: Install SSH public key for ansible user
          ansible.builtin.copy:
            content: "{{ ansible_pubkey }}\n"
            dest: /home/ansible/.ssh/authorized_keys
            owner: ansible
            group: ansible
            mode: "0600"
          when: ansible_pubkey | length > 0

        # This host was always administered as root directly, so sudo was
        # never installed - confirmed live 2026-08-16 ("sudo: not found")
        # once the ansible-user play first tried to use become: yes.
        - name: Ensure sudo is installed
          ansible.builtin.apt:
            name: sudo
            state: present

        - name: Grant ansible user passwordless sudo
          ansible.builtin.copy:
            content: "ansible ALL=(ALL) NOPASSWD: ALL\n"
            dest: /etc/sudoers.d/ansible
            owner: root
            group: root
            mode: "0440"

    - name: Proxmox Host — Hardening and Maintenance
      hosts: proxmox_ansible
      become: yes
      gather_facts: yes

      vars:
        allowed_ip: "{{ allowed_ip }}"
        ftp_password: "{{ lookup('env', 'FTP_SCANNER_PASSWORD') }}"
        wazuh_manager: "192.168.10.111"
        # Must not exceed the manager's version -- an agent newer than its
        # manager is unsupported. Bump together with the image tags in
        # kubernetes/apps/security/wazuh/app/.
        # The manager also pushes WPK upgrades to agents, so the installed
        # version can move ahead of this pin; with a stale pin the apt task
        # below tries a downgrade and fails the whole play (2026-09-27: agent
        # was already 4.14.8-1 while this still said 4.14.7-1).
        wazuh_agent_version: "4.14.8-1"
        wazuh_authd_pass: "{{ lookup('env', 'WAZUH_AUTHD_PASS') }}"
        # Wazuh names an agent after the host's SHORT hostname, so this machine
        # would appear as bare "proxmox" next to the firewall's
        # "secsrv.${SECRET_DOMAIN}". Overridden at enrollment only -- the PVE node
        # name itself stays "proxmox", because renaming a Proxmox node rewrites
        # /etc/pve/nodes/<name> and every guest, storage and replication entry
        # beneath it. Editing /etc/hosts would not help either: the agent reads
        # the kernel hostname, not the resolver's idea of the FQDN.
        wazuh_agent_name: "proxmox.${SECRET_DOMAIN}"

      tasks:

        # ── System Package Updates ───────────────────────────────────────────
        - name: Refresh apt package cache
          ansible.builtin.apt:
            update_cache: yes
            cache_valid_time: 3600

        # check_mode: false on the read-only command tasks in this play: in a
        # dry run (ANSIBLE_CHECK=1) Ansible would otherwise skip them, leave the
        # registered variable without stdout, and fail the task that reads it.
        - name: List available upgrades
          ansible.builtin.shell: apt list --upgradable 2>/dev/null
          register: upgradable
          changed_when: false
          check_mode: false

        - name: Report available upgrades
          ansible.builtin.debug:
            msg: "{{ upgradable.stdout_lines }}"

        - name: Apply security and safe upgrades
          ansible.builtin.apt:
            upgrade: safe
          register: upgrade_result

        - name: Remove obsolete packages
          ansible.builtin.apt:
            autoremove: yes
            autoclean: yes

        # ── fail2ban ─────────────────────────────────────────────────────────
        - name: Install fail2ban
          ansible.builtin.apt:
            name: fail2ban
            state: present

        # Send fail2ban's own activity (bans/unbans/detections) to syslog, which
        # rsyslog writes into /var/log/syslog -- one of the files the Wazuh agent
        # tails. Left at its default, fail2ban only writes /var/log/fail2ban.log,
        # which is not in the agent's localfile list and would go unseen.
        - name: Deploy fail2ban.local (log to syslog)
          ansible.builtin.copy:
            dest: /etc/fail2ban/fail2ban.local
            owner: root
            group: root
            mode: "0644"
            content: |
              [Definition]
              logtarget = SYSLOG
              syslogsocket = /dev/log
          notify: Restart fail2ban

        - name: Deploy fail2ban jail.local
          ansible.builtin.copy:
            dest: /etc/fail2ban/jail.local
            owner: root
            group: root
            mode: "0644"
            content: |
              [DEFAULT]
              # Never ban: localhost, the admin IP, and the OPNsense peer on
              # vmbr0 (192.168.100.1, the DNAT target below). This playbook's
              # Job logs in over SSH from that peer, so banning it after a few
              # failed logins would lock the Job out.
              ignoreip = 127.0.0.1/8 ::1 {{ allowed_ip }} 192.168.100.1
              bantime  = 3600
              findtime = 600
              maxretry = 5

              [sshd]
              enabled  = true
              port     = ssh
              filter   = sshd
              logpath  = /var/log/auth.log
              maxretry = 4
              bantime  = 7200

              # Reads the journal, not /var/log/daemon.log: Debian 13's stock
              # rsyslog.conf has no daemon.* rule, so that file stays empty and
              # a jail reading it never sees a failure. Only the unit that logs
              # the login failures is read. PVE writes the client as an
              # IPv4-mapped IPv6 address (::ffff:a.b.c.d); fail2ban turns it
              # into a.b.c.d. The ban covers port 8006 only, SSH is untouched.
              [proxmox]
              enabled  = true
              port     = 8006
              filter   = proxmox
              backend  = systemd
              journalmatch = _SYSTEMD_UNIT=pvedaemon.service
              maxretry = 3
              bantime  = 86400

              [vsftpd]
              enabled  = true
              port     = ftp,ftp-data,21100:21110
              filter   = vsftpd
              logpath  = /var/log/vsftpd.log
              maxretry = 4
              bantime  = 7200
          notify: Restart fail2ban

        - name: Deploy fail2ban Proxmox filter
          ansible.builtin.copy:
            dest: /etc/fail2ban/filter.d/proxmox.conf
            owner: root
            group: root
            mode: "0644"
            content: |
              [Definition]
              failregex = pvedaemon\[.*authentication failure; rhost=<HOST> user=.* msg=.*
              ignoreregex =
          notify: Restart fail2ban

        - name: Enable and start fail2ban
          ansible.builtin.service:
            name: fail2ban
            enabled: yes
            state: started

        # ── Proxmox Host Firewall — disabled ──────────────────────────────────
        # PVE firewall caused a full lockout when allowed_ip was stale.
        # Protection is provided by: iptables rules in /etc/network/interfaces
        # (ports 22+8006 excluded from DNAT, WAN DROP), fail2ban, and OPNsense.
        - name: Retrieve node hostname
          ansible.builtin.command: hostname -s
          register: pve_node
          changed_when: false
          check_mode: false

        - name: Disable cluster-level PVE firewall
          ansible.builtin.shell: >-
            printf '[OPTIONS]\nenable: 0\n'
            > /etc/pve/firewall/cluster.fw
          args:
            executable: /bin/bash

        - name: Disable node-level PVE firewall
          ansible.builtin.shell: >-
            printf '[OPTIONS]\nenable: 0\n'
            > /etc/pve/firewall/{{ pve_node.stdout }}.fw
          args:
            executable: /bin/bash
          notify: Stop pve-firewall

        # ── /etc/network/interfaces — Validation & Safeguards ─────────────────
        # Validates and corrects network configuration without touching structure.
        # PVE firewall stays DISABLED - protection via iptables, fail2ban, OPNsense.

        # Ensure DNAT target is correct (fix typos like 192.10.100.1)
        - name: Enforce correct DNAT target in /etc/network/interfaces
          ansible.builtin.replace:
            path: /etc/network/interfaces
            regexp: '-j DNAT --to 192\.\d+\.100\.1'
            replace: '-j DNAT --to 192.168.100.1'

        # Ensure post-down uses -D (delete) not -A (append)
        - name: Fix post-down iptables rules (must use -D not -A to delete)
          ansible.builtin.replace:
            path: /etc/network/interfaces
            regexp: 'post-down iptables -t nat -A'
            replace: 'post-down iptables -t nat -D'

        # Ensure TCP DNAT excludes ports 22 and 8006 (SSH + Proxmox UI)
        - name: Ensure TCP DNAT excludes management ports (22, 8006)
          ansible.builtin.lineinfile:
            path: /etc/network/interfaces
            regexp: 'post-up iptables -t nat -A PREROUTING -i enp5s0 -p tcp.*-j DNAT'
            line: "        post-up iptables -t nat -A PREROUTING -i enp5s0 -p tcp -m multiport ! --dport 22,8006 -j DNAT --to 192.168.100.1"
            backrefs: yes

        # Ensure UDP DNAT is configured
        - name: Ensure UDP DNAT forwards to OPNsense
          ansible.builtin.lineinfile:
            path: /etc/network/interfaces
            regexp: 'post-up iptables -t nat -A PREROUTING -i enp5s0 -p udp -j DNAT'
            line: "        post-up iptables -t nat -A PREROUTING -i enp5s0 -p udp -j DNAT --to 192.168.100.1"
            backrefs: yes

        # Ensure NFS ports are blocked on WAN interface
        - name: Ensure NFS TCP ports blocked on WAN
          ansible.builtin.lineinfile:
            path: /etc/network/interfaces
            regexp: 'post-up iptables -A INPUT -i enp5s0 -p tcp.*111,2049'
            line: "        post-up iptables -A INPUT -i enp5s0 -p tcp -m multiport --dports 111,2049,20048,20049,20050 -j DROP"
            backrefs: yes

        # Ensure MASQUERADE for OPNsense WAN
        - name: Ensure MASQUERADE configured for vmbr0
          ansible.builtin.lineinfile:
            path: /etc/network/interfaces
            regexp: "post-up iptables -t nat -A POSTROUTING -s '192.168.100.1/31'"
            line: "        post-up iptables -t nat -A POSTROUTING -s '192.168.100.1/31' -o enp5s0 -j MASQUERADE"
            backrefs: yes

        # Ensure LAN route to 192.168.200.0/24 via OPNsense
        - name: Ensure LAN route via OPNsense (vmbr1)
          ansible.builtin.lineinfile:
            path: /etc/network/interfaces
            regexp: 'post-up ip route add 192.168.200.0/24 via'
            line: "        post-up ip route add 192.168.200.0/24 via 192.168.10.1"
            backrefs: yes

        # Route for the Brother scanner's subnet (reaches Proxmox via S2S WireGuard
        # terminating on OPNsense). This only fixes return routing on the Proxmox
        # side - OPNsense/WireGuard still need their own rule permitting
        # 192.168.40.0/24 to reach this host; that's outside this playbook.
        # NOTE: post-up rules only apply on `ifreload -a` / reboot, not immediately.
        #
        # NOTE: the "192.168.200.0/24 via 192.168.10.1" line referenced by the
        # task above does not actually exist on this host (that task only ever
        # ran in no-op "fix if present" mode) - anchoring on it here previously
        # caused this line to be appended past `source /etc/network/interfaces.d/*`,
        # outside any iface block, which ifupdown2 refuses to parse. Anchor on
        # the vmbr1 stanza's own address line instead, which is guaranteed present.
        - name: Ensure LAN route to scanner network (192.168.40.0/24) via OPNsense
          ansible.builtin.lineinfile:
            path: /etc/network/interfaces
            regexp: 'post-up ip route add 192\.168\.40\.0/24 via'
            line: "        post-up ip route add 192.168.40.0/24 via 192.168.10.1"
            insertafter: '^\s*address 192\.168\.10\.0/24$'
            state: present

        # Validate sysctl forwarding is enabled
        - name: Validate IPv4 forwarding sysctl in interfaces
          ansible.builtin.lineinfile:
            path: /etc/network/interfaces
            regexp: 'post-up sysctl -w net.ipv4.ip_forward'
            line: "        post-up sysctl -w net.ipv4.ip_forward=1"
            backrefs: yes

        - name: Validate IPv6 forwarding sysctl in interfaces
          ansible.builtin.lineinfile:
            path: /etc/network/interfaces
            regexp: 'post-up sysctl -w net.ipv6.conf.all.forwarding'
            line: "        post-up sysctl -w net.ipv6.conf.all.forwarding=1"
            backrefs: yes

        # Report current network configuration
        - name: Show current /etc/network/interfaces (for audit)
          ansible.builtin.shell: grep -E '(post-up|post-down|address|gateway|route)' /etc/network/interfaces
          register: network_config
          changed_when: false
          check_mode: false

        - name: Report network configuration
          ansible.builtin.debug:
            msg: "{{ network_config.stdout_lines }}"

        # ── SSH Hardening (CIS Debian 13 / Trixie) ───────────────────────────
        - name: Deploy hardened sshd_config (CIS Benchmark Debian 13)
          ansible.builtin.copy:
            dest: /etc/ssh/sshd_config
            owner: root
            group: root
            mode: "0600"
            validate: "/usr/sbin/sshd -t -f %s"
            content: |
              # sshd_config — CIS Debian 13 hardened
              # Managed by Ansible. Do not edit manually.

              Port 22
              AddressFamily inet
              ListenAddress 0.0.0.0

              HostKey /etc/ssh/ssh_host_rsa_key
              HostKey /etc/ssh/ssh_host_ecdsa_key
              HostKey /etc/ssh/ssh_host_ed25519_key

              # ── Authentication ──────────────────────────────────────────────
              # CIS 5.2.10: prohibit-password keeps key-based root access for
              # the Ansible CronJob's bootstrap play only (creating/repairing
              # the ansible user) - all other automation connects as ansible
              # via sudo. Prevents password-based root logins either way.
              PermitRootLogin prohibit-password
              AuthenticationMethods publickey
              PubkeyAuthentication yes
              PasswordAuthentication no
              PermitEmptyPasswords no
              ChallengeResponseAuthentication no
              KerberosAuthentication no
              GSSAPIAuthentication no
              UsePAM yes

              # CIS 5.2.7
              MaxAuthTries 4
              # CIS 5.2.8
              IgnoreRhosts yes
              # CIS 5.2.9
              HostbasedAuthentication no
              # CIS 5.2.12
              PermitUserEnvironment no

              # ── Forwarding / Tunnelling ─────────────────────────────────────
              # CIS 5.2.6
              X11Forwarding no
              # CIS 5.2.16
              AllowTcpForwarding no
              AllowAgentForwarding no
              AllowStreamLocalForwarding no
              # Wazuh SCA 5.1.8 (CIS 5.1.8). Functionally a no-op here: the four
              # directives above already deny X11, agent, TCP and StreamLocal
              # forwarding. DisableForwarding overrides all of them in one place,
              # which is what the benchmark asks for and what a later Match
              # block could not quietly reopen.
              DisableForwarding yes

              # ── Logging ─────────────────────────────────────────────────────
              # CIS 5.2.5
              SyslogFacility AUTH
              LogLevel VERBOSE

              # ── Session limits ───────────────────────────────────────────────
              # CIS 5.2.21
              LoginGraceTime 60
              # CIS 5.2.22
              ClientAliveInterval 300
              ClientAliveCountMax 3
              # CIS 5.2.19
              MaxStartups 10:30:60
              # CIS 5.2.20
              MaxSessions 10

              # ── Crypto — CIS 5.2.13/5.2.14/5.2.15 ──────────────────────────
              MACs hmac-sha2-256,hmac-sha2-512,hmac-sha2-256-etm@openssh.com,hmac-sha2-512-etm@openssh.com
              Ciphers aes128-ctr,aes192-ctr,aes256-ctr,aes128-gcm@openssh.com,aes256-gcm@openssh.com,chacha20-poly1305@openssh.com
              KexAlgorithms curve25519-sha256,curve25519-sha256@libssh.org,ecdh-sha2-nistp256,ecdh-sha2-nistp384,ecdh-sha2-nistp521,diffie-hellman-group14-sha256,diffie-hellman-group16-sha512,diffie-hellman-group18-sha512

              # ── Banner — CIS 5.2.17 ──────────────────────────────────────────
              Banner /etc/ssh/issue.net
              PrintMotd no
              PrintLastLog yes

              # ── Misc hardening ───────────────────────────────────────────────
              StrictModes yes
              Compression no
              TCPKeepAlive no
              UseDNS no

              AcceptEnv LANG LC_*
              Subsystem sftp /usr/lib/openssh/sftp-server

              # CIS wave 3 (cis_wave3_ssh.yml) keeps the AllowUsers list in this
              # one file. Named by its full path on purpose, not a glob: no file
              # that merely lands in the directory is ever picked up. sshd and
              # sshd -t accept an Include of a file that does not exist.
              Include /etc/ssh/sshd_config.d/10-cis-allowusers.conf
          notify: Restart sshd

        - name: Deploy SSH warning banner (CIS 5.2.17)
          ansible.builtin.copy:
            dest: /etc/ssh/issue.net
            owner: root
            group: root
            mode: "0644"
            content: |
              *******************************************************************************
              * This system is for authorized use only. All activities are monitored and   *
              * logged. Unauthorized access will be prosecuted.                            *
              *******************************************************************************

        - name: Set strict permissions on sshd_config (CIS 5.2.1)
          ansible.builtin.file:
            path: /etc/ssh/sshd_config
            owner: root
            group: root
            mode: "0600"

        # ── Local syslog ─────────────────────────────────────────────────────
        # rsyslog stays installed and running, but no longer forwards anywhere.
        # Proxmox defaults to systemd-journald; rsyslog is what writes the plain
        # files /var/log/syslog and /var/log/auth.log, and those are exactly what
        # the Wazuh agent tails. Removing the package would leave the agent with
        # nothing to read.
        - name: Install rsyslog (writes the files the Wazuh agent reads)
          ansible.builtin.apt:
            name: rsyslog
            state: present

        # Superseded by the Wazuh agent above, which ships the same events over
        # an authenticated, encrypted channel and gets them decoded into alerts
        # instead of dumped as text. Keeping both meant every sshd and fail2ban
        # line was counted twice -- once as an agent event, once as syslog.
        - name: Remove the Fluent-Bit syslog forwarder
          ansible.builtin.file:
            path: /etc/rsyslog.d/90-fluentbit.conf
            state: absent
          notify: Restart rsyslog

        - name: Ensure rsyslog is enabled and running
          ansible.builtin.service:
            name: rsyslog
            enabled: yes
            state: started

        # ── FTP for Brother scanner → Paperless consume share ────────────────
        # Consume dir is served over NFS to Kubernetes/Paperless (USERMAP_UID/GID
        # 3000) at /rpool/k8s-rwx/paperless-consume. The FTP-uploading local user
        # is created with the identical uid/gid so files land with the exact same
        # ownership Paperless already expects - no all_squash/anonuid needed.
        - name: Determine Proxmox host LAN IP (vmbr1, 192.168.10.0/24)
          ansible.builtin.set_fact:
            ftp_lan_ip: "{{ ansible_facts.all_ipv4_addresses | select('match', '^192\\.168\\.10\\.') | list | first }}"

        - name: Assert LAN IP was found for vsftpd binding
          ansible.builtin.assert:
            that:
              - ftp_lan_ip is defined
              - ftp_lan_ip | length > 0
            fail_msg: "Could not determine this host's 192.168.10.0/24 (vmbr1) address from gathered facts - refusing to guess a bind address for vsftpd."

        - name: Install vsftpd
          ansible.builtin.apt:
            name: vsftpd
            state: present

        - name: Ensure scanner group exists (gid matches Paperless USERMAP_GID)
          ansible.builtin.group:
            name: scanner
            gid: 3000
            state: present

        - name: Ensure scanner FTP user exists (uid matches Paperless USERMAP_UID)
          ansible.builtin.user:
            name: scanner
            uid: 3000
            group: scanner
            shell: /usr/sbin/nologin
            home: /rpool/k8s-rwx/paperless-consume
            create_home: no
            state: present

        # vsftpd's PAM stack uses pam_shells, which rejects login for any user
        # whose shell isn't listed in /etc/shells - /usr/sbin/nologin isn't
        # there by default. Adding it here only satisfies that check; the
        # nologin binary itself still refuses any actual interactive session
        # (e.g. via SSH), so this doesn't weaken anything.
        - name: Allow nologin shell to pass vsftpd's pam_shells check
          ansible.builtin.lineinfile:
            path: /etc/shells
            line: /usr/sbin/nologin
            state: present

        - name: Set scanner FTP password
          ansible.builtin.shell: "echo 'scanner:{{ ftp_password }}' | chpasswd"
          no_log: true
          when: ftp_password | length > 0
          changed_when: true

        - name: Ensure Paperless consume directory ownership matches Kubernetes side
          ansible.builtin.file:
            path: /rpool/k8s-rwx/paperless-consume
            state: directory
            owner: 3000
            group: 3000
            mode: "0770"

        - name: Deploy vsftpd userlist (allow-list of FTP users)
          ansible.builtin.copy:
            dest: /etc/vsftpd.userlist
            owner: root
            group: root
            mode: "0600"
            content: |
              scanner

        - name: Deploy vsftpd.conf
          ansible.builtin.copy:
            dest: /etc/vsftpd.conf
            owner: root
            group: root
            mode: "0600"
            content: |
              # vsftpd.conf — Brother scanner upload into Paperless consume share
              # Managed by Ansible. Do not edit manually.

              listen=YES
              listen_ipv6=NO
              listen_address={{ ftp_lan_ip }}
              anonymous_enable=NO
              local_enable=YES
              write_enable=YES

              # Only the scanner account may log in.
              userlist_enable=YES
              userlist_file=/etc/vsftpd.userlist
              userlist_deny=NO

              chroot_local_user=YES
              # local_root must be writable by the chrooted user (files land directly
              # in the Paperless consume share) - accepted trade-off for a single
              # trusted device reachable only from its own isolated /24 via S2S WG.
              allow_writeable_chroot=YES
              local_root=/rpool/k8s-rwx/paperless-consume
              local_umask=002
              file_open_mode=0660

              pasv_enable=YES
              pasv_address={{ ftp_lan_ip }}
              pasv_min_port=21100
              pasv_max_port=21110

              max_clients=5
              max_per_ip=2

              xferlog_enable=YES
              dual_log_enable=YES
              vsftpd_log_file=/var/log/vsftpd.log

              session_support=NO
          notify: Restart vsftpd

        - name: Enable and start vsftpd
          ansible.builtin.service:
            name: vsftpd
            enabled: yes
            state: started

        # ── Wazuh Agent ─────────────────────────────────────────────────────
        # Reports this host to the in-cluster Wazuh manager (see
        # kubernetes/apps/security/wazuh/): file integrity monitoring,
        # rootcheck, software inventory and vulnerability detection. Only the
        # install and enrollment live here; what the agent monitors beyond its
        # packaged defaults is pushed centrally from the manager's agent.conf
        # (kubernetes/apps/security/wazuh/app/configmap-manager-ruleset.yaml).
        #
        # Network path: Proxmox reaches the K8s LAN (192.168.10.0/24, and with it
        # the Wazuh VIP .111 and the NFS server) directly via vmbr1, which already
        # carries the host's own address in that subnet - no route via
        # OPNsense/vmbr0 is needed or wanted. A previous version of this playbook
        # forced a `post-up ip route add 192.168.10.0/24 via 192.168.100.1` on
        # vmbr0, which raced the kernel's own connected vmbr1 route and, after a
        # Proxmox reboot, won - blackholing all host-to-K8s traffic, NFS included.
        # Do not re-add that route.
        - name: Fetch the Wazuh signing key
          ansible.builtin.get_url:
            url: https://packages.wazuh.com/key/GPG-KEY-WAZUH
            dest: /usr/share/keyrings/wazuh.gpg.key
            mode: "0644"

        - name: Convert the Wazuh key into a keyring
          ansible.builtin.command:
            cmd: >-
              gpg --batch --yes --dearmor
              -o /usr/share/keyrings/wazuh.gpg
              /usr/share/keyrings/wazuh.gpg.key
            creates: /usr/share/keyrings/wazuh.gpg

        - name: Add the Wazuh apt repository
          ansible.builtin.apt_repository:
            repo: >-
              deb [signed-by=/usr/share/keyrings/wazuh.gpg]
              https://packages.wazuh.com/4.x/apt/ stable main
            filename: wazuh
            state: present
            update_cache: yes

        - name: Install the Wazuh agent
          ansible.builtin.apt:
            name: "wazuh-agent={{ wazuh_agent_version }}"
            state: present
          notify: Restart wazuh-agent

        # This play also runs "Apply security and safe upgrades" further up.
        # Without a hold, that would eventually pull the agent past the
        # manager's version and break the pairing.
        - name: Hold the agent at the manager's version
          ansible.builtin.dpkg_selections:
            name: wazuh-agent
            selection: hold

        - name: Point the agent at the manager
          ansible.builtin.replace:
            path: /var/ossec/etc/ossec.conf
            regexp: '<address>[^<]*</address>'
            replace: "<address>{{ wazuh_manager }}</address>"
          notify: Restart wazuh-agent

        # Wazuh 4.x auto-enrolls on first start and uses this file when it is
        # present. agent-auth below picks it up from the same path, so the
        # password never has to appear on a command line where `ps` would show it.
        - name: Install the enrollment password
          ansible.builtin.copy:
            content: "{{ wazuh_authd_pass }}"
            dest: /var/ossec/etc/authd.pass
            owner: root
            group: wazuh
            mode: "0640"
          no_log: true
          notify: Restart wazuh-agent

        # Auto-enrollment would register the short hostname, so register
        # explicitly instead -- but only when the name on record actually
        # differs, otherwise every nightly run would re-key and restart the
        # agent. client.keys holds a single line: "<id> <name> <ip> <key>".
        # This also self-heals: if the manager ever loses the key and the agent
        # re-enrolls itself as "proxmox", the next run puts the name back.
        - name: Read the name the agent is registered under
          ansible.builtin.slurp:
            src: /var/ossec/etc/client.keys
          register: wazuh_client_keys
          failed_when: false

        - name: Register the agent under its fully-qualified name
          ansible.builtin.command:
            cmd: >-
              /var/ossec/bin/agent-auth
              -m {{ wazuh_manager }}
              -A {{ wazuh_agent_name }}
          when: >-
            ((wazuh_client_keys.content | default('') | b64decode).split() + ['', ''])[1]
            != wazuh_agent_name
          notify: Restart wazuh-agent

        - name: Enable and start the Wazuh agent
          ansible.builtin.service:
            name: wazuh-agent
            enabled: yes
            state: started

        # ── auditd ──────────────────────────────────────────────────────────
        # Command-level visibility for the Wazuh agent: who ran what as whom.
        # The agent reads /var/log/audit/audit.log through the central
        # agent.conf (kubernetes/apps/security/wazuh/app/configmap-manager-ruleset.yaml),
        # and the manager's audit-keys list maps the -k keys below onto Wazuh's
        # audit rules (80700+): audit-wazuh-c = command, -w = write.
        - name: Install auditd
          ansible.builtin.apt:
            name: auditd
            state: present

        - name: Deploy the Wazuh audit rules
          ansible.builtin.copy:
            dest: /etc/audit/rules.d/60-wazuh.rules
            owner: root
            group: root
            mode: "0640"
            content: |
              ## Managed by k8s-ops (proxmox-ansible). Loaded by augenrules.
              ##
              ## Commands from login sessions only. auid is "unset" for daemons,
              ## which keeps pvestatd, pvedaemon & co. out -- they exec root
              ## helpers (zfs, lvs, qm) thousands of times an hour. SSH, console
              ## and the nightly Ansible run (auid=ansible) are all captured.
              -a always,exit -F arch=b64 -S execve -F auid!=unset -k audit-wazuh-c
              -a always,exit -F arch=b32 -S execve -F auid!=unset -k audit-wazuh-c

              ## Writes to credentials and access control.
              -w /root/.ssh/ -p wa -k audit-wazuh-w
              -w /home/ansible/.ssh/ -p wa -k audit-wazuh-w
              -w /etc/ssh/sshd_config -p wa -k audit-wazuh-w
              -w /etc/ssh/sshd_config.d/ -p wa -k audit-wazuh-w
              -w /etc/sudoers -p wa -k audit-wazuh-w
              -w /etc/sudoers.d/ -p wa -k audit-wazuh-w
              -w /etc/passwd -p wa -k audit-wazuh-w
              -w /etc/shadow -p wa -k audit-wazuh-w
              -w /etc/group -p wa -k audit-wazuh-w
          notify: Load audit rules

        # Debian 13's auditd 4.x defaults to ENRICHED, which appends
        # \x1d-separated resolved names (OUID="root" ...) to each record.
        # Wazuh documents RAW for its audit log_format; a logtest of an
        # ENRICHED PATH record lost the file name (live decoding coped in
        # the 2026-09-27 test, but that is not something to rely on).
        - name: Write audit records in RAW format
          ansible.builtin.lineinfile:
            path: /etc/audit/auditd.conf
            regexp: '^log_format\s*='
            line: "log_format = RAW"
          notify: Reload auditd config

        - name: Enable and start auditd
          ansible.builtin.service:
            name: auditd
            enabled: yes
            state: started

      handlers:
        - name: Restart wazuh-agent
          ansible.builtin.service:
            name: wazuh-agent
            state: restarted

        - name: Restart fail2ban
          ansible.builtin.service:
            name: fail2ban
            state: restarted

        # Validate first, then restart whichever unit actually owns port 22.
        # Debian 13 can run sshd socket-activated (ssh.socket) instead of as a
        # long-lived ssh.service, and a plain restart of the wrong one either
        # fails or leaves the new config unread. Taken from the
        # ansible-debian-cis role, where this bit sap-netbird-router on
        # 2026-09-23. A failed `sshd -t` stops the run with the daemon
        # untouched; established sessions survive either path.
        - name: Restart sshd
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              /usr/sbin/sshd -t
              if systemctl is-active --quiet ssh.service; then
                systemctl restart ssh.service
              elif systemctl is-active --quiet ssh.socket; then
                systemctl restart ssh.socket
              else
                systemctl start ssh.service
              fi
            executable: /bin/bash
          changed_when: true

        - name: Stop pve-firewall
          ansible.builtin.service:
            name: pve-firewall
            state: stopped
            enabled: false

        - name: Restart rsyslog
          ansible.builtin.service:
            name: rsyslog
            state: restarted

        # augenrules merges rules.d/ into audit.rules and loads it; restarting
        # auditd through systemd is refused (RefuseManualStop=yes).
        - name: Load audit rules
          ansible.builtin.command: augenrules --load

        # SIGHUP: auditd re-reads auditd.conf in place (restart is refused).
        - name: Reload auditd config
          ansible.builtin.command: auditctl --signal reload

        - name: Restart vsftpd
          ansible.builtin.service:
            name: vsftpd
            state: restarted

    # CIS Debian 13 hardening, applied in waves, lives in its own playbook. It
    # runs after the plays above and only if they succeeded, so a problem in a
    # wave can never stop the maintenance that has been running nightly.
    - ansible.builtin.import_playbook: cis.yml

  cis.yml: |-
    ---
    # CIS Debian 13 (Trixie) hardening for the Proxmox host, applied in waves.
    # Imported at the end of hardening.yml.
    #
    # Where the controls come from: the ansible-debian-cis role (roles/cis_debian13,
    # in the Nextcloud "Repos" folder) is the reference for what each control does.
    # It is NOT run against this host: this is a hypervisor, and several of the
    # role's remediations would break it (host firewall, NFS/FTP removal, the
    # sshd drop-in that this host's own sshd_config would ignore, wholesale PAM
    # rewrites). Each wave is a hand-picked subset, ported to fit Proxmox, and
    # checked against the wording of the Wazuh SCA policy cis_debian13, because
    # Wazuh SCA, not this playbook, is what scores the result. It is the
    # feedback loop for every wave: look at the agent's SCA results after the
    # next scan, do not trust "ok" here.
    #
    # Waves (remove a number from cis_waves to switch that wave off):
    #   1  file permissions, banners, telnet removal, sudo logging, su restriction
    #      - touches none of authentication, SSH, PAM or the network
    #   2  AppArmor utilities (1.3.1.1); auditd: audispd-plugins, the CIS rules,
    #      explicit log rotation; time servers (chrony, same as the Talos nodes)
    #      AIDE on the paths that matter, nightly and bounded (6.3.1, 6.3.2);
    #      it runs last of all, after the PAM change
    #   3  SSH AllowUsers (5.1.4); PAM: faillock, pwhistory, no nullok,
    #      libpam-pwquality (5.3.1.3, 5.3.2.2, 5.3.2.4, 5.3.3.4.1, 5.3.3.4.4)
    #
    # Control numbers in comments are those of the Wazuh policy. The CIS numbers
    # in the ansible-debian-cis role differ in places (e.g. PermitRootLogin).
    - name: Proxmox Host — CIS Debian 13 Hardening
      hosts: proxmox_ansible
      become: yes
      gather_facts: yes

      vars:
        cis_waves: [1, 2, 3]

        # The account the nightly run connects as. The new CIS audit rules that
        # log file access, deletions, permission changes and mounts leave its
        # sessions out (decided 2026-10-11): a play that touches hundreds of
        # files every night would otherwise drown them. What it runs is still
        # logged: the execve rule in hardening.yml (key audit-wazuh-c) has no
        # such exception, and that is what stands in for sudo NOPASSWD.
        cis_automation_user: ansible

        # The new CIS audit rules (/etc/audit/rules.d/70-cis.rules and
        # 71-cis.+.rules): `present` writes and loads them, `absent` removes
        # both files and reloads. The
        # volume they cause on this host has not been measured; the report at
        # the end of cis_wave2_audit.yml prints events per key after each run.
        # If it is too much, `absent` here, merge, and the next run (nightly or a
        # manual Job) takes them out again without anyone touching the host.
        # 60-wazuh.rules (hardening.yml) is not affected either way.
        cis_audit_rules_state: present
        cis_audit_keys:
          - scope
          - sudo_log_file
          - time-change
          - system-locale
          - access
          - identity
          - perm_mod
          - mounts
          - session
          - logins
          - delete
          - kernel_modules

        # A dedicated human admin next to root (bootstrap only) and ansible
        # (automation): key-only SSH, member of the sudo group. Nothing happens
        # until at least one public key is listed here. Public keys are not
        # secret, so they live in Git rather than in 1Password.
        #
        # The password is deliberately NOT managed here. The account is created
        # locked; set it once by hand (`passwd phiros-cmd` as root), after which
        # sudo works with that password. Login itself never uses it - sshd only
        # accepts keys. That keeps CIS 5.2.4 (sudo must ask for a password)
        # true for a human, with no hash in Git or 1Password.
        cis_admin_user: phiros-cmd
        cis_admin_ssh_pubkeys:
          # cypr0's own key (~/.ssh/id_ed25519_cypr0 on the admin Mac), ED25519,
          # fingerprint SHA256:iw1v8EdDCpznuAFmlTfjBIuzUiLi7U7PyImao7ni60E.
          # The trailing "cypr0" is only a label for authorized_keys.
          - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILYRsPt1fwbOyxdlFb3Owe0qscK3UIbCuBhcEsy6gqSi cypr0"

        # Time: the same two servers as the Talos nodes (their NTP controller
        # uses machine.time.servers from talos/patches/global/machine-time.yaml,
        # which is also cluster.toml ntp_servers), not the Debian pool. `present`
        # switches chrony over once both servers have answered, `absent` brings
        # the stock sources back. See cis_wave2_time.yml for the order of steps
        # and the rollback.
        cis_time_state: present
        cis_time_servers:
          - 162.159.200.1
          - 162.159.200.123
        cis_time_sources_file: 10-cloudflare.sources
        cis_time_marker: "# disabled by proxmox-ansible: "
        cis_time_probe_retries: 12
        cis_time_sync_retries: 12
        cis_time_probe_delay: 5

        # SSH access list (Wazuh SCA 5.1.4 wants an AllowUsers line in sshd -T).
        # root and ansible must be on it: the nightly run connects as both,
        # and the play refuses any list without them. The admin account joins
        # when it is created at all. The scanner account is FTP only and stays
        # off. `present` writes the drop-in, `absent` removes it (access is
        # then restricted by nothing but the keys). The order of steps, the
        # probe and the rollback are in cis_wave3_ssh.yml.
        cis_ssh_access_state: present
        cis_ssh_allow_users: "{{ ['root', 'ansible'] + ([cis_admin_user] if cis_admin_ssh_pubkeys | length > 0 else []) }}"
        cis_ssh_dropin: /etc/ssh/sshd_config.d/10-cis-allowusers.conf

        # PAM: pam_faillock, pam_pwhistory, pam_unix without nullok, libpam-pwquality.
        # `present` applies it behind a snapshot and a restore timer, `absent` takes
        # it out again (back to the packaged unix profile; the pwquality package
        # stays installed). The reasons for every number are in cis_wave3_pam.yml.
        # The FTP account's password comes from the Job's environment, as in
        # hardening.yml; it is only used to check that the account can still log in.
        cis_pam_state: present
        cis_pam_deny: 5
        cis_pam_unlock_time: 900
        cis_pam_remember: 24
        cis_pam_guard_seconds: 900
        cis_pam_ftp_password: "{{ lookup('env', 'FTP_SCANNER_PASSWORD') }}"
        # The packages apt adds for libpam-pwquality WITH its recommends in a clean
        # Debian 13 container (measured 2026-10-17, apt-get --simulate). Anything
        # outside this list stops the run; a package of it that the host already has
        # simply does not show up as new.
        cis_pam_pwquality_packages:
          - cracklib-runtime
          - file
          - libcrack2
          - libmagic-mgc
          - libmagic1t64
          - libpam-pwquality
          - libpwquality-common
          - libpwquality1
          - wamerican

        # AIDE (Wazuh SCA 6.3.1, 6.3.2): the packaged nightly check on a short list
        # of paths (aide-cis.conf), niced, with idle IO, a memory ceiling and a
        # time limit. `present` installs, configures and builds the baseline,
        # `absent` takes the timer, the drop-ins and the configuration out again
        # (the packages stay). The reasons for every choice are in
        # cis_wave2_aide.yml.
        cis_aide_state: present
        cis_aide_packages:
          - aide
          - aide-common
        # What apt adds for these in a clean Debian 13 container without
        # recommends (measured 2026-10-17, apt-get --simulate); on this host only
        # the first two. Anything outside this list stops the run.
        cis_aide_pkg_allowed:
          - aide
          - aide-common
          - libext2fs2t64
          - liblockfile-bin
          - liblockfile1
        cis_aide_timer_time: "02:30:00"
        cis_aide_timer_delay: 900
        cis_aide_memory_high: 256M
        cis_aide_memory_max: 512M
        cis_aide_timeout: 3600

        # RPC/NFS ports (rpcbind 111, nfsd 2049, mountd 20048, statd 20049,
        # 20050) and the SPICE proxy (3128) reachable from the internal
        # networks only. Nothing here uses SPICE (confirmed by the owner
        # 2026-10-11); like the RPC ports it listens on every address, IPv6
        # included, and over IPv4 only the DNAT to OPNsense hides it.
        # Measured on the host on 2026-10-11: over IPv4 the DNAT plus an INPUT
        # drop on the uplink already keep the RPC ports off the internet, but
        # IPv6 is active (global address and gateway on the uplink), the
        # services listen on [::] and ip6tables INPUT had no rule at all.
        # Allowed sources: the LAN
        # where the cluster's NFS clients live and the two WireGuard networks.
        # Those networks are not written down here: they come from the key
        # SECRET_RPC_ALLOWED_NETS in kubernetes/components/sops/
        # cluster-secrets.sops.yaml (comma-separated IPv4 CIDRs), reach the Job
        # as the environment variable RPC_ALLOWED_NETS (cronjob.yaml) and are
        # read here. IPv6 has no internal clients, so only loopback and
        # link-local are allowed there; those two are protocol constants, not
        # site addresses. cis_rpc_lockdown.py refuses public networks and the
        # management ports 22 and 8006.
        #
        # The switch, controlled from Git: `present` installs and keeps the
        # lockdown; `absent` takes the rules, the boot unit, the script and the
        # configuration out again. Change it here, merge, and the next run
        # (nightly, or a manual Job) does it; nothing has to be done on the
        # host. `absent` OPENS these ports again to whatever the rest of INPUT
        # lets through, and it does not need RPC_ALLOWED_NETS.
        cis_rpc_lockdown_state: present
        cis_rpc_lockdown_manage_unit: true
        cis_rpc_lockdown_ports: [111, 2049, 3128, 20048, 20049, 20050]
        cis_rpc_lockdown_allow4: "{{ (lookup('env', 'RPC_ALLOWED_NETS') | default('', true)).split(',') | map('trim') | reject('equalto', '') | list }}"
        cis_rpc_lockdown_allow6: ["::1/128", "fe80::/10"]

      tasks:
        - name: Guard — these controls were written for Debian 13
          ansible.builtin.assert:
            that:
              - ansible_facts['distribution'] == 'Debian'
              - ansible_facts['distribution_major_version'] == '13'
            fail_msg: >-
              The CIS waves were written and checked against Debian 13 (Trixie).
              This host reports {{ ansible_facts['distribution'] }}
              {{ ansible_facts['distribution_version'] }}; review the waves
              before running them here.

        # ── Admin account ────────────────────────────────────────────────────
        - name: Admin account — {{ cis_admin_user }}
          when: cis_admin_ssh_pubkeys | length > 0
          block:
            - name: Create the account (locked password, sudo group)
              ansible.builtin.user:
                name: "{{ cis_admin_user }}"
                shell: /bin/bash
                groups: sudo
                append: yes
                create_home: yes
                state: present

            - name: Ensure .ssh directory
              ansible.builtin.file:
                path: "/home/{{ cis_admin_user }}/.ssh"
                state: directory
                owner: "{{ cis_admin_user }}"
                group: "{{ cis_admin_user }}"
                mode: "0700"

            - name: Install the SSH public keys
              ansible.builtin.copy:
                content: "{{ cis_admin_ssh_pubkeys | join('\n') }}\n"
                dest: "/home/{{ cis_admin_user }}/.ssh/authorized_keys"
                owner: "{{ cis_admin_user }}"
                group: "{{ cis_admin_user }}"
                mode: "0600"

        # ── Exposure report (read only) ──────────────────────────────────────
        # rpcbind, mountd and statd listen on every address, IPv6 included
        # ([::]:111, :20048, :20049), as do pveproxy (8006) and spiceproxy
        # (3128) as dual-stack sockets, while the packet filtering this repository
        # sets up for them is IPv4 only (DNAT to OPNsense plus an INPUT drop on
        # enp5s0), and the uplink carries a global IPv6 address. Whether those
        # ports answer from the internet over IPv6 therefore cannot be read
        # from the rules in Git. This prints what the host really has loaded so
        # that the restriction (reachable from the LAN and the VPN, not from
        # the internet) is written against facts. It changes nothing and runs
        # in dry runs too.
        - name: Exposure report — RPC/NFS ports (report only)
          ansible.builtin.shell:
            cmd: |
              echo "== listening sockets on the management and RPC/NFS ports"
              ss -H -tulnp | grep -E ':(22|111|2049|3128|8006|20048|20049|20050)[[:space:]]' || echo "(none)"
              # 2>&1 throughout: a failing iptables must show up as its error
              # message, not as an empty section that reads like "no rules".
              echo "== IPv4 filter INPUT"
              if command -v iptables >/dev/null 2>&1; then iptables -S INPUT 2>&1; else echo "iptables: not installed"; fi
              echo "== IPv4 nat PREROUTING"
              if command -v iptables >/dev/null 2>&1; then iptables -t nat -S PREROUTING 2>&1; fi
              echo "== IPv6 filter INPUT"
              if command -v ip6tables >/dev/null 2>&1; then ip6tables -S INPUT 2>&1; else echo "ip6tables: not installed"; fi
              echo "== interfaces carrying a global IPv6 address"
              ip -6 -o addr show scope global | cut -d' ' -f2 | sort -u
            executable: /bin/bash
          register: cis_exposure
          changed_when: false
          failed_when: false
          check_mode: false

        - name: Exposure report — result
          ansible.builtin.debug:
            msg: "{{ cis_exposure.stdout_lines }}"

        # ── Waves ────────────────────────────────────────────────────────────
        - name: Wave 1 — low-risk controls
          ansible.builtin.include_tasks: cis_wave1.yml
          when: 1 in cis_waves

        # Between wave 1 and the later waves on purpose. Wave 1 has been applied
        # and verified on the host for some time. The lockdown carries the Git
        # off switch (cis_rpc_lockdown_state: absent), and an off switch that
        # only runs if every newer wave succeeded first is not one: a failing
        # wave 2 or 3 would leave `absent` unexecuted.
        - name: RPC/NFS lockdown
          ansible.builtin.include_tasks: cis_rpc_lockdown.yml

        - name: Wave 2 — AppArmor utilities
          ansible.builtin.include_tasks: cis_wave2.yml
          when: 2 in cis_waves

        - name: Wave 2 — auditd
          ansible.builtin.include_tasks: cis_wave2_audit.yml
          when: 2 in cis_waves

        - name: Wave 2 — time servers
          ansible.builtin.include_tasks: cis_wave2_time.yml
          when: 2 in cis_waves

        - name: Wave 3 — SSH access list
          ansible.builtin.include_tasks: cis_wave3_ssh.yml
          when: 3 in cis_waves

        - name: Wave 3 — PAM
          ansible.builtin.include_tasks: cis_wave3_pam.yml
          when: 3 in cis_waves

        # Last of all: the baseline is taken after the other waves have written
        # their files.
        - name: Wave 2 — AIDE
          ansible.builtin.include_tasks: cis_wave2_aide.yml
          when: 2 in cis_waves

      handlers:
        # The handlers of hardening.yml belong to its own play and are not
        # visible here. Same commands: augenrules merges rules.d/ and loads it
        # (restarting auditd through systemd is refused), SIGHUP makes auditd
        # re-read auditd.conf in place.
        - name: Load audit rules
          ansible.builtin.command: augenrules --load

        - name: Reload auditd config
          ansible.builtin.command: auditctl --signal reload

  cis_wave1.yml: |-
    ---
    # Wave 1: controls that touch none of authentication, SSH, PAM or the network.
    # Numbers are those of the Wazuh SCA policy cis_debian13.
    #
    # Expected effect on the SCA score, from the baseline of 2026-10-11
    # (91 passed / 102 failed): 15 checks flip to passed -
    #   1.6.1  1.6.3  2.2.4  2.3.3.2  2.4.1.2-2.4.1.7  5.1.8  5.2.3  5.2.6
    #   5.2.7  7.1.10
    # (5.1.8 comes from hardening.yml's sshd_config, the rest from here.)

    # ── 2.4.1.2 - 2.4.1.7  cron permissions ──────────────────────────────────
    - name: CIS 2.4.1 | Stat the cron paths
      ansible.builtin.stat:
        path: "{{ item.path }}"
      loop:
        - { path: /etc/crontab, mode: "0600" }
        - { path: /etc/cron.hourly, mode: "0700" }
        - { path: /etc/cron.daily, mode: "0700" }
        - { path: /etc/cron.weekly, mode: "0700" }
        - { path: /etc/cron.monthly, mode: "0700" }
        - { path: /etc/cron.d, mode: "0700" }
      loop_control:
        label: "{{ item.path }}"
      register: cis_cron_paths

    # cron itself runs as root and reads these as root, so closing them to
    # everyone else changes nothing for the jobs that exist.
    - name: CIS 2.4.1 | Limit the cron paths to root
      ansible.builtin.file:
        path: "{{ item.item.path }}"
        owner: root
        group: root
        mode: "{{ item.item.mode }}"
      loop: "{{ cis_cron_paths.results }}"
      loop_control:
        label: "{{ item.item.path }}"
      when: item.stat.exists

    # ── 7.1.10  opasswd ──────────────────────────────────────────────────────
    # The SCA rule stats BOTH files, and stat on a missing one fails the rule,
    # so absent is not compliant here the way the CIS text reads. Touching with
    # preserved times keeps this from reporting "changed" every night.
    - name: CIS 7.1.10 | opasswd and opasswd.old exist and are root-only
      ansible.builtin.file:
        path: "{{ item }}"
        state: touch
        owner: root
        group: root
        mode: "0600"
        modification_time: preserve
        access_time: preserve
      loop:
        - /etc/security/opasswd
        - /etc/security/opasswd.old

    # ── 2.2.4  telnet client ─────────────────────────────────────────────────
    - name: CIS 2.2.4 | Gather package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: CIS 2.2.4 | Which telnet clients are installed
      ansible.builtin.set_fact:
        cis_telnet_pkgs: "{{ ['telnet', 'inetutils-telnet'] | select('in', ansible_facts.packages) | list }}"

    # Simulate first and refuse to go on if apt would take anything else with
    # it. On a Proxmox host a package removal that drags in proxmox-ve is the
    # failure to rule out. The assertion fails closed: if the simulation prints
    # nothing parseable, the run stops instead of removing blind.
    - name: CIS 2.2.4 | Remove the telnet client
      when: cis_telnet_pkgs | length > 0
      block:
        - name: CIS 2.2.4 | Simulate the removal
          ansible.builtin.command: "apt-get --simulate purge {{ cis_telnet_pkgs | join(' ') }}"
          register: cis_telnet_sim
          changed_when: false
          check_mode: false

        - name: CIS 2.2.4 | Refuse if anything beyond the telnet clients would go
          ansible.builtin.assert:
            that:
              - cis_telnet_sim_pkgs | length > 0
              - cis_telnet_sim_pkgs | difference(cis_telnet_pkgs) | length == 0
            fail_msg: >-
              Removing {{ cis_telnet_pkgs | join(', ') }} would also remove
              {{ cis_telnet_sim_pkgs | difference(cis_telnet_pkgs) | join(', ') }}.
              Not removing anything; decide by hand.
          vars:
            # [^ ]+ rather than \S+: inside a Jinja string Ansible hands a
            # doubled backslash to the regex as-is, so \\S matched nothing and
            # the fail-closed assertion above tripped on a perfectly normal
            # simulation (found by running this against Debian 13, 2026-10-11).
            cis_telnet_sim_pkgs: >-
              {{ cis_telnet_sim.stdout | regex_findall('(?m)^(?:Remv|Purg) ([^ ]+)') | unique | list }}

        - name: CIS 2.2.4 | Purge the telnet client
          ansible.builtin.apt:
            name: "{{ cis_telnet_pkgs }}"
            state: absent
            purge: yes

    # ── 5.2.3 / 5.2.6  sudo log file and credential cache ────────────────────
    # The SCA rule for 5.2.6 needs timestamp_timeout in /etc/sudoers itself AND
    # in a sudoers.d file (condition "all"), which no real configuration needs.
    # Both get the same value. Every edit is validated with visudo before it
    # replaces the live file: a broken sudoers locks the automation out.
    - name: CIS 5.2.3 / 5.2.6 | sudo drop-in
      ansible.builtin.copy:
        dest: /etc/sudoers.d/99-cis-hardening
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
        content: |
          # Managed by Ansible (proxmox-ansible, CIS wave 1). Do not edit by hand.
          # 5.2.3: log sudo activity to a file
          Defaults logfile="/var/log/sudo.log"
          # 5.2.6: re-ask for the password after 15 minutes
          Defaults timestamp_timeout=15

    - name: CIS 5.2.6 | timestamp_timeout in /etc/sudoers
      ansible.builtin.lineinfile:
        path: /etc/sudoers
        regexp: '^\s*Defaults\s+timestamp_timeout\s*='
        line: "Defaults timestamp_timeout=15"
        insertafter: '^\s*Defaults\s+use_pty'
        validate: /usr/sbin/visudo -cf %s

    # ── 5.2.7  su restricted ─────────────────────────────────────────────────
    # The SCA rule wants pam_wheel with use_uid AND an explicit group=, naming
    # a group that nobody belongs to. (The role writes a bare pam_wheel.so,
    # which would not pass.) Nothing here depends on su: automation uses sudo,
    # SSH and the PVE web login do not go through /etc/pam.d/su.
    - name: CIS 5.2.7 | Empty group that gates su
      ansible.builtin.group:
        name: sugroup
        state: present

    - name: CIS 5.2.7 | Restrict su to that group
      ansible.builtin.lineinfile:
        path: /etc/pam.d/su
        regexp: '^\s*#?\s*auth\s+required\s+pam_wheel\.so'
        line: "auth       required   pam_wheel.so use_uid group=sugroup"

    # ── 1.6.1 / 1.6.3  banners ───────────────────────────────────────────────
    # 1.6.1: the SCA regex contains a bare \s (whitespace), so any motd text
    # with a space in it fails; only an absent file passes, which the CIS text
    # allows ("if the motd is not used, this file can be removed"). The legal
    # notice is shown before login by the sshd banner instead.
    - name: CIS 1.6.1 | No /etc/motd
      ansible.builtin.file:
        path: /etc/motd
        state: absent

    # 1.6.3: Debian's stock issue.net names the OS, which the rule rejects.
    # Reuse the sshd banner file so there is one text to maintain.
    # /etc/issue (1.6.2) is left alone on purpose: pvebanner rewrites it at
    # every boot, so managing it here would fight Proxmox, and it passes as is.
    - name: CIS 1.6.3 | /etc/issue.net carries the same notice as the sshd banner
      ansible.builtin.copy:
        src: /etc/ssh/issue.net
        dest: /etc/issue.net
        remote_src: yes
        owner: root
        group: root
        mode: "0644"

    # ── 2.3.3.2  chrony user ─────────────────────────────────────────────────
    # chronyd already runs as _chrony; the process owner is what Wazuh's
    # inventory shows. The check reads the config instead, and wants the user
    # named in chrony.conf AND in a conf.d file (condition "all"). Same value
    # as the built-in default, so no restart is needed.
    - name: CIS 2.3.3.2 | chrony.conf names the unprivileged user
      ansible.builtin.lineinfile:
        path: /etc/chrony/chrony.conf
        regexp: '^\s*user\s'
        line: "user _chrony"

    - name: CIS 2.3.3.2 | conf.d directory exists
      ansible.builtin.file:
        path: /etc/chrony/conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: CIS 2.3.3.2 | conf.d names it as well
      ansible.builtin.copy:
        dest: /etc/chrony/conf.d/10-user.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (proxmox-ansible, CIS wave 1).
          user _chrony

    # ── 7.2.1  diagnostic only ───────────────────────────────────────────────
    # SCA reports "accounts not using shadowed passwords" as failed, but the
    # usernames Wazuh's inventory lists all fit its pattern, so the trigger is
    # something else in /etc/passwd. Report which lines the rule rejects
    # (usernames only, never the second field) instead of running pwconv blind.
    - name: CIS 7.2.1 | Read /etc/passwd
      ansible.builtin.slurp:
        src: /etc/passwd
      register: cis_passwd

    - name: CIS 7.2.1 | Report lines the SCA rule rejects (report only)
      ansible.builtin.debug:
        msg: >-
          {{ (cis_passwd.content | b64decode).splitlines()
             | reject('match', '^[A-Za-z0-9_@-]+:x:')
             | map('split', ':')
             | map('first')
             | list }}

  cis_wave2.yml: |-
    ---
    # Wave 2, so far: the AppArmor utilities. The auditd rules and AIDE (config
    # paths only) are meant to follow here. Numbers are those of the Wazuh SCA
    # policy cis_debian13.
    #
    # Expected effect on the SCA score: 1 check flips to passed (1.3.1.1).
    # 1.3.1.2 (AppArmor in the boot command line) and 1.4.1 (GRUB password) are
    # accepted exceptions: both need a reboot of the hypervisor.

    # ── 1.3.1.1  apparmor and apparmor-utils installed ───────────────────────
    # The SCA rule is two dpkg-query calls, one per package. apparmor itself
    # came with Proxmox (pve-container needs it); only the utilities are missing.
    # Proxmox builds its own copies of all of them (4.1.1-pmx1 in the pve
    # repository), and apparmor-utils there depends on python3-apparmor of the
    # exact same version, so apt must take the Proxmox build and may not mix in
    # Debian's. Nothing here installs apparmor itself: if it is missing, that is
    # not the state this was checked against, and the run stops.
    - name: CIS 1.3.1.1 | Gather package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: CIS 1.3.1.1 | apparmor itself must already be installed
      ansible.builtin.assert:
        that:
          - "'apparmor' in ansible_facts.packages"
        fail_msg: >-
          apparmor is not installed on this host, which is not what this wave
          was written against. Not installing anything; look at it by hand.

    # Simulate first and refuse to go on unless the only effect is new
    # packages that belong to AppArmor. Same fail-closed shape as the telnet
    # removal in wave 1: an installed package that would change version or go
    # away (the way a mixed Debian/Proxmox dependency would show up), or a new
    # package that has nothing to do with AppArmor, stops the run with
    # nothing installed. Recommends are left out as a matter of course on a
    # hypervisor. The Proxmox build of apparmor-utils recommends nothing
    # (checked in the pve package index), so today that changes nothing; it
    # only keeps a Recommends added by a later version from sneaking in.
    - name: CIS 1.3.1.1 | Install the AppArmor utilities
      when: "'apparmor-utils' not in ansible_facts.packages"
      block:
        # The simulation and the install must see the same package index, so
        # refresh it once, here, before either of them looks. A no-op when
        # hardening.yml refreshed it within the hour.
        - name: CIS 1.3.1.1 | Package index no older than an hour
          ansible.builtin.apt:
            update_cache: yes
            cache_valid_time: 3600

        - name: CIS 1.3.1.1 | Simulate the installation
          ansible.builtin.command:
            argv: [apt-get, --simulate, --no-install-recommends, install, apparmor-utils]
          environment:
            LC_ALL: C
          register: cis_aa_sim
          changed_when: false
          check_mode: false

        - name: CIS 1.3.1.1 | Refuse unless it only adds AppArmor packages
          ansible.builtin.assert:
            that:
              - "'apparmor-utils' in cis_aa_new"
              - cis_aa_gone | length == 0
              - cis_aa_changed | length == 0
              - cis_aa_new | reject('search', 'apparmor') | list | length == 0
            fail_msg: >-
              apt's plan for apparmor-utils is not just new AppArmor packages.
              New: {{ cis_aa_new | join(', ') | default('(none parsed)', true) }}.
              Would change an installed package: {{ cis_aa_changed | join(', ') | default('none', true) }}.
              Would remove: {{ cis_aa_gone | join(', ') | default('none', true) }}.
              Not installing anything; decide by hand.
            success_msg: "apt would add only: {{ cis_aa_new | join(', ') }}"
          vars:
            # Same regex lesson as the telnet removal: single backslashes and
            # [^ ]+, never \\S. "Inst name (" is a new package, "Inst name ["
            # an installed one that would change version.
            cis_aa_new: >-
              {{ cis_aa_sim.stdout | regex_findall('(?m)^Inst ([^ ]+) \(') | unique | list }}
            cis_aa_changed: >-
              {{ cis_aa_sim.stdout | regex_findall('(?m)^Inst ([^ ]+) \[') | unique | list }}
            cis_aa_gone: >-
              {{ cis_aa_sim.stdout | regex_findall('(?m)^(?:Remv|Purg) ([^ ]+)') | unique | list }}

        - name: CIS 1.3.1.1 | Install apparmor-utils
          ansible.builtin.apt:
            name: apparmor-utils
            state: present
            install_recommends: no

  cis_wave2_audit.yml: |-
    ---
    # Wave 2, auditd. Numbers are those of the Wazuh SCA policy cis_debian13.
    #
    # Decided 2026-10-11: the new rules leave the automation account out where a
    # rule can say so (a play that touches hundreds of files every night would
    # drown them); log rotation is explicit and bounded; the checks that would
    # halt or single-user the host when the audit disk fills (6.2.2.3, 6.2.2.4),
    # keep every log forever (6.2.2.2), immutable rules (6.2.3.20) and the boot
    # parameter 6.2.1.4 stay exceptions.
    #
    # Why the file is called 70-cis.rules: the kernel logs only the key of the
    # FIRST rule that matches an event (measured 2026-10-11 with two watches on
    # one path: the one loaded first is the only key in the log). 60-wazuh.rules
    # already watches sudoers, sudoers.d, passwd, shadow and group under the
    # key audit-wazuh-w; if a CIS rule for the same path loaded before it, Wazuh
    # would silently stop seeing those events. augenrules loads files in name
    # order, so 70 comes after 60.
    #
    # augenrules --load runs auditctl -R, which stops at the first line it
    # cannot load (measured): everything before it stays loaded, everything
    # after it is not. Rules that Wazuh depends on are therefore loaded first,
    # and a rules file that failed to load once is not silently skipped on the
    # next run: the keys are checked against `auditctl -l` every time and the
    # rules are loaded again if one is missing.

    # ── 6.2.1.1  audispd-plugins ─────────────────────────────────────────
    # The rule is two dpkg calls: auditd and audispd-plugins installed. The
    # package ships the remote-forwarding plugins switched off (active = no,
    # checked in a Debian 13 container) and its maintainer scripts only move
    # conffiles; nothing is started or restarted. It depends on auditd of the
    # same version, so an auditd upgrade would show up as a changed installed
    # package in the simulation and stop the run.
    - name: CIS 6.2.1.1 | Gather package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: CIS 6.2.1.1 | auditd itself must already be installed
      ansible.builtin.assert:
        that:
          - "'auditd' in ansible_facts.packages"
        fail_msg: >-
          auditd is not installed, which hardening.yml should have done. Not
          installing anything here.

    - name: CIS 6.2.1.1 | Install audispd-plugins
      when: "'audispd-plugins' not in ansible_facts.packages"
      block:
        - name: CIS 6.2.1.1 | Package index no older than an hour
          ansible.builtin.apt:
            update_cache: yes
            cache_valid_time: 3600

        - name: CIS 6.2.1.1 | Simulate the installation
          ansible.builtin.command:
            argv: [apt-get, --simulate, --no-install-recommends, install, audispd-plugins]
          environment:
            LC_ALL: C
          register: cis_ap_sim
          changed_when: false
          check_mode: false

        # Fail closed: audispd-plugins itself plus libraries it links against
        # (libldap2, libsasl2 on a plain Debian) are fine; a removal, a version
        # change of an installed package or any other new package is not.
        - name: CIS 6.2.1.1 | Refuse unless it only adds the plugin and libraries
          ansible.builtin.assert:
            that:
              - "'audispd-plugins' in cis_ap_new"
              - cis_ap_gone | length == 0
              - cis_ap_changed | length == 0
              - cis_ap_new | reject('match', '^(audispd-plugins|lib[a-z0-9.+-]+)') | list | length == 0
            fail_msg: >-
              apt's plan for audispd-plugins is more than the plugin and
              libraries. New: {{ cis_ap_new | join(', ') | default('(none parsed)', true) }}.
              Would change an installed package: {{ cis_ap_changed | join(', ') | default('none', true) }}.
              Would remove: {{ cis_ap_gone | join(', ') | default('none', true) }}.
              Not installing anything; decide by hand.
            success_msg: "apt would add only: {{ cis_ap_new | join(', ') }}"
          vars:
            cis_ap_new: >-
              {{ cis_ap_sim.stdout | regex_findall('(?m)^Inst ([^ ]+) \(') | unique | list }}
            cis_ap_changed: >-
              {{ cis_ap_sim.stdout | regex_findall('(?m)^Inst ([^ ]+) \[') | unique | list }}
            cis_ap_gone: >-
              {{ cis_ap_sim.stdout | regex_findall('(?m)^(?:Remv|Purg) ([^ ]+)') | unique | list }}

        - name: CIS 6.2.1.1 | Install audispd-plugins
          ansible.builtin.apt:
            name: audispd-plugins
            state: present
            install_recommends: no

    # ── log rotation (decision B) ──────────────────────────────────────────────
    # Debian's defaults already rotate (8 MB, 5 files). This makes it explicit
    # and bounded: at most 8 x 16 MB = 128 MB, oldest file replaced. The
    # numbers are a choice, not derived from the size of this host's disk; the
    # report at the end prints the space left so that they can be judged.
    # What happens when the disk fills anyway stays at Debian's values (warn
    # in syslog, then suspend logging) - the halt/single settings of 6.2.2.3
    # and 6.2.2.4 are an exception on purpose, they would stop the hypervisor.
    - name: auditd | Rotate the log at 16 MB
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: '^max_log_file\s*='
        line: "max_log_file = 16"
      notify: Reload auditd config

    - name: auditd | Keep 8 rotated files
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: '^num_logs\s*='
        line: "num_logs = 8"
      notify: Reload auditd config

    - name: auditd | Rotate (not keep forever) when the size is reached
      ansible.builtin.lineinfile:
        path: /etc/audit/auditd.conf
        regexp: '^max_log_file_action\s*='
        line: "max_log_file_action = ROTATE"
      notify: Reload auditd config

    # ── 6.2.3.x  rules ────────────────────────────────────────────────────────
    - name: CIS 6.2.3 | The requested state must be one we know
      ansible.builtin.assert:
        that:
          - cis_audit_rules_state in ['present', 'absent']
        fail_msg: >-
          cis_audit_rules_state is '{{ cis_audit_rules_state }}', expected
          present or absent. Nothing was changed on the host.

    - name: CIS 6.2.3 | Take the CIS audit rules out again
      when: cis_audit_rules_state == 'absent'
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/audit/rules.d/70-cis.rules
        - "/etc/audit/rules.d/71-cis.+.rules"
      notify: Load audit rules

    - name: CIS 6.2.3 | Look up the automation account
      when: cis_audit_rules_state == 'present'
      ansible.builtin.getent:
        database: passwd
        key: "{{ cis_automation_user }}"

    - name: CIS 6.2.3 | Its UID must be a number
      when: cis_audit_rules_state == 'present'
      ansible.builtin.assert:
        that:
          - cis_automation_uid is match('^[0-9]+')
        fail_msg: "Could not read the UID of {{ cis_automation_user }}; not writing audit rules."
      vars:
        cis_automation_uid: "{{ ansible_facts.getent_passwd[cis_automation_user][1] }}"

    - name: CIS 6.2.3 | Deploy the CIS audit rules
      when: cis_audit_rules_state == 'present'
      ansible.builtin.copy:
        dest: /etc/audit/rules.d/70-cis.rules
        owner: root
        group: root
        mode: "0640"
        content: |
          ## Managed by k8s-ops (proxmox-ansible), CIS wave 2. Do not edit by hand.
          ## Loaded AFTER 60-wazuh.rules on purpose (see cis_wave2_audit.yml).
          ##
          ## auid>=1000 leaves out root's own sessions (auid 0) and daemons (unset),
          ## and auid!={{ cis_automation_uid }} leaves out the account the nightly
          ## run connects as ({{ cis_automation_user }}).

          ## 6.2.3.1 changes to sudoers (60-wazuh.rules watches the same paths
          ## under another key and, loading first, keeps the log entry)
          -w /etc/sudoers -p wa -k scope
          -w /etc/sudoers.d -p wa -k scope

          ## 6.2.3.3 the sudo log file
          -w /var/log/sudo.log -p wa -k sudo_log_file

          ## 6.2.3.4 time. Exactly as the benchmark has it: chronyd calls adjtimex
          ## too, so this key may be the noisy one; read it from the report.
          -a always,exit -F arch=b64 -S adjtimex,settimeofday,clock_settime -k time-change
          -a always,exit -F arch=b32 -S adjtimex,settimeofday,clock_settime -k time-change
          -w /etc/localtime -p wa -k time-change

          ## (6.2.3.5 network environment and 6.2.3.19 kernel modules are in
          ## 71-cis.+.rules, see cis_wave2_audit.yml for why)

          ## 6.2.3.7 failed file access
          -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=unset -F auid!={{ cis_automation_uid }} -k access
          -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=unset -F auid!={{ cis_automation_uid }} -k access
          -a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EACCES -F auid>=1000 -F auid!=unset -F auid!={{ cis_automation_uid }} -k access
          -a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-EPERM -F auid>=1000 -F auid!=unset -F auid!={{ cis_automation_uid }} -k access

          ## 6.2.3.8 user and group information (passwd, shadow, group are in
          ## 60-wazuh.rules)
          -w /etc/nsswitch.conf -p wa -k identity
          -w /etc/pam.conf -p wa -k identity
          -w /etc/pam.d -p wa -k identity
          -w /etc/gshadow -p wa -k identity
          -w /etc/security/opasswd -p wa -k identity

          ## 6.2.3.9 permission and ownership changes
          -a always,exit -F arch=b64 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -F auid!={{ cis_automation_uid }} -k perm_mod
          -a always,exit -F arch=b64 -S chown,fchown,lchown,fchownat -F auid>=1000 -F auid!=unset -F auid!={{ cis_automation_uid }} -k perm_mod
          -a always,exit -F arch=b64 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=unset -F auid!={{ cis_automation_uid }} -k perm_mod
          -a always,exit -F arch=b32 -S chmod,fchmod,fchmodat -F auid>=1000 -F auid!=unset -F auid!={{ cis_automation_uid }} -k perm_mod
          -a always,exit -F arch=b32 -S chown,fchown,lchown,fchownat -F auid>=1000 -F auid!=unset -F auid!={{ cis_automation_uid }} -k perm_mod
          -a always,exit -F arch=b32 -S setxattr,lsetxattr,fsetxattr,removexattr,lremovexattr,fremovexattr -F auid>=1000 -F auid!=unset -F auid!={{ cis_automation_uid }} -k perm_mod

          ## 6.2.3.10 mounts
          -a always,exit -F arch=b64 -S mount -F auid>=1000 -F auid!=unset -F auid!={{ cis_automation_uid }} -k mounts
          -a always,exit -F arch=b32 -S mount -F auid>=1000 -F auid!=unset -F auid!={{ cis_automation_uid }} -k mounts

          ## 6.2.3.11 and 6.2.3.12 sessions and logins
          -w /var/run/utmp -p wa -k session
          -w /var/log/wtmp -p wa -k session
          -w /var/log/btmp -p wa -k session
          -w /var/log/faillog -p wa -k logins
          -w /var/log/lastlog -p wa -k logins

          ## 6.2.3.13 deletions and renames
          -a always,exit -F arch=b64 -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=unset -F auid!={{ cis_automation_uid }} -k delete
          -a always,exit -F arch=b32 -S unlink,unlinkat,rename,renameat -F auid>=1000 -F auid!=unset -F auid!={{ cis_automation_uid }} -k delete
      vars:
        cis_automation_uid: "{{ ansible_facts.getent_passwd[cis_automation_user][1] }}"
      notify: Load audit rules

    # The file name is deliberate. The Wazuh policy's directory rule for 6.2.3.5
    # and 6.2.3.19 is `d:/etc/audit/rules.d -> r:.+\.rules$`. In the regex
    # dialect the agent uses, `.` is a literal dot and `\.` is "any character",
    # so the rule needs a file name that contains the two characters ".+"
    # followed by one more character and "rules" at the end (6.2.3.1 and the
    # others write it the other way round and match 70-cis.rules). Measured
    # 2026-10-12 with the real agent 4.14.8: with a file called 71-cis.+.rules
    # both checks pass, with 71-cis..rules or without the file they fail. These
    # two groups of rules live only here and not also in 70-cis.rules, so that
    # no rule is loaded twice; what auditctl does with a duplicate was not
    # tested. augenrules takes every *.rules file, so the odd name is fine for
    # it; that the rules really get loaded is checked below by the keys.
    - name: CIS 6.2.3.5 / 6.2.3.19 | Deploy the second rules file
      when: cis_audit_rules_state == 'present'
      ansible.builtin.copy:
        dest: "/etc/audit/rules.d/71-cis.+.rules"
        owner: root
        group: root
        mode: "0640"
        content: |
          ## Managed by k8s-ops (proxmox-ansible), CIS wave 2. Do not edit by hand.
          ## The odd file name is on purpose, see cis_wave2_audit.yml.

          ## 6.2.3.5 network environment
          -a always,exit -F arch=b64 -S sethostname,setdomainname -k system-locale
          -a always,exit -F arch=b32 -S sethostname,setdomainname -k system-locale
          -w /etc/networks -p wa -k system-locale
          -w /etc/netplan -p wa -k system-locale

          ## 6.2.3.19 kernel modules
          -a always,exit -F arch=b64 -S init_module,delete_module,finit_module -k kernel_modules
          -a always,exit -F arch=b32 -S init_module,delete_module,finit_module -k kernel_modules
          -a always,exit -F path=/usr/bin/kmod -F perm=x -F auid>=1000 -F auid!=unset -F auid!={{ cis_automation_uid }} -k kernel_modules
      vars:
        cis_automation_uid: "{{ ansible_facts.getent_passwd[cis_automation_user][1] }}"
      notify: Load audit rules

    # Run the handlers now, so that what is checked below is what was loaded.
    - name: CIS 6.2.3 | Apply what was queued
      ansible.builtin.meta: flush_handlers

    # A rules file that is on disk is not the same as rules that are loaded:
    # a failed load leaves the file as it is, the next run sees no change and
    # loads nothing. So compare the loaded rules with the keys we expect, every
    # run, and load again if one is missing.
    - name: CIS 6.2.3 | Read the loaded rules
      ansible.builtin.command: auditctl -l
      register: cis_audit_loaded
      changed_when: false
      check_mode: false

    - name: CIS 6.2.3 | Load the rules again if one of our keys is missing
      ansible.builtin.command: augenrules --load
      when:
        - cis_audit_rules_state == 'present'
        - not ansible_check_mode
        - cis_audit_missing | length > 0
      vars:
        cis_audit_missing: >-
          {%- set out = [] -%}
          {%- for k in cis_audit_keys -%}
            {%- if cis_audit_loaded.stdout is not search('(-k |key=)' ~ k ~ '(\s|\Z)') -%}
              {%- set _ = out.append(k) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}

    - name: CIS 6.2.3 | Read the loaded rules again
      ansible.builtin.command: auditctl -l
      register: cis_audit_loaded2
      changed_when: false
      check_mode: false

    - name: CIS 6.2.3 | All of our keys are loaded
      when: cis_audit_rules_state == 'present'
      ansible.builtin.assert:
        that:
          - ansible_check_mode or cis_audit_missing2 | length == 0
        fail_msg: >-
          These audit keys are still not loaded after augenrules --load:
          {{ cis_audit_missing2 | join(', ') }}. 60-wazuh.rules is loaded before
          this file, so the Wazuh rules are not affected. Look at the output of
          `augenrules --load` on the host; if auditd is in immutable mode
          (enabled 2) a reboot is needed.
      vars:
        cis_audit_missing2: >-
          {%- set out = [] -%}
          {%- for k in cis_audit_keys -%}
            {%- if cis_audit_loaded2.stdout is not search('(-k |key=)' ~ k ~ '(\s|\Z)') -%}
              {%- set _ = out.append(k) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ out }}

    # ── report (read only) ────────────────────────────────────────────────────────
    # How many events per key today, and how much room the log has. Counts and
    # key names only. It exists so that the volume the new rules cause is read
    # from the host after the first night instead of guessed.
    - name: auditd | Report events per key today and the space left (read only)
      ansible.builtin.shell:
        cmd: |
          echo "== events per key since midnight"
          aureport --key --summary -ts today 2>&1 | head -30
          echo "== audit log files"
          stat -c '%s bytes  %n' /var/log/audit/* 2>&1
          echo "== space left where the log lives (KiB available, use%)"
          df --output=avail,pcent /var/log/audit 2>&1 | tail -1
        executable: /bin/bash
      register: cis_audit_report
      changed_when: false
      failed_when: false
      check_mode: false

    - name: auditd | Report
      ansible.builtin.debug:
        msg: "{{ cis_audit_report.stdout_lines }}"

  cis_wave2_time.yml: |-
    ---
    # Wave 2, time: the host takes its time from the same two servers as the
    # Talos nodes (talos/patches/global/machine-time.yaml), instead of the
    # Debian pool that chrony ships with. Decided 2026-10-17.
    #
    # The Wazuh policy has no check for the servers themselves, only for
    # chrony's user (2.3.3.2) and for the service being enabled and active
    # (2.3.3.3), so this changes no score. Both stay true: chrony.conf keeps
    # its `user _chrony` setting and the service is running at the end.
    #
    # Order matters, because a host without a working time source is worse than
    # one with the wrong source:
    #   1. write the new servers to sources.d/ and let chronyd load them
    #      (`chronyc reload sources`, no restart; the pool keeps working)
    #   2. WAIT until every new server has answered at least once
    #   3. only then comment out the pool/server lines in chrony.conf and
    #      restart chronyd
    #   4. wait until chronyd is synchronised again
    # If 2 fails, the new file is removed and nothing else was touched. If 4
    # fails, the pool lines are put back, the new file is removed and chronyd is
    # restarted. Both end in a failed run, loudly.
    #
    # Steps 2 and 4 only happen in the run that actually retires the pool. On
    # every later night chrony.conf has no active pool/server line any more, the
    # new servers are the only sources, and a short outage at the far end must
    # not trigger a rollback that would leave chronyd with no source at all.
    #
    # Not touched: `sourcedir /run/chrony-dhcp` (servers a DHCP lease hands out,
    # if any) and the files in conf.d. The report before and after shows what
    # chronyd really uses.
    #
    # Dry run (--check): files and the chrony.conf edit are shown as a diff; the
    # reachability wait is skipped, because the new file is not written then.
    #
    # No dollar signs in this file: Flux substitutes them in the ConfigMap.
    - name: time | the requested state must be one we know
      ansible.builtin.assert:
        that:
          - cis_time_state in ['present', 'absent']
          - cis_time_state == 'absent' or cis_time_servers | length > 0
          - cis_time_servers | unique | length == cis_time_servers | length
        fail_msg: >-
          cis_time_state is '{{ cis_time_state }}' (present or absent expected)
          or cis_time_servers is empty or has duplicates. Nothing was changed
          on the host.

    - name: time | chrony must be installed
      ansible.builtin.stat:
        path: /etc/chrony/chrony.conf
      register: cis_time_conf_stat

    - name: time | chrony must be installed (result)
      ansible.builtin.assert:
        that: cis_time_conf_stat.stat.exists
        fail_msg: >-
          /etc/chrony/chrony.conf does not exist. This task file edits chrony's
          configuration; it does not install chrony. Nothing was changed.

    - name: time | Report configuration and sources before (read only)
      ansible.builtin.shell:
        cmd: |
          echo "== active lines in chrony.conf"
          grep -E '^[[:space:]]*[a-z]' /etc/chrony/chrony.conf 2>&1
          echo "== files in sources.d and conf.d"
          ls -1 /etc/chrony/sources.d /etc/chrony/conf.d 2>&1
          echo "== sources"
          chronyc -n sources 2>&1
          echo "== tracking"
          chronyc tracking 2>&1 | grep -E '^(Reference ID|Stratum|Leap status)'
        executable: /bin/bash
      register: cis_time_before
      changed_when: false
      failed_when: false
      check_mode: false

    - name: time | Before
      ansible.builtin.debug:
        msg: "{{ cis_time_before.stdout_lines }}"

    # grep exits 0 with a match, 1 without; anything else is a real error.
    - name: time | are pool/server lines still active in chrony.conf?
      ansible.builtin.command: grep -c -E '^[[:space:]]*(pool|server)[[:space:]]' /etc/chrony/chrony.conf
      register: cis_time_upstream
      changed_when: false
      failed_when: cis_time_upstream.rc > 1
      check_mode: false

    # Debian's chrony.conf reads /etc/chrony/sources.d/*.sources through this
    # directive. Without it the new file would never be loaded and the wait
    # below could only time out; say so up front instead.
    - name: time | does chrony.conf read sources.d?
      ansible.builtin.command: grep -c -x -E '[[:space:]]*sourcedir[[:space:]]+/etc/chrony/sources[.]d[[:space:]]*(#.*)?' /etc/chrony/chrony.conf
      register: cis_time_sourcedir
      changed_when: false
      failed_when: false
      check_mode: false
      when: cis_time_state == 'present'

    - name: time | chrony.conf must read sources.d
      ansible.builtin.assert:
        that: cis_time_sourcedir.stdout | trim | int > 0
        fail_msg: >-
          /etc/chrony/chrony.conf has no active line "sourcedir
          /etc/chrony/sources.d", the way Debian ships it, so a file in that
          directory would be ignored. Nothing was changed on the host.
      when: cis_time_state == 'present'

    # ── present: add the servers, prove they answer, then retire the pool ────
    - name: time | add the new servers and prove they answer
      when: cis_time_state == 'present'
      block:
        - name: time | sources.d exists
          ansible.builtin.file:
            path: /etc/chrony/sources.d
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: time | the servers ({{ cis_time_sources_file }})
          ansible.builtin.copy:
            dest: "/etc/chrony/sources.d/{{ cis_time_sources_file }}"
            content: |
              # Managed by proxmox-ansible (CIS wave 2, time). Do not edit.
              # The same servers as the Talos nodes use.
              {% for s in cis_time_servers %}
              server {{ s }} iburst
              {% endfor %}
            owner: root
            group: root
            mode: "0644"

        # Always, not only when the file changed: it is cheap, it does nothing
        # when chronyd already knows the file, and it covers a chronyd that was
        # restarted between two runs.
        - name: time | let chronyd load them (no restart)
          ansible.builtin.command: chronyc reload sources
          changed_when: false

        # chronyc -c prints CSV: mode,state,name,stratum,poll,reach,... ; reach
        # is an octal shift register, zero until the first answer.
        - name: time | every new server must have answered before anything else changes
          ansible.builtin.command: chronyc -n -c sources
          register: cis_time_probe
          changed_when: false
          check_mode: false
          when:
            - not ansible_check_mode
            - cis_time_upstream.rc == 0
          retries: "{{ cis_time_probe_retries }}"
          delay: "{{ cis_time_probe_delay }}"
          until: >-
            cis_time_probe.stdout_lines
            | select('search', '^[^,]*,[^,]*,(' ~ (cis_time_servers | map('regex_escape') | join('|')) ~ '),[^,]*,[^,]*,[1-7][0-7]*,')
            | list | length == cis_time_servers | length
      rescue:
        # Only while the original pool lines are still active is there a
        # fallback to return to. If they are already retired, the new file IS
        # the time source and must not be removed.
        - name: time | take the new sources file out again (chrony.conf was not touched)
          ansible.builtin.file:
            path: "/etc/chrony/sources.d/{{ cis_time_sources_file }}"
            state: absent
          when: cis_time_upstream.rc == 0

        - name: time | let chronyd forget them
          ansible.builtin.command: chronyc reload sources
          changed_when: false
          failed_when: false
          when: cis_time_upstream.rc == 0

        - name: time | stop here
          ansible.builtin.fail:
            msg: >-
              Adding the time servers ({{ cis_time_servers | join(', ') }})
              failed: they did not all answer within
              {{ cis_time_probe_retries | int * cis_time_probe_delay | int }}
              seconds (is UDP 123 outbound open from this host?), or writing
              the file failed. While the Debian pool lines were still active in
              chrony.conf, the new sources file was removed again and
              chrony.conf and the running chronyd are as they were. If they
              were already retired, nothing was removed.

    - name: time | retire the other upstream sources
      when: cis_time_state == 'present'
      block:
        - name: time | comment out pool and server lines in chrony.conf
          ansible.builtin.replace:
            path: /etc/chrony/chrony.conf
            regexp: '^([ \t]*(?:pool|server)[ \t].*)'
            replace: '{{ cis_time_marker }}\1'
          register: cis_time_conf

        - name: time | restart chrony (only if chrony.conf changed)
          ansible.builtin.systemd:
            name: chrony
            state: restarted
          when: cis_time_conf is changed

        # The last CSV field of `chronyc -c tracking` is the leap status:
        # Normal once synchronised, "Not synchronised" before.
        - name: time | wait until chrony is synchronised again
          ansible.builtin.command: chronyc -c tracking
          register: cis_time_track
          changed_when: false
          check_mode: false
          when: cis_time_conf is changed and not ansible_check_mode
          retries: "{{ cis_time_sync_retries }}"
          delay: "{{ cis_time_probe_delay }}"
          until: cis_time_track.stdout.split(',')[-1] | trim == 'Normal'
      rescue:
        - name: time | put the original upstream sources back
          ansible.builtin.replace:
            path: /etc/chrony/chrony.conf
            regexp: '^{{ cis_time_marker | regex_escape }}(.*)'
            replace: '\1'
          when: cis_time_conf is defined and cis_time_conf is changed

        - name: time | take the new sources file out again
          ansible.builtin.file:
            path: "/etc/chrony/sources.d/{{ cis_time_sources_file }}"
            state: absent
          when: cis_time_conf is defined and cis_time_conf is changed

        - name: time | restart chrony with the original configuration
          ansible.builtin.systemd:
            name: chrony
            state: restarted
          when: cis_time_conf is defined and cis_time_conf is changed

        - name: time | stop here
          ansible.builtin.fail:
            msg: >-
              chrony did not become synchronised against the new servers within
              {{ cis_time_sync_retries | int * cis_time_probe_delay | int }}
              seconds after the restart, or the edit itself failed. If
              chrony.conf had been changed in this run, it was put back, the
              new sources file was removed and chrony was restarted: the
              Debian pool applies again.

    # ── absent: back to what Debian ships ────────────────────────────────────
    - name: time | back to the stock upstream sources
      when: cis_time_state == 'absent'
      block:
        - name: time | remove the sources file
          ansible.builtin.file:
            path: "/etc/chrony/sources.d/{{ cis_time_sources_file }}"
            state: absent
          register: cis_time_src_gone

        - name: time | restore the commented-out pool/server lines
          ansible.builtin.replace:
            path: /etc/chrony/chrony.conf
            regexp: '^{{ cis_time_marker | regex_escape }}(.*)'
            replace: '\1'
          register: cis_time_conf_back

        - name: time | restart chrony (only if something changed)
          ansible.builtin.systemd:
            name: chrony
            state: restarted
          when: cis_time_src_gone is changed or cis_time_conf_back is changed

    - name: time | Report sources and tracking afterwards (read only)
      ansible.builtin.shell:
        cmd: |
          echo "== sources"
          chronyc -n sources 2>&1
          echo "== tracking"
          chronyc tracking 2>&1 | grep -E '^(Reference ID|Stratum|Leap status)'
          echo "== enabled / active"
          systemctl is-enabled chrony.service 2>&1
          systemctl is-active chrony.service 2>&1
        executable: /bin/bash
      register: cis_time_after
      changed_when: false
      failed_when: false
      check_mode: false

    - name: time | After
      ansible.builtin.debug:
        msg: "{{ cis_time_after.stdout_lines }}"

  cis_wave2_aide.yml: |-
    ---
    # Wave 2, AIDE. Numbers are those of the Wazuh SCA policy cis_debian13.
    #   6.3.1  aide and aide-common installed
    #   6.3.2  dailyaidecheck.timer active, dailyaidecheck.service enabled or static
    #
    # What the package alone would do, and why it is not left alone: the packaged
    # configuration walks the whole file system with 239 snippets for services this
    # host does not run, and the packaged unit has no resource limits. On this host
    # that means the kernel module trees (69000 files, 5 GB), the Proxmox storage
    # under /rpool (NFS exports, guest disks), and /etc/pve (a FUSE mount whose files
    # change all the time). Here the check reads the configuration, the boot chain,
    # the executables and libraries, the Proxmox login code, the login material of
    # root and the human accounts, and nothing else (aide-cis.conf lists it, with the
    # reasons). It runs once a night, niced, with idle IO priority, a memory ceiling
    # and a time limit.
    #
    # Logs, and why none can fill the disk:
    # - aide.log is written and rotated by the packaged script itself (savelog, seven
    #   generations, gzip; measured: 7.7 KB for eleven runs), so there is no logrotate
    #   file to add. aideinit.log and aideinit.errors are overwritten at every init.
    # - The journal gets exactly one line per run (cis-aide summary, ExecStopPost).
    # - The database is one file (about 100 KB) and the new one written by every
    #   check, nothing accumulates. COPYNEWDB stays no: the baseline only changes
    #   when somebody looks and runs  cis-aide accept --yes  . The same differences
    #   are therefore reported every night until then (still one line in the journal
    #   and a rotated, bounded report); this is deliberate, because a baseline that
    #   follows the file system silently would forgive the very change it is for.
    # - No mail (SILENTREPORTS=yes): the host has a mail transport, but the report is
    #   not meant to leave it.
    #
    # Order: this wave runs last in cis.yml, so that the baseline is taken after the
    # other waves have written their files. The check never starts from here; the
    # baseline is built here (cis-aide init), the nightly run is the packaged timer.
    #
    # Dry run: the read-only part runs (report, package plan); nothing is installed,
    # written or built.
    #
    # No dollar signs in this file: Flux substitutes them in the ConfigMap.
    - name: AIDE | the requested state and the numbers must be sane
      ansible.builtin.assert:
        that:
          - cis_aide_state in ['present', 'absent']
          - cis_aide_timer_time | string is match('[0-2][0-9]:[0-5][0-9]:[0-5][0-9]\Z')
          - cis_aide_timer_delay | int in range(0, 7201)
          - cis_aide_timeout | int >= 600
          - cis_aide_memory_max | string is match('[0-9]+[KMG]\Z')
          - cis_aide_memory_high | string is match('[0-9]+[KMG]\Z')
        fail_msg: >-
          cis_aide_state is '{{ cis_aide_state }}' (present or absent expected), or a
          value is out of range: the time as HH:MM:SS, a random delay of 0 to 7200
          seconds, a time limit of at least 600 seconds, memory as a number and K, M
          or G. Nothing was changed on the host.

    # The helper is read from /scripts for everything read only, so a dry run works
    # before it is installed. The installed copy (below, after the package guard, so
    # that a refused run changes nothing at all) is what the unit calls after a run.
    - name: AIDE | Report the state before (read only)
      ansible.builtin.script:
        cmd: /scripts/cis_aide.py status
      register: cis_aide_before
      changed_when: false
      failed_when: cis_aide_before.rc not in [0, 3]
      check_mode: false

    - name: AIDE | Before
      ansible.builtin.debug:
        msg: "{{ cis_aide_before.stdout_lines }}"

    # dpkg-query -s prints "Status: install ok installed" for an installed package and
    # exits non-zero for an unknown one; no format string needed.
    - name: AIDE | are the packages installed?
      ansible.builtin.command: dpkg-query -s {{ item }}
      loop: "{{ cis_aide_packages }}"
      register: cis_aide_pkg
      changed_when: false
      failed_when: false
      check_mode: false

    - name: AIDE | which of them are missing
      ansible.builtin.set_fact:
        cis_aide_missing: >-
          {{ cis_aide_pkg.results | rejectattr('stdout', 'search', 'install ok installed')
             | map(attribute='item') | list }}

    # /etc/aide and /etc/default/aide exist only once the package is in. In a dry run
    # nothing is installed, so the file tasks wait for the real run.
    - name: AIDE | can the files be written now?
      ansible.builtin.set_fact:
        cis_aide_can_write: "{{ (not ansible_check_mode) or (cis_aide_missing | length == 0) }}"

    # Fail closed, like the other installs: apt-get --simulate changes nothing, so
    # the plan is in the dry-run log, and anything that is not one of the expected
    # new packages, any installed package that would change and anything removed
    # stops the run. The list is what apt chose in a clean Debian 13 container
    # without recommends; a package of it that the host already has simply does not
    # show up as new. The recommends are off on purpose: with them apt would add a
    # mail server, cron and perl (measured).
    - name: AIDE | what apt would do
      ansible.builtin.command: apt-get --simulate -o APT::Install-Recommends=no install {{ cis_aide_missing | join(' ') }}
      register: cis_aide_sim
      changed_when: false
      check_mode: false
      when:
        - cis_aide_state == 'present'
        - cis_aide_missing | length > 0

    - name: AIDE | refuse unless it only adds the expected packages
      ansible.builtin.assert:
        that:
          - cis_aide_missing | difference(cis_aide_new) | length == 0
          - cis_aide_new | difference(cis_aide_pkg_allowed) | length == 0
          - cis_aide_changed | length == 0
          - cis_aide_gone | length == 0
        fail_msg: >-
          apt's plan for {{ cis_aide_missing | join(' ') }} is not just the expected new
          packages. New: {{ cis_aide_new | join(', ') | default('(none parsed)', true) }}.
          Unexpected among them: {{ cis_aide_new | difference(cis_aide_pkg_allowed) | join(', ') | default('none', true) }}.
          Would change an installed package: {{ cis_aide_changed | join(', ') | default('none', true) }}.
          Would remove: {{ cis_aide_gone | join(', ') | default('none', true) }}.
          Nothing was installed or changed; decide by hand.
        success_msg: "apt would add only: {{ cis_aide_new | join(', ') }}"
      vars:
        # Single backslashes and [^ ]+, never \S. "Inst name (" is a new package,
        # "Inst name [" an installed one that would change version.
        cis_aide_new: >-
          {{ cis_aide_sim.stdout | regex_findall('(?m)^Inst ([^ ]+) \(') | unique | list }}
        cis_aide_changed: >-
          {{ cis_aide_sim.stdout | regex_findall('(?m)^Inst ([^ ]+) \[') | unique | list }}
        cis_aide_gone: >-
          {{ cis_aide_sim.stdout | regex_findall('(?m)^(?:Remv|Purg) ([^ ]+)') | unique | list }}
      when:
        - cis_aide_state == 'present'
        - cis_aide_missing | length > 0

    # The package enables its own timer at install time (first run 01:50 plus up to
    # two hours) and starts nothing else. It writes no log and no mail (measured).
    # Not in a dry run: the apt module needs python3-apt there, and the plan above
    # is already the dry run's answer.
    - name: AIDE | install the packages (no recommends)
      ansible.builtin.apt:
        name: "{{ cis_aide_missing }}"
        state: present
        install_recommends: false
      when:
        - cis_aide_state == 'present'
        - cis_aide_missing | length > 0
        - not ansible_check_mode

    # ── present ──────────────────────────────────────────────────────────────────
    # Mode 0755, not 0750: the packaged service runs as _aide and so does its
    # ExecStopPost (cis-aide summary); with 0750 the unit failed every night with
    # status 203/EXEC although AIDE itself had run (found by starting the service in
    # a test, not by the play). The script holds nothing secret, and what needs root
    # (init, accept, check) tests for it.
    - name: AIDE | install the helper script
      ansible.builtin.copy:
        src: /scripts/cis_aide.py
        dest: /usr/local/sbin/cis-aide
        owner: root
        group: root
        mode: "0755"
      diff: false
      when: cis_aide_state == 'present'

    - name: AIDE | the configuration, only the paths that matter
      ansible.builtin.copy:
        src: /scripts/aide-cis.conf
        dest: /etc/aide/aide-cis.conf
        owner: root
        group: root
        mode: "0644"
        # aide parses the new file before it replaces the old one
        validate: aide --config=%s --config-check
      when:
        - cis_aide_state == 'present'
        - cis_aide_can_write | bool

    # /etc/default/aide is read by the packaged scripts, and the last assignment wins,
    # so the block goes at the end of the packaged file.
    - name: AIDE | settings of the packaged scripts
      ansible.builtin.blockinfile:
        path: /etc/default/aide
        marker: "# {mark} cis-aide"
        block: |
          # Managed by Ansible (proxmox-ansible, CIS wave 2: AIDE). The last assignment wins.
          CONFIG="/etc/aide/aide-cis.conf"
          COMMAND=update
          COPYNEWDB=no
          SILENTREPORTS=yes
      when:
        - cis_aide_state == 'present'
        - cis_aide_can_write | bool

    - name: AIDE | systemd drop-in directories
      ansible.builtin.file:
        path: "/etc/systemd/system/{{ item }}.d"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - dailyaidecheck.service
        - dailyaidecheck.timer
      when: cis_aide_state == 'present'

    # RuntimeMaxSec has no effect on a oneshot unit (systemd says so in the journal);
    # TimeoutStartSec is the limit that does. The packaged unit has no limit at all,
    # and four of eight workers of a cluster once died of memory because of a daily
    # AIDE run over a network file system.
    - name: AIDE | the check runs niced, with idle IO, bounded memory and a time limit
      ansible.builtin.copy:
        dest: /etc/systemd/system/dailyaidecheck.service.d/10-cis.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (proxmox-ansible, CIS wave 2: AIDE).
          [Service]
          Nice=19
          IOSchedulingClass=idle
          CPUWeight=10
          MemoryHigh={{ cis_aide_memory_high }}
          MemoryMax={{ cis_aide_memory_max }}
          TasksMax=64
          TimeoutStartSec={{ cis_aide_timeout }}
          ExecStopPost=/usr/local/sbin/cis-aide summary
      register: cis_aide_svc_dropin
      when: cis_aide_state == 'present'

    - name: AIDE | the check runs once a night, at a fixed time
      ansible.builtin.copy:
        dest: /etc/systemd/system/dailyaidecheck.timer.d/10-cis.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          # Managed by Ansible (proxmox-ansible, CIS wave 2: AIDE).
          [Timer]
          OnCalendar=
          OnCalendar=*-*-* {{ cis_aide_timer_time }}
          RandomizedDelaySec={{ cis_aide_timer_delay }}
      register: cis_aide_timer_dropin
      when: cis_aide_state == 'present'

    - name: AIDE | systemd reads the drop-ins
      ansible.builtin.systemd:
        daemon_reload: true
      when:
        - cis_aide_state == 'present'
        - cis_aide_svc_dropin is changed or cis_aide_timer_dropin is changed

    - name: AIDE | the timer is enabled and running (6.3.2)
      ansible.builtin.systemd:
        name: dailyaidecheck.timer
        enabled: true
        state: started
      when:
        - cis_aide_state == 'present'
        - cis_aide_can_write | bool

    - name: AIDE | the timer takes over the new schedule
      ansible.builtin.systemd:
        name: dailyaidecheck.timer
        state: restarted
      when:
        - cis_aide_state == 'present'
        - cis_aide_timer_dropin is changed
        - not ansible_check_mode

    # The baseline is built from the configuration that is on the host now, under the
    # same limits as the nightly run, and stamped with the configuration's checksum:
    # a changed configuration (Git) rebuilds it, nothing else does. status exits 3
    # when there is something to build.
    - name: AIDE | does the baseline match the configuration?
      ansible.builtin.script:
        cmd: /scripts/cis_aide.py status
      register: cis_aide_status
      changed_when: false
      failed_when: cis_aide_status.rc not in [0, 3]
      check_mode: false
      when: cis_aide_state == 'present'

    - name: AIDE | build the baseline
      ansible.builtin.command: /usr/local/sbin/cis-aide init --memory-high {{ cis_aide_memory_high }} --memory-max {{ cis_aide_memory_max }} --runtime-max {{ cis_aide_timeout }}
      register: cis_aide_init
      changed_when: cis_aide_init.rc == 0
      # 6: a check is running right now; the next run of this play builds it
      failed_when: cis_aide_init.rc not in [0, 6]
      when:
        - cis_aide_state == 'present'
        - not ansible_check_mode
        - cis_aide_status.rc == 3

    # Once, right after a new baseline, the whole nightly path is run for real: the
    # packaged service as _aide with our limits, then ExecStopPost and its journal
    # line. `cis-aide check` fails when systemd reports the service as failed, so a
    # unit that cannot run (a permission, a limit, a wrong path) stops this play
    # instead of failing silently at 02:30. A few differences in this first report
    # are possible (a daemon may rewrite a watched file within seconds of the
    # baseline); they are shown, they do not fail the play.
    - name: AIDE | one check right away, the way the timer will run it
      ansible.builtin.command: /usr/local/sbin/cis-aide check --max 15
      register: cis_aide_first
      changed_when: false
      when:
        - cis_aide_state == 'present'
        - not ansible_check_mode
        - cis_aide_init is changed

    - name: AIDE | First check
      ansible.builtin.debug:
        msg: "{{ cis_aide_first.stdout_lines }}"
      when: cis_aide_first is not skipped

    - name: AIDE | Baseline
      ansible.builtin.debug:
        msg: "{{ cis_aide_init.stdout_lines }}"
      when: cis_aide_init is changed

    # The two commands the policy runs for 6.3.2, run the same way.
    - name: AIDE | what the policy will see
      ansible.builtin.command: "{{ item }}"
      loop:
        - systemctl is-enabled dailyaidecheck.service
        - systemctl is-active dailyaidecheck.timer
      register: cis_aide_verify
      changed_when: false
      failed_when: false
      check_mode: false
      when:
        - cis_aide_state == 'present'
        - not ansible_check_mode

    - name: AIDE | the policy's checks must pass
      ansible.builtin.assert:
        that:
          - cis_aide_verify.results[0].stdout in ['static', 'enabled']
          - cis_aide_verify.results[1].stdout == 'active'
        fail_msg: >-
          After the changes the policy would not pass 6.3.2: the service reports
          '{{ cis_aide_verify.results[0].stdout }}' (static or enabled expected), the
          timer '{{ cis_aide_verify.results[1].stdout }}' (active expected).
        quiet: true
      when:
        - cis_aide_state == 'present'
        - not ansible_check_mode

    # ── absent ───────────────────────────────────────────────────────────────────
    # Takes the check out again: timer off (6.3.2 fails again), drop-ins, settings,
    # configuration, stamp and helper removed. The packages stay (6.3.1 keeps passing)
    # and so do the database and the logs; a later `present` rebuilds the baseline.
    - name: AIDE | switched off from Git, take it out again
      when: cis_aide_state == 'absent'
      block:
        - name: AIDE | stop and disable the timer
          ansible.builtin.systemd:
            name: dailyaidecheck.timer
            enabled: false
            state: stopped
          when: "'aide-common' not in cis_aide_missing"

        - name: AIDE | remove the drop-ins, the configuration, the stamp and the helper
          ansible.builtin.file:
            path: "{{ item }}"
            state: absent
          loop:
            - /etc/systemd/system/dailyaidecheck.service.d/10-cis.conf
            - /etc/systemd/system/dailyaidecheck.timer.d/10-cis.conf
            - /etc/aide/aide-cis.conf
            - /var/lib/aide/cis-config.sha256
            - /usr/local/sbin/cis-aide

        - name: AIDE | remove the settings block
          ansible.builtin.blockinfile:
            path: /etc/default/aide
            marker: "# {mark} cis-aide"
            state: absent
          when: "'aide-common' not in cis_aide_missing"

        - name: AIDE | systemd forgets the drop-ins
          ansible.builtin.systemd:
            daemon_reload: true
          when: not ansible_check_mode

    - name: AIDE | Report the state afterwards (read only)
      ansible.builtin.script:
        cmd: /scripts/cis_aide.py status
      register: cis_aide_after
      changed_when: false
      failed_when: cis_aide_after.rc not in [0, 3]
      check_mode: false

    - name: AIDE | After
      ansible.builtin.debug:
        msg: "{{ cis_aide_after.stdout_lines }}"
  cis_aide.py: |-
    #!/usr/bin/env python3
    """cis-aide: AIDE for CIS 6.3.1 and 6.3.2 on the Proxmox host.

    The packaged dailyaidecheck.service and timer do the nightly check; this helper
    builds the baseline under resource limits, writes one line about each check to
    the journal, and promotes a reviewed result to the new baseline.

      status    read only: packages, configuration, baseline, units, last check
                exit 0 when a baseline built from the current configuration exists,
                3 when it has to be (re)built
      init      (re)build the baseline: systemd-run with CPU, IO and memory limits
      last      the last check: verdict, totals and the first lines of its list
      check     run the nightly check now (clears the start limits of the packaged
                units first) and show it
      summary   one journal line about the last check (ExecStopPost of the service);
                removes stale temporary directories; never fails
      accept    promote the database the last check wrote (aide.db.new) to the
                baseline; refuses without --yes and shows what it would accept

    Exit codes: 0 ok, 2 accept without --yes, 3 status: baseline has to be (re)built,
    4 precondition not met, 5 the work failed, 6 init skipped because a check runs.

    No dollar signs anywhere in this file: Flux substitutes them in the ConfigMap.
    """
    import argparse
    import hashlib
    import os
    import pwd
    import re
    import shutil
    import subprocess
    import sys
    import time

    CONF = "/etc/aide/aide-cis.conf"
    DEFAULTS = "/etc/default/aide"
    DBDIR = "/var/lib/aide"
    DB = DBDIR + "/aide.db"
    DBNEW = DBDIR + "/aide.db.new"
    STAMP = DBDIR + "/cis-config.sha256"
    LOGDIR = "/var/log/aide"
    LOG = LOGDIR + "/aide.log"
    INITLOG = LOGDIR + "/aideinit.log"
    INITERR = LOGDIR + "/aideinit.errors"
    AIDEUSER = "_aide"
    TIMER = "dailyaidecheck.timer"
    SERVICE = "dailyaidecheck.service"
    KEEP_DAYS = 7
    # one line of a list_entries report: the attribute letters, a colon, the path
    ENTRY = re.compile(r"[A-Za-z!?][-+=.:<> A-Za-z]{10,24}: /")
    # AIDE does not count an attribute that was ADDED to or REMOVED from a file as a
    # difference (measured: a new file capability gives exit 0 and only this line,
    # printed before the report), so these lines are counted here as well.
    ATTRLINE = re.compile(r"Entry (/\S+) in databases has different attributes: (\S+)")

    def out(text=""):
        print(text, flush=True)

    def run(cmd, **kw):
        return subprocess.run(cmd, capture_output=True, text=True, **kw)

    def sha256_file(path):
        h = hashlib.sha256()
        with open(path, "rb") as f:
            for chunk in iter(lambda: f.read(1 << 20), b""):
                h.update(chunk)
        return h.hexdigest()

    def read_stamp():
        try:
            with open(STAMP) as f:
                return f.read().strip()
        except OSError:
            return ""

    def effective_defaults():
        """The last assignment of every KEY=value line in /etc/default/aide: the
        packaged scripts source that file, so the last one wins."""
        vals = {}
        try:
            with open(DEFAULTS) as f:
                for line in f:
                    m = re.match(r"\s*([A-Z_]+)=(.*)", line)
                    if m:
                        vals[m.group(1)] = m.group(2).strip().strip('"')
        except OSError:
            pass
        return vals

    def read_log():
        try:
            with open(LOG, errors="replace") as f:
                return f.read().splitlines()
        except OSError:
            return []

    def parse_log(lines):
        """Verdict, totals, baseline checksum, run time and entry lines of the log
        the packaged script writes after every check."""
        info = {"exit": None, "entries": None, "added": None, "removed": None,
                "changed": None, "sha": "", "seconds": None, "list": [], "attrs": []}
        want_sha = False
        for line in lines:
            m = ATTRLINE.search(line)
            if m:
                info["attrs"].append("%s %s" % (m.group(2), m.group(1)))
                continue
            m = re.match(r"AIDE returned with (?:a zero exit code|exit code (\d+))", line)
            if m:
                info["exit"] = int(m.group(1)) if m.group(1) else 0
            m = re.match(r"\s*(?:Total number of entries|Number of entries):\s+(\d+)", line)
            if m and info["entries"] is None:
                info["entries"] = int(m.group(1))
            for key, label in (("added", "Added entries"), ("removed", "Removed entries"),
                               ("changed", "Changed entries")):
                m = re.match(r"\s*%s:\s+(\d+)" % label, line)
                if m:
                    info[key] = int(m.group(1))
            if line.startswith("/") and "aide.db" in line and not info["sha"]:
                want_sha = True
                continue
            m = re.match(r"\s*SHA256\s*:\s*(\S+)", line)
            if m and want_sha and not info["sha"]:
                info["sha"] = m.group(1)[:16]
                want_sha = False
            m = re.match(r"End of AIDE daily aide check .*run time (\d+) seconds", line)
            if m:
                info["seconds"] = int(m.group(1))
            if ENTRY.match(line):
                info["list"].append(line)
        return info

    def owner_ids():
        pw = pwd.getpwnam(AIDEUSER)
        return pw.pw_uid, pw.pw_gid

    def cmd_status(args):
        need = False
        out("== packages")
        for p in ("aide", "aide-common"):
            r = run(["dpkg-query", "-s", p])
            if r.returncode == 0:
                keep = [l for l in r.stdout.splitlines() if l.startswith(("Status:", "Version:"))]
                out("  %s: %s" % (p, "; ".join(keep)))
            else:
                out("  %s: not installed" % p)
                need = True
        out("== configuration")
        if os.path.exists(CONF):
            sha = sha256_file(CONF)
            stamp = read_stamp()
            out("  %s sha256 %s" % (CONF, sha[:16]))
            out("  baseline built from: %s" % (stamp[:16] if stamp else "(no stamp)"))
            if stamp != sha:
                need = True
        else:
            out("  %s: absent" % CONF)
            need = True
        eff = effective_defaults()
        out("  /etc/default/aide, effective: " + ", ".join(
            "%s=%s" % (k, eff.get(k, "(unset)")) for k in ("CONFIG", "COMMAND", "COPYNEWDB", "SILENTREPORTS")))
        out("== baseline")
        for path in (DB, DBNEW):
            try:
                st = os.stat(path)
                out("  %s: %d bytes, %s, owner %s, mode %o" % (
                    path, st.st_size, time.strftime("%Y-%m-%d %H:%M", time.localtime(st.st_mtime)),
                    pwd.getpwuid(st.st_uid).pw_name, st.st_mode & 0o777))
            except OSError:
                out("  %s: absent" % path)
                if path == DB:
                    need = True
        out("== units")
        for unit, verb in ((TIMER, "is-enabled"), (TIMER, "is-active"), (SERVICE, "is-enabled")):
            r = run(["systemctl", verb, unit])
            out("  %s %s: %s" % (unit, verb, (r.stdout or r.stderr).strip() or "(no answer)"))
        r = run(["systemctl", "show", SERVICE, "-p", "MemoryHigh", "-p", "MemoryMax", "-p", "Nice",
                 "-p", "IOSchedulingClass", "-p", "RuntimeMaxUSec", "-p", "User"])
        out("  service limits: " + "; ".join(r.stdout.split()))
        r = run(["systemctl", "list-timers", TIMER, "--no-pager"])
        for line in r.stdout.splitlines()[:2]:
            out("  " + line.strip()[:150])
        out("== last check")
        info = parse_log(read_log())
        if info["exit"] is None:
            out("  no report yet")
        else:
            out("  aide exit %s, entries %s, added %s, removed %s, changed %s, %s s" % (
                info["exit"], info["entries"], info["added"], info["removed"], info["changed"],
                info["seconds"]))
        if os.path.isdir(LOGDIR):
            files = ["%s %d bytes" % (n, os.path.getsize(os.path.join(LOGDIR, n)))
                     for n in sorted(os.listdir(LOGDIR))]
            out("  files in %s: %s" % (LOGDIR, ", ".join(files) if files else "(none)"))
        else:
            out("  no log directory")
        return 3 if need else 0

    def cmd_init(args):
        if os.geteuid() != 0:
            out("init needs root")
            return 4
        if not os.path.exists(CONF) or not shutil.which("aide"):
            out("no configuration or no aide binary: nothing to initialise")
            return 4
        r = run(["systemctl", "is-active", SERVICE])
        if r.stdout.strip() in ("active", "activating"):
            out("a check is running right now; the baseline is left alone, the next run will build it")
            return 6
        r = run(["aide", "--config=" + CONF, "--config-check"])
        if r.returncode != 0:
            out("aide does not accept the configuration:")
            for line in (r.stdout + r.stderr).splitlines()[:20]:
                out("  " + line)
            return 4
        for stale in (INITERR, INITLOG):
            try:
                os.remove(stale)
            except OSError:
                pass
        start = time.time()
        cmd = ["systemd-run", "--quiet", "--wait", "--collect", "--pipe", "--unit=cis-aide-init",
               "-p", "Nice=19", "-p", "IOSchedulingClass=idle",
               "-p", "MemoryHigh=" + args.memory_high, "-p", "MemoryMax=" + args.memory_max,
               "-p", "TasksMax=64", "-p", "RuntimeMaxSec=%d" % args.runtime_max,
               "/usr/sbin/aideinit", "--yes", "--force", "--config", CONF]
        r = run(cmd)
        secs = int(time.time() - start)
        errs = []
        try:
            with open(INITERR, errors="replace") as f:
                errs = [l.rstrip() for l in f if l.strip()]
        except OSError:
            pass
        if r.returncode != 0 or errs or not os.path.exists(DB) or os.path.getmtime(DB) < start - 2:
            out("the baseline was NOT built (rc %d after %d s)" % (r.returncode, secs))
            for line in (r.stdout + r.stderr).splitlines()[:10]:
                out("  " + line)
            for line in errs[:20]:
                out("  aideinit.errors: " + line)
            return 5
        uid, gid = owner_ids()
        for path in (DB, DBNEW):
            if os.path.exists(path):
                os.chown(path, uid, gid)
                os.chmod(path, 0o600)
        with open(STAMP, "w") as f:
            f.write(sha256_file(CONF) + "\n")
        info = parse_log(open(INITLOG, errors="replace").read().splitlines()) if os.path.exists(INITLOG) else {}
        out("baseline built in %d s: %s entries, database sha256 %s..., size %d bytes" % (
            secs, info.get("entries"), info.get("sha"), os.path.getsize(DB)))
        return 0

    def cmd_last(args):
        lines = read_log()
        if not lines:
            out("no report in %s yet" % LOG)
            return 0
        info = parse_log(lines)
        for line in lines[:12]:
            if line.startswith(("aide run on", "AIDE returned", "AIDE produced")):
                out(line)
        for line in lines:
            if line.strip().startswith(("Total number of entries", "Added entries:", "Removed entries:", "Changed entries:")):
                out(line.rstrip())
        shown = info["list"][:args.max]
        for line in shown:
            out(line)
        if len(info["list"]) > len(shown):
            out("... and %d more entries in %s" % (len(info["list"]) - len(shown), LOG))
        for line in info["attrs"][:args.max]:
            out("attribute added or removed (not counted by AIDE as a change): " + line)
        return 0

    def cmd_check(args):
        """Run the nightly check now. The packaged units refuse a second start within
        a minute (buildcache) and two hours (the check); reset-failed clears both."""
        if os.geteuid() != 0:
            out("check needs root")
            return 4
        if not os.path.exists(DB):
            out("no baseline yet: run  cis-aide init  first")
            return 4
        run(["systemctl", "reset-failed", SERVICE, "dailyaidecheck-buildcache.service"])
        r = run(["systemctl", "start", SERVICE])
        if r.returncode != 0:
            out("the check did not run: " + (r.stderr or r.stdout).strip()[:300])
            return 5
        # The packaged service allows ONE start per two hours (StartLimitBurst=1), so a
        # check started by hand shortly before the timer would make systemd refuse the
        # timer's start. Clear the counter again once this one has succeeded.
        run(["systemctl", "reset-failed", SERVICE, "dailyaidecheck-buildcache.service"])
        return cmd_last(args)

    def cmd_summary(args):
        result = os.environ.get("SERVICE_RESULT", "unknown")
        try:
            fresh = time.time() - os.path.getmtime(LOG) < 6 * 3600
        except OSError:
            fresh = False
        info = parse_log(read_log()) if fresh else parse_log([])
        if info["exit"] == 0:
            # a clean report has no totals; say 0 rather than nothing
            for key in ("added", "removed", "changed"):
                if info[key] is None:
                    info[key] = 0
        if not fresh:
            verdict = "no-report"
        elif info["exit"] is None:
            # the packaged script wrote a log but AIDE never returned (no baseline,
            # lock, killed): that is an error, not an absence of news
            verdict = "error"
        elif info["exit"] == 0 and not info["attrs"]:
            verdict = "no-differences"
        elif info["exit"] in (0, 1, 2, 3, 4, 5, 6, 7):
            verdict = "differences"
        else:
            verdict = "error"
        if result != "success" and verdict == "no-differences":
            verdict = "error"
        # what the run cost, while the unit's control group still exists: peak memory
        # and CPU time, so the load can be judged from the journal alone
        peak_mb, cpu_s = "-", "-"
        r = run(["systemctl", "show", SERVICE, "-p", "MemoryPeak", "-p", "CPUUsageNSec"])
        for line in r.stdout.splitlines():
            key, _, val = line.partition("=")
            if val.isdigit() and key == "MemoryPeak":
                peak_mb = "%.1f" % (int(val) / 1048576.0)
            elif val.isdigit() and key == "CPUUsageNSec":
                cpu_s = "%.1f" % (int(val) / 1e9)
        out("aide-check result=%s service=%s aide_exit=%s entries=%s added=%s removed=%s changed=%s "
            "attributes_added_or_removed=%d baseline_sha256=%s seconds=%s peak_memory_mb=%s cpu_seconds=%s "
            "report=%s" % (
                verdict, result, info["exit"], info["entries"], info["added"], info["removed"],
                info["changed"], len(info["attrs"]), info["sha"] or "-", info["seconds"], peak_mb,
                cpu_s, LOG))
        # temporary directories an aborted run leaves behind
        try:
            for name in os.listdir(DBDIR):
                path = os.path.join(DBDIR, name)
                if (name.startswith("dailyaidecheck.old.") and os.path.isdir(path)
                        and not os.path.islink(path)
                        and time.time() - os.path.getmtime(path) > KEEP_DAYS * 86400):
                    shutil.rmtree(path, ignore_errors=True)
                    out("removed stale %s" % name)
        except OSError:
            pass
        return 0

    def cmd_accept(args):
        if os.geteuid() != 0:
            out("accept needs root")
            return 4
        if not (os.path.exists(DB) and os.path.exists(DBNEW)):
            out("need both %s and %s; run the check first (systemctl start %s)" % (DB, DBNEW, SERVICE))
            return 4
        if os.path.getmtime(DBNEW) <= os.path.getmtime(DB):
            out("%s is not newer than the baseline: nothing to accept" % DBNEW)
            return 0
        out("the last check found this, and --yes makes it the baseline:")
        cmd_last(argparse.Namespace(max=args.max))
        if not args.yes:
            out("nothing changed (add --yes to accept)")
            return 2
        tmp = DB + ".tmp"
        shutil.copyfile(DBNEW, tmp)
        uid, gid = owner_ids()
        os.chown(tmp, uid, gid)
        os.chmod(tmp, 0o600)
        with open(tmp, "rb") as f:
            os.fsync(f.fileno())
        os.replace(tmp, DB)
        sha = sha256_file(DB)
        run(["logger", "-t", "cis-aide", "baseline accepted by an operator, sha256 of the file %s" % sha[:16]])
        out("baseline replaced (file sha256 %s...)" % sha[:16])
        return 0

    def main():
        ap = argparse.ArgumentParser(prog="cis-aide")
        sub = ap.add_subparsers(dest="cmd", required=True)
        sub.add_parser("status")
        p = sub.add_parser("init")
        p.add_argument("--memory-high", default="256M")
        p.add_argument("--memory-max", default="512M")
        p.add_argument("--runtime-max", type=int, default=1800)
        p = sub.add_parser("last")
        p.add_argument("--max", type=int, default=40)
        p = sub.add_parser("check")
        p.add_argument("--max", type=int, default=40)
        sub.add_parser("summary")
        p = sub.add_parser("accept")
        p.add_argument("--yes", action="store_true")
        p.add_argument("--max", type=int, default=40)
        args = ap.parse_args()
        fn = {"status": cmd_status, "init": cmd_init, "last": cmd_last, "check": cmd_check,
              "summary": cmd_summary, "accept": cmd_accept}[args.cmd]
        sys.exit(fn(args))

    if __name__ == "__main__":
        main()
  aide-cis.conf: |
    # Managed by Ansible (proxmox-ansible, CIS wave 2: AIDE). Do not edit here.
    #
    # NOT the Debian default configuration: that one walks the whole file system and
    # pulls in 239 snippets for services this host does not run. This file covers the
    # configuration and the usual places to hide something or to tamper with the
    # host, nothing else. The Proxmox storage trees, NFS exports, guests' disks and
    # the kernel module trees (68911 files in ten kernel versions) are not read.

    database_in=file:/var/lib/aide/aide.db
    database_out=file:/var/lib/aide/aide.db.new
    database_new=file:/var/lib/aide/aide.db.new
    gzip_dbout=yes

    # One worker, so a check cannot take more than one CPU. Warnings and errors only.
    num_workers=1
    log_level=warning

    # One line per added, removed or changed entry, with the letters that say which
    # attribute changed, plus the totals and the checksum of the database. The
    # per-attribute details are left out on purpose (a long report is what fills
    # the log after a package upgrade); for them run:
    #   aide --config=/etc/aide/aide-cis.conf --check --report-level=changed_attributes
    report_level=list_entries
    database_attrs=sha256

    # What is compared. No inode, no times, no block count, no size: packages and
    # daemons rewrite identical files all the time (pve-daily-update rewrites
    # /etc/apt/apt.conf.d/76pveproxy every morning), and on ZFS the size of a
    # directory is its number of entries. The checksum covers the content of a
    # file; mode, owner, type, link count and link target cover the rest.
    Content   = p+ftype+u+g+n+l+sha256
    # Executables and libraries: the same, plus file capabilities (setcap is a
    # classic way to leave a root shell behind).
    Binary    = Content+caps
    # The password databases change whenever somebody changes a password (the owner
    # did on 2026-10-17, the nightly play sets the FTP account's password): who owns
    # them and who may read them is what matters here.
    PermsOnly = p+ftype+u+g+n

    # ---- configuration ---------------------------------------------------------
    /etc Content
    # /etc/pve is the pmxcfs FUSE mount: virtual, changing content (the ticket key is
    # rewritten every day, the firewall files by every run, one file per guest).
    # Only the files that decide who may log in and what the storage is are
    # watched; the negative lookahead lets exactly those paths through. The
    # unprivileged account of the check can read them (measured on the host).
    !/etc/pve/(?!((user|domains|datacenter|storage)\.cfg|pve-root-ca\.pem|priv|priv/authorized_keys|priv/token\.cfg)\z)
    !/etc/ld\.so\.cache\z
    !/etc/mtab\z
    !/etc/adjtime\z
    # ZFS event daemon caches: rewritten when a dataset or pool property changes
    # (every new guest disk), nothing an attacker would use.
    !/etc/zfs/zpool\.cache\z
    !/etc/zfs/zfs-list\.cache
    !/etc/openvswitch/conf\.db
    !/etc/openvswitch/\.conf\.db
    !/etc/lvm/(archive|backup|cache)
    /etc/(shadow|gshadow)-?\z PermsOnly
    /etc/security/opasswd(\.old)?\z PermsOnly

    # ---- boot chain ------------------------------------------------------------
    /boot Content
    !/boot/efi
    !/boot/grub/grubenv\z

    # ---- executables, libraries, units -----------------------------------------
    /usr/bin Binary
    /usr/sbin Binary
    /usr/local Binary
    /usr/libexec Binary
    /usr/lib/x86_64-linux-gnu Binary
    /usr/lib/openssh Binary
    /usr/lib/zfs-linux Binary
    /usr/lib/dbus-1\.0 Binary
    /usr/lib/systemd Content
    /usr/lib/udev Content
    /usr/lib/(modprobe|sysctl|tmpfiles|sysusers|binfmt)\.d Content
    /usr/share/keyrings Content
    =/(bin|sbin|lib|lib64)\z Content

    # ---- Proxmox: the web interface, the API and the login code ----------------
    /usr/share/perl5/PVE Content
    /usr/share/perl5/Proxmox Content
    /usr/share/pve-manager Content
    /usr/share/javascript/proxmox-widget-toolkit Content

    # ---- login material of root and the human accounts -------------------------
    =/root\z PermsOnly
    /root/\.ssh Content
    /root/\.(bashrc|profile|bash_profile|bash_logout|forward)\z Content
    =/home\z PermsOnly
    =/home/[^/]+\z PermsOnly
    /home/[^/]+/\.ssh Content
    /home/[^/]+/\.(bashrc|profile|bash_profile|bash_logout|forward)\z Content
    /var/spool/cron Content
  cis_wave3_ssh.yml: |-
    ---
    # Wave 3, SSH access list. Wazuh SCA 5.1.4 reads `sshd -T` and wants an
    # AllowUsers (or AllowGroups, DenyUsers, DenyGroups) line. Decided
    # 2026-10-17: AllowUsers root ansible and the admin account. The nightly run
    # connects as root (bootstrap play) and as ansible (everything else), the
    # admin account is the human; the scanner account is FTP only.
    #
    # The list lives in a drop-in, /etc/ssh/sshd_config.d/10-cis-allowusers.conf,
    # which the sshd_config of hardening.yml includes by that one fixed path (no
    # glob, so no unknown file is ever picked up). The include of a file that does
    # not exist is harmless (sshd -t and sshd accept it, measured with OpenSSH
    # 10.0p1); that is the state until this wave has written the file.
    #
    # A wrong list locks people out, and the Job connects over SSH, so the change
    # is made in this order and nothing else:
    #   1. Only in a run that changes the list: PROBE. A second sshd on 127.0.0.1
    #      with a copy of the real sshd_config and the new list; every listed user
    #      must get in with a throwaway key, and a control with a list naming only
    #      a bogus account must refuse the first one. The real sshd is not touched.
    #      The probe is run from /scripts, it is not left on the host.
    #   2. Write the drop-in, `sshd -t`, restart sshd (the commands of the
    #      Restart sshd handler in hardening.yml).
    #   3. FRESH logins from the Job pod as root and as ansible, each one a new
    #      ssh process with ControlPath=none. The check cannot use Ansible's own
    #      connection: it is persistent, survives the restart, and would say "all
    #      is well" even if no new login worked.
    #   4. If anything in 2 or 3 fails: put the previous state back (previous
    #      content, or no file) and restart sshd, through that very persistent
    #      connection, which is still open because a restart keeps established
    #      sessions (the unit has KillMode=process). Then the run fails, loudly.
    # A night on which the list is already right does none of this: no probe, no
    # restart, no login.
    #
    # fail2ban here bans an address after 4 failures in 10 minutes (jail sshd,
    # 2 hours); its whitelist is loopback, allowed_ip and the OPNsense peer
    # 192.168.100.1, which is where the Job's logins come from (all accepted
    # logins of a week came from it). Before the peer was whitelisted the Job was
    # assumed NOT to be exempt, and the steps below still keep failures few. A
    # login refused by AllowUsers counts once (measured with the shipped filter in
    # a container), so step 3 makes one attempt per account, at most two failures,
    # and the probe, which runs on loopback, is not seen from outside.
    #
    # What the probe leaves in auth.log: PAM writes "session opened/closed for
    # user NAME" for each probe login to syslog directly (sshd's own lines stay on
    # the probe's stderr). Wazuh rules 5501/5502 (level 3) alert on those lines.
    # One burst, only in the run that changes the list, and the reason it is not
    # run every night. No wtmp entry is written.
    #
    # Not verified here: that the admin account's real key works (the probe uses
    # its own key to test the AllowUsers decision, not the account's
    # authorized_keys; that file is untouched by this wave), and what the running
    # daemon does with a user that is NOT listed (the probe's control covers a
    # second daemon with the same configuration).
    #
    # No dollar signs in this file: Flux substitutes them in the ConfigMap.
    - name: ssh access | the requested state and list must make sense
      ansible.builtin.assert:
        that:
          - cis_ssh_access_state in ['present', 'absent']
          - "'root' in cis_ssh_allow_users"
          - "'ansible' in cis_ssh_allow_users"
          - ansible_user | default('ansible') in cis_ssh_allow_users or cis_ssh_access_state == 'absent'
          - cis_ssh_allow_users | unique | length == cis_ssh_allow_users | length
          - cis_ssh_allow_users | reject('match', '[a-z_]') | list | length == 0
          - cis_ssh_allow_users | select('search', '[^a-z0-9_-]') | list | length == 0
        fail_msg: >-
          cis_ssh_access_state is '{{ cis_ssh_access_state }}' (present or absent
          expected), or cis_ssh_allow_users ({{ cis_ssh_allow_users | join(' ') }})
          lacks root or ansible (the nightly run connects as both), has
          duplicates, or holds something that is not a plain account name.
          Nothing was changed on the host.

    - name: ssh access | every listed account must exist
      ansible.builtin.getent:
        database: passwd
        key: "{{ item }}"
      loop: "{{ cis_ssh_allow_users }}"
      when: cis_ssh_access_state == 'present'

    - name: ssh access | sshd_config must include the drop-in
      ansible.builtin.command: grep -c -x -F 'Include {{ cis_ssh_dropin }}' /etc/ssh/sshd_config
      register: cis_ssh_inc
      changed_when: false
      failed_when: cis_ssh_inc.rc > 1
      check_mode: false

    # In a dry run the Include line may not be there yet: hardening.yml adds it
    # in the same run and, being a dry run, has not.
    - name: ssh access | sshd_config must include the drop-in (result)
      ansible.builtin.assert:
        that: cis_ssh_inc.rc == 0
        fail_msg: >-
          /etc/ssh/sshd_config has no line "Include {{ cis_ssh_dropin }}"; the
          sshd_config deployed by hardening.yml carries it. Without it a drop-in
          would be ignored. Nothing was changed.
      when:
        - cis_ssh_access_state == 'present'
        - not ansible_check_mode

    - name: ssh access | Read the current state (read only)
      ansible.builtin.shell:
        cmd: |
          echo "== include lines in sshd_config"
          grep -n -i '^include' /etc/ssh/sshd_config
          echo "== sshd_config.d"
          ls -l /etc/ssh/sshd_config.d 2>&1
          echo "== effective, from sshd -T"
          /usr/sbin/sshd -T 2>&1 | grep -i -E '^(allowusers|allowgroups|denyusers|denygroups|permitrootlogin|authenticationmethods|usepam) ' || true
        executable: /bin/bash
      register: cis_ssh_before
      changed_when: false
      failed_when: false
      check_mode: false

    - name: ssh access | Before
      ansible.builtin.debug:
        msg: "{{ cis_ssh_before.stdout_lines }}"

    - name: ssh access | what the drop-in says now
      ansible.builtin.slurp:
        src: "{{ cis_ssh_dropin }}"
      register: cis_ssh_cur
      failed_when: false

    - name: ssh access | what it should say, and whether that is a change
      ansible.builtin.set_fact:
        cis_ssh_have: "{{ (cis_ssh_cur.content | b64decode) if cis_ssh_cur.content is defined else '' }}"
        cis_ssh_exists: "{{ cis_ssh_cur.content is defined }}"
        cis_ssh_want: |
          # Managed by proxmox-ansible (CIS wave 3, SSH access list). Do not edit.
          # Wazuh SCA 5.1.4 reads sshd -T. root and ansible must stay on the list:
          # the nightly run connects as both.
          AllowUsers {{ cis_ssh_allow_users | join(' ') }}

    - name: ssh access | is the drop-in to change?
      ansible.builtin.set_fact:
        cis_ssh_need: "{{ (cis_ssh_have != cis_ssh_want) if cis_ssh_access_state == 'present' else cis_ssh_exists }}"

    - name: ssh access | sshd_config.d exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: cis_ssh_access_state == 'present'

    # ── present ──────────────────────────────────────────────────────────────
    - name: ssh access | (dry run) what would be written
      ansible.builtin.copy:
        dest: "{{ cis_ssh_dropin }}"
        content: "{{ cis_ssh_want }}"
        owner: root
        group: root
        mode: "0644"
      when:
        - cis_ssh_access_state == 'present'
        - ansible_check_mode

    - name: ssh access | change the list, check, and roll back on failure
      when:
        - cis_ssh_access_state == 'present'
        - cis_ssh_need | bool
        - not ansible_check_mode
      block:
        - name: ssh access | probe the new list on a second sshd (loopback, nothing real is touched)
          ansible.builtin.script:
            cmd: /scripts/cis_ssh_probe.py --config /etc/ssh/sshd_config --allow {{ cis_ssh_allow_users | join(' ') }}
          register: cis_ssh_probe
          changed_when: false

        - name: ssh access | Probe
          ansible.builtin.debug:
            msg: "{{ cis_ssh_probe.stdout_lines }}"

        - name: ssh access | write the drop-in
          ansible.builtin.copy:
            dest: "{{ cis_ssh_dropin }}"
            content: "{{ cis_ssh_want }}"
            owner: root
            group: root
            mode: "0644"
          register: cis_ssh_written

        - name: ssh access | sshd must accept the configuration
          ansible.builtin.command: /usr/sbin/sshd -t
          changed_when: false

        - name: ssh access | restart sshd
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              /usr/sbin/sshd -t
              if systemctl is-active --quiet ssh.service; then
                systemctl restart ssh.service
              elif systemctl is-active --quiet ssh.socket; then
                systemctl restart ssh.socket
              else
                systemctl start ssh.service
              fi
            executable: /bin/bash
          register: cis_ssh_restart
          changed_when: true

        # A fresh ssh process each time: ControlPath=none, no multiplexing. One
        # attempt per account, so a refusal counts once for fail2ban.
        - name: ssh access | a fresh login still works, as root and as ansible
          ansible.builtin.command:
            argv:
              - ssh
              - -F
              - /dev/null
              - -i
              - "{{ item.key }}"
              - -o
              - IdentitiesOnly=yes
              - -o
              - BatchMode=yes
              - -o
              - ControlMaster=no
              - -o
              - ControlPath=none
              - -o
              - StrictHostKeyChecking=no
              - -o
              - UserKnownHostsFile=/dev/null
              - -o
              - ConnectTimeout=20
              - -o
              - ConnectionAttempts=1
              - -l
              - "{{ item.user }}"
              - "{{ hostvars[inventory_hostname]['ansible_host'] }}"
              - echo cis-login-ok
          loop:
            - user: root
              key: "{{ hostvars[groups['proxmox_root'][0]]['ansible_ssh_private_key_file'] }}"
            - user: ansible
              key: "{{ hostvars[inventory_hostname]['ansible_ssh_private_key_file'] }}"
          loop_control:
            label: "{{ item.user }}"
          delegate_to: localhost
          become: false
          register: cis_ssh_fresh
          changed_when: false
          failed_when: cis_ssh_fresh.rc != 0 or 'cis-login-ok' not in cis_ssh_fresh.stdout

        - name: ssh access | the new list as sshd reports it
          ansible.builtin.command: /usr/sbin/sshd -T
          register: cis_ssh_effective
          changed_when: false
          failed_when: >-
            cis_ssh_effective.stdout_lines
            | select('match', '(?i)allowusers ')
            | map('regex_replace', '(?i)^allowusers ', '')
            | sort | list != cis_ssh_allow_users | sort | list
      rescue:
        - name: ssh access | roll back, put the previous content back
          ansible.builtin.copy:
            dest: "{{ cis_ssh_dropin }}"
            content: "{{ cis_ssh_have }}"
            owner: root
            group: root
            mode: "0644"
          when:
            - cis_ssh_written is defined
            - cis_ssh_written is changed
            - cis_ssh_exists | bool

        - name: ssh access | roll back, there was no drop-in before
          ansible.builtin.file:
            path: "{{ cis_ssh_dropin }}"
            state: absent
          when:
            - cis_ssh_written is defined
            - cis_ssh_written is changed
            - not (cis_ssh_exists | bool)

        - name: ssh access | roll back, restart sshd with what was there before
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              /usr/sbin/sshd -t
              if systemctl is-active --quiet ssh.service; then
                systemctl restart ssh.service
              elif systemctl is-active --quiet ssh.socket; then
                systemctl restart ssh.socket
              else
                systemctl start ssh.service
              fi
            executable: /bin/bash
          changed_when: true
          when:
            - cis_ssh_written is defined
            - cis_ssh_written is changed
            - cis_ssh_restart is defined

        - name: ssh access | stop here
          ansible.builtin.fail:
            msg: >-
              Changing the SSH access list failed (the output above shows at which
              step: probe, write, sshd -t, restart, a fresh login as root or
              ansible, or the effective list). If the drop-in had been written, it
              was put back as it was before (or removed, if there was none) and
              sshd was restarted through the connection of this run. Nothing else
              was changed.

    # ── absent: widen access again ───────────────────────────────────────────
    - name: ssh access | take the access list out again
      when: cis_ssh_access_state == 'absent'
      block:
        - name: ssh access | remove the drop-in
          ansible.builtin.file:
            path: "{{ cis_ssh_dropin }}"
            state: absent
          register: cis_ssh_removed

        - name: ssh access | restart sshd (only if the drop-in was there)
          ansible.builtin.shell:
            cmd: |
              set -euo pipefail
              /usr/sbin/sshd -t
              if systemctl is-active --quiet ssh.service; then
                systemctl restart ssh.service
              elif systemctl is-active --quiet ssh.socket; then
                systemctl restart ssh.socket
              else
                systemctl start ssh.service
              fi
            executable: /bin/bash
          changed_when: true
          when: cis_ssh_removed is changed

    - name: ssh access | Read the state afterwards (read only)
      ansible.builtin.shell:
        cmd: |
          echo "== effective, from sshd -T"
          /usr/sbin/sshd -T 2>&1 | grep -i -E '^(allowusers|allowgroups|denyusers|denygroups) ' || echo "(no access list)"
          echo "== sshd active"
          systemctl is-active ssh.service ssh.socket 2>&1
        executable: /bin/bash
      register: cis_ssh_after
      changed_when: false
      failed_when: false
      check_mode: false

    - name: ssh access | After
      ansible.builtin.debug:
        msg: "{{ cis_ssh_after.stdout_lines }}"

  cis_ssh_probe.py: |-
    #!/usr/bin/env python3
    """Would sshd, with this AllowUsers list, still let the people in who need it?

    Starts a SECOND sshd on 127.0.0.1 (random port, own host key, its own log on
    stderr instead of syslog) from a copy of the real sshd_config, with the
    candidate AllowUsers list, and logs in to it as every listed user with a
    throwaway key. Then a control: the same daemon with an AllowUsers list that
    names only an account that does not exist must REFUSE the first user, and say
    so ("not listed in AllowUsers"). Without the control, "everyone got in" could
    just mean that AllowUsers was ignored.

    The real sshd, its configuration and its port are never touched.

    What the probe DOES leave behind (measured in a Debian 13 container with
    rsyslog): sshd's own lines about the probe daemon go to its stderr (-e), not
    to syslog, so "Accepted publickey" never reaches auth.log. PAM, however,
    writes to syslog directly, so each successful probe login leaves two lines in
    auth.log, "sshd-session: pam_unix(sshd:session): session opened/closed for
    user NAME(uid=N) by NAME(uid=0)", without a PID. The Wazuh rules 5501 and
    5502 (level 3) alert on exactly those lines. The login attempts use -N: they
    authenticate and hang up, no session is opened and wtmp is not written
    (measured with a control login that has a PTY). The caller should therefore
    run the probe only when the list is about to change, not every night.

    Directives the probe sets itself (listen address, port, host key, pid file,
    authorized keys, StrictModes, Banner) and AllowUsers are dropped from the
    copy; everything else (AuthenticationMethods, PermitRootLogin, UsePAM, ...)
    is what the real daemon runs with. A Match block, AllowGroups, DenyUsers or
    DenyGroups is not modelled: if the file has one, the probe refuses to run.

    usage: cis-ssh-probe --config /etc/ssh/sshd_config --allow USER [USER ...]
    Exit 0 and "result: ok" if every check holds; anything else is a failure.
    """
    import argparse
    import os
    import re
    import select
    import shutil
    import socket
    import subprocess
    import sys
    import tempfile
    import time

    SSHD = "/usr/sbin/sshd"
    SSH = "/usr/bin/ssh"
    KEYGEN = "/usr/bin/ssh-keygen"
    BOGUS_USER = "cis-probe-nobody"

    # Set by the probe itself or replaced by the candidate list.
    DROPPED = {
        "port", "listenaddress", "addressfamily", "hostkey", "pidfile",
        "authorizedkeysfile", "strictmodes", "banner", "include", "allowusers",
    }

    # Other access lists would change what AllowUsers means (all of them must
    # agree). The probe does not model them; dropping them would make it say "ok"
    # where the real daemon says no, so it refuses instead.
    REFUSED = {"allowgroups", "denyusers", "denygroups"}

    def fail(msg):
        print("result: FAILED - " + msg)
        sys.exit(1)

    def free_port():
        s = socket.socket()
        s.bind(("127.0.0.1", 0))
        port = s.getsockname()[1]
        s.close()
        return port

    def probe_config(real_text, port, workdir, allow):
        kept = []
        for line in real_text.splitlines():
            s = line.strip()
            if s and not s.startswith("#"):
                word = re.split(r"[\s=]+", s, maxsplit=1)[0].lower()
                if word == "match":
                    fail("sshd_config has a Match block, which this probe does not "
                         "model; nothing was changed")
                if word in REFUSED:
                    fail("sshd_config has a %s line, which this probe does not model; "
                         "nothing was changed" % word)
                if word in DROPPED:
                    continue
            kept.append(line)
        head = [
            "Port %d" % port,
            "ListenAddress 127.0.0.1",
            "AddressFamily inet",
            "HostKey %s/hostkey" % workdir,
            "PidFile %s/sshd.pid" % workdir,
            "AuthorizedKeysFile %s/authorized_keys" % workdir,
            "StrictModes no",
            "Banner none",
        ]
        tail = ["AllowUsers " + " ".join(allow)]
        return "\n".join(head + kept + tail) + "\n"

    def start_daemon(workdir, name, text, port):
        cfg = os.path.join(workdir, name + ".conf")
        with open(cfg, "w") as f:
            f.write(text)
        # sshd -t first: a config that does not parse says why, instead of an
        # opaque timeout waiting for the port.
        t = subprocess.run([SSHD, "-t", "-f", cfg], capture_output=True, text=True)
        if t.returncode != 0:
            fail("sshd -t on the probe configuration failed: " + t.stderr.strip()[-300:])
        log = open(os.path.join(workdir, name + ".log"), "w")
        proc = subprocess.Popen([SSHD, "-D", "-e", "-f", cfg], stdin=subprocess.DEVNULL,
                                stdout=log, stderr=log)
        deadline = time.time() + 10
        while time.time() < deadline:
            if proc.poll() is not None:
                fail("the probe sshd exited at once: " + read_tail(workdir, name))
            try:
                socket.create_connection(("127.0.0.1", port), timeout=1).close()
                return proc
            except OSError:
                time.sleep(0.2)
        proc.kill()
        fail("the probe sshd did not open its port in time")

    def read_tail(workdir, name, n=400):
        try:
            with open(os.path.join(workdir, name + ".log")) as f:
                return f.read()[-n:].strip()
        except OSError:
            return "(no log)"

    def stop_daemon(proc):
        if proc is not None and proc.poll() is None:
            proc.terminate()
            try:
                proc.wait(timeout=5)
            except subprocess.TimeoutExpired:
                proc.kill()
                proc.wait()

    def try_login(port, key, user):
        """True if sshd authenticated this user. -N: hang up straight after."""
        cmd = [
            SSH, "-F", "/dev/null", "-v", "-N", "-i", key,
            "-o", "IdentitiesOnly=yes", "-o", "BatchMode=yes",
            "-o", "StrictHostKeyChecking=no", "-o", "UserKnownHostsFile=/dev/null",
            "-o", "ControlMaster=no", "-o", "ControlPath=none",
            "-o", "ConnectTimeout=10", "-p", str(port), "-l", user, "127.0.0.1",
        ]
        p = subprocess.Popen(cmd, stdin=subprocess.DEVNULL, stdout=subprocess.DEVNULL,
                             stderr=subprocess.PIPE)
        fd = p.stderr.fileno()
        seen = b""
        ok = False
        deadline = time.time() + 20
        while time.time() < deadline:
            r, _, _ = select.select([fd], [], [], 0.5)
            if r:
                chunk = os.read(fd, 4096)
                if not chunk:
                    break
                seen += chunk
                if b"Authenticated to" in seen or b"Authentication succeeded" in seen:
                    ok = True
                    break
            elif p.poll() is not None:
                break
        p.kill()
        p.wait()
        last = seen.decode(errors="replace").strip().splitlines()[-1:] or [""]
        return ok, last[0][:160]

    def main():
        ap = argparse.ArgumentParser()
        ap.add_argument("--config", default="/etc/ssh/sshd_config")
        ap.add_argument("--allow", nargs="+", required=True)
        args = ap.parse_args()

        for u in args.allow:
            if not re.fullmatch(r"[a-z_][a-z0-9_-]*", u):
                fail("user name %r is not a plain account name" % u)
        if os.geteuid() != 0:
            fail("must run as root")
        for tool in (SSHD, SSH, KEYGEN):
            if not os.access(tool, os.X_OK):
                fail(tool + " is missing")
        real = open(args.config).read()

        # sshd's privilege-separation directory; it is normally there while the
        # real sshd runs, and sshd refuses to start without it.
        os.makedirs("/run/sshd", mode=0o755, exist_ok=True)

        workdir = tempfile.mkdtemp(prefix="cis-ssh-probe-", dir="/run")
        # The probe sshd reads authorized_keys as the user it authenticates, so
        # the directory must be traversable. Only public material is readable.
        os.chmod(workdir, 0o755)
        daemons = []
        try:
            for kind in ("hostkey", "client"):
                subprocess.run([KEYGEN, "-q", "-t", "ed25519", "-N", "", "-C", "cis-ssh-probe",
                                "-f", os.path.join(workdir, kind)], check=True)
            shutil.copy(os.path.join(workdir, "client.pub"),
                        os.path.join(workdir, "authorized_keys"))
            os.chmod(os.path.join(workdir, "authorized_keys"), 0o644)
            key = os.path.join(workdir, "client")

            port = free_port()
            print("probe: candidate AllowUsers %s on 127.0.0.1:%d" % (" ".join(args.allow), port))
            d = start_daemon(workdir, "candidate",
                             probe_config(real, port, workdir, args.allow), port)
            daemons.append(d)
            bad = []
            for user in args.allow:
                ok, last = try_login(port, key, user)
                print("probe: login %-16s %s" % (user, "ok" if ok else "REFUSED (" + last + ")"))
                if not ok:
                    bad.append(user)
            stop_daemon(d)
            if bad:
                fail("these users could not log in with the candidate configuration: "
                     + ", ".join(bad) + ". Daemon log: " + read_tail(workdir, "candidate"))

            port2 = free_port()
            d2 = start_daemon(workdir, "control",
                              probe_config(real, port2, workdir, [BOGUS_USER]), port2)
            daemons.append(d2)
            first = args.allow[0]
            ok, last = try_login(port2, key, first)
            stop_daemon(d2)
            said = "not listed in AllowUsers" in read_tail(workdir, "control", 4000)
            print("probe: control, AllowUsers names only %s: %s %s; log says 'not listed in "
                  "AllowUsers': %s" % (BOGUS_USER, first, "got in" if ok else "refused",
                                       "yes" if said else "no"))
            if ok or not said:
                fail("the control did not behave: AllowUsers does not seem to be enforced by "
                     "this sshd, so the logins above prove nothing")
            print("result: ok")
        finally:
            for d in daemons:
                stop_daemon(d)
            shutil.rmtree(workdir, ignore_errors=True)

    if __name__ == "__main__":
        main()

  cis_wave3_pam.yml: |-
    ---
    # Wave 3, PAM. Numbers are those of the Wazuh SCA policy cis_debian13.
    #
    # PAM is shared by sshd, sudo, su, login, vsftpd and the PVE web login (there
    # is no /etc/pam.d/proxmox-ve-auth on this host, so it falls back to `other`
    # and with it to common-auth), and a broken stack can lock out the very
    # connection that is changing it, sudo included. Nothing here changes PAM
    # unguarded. The work is done by /usr/local/sbin/cis-pam (cis_pam.py), which
    # takes a snapshot first and starts a systemd timer that puts it back after
    # cis_pam_guard_seconds unless this play commits. If this play, the Job or the
    # connection dies half way, the host returns to where it was by itself.
    #
    # What changes, with the verdicts the real Wazuh agent 4.14.8 gave for it in a
    # container whose 5.3.x verdicts matched the host's in all 25 checks:
    #   5.3.2.2   pam_faillock in common-auth and common-account
    #   5.3.2.4   pam_pwhistory in common-password
    #   5.3.3.4.1 pam_unix without nullok (a profile that replaces the packaged one)
    #   5.3.3.4.4 use_authtok (comes with pam_pwhistory in front of pam_unix)
    #   5.3.1.3   libpam-pwquality installed
    #   5.3.3.2.8 (was not applicable) passes through a commented line in the
    #             pwquality.conf the package ships; nothing is enforced for root
    # Nothing gets worse. Not pursued: 5.3.2.3 (the rule has a literal (d+)),
    # 5.3.3.2.1 to .7 (rules on d:/.../* that the agent does not evaluate),
    # 5.3.3.3.1 to .3 (see below).
    #
    # Decided and measured:
    # - The numbers are in faillock.conf (deny 5, unlock_time 900) and in
    #   pwhistory.conf (remember 24), not in the PAM lines. 5.3.3.4.2 searches the
    #   common-* files for the word "remember" and passes today; with it in the
    #   PAM line it would fail, and 5.3.3.3.1 wants exactly that. They cannot both
    #   pass. The remember value in pwhistory.conf is effective (measured: after
    #   13 changes the first password is refused again with 24, allowed with the
    #   default).
    # - enforce_for_root is NOT set for pwhistory. The nightly chpasswd for the FTP
    #   account sets the same password every night; with enforce_for_root it fails
    #   with exit 1 (measured), without it it ends in exit 0.
    # - root never locks (even_deny_root is off), and a locked account can still log
    #   in with an SSH key: sshd here is publickey only, so only the account and
    #   session stages run (measured). A successful key login resets the count.
    # - libpam-pwquality is installed WITH its recommends. Without them there is no
    #   dictionary and passwd refuses every new password of an ordinary user, strong
    #   ones included (measured). pam-auth-update turns the package's profile on by
    #   itself at install time, so the install is inside the guarded window.
    # - The scanner account is checked through the PAM service vsftpd with its real
    #   password, right password only: a wrong one would be a failed login and,
    #   with deny 5, would add up to a locked FTP account after a few nights.
    #
    # Dry run: only the read-only part runs; the plan is the report. Nothing is
    # installed, snapshotted or changed.
    #
    # No dollar signs in this file: Flux substitutes them in the ConfigMap.
    - name: PAM | the requested state must be one we know
      ansible.builtin.assert:
        that:
          - cis_pam_state in ['present', 'absent']
          - cis_pam_deny | int in range(3, 11)
          - cis_pam_unlock_time | int >= 900
          - cis_pam_remember | int >= 24
          - cis_pam_guard_seconds | int >= 300
        fail_msg: >-
          cis_pam_state is '{{ cis_pam_state }}' (present or absent expected), or a
          number is out of range: deny 3 to 10, unlock_time at least 900, remember
          at least 24, guard at least 300 seconds. Nothing was changed on the host.

    # In a dry run `copy` writes nothing, so the installed script may not exist yet.
    # The read-only calls therefore run straight from /scripts with the script
    # module, forced to run in check mode too; only what changes the host uses the
    # installed copy (the restore timer needs it there).
    - name: PAM | install the helper script
      ansible.builtin.copy:
        src: /scripts/cis_pam.py
        dest: /usr/local/sbin/cis-pam
        owner: root
        group: root
        mode: "0750"
      diff: false

    - name: PAM | Report the state before (read only)
      ansible.builtin.script:
        cmd: /scripts/cis_pam.py report
      register: cis_pam_before
      changed_when: false
      failed_when: false
      check_mode: false

    - name: PAM | Before
      ansible.builtin.debug:
        msg: "{{ cis_pam_before.stdout_lines }}"

    - name: PAM | does the host match the wanted state?
      ansible.builtin.script:
        cmd: >-
          /scripts/cis_pam.py status
          {{ '--absent' if cis_pam_state == 'absent' else
             '--deny ' ~ cis_pam_deny ~ ' --unlock-time ' ~ cis_pam_unlock_time ~ ' --remember ' ~ cis_pam_remember }}
      register: cis_pam_status
      changed_when: false
      failed_when: cis_pam_status.rc not in [0, 3]
      check_mode: false

    # `dpkg-query -s` prints "Status: install ok installed" for an installed
    # package and exits non-zero for an unknown one; no format string needed.
    - name: PAM | the pwquality package is part of the wanted state
      ansible.builtin.command: dpkg-query -s libpam-pwquality
      register: cis_pam_pkg
      changed_when: false
      failed_when: false
      check_mode: false
      when: cis_pam_state == 'present'

    - name: PAM | what has to be done
      ansible.builtin.set_fact:
        cis_pam_pkg_missing: "{{ cis_pam_state == 'present' and 'install ok installed' not in (cis_pam_pkg.stdout | default('')) }}"
        cis_pam_need: "{{ cis_pam_status.rc == 3 or (cis_pam_state == 'present' and 'install ok installed' not in (cis_pam_pkg.stdout | default(''))) }}"

    - name: PAM | Status
      ansible.builtin.debug:
        msg: "{{ cis_pam_status.stdout_lines + ['package libpam-pwquality missing: ' ~ cis_pam_pkg_missing, 'change needed: ' ~ cis_pam_need] }}"

    # ── the package, first, under the same fail-closed rule as the other installs.
    # apt-get --simulate changes nothing, so it runs in a dry run too and the plan
    # shows up in the dry-run log before anything real happens. The allowed list is
    # what apt chose in a clean Debian 13 container with the recommends (the
    # dictionary comes with them, see the header); anything else new, any installed
    # package that would change and anything removed stops the run.
    # The same recommends switch the install below passes (the apt module adds
    # -o APT::Install-Recommends=yes). Without it a host whose apt config turns
    # recommends off would show four packages here and install six (measured).
    - name: PAM | what apt would do for libpam-pwquality
      ansible.builtin.command: apt-get --simulate -o APT::Install-Recommends=yes install libpam-pwquality
      register: cis_pam_sim
      changed_when: false
      check_mode: false
      when: cis_pam_pkg_missing | bool

    - name: PAM | refuse unless it only adds the expected packages
      ansible.builtin.assert:
        that:
          - "'libpam-pwquality' in cis_pam_new"
          - cis_pam_changed | length == 0
          - cis_pam_gone | length == 0
          - cis_pam_new | difference(cis_pam_pwquality_packages) | length == 0
        fail_msg: >-
          apt's plan for libpam-pwquality is not just the expected new packages.
          New: {{ cis_pam_new | join(', ') | default('(none parsed)', true) }}.
          Unexpected among them: {{ cis_pam_new | difference(cis_pam_pwquality_packages) | join(', ') | default('none', true) }}.
          Would change an installed package: {{ cis_pam_changed | join(', ') | default('none', true) }}.
          Would remove: {{ cis_pam_gone | join(', ') | default('none', true) }}.
          Nothing was installed or changed; decide by hand.
        success_msg: "apt would add only: {{ cis_pam_new | join(', ') }}"
      vars:
        # Same regex lesson as the other installs: single backslashes and
        # [^ ]+, never \\S. "Inst name (" is a new package, "Inst name ["
        # an installed one that would change version.
        cis_pam_new: >-
          {{ cis_pam_sim.stdout | regex_findall('(?m)^Inst ([^ ]+) \(') | unique | list }}
        cis_pam_changed: >-
          {{ cis_pam_sim.stdout | regex_findall('(?m)^Inst ([^ ]+) \[') | unique | list }}
        cis_pam_gone: >-
          {{ cis_pam_sim.stdout | regex_findall('(?m)^(?:Remv|Purg) ([^ ]+)') | unique | list }}
      when: cis_pam_pkg_missing | bool

    # A pending change is not carried out in a dry run: the guard timer, the
    # package install and pam-auth-update cannot be shown in check mode.
    - name: PAM | the change, guarded
      when:
        - cis_pam_need | bool
        - not ansible_check_mode
      block:
        # ── the guard, then everything that touches PAM
        - name: PAM | take the snapshot and start the restore timer
          ansible.builtin.command: /usr/local/sbin/cis-pam arm --seconds {{ cis_pam_guard_seconds }}
          register: cis_pam_arm
          changed_when: true

        - name: PAM | install libpam-pwquality with its recommends
          ansible.builtin.apt:
            name: libpam-pwquality
            state: present
            install_recommends: yes
          when: cis_pam_pkg_missing | bool

        - name: PAM | apply the profiles and settings
          ansible.builtin.command:
            argv:
              - /usr/local/sbin/cis-pam
              - apply
              - --deny
              - "{{ cis_pam_deny }}"
              - --unlock-time
              - "{{ cis_pam_unlock_time }}"
              - --remember
              - "{{ cis_pam_remember }}"
          register: cis_pam_apply
          changed_when: true
          when: cis_pam_state == 'present'

        - name: PAM | take them out again
          ansible.builtin.command: /usr/local/sbin/cis-pam remove
          register: cis_pam_remove
          changed_when: true
          when: cis_pam_state == 'absent'

        - name: PAM | the host must match the wanted state now
          ansible.builtin.command:
            argv: >-
              {{ ['/usr/local/sbin/cis-pam', 'status']
                 + (['--absent'] if cis_pam_state == 'absent' else
                    ['--deny', cis_pam_deny | string, '--unlock-time', cis_pam_unlock_time | string,
                     '--remember', cis_pam_remember | string]) }}
          changed_when: false

        # Fresh processes, ControlPath=none: Ansible's own connection is persistent and
        # would report success even if no new login worked. root has no password
        # here (key only), so what is checked is that a new session opens and that
        # sudo, which goes through common-auth and common-account, still works for
        # the account that runs the play.
        - name: PAM | fresh logins work, as root and as ansible, and sudo still works
          ansible.builtin.command:
            argv:
              - ssh
              - -F
              - /dev/null
              - -i
              - "{{ item.key }}"
              - -o
              - IdentitiesOnly=yes
              - -o
              - BatchMode=yes
              - -o
              - ControlMaster=no
              - -o
              - ControlPath=none
              - -o
              - StrictHostKeyChecking=no
              - -o
              - UserKnownHostsFile=/dev/null
              - -o
              - ConnectTimeout=20
              - -o
              - ConnectionAttempts=1
              - -l
              - "{{ item.user }}"
              - "{{ hostvars[inventory_hostname]['ansible_host'] }}"
              - "{{ item.cmd }}"
          loop:
            - user: root
              key: "{{ hostvars[groups['proxmox_root'][0]]['ansible_ssh_private_key_file'] }}"
              cmd: echo cis-login-ok
            - user: ansible
              key: "{{ hostvars[inventory_hostname]['ansible_ssh_private_key_file'] }}"
              cmd: sudo -n true && echo cis-login-ok
          loop_control:
            label: "{{ item.user }}"
          delegate_to: localhost
          become: false
          register: cis_pam_fresh
          changed_when: false
          failed_when: cis_pam_fresh.rc != 0 or 'cis-login-ok' not in cis_pam_fresh.stdout

        # The FTP account is the one account here with a password that a service
        # uses. Right password only (see above). Skipped without a password.
        # no_log hides the task's arguments, which hold the password. What cis-pam
        # prints holds none (service, user, return codes), so the verdict is shown
        # by a separate task; without it a failure here would be unreadable.
        - name: PAM | authenticate the FTP account (services vsftpd and other)
          ansible.builtin.command: /usr/local/sbin/cis-pam authcheck --service {{ item }} --user scanner
          args:
            stdin: "{{ cis_pam_ftp_password }}"
          no_log: true
          register: cis_pam_auth
          changed_when: false
          failed_when: false
          loop:
            - vsftpd
            - other
          when:
            - cis_pam_state == 'present'
            - cis_pam_ftp_password | length > 0

        # An assert prints the item it failed on, in full, and the item is the whole
        # registered result of the command above, whose module_args hold the
        # password (found by running it: a failure printed the password into the
        # log). So the verdicts are reduced to plain strings and numbers first and
        # the assert never sees anything else.
        - name: PAM | reduce the authentication results to what is safe to print
          ansible.builtin.set_fact:
            cis_pam_auth_safe: >-
              {{ cis_pam_auth.results | default([])
                 | map(attribute='stdout') | map('default', 'no output') | map('trim') | list }}
            cis_pam_auth_bad: >-
              {{ cis_pam_auth.results | default([]) | rejectattr('rc', 'equalto', 0) | list | length }}
          no_log: true
          when:
            - cis_pam_state == 'present'
            - cis_pam_ftp_password | length > 0

        - name: PAM | the FTP account's authentication result
          ansible.builtin.fail:
            msg: >-
              {{ cis_pam_auth_safe | join(' | ') }}. Measured meaning: auth rc=6 is
              a password that was not accepted (wrong or changed), auth rc=7 is a
              locked account (five failed FTP logins, see faillock --user scanner).
              The snapshot is put back.
          when:
            - cis_pam_state == 'present'
            - cis_pam_ftp_password | length > 0
            - cis_pam_auth_bad | int > 0

        - name: PAM | all checks passed, stop the restore timer
          ansible.builtin.command: /usr/local/sbin/cis-pam commit
          changed_when: true
      rescue:
        - name: PAM | put the snapshot back
          ansible.builtin.command: /usr/local/sbin/cis-pam restore
          register: cis_pam_back
          changed_when: true
          failed_when: false
          when: cis_pam_arm is defined

        - name: PAM | stop here
          ansible.builtin.fail:
            msg: >-
              Changing PAM failed (the output above shows at which step: simulation,
              snapshot, install, apply, the final comparison, a fresh login, sudo, or
              the FTP account's authentication). The snapshot was put back
              ({{ (cis_pam_back.stdout | default('no snapshot was taken yet')) | trim }}).
              If even that did not happen, the timer puts it back
              {{ cis_pam_guard_seconds }} seconds after it was armed. Note that a
              package installed by this play stays installed.

    - name: PAM | Report the state afterwards (read only)
      ansible.builtin.script:
        cmd: /scripts/cis_pam.py report
      register: cis_pam_after
      changed_when: false
      failed_when: false
      check_mode: false

    - name: PAM | After
      ansible.builtin.debug:
        msg: "{{ cis_pam_after.stdout_lines }}"

  cis_pam.py: |-
    #!/usr/bin/env python3
    """cis-pam: the PAM changes of CIS wave 3, with a way back.

    PAM is shared by sshd, sudo, su, login, vsftpd and the PVE web login, and a
    broken stack can lock out the very connection that is changing it. So nothing
    here changes PAM unguarded:

      report              read only; names and counts, never a password or a hash
      status [--absent]   read only; exit 0 if the host is as wanted, 3 if not,
                          4 if a precondition is missing
      arm [--seconds N]   take a snapshot and start a systemd timer that restores
                          it after N seconds (default 900); a snapshot left behind
                          by an interrupted run is restored first
      apply               (armed only) write the profiles and settings, run
                          pam-auth-update, check the result; on a bad result the
                          snapshot is restored here and the exit code is 5
      remove              (armed only) take it all out again, back to the packaged
                          unix profile
      commit              stop the timer, delete the snapshot
      restore             put the snapshot back and stop the timer (also what the
                          timer runs)
      authcheck           with the password on stdin: the right password through the
                          PAM service, authentication and account, as a login would
                          (no wrong attempt: it would count against the lockout)

    pam-auth-update's exit code is never trusted: it returns 0 for an unknown
    profile name and, with --remove unix, can leave no unix profile at all, so the
    result is always checked in the generated files (measured in a Debian 13
    container).

    What the profiles do: pam_faillock (CIS 5.3.2.2), pam_pwhistory (5.3.2.4),
    and the packaged unix profile without nullok (5.3.3.4.1, 5.3.3.4.4 is already
    true in it). The numbers (deny, unlock_time, remember) go to faillock.conf and
    pwhistory.conf, not into the PAM lines: the word "remember" must not appear in
    the common-* files at all (5.3.3.4.2 searches them for it). enforce_for_root
    is deliberately not set: the nightly chpasswd for the FTP account sets the
    same password every night, and with it chpasswd fails (measured, exit 1).

    No dollar signs in this file: Flux substitutes them in the ConfigMap.
    """
    import argparse
    import ctypes
    import glob
    import os
    import re
    import shutil
    import subprocess
    import sys

    PAMD = "/etc/pam.d"
    LIBPAM = "/var/lib/pam"
    CONFIGS = "/usr/share/pam-configs"
    SEC = "/etc/security"
    STATE = "/var/lib/cis-pam"
    SNAP = STATE + "/snapshot"
    UNIT = "cis-pam-restore"
    SELF = "/usr/local/sbin/cis-pam"
    COMMON = ["common-auth", "common-account", "common-password", "common-session",
              "common-session-noninteractive"]
    CIS_PROFILES = ["cis-unix", "cis-faillock", "cis-faillock-notify", "cis-pwhistory"]
    CONF_FILES = ["faillock.conf", "pwhistory.conf"]
    BEGIN = "# BEGIN proxmox-ansible CIS wave 3 (managed, do not edit)"
    END = "# END proxmox-ansible CIS wave 3"
    ENV = dict(os.environ, DEBIAN_FRONTEND="noninteractive", LC_ALL="C")

    def out(msg):
        print(msg)
        sys.stdout.flush()

    def run(cmd, stdin=None):
        return subprocess.run(cmd, input=stdin, capture_output=True, text=True, env=ENV)

    def read(path):
        with open(path) as f:
            return f.read()

    def put(path, text, mode=0o644):
        """Write atomically: a half-written PAM file would be worse than either version."""
        tmp = path + ".cis-tmp"
        with open(tmp, "w") as f:
            f.write(text)
        os.chmod(tmp, mode)
        os.replace(tmp, path)

    def put_copy(src, dst):
        tmp = dst + ".cis-tmp"
        shutil.copy2(src, tmp)
        os.replace(tmp, dst)

    def active_lines(path):
        lines = []
        with open(path) as f:
            for line in f:
                s = line.strip()
                if s and not s.startswith("#"):
                    lines.append(s)
        return lines

    def find(lines, *needles):
        for i, line in enumerate(lines):
            if all(n in line for n in needles):
                return i
        return -1

    # ── the wanted state ────────────────────────────────────────────────────────
    def profile_faillock():
        return ("Name: Lock out an account after repeated failed logins (pam_faillock, CIS)\n"
                "Default: yes\n"
                "Priority: 0\n"
                "Auth-Type: Primary\n"
                "Auth:\n"
                "\t[default=die]\tpam_faillock.so authfail\n")

    def profile_faillock_notify():
        return ("Name: Reset the failed login count on success (pam_faillock, CIS)\n"
                "Default: yes\n"
                "Priority: 1024\n"
                "Auth-Type: Primary\n"
                "Auth:\n"
                "\trequisite\tpam_faillock.so preauth\n"
                "Account-Type: Primary\n"
                "Account:\n"
                "\trequired\tpam_faillock.so\n")

    def profile_pwhistory():
        return ("Name: Password history (pam_pwhistory, CIS)\n"
                "Default: yes\n"
                "Priority: 512\n"
                "Password-Type: Primary\n"
                "Password:\n"
                "\trequisite\tpam_pwhistory.so try_first_pass\n")

    def profile_unix():
        """The packaged unix profile without nullok, replacing it. Derived, not copied,
        so that a libpam-runtime upgrade that changes the packaged profile is picked up
        by the next run instead of being silently undone."""
        lines = []
        for line in read(CONFIGS + "/unix").splitlines():
            if line.startswith("Name:"):
                lines.append("Name: Unix authentication (CIS, replaces the packaged unix profile)")
                continue
            lines.append(line.replace(" nullok", ""))
            if line.startswith("Priority:"):
                lines.append("Conflicts: unix")
        text = "\n".join(lines) + "\n"
        if "nullok" in text or "pam_unix.so" not in text or "Conflicts: unix" not in text:
            raise RuntimeError("the packaged unix profile has a shape this script does not know")
        return text

    def wanted_profiles():
        return {"cis-unix": profile_unix(), "cis-faillock": profile_faillock(),
                "cis-faillock-notify": profile_faillock_notify(), "cis-pwhistory": profile_pwhistory()}

    def conf_lines(args):
        return {"faillock.conf": ["deny = %d" % args.deny, "unlock_time = %d" % args.unlock_time],
                "pwhistory.conf": ["remember = %d" % args.remember]}

    def strip_block(text):
        kept, skip = [], False
        for line in text.splitlines():
            if line == BEGIN:
                skip = True
                continue
            if line == END:
                skip = False
                continue
            if not skip:
                kept.append(line)
        return "\n".join(kept).rstrip("\n")

    def with_block(text, lines):
        return strip_block(text) + "\n\n" + BEGIN + "\n" + "\n".join(lines) + "\n" + END + "\n"

    def block_text(lines):
        return BEGIN + "\n" + "\n".join(lines) + "\n" + END + "\n"

    # ── looking at the host ─────────────────────────────────────────────────────
    def debconf_profiles():
        r = run(["debconf-show", "libpam-runtime"])
        m = re.search(r"libpam-runtime/profiles: *(.*)", r.stdout)
        return [p.strip() for p in m.group(1).split(",") if p.strip()] if m else []

    def set_debconf_profiles(profiles):
        return run(["debconf-communicate", "libpam-runtime"],
                   stdin="SET libpam-runtime/profiles " + ", ".join(profiles) + "\n")

    def find_module(name):
        return bool(glob.glob("/usr/lib/*/security/" + name) or glob.glob("/lib/*/security/" + name)
                    or glob.glob("/usr/lib/security/" + name))

    def preconditions(need_self=True):
        errs = []
        for m in ("pam_unix.so", "pam_faillock.so", "pam_pwhistory.so"):
            if not find_module(m):
                errs.append("module %s not found" % m)
        for tool in ("pam-auth-update", "systemd-run", "systemctl", "debconf-show", "debconf-communicate"):
            if not shutil.which(tool):
                errs.append("%s not found" % tool)
        if not os.path.exists(CONFIGS + "/unix"):
            errs.append(CONFIGS + "/unix does not exist")
        for f in COMMON:
            if not os.path.exists(PAMD + "/" + f):
                errs.append("%s/%s does not exist" % (PAMD, f))
        if need_self and not os.path.exists(SELF):
            errs.append(SELF + " is not installed (the timer needs it)")
        return errs

    def verify_common(cis):
        """Problems in the generated files, as a list of strings. Empty means good."""
        probs = []
        try:
            files = {f: active_lines(PAMD + "/" + f) for f in COMMON}
        except OSError as e:
            return ["cannot read the common files: %s" % e]
        for f, lines in files.items():
            if find(lines, "pam_unix.so") < 0:
                probs.append("%s has no pam_unix.so" % f)
        for f in ("common-auth", "common-account", "common-password"):
            for mod in ("pam_deny.so", "pam_permit.so"):
                if find(files[f], mod) < 0:
                    probs.append("%s has no %s" % (f, mod))
        if cis:
            for f, lines in files.items():
                if find(lines, "nullok") >= 0:
                    probs.append("%s still has nullok" % f)
                if find(lines, "remember") >= 0:
                    probs.append("%s has the word remember (5.3.3.4.2 forbids it)" % f)
            a = files["common-auth"]
            pre, unix, fail = find(a, "pam_faillock.so", "preauth"), find(a, "pam_unix.so"), find(a, "pam_faillock.so", "authfail")
            if pre < 0 or fail < 0:
                probs.append("common-auth lacks pam_faillock preauth/authfail")
            elif not pre < unix < fail:
                probs.append("common-auth order is wrong: preauth, pam_unix, authfail expected")
            if find(files["common-account"], "pam_faillock.so") < 0:
                probs.append("common-account has no pam_faillock.so")
            p = files["common-password"]
            hist, punix = find(p, "pam_pwhistory.so"), find(p, "pam_unix.so")
            if hist < 0:
                probs.append("common-password has no pam_pwhistory.so")
            elif hist > punix:
                probs.append("common-password: pam_pwhistory.so must come before pam_unix.so")
            if punix >= 0 and "use_authtok" not in p[punix]:
                probs.append("common-password: pam_unix.so has no use_authtok")
        else:
            for f, lines in files.items():
                for mod in ("pam_faillock.so", "pam_pwhistory.so"):
                    if find(lines, mod) >= 0:
                        probs.append("%s still has %s" % (f, mod))
        return probs

    def status(args):
        diffs = []
        try:
            want = wanted_profiles() if not args.absent else {}
        except (RuntimeError, OSError) as e:
            return ["cannot derive the profiles: %s" % e]
        profiles = debconf_profiles()
        if args.absent:
            for p in CIS_PROFILES:
                if os.path.exists(CONFIGS + "/" + p):
                    diffs.append("profile file %s exists" % p)
                if p in profiles:
                    diffs.append("profile %s is enabled" % p)
            diffs += verify_common(False)
            for f in CONF_FILES:
                if os.path.exists(SEC + "/" + f) and BEGIN in read(SEC + "/" + f):
                    diffs.append("%s has the managed block" % f)
            return diffs
        for name, text in want.items():
            path = CONFIGS + "/" + name
            if not os.path.exists(path):
                diffs.append("profile file %s is missing" % name)
            elif read(path) != text:
                diffs.append("profile file %s differs" % name)
            if name not in profiles:
                diffs.append("profile %s is not enabled" % name)
        if "unix" in profiles:
            diffs.append("the packaged unix profile is still enabled (nullok)")
        diffs += verify_common(True)
        for f, lines in conf_lines(args).items():
            path = SEC + "/" + f
            if not os.path.exists(path) or block_text(lines) not in read(path):
                diffs.append("%s lacks the managed block %s" % (f, lines))
        return diffs

    # ── snapshot, timer, restore ────────────────────────────────────────────────
    def timer_active():
        return run(["systemctl", "is-active", UNIT + ".timer"]).stdout.strip() == "active"

    def disarm():
        run(["systemctl", "stop", UNIT + ".timer"])
        run(["systemctl", "reset-failed", UNIT + ".service"])

    def snapshot():
        shutil.rmtree(SNAP, ignore_errors=True)
        os.makedirs(SNAP + "/pam.d")
        os.makedirs(SNAP + "/lib-pam")
        os.makedirs(SNAP + "/cis-profiles")
        os.makedirs(SNAP + "/security")
        for f in COMMON:
            shutil.copy2(PAMD + "/" + f, SNAP + "/pam.d/" + f)
        for f in os.listdir(LIBPAM):
            shutil.copy2(LIBPAM + "/" + f, SNAP + "/lib-pam/" + f)
        for path in glob.glob(CONFIGS + "/cis-*"):
            shutil.copy2(path, SNAP + "/cis-profiles/" + os.path.basename(path))
        for f in CONF_FILES:
            if os.path.exists(SEC + "/" + f):
                shutil.copy2(SEC + "/" + f, SNAP + "/security/" + f)
        put(SNAP + "/profiles.txt", ", ".join(debconf_profiles()) + "\n")
        os.chmod(STATE, 0o700)

    def do_restore():
        if not os.path.isdir(SNAP):
            out("restore: no snapshot, nothing to put back")
            disarm()
            return 0
        for f in COMMON:
            put_copy(SNAP + "/pam.d/" + f, PAMD + "/" + f)
        kept = set(os.listdir(SNAP + "/lib-pam"))
        for f in os.listdir(LIBPAM):
            if f not in kept:
                os.remove(LIBPAM + "/" + f)
        for f in kept:
            put_copy(SNAP + "/lib-pam/" + f, LIBPAM + "/" + f)
        for path in glob.glob(CONFIGS + "/cis-*"):
            os.remove(path)
        for f in os.listdir(SNAP + "/cis-profiles"):
            put_copy(SNAP + "/cis-profiles/" + f, CONFIGS + "/" + f)
        for f in CONF_FILES:
            if os.path.exists(SNAP + "/security/" + f):
                put_copy(SNAP + "/security/" + f, SEC + "/" + f)
        set_debconf_profiles([p.strip() for p in read(SNAP + "/profiles.txt").split(",") if p.strip()])
        # If the snapshot was taken without the CIS profiles, the restored stack must look like
        # that; if it had them (a re-apply with new numbers), only the files are put back.
        probs = verify_common(False) if not os.listdir(SNAP + "/cis-profiles") else []
        shutil.rmtree(SNAP, ignore_errors=True)
        disarm()
        if probs:
            out("restore: put back, but the result looks odd: " + "; ".join(probs))
            return 1
        out("restore: the snapshot is back, the timer is stopped")
        return 0

    def cmd_status(args):
        # Read only, so it must also work in a dry run, before the script is installed.
        errs = preconditions(need_self=False)
        if errs:
            out("status: precondition missing: " + "; ".join(errs))
            return 4
        diffs = status(args)
        if diffs:
            out("status: differs:")
            for d in diffs:
                out("  - " + d)
            return 3
        out("status: in sync")
        return 0

    def cmd_arm(args):
        errs = preconditions()
        if errs:
            out("arm: precondition missing: " + "; ".join(errs))
            return 4
        if os.path.isdir(SNAP):
            out("arm: a snapshot from an interrupted run exists; restoring it first")
            do_restore()
        os.makedirs(STATE, exist_ok=True)
        snapshot()
        disarm()
        cmd = ["systemd-run", "--unit", UNIT, "--on-active=%ds" % args.seconds,
               "--timer-property=AccuracySec=1s", "--collect", SELF, "restore", "--from-timer"]
        r = run(cmd)
        if r.returncode != 0 or not timer_active():
            shutil.rmtree(SNAP, ignore_errors=True)
            out("arm: the timer did not start: " + (r.stderr or r.stdout).strip()[-200:])
            return 4
        out("armed: snapshot taken, restore in %d seconds unless committed" % args.seconds)
        return 0

    def armed():
        return os.path.isdir(SNAP) and timer_active()

    def cmd_apply(args):
        if not armed():
            out("apply: refused, not armed (no snapshot and timer)")
            return 6
        try:
            for name, text in wanted_profiles().items():
                put(CONFIGS + "/" + name, text)
            for f, lines in conf_lines(args).items():
                path = SEC + "/" + f
                put(path, with_block(read(path) if os.path.exists(path) else "", lines))
        except (RuntimeError, OSError) as e:
            out("apply: failed before pam-auth-update: %s; restoring" % e)
            do_restore()
            return 5
        r = run(["pam-auth-update", "--remove", "unix", "--enable"] + CIS_PROFILES)
        probs = verify_common(True)
        profiles = debconf_profiles()
        for p in CIS_PROFILES:
            if p not in profiles:
                probs.append("profile %s is not enabled afterwards" % p)
        if "unix" in profiles:
            probs.append("the packaged unix profile is still enabled")
        if probs:
            out("apply: the result is not right, restoring: " + "; ".join(probs))
            out("apply: pam-auth-update said rc=%d: %s" % (r.returncode, (r.stdout + r.stderr).strip()[-300:]))
            do_restore()
            return 5
        out("applied: profiles " + ", ".join(profiles))
        return 0

    def cmd_remove(args):
        if not armed():
            out("remove: refused, not armed (no snapshot and timer)")
            return 6
        for p in CIS_PROFILES:
            path = CONFIGS + "/" + p
            if os.path.exists(path):
                os.remove(path)
        for f in CONF_FILES:
            path = SEC + "/" + f
            if os.path.exists(path) and BEGIN in read(path):
                text = strip_block(read(path))
                put(path, text + "\n" if text else "")
        r = run(["pam-auth-update", "--enable", "unix", "--remove"] + CIS_PROFILES)
        probs = verify_common(False)
        profiles = debconf_profiles()
        if "unix" not in profiles:
            probs.append("the unix profile is not enabled afterwards")
        if probs:
            out("remove: the result is not right, restoring: " + "; ".join(probs))
            out("remove: pam-auth-update said rc=%d: %s" % (r.returncode, (r.stdout + r.stderr).strip()[-300:]))
            do_restore()
            return 5
        out("removed: profiles " + ", ".join(profiles))
        return 0

    def cmd_report(args):
        """Read only. Names and counts, never a password or a hash."""
        out("== profiles enabled")
        out("  " + ", ".join(debconf_profiles()))
        for f in ("common-auth", "common-account", "common-password"):
            out("== active lines, " + f)
            try:
                for line in active_lines(PAMD + "/" + f):
                    out("  " + line)
            except OSError as e:
                out("  cannot read: %s" % e)
        out("== settings (active lines)")
        for f in CONF_FILES:
            path = SEC + "/" + f
            lines = active_lines(path) if os.path.exists(path) else ["(absent)"]
            out("  %s: %s" % (f, "; ".join(lines) if lines else "(no active lines)"))
        r = run(["dpkg-query", "-s", "libpam-pwquality"])
        out("== libpam-pwquality")
        if r.returncode == 0:
            keep = [l for l in r.stdout.splitlines() if l.startswith(("Status:", "Version:"))]
            out("  " + "; ".join(keep))
        else:
            out("  not installed")
        names, empty = [], []
        try:
            with open("/etc/shadow") as f:
                for line in f:
                    parts = line.rstrip("\n").split(":")
                    if len(parts) > 1:
                        if parts[1] == "":
                            empty.append(parts[0])
                        elif parts[1][0] not in "!*":
                            names.append(parts[0])
        except OSError as e:
            out("  cannot read /etc/shadow: %s" % e)
        out("== accounts with a usable password (names only): " + (", ".join(names) or "(none)"))
        out("== accounts with an EMPTY password field (nullok let them in): " + (", ".join(empty) or "(none)"))
        r = run(["faillock"])
        out("== failed-login records")
        for line in ((r.stdout or r.stderr).strip().splitlines() or ["(none)"])[:10]:
            out("  " + line)
        out("== restore timer: " + ("active" if timer_active() else "inactive")
            + "; snapshot: " + ("present" if os.path.isdir(SNAP) else "none"))
        return 0

    def cmd_commit(args):
        disarm()
        shutil.rmtree(SNAP, ignore_errors=True)
        out("committed: timer stopped, snapshot deleted")
        return 0

    def cmd_restore(args):
        return do_restore()

    # ── a login the way a service does it ───────────────────────────────────────
    class _Msg(ctypes.Structure):
        _fields_ = [("msg_style", ctypes.c_int), ("msg", ctypes.c_char_p)]

    class _Resp(ctypes.Structure):
        _fields_ = [("resp", ctypes.c_void_p), ("resp_retcode", ctypes.c_int)]

    _CONV = ctypes.CFUNCTYPE(ctypes.c_int, ctypes.c_int, ctypes.POINTER(ctypes.POINTER(_Msg)),
                             ctypes.POINTER(ctypes.POINTER(_Resp)), ctypes.c_void_p)

    class _Conv(ctypes.Structure):
        _fields_ = [("conv", _CONV), ("appdata_ptr", ctypes.c_void_p)]

    def pam_try(service, user, password, account):
        libpam = ctypes.CDLL("libpam.so.0")
        libc = ctypes.CDLL("libc.so.6")
        libc.calloc.restype = ctypes.c_void_p
        libc.calloc.argtypes = [ctypes.c_size_t, ctypes.c_size_t]
        libc.strdup.restype = ctypes.c_void_p
        libc.strdup.argtypes = [ctypes.c_char_p]

        def conv_fn(n, msgs, resp, _data):
            arr = libc.calloc(n, ctypes.sizeof(_Resp))
            res = ctypes.cast(arr, ctypes.POINTER(_Resp))
            for i in range(n):
                if msgs[i].contents.msg_style in (1, 2):
                    res[i].resp = libc.strdup(password.encode())
            resp[0] = res
            return 0

        conv = _Conv(_CONV(conv_fn), None)
        handle = ctypes.c_void_p()
        if libpam.pam_start(service.encode(), user.encode(), ctypes.byref(conv), ctypes.byref(handle)) != 0:
            return -1, None
        rc = libpam.pam_authenticate(handle, 0)
        rc2 = libpam.pam_acct_mgmt(handle, 0) if (rc == 0 and account) else None
        libpam.pam_end(handle, rc)
        return rc, rc2

    def cmd_authcheck(args):
        password = sys.stdin.read().rstrip("\n")
        if not password:
            out("authcheck: no password on stdin")
            return 7
        # Only the RIGHT password. A wrong one would count as a failed login and, with
        # deny = 5, a few nights of it would lock the account (measured: a wrong
        # attempt is recorded by pam_faillock at once). That a wrong password fails
        # was measured in a container, it is not worth a failure record here.
        right, acct = pam_try(args.service, args.user, password, True)
        out("authcheck: %s as %s: right password -> auth rc=%s, account rc=%s (0 and 0 expected)"
            % (args.service, args.user, right, acct))
        return 0 if (right == 0 and acct == 0) else 7

    def main():
        ap = argparse.ArgumentParser(description=__doc__.split("\n")[0])
        sub = ap.add_subparsers(dest="cmd", required=True)
        for name, fn in (("status", cmd_status), ("arm", cmd_arm), ("apply", cmd_apply), ("remove", cmd_remove),
                         ("commit", cmd_commit), ("restore", cmd_restore), ("authcheck", cmd_authcheck),
                         ("report", cmd_report)):
            p = sub.add_parser(name)
            p.set_defaults(fn=fn)
            if name in ("status", "apply"):
                p.add_argument("--deny", type=int, default=5)
                p.add_argument("--unlock-time", type=int, default=900)
                p.add_argument("--remember", type=int, default=24)
            if name == "status":
                p.add_argument("--absent", action="store_true")
            if name == "arm":
                p.add_argument("--seconds", type=int, default=900)
            if name == "restore":
                p.add_argument("--from-timer", action="store_true")
            if name == "authcheck":
                p.add_argument("--service", default="vsftpd")
                p.add_argument("--user", required=True)
        args = ap.parse_args()
        if os.geteuid() != 0:
            out("must run as root")
            return 4
        return args.fn(args)

    if __name__ == "__main__":
        sys.exit(main())

  cis_rpc_lockdown.yml: |-
    ---
    # RPC/NFS and SPICE proxy ports reachable from the internal networks only,
    # or, with cis_rpc_lockdown_state: absent in cis.yml, taken out again. The
    # two states are separate task files so that each stays flat and readable.
    - name: RPC lockdown | the requested state must be one we know
      ansible.builtin.assert:
        that:
          - cis_rpc_lockdown_state in ['present', 'absent']
        fail_msg: >-
          cis_rpc_lockdown_state is '{{ cis_rpc_lockdown_state }}', expected
          present or absent. Nothing was changed on the host.

    - name: RPC lockdown | install and load it
      ansible.builtin.include_tasks: cis_rpc_lockdown_present.yml
      when: cis_rpc_lockdown_state == 'present'

    - name: RPC lockdown | take it out again
      ansible.builtin.include_tasks: cis_rpc_lockdown_absent.yml
      when: cis_rpc_lockdown_state == 'absent'

  cis_rpc_lockdown_present.yml: |-
    ---
    # RPC/NFS and SPICE proxy ports reachable from the internal networks only.
    #
    # The work is done by /usr/local/sbin/cis-rpc-lockdown (cis_rpc_lockdown.py
    # in this ConfigMap), which keeps one iptables and one ip6tables chain and a
    # jump to it from INPUT. This file only installs it, feeds it its
    # configuration, and makes sure it is loaded at boot and now. What the
    # script does and refuses is documented in its own header.
    #
    # Dry run: the script and the unit show what would be written. The apply
    # step is skipped in check mode, because it would change the live packet
    # filter.
    #
    # The allowed networks are kept out of the Job log, which Fluent Bit ships
    # to Loki: the configuration task has `diff: false` (its diff would print
    # the file), the script's `status` is called with --summary (it would list
    # the rules), and `apply` only prints per-family verdicts. They can still
    # appear when something fails (a refusal names them, and ansible prints a
    # failed task's output in full), which is when they are needed.
    - name: RPC lockdown | the networks must have come through
      ansible.builtin.assert:
        that:
          - cis_rpc_lockdown_allow4 | length > 0
        fail_msg: >-
          RPC_ALLOWED_NETS is empty. It is filled from the key
          SECRET_RPC_ALLOWED_NETS in cluster-secrets (cronjob.yaml). Flux
          substitutes it into the CronJob, so this means the Secret did not
          have the key when the CronJob was last reconciled: reconcile the
          Secret first, then the proxmox-ansible Kustomization. Nothing was
          changed on the host.

    #
    # Off switch, from Git: cis_rpc_lockdown_state: absent in cis.yml (see
    # cis_rpc_lockdown_absent.yml). On the host as root, for an emergency that
    # cannot wait for a merge:
    #   systemctl stop cis-rpc-lockdown        (removes the rules again)
    #   /usr/local/sbin/cis-rpc-lockdown remove
    # The next playbook run puts them back unless the state is absent.
    - name: RPC lockdown | install the script
      ansible.builtin.copy:
        src: /scripts/cis_rpc_lockdown.py
        dest: /usr/local/sbin/cis-rpc-lockdown
        owner: root
        group: root
        mode: "0750"

    - name: RPC lockdown | write the configuration
      ansible.builtin.copy:
        dest: /etc/cis-rpc-lockdown.json
        owner: root
        group: root
        mode: "0600"
        content: "{{ {'ports': cis_rpc_lockdown_ports, 'allow4': cis_rpc_lockdown_allow4, 'allow6': cis_rpc_lockdown_allow6} | to_nice_json }}\n"
      diff: false

    # The checking apply comes BEFORE the unit, and that order matters. Starting
    # the unit runs `apply --skip-checks`, so if the unit came first it would
    # load the rules without the pre-flight checks (a peer outside the allowed
    # networks that is connected right now would simply be cut off), and this
    # apply would then find nothing to change and never look. Found by running
    # the play against a systemd container with a stranger connected; the
    # first version had the unit first and reported success.
    #
    # It also means a refusal leaves no unit behind: the script and the
    # configuration are on the host, nothing is loaded, nothing is enabled.
    - name: RPC lockdown | apply
      ansible.builtin.command: /usr/local/sbin/cis-rpc-lockdown apply
      register: cis_rpc_apply
      changed_when: "'result: changed' in cis_rpc_apply.stdout"
      when: not ansible_check_mode

    # Exits non-zero if the chain or a jump is missing or differs, which fails
    # the play: a lockdown that silently is not there is worse than a red Job.
    - name: RPC lockdown | verify what is loaded
      ansible.builtin.command: /usr/local/sbin/cis-rpc-lockdown status --verify --summary
      register: cis_rpc_status
      changed_when: false
      when: not ansible_check_mode

    # Deliberately no Before=network-pre.target: ordering a firewall unit ahead
    # of the network targets on a hypervisor risks a dependency cycle, and
    # systemd resolves a cycle by dropping a job, which could be
    # networking.service. The rules load a few seconds after boot instead; over
    # IPv4 the DNAT and the INPUT drops in /etc/network/interfaces already
    # cover that window.
    - name: RPC lockdown | install the systemd unit
      ansible.builtin.copy:
        dest: /etc/systemd/system/cis-rpc-lockdown.service
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Description=RPC/NFS and SPICE proxy ports reachable from the internal networks only
          After=local-fs.target

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          # --skip-checks: the pre-flight checks (the host's own LAN is inside
          # the allowed networks; nobody outside them is connected right now)
          # guard a change made at deploy time, which the apply task above has
          # already done. At boot the interfaces come up in no fixed order and
          # nothing is connected yet, so a check that sees only part of the
          # picture could refuse to load the rules at all.
          ExecStart=/usr/local/sbin/cis-rpc-lockdown apply --skip-checks
          ExecStop=/usr/local/sbin/cis-rpc-lockdown remove

          [Install]
          WantedBy=multi-user.target
      when: cis_rpc_lockdown_manage_unit | bool

    # The rules are already loaded, so starting the unit changes nothing now;
    # what this adds is the load at the next boot.
    - name: RPC lockdown | enable and start the unit
      ansible.builtin.systemd:
        name: cis-rpc-lockdown.service
        enabled: yes
        state: started
        daemon_reload: yes
      when:
        - cis_rpc_lockdown_manage_unit | bool
        - not ansible_check_mode

    - name: RPC lockdown | state
      ansible.builtin.debug:
        msg: "{{ cis_rpc_apply.stdout_lines + cis_rpc_status.stdout_lines }}"
      when: not ansible_check_mode

  cis_rpc_lockdown_absent.yml: |-
    ---
    # The lockdown taken out again: rules, boot unit, script and configuration.
    # Selected with cis_rpc_lockdown_state: absent in cis.yml, i.e. from Git.
    #
    # Needs neither RPC_ALLOWED_NETS nor a working configuration file: the
    # point of this path is that it still works when something is wrong.
    #
    # Taking the lockdown out OPENS the ports again to whatever the rest of
    # INPUT lets through. There is no pre-flight check for that, on purpose:
    # asking for absent is the decision.
    #
    # Idempotent: on a host where nothing is installed every task that acts is
    # skipped, so the nightly run reports no change.
    #
    # If the script is gone but the rules are still loaded (deleted by hand),
    # there is nothing left to take them out with. The play then FAILS at the
    # confirm step, before it deletes anything, instead of reporting an absent
    # that is not one. Recover by setting the state back to present for one
    # run (that installs the script again), then absent; or by hand, for each
    # of iptables and ip6tables: delete the INPUT rules that jump to
    # CIS-RPC-LOCKDOWN, then -F and -X that chain.
    #
    # Dry run: the stats and the file removals run and show what would go; the
    # tasks that touch the live packet filter and systemd are skipped.
    - name: RPC lockdown (absent) | is the script installed
      ansible.builtin.stat:
        path: /usr/local/sbin/cis-rpc-lockdown
      register: cis_rpc_script

    - name: RPC lockdown (absent) | is the unit installed
      ansible.builtin.stat:
        path: /etc/systemd/system/cis-rpc-lockdown.service
      register: cis_rpc_unit

    # The rules first, with the script that loaded them.
    - name: RPC lockdown (absent) | take the rules out
      ansible.builtin.command: /usr/local/sbin/cis-rpc-lockdown remove
      register: cis_rpc_removed
      changed_when: "'result: changed' in cis_rpc_removed.stdout"
      when:
        - cis_rpc_script.stat.exists
        - not ansible_check_mode

    # Then the unit, so that nothing loads them again at boot. Its ExecStop runs
    # `remove` once more, which is a no-op by now.
    - name: RPC lockdown (absent) | stop and disable the unit
      ansible.builtin.systemd:
        name: cis-rpc-lockdown.service
        state: stopped
        enabled: no
      when:
        - cis_rpc_unit.stat.exists
        - not ansible_check_mode

    # Asked of iptables and ip6tables directly, not of the script, so that it
    # also works when the script is missing. A chain cannot be deleted while a
    # rule still jumps to it, so no chain means no jump either. `iptables -S
    # <chain>` exits non-zero when the chain does not exist; exit 0 means it is
    # still there, which fails the play: an absent that silently is not absent
    # is worse than a red Job. This runs BEFORE the files are deleted, so a
    # failure leaves the script in place for the next attempt.
    - name: RPC lockdown (absent) | confirm the chain is gone
      ansible.builtin.command: "{{ item }} -w 10 -S CIS-RPC-LOCKDOWN"
      loop:
        - iptables
        - ip6tables
      register: cis_rpc_chain
      changed_when: false
      failed_when: cis_rpc_chain.rc == 0
      when: not ansible_check_mode

    - name: RPC lockdown (absent) | delete the unit, the configuration and the script
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /etc/systemd/system/cis-rpc-lockdown.service
        - /etc/cis-rpc-lockdown.json
        - /usr/local/sbin/cis-rpc-lockdown

    - name: RPC lockdown (absent) | systemd forgets the unit
      ansible.builtin.systemd:
        daemon_reload: yes
      when:
        - cis_rpc_unit.stat.exists
        - not ansible_check_mode

    - name: RPC lockdown (absent) | state
      ansible.builtin.debug:
        msg: "{{ ['state: absent'] + (cis_rpc_removed.stdout_lines | default([])) }}"

  cis_rpc_lockdown.py: |-
    #!/usr/bin/env python3
    """Keep the RPC/NFS ports reachable from the internal networks only.

    Managed by Ansible (proxmox-ansible, cis.yml). Do not edit by hand.

    What it does
        Per address family (iptables and ip6tables) it maintains one user chain,
        CIS-RPC-LOCKDOWN, and one jump to it from INPUT for TCP and one for UDP
        on the configured ports. Inside the chain, loopback and the allowed
        source networks RETURN to INPUT and everything else is dropped.

    What it will not do
        It only ever narrows what INPUT lets through. It never ACCEPTs, never
        edits any other rule, and refuses the management ports 22 and 8006,
        public source networks, and an allow list that would cut the host's own
        LAN. Forwarded traffic (the DNAT to the firewall VM, VM to VM) does not
        pass through INPUT and is not touched.

    Subcommands
        apply    create or repair the rules; prints "result: changed" or
                 "result: unchanged". When that would change something it
                 first refuses if none of the host's own private addresses is
                 inside an allowed network, or if a peer outside the allowed
                 networks is connected to one of the ports right now. An apply
                 that changes nothing never refuses. --skip-checks omits both
                 checks (the boot unit does).
        remove   take the rules out again (the emergency off switch); works
                 even when the configuration is broken or gone
        status   show what is loaded; with --verify exit 1 if it differs from
                 the configuration; --summary leaves the rule lines out (the
                 playbook uses it, so the networks stay out of the Job log)
        plan     print what apply would load, touching nothing

    Exit status: 0 ok, 1 a command failed or verification found a difference,
    2 the configuration or the host was refused.
    """
    import argparse
    import ipaddress
    import json
    import os
    import shutil
    import subprocess
    import sys

    CONFIG = "/etc/cis-rpc-lockdown.json"
    CHAIN = "CIS-RPC-LOCKDOWN"
    NEVER_PORTS = (22, 8006)
    WAIT = ["-w", "10"]

    class Refused(Exception):
        """The configuration or the host is not something to act on."""

    class Failed(Exception):
        """A command that should have worked did not."""

    def run(cmd, data=None):
        return subprocess.run(cmd, input=data, capture_output=True, text=True, check=False)

    def load_config(path):
        try:
            with open(path) as handle:
                raw = json.load(handle)
        except (OSError, ValueError) as exc:
            raise Refused("cannot read %s: %s" % (path, exc))

        try:
            ports = sorted(set(int(p) for p in raw["ports"]))
        except (KeyError, TypeError, ValueError):
            raise Refused("'ports' must be a list of port numbers")
        if not ports:
            raise Refused("no ports configured")
        for port in ports:
            if not 1 <= port <= 65535:
                raise Refused("port out of range: %d" % port)
            if port in NEVER_PORTS:
                raise Refused("port %d is a management port, refusing" % port)

        allow = {4: [], 6: []}
        for key, version in (("allow4", 4), ("allow6", 6)):
            for text in raw.get(key, []):
                try:
                    net = ipaddress.ip_network(text, strict=True)
                except ValueError as exc:
                    raise Refused("%s: %s" % (text, exc))
                if net.version != version:
                    raise Refused("%s is not an IPv%d network" % (text, version))
                if not net.is_private:
                    raise Refused("%s is not a private network, refusing" % text)
                allow[version].append(net)
        if not allow[4]:
            raise Refused("allow4 is empty: that would cut every internal client")
        return ports, allow

    def check_local_coverage(allow4):
        """Refuse if none of the host's own private addresses is inside an allowed
        network, which would mean the allow list names the wrong LAN."""
        if shutil.which("ip") is None:
            return
        res = run(["ip", "-4", "-o", "addr", "show"])
        if res.returncode != 0:
            return
        local = []
        for line in res.stdout.splitlines():
            parts = line.split()
            if "inet" in parts:
                addr = ipaddress.ip_interface(parts[parts.index("inet") + 1]).ip
                if addr.is_private and not addr.is_loopback:
                    local.append(addr)
        if local and not any(addr in net for addr in local for net in allow4):
            raise Refused(
                "none of this host's private addresses (%s) is inside the allowed "
                "networks (%s)" % (", ".join(str(a) for a in local), ", ".join(str(n) for n in allow4))
            )

    def check_established(ports, allow):
        """Refuse if a peer outside the allowed networks is connected to one of the
        ports right now. The allow list can be well-formed and still miss a real
        client; this is the one check that looks at who actually uses the ports.
        Only TCP shows who is connected (UDP here has no connection state).
        Addresses appear only in the refusal, which is when they are needed."""
        if shutil.which("ss") is None:
            return
        wanted = set(ports)
        strangers = {}
        for version, nets in ((4, allow[4]), (6, allow[6])):
            res = run(["ss", "-H", "-n", "-t", "state", "established", "-%d" % version])
            if res.returncode != 0:
                continue
            for line in res.stdout.splitlines():
                parts = line.split()
                if len(parts) < 2:
                    continue
                local, peer = parts[-2], parts[-1]
                try:
                    local_port = int(local.rsplit(":", 1)[1])
                    peer_ip = ipaddress.ip_address(peer.rsplit(":", 1)[0].strip("[]"))
                except (IndexError, ValueError):
                    continue
                if local_port not in wanted:
                    continue
                # An IPv4 client of a dual-stack socket shows up as ::ffff:a.b.c.d
                if peer_ip.version == 6 and peer_ip.ipv4_mapped is not None:
                    peer_ip = peer_ip.ipv4_mapped
                if peer_ip.is_loopback:
                    continue
                family_nets = allow[peer_ip.version]
                if not any(peer_ip in net for net in family_nets):
                    strangers.setdefault(str(peer_ip), set()).add(local_port)
        if strangers:
            raise Refused(
                "connected right now from outside the allowed networks: %s. Loading "
                "the rules would cut them. Add their network to the allow list, or "
                "stop the client first."
                % "; ".join("%s -> port %s" % (ip, ",".join(str(p) for p in sorted(ps))) for ip, ps in sorted(strangers.items()))
            )

    class Family:
        def __init__(self, version, tool, restore, allow):
            self.version = version
            self.tool = tool
            self.restore = restore
            self.allow = allow
            self.label = "ipv%d" % version

        def ipt(self, *args):
            return run([self.tool] + WAIT + list(args))

        def usable(self):
            """(True, "") when this family can be managed, (False, reason) when it
            does not exist on this host. Anything else is a failure."""
            if shutil.which(self.tool) is None:
                return False, "%s is not installed" % self.tool
            res = self.ipt("-S", "INPUT")
            if res.returncode == 0:
                return True, ""
            err = res.stderr.strip()
            if "family not supported" in err.lower():
                return False, err
            raise Failed("%s -S INPUT failed: %s" % (self.tool, err))

        def chain_rules(self):
            """The chain's rules as iptables -S prints them, None if it is absent."""
            res = self.ipt("-S", CHAIN)
            if res.returncode != 0:
                return None
            return [line for line in res.stdout.splitlines() if line.startswith("-A ")]

        def want_chain(self):
            rules = ["-A %s -i lo -j RETURN" % CHAIN]
            for net in self.allow:
                rules.append("-A %s -s %s -j RETURN" % (CHAIN, net))
            rules.append("-A %s -j DROP" % CHAIN)
            return rules

        def want_jumps(self, ports):
            plist = ",".join(str(p) for p in ports)
            return [
                "-A INPUT -p %s -m multiport --dports %s -j %s" % (proto, plist, CHAIN)
                for proto in ("tcp", "udp")
            ]

        def have_jumps(self):
            res = self.ipt("-S", "INPUT")
            if res.returncode != 0:
                raise Failed("%s -S INPUT failed: %s" % (self.tool, res.stderr.strip()))
            return [line for line in res.stdout.splitlines() if line.endswith("-j " + CHAIN)]

        def delete_jump(self, line):
            res = self.ipt("-D", "INPUT", *line.split()[2:])
            if res.returncode != 0:
                raise Failed("%s -D INPUT failed: %s" % (self.tool, res.stderr.strip()))

        def apply(self, ports):
            changed = False
            want = self.want_chain()
            if self.chain_rules() != want:
                if self.chain_rules() is None:
                    res = self.ipt("-N", CHAIN)
                    if res.returncode != 0:
                        raise Failed("%s -N %s failed: %s" % (self.tool, CHAIN, res.stderr.strip()))
                # One transaction: the chain is never half-written. An empty or
                # missing chain just returns to INPUT, so a re-load fails open
                # for an instant rather than closed.
                payload = "*filter\n-F %s\n%s\nCOMMIT\n" % (CHAIN, "\n".join(want))
                res = run([self.restore, "--noflush"], payload)
                if res.returncode != 0:
                    raise Failed("%s failed: %s" % (self.restore, res.stderr.strip()))
                changed = True

            # Jumps last, so they never point at an unpopulated chain. New ones
            # go in BEFORE stale ones come out: when the port list changes there
            # is a moment with both, which is harmless (both lead to the same
            # chain), instead of a moment with neither.
            want_jumps = self.want_jumps(ports)
            have_jumps = self.have_jumps()
            for line in want_jumps:
                if line not in have_jumps:
                    res = self.ipt("-I", "INPUT", "1", *line.split()[2:])
                    if res.returncode != 0:
                        raise Failed("%s -I INPUT failed: %s" % (self.tool, res.stderr.strip()))
                    changed = True
            for line in have_jumps:
                if line not in want_jumps:
                    self.delete_jump(line)
                    changed = True
            return changed

        def remove(self):
            changed = False
            for line in self.have_jumps():
                self.delete_jump(line)
                changed = True
            if self.chain_rules() is not None:
                self.ipt("-F", CHAIN)
                res = self.ipt("-X", CHAIN)
                if res.returncode != 0:
                    raise Failed("%s -X %s failed: %s" % (self.tool, CHAIN, res.stderr.strip()))
                changed = True
            return changed

        def problems(self, ports):
            found = []
            have = self.chain_rules()
            if have is None:
                found.append("chain %s is missing" % CHAIN)
            elif have != self.want_chain():
                found.append("chain %s differs from the configuration" % CHAIN)
            want_jumps = self.want_jumps(ports)
            have_jumps = self.have_jumps()
            for line in want_jumps:
                if line not in have_jumps:
                    found.append("INPUT jump missing: %s" % line)
            for line in have_jumps:
                if line not in want_jumps:
                    found.append("INPUT jump not in the configuration: %s" % line)
            return found

        def show(self, ports):
            print("== %s (%s)" % (self.label, self.tool))
            have = self.chain_rules()
            print("chain %s:" % CHAIN)
            for line in have if have is not None else ["(absent)"]:
                print("  " + line)
            print("INPUT jumps:")
            for line in self.have_jumps() or ["(none)"]:
                print("  " + line)

    def families(allow):
        return [
            Family(4, "iptables", "iptables-restore", allow[4]),
            Family(6, "ip6tables", "ip6tables-restore", allow[6]),
        ]

    def command_plan(ports, allow):
        for fam in families(allow):
            print("== %s: iptables-restore --noflush would load" % fam.label)
            print("*filter\n-F %s\n%s\nCOMMIT" % (CHAIN, "\n".join(fam.want_chain())))
            print("and make sure INPUT holds, at position 1:")
            for line in fam.want_jumps(ports):
                print("  " + line)
        return 0

    def command_apply(ports, allow, skip_checks):
        fams = families(allow)
        # The pre-flight checks guard a change. A run that would change nothing
        # (the nightly one, once the rules are loaded) must not start failing
        # because some old connection happens to exist, so they only run when
        # something differs.
        if not skip_checks:
            differs = False
            for fam in fams:
                ok, _why = fam.usable()
                if ok and fam.problems(ports):
                    differs = True
            if differs:
                check_local_coverage(allow[4])
                check_established(ports, allow)
        changed = False
        failed = False
        for fam in fams:
            try:
                ok, why = fam.usable()
                if not ok:
                    print("%s: skipped (%s)" % (fam.label, why))
                    continue
                did = fam.apply(ports)
                changed = changed or did
                print("%s: %s" % (fam.label, "changed" if did else "unchanged"))
            except Failed as exc:
                failed = True
                print("%s: FAILED: %s" % (fam.label, exc), file=sys.stderr)
        print("result: %s" % ("changed" if changed else "unchanged"))
        return 1 if failed else 0

    def command_remove():
        failed = False
        changed = False
        for fam in families({4: [], 6: []}):
            try:
                ok, why = fam.usable()
                if not ok:
                    print("%s: skipped (%s)" % (fam.label, why))
                    continue
                did = fam.remove()
                changed = changed or did
                print("%s: %s" % (fam.label, "removed" if did else "nothing to remove"))
            except Failed as exc:
                failed = True
                print("%s: FAILED: %s" % (fam.label, exc), file=sys.stderr)
        print("result: %s" % ("changed" if changed else "unchanged"))
        return 1 if failed else 0

    def command_status(ports, allow, verify, summary):
        bad = False
        for fam in families(allow):
            ok, why = fam.usable()
            if not ok:
                print("== %s: skipped (%s)" % (fam.label, why))
                continue
            if not summary:
                fam.show(ports)
            if verify:
                for problem in fam.problems(ports):
                    bad = True
                    print("PROBLEM (%s): %s" % (fam.label, problem), file=sys.stderr)
        if verify:
            print("verify: %s" % ("DIFFERS" if bad else "ok"))
        return 1 if bad else 0

    def main(argv=None):
        parser = argparse.ArgumentParser(description=__doc__.split("\n")[0])
        parser.add_argument("--config", default=CONFIG)
        sub = parser.add_subparsers(dest="command", required=True)
        apply = sub.add_parser("apply")
        apply.add_argument("--skip-checks", action="store_true")
        sub.add_parser("remove")
        status = sub.add_parser("status")
        status.add_argument("--verify", action="store_true")
        status.add_argument("--summary", action="store_true")
        sub.add_parser("plan")
        args = parser.parse_args(argv)

        try:
            # remove must work even when the configuration is broken or gone.
            if args.command == "remove":
                if os.geteuid() != 0:
                    raise Refused("needs root")
                return command_remove()
            ports, allow = load_config(args.config)
            if args.command == "plan":
                return command_plan(ports, allow)
            if os.geteuid() != 0:
                raise Refused("needs root")
            if args.command == "apply":
                return command_apply(ports, allow, args.skip_checks)
            return command_status(ports, allow, args.verify, args.summary)
        except Refused as exc:
            print("refused: %s" % exc, file=sys.stderr)
            return 2
        except Failed as exc:
            print("failed: %s" % exc, file=sys.stderr)
            return 1

    if __name__ == "__main__":
        sys.exit(main())
