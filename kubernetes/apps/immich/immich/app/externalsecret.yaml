---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: immich-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DB_USERNAME: "{{ .IMMICH_POSTGRESQL_USERNAME }}"
        DB_PASSWORD: "{{ .IMMICH_POSTGRESQL_PASSWORD }}"
        JWT_SECRET: "{{ .IMMICH_JWT_SECRET }}"
        # Uses the shared Dragonfly instance's own current password
        # (DRAGONFLY_PASSWORD, item "dragonfly"), not the "immich" item's own
        # IMMICH_REDIS_PASSWORD field — every other Dragonfly consumer in this
        # cluster (whiteboard, open-webui, paperless-ngx) authenticates the
        # same way, and a separately-stored copy could drift stale if
        # Dragonfly's password is ever rotated.
        REDIS_PASSWORD: "{{ .DRAGONFLY_PASSWORD }}"
        # Mounted as a file (persistence type: secret, not configMap) at
        # IMMICH_CONFIG_FILE — this embeds the real OAuth client secret, so it
        # must not sit in a plain ConfigMap the way some community examples do.
        immich.json: |
          {
            "ffmpeg": {
              "crf": 23,
              "threads": 0,
              "preset": "ultrafast",
              "targetVideoCodec": "h264",
              "acceptedVideoCodecs": ["h264"],
              "targetAudioCodec": "aac",
              "acceptedAudioCodecs": ["aac", "mp3", "opus", "pcm_s16le"],
              "acceptedContainers": ["mov", "ogg", "webm"],
              "targetResolution": "720",
              "maxBitrate": "0",
              "bframes": -1,
              "refs": 0,
              "gopSize": 0,
              "temporalAQ": false,
              "cqMode": "auto",
              "twoPass": false,
              "preferredHwDevice": "auto",
              "transcode": "required",
              "tonemap": "hable",
              "accel": "disabled",
              "accelDecode": false
            },
            "backup": {
              "database": {
                "enabled": true,
                "cronExpression": "0 02 * * *",
                "keepLastAmount": 14
              }
            },
            "job": {
              "backgroundTask": { "concurrency": 5 },
              "smartSearch": { "concurrency": 2 },
              "metadataExtraction": { "concurrency": 5 },
              "faceDetection": { "concurrency": 2 },
              "search": { "concurrency": 5 },
              "sidecar": { "concurrency": 5 },
              "library": { "concurrency": 5 },
              "migration": { "concurrency": 5 },
              "thumbnailGeneration": { "concurrency": 3 },
              "videoConversion": { "concurrency": 1 },
              "notifications": { "concurrency": 5 }
            },
            "logging": {
              "enabled": true,
              "level": "log"
            },
            "machineLearning": {
              "enabled": true,
              "urls": ["http://immich-immich-machine-learning.immich.svc.cluster.local:3003"],
              "clip": {
                "enabled": true,
                "modelName": "ViT-B-32__openai"
              },
              "duplicateDetection": {
                "enabled": true,
                "maxDistance": 0.01
              },
              "facialRecognition": {
                "enabled": true,
                "modelName": "buffalo_l",
                "minScore": 0.7,
                "maxDistance": 0.5,
                "minFaces": 3
              }
            },
            "map": {
              "enabled": true,
              "lightStyle": "https://tiles.immich.cloud/v1/style/light.json",
              "darkStyle": "https://tiles.immich.cloud/v1/style/dark.json"
            },
            "reverseGeocoding": {
              "enabled": true
            },
            "metadata": {
              "faces": { "import": true }
            },
            "oauth": {
              "autoLaunch": true,
              "autoRegister": true,
              "buttonText": "Login with Authentik",
              "clientId": "{{ .IMMICH_OPENID_CLIENT_ID }}",
              "clientSecret": "{{ .IMMICH_OPENID_CLIENT_SECRET }}",
              "defaultStorageQuota": 0,
              "enabled": true,
              "issuerUrl": "https://id.${SECRET_DOMAIN}/application/o/immich/",
              "mobileOverrideEnabled": false,
              "mobileRedirectUri": "",
              "scope": "openid email profile",
              "signingAlgorithm": "RS256",
              "profileSigningAlgorithm": "none",
              "storageLabelClaim": "preferred_username",
              "storageQuotaClaim": "quota"
            },
            "passwordLogin": {
              "enabled": false
            },
            "storageTemplate": {
              "enabled": false,
              "hashVerificationEnabled": true
            },
            "image": {
              "thumbnail": { "format": "webp", "size": 250, "quality": 80 },
              "preview": { "format": "jpeg", "size": 1440, "quality": 80 },
              "colorspace": "p3",
              "extractEmbedded": false
            },
            "newVersionCheck": { "enabled": true },
            "trash": { "enabled": true, "days": 30 },
            "theme": { "customCss": "" },
            "library": {
              "scan": { "enabled": true, "cronExpression": "0 0 * * *" },
              "watch": { "enabled": false }
            },
            "server": {
              "externalDomain": "https://media.${SECRET_DOMAIN}",
              "loginPageMessage": ""
            },
            "notifications": {
              "smtp": {
                "enabled": true,
                "from": "immich@${SECRET_DOMAIN}",
                "replyTo": "",
                "transport": {
                  "ignoreCert": true,
                  "host": "${SECRET_MAIL_SERVER}",
                  "port": 25,
                  "username": "",
                  "password": ""
                }
              }
            },
            "user": {
              "deleteDelay": 7
            }
          }
  dataFrom:
    - extract:
        key: immich
    - extract:
        key: dragonfly
