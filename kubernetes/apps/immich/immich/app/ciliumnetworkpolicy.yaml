---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: immich
  namespace: immich
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: immich
  ingress:
    # Envoy proxy (network ns)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP
    # Gatus health check
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": monitoring
            app.kubernetes.io/name: gatus
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP
    # The immich_photos Open WebUI Tool (kubernetes/apps/open-webui/
    # open-webui/app/tools/immich_photos.py) and its byte-identical mirror
    # running as the immich-mcp MCP server for hermes-agent
    # (kubernetes/apps/hermes-agent/immich-mcp/). Both authenticate with an
    # Immich API key (x-api-key); this is network scoping on top, not the
    # only gate.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": open-webui
            app.kubernetes.io/name: open-webui
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": hermes-agent
            app.kubernetes.io/name: immich-mcp
      toPorts:
        - ports:
            - port: "2283"
              protocol: TCP
    # Same namespace (immich-server <-> immich-machine-learning)
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": immich
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # PostgreSQL (dedicated immich-postgres cluster) + Redis/Dragonfly
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": database
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "6379"
              protocol: TCP
    # Authentik OIDC via id.${SECRET_DOMAIN} (envoy-internal, DNAT :10443)
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": network
            app.kubernetes.io/name: envoy
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    # Same namespace
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": immich
    # External: map tiles (tiles.immich.cloud), reverse geocoding data,
    # release/version checks
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # SMTP notifications via the in-cluster Mailu instance
    # (kubernetes/apps/mail/mailu/, submission port). CoreDNS resolves
    # mail.${SECRET_DOMAIN} to mailu-front's ClusterIP for in-cluster
    # clients, which is a real cluster-internal identity, not `world` --
    # needs its own rule despite the toEntities:world rule above.
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": mail
            app.kubernetes.io/name: mailu
            app.kubernetes.io/component: front
      toPorts:
        - ports:
            - port: "587"
              protocol: TCP
