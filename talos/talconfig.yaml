---
clusterName: kubernetes

talosVersion: "${talosVersion}"
kubernetesVersion: "${kubernetesVersion}"

endpoint: https://192.168.10.100:6443
additionalApiServerCertSans: &sans
  - "127.0.0.1"
  - "192.168.10.100"
  - "k8s.cisotop.de"
additionalMachineCertSans: *sans

clusterPodNets:
  - "10.42.0.0/16"
clusterSvcNets:
  - "10.43.0.0/16"

# Disable built-in CNI to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: "k8s-cp-0"
    ipAddress: "192.168.10.10"
    # Per-node service-log tag (CIS 6.2.1) — Talos doesn't ship a hostname in
    # the log payload, so tag each node's service logs for per-node dashboards.
    patches:
      - |-
        machine:
          logging:
            destinations:
              - endpoint: tcp://192.168.10.110:5170
                format: json_lines
                extraTags:
                  node: k8s-cp-0
    installDisk: "/dev/sda"
    machineSpec:
      secureboot: false
    talosImageURL: factory.talos.dev/installer/88d1f7a5c4f1d3aba7df787c448c1d3d008ed29cfb34af53fa0df4336a56040b
    controlPlane: true
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:bf:b4:39"
        dhcp: false
        addresses:
          - "192.168.10.10/24"
        routes:
          - gateway: "192.168.10.1"
            network: 0.0.0.0/0
        mtu: 1500
        vip:
          ip: "192.168.10.100"
