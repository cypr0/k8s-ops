cluster:
  allowSchedulingOnControlPlanes: true
  apiServer:
    admissionControl:
      # PodSecurity: enforce stays "privileged" (no blocking) — Kyverno owns
      # actual pod-security enforcement. audit/warn run at "restricted" for
      # free, non-blocking visibility (audit log + kubectl warnings) until
      # Kyverno policies are proven out. See kubernetes/apps/security/kyverno.
      - name: PodSecurity
        configuration:
          apiVersion: pod-security.admission.config.k8s.io/v1alpha1
          kind: PodSecurityConfiguration
          defaults:
            enforce: privileged
            enforce-version: latest
            audit: restricted
            audit-version: latest
            warn: restricted
            warn-version: latest
          exemptions:
            usernames: []
            runtimeClasses: []
            # kube-system is added by Talos automatically — listing it here
            # too causes a duplicate entry in the rendered config.
            namespaces:
              - falco
              - kubescape
              - monitoring
              - logging
    extraArgs:
      # https://kubernetes.io/docs/tasks/extend-kubernetes/configure-aggregation-layer/
      enable-aggregator-routing: true
      # CIS 3.1.1: OIDC via Authentik, additive to the existing client-cert
      # admin auth (Talos' generated admin kubeconfig keeps working as a
      # break-glass fallback — this does not replace or disable it).
      # See kubernetes/apps/security/authentik/app/blueprints/08-kubernetes-oidc.yaml
      oidc-issuer-url: https://id.cisotop.de/application/o/kubernetes/
      oidc-client-id: kubernetes
      oidc-username-claim: preferred_username
      oidc-username-prefix: "oidc:"
      oidc-groups-claim: groups
      oidc-groups-prefix: "oidc:"
  controllerManager:
    extraArgs:
      bind-address: 0.0.0.0
  coreDNS:
    disabled: true
  etcd:
    extraArgs:
      listen-metrics-urls: http://0.0.0.0:2381
    advertisedSubnets:
      - 192.168.10.0/24
  proxy:
    disabled: true
  scheduler:
    extraArgs:
      bind-address: 0.0.0.0
