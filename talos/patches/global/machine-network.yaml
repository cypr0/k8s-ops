---
machine:
  network:
    # CIS Talos 5.4.1: encrypt all inter-node traffic (WireGuard mesh).
    # DISABLED 2026-07-04: broke Cilium L2 announcement. The new `kubespan`
    # interface confused Cilium's auto device-detection for L2-announced
    # LoadBalancer IPs (envoy-internal/external became unreachable — most
    # cilium_l2_responder_v4 BPF map entries went inactive since the
    # responder tried to answer on both ens18 and kubespan). Re-enable only
    # after pinning Cilium's `devices` to ens18 explicitly.
    kubespan:
      enabled: false
---
# Talos v1.14 auto-generates a default ResolverConfig document for every
# node, which conflicts with the legacy `.machine.network.nameservers`/
# `disableSearchDomain` fields (talhelper genconfig: "... is already set in
# v1alpha1 config"). Moved to the dedicated multi-doc config kind instead.
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 1.1.1.1
  - address: 1.0.0.1
searchDomains:
  disableDefault: true
