---
name: "VectorChord Extension Rebuild"

on:
  workflow_dispatch:
  schedule:
    # Weekly - this image only needs to track upstream VectorChord releases,
    # which land far less often than a daily check would ever catch early.
    - cron: "0 7 * * 1"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  rebuild:
    name: Check & Rebuild vchord Extension Image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job needs to push a branch and open a PR - deliberate, not an oversight.
          persist-credentials: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for a newer upstream release and rebuild if found
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/vchord_extension_rebuild.py
